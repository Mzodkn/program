  hub:["All Subjects","كل المواد"], home:["Subject Home","الصفحة الرئيسية للمادة"], lecture:["Lecture","المحاضرة"],

  take:["Key Takeaways","أهم النقاط"], quiz:["Self-Assessment Quiz","اختبار ذاتي"], flash:["Lecture Flashcards","بطاقات مراجعة المحاضرة"],
  exam:["Final Exam","الاختبار النهائي"], next:["Next","التالي"], prev:["Previous","السابق"],
  correct:["Correct! ✔","إجابة صحيحة! ✔"], wrong:["Incorrect ✘ - the correct answer is highlighted","إجابة خاطئة ✘ - الإجابة الصحيحة موضحة"],
  score:["Your score","نتيجتك"], retry:["Try again","أعد المحاولة"], search:["Search a term...","ابحث عن مصطلح..."],
  flip:["Tap the card to flip","اضغط على البطاقة لقلبها"], shuffle:["Shuffle","خلط"], start:["Start Exam","ابدأ الاختبار"],
  mastery:["Mastery","مستوى الإتقان"], best:["Best","الأفضل"], plan:["How to study","كيف تقري"],
  finish:["Finish","إنهاء"], reset:["Reset progress of this subject","إعادة ضبط تقدم هذه المادة"], read:["Read","تمت القراءة"],
  soon:["Coming soon","قريبًا"], open:["Open","فتح"], subjects:["Subjects","المواد"], tools:["Study Tools","أدوات المراجعة"],
  lectures:["Lectures","المحاضرات"], mistakes:["Questions you missed","الأسئلة التي أخطأت فيها"], yourAns:["Correct answer","الإجابة الصحيحة"],
  glossFlash:["Term Flashcards","بطاقات المصطلحات"], glossList:["All Terms","كل المصطلحات"], questions:["questions","سؤالًا"],
  question:["Question","السؤال"],
  chooseSize:["Choose the number of questions","اختر عدد الأسئلة"], all:["All","الكل"], answerEN:["English","English"],
  masteryHow:["Mastery = average of your best score in each lecture quiz and your best final exam score. Reading lectures does not raise it.","الإتقان = متوسط أفضل نتيجة لك في اختبار كل محاضرة وأفضل نتيجة في الاختبار النهائي. قراءة المحاضرات وحدها لا ترفعه."]
};
const LECTURES = [];

LECTURES.push({ id:'l1', n:1,
  title:["Propositional Logic","المنطق القضوي (Propositional Logic)"],
  obj:[
    ["Define a proposition and distinguish it from a propositional function.","تعريف القضية (Proposition) والتمييز بينها وبين الدالة القضوية (Propositional Function)."],
    ["Identify the six logical connectives and their symbols.","التعرف على الروابط المنطقية الستة (Logical Connectives) ورموزها."],
    ["Apply operator precedence to read and write compound propositions.","تطبيق أسبقية العمليات (Precedence) لقراءة وكتابة القضايا المركبة."],
    ["Translate English sentences into propositional logic statements.","ترجمة الجمل الإنجليزية إلى عبارات في منطق القضايا."],
    ["Use the laws of logical equivalence to prove that two statements are equivalent.","استخدام قوانين التكافؤ المنطقي (Equivalence Laws) لإثبات تكافؤ عبارتين."]
  ],
  sec:[
   {t:["Propositions and Propositional Functions","القضايا (Propositions) والدوال القضوية"], b:[
     {k:'def', x:["A proposition is a declarative statement that is either true (T) or false (F), but not both.","القضية (Proposition) هي جملة خبرية إما أن تكون صحيحة (T) أو خاطئة (F)، وليس كلاهما معًا."]},
     {k:'def', x:["A propositional function (open sentence) is a statement involving one or more variables, e.g. 'y > 5'. Its truth value depends on the value given to the variable.","الدالة القضوية (Propositional Function) أو الجملة المفتوحة (Open Sentence) هي جملة تحتوي على متغير واحد أو أكثر، مثل 'y > 5'. تعتمد قيمتها الصدقية (Truth Value) على القيمة المُعطاة للمتغير."]},
     {k:'tip', x:["A sentence is only a proposition if it has one fixed truth value. 'y > 5' is NOT a proposition by itself since its truth depends on y — it only becomes a proposition once y is given a specific value (e.g. y = 10 makes it a true proposition).","الجملة تكون قضية فقط إذا كانت لها قيمة صدقية واحدة ثابتة. فالجملة 'y > 5' ليست قضية بحد ذاتها لأن صدقها يعتمد على y — وتصبح قضية فقط بعد إعطاء y قيمة محددة (مثلًا y = 10 تجعلها قضية صحيحة)."]}
   ]},
   {t:["Logical Operators (Connectives)","الروابط المنطقية (Logical Connectives)"], b:[
     {k:'p', x:["Propositions can be combined using logical operators, also called connectives, to form compound propositions.","يمكن دمج القضايا باستخدام العمليات المنطقية، وتسمى أيضًا الروابط المنطقية (Connectives)، لتكوين قضايا مركبة."]},
     {k:'tbl', h:[["Operator","العملية"],["Symbol","الرمز"]],
      r:[
       [["Negation (NOT)","النفي (Negation)"],["¬","¬"]],
       [["Conjunction (AND)","الاقتران (Conjunction)"],["∧","∧"]],
       [["Disjunction (OR)","الفصل (Disjunction)"],["∨","∨"]],
       [["Exclusive-or (XOR)","أو الحصرية (Exclusive-or)"],["⊕","⊕"]],
       [["Implication (if-then)","الاستلزام (Implication)"],["→","→"]],
       [["Biconditional (if and only if)","الشرط الثنائي (Biconditional)"],["↔","↔"]]
      ]},
     {k:'tip', x:["Memory trick: ∧ looks like the 'A' in AND; ∨ looks like a cup that 'collects' either option, for OR.","حيلة للحفظ: ∧ يشبه حرف الـ A في AND (و)؛ ∨ يشبه كأسًا 'يجمع' أحد الخيارين، لعملية OR (أو)."]}
   ]},
   {t:["Operator Precedence","أسبقية العمليات (Precedence)"], b:[
     {k:'p', x:["When a compound proposition has no parentheses, precedence rules decide which operator applies first.","عندما لا تحتوي القضية المركبة على أقواس، تحدد قواعد الأسبقية أي عملية تُطبَّق أولًا."]},
     {k:'ul', h:["Precedence, from highest to lowest priority","الأسبقية، من الأعلى إلى الأدنى"], x:[
       ["1. Parentheses () (Highest Priority)","1. الأقواس () (الأعلى أولوية)"],
       ["2. ¬ (Negation)","2. ¬ (النفي)"],
       ["3. ∧ (Conjunction)","3. ∧ (الاقتران)"],
       ["4. ∨ (Disjunction)","4. ∨ (الفصل)"],
       ["5. → (Implication)","5. → (الاستلزام)"],
       ["6. ↔ (Biconditional) (Lowest Priority)","6. ↔ (الشرط الثنائي) (الأدنى أولوية)"]]},
     {k:'ex', x:["¬P ∨ Q ∧ R is read as (¬P) ∨ (Q ∧ R), because ¬ binds tighter than ∧, and ∧ binds tighter than ∨.","تُقرأ ¬P ∨ Q ∧ R كـ (¬P) ∨ (Q ∧ R)، لأن ¬ أقوى ارتباطًا من ∧، و∧ أقوى ارتباطًا من ∨."]}
   ]},
   {t:["Translating English to Logic","ترجمة الإنجليزية إلى منطق"], b:[
     {k:'p', x:["To translate a sentence, first assign a letter to each simple statement, then combine them with connectives that match the sentence's structure.","لترجمة الجملة، نُعطي أولًا رمزًا لكل عبارة بسيطة، ثم نربطها بروابط منطقية تطابق تركيب الجملة."]},
     {k:'ex', x:["\"School is closed if more than 2 feet of snow falls or if the wind chill is below -100.\"\nP: School is closed\nQ: 2 feet of snow falls\nR: wind chill is below -100\nTranslation: (Q ∨ R) → P","\"تُغلق المدرسة إذا تساقط أكثر من 2 قدم من الثلج أو إذا كانت درجة برودة الرياح أقل من -100.\"\nP: المدرسة مغلقة\nQ: تساقط أكثر من 2 قدم من الثلج\nR: درجة برودة الرياح أقل من -100\nالترجمة: (Q ∨ R) → P"]},
     {k:'tip', x:["In translations, the word 'if' usually introduces the condition (antecedent) of an implication, even when it appears mid-sentence: '[School closed] if [snow falls]' means [snow falls] → [school closed], not the other way around.","في الترجمة، كلمة 'إذا' (if) غالبًا ما تُقدّم الشرط (المقدّم) في عبارة الاستلزام، حتى لو جاءت في وسط الجملة: '[إغلاق المدرسة] إذا [تساقط الثلج]' تعني [تساقط الثلج] → [إغلاق المدرسة]، وليس العكس."]}
   ]},
   {t:["Equivalence Laws","قوانين التكافؤ (Equivalence Laws)"], b:[
     {k:'def', x:["Two propositional statements S1 and S2 are logically equivalent (S1 ≡ S2) if they have the same truth table.","تكون عبارتان منطقيتان S1 وS2 متكافئتين منطقيًا (S1 ≡ S2) إذا كان لهما جدول الصدق (Truth Table) نفسه."]},
     {k:'tbl', h:[["Law","القانون"],["Statement","العبارة"]],
      r:[
       [["Identity laws","قوانين المحايد (Identity)"],["P ∧ T ≡ P","P ∧ T ≡ P"]],
       [["Domination laws","قوانين السيطرة (Domination)"],["P ∧ F ≡ F","P ∧ F ≡ F"]],
       [["Idempotent laws","قوانين اللا-قوة (Idempotent)"],["P ∧ P ≡ P","P ∧ P ≡ P"]],
       [["Double negation law","قانون النفي المزدوج (Double Negation)"],["¬(¬P) ≡ P","¬(¬P) ≡ P"]],
       [["Commutative laws","قوانين الإبدال (Commutative)"],["P ∧ Q ≡ Q ∧ P","P ∧ Q ≡ Q ∧ P"]],
       [["Associative laws","قوانين الدمج (Associative)"],["P ∧ (Q ∧ R) ≡ (P ∧ Q) ∧ R","P ∧ (Q ∧ R) ≡ (P ∧ Q) ∧ R"]],
       [["Distributive laws","قوانين التوزيع (Distributive)"],["P ∧ (Q ∨ R) ≡ (P ∧ Q) ∨ (P ∧ R)","P ∧ (Q ∨ R) ≡ (P ∧ Q) ∨ (P ∧ R)"]],
       [["De Morgan's laws","قوانين دي مورجان (De Morgan's)"],["¬(P ∧ Q) ≡ (¬P) ∨ (¬Q)","¬(P ∧ Q) ≡ (¬P) ∨ (¬Q)"]],
       [["Law with implication","قانون الاستلزام (Implication Law)"],["P → Q ≡ ¬P ∨ Q","P → Q ≡ ¬P ∨ Q"]]
      ]},
     {k:'tip', x:["Each law above is stated using ∧; the matching version with ∨ in place of ∧ (and vice versa) also holds. For example, the Commutative law also gives P ∨ Q ≡ Q ∨ P.","كل قانون أعلاه مكتوب باستخدام ∧؛ وتصح أيضًا النسخة المقابلة باستبدال ∧ بـ ∨ (والعكس). فمثلًا، قانون الإبدال يُعطي أيضًا P ∨ Q ≡ Q ∨ P."]}
   ]},
   {t:["Proof Example: Using the Equivalence Laws","مثال إثبات: باستخدام قوانين التكافؤ"], b:[
     {k:'p', x:["We can use the equivalence laws to prove two statements are logically equivalent, without building a full truth table.","يمكن استخدام قوانين التكافؤ لإثبات تكافؤ عبارتين منطقيًا، دون بناء جدول صدق كامل."]},
     {k:'p', x:["Show that (P → Q) ∧ (P → R) ≡ P → (Q ∧ R).","أثبت أن (P → Q) ∧ (P → R) ≡ P → (Q ∧ R)."]},
     {k:'formula', x:"(P → Q) ∧ (P → R)\n≡ (¬P ∨ Q) ∧ (¬P ∨ R)     [Implication law]\n≡ ¬P ∨ (Q ∧ R)            [Distributive law]\n≡ P → (Q ∧ R)             [Implication law]"},
     {k:'p', x:["The implication law is applied twice (once to rewrite each side) and the distributive law is applied once, in the middle step.","يُطبَّق قانون الاستلزام مرتين (مرة لإعادة كتابة كل طرف) ويُطبَّق قانون التوزيع مرة واحدة في الخطوة الوسطى."]}
   ]}
  ],
  take:[
   ["A proposition has one fixed truth value (T or F); a propositional function's truth value depends on its variable(s).","القضية لها قيمة صدقية ثابتة (T أو F)؛ بينما قيمة الدالة القضوية تعتمد على متغيراتها."],
   ["Operator precedence (highest to lowest): () , ¬, ∧, ∨, →, ↔.","أسبقية العمليات (من الأعلى إلى الأدنى): () ، ¬، ∧، ∨، →، ↔."],
   ["P → Q is logically equivalent to ¬P ∨ Q — this is the key law used in most equivalence proofs.","P → Q تكافئ منطقيًا ¬P ∨ Q — وهذا هو القانون الأساسي المستخدم في معظم إثباتات التكافؤ."],
   ["Two statements are logically equivalent if they share the same truth table; this can be proven using the equivalence laws instead of a full truth table.","تكون العبارتان متكافئتين منطقيًا إذا تشاركتا جدول الصدق نفسه؛ ويمكن إثبات ذلك باستخدام قوانين التكافؤ بدلًا من جدول صدق كامل."]
  ],
  fc:[
   [["What is a proposition?","ما هي القضية (Proposition)؟"],["A declarative statement that is either true or false, but not both.","جملة خبرية إما صحيحة أو خاطئة، وليس كلاهما."]],
   [["What is a propositional function (open sentence)? Give the lecture's example.","ما هي الدالة القضوية (الجملة المفتوحة)؟ اذكر مثال المحاضرة."],["A statement involving one or more variables whose truth value depends on the variable, e.g. 'y > 5'.","جملة تحتوي على متغير أو أكثر وتعتمد قيمتها الصدقية على المتغير، مثل 'y > 5'."]],
   [["Give the symbols for negation, conjunction, and disjunction.","اذكر رموز النفي والاقتران والفصل."],["Negation: ¬. Conjunction: ∧. Disjunction: ∨.","النفي: ¬. الاقتران: ∧. الفصل: ∨."]],
   [["Give the symbols for exclusive-or, implication, and biconditional.","اذكر رموز أو الحصرية والاستلزام والشرط الثنائي."],["Exclusive-or: ⊕. Implication: →. Biconditional: ↔.","أو الحصرية: ⊕. الاستلزام: →. الشرط الثنائي: ↔."]],
   [["List the operator precedence from highest to lowest.","اذكر ترتيب أسبقية العمليات من الأعلى إلى الأدنى."],["(), ¬, ∧, ∨, →, ↔.","()، ¬، ∧، ∨، →، ↔."]],
   [["In the snow-day example, what do P, Q and R stand for?","في مثال يوم الثلج، ماذا يمثل P وQ وR؟"],["P: school is closed. Q: more than 2 feet of snow falls. R: wind chill is below -100.","P: المدرسة مغلقة. Q: تساقط أكثر من 2 قدم ثلج. R: برودة الرياح أقل من -100."]],
   [["What is the correct translation of the snow-day sentence?","ما هي الترجمة الصحيحة لجملة يوم الثلج؟"],["(Q ∨ R) → P.","(Q ∨ R) → P."]],
   [["State the Identity law and the Domination law (for ∧).","اذكر قانون المحايد وقانون السيطرة (لـ ∧)."],["Identity: P ∧ T ≡ P. Domination: P ∧ F ≡ F.","المحايد: P ∧ T ≡ P. السيطرة: P ∧ F ≡ F."]],
   [["State De Morgan's law for ∧.","اذكر قانون دي مورجان لـ ∧."],["¬(P ∧ Q) ≡ (¬P) ∨ (¬Q).","¬(P ∧ Q) ≡ (¬P) ∨ (¬Q)."]],
   [["State the law with implication.","اذكر قانون الاستلزام."],["P → Q ≡ ¬P ∨ Q.","P → Q ≡ ¬P ∨ Q."]],
   [["State the Distributive law for ∧ over ∨.","اذكر قانون التوزيع لـ ∧ على ∨."],["P ∧ (Q ∨ R) ≡ (P ∧ Q) ∨ (P ∧ R).","P ∧ (Q ∨ R) ≡ (P ∧ Q) ∨ (P ∧ R)."]],
   [["In the proof of (P→Q)∧(P→R) ≡ P→(Q∧R), which law is used in the first step?","في إثبات (P→Q)∧(P→R) ≡ P→(Q∧R)، أي قانون يُستخدم في الخطوة الأولى؟"],["The implication law, applied to both conjuncts: P→Q ≡ ¬P∨Q and P→R ≡ ¬P∨R.","قانون الاستلزام، يُطبَّق على كلا الطرفين: P→Q ≡ ¬P∨Q وP→R ≡ ¬P∨R."]],
   [["In that same proof, which law turns (¬P∨Q)∧(¬P∨R) into ¬P∨(Q∧R)?","في الإثبات نفسه، أي قانون يحوّل (¬P∨Q)∧(¬P∨R) إلى ¬P∨(Q∧R)؟"],["The distributive law.","قانون التوزيع."]]
  ],
  quiz:[
   {q:["Which of the following is a proposition?","أي مما يلي قضية (Proposition)؟"], o:[["\"Khartoum is the capital of Sudan.\"","\"الخرطوم عاصمة السودان.\""],["\"Close the door.\"","\"أغلق الباب.\""],["\"Is it raining?\"","\"هل تمطر؟\""],["\"x + 1 = 5\" (with x unspecified)","\"x + 1 = 5\" (دون تحديد x)"]], a:0},

LECTURES.push({ id:'l3', n:3,
  title:["Set Theory","نظرية المجموعات (Set Theory)"],
  obj:[
    ["Recall basic set notation: membership, subset, and equality.","تذكّر الترميز الأساسي للمجموعات: العضوية والمجموعة الجزئية والتساوي."],
    ["State the formal definition of a subset using a quantified implication.","صياغة التعريف الرسمي للمجموعة الجزئية باستخدام عبارة استلزام مُحدَّدة كميًا."],
    ["Apply the rules for set equality and subset transitivity.","تطبيق قواعد تساوي المجموعات وتعدّي العلاقة الجزئية (Transitivity)."],
    ["Compute the Cartesian product of two sets, including A × B and B × A.","حساب الضرب الديكارتي (Cartesian Product) لمجموعتين، بما في ذلك A × B وَB × A."]
  ],
  sec:[
   {t:["Sets: Basic Notation","المجموعات: الترميز الأساسي"], b:[
     {k:'p', x:["A set is an unordered collection of distinct objects, called its elements or members. We write x ∈ A to say x is an element of A, and x ∉ A to say it is not.","المجموعة (Set) هي تجميع غير مرتب لعناصر مميزة، تُسمى عناصرها أو أعضاءها. نكتب x ∈ A للدلالة على أن x عنصر في A، وَx ∉ A للدلالة على أنه ليس كذلك."]},
     {k:'tip', x:["This basic notation (∈, ∉) is standard background used throughout the subset definition and the Cartesian product below.","هذا الترميز الأساسي (∈, ∉) خلفية قياسية تُستخدم طوال تعريف المجموعة الجزئية والضرب الديكارتي أدناه."]}
   ]},
   {t:["Subsets","المجموعات الجزئية (Subsets)"], b:[
     {k:'def', x:["A ⊆ B means 'A is a subset of B', defined formally as: A ⊆ B ⇔ ∀x (x ∈ A → x ∈ B).","A ⊆ B تعني 'A مجموعة جزئية من B'، وتُعرَّف رسميًا بـ: A ⊆ B ⇔ ∀x (x ∈ A → x ∈ B)."]},
     {k:'p', x:["In words: A is a subset of B if and only if every element of A is also an element of B.","بالكلمات: A مجموعة جزئية من B إذا وفقط إذا كان كل عنصر في A هو أيضًا عنصر في B."]},
     {k:'cards', c:[
       {t:["Set equality","تساوي المجموعات"], l:[["A = B ⇔ (A ⊆ B) ∧ (B ⊆ A)","A = B ⇔ (A ⊆ B) ∧ (B ⊆ A)"]]},
       {t:["Transitivity of ⊆","تعدّي العلاقة ⊆"], l:[["(A ⊆ B) ∧ (B ⊆ C) ⇒ A ⊆ C","(A ⊆ B) ∧ (B ⊆ C) ⇒ A ⊆ C"]]}
     ]},
     {k:'tip', x:["To prove A = B, you must prove BOTH directions: A ⊆ B and B ⊆ A — this is the standard 'double subset' proof technique.","لإثبات A = B، يجب إثبات الاتجاهين كليهما: A ⊆ B وَB ⊆ A — وهذه هي تقنية الإثبات القياسية 'المجموعة الجزئية المزدوجة'."]}
   ]},
   {t:["Cartesian Product","الضرب الديكارتي (Cartesian Product)"], b:[
     {k:'def', x:["The Cartesian product A × B is the set of all ordered pairs (a, b) where a ∈ A and b ∈ B.","الضرب الديكارتي A × B هو مجموعة كل الأزواج المرتبة (a, b) بحيث a ∈ A وَb ∈ B."]},
     {k:'ex', x:["Let A = {good, bad}, B = {student, prof}.\nA × B = {(good, student), (good, prof), (bad, student), (bad, prof)}\nB × A = {(student, good), (student, bad), (prof, good), (prof, bad)}","لتكن A = {good, bad}, B = {student, prof}.\nA × B = {(good, student), (good, prof), (bad, student), (bad, prof)}\nB × A = {(student, good), (student, bad), (prof, good), (prof, bad)}"]},
     {k:'tip', x:["A × B has |A| × |B| ordered pairs. Here |A| = 2 and |B| = 2, so both A × B and B × A have 2 × 2 = 4 pairs — but notice A × B ≠ B × A, since the order inside each pair matters.","يحتوي A × B على |A| × |B| زوجًا مرتبًا. هنا |A| = 2 وَ|B| = 2، لذا يحتوي كل من A × B وَB × A على 2 × 2 = 4 أزواج — لكن لاحظ أن A × B ≠ B × A، لأن الترتيب داخل كل زوج يهم."]}
   ]}

  take:[

LECTURES.push({ id:'l5', n:5,
  title:["Boolean Algebra","الجبر البولياني (Boolean Algebra)"],
  obj:[
    ["Define a Boolean algebra in terms of its set, operations, and special elements.","تعريف الجبر البولياني من حيث مجموعته وعملياته وعناصره الخاصة."],
    ["List the five defining axioms of a Boolean algebra and state each in both its ∨ and ∧ forms.","سرد البديهيات الخمس المُعرِّفة للجبر البولياني وصياغة كل منها بصورتيها ∨ وَ∧."],
    ["Recognize that the complement operation is unary while ∨ and ∧ are binary.","إدراك أن عملية المتمم أحادية بينما ∨ وَ∧ ثنائيتان."]
  ],
  sec:[
   {t:["Definition of a Boolean Algebra","تعريف الجبر البولياني"], b:[
     {k:'p', x:["Boolean algebra provides operations and rules for working with the set {0, 1}.","يوفر الجبر البولياني عمليات وقواعد للتعامل مع المجموعة {0, 1}."]},
     {k:'def', x:["A Boolean algebra is a set B with two binary operations ∨ and ∧, elements 0 and 1, and a unary operation ' - ' (complement), satisfying the axioms below.","الجبر البولياني هو مجموعة B مع عمليتين ثنائيتين ∨ وَ∧، وعنصرين 0 وَ1، وعملية أحادية ' - ' (المتمم)، تحقق البديهيات أدناه."]},
     {k:'tip', x:["'Binary operation' means it takes two inputs (like x ∨ y); 'unary operation' means it takes only one input (like -x, the complement of x).","'العملية الثنائية' تعني أنها تأخذ مُدخلين (مثل x ∨ y)؛ 'العملية الأحادية' تعني أنها تأخذ مُدخلًا واحدًا فقط (مثل -x، متمم x)."]}
   ]},

      r:[
       [["Identity","المحايد"],["x ∨ 0 = x","x ∨ 0 = x"],["x ∧ 1 = x","x ∧ 1 = x"]],
       [["Complement","المتمم"],["x ∨ (-x) = 1","x ∨ (-x) = 1"],["x ∧ (-x) = 0","x ∧ (-x) = 0"]],
       [["Associative","الدمج"],["(x ∨ y) ∨ z = x ∨ (y ∨ z)","(x ∨ y) ∨ z = x ∨ (y ∨ z)"],["(x ∧ y) ∧ z = x ∧ (y ∧ z)","(x ∧ y) ∧ z = x ∧ (y ∧ z)"]],
       [["Commutative","الإبدال"],["x ∨ y = y ∨ x","x ∨ y = y ∨ x"],["x ∧ y = y ∧ x","x ∧ y = y ∧ x"]],
       [["Distributive","التوزيع"],["x ∨ (y ∧ z) = (x ∨ y) ∧ (x ∨ z)","x ∨ (y ∧ z) = (x ∨ y) ∧ (x ∨ z)"],["x ∧ (y ∨ z) = (x ∧ y) ∨ (x ∧ z)","x ∧ (y ∨ z) = (x ∧ y) ∨ (x ∧ z)"]]
      ]},
     {k:'tip', x:["Notice the symmetry: every axiom comes in a matching ∨/∧ pair, with 0 and 1 swapping roles between the two forms (e.g. Identity uses 0 with ∨, but 1 with ∧).","لاحظ التناظر: تأتي كل بديهية في زوج متطابق ∨/∧، مع تبادل الأدوار بين 0 وَ1 في الصيغتين (مثلًا، المحايد يستخدم 0 مع ∨، لكن 1 مع ∧)."]}

   ]}

  take:[

   ["Identity: x ∨ 0 = x and x ∧ 1 = x.","المحايد: x ∨ 0 = x وَx ∧ 1 = x."],

   ["Every axiom has a matching ∨ form and ∧ form.","لكل بديهية صيغة ∨ مطابقة وصيغة ∧."]

  fc:[

LECTURES.push({ id:'l7', n:7,
  title:["Induction and Working with Quantifiers","الاستقراء والعمل مع المحددات الكمية"],
  obj:[
    ["State the two components required for a proof by mathematical induction: the base case and the inductive step.","صياغة الركنين المطلوبين للإثبات بالاستقراء الرياضي: حالة الأساس وخطوة الاستقراء."],
    ["Carry out a simple proof by mathematical induction.","تنفيذ إثبات بسيط بالاستقراء الرياضي."],
    ["Apply De Morgan's laws for quantifiers to negate a quantified statement such as ∃x(x² = 2).","تطبيق قوانين دي مورجان للمحددات الكمية لنفي عبارة مُحدَّدة كميًا مثل ∃x(x² = 2)."]
  ],
  sec:[
   {t:["The Principle of Mathematical Induction","مبدأ الاستقراء الرياضي"], b:[
     {k:'tip', x:["Supplementary standard content: your lecture slide for this topic only contained the quantifier-negation tutorial below. Since the course objectives list 'Proof Techniques' and Lecture 9 (Recursion) explicitly says 'prove by induction' without defining it, this section adds the standard definition of induction so that technique is covered before you need it.","محتوى تكميلي قياسي: شريحة محاضرتك لهذا الموضوع تضمنت فقط تمرين نفي المحدد الكمي أدناه. وبما أن أهداف المقرر تذكر 'تقنيات الإثبات' وأن المحاضرة 9 (التكرار) تقول صراحة 'أثبت بالاستقراء' دون تعريفه، يضيف هذا القسم التعريف القياسي للاستقراء حتى تكون هذه التقنية مُغطاة قبل الحاجة إليها."]},
     {k:'def', x:["Mathematical induction proves that a statement P(n) is true for every integer n ≥ n0 using two steps: a Base Case and an Inductive Step.","يُثبت الاستقراء الرياضي أن العبارة P(n) صحيحة لكل عدد صحيح n ≥ n0 باستخدام خطوتين: حالة الأساس وخطوة الاستقراء."]},
     {k:'ul', h:["The two required steps","الخطوتان المطلوبتان"], x:[
       ["Base Case: show that P(n0) is true (usually n0 = 0 or 1).","حالة الأساس: إثبات أن P(n0) صحيحة (عادةً n0 = 0 أو 1)."],
       ["Inductive Step: assume P(k) is true for an arbitrary k ≥ n0 (the inductive hypothesis), then show P(k+1) must also be true.","خطوة الاستقراء: افترض أن P(k) صحيحة من أجل k ≥ n0 عشوائي (فرضية الاستقراء)، ثم أثبت أن P(k+1) صحيحة أيضًا."]]},
     {k:'p', x:["If both steps succeed, P(n) is true for every integer n ≥ n0 — the base case starts the chain, and the inductive step shows each value 'passes the truth' to the next one.","إذا نجحت الخطوتان، تكون P(n) صحيحة لكل عدد صحيح n ≥ n0 — حالة الأساس تبدأ السلسلة، وخطوة الاستقراء تُظهر أن كل قيمة 'تُمرّر الصحة' إلى التي تليها."]}
   ]},
   {t:["Worked Example: Proving the Gauss Formula by Induction","مثال محلول: إثبات صيغة جاوس بالاستقراء"], b:[
     {k:'p', x:["Prove by induction that, for all integers n ≥ 1: ∑_{i=1}^{n} i = n(n+1)/2 (the arithmetic series formula from Lecture 6).","أثبت بالاستقراء أنه لكل عدد صحيح n ≥ 1: ∑_{i=1}^{n} i = n(n+1)/2 (صيغة المتسلسلة الحسابية من المحاضرة 6)."]},
     {k:'formula', x:"Base case (n = 1): LHS = 1. RHS = 1(1+1)/2 = 1. LHS = RHS. ✓\n\nInductive step: Assume ∑_{i=1}^{k} i = k(k+1)/2 (inductive hypothesis).\nShow ∑_{i=1}^{k+1} i = (k+1)(k+2)/2.\n\n∑_{i=1}^{k+1} i = [∑_{i=1}^{k} i] + (k+1)\n              = k(k+1)/2 + (k+1)          [by inductive hypothesis]\n              = (k+1)[k/2 + 1]\n              = (k+1)(k+2)/2\n\nSo P(k+1) holds. By induction, P(n) is true for all n ≥ 1."},
     {k:'tip', x:["The key move is always the same: replace the first k terms with the inductive hypothesis, then show the resulting algebra matches the formula for k+1.","الحركة الأساسية دائمًا واحدة: استبدل أول k حدًا بفرضية الاستقراء، ثم أثبت أن الجبر الناتج يطابق الصيغة من أجل k+1."]}
   ]},

   ["The assumption that P(k) is true during the inductive step is called the inductive hypothesis.","يُسمى افتراض صحة P(k) أثناء خطوة الاستقراء بفرضية الاستقراء."],
   ["∑_{i=1}^{n} i = n(n+1)/2 can itself be proven by induction, confirming the Gauss formula from Lecture 6.","يمكن إثبات ∑_{i=1}^{n} i = n(n+1)/2 بالاستقراء نفسه، مما يؤكد صيغة جاوس من المحاضرة 6."],
   ["¬∃x(x² = 2) ≡ ∀x(x² ≠ 2), by De Morgan's laws for quantifiers.","¬∃x(x² = 2) ≡ ∀x(x² ≠ 2)، بموجب قوانين دي مورجان للمحددات الكمية."]

   [["What is the inductive hypothesis?","ما فرضية الاستقراء؟"],["The assumption that P(k) is true for an arbitrary k ≥ n0, used to prove P(k+1).","افتراض أن P(k) صحيحة من أجل k ≥ n0 عشوائي، يُستخدم لإثبات P(k+1)."]],

   [["In the worked example, what is the base case for ∑_{i=1}^{n} i = n(n+1)/2?","في المثال المحلول، ما حالة الأساس لـ ∑_{i=1}^{n} i = n(n+1)/2؟"],["n = 1: LHS = 1, RHS = 1(2)/2 = 1, so they match.","n = 1: الطرف الأيسر = 1، الطرف الأيمن = 1(2)/2 = 1، فهما متطابقان."]],

   [["What does ¬(x² = 2) simplify to?","إلى ماذا تُبسَّط ¬(x² = 2)؟"],["x² ≠ 2.","x² ≠ 2."]],

   [["Why does the worked induction example matter for Lecture 6?","لماذا يهم مثال الاستقراء المحلول بالنسبة للمحاضرة 6؟"],["It proves, rather than just states, the Gauss (arithmetic series) formula used there.","إنه يُثبت صيغة جاوس (المتسلسلة الحسابية) المستخدمة هناك، بدلًا من مجرد ذكرها."]],

LECTURES.push({ id:'l8', n:8,
  title:["Recursion","التكرار (Recursion)"],
  obj:[
    ["State the two things every recursive definition must specify: the base case and the recursive step.","صياغة الركنين اللذين يجب أن يحددهما كل تعريف تكراري: حالة الأساس وخطوة التكرار."],
    ["Read a recursively defined set and determine which elements it contains.","قراءة مجموعة مُعرَّفة تكراريًا وتحديد العناصر التي تحتويها."],
    ["Prove that a recursively defined set equals a given set, using the double-subset technique (A ⊆ S and S ⊆ A).","إثبات أن مجموعة مُعرَّفة تكراريًا تساوي مجموعة معطاة، باستخدام تقنية المجموعة الجزئية المزدوجة (A ⊆ S وَS ⊆ A)."]
  ],
  sec:[
   {t:["What Is Recursion?","ما هو التكرار؟ (Recursion)"], b:[
     {k:'p', x:["In recursion, we need to define two things.","في التكرار، نحتاج إلى تعريف شيئين."]},
     {k:'ul', h:["Every recursive definition needs:","يحتاج كل تعريف تكراري إلى:"], x:[
       ["1. Initial value (Base case).","1. القيمة الابتدائية (حالة الأساس)."],
       ["2. The rule of construction (Recursive step).","2. قاعدة البناء (خطوة التكرار)."]]},
     {k:'tip', x:["This mirrors the structure of a proof by induction from Lecture 7: a base case to start from, and a step that builds every further case from earlier ones.","هذا يُطابق بنية الإثبات بالاستقراء من المحاضرة 7: حالة أساس للانطلاق منها، وخطوة تبني كل الحالات اللاحقة من السابقة."]}
   ]},
   {t:["Recursively Defined Sets","المجموعات المُعرَّفة تكراريًا"], b:[
     {k:'p', x:["Let S be recursively defined by:","لتكن S مُعرَّفة تكراريًا بـ:"]},
     {k:'formula', x:"1. 3 ∈ S                              (base case)\n2. (x + y) ∈ S if (x ∈ S) and (y ∈ S)   (recursive step)"},
     {k:'p', x:["Starting from 3 ∈ S, the recursive step generates more elements: since 3 ∈ S, taking x = y = 3 gives 3+3 = 6 ∈ S; then taking x = 6, y = 3 gives 9 ∈ S, and so on — S ends up containing 3, 6, 9, 12, ...","بدءًا من 3 ∈ S، تُولِّد خطوة التكرار عناصر أكثر: بما أن 3 ∈ S، فإن أخذ x = y = 3 يُعطي 3+3 = 6 ∈ S؛ ثم أخذ x = 6, y = 3 يُعطي 9 ∈ S، وهكذا — تنتهي S باحتوائها على 3 وَ6 وَ9 وَ12 وَ..."]}
   ]},
   {t:["Proof That S Is the Set of Positive Integers Divisible by 3","إثبات أن S هي مجموعة الأعداد الصحيحة الموجبة القابلة للقسمة على 3"], b:[
     {k:'p', x:["Let A be the set of positive integers divisible by 3. To show A = S, we must show both A ⊆ S and S ⊆ A (the double-subset technique from Lecture 4).","لتكن A مجموعة الأعداد الصحيحة الموجبة القابلة للقسمة على 3. لإثبات A = S، يجب إثبات A ⊆ S وَS ⊆ A معًا (تقنية المجموعة الجزئية المزدوجة من المحاضرة 4)."]},
     {k:'p', x:["Part I: A ⊆ S — completed using induction (Lecture 7). Every element of A has the form 3k for some positive integer k; we prove 3k ∈ S for all positive integers k by induction on k.","الجزء الأول: A ⊆ S — يُكمَل باستخدام الاستقراء (المحاضرة 7). كل عنصر في A له الصورة 3k من أجل عدد صحيح موجب k؛ نُثبت 3k ∈ S لكل عدد صحيح موجب k بالاستقراء على k."]},
     {k:'formula', x:"Base case (k = 1): 3(1) = 3 ∈ S, given directly by the base case of S's definition. ✓\n\nInductive step: Assume 3k ∈ S (inductive hypothesis).\nShow 3(k+1) ∈ S.\n\n3(k+1) = 3k + 3\nSince 3k ∈ S (by the inductive hypothesis) and 3 ∈ S (base case),\nthe recursive step gives (3k) + 3 ∈ S, i.e. 3(k+1) ∈ S.\n\nBy induction, 3k ∈ S for every positive integer k, so A ⊆ S."},
     {k:'p', x:["Part II: S ⊆ A.","الجزء الثاني: S ⊆ A."]},
     {k:'cards', c:[
       {t:["Basis step","خطوة الأساس"], l:[["All initial elements of S are in A. 3 is in A (true, since 3 | 3).","كل العناصر الابتدائية لـ S موجودة في A. 3 موجودة في A (صحيح، لأن 3 | 3)."]]},
       {t:["Inductive step","خطوة الاستقراء"], l:[["If x and y are both in S (and, by the inductive hypothesis, in A), then (x + y) is in A. Since x and y are both in A, 3 | x and 3 | y. Therefore 3 | (x + y).","إذا كانت x وَy كلتاهما في S (وبفرضية الاستقراء، في A)، فإن (x + y) في A. بما أن x وَy في A، فإن 3 | x وَ3 | y. لذا 3 | (x + y)."]]}
     ]},
     {k:'p', x:["Conclusion: S ⊆ A. Since both A ⊆ S and S ⊆ A hold, A = S.","الخلاصة: S ⊆ A. وبما أن A ⊆ S وَS ⊆ A كلاهما يتحققان، فإن A = S."]}
   ]}

  take:[
   ["Every recursive definition needs an initial value (base case) and a rule of construction (recursive step).","يحتاج كل تعريف تكراري إلى قيمة ابتدائية (حالة أساس) وقاعدة بناء (خطوة تكرار)."],
   ["S is recursively defined by: 3 ∈ S (base case); (x+y) ∈ S if x ∈ S and y ∈ S (recursive step).","S مُعرَّفة تكراريًا بـ: 3 ∈ S (حالة الأساس)؛ (x+y) ∈ S إذا كانت x ∈ S وَy ∈ S (خطوة التكرار)."],
   ["To prove A = S, show both A ⊆ S and S ⊆ A — the double-subset technique.","لإثبات A = S، أثبت A ⊆ S وَS ⊆ A معًا — تقنية المجموعة الجزئية المزدوجة."],
   ["S ⊆ A's inductive step uses: if 3|x and 3|y, then 3|(x+y).","خطوة الاستقراء لـ S ⊆ A تستخدم: إذا كانت 3|x وَ3|y، فإن 3|(x+y)."]
  ],
  fc:[

   [["State the base case of the recursive definition of S.","اذكر حالة الأساس للتعريف التكراري لـ S."],["3 ∈ S.","3 ∈ S."]],

   [["What two things must be shown to prove A = S?","ما الأمران اللذان يجب إثباتهما لإثبات A = S؟"],["A ⊆ S and S ⊆ A.","A ⊆ S وَS ⊆ A."]],
   [["What is the base case of the Part I induction proof (A ⊆ S)?","ما حالة الأساس في إثبات الجزء الأول بالاستقراء (A ⊆ S)؟"],["k = 1: 3(1) = 3 ∈ S, given directly by S's own base case.","k = 1: 3(1) = 3 ∈ S، معطاة مباشرة من حالة أساس S نفسها."]],
   [["In the Part I inductive step, how is 3(k+1) ∈ S shown?","في خطوة الاستقراء للجزء الأول، كيف تُثبت 3(k+1) ∈ S؟"],["3(k+1) = 3k + 3; since 3k ∈ S (IH) and 3 ∈ S (base case), the recursive step gives 3k+3 ∈ S.","3(k+1) = 3k + 3؛ وبما أن 3k ∈ S (فرضية الاستقراء) وَ3 ∈ S (حالة الأساس)، فإن خطوة التكرار تُعطي 3k+3 ∈ S."]],
   [["What is the basis step of Part II (S ⊆ A)?","ما خطوة الأساس في الجزء الثاني (S ⊆ A)؟"],["All initial elements of S are in A: 3 is in A, since 3 | 3.","كل العناصر الابتدائية لـ S موجودة في A: 3 موجودة في A، لأن 3 | 3."]],

   [["What divisibility fact is used to conclude 3 | (x+y)?","ما حقيقة القسمة المستخدمة لاستنتاج 3 | (x+y)؟"],["If 3 | x and 3 | y, then 3 | (x + y).","إذا كانت 3 | x وَ3 | y، فإن 3 | (x + y)."]],

/* ============================================================

   ============================================================ */
const clean = s => String(s)
  .replace(/<\/?(antml:)?cite[^>]*>/gi,'')
  .replace(/\[cite[^\]]*\]/gi,'')
  .replace(/\[(source|ref)[^\]]*\]/gi,'')
  .replace(/[ \t]{2,}/g,' ').trim();
const esc = s => clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/(\$?\d[\d,.]*\d|\$?\d)/g,'<span class="mono">$1</span>');
const li = () => state.lang==='ar'?1:0;
const tx = a => fmt(a[li()]);
const u = k => UI[k][li()];
const $ = id => document.getElementById(id);
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function mixQ(q){ const idx=shuf(q.o.map((_,i)=>i)); return {q:q.q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)}; }
function applyTheme(){

      </summary>
      <div class="px-5 pb-5 pt-3 border-t border-dark-border">
        <ul class="space-y-1">${L.obj.map(o=>`<li class="flex gap-2"><span class="text-brand-500">✓</span><span>${tx(o)}</span></li>`).join('')}</ul>
      </div>
    </details>

    ${L.sec.map((s,i)=>`<section class="bg-dark-elevated border border-dark-border rounded-2xl p-5 mb-5">
        <h2 class="text-xl font-bold mb-2 flex items-center gap-2"><span class="mono text-sm bg-brand-600 text-white rounded-md px-2 py-0.5">${i+1}</span>${tx(s.t)}</h2>${s.b.map(renderBlock).join('')}</section>`).join('')}
    <div class="bg-brand-500/10 border border-brand-500 rounded-2xl p-5 mb-5">
      <h2 class="font-bold text-lg mb-2 text-brand-500">⭐ ${u('take')}</h2>
      <ul class="space-y-1">${L.take.map(t=>`<li class="flex gap-2"><span class="text-brand-500">★</span><span>${tx(t)}</span></li>`).join('')}</ul>
    </div>
    <div class="bg-dark-elevated border border-dark-border rounded-2xl p-5 mb-5">
      <h2 class="font-bold text-lg mb-3">🃏 ${u('flash')}</h2>
      ${deckBox('fc-'+L.id,'l',L.fc)}
    </div>

    <details class="group bg-dark-elevated border border-dark-border open:border-brand-500 rounded-2xl mb-5 overflow-hidden transition-all">
      <summary class="cursor-pointer list-none px-5 py-3.5 flex items-center justify-between hover:bg-white/5 select-none">
        <span class="font-bold text-lg">📝 ${u('quiz')} <span class="mono text-sm text-dark-muted">(${L.quiz.length})</span></span>
        <div class="flex items-center gap-3">
          ${d.best[L.id]!=null?`<span class="mono text-xs text-dark-muted">${u('best')}:${d.best[L.id]}%</span>`:''}
          <span class="mono text-xs text-brand-500 transition-transform duration-300 group-open:rotate-180">▼</span>
        </div>
      </summary>
      <div class="px-5 pb-5 pt-3 border-t border-dark-border [&>div:first-child]:hidden" data-quiz="${L.id}" id="quiz-${L.id}">${quizInner(L)}</div>
    </details>

    <div class="flex justify-between gap-3">
      ${prev?`<button data-go="${prev.id}" class="px-4 py-2 rounded-lg bg-dark-elevated border border-dark-border hover:border-brand-500">${ar?'→':'←'}${u('prev')}</button>`:'<span></span>'}
      ${next?`<button data-go="${next.id}" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white">${u('next')}${ar?'←':'→'}</button>`:`<button data-go="exam" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white">${u('exam')}${ar?'←':'→'}</button>`}
    </div></div>`;
}

function gItems(list){
  return list.map(g=>`<div class="bg-dark-elevated border border-dark-border rounded-xl p-3 flex flex-wrap justify-between gap-2"><span class="mono text-brand-500 font-semibold" dir="ltr">${esc(g[0])}</span><span class="font-semibold" dir="rtl" style="font-family:Cairo">${esc(g[1])}</span></div>`).join('') || '<div class="text-dark-muted">—</div>';
}
function renderGlossary(){
  const G=subj().glossary;
  return `<div class="fade">
    <h1 class="text-3xl font-extrabold mb-1">Glossary / قاموس المصطلحات</h1>
    <p class="text-dark-muted mb-5 mono text-sm">${G.length} terms</p>
    <div class="bg-dark-elevated border border-dark-border rounded-2xl p-5 mb-6">
      <h2 class="font-bold text-lg mb-3">🃏 ${u('glossFlash')}</h2>
      ${deckBox('gl','g',shuf(G))}
    </div>
    <h2 class="font-bold text-lg mb-2">📖 ${u('glossList')}</h2>
    <input id="gSearch" placeholder="${u('search')}" class="w-full p-3 rounded-xl bg-dark-elevated border border-dark-border focus:border-brand-500 outline-none mb-4">
    <div id="gList" class="grid gap-2">${gItems(G)}</div></div>`;
}

/* ---------- FINAL EXAM ---------- */
function pool(){ const p=[]; LECT().forEach(l=>l.quiz.forEach(q=>p.push(q))); return p; }
function newExam(size){
  const qs=shuf(pool()).slice(0,size).map(mixQ);
  state.exam={qs,i:0,score:0,wrong:[],finished:false,size};
}
function renderExam(){
  const e=state.exam, total=pool().length, d=sd();
  if(!e){
    const sizes=[20,40,total];
    return `<div class="fade text-center py-8"><h1 class="text-3xl font-extrabold mb-2">🏆 ${u('exam')}</h1>
      <p class="text-dark-muted mb-1">${state.lang==='ar'?`بنك الأسئلة: ${total} سؤالًا من كل المحاضرات. تتغير الأسئلة وترتيب الخيارات في كل مرة.`:`Question bank: ${total} questions from all lectures. Questions and answer order change every time.`}</p>
      <p class="mono text-sm text-dark-muted mb-6">${u('best')}: ${d.exam?d.exam+'%':'—'}</p>
      <p class="font-semibold mb-3">${u('chooseSize')}</p>
      <div class="flex flex-wrap justify-center gap-3">${sizes.map((n,i)=>`<button data-size="${n}" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold"><span class="mono">${n}</span> ${i===2?`(${u('all')})`:u('questions')}</button>`).join('')}</div></div>`;
  }
  if(e.finished){
    const p=Math.round(e.score/e.qs.length*100);
    return `<div class="fade py-6"><div class="text-center">
      <h1 class="text-3xl font-extrabold mb-3">🏆 ${u('exam')}</h1>
      <div class="mono text-5xl font-extrabold ${p>=90?'text-green-400':p>=60?'text-amber-400':'text-red-400'} mb-2">${e.score}/${e.qs.length}</div>
      <div class="mono text-xl mb-4">${p}%</div>
      <p class="mb-6">${p>=90?(state.lang==='ar'?'ممتاز! أنت جاهز للامتحان 🎉':'Excellent! You are ready 🎉'):(state.lang==='ar'?'راجع المحاضرات وأعد المحاولة للوصول إلى 90%+':'Review the lectures and try again to reach 90%+')}</p>
      <button data-act="examAgain" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold">${u('retry')}</button></div>
      ${e.wrong.length?`<h2 class="font-bold text-lg mt-8 mb-3">❌ ${u('mistakes')} (${e.wrong.length})</h2>
      ${e.wrong.map(w=>`<div class="bg-dark-elevated border border-dark-border border-s-4 border-s-red-500 rounded-xl p-4 mb-3"><div class="font-semibold mb-1">${tx(w.q)}</div><div class="text-sm text-green-400">${u('yourAns')}: ${tx(w.c)}</div></div>`).join('')}`:''}
    </div>`;
  }
  const q=e.qs[e.i];
  return `<div class="fade"><h1 class="text-2xl font-extrabold mb-3">🏆 ${u('exam')}</h1>
    <div class="h-2 bg-dark-surface rounded-full mb-4 overflow-hidden"><div class="h-full bg-brand-500" style="width:${e.i/e.qs.length*100}%"></div></div>
    <div data-exam="1">${qHTML(q,e.i+1,e.qs.length)}</div>
    <div class="flex justify-between items-center"><span class="mono text-sm text-dark-muted">${u('score')}: ${e.score}</span>
    <button id="examNext" class="hidden px-5 py-2 rounded-lg bg-brand-600 text-white">${e.i===e.qs.length-1?u('finish'):u('next')}</button></div></div>`;
}

/* ============================================================
   SHELL: nav, layout, render
   ============================================================ */
function renderNav(){
  const item=(id,icon,label,extra='')=>`<button data-go="${id}" class="w-full flex items-center gap-3 text-start px-3 py-2.5 rounded-lg transition ${state.page===id?'bg-brand-600 text-white':'hover:bg-dark-elevated text-dark-text'}"><span>${icon}</span><span class="flex-1 text-sm">${label}</span>${extra}</button>`;
  const head=t=>`<div class="px-3 pt-3 pb-1 text-xs uppercase tracking-wider text-dark-muted">${t}</div>`;
  const s=subj(), d=sd();
  let h=`<a href="index.html" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-dark-elevated text-dark-text"><span>🗂️</span><span class="flex-1 text-sm">${u('hub')}</span></a>`;
  h += `<div class="px-3 pt-3 pb-1 text-sm font-bold text-brand-500">${s.icon} ${tx(s.name)}</div>`;
  h += item('home','🏠',u('home'));
  h += head(u('lectures')) + s.lectures.map(l=>item(l.id,`<span class="mono text-xs">${l.n}</span>`,tx(l.title),d.best[l.id]!=null?`<span class="mono text-[10px] opacity-80">${d.best[l.id]}%</span>`:'')).join('');
  h += head(u('tools')) + item('exam','🏆',u('exam'),d.exam?`<span class="mono text-[10px] opacity-80">${d.exam}%</span>`:'') + item('glossary','📖','Glossary / قاموس المصطلحات');
  $('nav').innerHTML=h;
}
function applyLayout(){
  const sb=$('sidebar'), main=$('main'), bd=$('backdrop');
  sb.classList.toggle('ltr:-translate-x-full',!state.sidebar);
  sb.classList.toggle('rtl:translate-x-full',!state.sidebar);
  main.classList.toggle('lg:ps-72',state.sidebar);
  bd.classList.toggle('hidden',!(state.sidebar && window.innerWidth<1024));
}
function updateTop(){
  const show=!!state.subject, m=show?mastery(subj()):0;
  $('topProgWrap').classList.toggle('hidden',!show); $('topProgWrap').classList.toggle('sm:flex',show);
  $('topBar').style.width=m+'%'; $('topPct').textContent=m+'%';
}
function render(){
  document.documentElement.lang=state.lang;
  document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
  $('langBtn').textContent = state.lang==='ar'?'English':'العربية';
  applyTheme();
  const lects = state.subject?LECT():[];
  const idx=lects.findIndex(l=>l.id===state.page);
  let html='', title='';
  if(state.page==='home'){ html=renderHome(); title=tx(subj().name).replace(/<[^>]+>/g,''); }
  else if(idx>=0){ html=renderLecture(lects[idx],idx); title=`${u('lecture')} ${lects[idx].n}`; }
  else if(state.page==='exam'){ html=renderExam(); title=u('exam'); }
  else if(state.page==='glossary'){ html=renderGlossary(); title='Glossary / قاموس المصطلحات'; }
  $('app').innerHTML=html; $('topTitle').textContent=title;
  updateTop(); renderNav(); applyLayout();
}
function go(p){
  state.page=p; state.qz={}; state.decks={}; if(p!=='exam') state.exam=null;
  if(window.innerWidth<1024) state.sidebar=false;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }

  const sz=e.target.closest('[data-size]'); if(sz){ newExam(+sz.dataset.size); render(); window.scrollTo({top:0}); return; }

  const opt=e.target.closest('.opt');
  if(opt){
    const box=opt.closest('.qbox'); if(box.dataset.done) return;
    box.dataset.done='1';
    const a=+box.dataset.a, i=+opt.dataset.i, ok=(i===a);
    if(ok) box.dataset.ok='1';
    box.querySelectorAll('.opt').forEach(b=>{
      b.disabled=true; b.classList.remove('hover:border-brand-500'); b.classList.add('cursor-not-allowed');
      if(+b.dataset.i===a) b.classList.add('!bg-green-600/30','!border-green-500');
    });
    if(!ok) opt.classList.add('!bg-red-600/30','!border-red-500');
    const fb=box.querySelector('.fb'); fb.classList.remove('hidden');
    fb.className='fb mt-3 text-sm font-semibold '+(ok?'text-green-400':'text-red-400');
    fb.textContent=ok?u('correct'):u('wrong');

    const exam=box.closest('[data-exam]');
    if(exam){
      const ex=state.exam, q=ex.qs[ex.i];
      if(ok) ex.score++; else ex.wrong.push({q:q.q,c:q.o[q.a]});
      $('examNext').classList.remove('hidden'); return;
    }
    const qz=box.closest('[data-quiz]');
    if(qz){
      const boxes=[...qz.querySelectorAll('.qbox')];
      if(boxes.every(b=>b.dataset.done)){
        const sc=boxes.filter(b=>b.dataset.ok).length, pct=Math.round(sc/boxes.length*100);
        const sEl=qz.querySelector('.qscore'); sEl.classList.remove('hidden');
        qz.querySelector('.qs-text').textContent=`${u('score')}: ${sc}/${boxes.length} (${pct}%)`;
        const d=sd(), id=qz.dataset.quiz;
        if(d.best[id]==null||pct>d.best[id]){ d.best[id]=pct; save(); }
        updateTop(); renderNav();
      }
    }
    return;
  }

  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act.startsWith('dk-')){
    const id=a.dataset.deck, d=state.decks[id]; if(!d) return;
    if(act==='dk-flip'){ d.flip=!d.flip; const f=document.querySelector(`#deck-${id} .flip`); if(f) f.classList.toggle('on',d.flip); return; }
    if(act==='dk-next') d.i=(d.i+1)%d.list.length;
    if(act==='dk-prev') d.i=(d.i-1+d.list.length)%d.list.length;
    if(act==='dk-shuf'){ d.list=shuf(d.list); d.i=0; }
    d.flip=false; redrawDeck(id); return;
  }
  if(act==='retryQuiz'){
    const L=LECT().find(l=>l.id===a.dataset.id); delete state.qz[L.id];
    $('quiz-'+L.id).innerHTML=quizInner(L); $('quiz-'+L.id).scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if(act==='examAgain'){ state.exam=null; render(); return; }
  if(act==='reset'){ state.data[state.subject]={seen:{},best:{},exam:0}; save(); render(); return; }
});
document.addEventListener('click',e=>{
  if(e.target.id==='examNext'){
    const ex=state.exam;
    if(ex.i<ex.qs.length-1) ex.i++;
    else { ex.finished=true; const p=Math.round(ex.score/ex.qs.length*100), d=sd(); if(p>(d.exam||0)){ d.exam=p; save(); } }
    render(); window.scrollTo({top:0});
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='gSearch'){
    const q=e.target.value.toLowerCase();
    $('gList').innerHTML=gItems(subj().glossary.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(q)));
  }
});
$('menuBtn').onclick=()=>{ state.sidebar=!state.sidebar; applyLayout(); };
$('backdrop').onclick=()=>{ state.sidebar=false; applyLayout(); };
$('langBtn').onclick=()=>{ state.lang=state.lang==='ar'?'en':'ar'; save(); render(); };
window.addEventListener('resize',applyLayout);

render();
</script>
</body>
</html>
