const LECTURES = [{"id":"l1","n":1,"title":["Propositional Logic & Logical Operators (Lectures 1 & 2)","المنطق القضوي والروابط المنطقية (Lectures 1 & 2)"],"obj":[["Define a proposition, its truth value, and distinguish it from a propositional function (open sentence).","تعريف القضية (Proposition) وقيمتها الصدقية، والتمييز بينها وبين الدالة القضوية (الجملة المفتوحة)."],["Classify sentences using the Statement/Proposition Game examples.","تصنيف الجمل باستخدام أمثلة لعبة العبارات والقضايا (Statement/Proposition Game)."],["Construct truth tables for all six logical operators (¬, ∧, ∨, ⊕, →, ↔) and compound propositions.","بناء جداول الصدق (Truth Tables) للروابط المنطقية الستة وللقضايا المركبة."],["Apply operator precedence and translate natural language sentences into logic (handling natural language ambiguity with XOR).","تطبيق أسبقية العمليات وترجمة الجمل اللغوية إلى منطق (ومعالجة غموض اللغة الطبيعية باستخدام XOR)."],["Define Tautologies, Contradictions, and Logical Equivalence (S1 ≡ S2).","تعريف التحصيل الحاصل (Tautology)، التناقض (Contradiction)، والتكافؤ المنطقي."],["Prove logical equivalence using both truth tables and equivalence laws.","إثبات التكافؤ المنطقي باستخدام كل من جداول الصدق وقوانين التكافؤ."]],"sec":[{"t":["In Simple Words + Pictures","ببساطة + رسومات"],"b":[{"k":"eli","x":["A proposition is a sentence you can mark True or False. AND needs both, OR needs at least one, XOR exactly one. P → Q is a promise: it is broken (False) only when P happens and Q does not.","القضية جملة تقدر تقول عنها صح أو خطأ. AND لازم الاثنين، OR يكفي واحد، XOR واحد بس. و P → Q زي الوعد: ما بينكسر (False) إلا لو P حصلت وQ ما حصلت."]},{"k":"vis","x":"<div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center\"><div style=\"flex:1;min-width:150px;border:2px solid #4ade80;border-radius:12px;padding:10px\"><b style=\"color:#4ade80\">Tautology (صحيحة دائمًا)</b><div style=\"margin:6px 0;font-family:'JetBrains Mono',monospace;font-size:13px\">(P ∧ Q) → P</div><div><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#4ade8033;border:1px solid #4ade80\">T</span><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#4ade8033;border:1px solid #4ade80\">T</span><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#4ade8033;border:1px solid #4ade80\">T</span><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#4ade8033;border:1px solid #4ade80\">T</span></div></div><div style=\"flex:1;min-width:150px;border:2px solid #f87171;border-radius:12px;padding:10px\"><b style=\"color:#f87171\">Contradiction (خاطئة دائمًا)</b><div style=\"margin:6px 0;font-family:'JetBrains Mono',monospace;font-size:13px\">P ∧ ¬P</div><div><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#f8717133;border:1px solid #f87171\">F</span><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#f8717133;border:1px solid #f87171\">F</span><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#f8717133;border:1px solid #f87171\">F</span><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#f8717133;border:1px solid #f87171\">F</span></div></div><div style=\"flex:1;min-width:150px;border:2px solid #fbbf24;border-radius:12px;padding:10px\"><b style=\"color:#fbbf24\">Neither (تعتمد على القيم)</b><div style=\"margin:6px 0;font-family:'JetBrains Mono',monospace;font-size:13px\">P → Q</div><div><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#4ade8033;border:1px solid #4ade80\">T</span><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#f8717133;border:1px solid #f87171\">F</span><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#4ade8033;border:1px solid #4ade80\">T</span><span style=\"display:inline-block;width:26px;text-align:center;border-radius:4px;margin:1px;background:#4ade8033;border:1px solid #4ade80\">T</span></div></div></div>","c":["Last column of the truth table (rows PQ = TT, TF, FT, FF): all T = tautology, all F = contradiction, mixed = neither.","عمود النتيجة في جدول الصدق (الصفوف TT, TF, FT, FF): كله T = Tautology، كله F = Contradiction، خليط = غير ذلك."]}]},{"t":["Propositions and Propositional Functions","القضايا (Propositions) والدوال القضوية"],"b":[{"k":"p","x":["Propositional logic is important for program design and is used for designing electronic circuitry. It is a system based on propositions.","المنطق القضوي مهم لتصميم البرامج ويُستخدم في تصميم الدوائر الإلكترونية. وهو نظام مبني على القضايا (Propositions)."]},{"k":"def","x":["A proposition is a declarative statement that is either true (T) or false (F), but not both. Its truth value corresponds to 1 and 0 in digital circuits.","القضية (Proposition) هي جملة خبرية إما أن تكون صحيحة (T) أو خاطئة (F)، وليس كلاهما معًا. وتقابل قيمتها الصدقية 1 و 0 في الدوائر الرقمية."]},{"k":"def","x":["A propositional function (or open sentence) is a statement involving one or more variables (e.g., 'y > 5') whose truth value depends on the unspecified value of the variable.","الدالة القضوية (Propositional Function) أو الجملة المفتوحة (Open Sentence) هي عبارة تحتوي على متغير أو أكثر (مثل 'y > 5') وتعتمد قيمتها الصدقية على قيمة المتغير غير المحددة."]},{"k":"tip","x":["Only declarative statements can be propositions. Commands, requests, or questions are NOT statements, and therefore cannot be propositions.","فقط الجمل الخبرية يمكن أن تكون قضايا. الأوامر أو الطلبات أو الأسئلة ليست جملاً خبرية، وبالتالي لا يمكن أن تكون قضايا."]}]},{"t":["The Statement / Proposition Game","لعبة العبارات والقضايا (أمثلة المحاضرة)"],"b":[{"k":"p","x":["Let us examine every example from the lecture slides to see which sentences are statements, which are propositions, and why:","لنفحص جميع أمثلة شرائح المحاضرة لمعرفة أي الجمل تُعد عبارة خبرية (Statement)، وأيها قضية (Proposition)، ولماذا:"]},{"k":"tbl","h":[["Sentence","الجملة"],["Statement?","عبارة خبرية؟"],["Proposition?","قضية؟"],["Truth Value & Reason","القيمة الصدقية والسبب"]],"r":[[["\"Elephants are bigger than mice.\"","\"الفيلة أكبر من الفئران.\""],["Yes","نعم"],["Yes","نعم"],["True (T)","صحيحة (T)"]],[["\"520 < 111\"","\"520 < 111\""],["Yes","نعم"],["Yes","نعم"],["False (F)","خاطئة (F)"]],[["\"y > 5\"","\"y > 5\""],["Yes","نعم"],["No","لا"],["Depends on y (Propositional function / open sentence)","تعتمد على y (دالة قضوية / جملة مفتوحة)"]],[["\"Today is May 27 and 99 < 5\"","\"اليوم 27 مايو و 99 < 5\""],["Yes","نعم"],["Yes","نعم"],["False (F) — because 99 < 5 is false","خاطئة (F) — لأن 99 < 5 خاطئة"]],[["\"Please do not fall asleep.\"","\"من فضلك لا تنم.\""],["No","لا"],["No","لا"],["It is a request; only statements can be propositions","هذا طلب؛ والعبارات الخبرية فقط تكون قضايا"]],[["\"If the moon is made of cheese, then I will be rich.\"","\"إذا كان القمر مصنوعًا من الجبن، فسأكون غنيًا.\""],["Yes","نعم"],["Yes","نعم"],["Probably True (T) — implication with false premise","صحيحة (T) — استلزام مقدمته خاطئة"]],[["\"x < y if and only if y > x.\"","\"x < y إذا وفقط إذا كان y > x.\""],["Yes","نعم"],["Yes","نعم"],["True (T) — truth value does NOT depend on specific values of x and y","صحيحة (T) — قيمتها لا تعتمد على قيم محددة لـ x و y"]]]}]},{"t":["Logical Operators (Connectives) & Truth Tables","الروابط المنطقية وجداول الصدق (Truth Tables)"],"b":[{"k":"p","x":["One or more propositions (denoted by letters such as p, q, r, s) can be combined using logical operators (connectives) to form a single compound proposition.","يمكن دمج قضية أو أكثر (يُرمز لها بحروف مثل p, q, r, s) باستخدام الروابط المنطقية لتكوين قضية مركبة (Compound Proposition)."]},{"k":"tbl","h":[["Operator","العملية"],["Arity","النوع"],["Symbol","الرمز"],["Rule Summary","ملخص القاعدة"]],"r":[[["Negation (NOT)","النفي (NOT)"],["Unary","أحادي"],["¬ (or -)","¬ (أو -)"],["Flips T to F, and F to T","يعكس T إلى F، و F إلى T"]],[["Conjunction (AND)","الاقتران / الوصل (AND)"],["Binary","ثنائي"],["∧","∧"],["True ONLY when both P and Q are T","صائبة فقط إذا كان P و Q كلاهما T"]],[["Disjunction (OR)","الفصل (OR)"],["Binary","ثنائي"],["∨","∨"],["False ONLY when both P and Q are F","خاطئة فقط إذا كان P و Q كلاهما F"]],[["Exclusive-Or (XOR)","أو الحصرية (XOR)"],["Binary","ثنائي"],["⊕","⊕"],["True when P and Q have DIFFERENT truth values","صائبة عندما تختلف قيمتا P و Q"]],[["Implication (if-then)","الاستلزام (if-then)"],["Binary","ثنائي"],["→","→"],["False ONLY when P is T and Q is F","خاطئة فقط عندما تكون P صائبة (T) و Q خاطئة (F)"]],[["Biconditional (if and only if)","الشرط الثنائي (iff)"],["Binary","ثنائي"],["↔","↔"],["True when P and Q have the SAME truth value","صائبة عندما تتطابق قيمتا P و Q"]]]},{"k":"p","x":["Complete Truth Table for all Unary and Binary Operators:","جدول الصدق الكامل لجميع العمليات الأحادية والثنائية:"]},{"k":"tbl","h":[["P","P"],["Q","Q"],["¬P","¬P"],["P ∧ Q","P ∧ Q"],["P ∨ Q","P ∨ Q"],["P ⊕ Q","P ⊕ Q"],["P → Q","P → Q"],["P ↔ Q","P ↔ Q"]],"r":[[["T","T"],["T","T"],["F","F"],["T","T"],["T","T"],["F","F"],["T","T"],["T","T"]],[["T","T"],["F","F"],["F","F"],["F","F"],["T","T"],["T","T"],["F","F"],["F","F"]],[["F","F"],["T","T"],["T","T"],["F","F"],["T","T"],["T","T"],["T","T"],["F","F"]],[["F","F"],["F","F"],["T","T"],["F","F"],["F","F"],["F","F"],["T","T"],["T","T"]]]},{"k":"tip","x":["Watch out in exams: P → Q is TRUE whenever P is False (rows 3 and 4). It is only False in one case: T → F = F! Also, P ⊕ Q (XOR) is False when both inputs are True.","انتبه في الامتحان: العبارة P → Q تكون صحيحة دائماً إذا كانت P خاطئة (الصفين 3 و 4)، وتكون خاطئة في حالة واحدة فقط: T → F = F! كذلك P ⊕ Q تكون خاطئة عندما يكون المدخلان T معاً."]}]},{"t":["Operator Precedence & Translating English Sentences","أسبقية العمليات وترجمة الجمل الإنجليزية"],"b":[{"k":"ul","h":["Operator Precedence (from highest to lowest):","أسبقية العمليات (من الأعلى إلى الأدنى):"],"x":[["1. Parentheses () (Highest Priority)","1. الأقواس () (الأعلى أولوية)"],["2. ¬ (Negation)","2. ¬ (النفي)"],["3. ∧ (Conjunction)","3. ∧ (الاقتران)"],["4. ∨ (Disjunction)","4. ∨ (الفصل)"],["5. → (Implication)","5. → (الاستلزام)"],["6. ↔ (Biconditional) (Lowest Priority)","6. ↔ (الشرط الثنائي) (الأدنى أولوية)"]]},{"k":"qa","q":["Translate: \"To take discrete math you must have taken calculus or a CS course.\" (P: take discrete, Q: calculus, R: CS)","ترجم: \"لتأخذ الرياضيات المتقطعة يجب أن تكون درست التفاضل أو مقررًا في الحاسوب.\" (P: تأخذ المتقطعة، Q: التفاضل، R: الحاسوب)"],"a":["P → (Q ∨ R)","P → (Q ∨ R)"]},{"k":"qa","q":["Translate: \"Buy a new car and you get $2000 cash back or a 2% loan.\" (P: buy, Q: cash, R: loan). Why XOR?","ترجم: \"اشترِ سيارة جديدة وتحصل على 2000$ نقدًا أو قرضًا بفائدة 2%.\" (P: شراء، Q: نقد، R: قرض). لماذا XOR؟"],"a":["P → (Q ⊕ R). In real life you get one offer, not both: natural-language \"or\" often means XOR.","P → (Q ⊕ R). في الواقع تحصل على عرض واحد لا الاثنين: \"أو\" في اللغة العادية كثيرًا ما تعني XOR."]},{"k":"qa","q":["Translate: \"School is closed if more than 2 ft of snow falls or the wind chill is below −100.\" (P: closed, Q: snow, R: wind chill)","ترجم: \"تُغلق المدرسة إذا سقط أكثر من قدمين من الثلج أو انخفض مؤشر البرودة عن −100.\" (P: إغلاق، Q: ثلج، R: برودة)"],"a":["(Q ∨ R) → P. The slide prints Q ∧ R → P, which looks like a typo because the sentence says \"or\".","(Q ∨ R) → P. الشريحة كتبت Q ∧ R → P وغالبًا هذا خطأ مطبعي لأن الجملة تقول \"أو\"."]}]},{"t":["Tautologies, Contradictions, and Logical Equivalence","التحصيل الحاصل (Tautologies)، التناقض (Contradictions)، والتكافؤ"],"b":[{"k":"def","x":["A Tautology is a statement that is ALWAYS TRUE, regardless of the truth values of its propositional variables.\n• Examples: R ∨ (¬R), and ¬(P ∧ Q) ↔ (¬P) ∨ (¬Q).","التحصيل الحاصل (Tautology) هو عبارة منطقية تكون صحيحة دائمًا (Always True) مهما كانت قيم المتغيرات.\n• أمثلة: R ∨ (¬R)، وكذلك ¬(P ∧ Q) ↔ (¬P) ∨ (¬Q)."]},{"k":"def","x":["A Contradiction is a statement that is ALWAYS FALSE.\n• Examples: R ∧ (¬R), and ¬(¬(P ∧ Q) ↔ (¬P) ∨ (¬Q)).","التناقض (Contradiction) هو عبارة منطقية تكون خاطئة دائمًا (Always False).\n• أمثلة: R ∧ (¬R)، وكذلك ¬(¬(P ∧ Q) ↔ (¬P) ∨ (¬Q))."]},{"k":"tip","x":["Rule: The negation of any tautology is a contradiction, and the negation of any contradiction is a tautology.","قاعدة ذهبية: نفي أي تحصيل حاصل (Tautology) هو تناقض (Contradiction)، ونفي أي تناقض هو تحصيل حاصل."]},{"k":"def","x":["Definition of Equivalence: Two propositional statements S1 and S2 are said to be (logically) equivalent, denoted S1 ≡ S2, if:\n1. They have the exact same truth table, OR\n2. S1 ⇔ S2 (i.e. S1 ↔ S2) is a tautology.","تعريف التكافؤ المنطقي: يُقال إن العبارتين S1 و S2 متكافئتان منطقيًا (ويُرمز لذلك بـ S1 ≡ S2) إذا:\n1. كان لهما نفس جدول الصدق تمامًا، أو\n2. كانت العبارة S1 ⇔ S2 (أي S1 ↔ S2) تمثل تحصيل حاصل (Tautology)."]},{"k":"p","x":["Truth table showing that ¬(P ∧ Q) and (¬P) ∨ (¬Q) are logically equivalent, and that their biconditional is a Tautology (all T's in the last column):","جدول الصدق الذي يثبت تكافؤ ¬(P ∧ Q) و (¬P) ∨ (¬Q)، وأن الشرط الثنائي بينهما هو Tautology (العمود الأخير كله T):"]},{"k":"tbl","h":[["P","P"],["Q","Q"],["P ∧ Q","P ∧ Q"],["¬(P ∧ Q)","¬(P ∧ Q)"],["¬P","¬P"],["¬Q","¬Q"],["(¬P) ∨ (¬Q)","(¬P) ∨ (¬Q)"],["¬(P∧Q) ↔ (¬P)∨(¬Q)","¬(P∧Q) ↔ (¬P)∨(¬Q)"]],"r":[[["T","T"],["T","T"],["T","T"],["F","F"],["F","F"],["F","F"],["F","F"],["T","T"]],[["T","T"],["F","F"],["F","F"],["T","T"],["F","F"],["T","T"],["T","T"],["T","T"]],[["F","F"],["T","T"],["F","F"],["T","T"],["T","T"],["F","F"],["T","T"],["T","T"]],[["F","F"],["F","F"],["F","F"],["T","T"],["T","T"],["T","T"],["T","T"],["T","T"]]]}]},{"t":["Equivalence Laws & Proofs","قوانين التكافؤ المنطقي والبراهين"],"b":[{"k":"p","x":["Equivalence can be established either by constructing truth tables or by using Equivalence Laws:","يمكن إثبات التكافؤ إما ببناء جداول الصدق أو باستخدام قوانين التكافؤ (Equivalence Laws):"]},{"k":"tbl","h":[["Law","القانون"],["Statement","العبارة"]],"r":[[["Identity laws","قوانين المحايد (Identity)"],["P ∧ T ≡ P  ,  P ∨ F ≡ P","P ∧ T ≡ P  ,  P ∨ F ≡ P"]],[["Domination laws","قوانين السيطرة (Domination)"],["P ∧ F ≡ F  ,  P ∨ T ≡ T","P ∧ F ≡ F  ,  P ∨ T ≡ T"]],[["Idempotent laws","قوانين اللا-قوة (Idempotent)"],["P ∧ P ≡ P  ,  P ∨ P ≡ P","P ∧ P ≡ P  ,  P ∨ P ≡ P"]],[["Double negation law","قانون النفي المزدوج (Double Negation)"],["¬(¬P) ≡ P","¬(¬P) ≡ P"]],[["Commutative laws","قوانين الإبدال (Commutative)"],["P ∧ Q ≡ Q ∧ P  ,  P ∨ Q ≡ Q ∨ P","P ∧ Q ≡ Q ∧ P  ,  P ∨ Q ≡ Q ∨ P"]],[["Associative laws","قوانين الدمج (Associative)"],["P ∧ (Q ∧ R) ≡ (P ∧ Q) ∧ R","P ∧ (Q ∧ R) ≡ (P ∧ Q) ∧ R"]],[["Distributive laws","قوانين التوزيع (Distributive)"],["P ∧ (Q ∨ R) ≡ (P ∧ Q) ∨ (P ∧ R)\nP ∨ (Q ∧ R) ≡ (P ∨ Q) ∧ (P ∨ R)","P ∧ (Q ∨ R) ≡ (P ∧ Q) ∨ (P ∧ R)\nP ∨ (Q ∧ R) ≡ (P ∨ Q) ∧ (P ∨ R)"]],[["De Morgan's laws","قوانين دي مورجان (De Morgan's)"],["¬(P ∧ Q) ≡ (¬P) ∨ (¬Q)\n¬(P ∨ Q) ≡ (¬P) ∧ (¬Q)","¬(P ∧ Q) ≡ (¬P) ∨ (¬Q)\n¬(P ∨ Q) ≡ (¬P) ∧ (¬Q)"]],[["Law with implication","قانون الاستلزام (Implication Law)"],["P → Q ≡ ¬P ∨ Q","P → Q ≡ ¬P ∨ Q"]]]},{"k":"p","x":["Exercise 1 (Slide 35): Show that P → Q ≡ ¬P ∨ Q by truth table (notice the last two columns are identical):","التمرين 1 (شريحة 35): أثبت أن P → Q ≡ ¬P ∨ Q باستخدام جدول الصدق (لاحظ تطابق العمودين الأخيرين):"]},{"k":"tbl","h":[["P","P"],["Q","Q"],["¬P","¬P"],["P → Q","P → Q"],["¬P ∨ Q","¬P ∨ Q"]],"r":[[["T","T"],["T","T"],["F","F"],["T","T"],["T","T"]],[["T","T"],["F","F"],["F","F"],["F","F"],["F","F"]],[["F","F"],["T","T"],["T","T"],["T","T"],["T","T"]],[["F","F"],["F","F"],["T","T"],["T","T"],["T","T"]]]},{"k":"p","x":["Exercise 2 (Slide 35): Show that (P → Q) ∧ (P → R) ≡ P → (Q ∧ R) by equivalence laws:","التمرين 2 (شريحة 35): أثبت أن (P → Q) ∧ (P → R) ≡ P → (Q ∧ R) باستخدام قوانين التكافؤ:"]},{"k":"formula","x":"(P → Q) ∧ (P → R)\n≡ (¬P ∨ Q) ∧ (¬P ∨ R)     [Law with implication on LHS]\n≡ ¬P ∨ (Q ∧ R)            [Distributive law on LHS]\n≡ P → (Q ∧ R)             [Law with implication on RHS]"}]},{"t":["Worked Examples & Practice","أمثلة محلولة وتمارين"],"b":[{"k":"ex","x":["Is (P ∧ Q) → P a tautology?\nRows PQ = TT, TF, FT, FF:\nP ∧ Q       :  T F F F\n(P ∧ Q) → P :  T T T T\nEvery row is T, so YES. (If both are true then P is true; otherwise the premise is false and the implication is automatically true.)","هل (P ∧ Q) → P تحصيل حاصل (Tautology)؟\nالصفوف PQ = TT, TF, FT, FF:\nP ∧ Q       :  T F F F\n(P ∧ Q) → P :  T T T T\nكل الصفوف T، إذن نعم. (لو الاثنين صح فـ P صح، وغير كده المقدمة خطأ فيكون التضمين صحيحًا تلقائيًا.)"]},{"k":"try","q":["Is P ∧ ¬P a tautology, a contradiction, or neither?","هل P ∧ ¬P تحصيل حاصل أم تناقض أم غير ذلك؟"],"a":["Contradiction: P and ¬P are never both true, so every row is F.","تناقض (Contradiction): P و¬P ما بيتحققوا مع بعض أبدًا، فكل الصفوف F."]},{"k":"try","q":["Translate: \"I pass if I study or I am lucky.\" (P: pass, Q: study, R: lucky)","ترجم: \"أنجح لو ذاكرت أو كنت محظوظًا.\" (P: أنجح، Q: أذاكر، R: محظوظ)"],"a":["(Q ∨ R) → P","(Q ∨ R) → P"]}]}],"take":[["A proposition is a declarative statement that is either T or F (not both). Requests/commands ('Please do not fall asleep') and open sentences ('y > 5') are NOT propositions.","القضية جملة خبرية إما T أو F (وليس كلاهما). الطلبات ('Please do not fall asleep') والجمل المفتوحة ('y > 5') ليست قضايا."],["A Tautology is always true (e.g., R ∨ ¬R); a Contradiction is always false (e.g., R ∧ ¬R). Their negations flip one into the other.","التحصيل الحاصل (Tautology) صحيح دائماً (مثل R ∨ ¬R)، والتناقض (Contradiction) خاطئ دائماً (مثل R ∧ ¬R)، ونفي أحدهما يعطي الآخر."],["Two statements S1 and S2 are logically equivalent (S1 ≡ S2) iff they have the same truth table, OR S1 ↔ S2 is a tautology.","تكون العبارتان S1 و S2 متكافئتين منطقيًا (S1 ≡ S2) إذا كان لهما نفس جدول الصدق، أو إذا كانت S1 ↔ S2 تمثل Tautology."],["Operator precedence from highest to lowest: (), ¬, ∧, ∨, →, ↔.","أسبقية العمليات من الأعلى للأدنى: ()، ¬، ∧، ∨، →، ↔."],["P → Q ≡ ¬P ∨ Q is false ONLY when P is T and Q is F. P ⊕ Q (XOR) is true ONLY when P and Q differ.","العبارة P → Q ≡ ¬P ∨ Q تكون خاطئة فقط عندما P=T و Q=F. وعملية XOR (⊕) تكون صحيحة فقط عند اختلاف القيمتين."]],"fc":[[["What is a proposition?","ما هي القضية (Proposition)؟"],["A declarative statement that is either true (T) or false (F), but not both.","جملة خبرية إما أن تكون صحيحة (T) أو خاطئة (F)، وليس كلاهما معًا."]],[["What is a propositional function (open sentence)? Give an example.","ما هي الدالة القضوية (الجملة المفتوحة)؟ اذكر مثالاً."],["A statement with one or more variables whose truth value depends on the variable's value, e.g., 'y > 5'.","عبارة بمتغير أو أكثر تعتمد قيمتها الصدقية على قيمة المتغير، مثل 'y > 5'."]],[["Is 'Please do not fall asleep' a proposition? Why?","هل جملة 'Please do not fall asleep' قضية؟ ولماذا؟"],["No, because it is a request (not a declarative statement), and only statements can be propositions.","لا، لأنها طلب وليست جملة خبرية، والعبارات الخبرية فقط يمكن أن تكون قضايا."]],[["Is 'x < y if and only if y > x' a proposition? Why?","هل 'x < y if and only if y > x' قضية؟ ولماذا؟"],["Yes (and its truth value is True), because its truth value does not depend on specific values of x and y.","نعم (وقيمتها الصدقية True)، لأن صحتها لا تعتمد على قيم محددة للمتغيرين x و y."]],[["When is the conjunction P ∧ Q true?","متى تكون عبارة الاقتران P ∧ Q صحيحة؟"],["Only when both P and Q are true (T).","فقط عندما تكون P و Q صحيحتين (T) معًا."]],[["When is the disjunction P ∨ Q false?","متى تكون عبارة الفصل P ∨ Q خاطئة؟"],["Only when both P and Q are false (F).","فقط عندما تكون P و Q خاطئتين (F) معًا."]],[["When is Exclusive-Or (P ⊕ Q) true?","متى تكون عملية أو الحصرية (P ⊕ Q) صحيحة؟"],["When P and Q have different truth values (one T and one F). It is F when both are T or both are F.","عندما تختلف قيمتا P و Q (واحدة T والأخرى F)، وتكون F إذا تشابهتا."]],[["When is the implication P → Q false?","متى تكون عبارة الاستلزام P → Q خاطئة؟"],["Only when P is true (T) and Q is false (F). Whenever P is false, P → Q is true.","فقط عندما تكون P صحيحة (T) و Q خاطئة (F). وإذا كانت P خاطئة فإن P → Q صحيحة دائمًا."]],[["When is the biconditional P ↔ Q true?","متى تكون عبارة الشرط الثنائي P ↔ Q صحيحة؟"],["When P and Q have the same truth value (both T or both F).","عندما يكون لـ P و Q نفس القيمة الصدقية (كلاهما T أو كلاهما F)."]],[["List the logical operators in order of precedence from highest to lowest.","رتب العمليات المنطقية حسب الأسبقية من الأعلى إلى الأدنى."],["(), ¬, ∧, ∨, →, ↔.","()، ¬، ∧، ∨، →، ↔."]],[["Translate: 'To take discrete math (P), you must have taken calculus (Q) or CS (R).'","ترجم: 'لأخذ الرياضيات المتقطعة (P)، يجب أن تكون قد أخذت التفاضل (Q) أو علوم الحاسوب (R).'"],["P → (Q ∨ R).","P → (Q ∨ R)."]],[["Why do we use XOR (⊕) in the Acme Motor Company car promotion example?","لماذا نستخدم XOR (⊕) في مثال عرض شركة السيارات Acme؟"],["Because of natural language ambiguity: 'or' here means you get $2000 cash back OR a 2% loan, not both: P → (Q ⊕ R).","بسبب غموض اللغة الطبيعية: كلمة 'أو' في العرض تعني الحصول على الكاش أو القرض، وليس كليهما معًا: P → (Q ⊕ R)."]],[["What is a Tautology? Give two examples from the slides.","ما هو التحصيل الحاصل (Tautology)؟ اذكر مثالين من الشرائح."],["A statement that is always true. Examples: R ∨ (¬R) and ¬(P ∧ Q) ↔ (¬P) ∨ (¬Q).","عبارة منطقية صحيحة دائمًا. أمثلة: R ∨ (¬R) وكذلك ¬(P ∧ Q) ↔ (¬P) ∨ (¬Q)."]],[["What is a Contradiction? Give an example from the slides.","ما هو التناقض (Contradiction)؟ اذكر مثالاً من الشرائح."],["A statement that is always false. Example: R ∧ (¬R).","عبارة منطقية خاطئة دائمًا. مثال: R ∧ (¬R)."]],[["What is the negation of a tautology, and what is the negation of a contradiction?","ما هو نفي الـ Tautology، وما هو نفي الـ Contradiction؟"],["The negation of a tautology is a contradiction, and the negation of a contradiction is a tautology.","نفي الـ Tautology هو Contradiction، ونفي الـ Contradiction هو Tautology."]],[["State the two ways to define that S1 and S2 are logically equivalent (S1 ≡ S2).","اذكر الطريقتين لتعريف التكافؤ المنطقي بين عبارتين (S1 ≡ S2)."],["1) They have the same truth table, OR 2) S1 ⇔ S2 (S1 ↔ S2) is a tautology.","1) أن يكون لهما نفس جدول الصدق، أو 2) أن تكون العبارة S1 ⇔ S2 تحصيل حاصل (Tautology)."]],[["What are the two methods used to establish (prove) logical equivalence?","ما الطريقتان المستخدمتان لإثبات التكافؤ المنطقي؟"],["1) Constructing truth tables, or 2) Using equivalence laws.","1) بناء جداول الصدق، أو 2) استخدام قوانين التكافؤ."]],[["State the Identity law and the Domination law for ∧.","اذكر قانون المحايد (Identity) وقانون السيطرة (Domination) لعملية ∧."],["Identity: P ∧ T ≡ P. Domination: P ∧ F ≡ F.","المحايد: P ∧ T ≡ P. السيطرة: P ∧ F ≡ F."]],[["State the Idempotent law and Double Negation law.","اذكر قانون اللا-قوة (Idempotent) وقانون النفي المزدوج."],["Idempotent: P ∧ P ≡ P. Double negation: ¬(¬P) ≡ P.","اللا-قوة: P ∧ P ≡ P. النفي المزدوج: ¬(¬P) ≡ P."]],[["State De Morgan's law for ¬(P ∧ Q).","اذكر قانون دي مورجان للعبارة ¬(P ∧ Q)."],["¬(P ∧ Q) ≡ (¬P) ∨ (¬Q).","¬(P ∧ Q) ≡ (¬P) ∨ (¬Q)."]],[["State the Law with Implication.","اذكر قانون الاستلزام (Law with implication)."],["P → Q ≡ ¬P ∨ Q.","P → Q ≡ ¬P ∨ Q."]],[["Which two laws are used to prove (P → Q) ∧ (P → R) ≡ P → (Q ∧ R)?","ما القانونان المستخدمان لإثبات (P → Q) ∧ (P → R) ≡ P → (Q ∧ R)؟"],["The law with implication (on both sides) and the distributive law.","قانون الاستلزام (على الطرفين) وقانون التوزيع (Distributive law)."]],[["How do you prove P → Q ≡ ¬P ∨ Q in the lecture?","كيف تثبت التكافؤ P → Q ≡ ¬P ∨ Q كما في المحاضرة؟"],["Construct a truth table and verify that the columns P → Q and ¬P ∨ Q match in every row.","أنشئ جدول صدق وتحقق من تطابق عمودي P → Q و¬P ∨ Q في كل صف."]],[["What are the key transformations in the proof of (P → Q) ∧ (P → R) ≡ P → (Q ∧ R)?","ما التحويلات الأساسية في إثبات (P → Q) ∧ (P → R) ≡ P → (Q ∧ R)؟"],["Replace implications with ¬P ∨ Q and ¬P ∨ R, apply the distributive law, then rewrite ¬P ∨ (Q ∧ R) as P → (Q ∧ R).","استبدل الاستلزامين بـ ¬P ∨ Q و¬P ∨ R، ثم طبّق قانون التوزيع، وبعدها أعد كتابة ¬P ∨ (Q ∧ R) على صورة P → (Q ∧ R)."]],[["What must each line of an equivalence-law proof show?","ما الذي ينبغي أن توضحه كل خطوة في برهان بقوانين التكافؤ؟"],["A valid equivalence transformation, ideally naming the law used on that line.","تحويلًا صحيحًا يحافظ على التكافؤ، مع تسمية القانون المستخدم في الخطوة."]]],"quiz":[{"q":["Which of the following is NOT a proposition?","أي مما يلي ليس قضية (Not a proposition)؟"],"o":[["\"Elephants are bigger than mice.\"","\"الفيلة أكبر من الفئران.\""],["\"520 < 111\"","\"520 < 111\""],["\"Please do not fall asleep.\"","\"من فضلك لا تنم.\""],["\"Today is May 27 and 99 < 5\"","\"اليوم 27 مايو و 99 < 5\""]],"a":2},{"q":["Why is 'y > 5' called a propositional function (open sentence) rather than a proposition?","لماذا تُسمى 'y > 5' دالة قضوية (جملة مفتوحة) وليست قضية؟"],"o":[["Because it contains a number","لأنها تحتوي على رقم"],["Because its truth value depends on the unspecified value of y","لأن قيمتها الصدقية تعتمد على قيمة y غير المحددة"],["Because it is always false","لأنها خاطئة دائمًا"],["Because it is a request","لأنها جملة طلب"]],"a":1},{"q":["What is the truth value of the statement 'x < y if and only if y > x'?","ما القيمة الصدقية للعبارة 'x < y if and only if y > x'؟"],"o":[["True (it is a proposition because its truth does not depend on specific values of x and y)","صحيحة (وهي قضية لأن صدقها لا يعتمد على قيم محددة لـ x و y)"],["False","خاطئة"],["It is not a proposition","ليست قضية"],["Depends on x and y","تعتمد على قيمتي x و y"]],"a":0},{"q":["What is the truth value of 'If the moon is made of cheese, then I will be rich'?","ما القيمة الصدقية لجملة 'إذا كان القمر مصنوعًا من الجبن، فسأكون غنيًا'؟"],"o":[["False, because the moon is not made of cheese","خاطئة، لأن القمر ليس من الجبن"],["Not a proposition","ليست قضية"],["True (an implication with a false hypothesis is true)","صحيحة (لأن الاستلزام الذي مقدمته خاطئة يكون صحيحًا)"],["Both true and false","صحيحة وخاطئة معًا"]],"a":2},{"q":["When is the exclusive-or statement P ⊕ Q equal to False (F)?","متى تكون عبارة أو الحصرية P ⊕ Q خاطئة (F)؟"],"o":[["When P is T and Q is F","عندما P=T و Q=F"],["When P is F and Q is T","عندما P=F و Q=T"],["When P and Q have the same truth value (both T or both F)","عندما تتطابق قيمتا P و Q (كلاهما T أو كلاهما F)"],["Only when both P and Q are T","فقط عندما يكون كلاهما T"]],"a":2},{"q":["In which case is the implication P → Q equal to False (F)?","في أي حالة تكون عبارة الاستلزام P → Q خاطئة (F)؟"],"o":[["When P is F and Q is T","عندما P=F و Q=T"],["When P is T and Q is F","عندما P=T و Q=F"],["When both P and Q are F","عندما يكون كلاهما F"],["When both P and Q are T","عندما يكون كلاهما T"]],"a":1},{"q":["When is the biconditional statement P ↔ Q equal to True (T)?","متى تكون عبارة الشرط الثنائي P ↔ Q صحيحة (T)؟"],"o":[["When P and Q have the same truth value (both T or both F)","عندما يكون لـ P و Q نفس القيمة الصدقية (كلاهما T أو كلاهما F)"],["Only when both P and Q are T","فقط عندما يكون كلاهما T"],["When P and Q have different truth values","عندما تختلف قيمتا P و Q"],["Only when P is F","فقط عندما تكون P خاطئة"]],"a":0},{"q":["What is a Tautology?","ما هو التحصيل الحاصل (Tautology)؟"],"o":[["A statement that is always false","عبارة خاطئة دائمًا"],["A statement that is always true","عبارة صحيحة دائمًا"],["A statement whose truth depends on a variable","عبارة يعتمد صدقها على متغير"],["A request or command","طلب أو أمر"]],"a":1},{"q":["Which of the following is an example of a Tautology?","أي مما يلي يُعد مثالاً على التحصيل الحاصل (Tautology)؟"],"o":[["R ∧ (¬R)","R ∧ (¬R)"],["R ∨ (¬R)","R ∨ (¬R)"],["P ∧ F","P ∧ F"],["P → Q","P → Q"]],"a":1},{"q":["What is a Contradiction, and which of these is an example?","ما هو التناقض (Contradiction)، وأي مما يلي مثال عليه؟"],"o":[["Always true; e.g. R ∨ (¬R)","صحيحة دائمًا؛ مثل R ∨ (¬R)"],["Always false; e.g. R ∧ (¬R)","خاطئة دائمًا؛ مثل R ∧ (¬R)"],["Sometimes true; e.g. P ∨ Q","صحيحة أحيانًا؛ مثل P ∨ Q"],["Always true; e.g. P → P","صحيحة دائمًا؛ مثل P → P"]],"a":1},{"q":["The negation of any tautology is a ______, and the negation of any contradiction is a ______.","نفي أي Tautology هو ______، ونفي أي Contradiction هو ______."],"o":[["tautology, contradiction","تحصيل حاصل، تناقض"],["contradiction, tautology","تناقض، تحصيل حاصل"],["proposition, open sentence","قضية، جملة مفتوحة"],["equivalence, implication","تكافؤ، استلزام"]],"a":1},{"q":["Two statements S1 and S2 are logically equivalent (S1 ≡ S2) if and only if:","تكون العبارتان S1 و S2 متكافئتين منطقيًا (S1 ≡ S2) إذا وفقط إذا:"],"o":[["S1 ∧ S2 is a contradiction","كانت S1 ∧ S2 تناقضًا"],["S1 ⇔ S2 is a tautology (they have the same truth table)","كانت S1 ⇔ S2 تحصيل حاصل Tautology (لهما نفس جدول الصدق)"],["Both S1 and S2 are tautologies","كانت S1 و S2 كلتاهما Tautology"],["S1 → S2 is true","كانت S1 → S2 صحيحة"]],"a":1},{"q":["In the Acme Motor Company exercise ('get $2000 cash back or a 2% loan'), why is XOR (⊕) used instead of OR (∨)?","في تمرين شركة Acme للسيارات ('تحصل على 2000$ نقداً أو قرض 2%')، لماذا استُخدمت XOR بدلاً من OR؟"],"o":[["Because XOR has higher precedence","لأن XOR لها أسبقية أعلى"],["To illustrate the ambiguity of natural languages (you get one offer or the other, not both)","لتوضيح غموض اللغات الطبيعية (تحصل على أحد العرضين وليس كليهما)"],["Because cash and loans are both false","لأن الكاش والقرض كلاهما خاطئ"],["Because OR cannot be used with implications","لأن OR لا يمكن استخدامها مع الاستلزام"]],"a":1},{"q":["Translate: 'To take discrete mathematics (P), you must have taken calculus (Q) or a course in CS (R).'","ترجم: 'لأخذ الرياضيات المتقطعة (P)، يجب أن تكون قد أخذت التفاضل (Q) أو مقرر حاسوب (R).'"],"o":[["(Q ∨ R) → P","(Q ∨ R) → P"],["P → (Q ∨ R)","P → (Q ∨ R)"],["P ∧ (Q ∨ R)","P ∧ (Q ∨ R)"],["P ↔ (Q ∧ R)","P ↔ (Q ∧ R)"]],"a":1},{"q":["According to operator precedence, in what order are operators evaluated (highest to lowest)?","حسب قواعد أسبقية العمليات، ما الترتيب الصحيح للتنفيذ من الأعلى إلى الأدنى؟"],"o":[["(), ¬, ∧, ∨, →, ↔","(), ¬, ∧, ∨, →, ↔"],["(), ∧, ∨, ¬, →, ↔","(), ∧, ∨, ¬, →, ↔"],["¬, (), ∨, ∧, ↔, →","¬, (), ∨, ∧, ↔, →"],["(), →, ↔, ¬, ∧, ∨","(), →, ↔, ¬, ∧, ∨"]],"a":0},{"q":["Which law states that P ∧ F ≡ F?","أي قانون ينص على أن P ∧ F ≡ F؟"],"o":[["Identity law","قانون المحايد (Identity)"],["Idempotent law","قانون اللا-قوة (Idempotent)"],["Domination law","قانون السيطرة (Domination)"],["De Morgan's law","قانون دي مورجان"]],"a":2},{"q":["Which law states that P ∧ T ≡ P?","أي قانون ينص على أن P ∧ T ≡ P؟"],"o":[["Identity law","قانون المحايد (Identity)"],["Domination law","قانون السيطرة (Domination)"],["Commutative law","قانون الإبدال"],["Associative law","قانون الدمج"]],"a":0},{"q":["By De Morgan's law, ¬(P ∧ Q) is logically equivalent to:","حسب قانون دي مورجان، فإن ¬(P ∧ Q) تكافئ منطقيًا:"],"o":[["(¬P) ∧ (¬Q)","(¬P) ∧ (¬Q)"],["(¬P) ∨ (¬Q)","(¬P) ∨ (¬Q)"],["¬P → Q","¬P → Q"],["P ∨ Q","P ∨ Q"]],"a":1},{"q":["Which equivalence correctly expresses the Law with Implication?","أي تكافؤ يعبّر بشكل صحيح عن قانون الاستلزام (Law with implication)؟"],"o":[["P → Q ≡ ¬P ∨ Q","P → Q ≡ ¬P ∨ Q"],["P → Q ≡ P ∨ ¬Q","P → Q ≡ P ∨ ¬Q"],["P → Q ≡ ¬P ∧ Q","P → Q ≡ ¬P ∧ Q"],["P → Q ≡ ¬(P ∧ Q)","P → Q ≡ ¬(P ∧ Q)"]],"a":0},{"q":["In proving (P → Q) ∧ (P → R) ≡ P → (Q ∧ R), which law transforms (¬P ∨ Q) ∧ (¬P ∨ R) into ¬P ∨ (Q ∧ R)?","في إثبات (P → Q) ∧ (P → R) ≡ P → (Q ∧ R)، أي قانون يحوّل (¬P ∨ Q) ∧ (¬P ∨ R) إلى ¬P ∨ (Q ∧ R)؟"],"o":[["Associative law","قانون الدمج"],["De Morgan's law","قانون دي مورجان"],["Distributive law","قانون التوزيع (Distributive)"],["Idempotent law","قانون اللا-قوة"]],"a":2},{"q":["Which expression is equivalent to P → Q?","أي تعبير يكافئ P → Q؟"],"o":[["P ∧ Q","P ∧ Q"],["¬P ∨ Q","¬P ∨ Q"],["P ∨ ¬Q","P ∨ ¬Q"],["¬P ∧ Q","¬P ∧ Q"]],"a":1},{"q":["Which law is used to transform (¬P ∨ Q) ∧ (¬P ∨ R) into ¬P ∨ (Q ∧ R)?","أي قانون يحوّل (¬P ∨ Q) ∧ (¬P ∨ R) إلى ¬P ∨ (Q ∧ R)؟"],"o":[["Associative law","قانون التجميع"],["Distributive law","قانون التوزيع"],["Double negation","النفي المزدوج"],["Idempotent law","قانون التكرار"]],"a":1}]},{"id":"l2","n":2,"title":["Propositional Functions and Quantifiers","الدوال القضوية والمحددات الكمية (Lectures 3 & Tutorial 2)"],"obj":[["Define propositional functions (open sentences) and understand variable instantiation.","تعريف الدوال القضوية (الجملة المفتوحة) وفهم تعويض وتخصيص قيم المتغيرات (Instantiation)."],["Define Universal (∀) and Existential (∃) quantifiers and interpret their meanings.","تعريف المحددات الكمية الشاملة (∀) والوجودية (∃) وتفسير معانيها."],["Solve and verify all 11 problems from Tutorial 2 regarding quantifiers and domains.","حل والتحقق من جميع مسائل التوتوريال 11 الخاصة بالمحددات الكمية ونطاقات الخطاب."],["Apply Disproof by Counterexample to universally quantified statements.","تطبيق طريقة الإثبات بمثال مضاد (Disproof by Counterexample) على العبارات الشاملة."],["Apply De Morgan's laws for quantifiers to correctly negate quantified expressions.","تطبيق قوانين دي مورجان للمحددات الكمية لنفي التعبيرات المُحَدَّدة كميًا بشكل صحيح."],["Read, translate, and interpret nested quantifiers and logical arguments (e.g. Hummingbirds problem).","قراءة وترجمة وتفسير المحددات الكمية المتداخلة والحجج المنطقية (مثل مسألة الطيور الطنانة)."]],"sec":[{"t":["In Simple Words + Pictures","ببساطة + رسومات"],"b":[{"k":"eli","x":["∀ means \"for every one\", so a single failure kills it. ∃ means \"at least one\", so a single success is enough. To negate: swap ∀ ↔ ∃ and negate the inside.","∀ معناها \"لكل\"، فحالة فاشلة واحدة تبطلها. ∃ معناها \"يوجد على الأقل واحد\"، فحالة ناجحة واحدة تكفي. للنفي: بدّل ∀ ↔ ∃ وانفِ ما بالداخل."]},{"k":"vis","x":"<svg viewBox=\"0 0 334 128\" width=\"334\" style=\"max-width:100%;height:auto\" font-family=\"Inter,Cairo,sans-serif\" font-size=\"13\" fill=\"currentColor\"><svg viewBox=\"0 0 334 138\" width=\"334\" style=\"max-width:100%;height:auto\" font-family=\"Inter,Cairo,sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"6\" y=\"28\" text-anchor=\"start\" font-weight=\"600\">P(x): x < 5</text><circle cx=\"130\" cy=\"24\" r=\"12\" fill=\"#4ade80\" fill-opacity=\".6\" stroke=\"#4ade80\"/><text x=\"130\" y=\"28\" text-anchor=\"middle\" >1</text><circle cx=\"164\" cy=\"24\" r=\"12\" fill=\"#4ade80\" fill-opacity=\".6\" stroke=\"#4ade80\"/><text x=\"164\" y=\"28\" text-anchor=\"middle\" >2</text><circle cx=\"198\" cy=\"24\" r=\"12\" fill=\"#4ade80\" fill-opacity=\".6\" stroke=\"#4ade80\"/><text x=\"198\" y=\"28\" text-anchor=\"middle\" >3</text><circle cx=\"232\" cy=\"24\" r=\"12\" fill=\"#4ade80\" fill-opacity=\".6\" stroke=\"#4ade80\"/><text x=\"232\" y=\"28\" text-anchor=\"middle\" >4</text><circle cx=\"266\" cy=\"24\" r=\"12\" fill=\"#f87171\" fill-opacity=\".6\" stroke=\"#f87171\"/><text x=\"266\" y=\"28\" text-anchor=\"middle\" >5</text><circle cx=\"300\" cy=\"24\" r=\"12\" fill=\"#f87171\" fill-opacity=\".6\" stroke=\"#f87171\"/><text x=\"300\" y=\"28\" text-anchor=\"middle\" >6</text><text x=\"6\" y=\"68\" text-anchor=\"start\" font-weight=\"600\">P(x): x > 0</text><circle cx=\"130\" cy=\"64\" r=\"12\" fill=\"#4ade80\" fill-opacity=\".6\" stroke=\"#4ade80\"/><text x=\"130\" y=\"68\" text-anchor=\"middle\" >1</text><circle cx=\"164\" cy=\"64\" r=\"12\" fill=\"#4ade80\" fill-opacity=\".6\" stroke=\"#4ade80\"/><text x=\"164\" y=\"68\" text-anchor=\"middle\" >2</text><circle cx=\"198\" cy=\"64\" r=\"12\" fill=\"#4ade80\" fill-opacity=\".6\" stroke=\"#4ade80\"/><text x=\"198\" y=\"68\" text-anchor=\"middle\" >3</text><circle cx=\"232\" cy=\"64\" r=\"12\" fill=\"#4ade80\" fill-opacity=\".6\" stroke=\"#4ade80\"/><text x=\"232\" y=\"68\" text-anchor=\"middle\" >4</text><circle cx=\"266\" cy=\"64\" r=\"12\" fill=\"#4ade80\" fill-opacity=\".6\" stroke=\"#4ade80\"/><text x=\"266\" y=\"68\" text-anchor=\"middle\" >5</text><circle cx=\"300\" cy=\"64\" r=\"12\" fill=\"#4ade80\" fill-opacity=\".6\" stroke=\"#4ade80\"/><text x=\"300\" y=\"68\" text-anchor=\"middle\" >6</text><text x=\"6\" y=\"108\" text-anchor=\"start\" font-weight=\"600\">P(x): x > 9</text><circle cx=\"130\" cy=\"104\" r=\"12\" fill=\"#f87171\" fill-opacity=\".6\" stroke=\"#f87171\"/><text x=\"130\" y=\"108\" text-anchor=\"middle\" >1</text><circle cx=\"164\" cy=\"104\" r=\"12\" fill=\"#f87171\" fill-opacity=\".6\" stroke=\"#f87171\"/><text x=\"164\" y=\"108\" text-anchor=\"middle\" >2</text><circle cx=\"198\" cy=\"104\" r=\"12\" fill=\"#f87171\" fill-opacity=\".6\" stroke=\"#f87171\"/><text x=\"198\" y=\"108\" text-anchor=\"middle\" >3</text><circle cx=\"232\" cy=\"104\" r=\"12\" fill=\"#f87171\" fill-opacity=\".6\" stroke=\"#f87171\"/><text x=\"232\" y=\"108\" text-anchor=\"middle\" >4</text><circle cx=\"266\" cy=\"104\" r=\"12\" fill=\"#f87171\" fill-opacity=\".6\" stroke=\"#f87171\"/><text x=\"266\" y=\"108\" text-anchor=\"middle\" >5</text><circle cx=\"300\" cy=\"104\" r=\"12\" fill=\"#f87171\" fill-opacity=\".6\" stroke=\"#f87171\"/><text x=\"300\" y=\"108\" text-anchor=\"middle\" >6</text></svg></svg>","c":["Domain {1..6}. Green = P(x) true, red = false. ∀ needs ALL green; ∃ needs at least ONE green. Row 1: ∀ false, ∃ true. Row 2: both true. Row 3: both false.","المجال {1..6}. الأخضر = P(x) صحيحة، الأحمر = خاطئة. ∀ تحتاج الكل أخضر، و∃ تحتاج واحد أخضر على الأقل. الصف 1: ∀ خاطئة و∃ صحيحة. الصف 2: الاثنتان صحيحتان. الصف 3: الاثنتان خاطئتان."]}]},{"t":["Propositional Functions (Open Sentences)","الدوال القضوية (الجمل المفتوحة)"],"b":[{"k":"def","x":["A propositional function (or open sentence) is a statement involving one or more variables, such as 'x - 3 > 5' or 'y > 5'.\n• Let us call this propositional function P(x), where P is the predicate and x is the variable.","الدالة القضوية (أو الجملة المفتوحة) هي عبارة تحتوي على متغير واحد أو أكثر، مثل 'x - 3 > 5' أو 'y > 5'.\n• لنسمِ هذه الدالة القضوية P(x)، حيث P هو المحمول (Predicate) و x هو المتغير."]},{"k":"p","x":["• When a variable is given a specific value, it is said to be instantiated.\n• The truth value of a propositional function depends on the value of its variable. For example, with P(x) as 'x - 3 > 5':\n  - P(2) is false\n  - P(8) is false\n  - P(9) is true","• عندما يُعطى المتغير قيمة محددة، يقال إنه تم تعويضه أو تخصيصه (Instantiated).\n• تعتمد القيمة الصدقية للدالة القضوية على قيمة متغيرها. فمثلاً مع P(x) كالتالي 'x - 3 > 5':\n  - P(2) خاطئة\n  - P(8) خاطئة\n  - P(9) صحيحة"]}]},{"t":["Universal Quantification (∀)","المحدد الكمي الشامل (∀)"],"b":[{"k":"def","x":["Let P(x) be a predicate. The universally quantified sentence states that P(x) is true for all x in the universe of discourse.\n• Symbol: ∀x P(x), read as 'for all x P(x)' or 'for every x P(x)'.\n• Note: ∀x P(x) is a proposition (either true or false), NOT a propositional function.","لتكن P(x) دالة قضوية. تعبر العبارة الشاملة عن أن P(x) صحيحة لكل x في مجال الخطاب (Universe of discourse).\n• الرمز: ∀x P(x)، وتُقرأ 'لكل x P(x)' أو 'من أجل كل x P(x)'.\n• ملاحظة: العبارة ∀x P(x) بحد ذاتها قضية (صحيحة أو خاطئة)، وليست دالة قضوية."]},{"k":"ex","x":["Example (ISU Students):\nLet universe of discourse be all people. S(x): x is an ISU student. G(x): x is a genius.\n• What does ∀x (S(x) → G(x)) mean?\n'If x is an ISU student, then x is a genius' or 'All ISU students are geniuses'.\n• If the universe of discourse is restricted to all ISU students, the same statement can be written simply as ∀x G(x).","مثال (طلاب جامعة ISU):\nلتكن مجموعة الخطاب كل الناس. ولتكن S(x): شخص x طالب في ISU. ولتكن G(x): شخص x عبقري.\n• ماذا تعني ∀x (S(x) → G(x))؟\n'إذا كان x طالباً في ISU فهو عبقري' أو 'كل طلاب ISU أعبياء'.\n• إذا كان مجال الخطاب محصوراً في طلاب ISU وحدهم، يمكن كتابة العبارة ببساطة على شكل ∀x G(x)."]}]},{"t":["Existential Quantification (∃)","المحدد الكمي الوجودي (∃)"],"b":[{"k":"def","x":["An existentially quantified sentence states that there exists an x in the universe of discourse for which P(x) is true.\n• Symbol: ∃x P(x), read as 'There is an x such that P(x)' or 'There is at least one x such that P(x)'.\n• Note: ∃x P(x) is a proposition.","تُعبر العبارة الوجودية عن وجود عنصر x واحد على الأقل في مجال الخطاب تكون عنده P(x) صحيحة.\n• الرمز: ∃x P(x)، وتُقرأ 'يوجد x بحيث P(x)' أو 'هناك على الأقل x واحد يحقق P(x)'.\n• ملاحظة: العبارة ∃x P(x) هي قضية."]},{"k":"ex","x":["Example:\nP(x): x is an ISU professor. G(x): x is a genius.\n• ∃x (P(x) ∧ G(x)) means: 'There is an x such that x is an ISU professor and x is a genius' or 'At least one ISU professor is a genius'.","مثال:\nP(x): x أستاذ في ISU. ولتكن G(x): x عبقري.\n• العبارة ∃x (P(x) ∧ G(x)) تعني: 'يوجد x بحيث يكون أستاذاً في ISU وعبقرياً' أو 'أستاذ واحد على الأقل في ISU عبقري'."]}]},{"t":["Tutorial 2: Key Problems","تمارين Tutorial 2: أهم المسائل"],"b":[{"k":"qa","q":["P(x): x + 1 > x over ℝ. Truth value of ∀x P(x)?","P(x): x + 1 > x على ℝ. ما قيمة ∀x P(x)؟"],"a":["True: it holds for every real number.","صحيحة: تتحقق لكل عدد حقيقي."]},{"k":"qa","q":["Q(x): x < 2 over ℝ. Truth value of ∀x Q(x)?","Q(x): x < 2 على ℝ. ما قيمة ∀x Q(x)؟"],"a":["False: counterexample x = 3.","خاطئة: مثال مضاد x = 3."]},{"k":"qa","q":["P(x): x² < 10, domain {1,2,3,4}. ∀x P(x)?","P(x): x² < 10، المجال {1,2,3,4}. ∀x P(x)؟"],"a":["False. It means P(1) ∧ P(2) ∧ P(3) ∧ P(4), and P(4) is false (16 > 10).","خاطئة. تعني P(1) ∧ P(2) ∧ P(3) ∧ P(4)، و P(4) خاطئة (16 > 10)."]},{"k":"qa","q":["P(x): x > 3 over ℝ. ∃x P(x)?","P(x): x > 3 على ℝ. ∃x P(x)؟"],"a":["True: for example x = 4.","صحيحة: مثلًا x = 4."]},{"k":"qa","q":["Q(x): x = x + 1 over ℝ. ∃x Q(x)?","Q(x): x = x + 1 على ℝ. ∃x Q(x)؟"],"a":["False: no real number satisfies it.","خاطئة: لا يوجد عدد حقيقي يحققها."]},{"k":"qa","q":["Negate: \"There is an honest politician\" and \"All Americans eat cheeseburgers\".","أنفِ: \"يوجد سياسي نزيه\" و\"كل الأمريكيين يأكلون الهامبرغر\"."],"a":["∃ becomes ∀¬: \"Every politician is dishonest\".\n∀ becomes ∃¬: \"Some American does not eat cheeseburgers\".","∃ تصبح ∀¬: \"كل السياسيين غير نزيهين\".\n∀ تصبح ∃¬: \"يوجد أمريكي لا يأكل الهامبرغر\"."]},{"k":"qa","q":["Negate ∀x (x² > x) and ∃x (x² = 2).","أنفِ ∀x (x² > x) و ∃x (x² = 2)."],"a":["∃x (x² ≤ x)   and   ∀x (x² ≠ 2)","∃x (x² ≤ x)   و   ∀x (x² ≠ 2)"]},{"k":"qa","q":["Show ¬∀x (P(x) → Q(x)) ≡ ∃x (P(x) ∧ ¬Q(x)).","أثبت ¬∀x (P(x) → Q(x)) ≡ ∃x (P(x) ∧ ¬Q(x))."],"a":["¬∀ becomes ∃¬, so we get ∃x ¬(P(x) → Q(x)). Since ¬(P → Q) ≡ P ∧ ¬Q, the two sides are equivalent.","¬∀ تصبح ∃¬ فنحصل على ∃x ¬(P(x) → Q(x)). وبما أن ¬(P → Q) ≡ P ∧ ¬Q فالطرفان متكافئان."]}]},{"t":["Disproof by Counterexample & Quantifier Negation","الإثبات بمثال مضاد ونفي المحددات الكمية"],"b":[{"k":"def","x":["• Disproof by Counterexample: A counterexample to a universally quantified statement ∀x P(x) is an object c such that P(c) is false. For example, the statement 'All birds can fly' is disproved by the counterexample: Penguin.\n• De Morgan's Laws for Quantifiers:\n  - ¬(∀x P(x)) ≡ ∃x (¬P(x))\n  - ¬(∃x P(x)) ≡ ∀x (¬P(x))","• الإثبات بمثال مضاد (Disproof by Counterexample): المثال المضاد للعبارة الشاملة ∀x P(x) هو عنصر c يجعل P(c) خاطئة. مثلاً العبارة 'كل الطيور تطير' يُثبت خطؤها بمثال مضاد: البطريق.\n• قوانين دي مورجان للمحددات الكمية:\n  - ¬(∀x P(x)) ≡ ∃x (¬P(x))\n  - ¬(∃x P(x)) ≡ ∀x (¬P(x))"]}]},{"t":["Translation Practice","تدريب على الترجمة"],"b":[{"k":"qa","q":["Translate: \"Every student in this class has studied calculus.\"","ترجم: \"كل طالب في الفصل درس التفاضل.\""],"a":["∀x (Student(x) → Calculus(x))","∀x (Student(x) → Calculus(x))"]},{"k":"qa","q":["Translate: \"Some student in this class has visited Mexico.\"","ترجم: \"بعض طلاب الفصل زاروا المكسيك.\""],"a":["∃x (Student(x) ∧ Mexico(x)). Rule: with ∃ use ∧, with ∀ use →.","∃x (Student(x) ∧ Mexico(x)). القاعدة: مع ∃ استخدم ∧، ومع ∀ استخدم →."]},{"k":"qa","q":["Hummingbirds: (1) all are richly colored, (2) no large bird lives on honey, (3) birds not living on honey are dull. Conclusion: hummingbirds are small. Formalize.","الطيور الطنانة: (1) كلها زاهية الألوان، (2) لا طائر كبير يعيش على العسل، (3) الطيور التي لا تعيش على العسل باهتة. النتيجة: الطيور الطنانة صغيرة. صِغها رمزيًا."],"a":["P = hummingbird, Q = large, R = lives on honey, S = richly colored.\n(1) ∀x (P → S)   (2) ¬∃x (Q ∧ R)   (3) ∀x (¬R → ¬S)\nConclusion: ∀x (P → ¬Q)","P = طائر طنان، Q = كبير، R = يعيش على العسل، S = زاهي الألوان.\n(1) ∀x (P → S)   (2) ¬∃x (Q ∧ R)   (3) ∀x (¬R → ¬S)\nالنتيجة: ∀x (P → ¬Q)"]}]},{"t":["Worked Examples & Practice","أمثلة محلولة وتمارين"],"b":[{"k":"ex","x":["Order of quantifiers matters (domain: integers).\n∀x ∃y (y = x + 1) → TRUE: whatever x you pick, take y = x + 1.\n∃y ∀x (y = x + 1) → FALSE: no single y equals x + 1 for every x.\nThe quantifier written first is chosen first; later ones may depend on it.","ترتيب الكمّيات مهم (المجال: الأعداد الصحيحة).\n∀x ∃y (y = x + 1) → صحيحة: أي x تختاره، خذ y = x + 1.\n∃y ∀x (y = x + 1) → خاطئة: ما في y واحد يساوي x + 1 لكل x.\nالكمّي المكتوب أولًا يُختار أولًا، والذي بعده قد يعتمد عليه."]},{"k":"try","q":["Negate: \"Every bird can fly.\"","أنفِ: \"كل الطيور تطير.\""],"a":["∀x F(x) → ∃x ¬F(x): \"Some bird cannot fly.\" (NOT \"no bird can fly\".)","∀x F(x) ← ∃x ¬F(x): \"بعض الطيور لا تطير.\" (وليس \"لا يوجد طائر يطير\".)"]},{"k":"try","q":["Truth value of ∃x (x² < 0) over the real numbers?","ما قيمة الصدق لـ ∃x (x² < 0) على الأعداد الحقيقية؟"],"a":["False: no real square is negative, so there is no green dot.","خاطئة: لا يوجد مربع حقيقي سالب، فلا توجد حالة خضراء."]}]}],"take":[["A propositional function becomes a proposition once its variables are instantiated or quantified.","تصبح الدالة القضوية قضية بمجرد تعويض متغيراتها أو إخضاعها لمحدد كمي."],["∀x P(x) is true only if P(x) is true for every x; ∃x P(x) is true if at least one x satisfies P(x).","∀x P(x) تكون صحيحة فقط إذا تحققت P(x) لكل العناصر؛ بينما ∃x P(x) تكون صحيحة إذا حققها عنصر واحد على الأقل."],["To disprove a universal statement ∀x P(x), find a single counterexample c where P(c) is false.","لنفي أو دحض عبارة شاملة ∀x P(x)، يكفي إيجاد مثال مضاد وحيد c تكون عنده P(c) خاطئة."],["De Morgan's laws for quantifiers state that ¬(∀x P(x)) ≡ ∃x(¬P(x)) and ¬(∃x P(x)) ≡ ∀x(¬P(x)).","قوانين دي مورجان للمحددات تنص على أن نفي الشاملة يقلبها إلى وجودية والعكس مع نقل النفي للداخل."],["In nested quantifiers, order matters significantly (e.g., ∀x∃y vs ∃y∀x).","في المحددات الكمية المتداخلة، ترتيب المحددات يغير المعنى تماماً."]],"fc":[[["What is a propositional function (open sentence)?","ما هي الدالة القضوية (الجملة المفتوحة)؟"],["A statement involving one or more variables whose truth value depends on the variable values.","عبارة تحتوي على متغير أو أكثر تعتمد قيمتها الصدقية على قيم تلك المتغيرات."]],[["What does instantiation mean for a variable?","ماذا تعني عملية تعويض المتغير (Instantiation)?"],["Giving the variable a specific, fixed value.","إعطاء المتغير قيمة محددة وثابتة."]],[["When is a universal quantification ∀x P(x) true?","متى تكون العبارة الشاملة ∀x P(x) صحيحة؟"],["When P(x) is true for every x in the universe of discourse.","عندما تكون P(x) صحيحة لكل عنصر x في مجال الخطاب."]],[["When is an existential quantification ∃x P(x) true?","متى تكون العبارة الوجودية ∃x P(x) صحيحة؟"],["When there is at least one x in the domain for which P(x) is true.","عندما يوجد عنصر x واحد على الأقل في المجال تجعل P(x) صحيحة."]],[["What is a counterexample used for?","لماذا يُستخدم المثال المضاد؟"],["To disprove a universal statement (∀x P(x)).","لدحض أو نفي العبارة الشاملة (∀x P(x)).qu"]],[["What is the negation of ∀x P(x)?","ما هو نفي العبارة الشاملة ∀x P(x)؟"],["∃x (¬P(x)).","∃x (¬P(x))."]],[["What is the negation of ∃x P(x)?","ما هو نفي العبارة الوجودية ∃x P(x)؟"],["∀x (¬P(x)).","∀x (¬P(x))."]],[["What is the negation of ∃x(x² = 2)?","ما هو نفي العبارة ∃x(x² = 2)؟"],["∀x(x² ≠ 2).","∀x(x² ≠ 2)."]],[["Are ∀x ∃y P(x,y) and ∃y ∀x P(x,y) logically identical?","هل العبارتان ∀x ∃y P(x,y) وَ ∃y ∀x P(x,y) متطابقتان منطقياً؟"],["No, order of mixed quantifiers matters in nested statements.","لا، ترتيب المحددات المختلفة يهم في العبارات المتداخلة."]],[["In Tutorial 2, what is the counterexample that makes ∀x(x < 2) false over reals?","في توتوريال 2، ما هو المثال المضاد الذي يجعل ∀x(x < 2) خاطئة في الأعداد الحقيقية؟"],["x = 3 (since Q(3) is false).","x = 3 (لأن Q(3) خاطئة)."]],[["What is the truth value of ∀x∃y(x+y=320) over the real numbers?","ما قيمة ∀x∃y(x+y=320) على الأعداد الحقيقية؟"],["True: for each real x, choose y=320−x.","صحيحة: لكل x حقيقي اختر y=320−x."]],[["Why is ∀x∃y(x+y=320) false over the natural numbers?","لماذا تكون ∀x∃y(x+y=320) خاطئة على الأعداد الطبيعية؟"],["For natural x greater than 320, no natural y can make the sum equal 320.","إذا كان x الطبيعي أكبر من 320، فلا توجد y طبيعية تجعل المجموع 320."]],[["Negate “Not all roses are red” in predicate notation.","انفِ «ليست كل الورود حمراء» بالرموز المنطقية."],["The original is ¬∀x(Rose(x)→Red(x)); its equivalent form is ∃x(Rose(x)∧¬Red(x)).","العبارة ¬∀x(Rose(x)→Red(x)) وتكافئ ∃x(Rose(x)∧¬Red(x))."]],[["How is “Nobody is perfect” written using quantifiers?","كيف نكتب «لا أحد كامل» باستخدام المحددات؟"],["¬∃x(Person(x)∧Perfect(x)), equivalently ∀x(Person(x)→¬Perfect(x)).","¬∃x(Person(x)∧Perfect(x))، وتكافئ ∀x(Person(x)→¬Perfect(x))."]],[["What does F(x,y) mean in the lecture’s nested-quantifier examples?","ماذا يعني F(x,y) في أمثلة المحددات المتداخلة؟"],["It means “x and y are friends.”","تعني «x وy صديقان»."]],[["How do you negate ∀x(P(x)→Q(x))?","كيف تنفي ∀x(P(x)→Q(x))؟"],["∃x(P(x)∧¬Q(x)).","∃x(P(x)∧¬Q(x))."]],[["What is the formal conclusion in the hummingbird tutorial argument?","ما النتيجة المصاغة منطقيًا في حجة الطيور الطنانة؟"],["∀x(P(x)→¬Q(x)): all hummingbirds are not large birds.","∀x(P(x)→¬Q(x)): كل طائر طنان ليس طائرًا كبيرًا."]],[["When is a universally quantified statement ∀xP(x) false?","متى تكون العبارة الشاملة ∀xP(x) خاطئة؟"],["When there is at least one object c in the domain for which P(c) is false.","عندما يوجد عنصر واحد على الأقل c في المجال تكون عنده P(c) خاطئة."]]],"quiz":[{"q":["Which symbol represents the universal quantifier ('for all')?","أي رمز يمثل المحدد الكمي الشامل ('لكل')؟"],"o":[["∃","∃"],["∀","∀"],["¬","¬"],["∧","∧"]],"a":1},{"q":["Which symbol represents the existential quantifier ('there exists')?","أي رمز يمثل المحدد الكمي الوجودي ('يوجد')؟"],"o":[["∀","∀"],["∃","∃"],["∨","∨"],["→","→"]],"a":1},{"q":["What is the negation of the statement ∀x P(x)?","ما هو نفي العبارة ∀x P(x)؟"],"o":[["∀x (¬P(x))","∀x (¬P(x))"],["∃x P(x)","∃x P(x)"],["∃x (¬P(x))","∃x (¬P(x))"],["¬∃x (¬P(x))","¬∃x (¬P(x))"]],"a":2},{"q":["What is the negation of the statement ∃x P(x)?","ما هو نفي العبارة ∃x P(x)؟"],"o":[["∀x (¬P(x))","∀x (¬P(x))"],["∃x (¬P(x))","∃x (¬P(x))"],["∀x P(x)","∀x P(x)"],["¬∀x P(x)","¬∀x P(x)"]],"a":0},{"q":["How do you disprove a universally quantified statement like ∀x P(x)?","كيف تقوم بدحض عبارة شاملة مثل ∀x P(x)؟"],"o":[["By showing it is true for one value","بإظهار أنها صحيحة لقيمة واحدة"],["By providing a counterexample where P(c) is false","بتقديم مثال مضاد تكون عنده P(c) خاطئة"],["By using a truth table with infinite rows","باستخدام جدول صدق لنهائي الصفوف"],["By negating the domain","عن طريق نفي مجال الخطاب"]],"a":1},{"q":["What is the truth value of ∀x (x + 1 > x) over all real numbers?","ما هي القيمة الصدقية للعبارة ∀x (x + 1 > x) على كل الأعداد الحقيقية؟"],"o":[["True","صحيحة"],["False","خاطئة"],["Depends on x","تعتمد على x"],["Undefined","غير معرفة"]],"a":0},{"q":["What is the truth value of ∀x (x < 2) over all real numbers?","ما هي القيمة الصدقية للعبارة ∀x (x < 2) على كل الأعداد الحقيقية؟"],"o":[["True","صحيحة"],["False (e.g., x = 3 is a counterexample)","خاطئة (مثلاً x = 3 مثال مضاد)"],["True only for negative numbers","صحيحة فقط للأعداد السالبة"],["Undefined","غير معرفة"]],"a":1},{"q":["What is the negation of the quantified statement ∃x(x² = 2)?","ما هو نفي العبارة المُحَدَّدة كمياً ∃x(x² = 2)؟"],"o":[["∃x(x² ≠ 2)","∃x(x² ≠ 2)"],["∀x(x² = 2)","∀x(x² = 2)"],["∀x(x² ≠ 2)","∀x(x² ≠ 2)"],["¬∀x(x² ≠ 2)","¬∀x(x² ≠ 2)"]],"a":2},{"q":["In Tutorial 2, why is ∀x(x² > 0) false over the domain of all integers?","في توتوريال 2، لماذا تكون العبارة ∀x(x² > 0) خاطئة على مجال الأعداد الصحيحة؟"],"o":[["Because negative numbers square to positive","لان مربعات الأعداد السالبة موجبة"],["Because x = 0 is a counterexample (0² = 0 is not > 0)","لأن x = 0 مثال مضاد (0² = 0 ليست أكبر من الصفر)"],["Because integers are infinite","لأن الأعداد الصحيحة لانهائية"],["Because of division by zero","بسبب القسمة على صفر"]],"a":1},{"q":["Which logical equivalence is proven in Tutorial 2 Problem 11?","أي تكافؤ منطقي تم إثباته في المسألة 11 من توتوريال 2؟"],"o":[["¬∀x(P(x) → Q(x)) ≡ ∃x(P(x) ∧ ¬Q(x))","¬∀x(P(x) → Q(x)) ≡ ∃x(P(x) ∧ ¬Q(x))"],["∀x(P(x) ∧ Q(x)) ≡ ∀x P(x) ∨ ∀x Q(x)","∀x(P(x) ∧ Q(x)) ≡ ∀x P(x) ∨ ∀x Q(x)"],["∃x(P(x) ∨ Q(x)) ≡ ∃x P(x) ∧ ∃x Q(x)","∃x(P(x) ∨ Q(x)) ≡ ∃x P(x) ∧ ∃x Q(x)"],["P → Q ≡ ¬P ∨ Q","P → Q ≡ ¬P ∨ Q"]],"a":0},{"q":["Over the real numbers, why is ∀x∃y(x+y=320) true?","على الأعداد الحقيقية، لماذا تكون ∀x∃y(x+y=320) صحيحة؟"],"o":[["Choose y=320−x for each x","اختر y=320−x لكل x"],["Choose y=320+x","اختر y=320+x"],["Only x=320 works","تتحقق فقط عند x=320"],["No real values work","لا توجد قيم حقيقية تحققها"]],"a":0},{"q":["Which is equivalent to ¬∀xP(x)?","ما المكافئ للعبارة ¬∀xP(x)؟"],"o":[["∀x¬P(x)","∀x¬P(x)"],["∃x¬P(x)","∃x¬P(x)"],["∃xP(x)","∃xP(x)"],["¬∃x¬P(x)","¬∃x¬P(x)"]],"a":1},{"q":["How is “Nobody is perfect” represented?","كيف تُمثّل عبارة «لا أحد كامل»؟"],"o":[["∀x(Person(x)∧Perfect(x))","∀x(Person(x)∧Perfect(x))"],["∃x(Person(x)∧Perfect(x))","∃x(Person(x)∧Perfect(x))"],["¬∃x(Person(x)∧Perfect(x))","¬∃x(Person(x)∧Perfect(x))"],["∀x(Perfect(x)→Person(x))","∀x(Perfect(x)→Person(x))"]],"a":2},{"q":["Which statement matches “Some student in this class has visited Mexico”?","أي عبارة تطابق «يوجد طالب في هذا الصف زار المكسيك»؟"],"o":[["∀x(Student(x)→Mexico(x))","∀x(Student(x)→Mexico(x))"],["∃x(Student(x)∧Mexico(x))","∃x(Student(x)∧Mexico(x))"],["∃x(Student(x)→Mexico(x))","∃x(Student(x)→Mexico(x))"],["∀x(Student(x)∧Mexico(x))","∀x(Student(x)∧Mexico(x))"]],"a":1},{"q":["In the hummingbird argument, what does P(x) mean?","في حجة الطيور الطنانة، ماذا يعني P(x)؟"],"o":[["x is a large bird","x طائر كبير"],["x is richly colored","x ذو ألوان زاهية"],["x is a hummingbird","x طائر طنان"],["x lives on honey","x يعيش على العسل"]],"a":2},{"q":["What is the correct negation of ∃x(x²=2)?","ما النفي الصحيح للعبارة ∃x(x²=2)؟"],"o":[["∀x(x²=2)","∀x(x²=2)"],["∃x(x²≠2)","∃x(x²≠2)"],["∀x(x²≠2)","∀x(x²≠2)"],["¬∀x(x²=2)","¬∀x(x²=2)"]],"a":2},{"q":["What must be identified before translating a quantified sentence?","ما الذي يجب تحديده قبل ترجمة عبارة ذات محدد كمي؟"],"o":[["The universe/domain of discourse","مجال الخطاب"],["The truth table of XOR","جدول XOR"],["The cardinality of a set","عدد عناصر مجموعة"],["The inverse function","الدالة العكسية"]],"a":0},{"q":["For ∀x(P(x)→Q(x)), what is a counterexample?","ما المثال المضاد للعبارة ∀x(P(x)→Q(x))؟"],"o":[["An x where P(x) is false and Q(x) true","قيمة x تجعل P خاطئة وQ صحيحة"],["An x where P(x) is true and Q(x) false","قيمة x تجعل P صحيحة وQ خاطئة"],["An x where both are true","قيمة x تجعل كليهما صحيحًا"],["Any x in the domain","أي قيمة x في المجال"]],"a":1}]},{"id":"l3","n":3,"title":["Set Theory and Operations","نظرية المجموعات والعمليات عليها (Lecture 4)"],"obj":[["Define sets, standard number sets (N, Z, Q, R), and set-builder notation.","تعريف المجموعات، مجموعات الأعداد القياسية (N, Z, Q, R)، وطريقة بناء المجموعة (Set-builder)."],["Understand subsets, proper subsets, cardinality, and the power set P(A).","فهم المجموعات الجزئية، المجموعات الجزئية الفعلية، عدد العناصر (Cardinality)، ومجموعة القوى P(A)."],["Compute Cartesian products and understand ordered n-tuples.","حساب الضرب الديكارتي (Cartesian Product) وفهم الأزواج المرتبة النونية."],["Master set operations: Union, Intersection, Difference, Complement, and Disjoint sets.","إتقان عمليات المجموعات: الاتحاد، التقاطع، الفرق، المتممة، والمجموعات المنفصلة."],["Prove set identities (e.g. distributive law) using logical equivalence.","إثبات متطابقات المجموعات (مثل قانون التوزيع) باستخدام التكافؤ المنطقي."]],"sec":[{"t":["In Simple Words + Pictures","ببساطة + رسومات"],"b":[{"k":"eli","x":["A set is a bag of distinct things; order and repeats do not matter. ∪ = everything in either, ∩ = what they share, A − B = in A but not in B, Aᶜ = everything outside A.","المجموعة كيس عناصر مميزة؛ الترتيب والتكرار ما بيفرقوا. ∪ = كل ما في أي منهما، ∩ = المشترك، A − B = في A وليس في B، Aᶜ = كل ما هو خارج A."]},{"k":"vis","x":"<div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center\"><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 220 140\" width=\"220\" style=\"max-width:100%;height:auto\" font-family=\"Inter,Cairo,sans-serif\" font-size=\"13\" fill=\"currentColor\"><rect x=\".5\" y=\".5\" width=\"219\" height=\"139\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".4\"/><circle cx=\"85\" cy=\"70\" r=\"42\" fill=\"#38bdf8\" fill-opacity=\".55\"/><circle cx=\"135\" cy=\"70\" r=\"42\" fill=\"#38bdf8\" fill-opacity=\".55\"/><circle cx=\"85\" cy=\"70\" r=\"42\" fill=\"none\" stroke=\"currentColor\"/><circle cx=\"135\" cy=\"70\" r=\"42\" fill=\"none\" stroke=\"currentColor\"/><text x=\"62\" y=\"74\" text-anchor=\"middle\" >A</text><text x=\"158\" y=\"74\" text-anchor=\"middle\" >B</text><text x=\"12\" y=\"18\" text-anchor=\"start\" opacity=\".6\">U</text></svg><figcaption style=\"font-size:13px;margin-top:4px\">A ∪ B</figcaption></figure><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 220 140\" width=\"220\" style=\"max-width:100%;height:auto\" font-family=\"Inter,Cairo,sans-serif\" font-size=\"13\" fill=\"currentColor\"><rect x=\".5\" y=\".5\" width=\"219\" height=\"139\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".4\"/><clipPath id=\"v2\"><circle cx=\"135\" cy=\"70\" r=\"42\"/></clipPath><circle cx=\"85\" cy=\"70\" r=\"42\" fill=\"#38bdf8\" fill-opacity=\".55\" clip-path=\"url(#v2)\"/><circle cx=\"85\" cy=\"70\" r=\"42\" fill=\"none\" stroke=\"currentColor\"/><circle cx=\"135\" cy=\"70\" r=\"42\" fill=\"none\" stroke=\"currentColor\"/><text x=\"62\" y=\"74\" text-anchor=\"middle\" >A</text><text x=\"158\" y=\"74\" text-anchor=\"middle\" >B</text><text x=\"12\" y=\"18\" text-anchor=\"start\" opacity=\".6\">U</text></svg><figcaption style=\"font-size:13px;margin-top:4px\">A ∩ B</figcaption></figure><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 220 140\" width=\"220\" style=\"max-width:100%;height:auto\" font-family=\"Inter,Cairo,sans-serif\" font-size=\"13\" fill=\"currentColor\"><rect x=\".5\" y=\".5\" width=\"219\" height=\"139\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".4\"/><mask id=\"v3\"><rect width=\"220\" height=\"140\" fill=\"#fff\"/><circle cx=\"135\" cy=\"70\" r=\"42\" fill=\"#000\"/></mask><circle cx=\"85\" cy=\"70\" r=\"42\" fill=\"#38bdf8\" fill-opacity=\".55\" mask=\"url(#v3)\"/><circle cx=\"85\" cy=\"70\" r=\"42\" fill=\"none\" stroke=\"currentColor\"/><circle cx=\"135\" cy=\"70\" r=\"42\" fill=\"none\" stroke=\"currentColor\"/><text x=\"62\" y=\"74\" text-anchor=\"middle\" >A</text><text x=\"158\" y=\"74\" text-anchor=\"middle\" >B</text><text x=\"12\" y=\"18\" text-anchor=\"start\" opacity=\".6\">U</text></svg><figcaption style=\"font-size:13px;margin-top:4px\">A − B</figcaption></figure><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 220 140\" width=\"220\" style=\"max-width:100%;height:auto\" font-family=\"Inter,Cairo,sans-serif\" font-size=\"13\" fill=\"currentColor\"><rect x=\".5\" y=\".5\" width=\"219\" height=\"139\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".4\"/><mask id=\"v4\"><rect width=\"220\" height=\"140\" fill=\"#fff\"/><circle cx=\"85\" cy=\"70\" r=\"42\" fill=\"#000\"/></mask><rect width=\"220\" height=\"140\" fill=\"#38bdf8\" fill-opacity=\".55\" mask=\"url(#v4)\"/><circle cx=\"85\" cy=\"70\" r=\"42\" fill=\"none\" stroke=\"currentColor\"/><circle cx=\"135\" cy=\"70\" r=\"42\" fill=\"none\" stroke=\"currentColor\"/><text x=\"62\" y=\"74\" text-anchor=\"middle\" >A</text><text x=\"158\" y=\"74\" text-anchor=\"middle\" >B</text><text x=\"12\" y=\"18\" text-anchor=\"start\" opacity=\".6\">U</text></svg><figcaption style=\"font-size:13px;margin-top:4px\">Aᶜ</figcaption></figure></div>","c":["Shaded region = the result. U is the universal set.","المنطقة المظللة = النتيجة. U هي المجموعة الشاملة."]}]},{"t":["Sets: The Basics","المجموعات: الأساسيات"],"b":[{"k":"def","x":["A set is an unordered collection of distinct elements. a ∈ A: member; a ∉ A: not a member.\nℕ = {0,1,2,…}   ℤ = {…,−1,0,1,…}   ℤ⁺ = {1,2,…}   ℚ = {a/b | a ∈ ℤ, b ≠ 0}\nSet-builder: {x | P(x)} = \"all x such that P(x)\".","المجموعة تجمّع غير مرتب لعناصر مميزة. a ∈ A: عنصر فيها؛ a ∉ A: ليس فيها.\nℕ = {0,1,2,…}   ℤ = {…,−1,0,1,…}   ℤ⁺ = {1,2,…}   ℚ = {a/b | a ∈ ℤ, b ≠ 0}\nصيغة البناء: {x | P(x)} = \"كل x التي تحقق P(x)\"."]},{"k":"qa","q":["Are {dog, cat, horse} and {cat, horse, dog, dog} equal?","هل {dog, cat, horse} تساوي {cat, horse, dog, dog}؟"],"a":["Yes: order and repeats do not matter.","نعم: الترتيب والتكرار لا يؤثران."]},{"k":"qa","q":["Is z the same as {z}?","هل z هي نفسها {z}؟"],"a":["No: z is an element; {z} is a set containing z. Likewise {x,y} ≠ {{x,y}}.","لا: z عنصر، و{z} مجموعة تحتوي z. وكذلك {x,y} ≠ {{x,y}}."]},{"k":"qa","q":["List {x | x ∈ ℕ ∧ x > 7}.","اكتب عناصر {x | x ∈ ℕ ∧ x > 7}."],"a":["{8, 9, 10, …}","{8, 9, 10, …}"]}]},{"t":["Subsets & Cardinality","المجموعات الجزئية والعدد"],"b":[{"k":"def","x":["A ⊆ B: every element of A is in B.   A = B ⇔ A ⊆ B and B ⊆ A.   ∅ ⊆ A for every A.\nA ⊂ B (proper): A ⊆ B and B has an element not in A.   |S| = number of distinct elements.","A ⊆ B: كل عنصر في A موجود في B.   A = B ⇔ A ⊆ B و B ⊆ A.   ∅ ⊆ A لأي A.\nA ⊂ B (جزئية فعلية): A ⊆ B وفي B عنصر ليس في A.   |S| = عدد العناصر المميزة."]},{"k":"qa","q":["A = {3,9}, B = {5,9,1,3}. Is A ⊆ B?","A = {3,9}، B = {5,9,1,3}. هل A ⊆ B؟"],"a":["Yes: both 3 and 9 are in B.","نعم: العنصران 3 و9 موجودان في B."]},{"k":"qa","q":["Is {1,2,3} ⊆ {2,3,4}?","هل {1,2,3} ⊆ {2,3,4}؟"],"a":["No: 1 is not in {2,3,4}.","لا: العنصر 1 غير موجود في {2,3,4}."]},{"k":"qa","q":["|{1, {2,3}, {4,5}, 6}| = ?","ما قيمة |{1, {2,3}, {4,5}, 6}|؟"],"a":["4: {2,3} and {4,5} each count as ONE element.","4: كل من {2,3} و{4,5} يُعد عنصرًا واحدًا."]},{"k":"qa","q":["|{x ∈ ℕ | x ≤ 7000}| = ?","ما قيمة |{x ∈ ℕ | x ≤ 7000}|؟"],"a":["7001, because ℕ starts at 0.","7001 لأن ℕ تبدأ من 0."]}]},{"t":["Set Operations and Cardinality Formulas","عمليات المجموعات وقوانين عدد العناصر"],"b":[{"k":"tbl","h":[["Operation","العملية"],["Definition","التعريف"],["Cardinality Formula / Rule","قانون عدد العناصر / القاعدة"]],"r":[[["Union (∪)","الاتحاد (∪)"],["A ∪ B = {x | x ∈ A ∨ x ∈ B}"],["|A ∪ B| = |A| + |B| - |A ∩ B|"]],[["Intersection (∩)","التقاطع (∩)"],["A ∩ B = {x | x ∈ A ∧ x ∈ B}"],["Disjoint if A ∩ B = ∅"]],[["Difference (-)","الفرق (-)"],["A - B = {x | x ∈ A ∧ x ∉ B}"],["|A - B| = |A| - |A ∩ B|"]],[["Complement (Aᶜ)","المتممة (Aᶜ)"],["Aᶜ = U - A"],["Elements under consideration not in A"]]]}]},{"t":["Operations in Action","العمليات بالأمثلة"],"b":[{"k":"qa","q":["A = {a, b}, B = {b, c}. What is A ∪ B?","A = {a, b}، B = {b, c}. ما هي A ∪ B؟"],"a":["{a, b, c}: everything in either set (b is written once).","{a, b, c}: كل ما في أي من المجموعتين (b تُكتب مرة واحدة)."]},{"k":"qa","q":["Same sets. A ∩ B = ?","نفس المجموعتين. A ∩ B = ؟"],"a":["{b}: only what they share.","{b}: المشترك فقط."]},{"k":"qa","q":["A − B = ?   B − A = ?","A − B = ؟   B − A = ؟"],"a":["A − B = {a}   B − A = {c}. Order matters!","A − B = {a}   B − A = {c}. الترتيب مهم!"]},{"k":"qa","q":["U = {a, b, c, d}. Aᶜ = ?","U = {a, b, c, d}. Aᶜ = ؟"],"a":["{c, d}: everything in U outside A.","{c, d}: كل ما في U وخارج A."]},{"k":"qa","q":["Check |A ∪ B| with the formula.","تحقق من |A ∪ B| بالقانون."],"a":["|A| + |B| − |A ∩ B| = 2 + 2 − 1 = 3 ✓ (matches {a, b, c})","|A| + |B| − |A ∩ B| = 2 + 2 − 1 = 3 ✓ (تطابق {a, b, c})"]}]},{"t":["Power Set & Cartesian Product","مجموعة القوى والضرب الديكارتي"],"b":[{"k":"def","x":["Power set: P(A) = {B | B ⊆ A}, the set of all subsets of A (also written 2ᴬ). If |A| = n then |P(A)| = 2ⁿ.","مجموعة القوى: P(A) = {B | B ⊆ A}، أي مجموعة كل المجموعات الجزئية من A (وتُكتب أيضًا 2ᴬ). إذا كان |A| = n فإن |P(A)| = 2ⁿ."]},{"k":"def","x":["Cartesian product: A × B = {(a, b) | a ∈ A ∧ b ∈ B}.\nFor many sets: A₁ × … × Aₙ = {(a₁,…,aₙ) | aᵢ ∈ Aᵢ, 1 ≤ i ≤ n}. Ordered tuples are equal only if every position matches. |A × B| = |A|·|B|.","الضرب الديكارتي: A × B = {(a, b) | a ∈ A ∧ b ∈ B}.\nولعدة مجموعات: A₁ × … × Aₙ = {(a₁,…,aₙ) | aᵢ ∈ Aᵢ, 1 ≤ i ≤ n}. المجموعتان المرتبتان تتساويان فقط إذا تطابق كل موضع. و|A × B| = |A|·|B|."]},{"k":"qa","q":["P({x, y, z}) = ?","P({x, y, z}) = ؟"],"a":["{∅, {x}, {y}, {z}, {x,y}, {x,z}, {y,z}, {x,y,z}}: 2³ = 8 subsets. In general |P(A)| = 2ⁿ.","{∅, {x}, {y}, {z}, {x,y}, {x,z}, {y,z}, {x,y,z}}: أي 2³ = 8 مجموعات. وعمومًا |P(A)| = 2ⁿ."]},{"k":"qa","q":["A = {good, bad}, B = {student, prof}. A × B = ?","A = {good, bad}، B = {student, prof}. A × B = ؟"],"a":["{(good,student), (good,prof), (bad,student), (bad,prof)}: |A|·|B| = 4 pairs.","{(good,student), (good,prof), (bad,student), (bad,prof)}: أي |A|·|B| = 4 أزواج."]},{"k":"qa","q":["Is A × B = B × A?","هل A × B = B × A؟"],"a":["Not in general: (good, student) ≠ (student, good). Order inside a pair matters.","ليس عمومًا: (good, student) ≠ (student, good). ترتيب الزوج مهم."]}]},{"t":["Set Identities: Complete Rule List and Proof","متطابقات المجموعات: القواعد الكاملة وطريقة الإثبات"],"b":[{"k":"tbl","h":[["Law","القانون"],["Union / intersection identities","قوانين الاتحاد والتقاطع"]],"r":[[["Identity","المحايد"],["A∪∅=A; A∩U=A","A∪∅=A؛ A∩U=A"]],[["Domination","السيطرة"],["A∪U=U; A∩∅=∅","A∪U=U؛ A∩∅=∅"]],[["Idempotent","التكرار"],["A∪A=A; A∩A=A","A∪A=A؛ A∩A=A"]],[["Complementation","المتممة المزدوجة"],["(Aᶜ)ᶜ=A","(Aᶜ)ᶜ=A"]],[["Commutative","الإبدال"],["A∪B=B∪A; A∩B=B∩A","A∪B=B∪A؛ A∩B=B∩A"]],[["Associative","التجميع"],["A∪(B∪C)=(A∪B)∪C; same pattern for ∩","A∪(B∪C)=(A∪B)∪C؛ والنمط نفسه لـ ∩"]],[["Distributive","التوزيع"],["A∪(B∩C)=(A∪B)∩(A∪C); dual law also holds","A∪(B∩C)=(A∪B)∩(A∪C)؛ والقانون المزدوج صحيح أيضًا"]],[["De Morgan","دي مورجان"],["(A∪B)ᶜ=Aᶜ∩Bᶜ; (A∩B)ᶜ=Aᶜ∪Bᶜ","(A∪B)ᶜ=Aᶜ∩Bᶜ؛ (A∩B)ᶜ=Aᶜ∪Bᶜ"]],[["Absorption","الامتصاص"],["A∪(A∩B)=A; A∩(A∪B)=A","A∪(A∩B)=A؛ A∩(A∪B)=A"]],[["Complement","المتممة"],["A∪Aᶜ=U; A∩Aᶜ=∅","A∪Aᶜ=U؛ A∩Aᶜ=∅"]]]},{"k":"formula","x":"x ∈ A ∪ (B ∩ C)\n⇔ x ∈ A ∨ (x ∈ B ∧ x ∈ C)\n⇔ (x ∈ A ∨ x ∈ B) ∧ (x ∈ A ∨ x ∈ C)\n⇔ x ∈ (A ∪ B) ∩ (A ∪ C)"}]},{"t":["Worked Examples & Practice","أمثلة محلولة وتمارين"],"b":[{"k":"try","q":["If |A| = 5, how many subsets does A have?","لو |A| = 5، كم مجموعة جزئية لـ A؟"],"a":["2⁵ = 32.","2⁵ = 32."]},{"k":"try","q":["A = {1,2}, B = {a,b,c}: how many pairs in A × B?","A = {1,2}، B = {a,b,c}: كم زوجًا في A × B؟"],"a":["2 × 3 = 6: (1,a), (1,b), (1,c), (2,a), (2,b), (2,c).","2 × 3 = 6: (1,a), (1,b), (1,c), (2,a), (2,b), (2,c)."]}]}],"take":[["A ⊆ B ⇔ ∀x (x ∈ A → x ∈ B); to prove A = B, show A ⊆ B and B ⊆ A.","لإثبات تساوى مجموعتين، نثبت أن كل منهما مجموعة جزئية للأخرى."],["Power set P(A) contains all subsets of A, and if |A| = n, then |P(A)| = 2ⁿ.","مجموعة القوى تحوي كل المجموعات الجزئية، وعدد عناصرها 2 أس n."],["Cartesian product A × B consists of ordered pairs (a,b) and is generally not equal to B × A.","الضرب الديكارتي يحوي أزواجاً مرتبة وعمومًا A × B لا يساوي B × A."],["Inclusion-Exclusion principle: |A ∪ B| = |A| + |B| - |A ∩ B|.","قانون الاتحاد لعدد العناصر: مجموع عناصر A زائد B ناقص التقاطع."],["Set identities can be proven step-by-step by converting set operations into logical equivalences.","يمكن إثبات متطابقات المجموعات بتحويلها إلى مكافئات منطقية خطوة بخطوة."]],"fc":[[["What is the formal definition of A ⊆ B?","ما هو التعريف الرسمي لـ A ⊆ B؟"],["A ⊆ B ⇔ ∀x (x ∈ A → x ∈ B).","A ⊆ B ⇔ ∀x (x ∈ A → x ∈ B)."]],[["How do you prove that set A equals set B?","كيف تثبت أن المجموعة A تساوي المجموعة B؟"],["By showing that A ⊆ B and B ⊆ A (double-subset technique).","بإثبات أن A ⊆ B وَ B ⊆ A."]],[["What is the power set P(A)?","ما هي مجموعة القوى P(A)؟"],["The set of all subsets of A.","مجموعة كل المجموعات الجزئية للمجموعة A."]],[["If |A| = 3, what is the cardinality of P(A)?","إذا كانت |A| = 3، فما هو عدد عناصر مجموعة القوى P(A)؟"],["|P(A)| = 2³ = 8.","8 عناصر."]],[["What is the cardinality formula for the union of two sets?","ما هو قانون عدد عناصر اتحاد مجموعتين؟"],["|A ∪ B| = |A| + |B| - |A ∩ B|.","|A ∪ B| = |A| + |B| - |A ∩ B|."]],[["When are two sets called disjoint?","متى يقال عن مجموعتين أنهما منفصلتان (Disjoint)؟"],["When their intersection is empty: A ∩ B = ∅.","عندما يكون تقاطعهما خاياً: A ∩ B = ∅."]],[["What is the set difference A - B?","ما هو فرق المجموعتين A - B؟"],["The set of elements in A that are not in B.","مجموعة العناصر الموجودة في A وليست في B."]],[["What is the complement Aᶜ of set A?","ما هي متممة المجموعة A؟"],["The set of all elements under consideration (universe U) that are not in A: U - A.","العناصر التي تنتمي لمجال الشمول U وليست في A."]],[["Is A × B equal to B × A in general?","هل الضرب الديكارتي A × B يساوي B × A عمومًا؟"],["No, because the order inside ordered pairs matters.","لا، لأن الترتيب داخل الأزواج المرتبة مهم."]],[["How many elements does A × B have if |A| = 3 and |B| = 4?","كم عنصرًا يحوي A × B إذا كانت |A| = 3 وَ |B| = 4؟"],["12 elements (|A| · |B| = 12).","12 عنصرًا."]],[["Why are {dog,cat,horse} and {cat,horse,dog,dog} equal?","لماذا تتساوى {dog,cat,horse} و{cat,horse,dog,dog}؟"],["Set order does not matter, and duplicate occurrences do not add elements.","ترتيب عناصر المجموعة لا يهم، والتكرار لا يضيف عناصر جديدة."]],[["What is the difference between z and {z}?","ما الفرق بين z و{z}؟"],["z is an object/element; {z} is a set whose element is z.","z عنصر، أما {z} فهي مجموعة عنصرها z."]],[["When is A a proper subset of B?","متى تكون A مجموعة جزئية فعلية من B؟"],["When A⊆B and at least one element of B is not in A.","عندما A⊆B ويوجد عنصر في B لا ينتمي إلى A."]],[["Why does D={x∈N|x≤7000} have cardinality 7001 in the lecture?","لماذا عدد عناصر D={x∈N|x≤7000} هو 7001 في المحاضرة؟"],["Because N begins at 0 here, so D contains every integer from 0 through 7000 inclusive.","لأن N تبدأ بالصفر هنا، فتضم المجموعة كل الأعداد من 0 إلى 7000 شاملًا."]],[["What is P(∅)?","ما مجموعة القوى للمجموعة الخالية P(∅)؟"],["P(∅)={∅}; its cardinality is 1.","P(∅)={∅} وعدد عناصرها 1."]],[["How many elements are in A×B when |A|=3 and |B|=4?","كم عدد عناصر A×B إذا كان |A|=3 و|B|=4؟"],["|A×B|=|A|·|B|=12.","|A×B|=|A|·|B|=12."]],[["When are two sets disjoint?","متى تكون مجموعتان منفصلتين؟"],["When A∩B=∅; they share no elements.","عندما A∩B=∅، أي لا توجد عناصر مشتركة."]],[["What is the complement of A relative to U?","ما متممة A بالنسبة إلى U؟"],["Aᶜ=U−A, the elements of U that are not in A.","Aᶜ=U−A، أي عناصر U التي لا تنتمي إلى A."]]],"quiz":[{"q":["Which of the following defines subset A ⊆ B correctly?","أي مما يلي يعرّف المجموعة الجزئية A ⊆ B بشكل صحيح؟"],"o":[["∀x (x ∈ A ∧ x ∈ B)","∀x (x ∈ A ∧ x ∈ B)"],["∀x (x ∈ A → x ∈ B)","∀x (x ∈ A → x ∈ B)"],["∃x (x ∈ A → x ∈ B)","∃x (x ∈ A → x ∈ B)"],["A = B","A = B"]],"a":1},{"q":["To prove that set A equals set B, what must you show?","لكإثبات أن المجموعة A تساوي المجموعة B، ماذا يجب أن تثبت؟"],"o":[["A ⊆ B only","A ⊆ B فقط"],["B ⊆ A only","B ⊆ A فقط"],["(A ⊆ B) ∧ (B ⊆ A)","(A ⊆ B) ∧ (B ⊆ A)"],["A × B = B × A","A × B = B × A"]],"a":2},{"q":["If set A has 4 elements, how many elements does its power set P(A) have?","إذا كانت المجموعة A تحوي 4 عناصر، فكم عنصرًا تحوي مجموعة القوى P(A)؟"],"o":[["4","4"],["8","8"],["16","16"],["32","32"]],"a":2},{"q":["What is the correct formula for the cardinality of the union of two finite sets?","ما هو القانون الصحيح لعدد عناصر اتحاد مجموعتين منتهيتين؟"],"o":[["|A ∪ B| = |A| + |B|","|A ∪ B| = |A| + |B|"],["|A ∪ B| = |A| + |B| - |A ∩ B|","|A ∪ B| = |A| + |B| - |A ∩ B|"],["|A ∪ B| = |A| · |B|","|A ∪ B| = |A| · |B|"],["|A ∪ B| = |A| - |B|","|A ∪ B| = |A| - |B|"]],"a":1},{"q":["When are two sets A and B called disjoint?","مت يقال عن المجموعتين A و B أنهما منفصلتان؟"],"o":[["When A = B","عندما A = B"],["When their intersection is empty (A ∩ B = ∅)","عندما يكون تقاطعهما خاياً (A ∩ B = ∅)"],["When A ∪ B = U","عندما الاتحاد هو الشامل"],["When |A| = |B|","عندما تتساوى أعدادهما"]],"a":1},{"q":["What does the set difference A - B contain?","ماذا تحوي عملية فرق المجموعتين A - B؟"],"o":[["Elements in both A and B","العناصر المشتركة"],["Elements in B but not in A","العناصر في B وليست في A"],["Elements in A that are not in B","العناصر الموجودة في A وليست في B"],["Elements in neither A nor B","العناصر خارج التجميع"]],"a":2},{"q":["What is the complement Aᶜ of set A with respect to a universal set U?","ما هي متممة المجموعة A بالنسبة لمجموعة شاملة U؟"],"o":[["U - A","U - A"],["A - U","A - U"],["A ∩ U","A ∩ U"],["∅","مجموعة خالية"]],"a":0},{"q":["What is true about the Cartesian product of two non-empty sets A and B when A ≠ B?","ما الصحیح بخصوص الضرب الديكارتي لمجموعتين غير فارغتين A و B عندما A ≠ B؟"],"o":[["A × B = B × A","متساويان"],["A × B is always empty","دائمًا خاٍل"],["A × B ≠ B × A in general","عمومًا غير متساويين لأن الترتيب مهم"],["|A × B| = |A| + |B|","الجمع"]],"a":2},{"q":["What is A × ∅ equal to?","إلى ماذا يساوي الضرب الديكارتي A × ∅؟"],"o":[["A","A"],["∅","مجموعة خالية"],["P(A)","مجموعة القوى"],["U","المجموعة الشاملة"]],"a":1},{"q":["Which law is used to prove set identities like A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)?","أي قانون يُستخدم لإثبات متطابقات المجموعات مثل قانون التوزيع؟"],"o":[["Logical equivalence laws","قوانين التكافؤ المنطقي"],["Truth tables of numbers","جداول الصدق العددية"],["Mathematical induction","الاستقراء الرياضي"],["Power set expansion","فك مجموعة القوى"]],"a":0},{"q":["Which statement about sets is correct?","أي عبارة عن المجموعات صحيحة؟"],"o":[["Order and repeated elements change a set","الترتيب والتكرار يغيران المجموعة"],["Order does not matter and duplicates do not add elements","الترتيب لا يهم والتكرار لا يضيف عناصر"],["A set must contain only numbers","المجموعة يجب أن تحوي أعدادًا فقط"],["z and {z} are always the same object","z و{z} دائمًا الشيء نفسه"]],"a":1},{"q":["For A={3,9} and B={5,9,1,3}, is A⊆B?","إذا A={3,9} وB={5,9,1,3}، هل A⊆B؟"],"o":[["Yes","نعم"],["No, because 9 is repeated","لا، لأن 9 مكرر"],["No, because B has four elements","لا، لأن B تحوي أربعة عناصر"],["Cannot be determined","لا يمكن التحديد"]],"a":0},{"q":["What is the cardinality of B={1,{2,3},{4,5},6}?","ما عدد عناصر B={1,{2,3},{4,5},6}؟"],"o":[["2","2"],["3","3"],["4","4"],["6","6"]],"a":2},{"q":["What is P(∅)?","ما P(∅)؟"],"o":[["∅","∅"],["{∅}","{∅}"],["{{∅}}","{{∅}}"],["The power set is undefined","مجموعة القوى غير معرفة"]],"a":1},{"q":["If |A|=2 and |B|=3, what is |A×B|?","إذا |A|=2 و|B|=3، فما |A×B|؟"],"o":[["5","5"],["6","6"],["8","8"],["9","9"]],"a":1},{"q":["For A={a,b} and B={b,c,d}, what is A−B?","إذا A={a,b} وB={b,c,d}، فما A−B؟"],"o":[["{a}","{a}"],["{b}","{b}"],["{c,d}","{c,d}"],["{a,b,c,d}","{a,b,c,d}"]],"a":0},{"q":["Which is a De Morgan law for set complements?","أي مما يلي قانون دي مورجان لمتممة المجموعات؟"],"o":[["(A∪B)ᶜ=Aᶜ∪Bᶜ","(A∪B)ᶜ=Aᶜ∪Bᶜ"],["(A∪B)ᶜ=Aᶜ∩Bᶜ","(A∪B)ᶜ=Aᶜ∩Bᶜ"],["A∪Aᶜ=∅","A∪Aᶜ=∅"],["A∩∅=A","A∩∅=A"]],"a":1},{"q":["To prove A=B using subsets, what must you show?","لإثبات A=B باستخدام المجموعات الجزئية، ماذا يجب أن تثبت؟"],"o":[["A⊆B only","A⊆B فقط"],["B⊆A only","B⊆A فقط"],["Both A⊆B and B⊆A","كلًا من A⊆B وB⊆A"],["|A|=|B| only","تساوي عدد العناصر فقط"]],"a":2}]},{"id":"l4","n":4,"title":["Functions: Properties, Operations, and Floor/Ceiling","الدوال: الخصائص، العمليات، ودالتا الأرضية والسقف (Lecture 5)"],"obj":[["Define functions, domain, codomain, range, image, and pre-image.","تعريف الدوال، المجال، المجال المقابل، المدى، الصورة، والصورة العكسية."],["Perform arithmetic operations on functions (sum and product).","إجراء العمليات الحسابية على الدوال (الجمع والضرب)."],["Determine and prove whether a function is one-to-one (injective) or onto (surjective).","تحديد وإثبات ما إذا كانت الدالة متباينة (Injective) أو شاملة (Surjective)."],["Identify bijections, inverse functions, and function composition.","التعرف على التقابل، الدوال العكسية، وتركيب الدوال."],["Compute floor and ceiling functions for any real number.","حساب دالتي الأرضية والسقف لأي عدد حقيقي."]],"sec":[{"t":["In Simple Words + Pictures","ببساطة + رسومات"],"b":[{"k":"eli","x":["A function is a machine: every input gets exactly ONE output. Injective = no two inputs share an output. Surjective (onto) = every element of the codomain is hit. Bijective = both, so the arrows can be reversed.","الدالة ماكينة: كل مدخل له مخرج واحد فقط. Injective = ما في مدخلين لهم نفس المخرج. Surjective (onto) = كل عنصر في المجال المقابل يُصاب بسهم. Bijective = الاثنتان معًا، فيمكن عكس الأسهم."]},{"k":"vis","x":"<div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center\"><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 190 108\" width=\"190\" style=\"max-width:100%;height:auto\" font-family=\"Inter,Cairo,sans-serif\" font-size=\"13\" fill=\"currentColor\"><defs><marker id=\"a5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/></marker></defs><line x1=\"58\" y1=\"24\" x2=\"132\" y2=\"24\" stroke=\"currentColor\" marker-end=\"url(#a5)\"/><line x1=\"58\" y1=\"56\" x2=\"132\" y2=\"56\" stroke=\"currentColor\" marker-end=\"url(#a5)\"/><line x1=\"58\" y1=\"88\" x2=\"132\" y2=\"88\" stroke=\"currentColor\" marker-end=\"url(#a5)\"/><circle cx=\"45\" cy=\"24\" r=\"12\" fill=\"none\" stroke=\"#38bdf8\" stroke-width=\"2\"/><text x=\"45\" y=\"28\" text-anchor=\"middle\" >1</text><circle cx=\"45\" cy=\"56\" r=\"12\" fill=\"none\" stroke=\"#38bdf8\" stroke-width=\"2\"/><text x=\"45\" y=\"60\" text-anchor=\"middle\" >2</text><circle cx=\"45\
