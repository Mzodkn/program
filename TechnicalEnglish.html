    ["Convert sentences between active and passive voice using the standard steps.","تحويل الجمل بين المبني للمعلوم والمبني للمجهول باستخدام الخطوات القياسية."],
    ["Recognize the active and passive forms of a verb across all eight tenses covered.","التعرف على صيغتي المبني للمعلوم والمجهول للفعل عبر جميع الأزمنة الثمانية المغطاة."],
    ["Explain when to use active voice versus passive voice, and which verbs can be transformed.","شرح متى تُستخدم كل من الصيغتين، وأي الأفعال يمكن تحويلها."]
  ],
  sec:[
   {t:["What Is Voice?","ما هي الصيغة (Voice)؟"], b:[
     {k:'def', x:["In grammar, the term voice shows the two different ways an action can be viewed: (1) someone or something performing an action, and (2) the action being performed on someone or something.","في القواعد، يُستخدم مصطلح الصيغة (Voice) لبيان طريقتين مختلفتين لرؤية الفعل: (1) شخص أو شيء يقوم بالفعل، و(2) الفعل يقع على شخص أو شيء."]},
     {k:'ex', x:["1. The operators conducted a test on the turbo generator. (Active Voice — the subject 'the operators' performs the action)\n2. A test was conducted on the turbo generator by the operators. (Passive Voice — the subject 'a test' receives the action)","1. أجرى المشغّلون اختبارًا على المولد التوربيني. (مبني للمعلوم — الفاعل 'المشغّلون' يقوم بالفعل)\n2. أُجري اختبار على المولد التوربيني من قِبل المشغّلين. (مبني للمجهول — الفاعل النحوي 'اختبار' يقع عليه الفعل)"]},
     {k:'tip', x:["Whenever we talk about a verb denoting an action, we also need to talk about the time at/during which the action occurs — this sense of time is the tense. There is a strong link between the voice of the verb and the tense.","كلما تحدثنا عن فعل يدل على حدث، نحتاج أيضًا للحديث عن الوقت الذي يقع فيه الحدث — وهذا الإحساس بالوقت هو الزمن (Tense). وهناك ارتباط قوي بين صيغة الفعل وزمنه."]}
   ]},
   {t:["The Tense–Voice Table","جدول الزمن والصيغة"], b:[
     {k:'p', x:["The table below shows the active and passive forms of the verb 'analyse' across eight tenses.","يُظهر الجدول أدناه صيغتي المبني للمعلوم والمجهول للفعل 'analyse' عبر ثمانية أزمنة."]},
     {k:'tbl', h:[["Tense","الزمن"],["Active Voice","المبني للمعلوم"],["Passive Voice","المبني للمجهول"]],
      r:[
       [["Simple present","المضارع البسيط"],["Analyses","Analyses"],["is analysed","is analysed"]],
       [["Present continuous","المضارع المستمر"],["is analyzing","is analyzing"],["is being analysed","is being analysed"]],
       [["Simple past","الماضي البسيط"],["Analysed","Analysed"],["was analysed","was analysed"]],
       [["Past continuous","الماضي المستمر"],["was analysing","was analysing"],["was being analysed","was being analysed"]],
       [["Present Perfect","المضارع التام"],["has analysed","has analysed"],["has been analysed","has been analysed"]],
       [["Future","المستقبل"],["will analyse","will analyse"],["will analyse","will analyse"]],
       [["Conditional","الشرطي"],["would analyse","would analyse"],["would analyse","would analyse"]],
       [["Perfect conditional","الشرطي التام"],["would have analysed","would have analysed"],["would have been analysed","would have been analysed"]]
      ]}
   ]},
   {t:["Changing Active Voice into Passive Voice","تحويل المبني للمعلوم إلى المبني للمجهول"], b:[
     {k:'ul', x:[
       ["Identify the subject (the agent, or thing causing the action) — who performed it.","تحديد الفاعل (الجهة المسببة للفعل) — من قام به."],
       ["Identify the object (what action has been done — performed what).","تحديد المفعول به (ما الفعل الذي تم تنفيذه)."],
       ["Note the tense of the verb.","ملاحظة زمن الفعل."],
       ["Begin the passive sentence with the action (the object of the active sentence).","ابدأ الجملة المبنية للمجهول بالمفعول به (مفعول الجملة المبنية للمعلوم)."],
       ["Use the third form of the verb (past participle) preceded by the appropriate auxiliary verb, followed by the phrase 'by the'.","استخدم الصيغة الثالثة للفعل (اسم المفعول) مسبوقة بالفعل المساعد المناسب، متبوعة بعبارة 'by the'."],
       ["Complete the sentence with the agent or thing (the subject of the active sentence).","أكمل الجملة بالفاعل أو الشيء (فاعل الجملة المبنية للمعلوم)."]]}
   ]},
   {t:["Changing Passive Voice into Active Voice","تحويل المبني للمجهول إلى المبني للمعلوم"], b:[
     {k:'ul', x:[
       ["Identify the doer/agent by noting what follows the 'by the...' phrase; if not specified, infer the agent from the action or context.","حدد الفاعل من خلال ملاحظة ما يلي عبارة 'by the...'؛ وإن لم يُذكر، استنتج الفاعل من الفعل أو السياق."],
       ["Note the action performed by the agent (at the beginning of the passive sentence).","لاحظ الفعل الذي قام به الفاعل (في بداية الجملة المبنية للمجهول)."],
       ["Note the tense of the verb.","لاحظ زمن الفعل."],
       ["Begin the active sentence with the agent.","ابدأ الجملة المبنية للمعلوم بالفاعل."],
       ["Choose the appropriate verb form according to whether the agent is singular or plural, and the simple, continuous, or perfect form of the tense.","اختر صيغة الفعل المناسبة بحسب كون الفاعل مفردًا أو جمعًا، وبحسب الصيغة البسيطة أو المستمرة أو التامة للزمن."]]}
   ]},
   {t:["Worked Examples: Passive, Agent, and Active","أمثلة محلولة: المبني للمجهول، الفاعل، والمبني للمعلوم"], b:[
     {k:'tbl', h:[["Passive Voice","المبني للمجهول"],["Agent","الفاعل"],["Active Voice","المبني للمعلوم"]],
      r:[
       [["Multifarious operations are performed by these computers.","تُنفَّذ عمليات متعددة من قِبل هذه الحواسيب."],["These computers","هذه الحواسيب"],["These computers perform multifarious operations.","تُنفّذ هذه الحواسيب عمليات متعددة."]],
       [["The equipment for the practical examinations was being arranged by the technician.","كانت معدات الاختبارات العملية تُرتَّب من قِبل الفني."],["Technician","الفني"],["The technician was arranging the equipment for the practical examinations.","كان الفني يُرتّب معدات الاختبارات العملية."]],
       [["Results will be published in the next issue of the journal.","ستُنشر النتائج في العدد القادم من المجلة."],["Agent not specified — may be 'researchers' or the 'association'.","الفاعل غير محدد — قد يكون 'الباحثين' أو 'الجمعية'."],["The researchers will publish the results in the next issue of the journal.","سينشر الباحثون النتائج في العدد القادم من المجلة."]],
       [["The components were identified by Thomas and his associates.","حُدِّدت المكونات من قِبل توماس وزملائه."],["Thomas and his associates","توماس وزملاؤه"],["Thomas and his associates identified the components.","حدّد توماس وزملاؤه المكونات."]]
      ]}
   ]},
   {t:["More Examples Across Tenses","مزيد من الأمثلة عبر الأزمنة"], b:[
     {k:'cards', c:[
       {t:["Simple Present","المضارع البسيط"], l:[["Active: We add water to the mixture.","مبني للمعلوم: We add water to the mixture."],["Passive: Water is added to the mixture (by us).","مبني للمجهول: Water is added to the mixture (by us)."]]},
       {t:["Simple Past","الماضي البسيط"], l:[["Active: The Civil Engineers tried out different layouts.","مبني للمعلوم: The Civil Engineers tried out different layouts."],["Passive: Different layouts were tried out by the Civil Engineers.","مبني للمجهول: Different layouts were tried out by the Civil Engineers."]]},
       {t:["Simple Future","المستقبل البسيط"], l:[["Active: We will not carry out any research in this area.","مبني للمعلوم: We will not carry out any research in this area."],["Passive: No research will be carried out in this area.","مبني للمجهول: No research will be carried out in this area."]]},
       {t:["Present Perfect","المضارع التام"], l:[["Active: The Committee has approved the Plan.","مبني للمعلوم: The Committee has approved the Plan."],["Passive: The Plan has been approved by the Committee.","مبني للمجهول: The Plan has been approved by the Committee."]]},
       {t:["Past Perfect","الماضي التام"], l:[["Active: The Engineers had completed the job in time.","مبني للمعلوم: The Engineers had completed the job in time."],["Passive: The job had been completed in time by the Engineers.","مبني للمجهول: The job had been completed in time by the Engineers."]]},
       {t:["Present/Past Continuous","المضارع/الماضي المستمر"], l:[["Active: They are repairing the road.","مبني للمعلوم: They are repairing the road."],["Passive: The road is being repaired.","مبني للمجهول: The road is being repaired."]]}
     ]}
   ]},
   {t:["When to Use Active vs. Passive Voice","متى تُستخدم كل صيغة"], b:[
     {k:'p', x:["While the doer is given importance in Active Voice, the action gets prominence in Passive Voice. Active Voice is used for clear, direct, and strong writing, and requires active verbs.","بينما يُعطى الفاعل الأهمية في المبني للمعلوم، يحظى الفعل بالأهمية في المبني للمجهول. ويُستخدم المبني للمعلوم للكتابة الواضحة والمباشرة والقوية، ويتطلب أفعالًا فاعلة."]},
     {k:'p', x:["Passive Voice is used in most formal writing such as reports, proposals, and complaint or rejection letters, because the action — not the doer — needs to be emphasized.","يُستخدم المبني للمجهول في معظم الكتابات الرسمية مثل التقارير والمقترحات ورسائل الشكوى أو الرفض، لأن التركيز يجب أن يكون على الفعل لا على الفاعل."]},
     {k:'ex', x:["The project was completed on time. (focus is on the project)\nSohan's team completed the project on time. (focus is on Sohan's team)","The project was completed on time. (التركيز على المشروع)\nSohan's team completed the project on time. (التركيز على فريق سوهان)"]}
   ]},
   {t:["Important Notes","ملاحظات مهمة"], b:[
     {k:'tip', x:["Not all sentences can be transformed from active into passive voice. Only transitive verbs (verbs which take an object) can be transformed into passive voice.","لا يمكن تحويل كل الجمل من المبني للمعلوم إلى المبني للمجهول. فقط الأفعال المتعدية (التي تأخذ مفعولًا به) يمكن تحويلها إلى المبني للمجهول."]},
     {k:'p', x:["To sum up: the tense of the verb undergoes a change when you transfer one voice into another. Passive construction is verbose, while active is crisp, direct, and unambiguous.","باختصار: يتغيّر زمن الفعل عند تحويل إحدى الصيغتين إلى الأخرى. والتركيب المبني للمجهول مُطنب، بينما المبني للمعلوم موجز ومباشر وغير غامض."]}
   ]}
  ],
  take:[
   ["Active Voice: the subject performs the action. Passive Voice: the subject receives the action.","المبني للمعلوم: الفاعل يقوم بالفعل. المبني للمجهول: الفاعل النحوي يقع عليه الفعل."],
   ["Passive voice formula: appropriate auxiliary + past participle (+ 'by' + agent, if needed).","صيغة المبني للمجهول: الفعل المساعد المناسب + اسم المفعول (+ 'by' + الفاعل، إذا لزم)."],
   ["Active voice = clear, direct, strong writing. Passive voice = formal writing (reports, proposals) emphasizing the action over the doer.","المبني للمعلوم = كتابة واضحة ومباشرة وقوية. المبني للمجهول = كتابة رسمية (تقارير، مقترحات) تُبرز الفعل على الفاعل."],
   ["Only transitive verbs (verbs that take an object) can be converted to passive voice.","فقط الأفعال المتعدية (التي تأخذ مفعولًا به) يمكن تحويلها إلى المبني للمجهول."],
   ["Passive construction is verbose; active construction is crisp, direct, and unambiguous.","التركيب المبني للمجهول مُطنب؛ والمبني للمعلوم موجز ومباشر وغير غامض."]
  ],
  fc:[
   [["Define voice in grammar.","عرّف الصيغة (Voice) في القواعد."],["The term showing whether the subject performs the action (active) or receives the action (passive).","المصطلح الذي يبيّن ما إذا كان الفاعل يقوم بالفعل (مبني للمعلوم) أو يقع عليه الفعل (مبني للمجهول)."]],
   [["In 'A test was conducted on the turbo generator by the operators,' which voice is used, and why?","في جملة 'A test was conducted on the turbo generator by the operators'، أي صيغة استُخدمت، ولماذا؟"],["Passive voice — the subject 'a test' receives the action rather than performing it.","المبني للمجهول — لأن الفاعل النحوي 'a test' يقع عليه الفعل بدلًا من أن يقوم به."]],
   [["What is the passive form of 'is analyzing' (present continuous)?","ما الصيغة المبنية للمجهول لـ 'is analyzing' (المضارع المستمر)؟"],["is being analysed.","is being analysed."]],
   [["What is the passive form of 'has analysed' (present perfect)?","ما الصيغة المبنية للمجهول لـ 'has analysed' (المضارع التام)؟"],["has been analysed.","has been analysed."]],
   [["List the first two steps for changing active voice into passive voice.","اذكر الخطوتين الأوليين لتحويل المبني للمعلوم إلى المبني للمجهول."],["Identify the subject (agent), then identify the object.","تحديد الفاعل، ثم تحديد المفعول به."]],
   [["What verb form, and what preceding element, is used to build the passive voice?","ما صيغة الفعل، وما العنصر الذي يسبقها، في بناء المبني للمجهول؟"],["The third form of the verb (past participle), preceded by the appropriate auxiliary verb.","الصيغة الثالثة للفعل (اسم المفعول)، مسبوقة بالفعل المساعد المناسب."]],
   [["If the agent is not specified after 'by', what should you do when converting passive to active?","إذا لم يُذكر الفاعل بعد 'by'، ماذا يجب فعله عند التحويل من المبني للمجهول إلى المعلوم؟"],["Infer the agent from the action or context.","استنتاج الفاعل من الفعل أو السياق."]],
   [["Convert to passive: 'The Committee has approved the Plan.'","حوّل إلى المبني للمجهول: 'The Committee has approved the Plan.'"],["The Plan has been approved by the Committee.","The Plan has been approved by the Committee."]],
   [["When is Active Voice generally preferred?","متى يُفضَّل عمومًا استخدام المبني للمعلوم؟"],["For clear, direct, and strong writing.","للكتابة الواضحة والمباشرة والقوية."]],
   [["When is Passive Voice generally preferred?","متى يُفضَّل عمومًا استخدام المبني للمجهول؟"],["In formal writing such as reports, proposals, and complaint/rejection letters, where the action matters more than the doer.","في الكتابة الرسمية مثل التقارير والمقترحات ورسائل الشكوى/الرفض، حيث يهم الفعل أكثر من الفاعل."]],
   [["Which type of verb can be transformed into passive voice?","أي نوع من الأفعال يمكن تحويله إلى المبني للمجهول؟"],["Only transitive verbs — verbs that take an object.","فقط الأفعال المتعدية — التي تأخذ مفعولًا به."]],
   [["Compare active vs. passive construction in terms of style.","قارن بين التركيب المبني للمعلوم والمجهول من حيث الأسلوب."],["Passive construction is verbose; active construction is crisp, direct, and unambiguous.","التركيب المبني للمجهول مُطنب؛ والمبني للمعلوم موجز ومباشر وغير غامض."]],
   [["In 'The project was completed on time' vs. 'Sohan's team completed the project on time,' what differs?","في 'The project was completed on time' مقابل 'Sohan's team completed the project on time'، ما الذي يختلف؟"],["The focus: the first emphasizes the project, the second emphasizes Sohan's team (the doer).","التركيز: الأولى تُبرز المشروع، والثانية تُبرز فريق سوهان (الفاعل)."]]
  ],
  quiz:[
   {q:["In Active Voice, the subject:","في المبني للمعلوم، الفاعل:"], o:[["Receives the action","يقع عليه الفعل"],["Performs the action","يقوم بالفعل"],["Is always omitted","يُحذف دائمًا"],["Is always plural","يكون جمعًا دائمًا"]], a:1},
   {q:["'A test was conducted on the turbo generator by the operators' is an example of:","'A test was conducted on the turbo generator by the operators' مثال على:"], o:[["Active Voice","المبني للمعلوم"],["Passive Voice","المبني للمجهول"],["Future tense only","المستقبل فقط"],["A question","سؤال"]], a:1},
   {q:["What is the passive form of the simple present 'Analyses'?","ما الصيغة المبنية للمجهول للمضارع البسيط 'Analyses'؟"], o:[["was analysed","was analysed"],["is analysed","is analysed"],["has analysed","has analysed"],["will analyse","will analyse"]], a:1},
   {q:["What is the passive form of the simple past 'Analysed'?","ما الصيغة المبنية للمجهول للماضي البسيط 'Analysed'؟"], o:[["is analysed","is analysed"],["was analysed","was analysed"],["is being analysed","is being analysed"],["has been analysed","has been analysed"]], a:1},
   {q:["What is the FIRST step in changing active voice into passive voice?","ما الخطوة الأولى في تحويل المبني للمعلوم إلى المبني للمجهول؟"], o:[["Use the phrase 'by the'","استخدام عبارة 'by the'"],["Identify the subject (agent)","تحديد الفاعل"],["Note the tense of the verb","ملاحظة زمن الفعل"],["Add an auxiliary verb","إضافة فعل مساعد"]], a:1},
   {q:["In the passive voice, the verb uses which form?","في المبني للمجهول، أي صيغة فعل تُستخدم؟"], o:[["The base form","الصيغة الأساسية"],["The third form (past participle)","الصيغة الثالثة (اسم المفعول)"],["The gerund (-ing) form only","صيغة المصدر (-ing) فقط"],["The imperative form","صيغة الأمر"]], a:1},
   {q:["If the agent is not specified after 'by' in a passive sentence, you should:","إذا لم يُذكر الفاعل بعد 'by' في جملة مبنية للمجهول، يجب:"], o:[["Leave the active sentence with no subject","ترك الجملة المبنية للمعلوم دون فاعل"],["Infer the agent from the action or context","استنتاج الفاعل من الفعل أو السياق"],["The sentence cannot be converted at all","لا يمكن تحويل الجملة إطلاقًا"],["Always use 'someone' as the agent","استخدام 'someone' دائمًا كفاعل"]], a:1},
   {q:["Convert to active voice: 'The components were identified by Thomas and his associates.'","حوّل إلى المبني للمعلوم: 'The components were identified by Thomas and his associates.'"], o:[["Thomas and his associates identified the components.","Thomas and his associates identified the components."],["The components identified Thomas.","The components identified Thomas."],["Thomas was identified by the components.","Thomas was identified by the components."],["The components were Thomas's associates.","The components were Thomas's associates."]], a:0},
   {q:["Active Voice is typically used for:","يُستخدم المبني للمعلوم عادة من أجل:"], o:[["Vague, indirect writing","كتابة غامضة وغير مباشرة"],["Clear, direct, and strong writing","كتابة واضحة ومباشرة وقوية"],["Only poetry","الشعر فقط"],["Only legal contracts","العقود القانونية فقط"]], a:1},
   {q:["Passive Voice is typically used in:","يُستخدم المبني للمجهول عادة في:"], o:[["Casual text messages only","الرسائل النصية غير الرسمية فقط"],["Formal writing such as reports and proposals","الكتابة الرسمية مثل التقارير والمقترحات"],["Song lyrics only","كلمات الأغاني فقط"],["Children's stories only","قصص الأطفال فقط"]], a:1},
   {q:["Which type of verb can be transformed into passive voice?","أي نوع من الأفعال يمكن تحويله إلى المبني للمجهول؟"], o:[["Intransitive verbs only","الأفعال اللازمة فقط"],["Transitive verbs (verbs that take an object)","الأفعال المتعدية (التي تأخذ مفعولًا به)"],["All verbs, without exception","جميع الأفعال، دون استثناء"],["Only irregular verbs","الأفعال الشاذة فقط"]], a:1},
   {q:["According to the lecture's summary, which style is more verbose?","وفق خلاصة المحاضرة، أي أسلوب أكثر إطنابًا؟"], o:[["Active voice","المبني للمعلوم"],["Passive voice","المبني للمجهول"],["Both are equally concise","كلاهما موجز بالتساوي"],["Neither has a style difference","لا فرق أسلوبي بينهما"]], a:1}
  ]
});

  sec:[
   {t:["What Is Note Making?","ما هو تدوين الملاحظات؟"], b:[
     {k:'def', x:["A note can be defined as a systematic method of quickly, briefly, and clearly writing down the important points of a text being read. It is a productive skill that integrates both reading and writing skills.","يمكن تعريف الملاحظة (Note) بأنها طريقة منهجية لتدوين النقاط المهمة من نص مقروء بسرعة وإيجاز ووضوح. وهي مهارة إنتاجية تدمج مهارتي القراءة والكتابة معًا."]},
     {k:'ul', h:["Note making is used to:","يُستخدم تدوين الملاحظات من أجل:"], x:[
       ["Keep a record of the main points of a reading text for future use and reference.","الاحتفاظ بسجل للنقاط الرئيسية لنص مقروء لاستخدامه والرجوع إليه مستقبلًا."],
       ["Revise for an exam.","المراجعة لامتحان."],
       ["Update information.","تحديث المعلومات."],
       ["Analyze a text.","تحليل نص."]]}
   ]},
   {t:["Reading Strategy for Note Making","استراتيجية القراءة لتدوين الملاحظات"], b:[
     {k:'p', x:["A careful reading plan is to identify the central idea, important points, and supporting details. This enables you to understand the text quickly and make appropriate notes.","تتمثل خطة القراءة الدقيقة في تحديد الفكرة المركزية والنقاط المهمة والتفاصيل الداعمة. وهذا يُمكّنك من فهم النص بسرعة وتدوين الملاحظات المناسبة."]},
     {k:'ul', x:[
       ["Recognize the key lexical items related to the topic.","التعرف على المفردات الرئيسية المرتبطة بالموضوع."],
       ["Identify the relationships among the units within the text.","تحديد العلاقات بين الوحدات داخل النص."],
       ["Read the key points and signal words.","قراءة النقاط الرئيسية والكلمات الدلالية."],
       ["Ignore irrelevant matter and concentrate on the main parts.","تجاهل المحتوى غير ذي الصلة والتركيز على الأجزاء الرئيسية."],
       ["Deduce meanings of words and phrases from context and infer relationships.","استنتاج معاني الكلمات والعبارات من السياق واستنباط العلاقات."],
       ["Interpret graphic aids used in the text.","تفسير الوسائل البيانية المستخدمة في النص."]]}
   ]},
   {t:["How to Make Notes: Heading, Subheadings, Points","كيفية تدوين الملاحظات: العنوان، العناوين الفرعية، النقاط"], b:[
     {k:'def', x:["Heading: What is the main idea of the passage? Frame a heading based on the central idea and write it in the middle of the page.","العنوان (Heading): ما الفكرة الرئيسية للنص؟ صُغ عنوانًا بناءً على الفكرة المركزية واكتبه في منتصف الصفحة."]},
     {k:'def', x:["Subheadings: How was the main idea presented and developed? Are there two or three subordinate ideas? Frame subheadings based on these.","العناوين الفرعية (Subheadings): كيف قُدّمت الفكرة الرئيسية وطُوّرت؟ هل هناك فكرتان أو ثلاث أفكار فرعية؟ صُغ عناوين فرعية بناءً عليها."]},
     {k:'def', x:["Points: Are there further details or points under the subheadings that you wish to keep in the notes? All subheadings should be written at a uniform distance from the margin, with suitable indentation (space and number).","النقاط (Points): هل هناك تفاصيل أو نقاط إضافية تحت العناوين الفرعية ترغب بالاحتفاظ بها في الملاحظات؟ يجب كتابة جميع العناوين الفرعية على مسافة موحدة من الهامش، مع إزاحة مناسبة (مسافة ورقم)."]}
   ]},
   {t:["Using Abbreviations in Notes","استخدام الاختصارات في الملاحظات"], b:[
     {k:'p', x:["Do not write full sentences. Use abbreviations and standard symbols wherever necessary.","لا تكتب جملًا كاملة. استخدم الاختصارات والرموز القياسية حيثما لزم الأمر."]},
     {k:'ul', h:["Abbreviation techniques","تقنيات الاختصار"], x:[
       ["Capitalize the first letters of words — e.g. U.P., USA, USSR, UK.","استخدام الأحرف الأولى الكبيرة للكلمات — مثل U.P., USA, USSR, UK."],
       ["Use common abbreviations — e.g. Sc (Science), Geog (Geography), Mr, Mrs, Dr, Govt.","استخدام الاختصارات الشائعة — مثل Sc (Science)، Geog (Geography)، Mr، Mrs، Dr، Govt."],
       ["Write the first few and last few letters of a word with an apostrophe in between — e.g. can't (cannot), w'out (without), wrt'g (writing).","كتابة الأحرف القليلة الأولى والأخيرة من الكلمة مع فاصلة عليا بينها — مثل can't (cannot)، w'out (without)، wrt'g (writing)."],
       ["Use the first letters of phrases — e.g. Kilogram → Kg, Per annum → P A, Curriculum Vitae → CV.","استخدام الأحرف الأولى للعبارات — مثل Kilogram ← Kg، Per annum ← P A، Curriculum Vitae ← CV."],
       ["Use the first few letters of words or phrases — e.g. Approximately → Approx, Difference → Diff, Professor → Prof.","استخدام الأحرف القليلة الأولى للكلمات أو العبارات — مثل Approximately ← Approx، Difference ← Diff، Professor ← Prof."],
       ["Use generally accepted abbreviations — e.g. e.g. (example), viz (namely), et al (and others), N.B. (take note that).","استخدام الاختصارات المتعارف عليها عمومًا — مثل e.g. (مثال)، viz (أي)، et al (وآخرون)، N.B. (لاحظ أن)."]]}
   ]},
   {t:["Three Methods of Note Making","ثلاث طرق لتدوين الملاحظات"], b:[
     {k:'def', x:["Topicalising: the main points and central idea are rephrased in points, with redundant words and phrases removed.","التبويب الموضوعي (Topicalising): تُعاد صياغة النقاط الرئيسية والفكرة المركزية في شكل نقاط، مع حذف الكلمات والعبارات الزائدة."]},
     {k:'def', x:["Schematizing: scientific and technical texts may contain forms, figures, classifications, contrasts, and processes — so notes are organized in the form of tables and diagrams.","التخطيط البياني (Schematizing): قد تحتوي النصوص العلمية والتقنية على نماذج وأشكال وتصنيفات ومقارنات وعمليات — لذا تُنظَّم الملاحظات في شكل جداول ومخططات."]},
     {k:'def', x:["Sequencing: the process of making a clear layout for fast and accurate interpretation of notes.","التسلسل (Sequencing): عملية وضع تخطيط واضح لتفسير الملاحظات بسرعة ودقة."]}
   ]},
   {t:["Summarizing: The Five C's","التلخيص: الحروف الخمسة C's"], b:[
     {k:'def', x:["Summarizing provides maximum information in the minimum number of words. It improves your ability to write concisely by making you aware of the kind of details that can be avoided to achieve precision.","يُقدّم التلخيص أقصى قدر من المعلومات في أقل عدد من الكلمات. ويُحسّن قدرتك على الكتابة بإيجاز من خلال توعيتك بنوع التفاصيل التي يمكن تجنبها لتحقيق الدقة."]},
     {k:'ul', h:["The five C's important for summarizing: completeness, compactness, conciseness, clarity, coherence.","الحروف الخمسة C's المهمة للتلخيص: الاكتمال، التماسك، الإيجاز، الوضوح، الترابط."], x:[
       ["Completeness: the summary must have all the essential elements/contents of the original.","الاكتمال (Completeness): يجب أن يحتوي الملخص على جميع العناصر/المحتويات الأساسية للنص الأصلي."],
       ["Compactness: all the ideas should form a compact whole — unity is important.","التماسك (Compactness): يجب أن تُشكّل جميع الأفكار كلًا متماسكًا — الوحدة مهمة."],
       ["Conciseness: brevity is the soul of wit — all ideas should be clear and concise.","الإيجاز (Conciseness): الإيجاز روح البلاغة — يجب أن تكون جميع الأفكار واضحة وموجزة."],
       ["Clarity: clarity of expression is essential — no vague statements.","الوضوح (Clarity): وضوح التعبير أساسي — لا عبارات غامضة."],
       ["Coherence: all sentences/ideas should have a logical, chronological, and spatial order, linked coherently.","الترابط (Coherence): يجب أن يكون لجميع الجمل/الأفكار ترتيب منطقي وزمني ومكاني، مترابط بتماسك."]]},
     {k:'tip', x:["Summarizing, like note making, is a productive skill integrating both reading and writing skills. To write effective summaries, you need to read the material carefully with good comprehension.","التلخيص، مثل تدوين الملاحظات، مهارة إنتاجية تدمج مهارتي القراءة والكتابة. ولكتابة ملخصات فعّالة، يجب قراءة المادة بعناية وفهم جيد."]}
   ]}
  ],
  take:[

   ["Good notes follow a Heading → Subheadings → Points structure, with uniform indentation.","تتبع الملاحظات الجيدة بنية العنوان ← العناوين الفرعية ← النقاط، مع إزاحة موحدة."],
   ["Notes use abbreviations and symbols instead of full sentences — capitalized initials, truncated words, apostrophes, and standard shorthand (e.g., etc).","تستخدم الملاحظات الاختصارات والرموز بدلًا من الجمل الكاملة — أحرف أولى كبيرة، كلمات مقتطعة، فواصل عليا، واختصارات قياسية (e.g.، etc)."],
   ["Three note-making methods: Topicalising (rephrase in points), Schematizing (tables/diagrams), Sequencing (clear layout).","ثلاث طرق لتدوين الملاحظات: التبويب الموضوعي (إعادة الصياغة في نقاط)، التخطيط البياني (جداول/مخططات)، التسلسل (تخطيط واضح)."],
   ["The five C's of summarizing: completeness, compactness, conciseness, clarity, coherence.","الحروف الخمسة C's للتلخيص: الاكتمال، التماسك، الإيجاز، الوضوح، الترابط."]

   [["List the four uses of note making.","اذكر الاستخدامات الأربعة لتدوين الملاحظات."],["Keeping a record for future reference, revising for an exam, updating information, and analyzing a text.","الاحتفاظ بسجل للرجوع إليه مستقبلًا، المراجعة لامتحان، تحديث المعلومات، وتحليل نص."]],

     {k:'p', x:["Compound nouns may be countable, uncountable, or used only in the singular or the plural.","قد تكون الأسماء المركبة معدودة أو غير معدودة، أو تُستخدم فقط في صيغة المفرد أو الجمع."]},
     {k:'cards', c:[
       {t:["Common Countable Compound Nouns","أسماء مركبة معدودة شائعة"], l:[["Tea-bag, contact lens, credit card, food token, hand cuffs, windscreen.","Tea-bag وcontact lens وcredit card وfood token وhand cuffs وwindscreen."]]},
       {t:["Common Uncountable Compound Nouns","أسماء مركبة غير معدودة شائعة"], l:[["Income-tax, data-processing, family-planning, pocket money, swine-flu, fast-food.","Income-tax وdata-processing وfamily-planning وpocket money وswine-flu وfast-food."]]},
       {t:["Used Only in the Singular","تُستخدم فقط في صيغة المفرد"], l:[["Generation-gap, brain drain, mother-tongue, labour force, death-penalty, blood-pressure.","Generation-gap وbrain drain وmother-tongue وlabour force وdeath-penalty وblood-pressure."]]},
       {t:["Used Only in the Plural","تُستخدم فقط في صيغة الجمع"], l:[["Roadworks, traffic-lights, dancing shoes, sun-glasses, human rights.","Roadworks وtraffic-lights وdancing shoes وsun-glasses وhuman rights."]]}
     ]}
   ]},
   {t:["Negative Prefixes: General Rules","البادئات السلبية: القواعد العامة"], b:[
     {k:'p', x:["Prefixes are often used to give adjectives a negative meaning: similar → dissimilar, kind → unkind, decent → indecent, obedient → disobedient. Unfortunately, there is no easy way to know in advance which prefix an adjective will use — when you learn a new adjective, note down whether it has an opposite formed with a prefix, and if so, what it is.","غالبًا ما تُستخدم البادئات لإعطاء الصفات معنى سلبيًا: similar ← dissimilar، kind ← unkind، decent ← indecent، obedient ← disobedient. للأسف، لا توجد طريقة سهلة لمعرفة أي بادئة ستستخدمها الصفة مسبقًا — فعند تعلّم صفة جديدة، لاحظ ما إذا كان لها عكس يُكوَّن ببادئة، وما هي إن وُجدت."]},
     {k:'ul', h:["Spelling rules to remember","قواعد تهجئة يجب تذكرها"], x:[
       ["in- becomes im- before a root beginning with 'm' or 'p' — e.g. immature, impatient, improbable.","تصبح in- → im- قبل جذر يبدأ بـ 'm' أو 'p' — مثل immature وimpatient وimprobable."],
       ["in- becomes ir- before a word beginning with 'r' — e.g. irreplaceable, irreversible.","تصبح in- → ir- قبل كلمة تبدأ بـ 'r' — مثل irreplaceable وirreversible."],
       ["in- becomes il- before a word beginning with 'l' — e.g. illegal, illegible, illiterate.","تصبح in- → il- قبل كلمة تبدأ بـ 'l' — مثل illegal وillegible وilliterate."]]},
     {k:'tip', x:["The prefix in- does not always have a negative meaning — often it gives the idea of 'inside' or 'into', e.g. impart, internal, insert, income.","لا تحمل البادئة in- معنى سلبيًا دائمًا — فغالبًا ما تُعطي فكرة 'الداخل' أو 'إلى الداخل'، مثل impart وinternal وinsert وincome."]}
   ]},
   {t:["Negative Prefixes with Verbs","البادئات السلبية مع الأفعال"], b:[
     {k:'p', x:["Although it is mainly adjectives that are made negative by prefixes, in- and dis- can also form the opposites of verbs, reversing the action of the verb — e.g. appear → disappear.","رغم أن الصفات هي التي تُجعل سلبية بالبادئات في الغالب، يمكن لـ in- وdis- أيضًا تكوين عكس الأفعال، بعكس فعل الفعل — مثل appear ← disappear."]},
     {k:'ul', x:[
       ["disagree, disapprove, disbelieve, disconnect, discredit, dislike, dismount, disqualify.","disagree وdisapprove وdisbelieve وdisconnect وdiscredit وdislike وdismount وdisqualify."],
       ["unbend, undo, undress, unfold, unload, unlock, unveil, unwrap, unzip.","unbend وundo وundress وunfold وunload وunlock وunveil وunwrap وunzip."]]}
   ]},
   {t:["Categories of Prefixes","فئات البادئات"], b:[
     {k:'tbl', h:[["Category","الفئة"],["Prefixes","البادئات"],["Examples"]],
      r:[
       [["Reversative — reverses the action of the base, without negative implication.","انعكاسية (Reversative) — تعكس فعل الأساس، دون دلالة سلبية."],["un-, de-, dis-","un-، de-، dis-"],["undo, untie, unpack, dehydrate, decode, defrost, decentralise, disown"]],
       [["Pejorative — gives the sense of ill, bad, wrong, or not in the right way.","تحقيرية (Pejorative) — تُعطي معنى السيئ أو الخاطئ أو غير الصحيح."],["mis-, mal-, pseudo-","mis-، mal-، pseudo-"],["misuse, misunderstanding, malfunction, malnutrition, pseudo-intellectual"]],
       [["Time and Order","الزمن والترتيب"],["fore-, pre-, post-, ex-, re-","fore-، pre-، post-، ex-، re-"],["forewarn, pre-war, post-war, ex-president, reappear"]],
       [["Change word-class — convert the base into a different word class.","مُغيّرة لفئة الكلمة — تُحوّل الأساس إلى فئة كلمة مختلفة."],["be-, en-, a-","be-، en-، a-"],["bewitch, empower, astray"]],
       [["Negative — reverse or negate the meaning of the word.","سلبية (Negative) — تعكس أو تنفي معنى الكلمة."],["a-, de-, il-, im-, in-, ir-, dis-, mis-, non-, un-","a-، de-، il-، im-، in-، ir-، dis-، mis-، non-، un-"],["amoral, decentralize, disrespect, illogical, illegal"]]
      ]}
   ]}
  ],
  take:[
   ["Nouns have many types: common, abstract, collective, concrete, countable, uncountable, proper, and gerund.","للأسماء أنواع عديدة: العام، المجرد، الجماعة، المحسوس، المعدود، غير المعدود، العلم، واسم المصدر."],
   ["A compound noun combines two or more words into one noun unit, formed as one word, hyphenated, or separate words.","يجمع الاسم المركب كلمتين أو أكثر في وحدة اسمية واحدة، وقد يُكتب ككلمة واحدة أو بفاصل أو ككلمات منفصلة."],
   ["Compound nouns can be countable, uncountable, singular-only, or plural-only.","يمكن أن تكون الأسماء المركبة معدودة أو غير معدودة أو تُستخدم فقط بصيغة المفرد أو الجمع."],
   ["Key spelling rules: in- → im- before m/p, in- → ir- before r, in- → il- before l.","قواعد تهجئة أساسية: in- ← im- قبل m/p، in- ← ir- قبل r، in- ← il- قبل l."],
   ["Five prefix categories: Reversative, Pejorative, Time/Order, Word-class-changing, and Negative.","خمس فئات للبادئات: الانعكاسية، التحقيرية، الزمن/الترتيب، مُغيّرة فئة الكلمة، والسلبية."]
  ],
  fc:[
   [["Define a noun.","عرّف الاسم."],["The part of speech which names a person, animal, place, thing, or a quality of a thing.","قسم الكلام الذي يُسمّي شخصًا أو حيوانًا أو مكانًا أو شيئًا أو صفة لشيء."]],
   [["Give an example of a collective noun.","اذكر مثالًا على اسم جماعة."],["Any of: crowd, fleet, team, group.","أي من: crowd، fleet، team، group."]],
   [["What is a gerund noun, and give an example.","ما هو اسم المصدر (Gerund)، واذكر مثالًا."],["A noun formed from a verb by adding '-ing', e.g. singing (as in 'I love singing').","اسم يتكوّن من فعل بإضافة '-ing'، مثل singing (كما في 'I love singing')."]],
   [["Define a compound noun.","عرّف الاسم المركب."],["An expression of more than one word that functions as a noun, often a combination of two nouns.","تعبير من أكثر من كلمة يعمل كاسم واحد، وغالبًا ما يكون مزيجًا من اسمين."]],
   [["Give the formation pattern of 'Black bird' and 'Under-water'.","اذكر نمط تكوين 'Black bird' و'Under-water'."],["Black bird = adjective + noun; Under-water = preposition + noun.","Black bird = صفة + اسم؛ Under-water = حرف جر + اسم."]],
   [["Give one example each of a compound noun written as one word, with a hyphen, and as separate words.","اذكر مثالًا لكل من: اسم مركب يُكتب ككلمة واحدة، بفاصل، وككلمات منفصلة."],["Earring (one word), Pen-name (hyphen), Tin opener (separate words).","Earring (كلمة واحدة)، Pen-name (بفاصل)، Tin opener (كلمات منفصلة)."]],
   [["State the spelling rule for in- before a root starting with 'm' or 'p'.","اذكر قاعدة التهجئة لـ in- قبل جذر يبدأ بـ 'm' أو 'p'."],["in- becomes im- — e.g. immature, impatient.","تصبح in- ← im- — مثل immature وimpatient."]],
   [["State the spelling rule for in- before a word starting with 'r'.","اذكر قاعدة التهجئة لـ in- قبل كلمة تبدأ بـ 'r'."],["in- becomes ir- — e.g. irreplaceable, irreversible.","تصبح in- ← ir- — مثل irreplaceable وirreversible."]],
   [["Does the prefix in- always mean negation? Give an example.","هل تعني البادئة in- النفي دائمًا؟ اذكر مثالًا."],["No — it can mean 'inside/into', e.g. insert, internal.","لا — قد تعني 'الداخل/إلى الداخل'، مثل insert وinternal."]],
   [["Give an example of a verb made negative with dis-.","اذكر مثالًا على فعل جُعل سلبيًا بـ dis-."],["Any of: disagree, disapprove, disconnect, dislike.","أي من: disagree، disapprove، disconnect، dislike."]],
   [["What meaning do Pejorative prefixes (mis-, mal-, pseudo-) give?","ما المعنى الذي تُعطيه البادئات التحقيرية (mis-، mal-، pseudo-)؟"],["The sense of ill, bad, wrong, or not in the right way — e.g. misuse, malfunction.","معنى السيئ أو الخاطئ أو غير الصحيح — مثل misuse وmalfunction."]],
   [["Give an example of a 'Time and Order' prefix and a word using it.","اذكر مثالًا لبادئة 'الزمن والترتيب' وكلمة تستخدمها."],["Any of: fore- (forewarn), pre- (pre-war), post- (post-war), ex- (ex-president), re- (reappear).","أي من: fore- (forewarn)، pre- (pre-war)، post- (post-war)، ex- (ex-president)، re- (reappear)."]],
   [["Give an example of a prefix that changes word-class, with its example word.","اذكر مثالًا على بادئة تُغيّر فئة الكلمة، مع كلمة مثال."],["Any of: be- (bewitch), en- (empower), a- (astray).","أي من: be- (bewitch)، en- (empower)، a- (astray)."]]
  ],
  quiz:[
   {q:["Which is an example of a collective noun?","أي مما يلي مثال على اسم جماعة؟"], o:[["honesty","honesty"],["team","team"],["gold","gold"],["Delhi","Delhi"]], a:1},
   {q:["Which is an example of an abstract noun?","أي مما يلي مثال على اسم مجرد؟"], o:[["wisdom","wisdom"],["crowd","crowd"],["chair","chair"],["Rama","Rama"]], a:0},
   {q:["A gerund noun is formed by:","يتكوّن اسم المصدر (Gerund) من خلال:"], o:[["Adding '-ed' to a verb","إضافة '-ed' إلى فعل"],["Adding '-ing' to a verb","إضافة '-ing' إلى فعل"],["Removing the last letter of a noun","حذف الحرف الأخير من اسم"],["Capitalizing a common noun","تكبير اسم عام"]], a:1},
   {q:["'Hair cut' is an example of which compound noun formation pattern?","'Hair cut' مثال على أي نمط لتكوين الاسم المركب؟"], o:[["Adjective + noun","صفة + اسم"],["Preposition + noun","حرف جر + اسم"],["Noun + verb","اسم + فعل"],["Verb + adjective","فعل + صفة"]], a:2},
   {q:["Which compound noun is used ONLY in the plural, per the lecture?","أي اسم مركب يُستخدم فقط بصيغة الجمع، وفق المحاضرة؟"], o:[["Mother-tongue","Mother-tongue"],["Sun-glasses","Sun-glasses"],["Income-tax","Income-tax"],["Blood-pressure","Blood-pressure"]], a:1},
   {q:["According to the spelling rule, 'in-' becomes 'im-' before a root beginning with:","وفق قاعدة التهجئة، تصبح 'in-' إلى 'im-' قبل جذر يبدأ بـ:"], o:[["'r' or 'l'","'r' أو 'l'"],["'m' or 'p'","'m' أو 'p'"],["Any vowel","أي حرف علة"],["'s' or 't'","'s' أو 't'"]], a:1},
   {q:["Which word correctly shows 'in-' becoming 'il-' before a root beginning with 'l'?","أي كلمة تُظهر بشكل صحيح تحوّل 'in-' إلى 'il-' قبل جذر يبدأ بـ 'l'؟"], o:[["irreplaceable","irreplaceable"],["impatient","impatient"],["illegal","illegal"],["disagree","disagree"]], a:2},
   {q:["Which word shows that 'in-' does NOT always mean negation?","أي كلمة تُظهر أن 'in-' لا تعني النفي دائمًا؟"], o:[["insert","insert"],["indecent","indecent"],["improbable","improbable"],["irreversible","irreversible"]], a:0},
   {q:["Which prefix type reverses an action WITHOUT negative implication?","أي نوع من البادئات يعكس فعلًا دون دلالة سلبية؟"], o:[["Pejorative","التحقيرية"],["Reversative","الانعكاسية"],["Time and Order","الزمن والترتيب"],["Word-class-changing","مُغيّرة فئة الكلمة"]], a:1},
   {q:["Which prefixes form the Pejorative category?","أي بادئات تُشكّل الفئة التحقيرية؟"], o:[["un-, de-, dis-","un-، de-، dis-"],["fore-, pre-, post-","fore-، pre-، post-"],["mis-, mal-, pseudo-","mis-، mal-، pseudo-"],["be-, en-, a-","be-، en-، a-"]], a:2},
   {q:["Which prefix set belongs to the 'Time and Order' category?","أي مجموعة بادئات تنتمي لفئة 'الزمن والترتيب'؟"], o:[["be-, en-, a-","be-، en-، a-"],["fore-, pre-, post-, ex-, re-","fore-، pre-، post-، ex-، re-"],["mis-, mal-, pseudo-","mis-، mal-، pseudo-"],["un-, de-, dis-","un-، de-، dis-"]], a:1},
   {q:["Which prefix converts the base word into a different word-class, as in 'bewitch'?","أي بادئة تُحوّل الكلمة الأساس إلى فئة كلمة مختلفة، كما في 'bewitch'؟"], o:[["mis-","mis-"],["be-","be-"],["re-","re-"],["ir-","ir-"]], a:1}
  ]
});

LECTURES.push({ id:'l5', n:5,
  title:["Writing System Requirements & Specifications","كتابة متطلبات ومواصفات الأنظمة"],
  obj:[
    ["Explain why Requirements Engineering is critical to software project success.","شرح أهمية هندسة المتطلبات لنجاح مشاريع البرمجيات."],
    ["Distinguish System Requirements Specification (SyRS) from Software Requirements Specification (SRS).","التمييز بين مواصفات متطلبات النظام (SyRS) ومواصفات متطلبات البرمجيات (SRS)."],
    ["Write a functional requirement using the standard structure, and classify it into one of the four functional categories.","كتابة متطلب وظيفي باستخدام البنية القياسية، وتصنيفه ضمن إحدى الفئات الوظيفية الأربع."],
    ["Distinguish functional from non-functional requirements, and write a quantified, testable NFR.","التمييز بين المتطلبات الوظيفية وغير الوظيفية، وكتابة متطلب غير وظيفي كمّي وقابل للاختبار."]
  ],
  sec:[
   {t:["Why Requirements Engineering Matters","لماذا تهم هندسة المتطلبات"], b:[
     {k:'p', x:["In the software development lifecycle (SDLC), Requirements Engineering (RE) bridges the gap between high-level business goals and implementation-level code. More software projects fail due to poor, ambiguous, or incomplete requirements than due to technical coding errors.","في دورة حياة تطوير البرمجيات (SDLC)، تسد هندسة المتطلبات (Requirements Engineering) الفجوة بين أهداف الأعمال رفيعة المستوى والشيفرة على مستوى التنفيذ. وتفشل مشاريع برمجية أكثر بسبب متطلبات ضعيفة أو غامضة أو ناقصة أكثر مما تفشل بسبب أخطاء برمجية تقنية."]},
     {k:'p', x:["For IT professionals, the ability to write precise, clear, and unambiguous specification documents is a foundational skill — primarily for authoring the Software Requirements Specification (SRS).","بالنسبة لأخصائيي تقنية المعلومات، تُعد القدرة على كتابة وثائق مواصفات دقيقة وواضحة وغير غامضة مهارة أساسية — خصوصًا لصياغة مواصفات متطلبات البرمجيات (SRS)."]}
   ]},
   {t:["The Requirement Construct","بنية المتطلب"], b:[
     {k:'def', x:["A requirement is a statement that identifies a product or process operational constraint, characteristic, or attribute that must be verified and is contractually binding.","المتطلب (Requirement) هو عبارة تحدد قيدًا تشغيليًا أو خاصية أو سمة لمنتج أو عملية، يجب التحقق منها وتكون ملزمة تعاقديًا."]}
   ]},
   {t:["System Requirements vs. Software Requirements","متطلبات النظام مقابل متطلبات البرمجيات"], b:[
     {k:'tbl', h:[["Term","المصطلح"],["Definition","التعريف"]],
      r:[
       [["System Requirements Specification (SyRS)","مواصفات متطلبات النظام (SyRS)"],["High-level operational needs of an entire system, combining hardware, software, human operators, and physical infrastructure.","الاحتياجات التشغيلية رفيعة المستوى لنظام كامل، تجمع العتاد والبرمجيات والمشغّلين البشريين والبنية التحتية المادية."]],
       [["Software Requirements Specification (SRS)","مواصفات متطلبات البرمجيات (SRS)"],["A detailed breakdown focusing exclusively on software features, data behaviors, interfaces, and external constraints.","تفصيل دقيق يُركّز حصريًا على ميزات البرمجيات وسلوكيات البيانات والواجهات والقيود الخارجية."]]
      ]}
   ]},
   {t:["Functional Requirements (FRs)","المتطلبات الوظيفية (FRs)"], b:[
     {k:'def', x:["Functional requirements define the core functions, processing logic, data transformations, and interactions that the system must perform.","تُحدّد المتطلبات الوظيفية الوظائف الأساسية ومنطق المعالجة وتحويلات البيانات والتفاعلات التي يجب أن يؤديها النظام."]},
     {k:'formula', x:"Structure: [Subject] + [Modal Verb] + [System Action] + [Object] + [Condition/Context]"},
     {k:'p', x:["Focus: inputs, transformations, system state changes, and outputs.","التركيز: المُدخلات، التحويلات، تغييرات حالة النظام، والمُخرجات."]},
     {k:'ex', x:["The Authentication Module shall lock a user account for 15 minutes when three consecutive invalid login attempts occur within a 5-minute window.","يجب أن تُقفل وحدة المصادقة حساب المستخدم لمدة 15 دقيقة عند حدوث ثلاث محاولات تسجيل دخول غير صحيحة متتالية خلال نافذة زمنية مدتها 5 دقائق."]},
     {k:'ul', h:["Functional Categories","الفئات الوظيفية"], x:[
       ["User Authentication & Authorization — access control, identity validation, role-based controls.","المصادقة والتفويض — التحكم في الوصول، التحقق من الهوية، الضوابط المبنية على الأدوار."],
       ["Data Processing & Storage — CRUD operations (Create, Read, Update, Delete), transaction handling, validation rules.","معالجة البيانات وتخزينها — عمليات CRUD (الإنشاء، القراءة، التحديث، الحذف)، معالجة المعاملات، قواعد التحقق."],
       ["External Interface Interactions — data transfers via APIs, integration with third-party payment gateways or messaging queues.","تفاعلات الواجهة الخارجية — نقل البيانات عبر واجهات برمجة التطبيقات (APIs)، والتكامل مع بوابات دفع أو طوابير رسائل خارجية."],
       ["Business Logic Execution — domain-specific calculations, e.g. tax calculation algorithms, routing protocols.","تنفيذ منطق الأعمال — حسابات خاصة بالمجال، مثل خوارزميات حساب الضرائب وبروتوكولات التوجيه."]]}
   ]},
   {t:["Non-Functional Requirements (NFRs / Quality Attributes)","المتطلبات غير الوظيفية (NFRs / سمات الجودة)"], b:[
     {k:'def', x:["Non-functional requirements describe how well the system performs its functions. They dictate system properties and quality attributes.","تصف المتطلبات غير الوظيفية مدى جودة أداء النظام لوظائفه. وتُحدّد خصائص النظام وسمات الجودة."]},
     {k:'tbl', h:[["NFR Category","فئة المتطلب غير الوظيفي"],["Good Example (Quantified & Testable)","مثال جيد (كمّي وقابل للاختبار)"],["Bad Example (Vague)","مثال ضعيف (غامض)"],["Technical Focus","التركيز التقني"]],
      r:[
       [["Performance","الأداء"],["The web application shall render the dashboard within 1.5 seconds under a load of 500 concurrent active users.","يجب أن يعرض تطبيق الويب لوحة التحكم خلال 1.5 ثانية تحت حمل 500 مستخدم نشط متزامن."],["The system must load pages quickly.","يجب أن يُحمّل النظام الصفحات بسرعة."],["Latency, Throughput, Resource Usage","زمن الاستجابة، معدل الإنتاجية، استهلاك الموارد"]],
       [["Security","الأمان"],["The system shall encrypt all sensitive user data at rest using AES-256 and in transit using TLS 1.3.","يجب أن يُشفّر النظام جميع بيانات المستخدم الحساسة أثناء التخزين باستخدام AES-256 وأثناء النقل باستخدام TLS 1.3."],["The database must be secure from hackers.","يجب أن تكون قاعدة البيانات آمنة من القراصنة."],["Encryption, Authentication, Confidentiality","التشفير، المصادقة، السرية"]],
       [["Availability / Reliability","التوفر / الموثوقية"],["The core API service shall maintain an operational uptime of 99.95% per calendar month, excluding scheduled maintenance.","يجب أن تحافظ خدمة واجهة برمجة التطبيقات الأساسية على نسبة تشغيل 99.95% شهريًا، باستثناء الصيانة المجدولة."],["The system should almost never go down.","يجب ألا يتوقف النظام تقريبًا أبدًا."],["Uptime, Mean Time Between Failures (MTBF)","نسبة التشغيل، متوسط الوقت بين الأعطال (MTBF)"]]
      ]}
   ]}

  take:[
   ["More software projects fail from poor requirements than from coding errors — RE bridges business goals and implementation.","تفشل مشاريع برمجية أكثر بسبب متطلبات ضعيفة أكثر مما تفشل بسبب أخطاء برمجية — وهندسة المتطلبات تسد الفجوة بين أهداف الأعمال والتنفيذ."],
   ["SyRS covers the whole system (hardware+software+people+infrastructure); SRS focuses only on software.","تغطي SyRS النظام بأكمله (عتاد+برمجيات+أشخاص+بنية تحتية)؛ بينما تُركّز SRS على البرمجيات فقط."],
   ["Functional requirement structure: [Subject] + [Modal Verb] + [System Action] + [Object] + [Condition/Context].","بنية المتطلب الوظيفي: [الفاعل] + [الفعل الواصفي] + [فعل النظام] + [المفعول به] + [الشرط/السياق]."],
   ["Four functional categories: User Auth/Authorization, Data Processing/Storage, External Interface Interactions, Business Logic Execution.","أربع فئات وظيفية: المصادقة/التفويض، معالجة/تخزين البيانات، تفاعلات الواجهة الخارجية، تنفيذ منطق الأعمال."],
   ["Good NFRs are quantified and testable ('within 1.5 seconds'); bad NFRs are vague ('quickly').","المتطلبات غير الوظيفية الجيدة كمّية وقابلة للاختبار ('خلال 1.5 ثانية')؛ أما الضعيفة فغامضة ('بسرعة')."]

  fc:[
   [["What does Requirements Engineering (RE) do in the SDLC?","ماذا تفعل هندسة المتطلبات (RE) في دورة حياة تطوير البرمجيات؟"],["Bridges the gap between high-level business goals and implementation-level code.","تسد الفجوة بين أهداف الأعمال رفيعة المستوى والشيفرة على مستوى التنفيذ."]],
   [["What causes more software project failures: poor requirements or coding errors?","ما الذي يُسبب فشل مشاريع برمجية أكثر: المتطلبات الضعيفة أم الأخطاء البرمجية؟"],["Poor, ambiguous, or incomplete requirements.","المتطلبات الضعيفة أو الغامضة أو الناقصة."]],
   [["Define a requirement.","عرّف المتطلب."],["A statement identifying a product/process operational constraint, characteristic, or attribute that must be verified and is contractually binding.","عبارة تحدد قيدًا تشغيليًا أو خاصية أو سمة لمنتج/عملية، يجب التحقق منها وتكون ملزمة تعاقديًا."]],
   [["What does SyRS stand for, and what does it cover?","ماذا يعني اختصار SyRS، وماذا يغطي؟"],["System Requirements Specification — high-level needs of the whole system (hardware, software, operators, infrastructure).","مواصفات متطلبات النظام — الاحتياجات رفيعة المستوى للنظام بأكمله (العتاد، البرمجيات، المشغّلون، البنية التحتية)."]],
   [["What does SRS stand for, and what does it cover?","ماذا يعني اختصار SRS، وماذا يغطي؟"],["Software Requirements Specification — a detailed breakdown of software features, data behaviors, interfaces, and external constraints.","مواصفات متطلبات البرمجيات — تفصيل دقيق لميزات البرمجيات وسلوكيات البيانات والواجهات والقيود الخارجية."]],
   [["Give the standard structure for writing a functional requirement.","اذكر البنية القياسية لكتابة متطلب وظيفي."],["[Subject] + [Modal Verb] + [System Action] + [Object] + [Condition/Context].","[الفاعل] + [الفعل الواصفي] + [فعل النظام] + [المفعول به] + [الشرط/السياق]."]],
   [["List the four functional categories.","اذكر الفئات الوظيفية الأربع."],["User Authentication & Authorization, Data Processing & Storage, External Interface Interactions, Business Logic Execution.","المصادقة والتفويض، معالجة وتخزين البيانات، تفاعلات الواجهة الخارجية، تنفيذ منطق الأعمال."]],
   [["What do CRUD operations stand for?","ماذا تعني عمليات CRUD؟"],["Create, Read, Update, Delete.","الإنشاء، القراءة، التحديث، الحذف."]],
   [["What do non-functional requirements describe?","ماذا تصف المتطلبات غير الوظيفية؟"],["How well the system performs its functions — system properties and quality attributes.","مدى جودة أداء النظام لوظائفه — خصائص النظام وسمات الجودة."]],
   [["Give the 'good' (quantified) NFR example for Performance.","اذكر مثال NFR 'الجيد' (الكمّي) للأداء."],["The web application shall render the dashboard within 1.5 seconds under a load of 500 concurrent active users.","يجب أن يعرض تطبيق الويب لوحة التحكم خلال 1.5 ثانية تحت حمل 500 مستخدم نشط متزامن."]],
   [["Why is 'The system must load pages quickly' a BAD NFR?","لماذا يُعد 'يجب أن يُحمّل النظام الصفحات بسرعة' متطلبًا غير وظيفي ضعيفًا؟"],["It is vague and not quantified or testable.","لأنه غامض وغير كمّي أو قابل للاختبار."]],
   [["Which NFR category covers encryption and authentication?","أي فئة من المتطلبات غير الوظيفية تغطي التشفير والمصادقة؟"],["Security.","الأمان."]]

  quiz:[

   {q:["A 'requirement' is defined as a statement that is:","يُعرَّف 'المتطلب' بأنه عبارة:"], o:[["Optional and non-binding","اختيارية وغير ملزمة"],["Verified and contractually binding","يُتحقق منها وملزمة تعاقديًا"],["Written only in code","مكتوبة بالشيفرة فقط"],["Always vague by design","غامضة دائمًا بالتصميم"]], a:1},

   {q:["Which is the correct structure for a functional requirement?","ما البنية الصحيحة للمتطلب الوظيفي؟"], o:[["[Object] + [Subject] + [Price]","[المفعول به] + [الفاعل] + [السعر]"],["[Subject] + [Modal Verb] + [System Action] + [Object] + [Condition/Context]","[الفاعل] + [الفعل الواصفي] + [فعل النظام] + [المفعول به] + [الشرط/السياق]"],["Just a single verb","فعل واحد فقط"],["A diagram only, no text","مخطط فقط، دون نص"]], a:1},
   {q:["Which is NOT one of the four functional categories listed?","أي مما يلي ليس من الفئات الوظيفية الأربع المذكورة؟"], o:[["User Authentication & Authorization","المصادقة والتفويض"],["Data Processing & Storage","معالجة وتخزين البيانات"],["Office furniture procurement","شراء أثاث المكتب"],["Business Logic Execution","تنفيذ منطق الأعمال"]], a:2},
   {q:["CRUD operations fall under which functional category?","تندرج عمليات CRUD تحت أي فئة وظيفية؟"], o:[["External Interface Interactions","تفاعلات الواجهة الخارجية"],["Data Processing & Storage","معالجة وتخزين البيانات"],["Business Logic Execution","تنفيذ منطق الأعمال"],["User Authentication & Authorization","المصادقة والتفويض"]], a:1},

   {q:["Which is an example of a GOOD (quantified) NFR?","أي مما يلي مثال على متطلب غير وظيفي جيد (كمّي)؟"], o:[["The system should almost never go down","يجب ألا يتوقف النظام تقريبًا أبدًا"],["The database must be secure from hackers","يجب أن تكون قاعدة البيانات آمنة من القراصنة"],["The core API shall maintain 99.95% uptime per month, excluding scheduled maintenance","يجب أن تحافظ واجهة برمجة التطبيقات الأساسية على 99.95% نسبة تشغيل شهريًا، باستثناء الصيانة المجدولة"],["The system must load pages quickly","يجب أن يُحمّل النظام الصفحات بسرعة"]], a:2},
   {q:["AES-256 encryption and TLS 1.3 are examples used under which NFR category?","يُستخدم تشفير AES-256 وTLS 1.3 كمثال تحت أي فئة من المتطلبات غير الوظيفية؟"], o:[["Performance","الأداء"],["Security","الأمان"],["Availability / Reliability","التوفر / الموثوقية"],["Business Logic","منطق الأعمال"]], a:1}

LECTURES.push({ id:'l6', n:6,
  title:["Software & Process Documentation","توثيق البرمجيات والعمليات"],
  obj:[
    ["Explain the difference between SRS and Software & Process Documentation, and list what the latter covers.","شرح الفرق بين SRS وتوثيق البرمجيات والعمليات، وسرد ما يغطيه الأخير."],
    ["Identify the five pillars of effective technical writing for software.","تحديد الركائز الخمس للكتابة التقنية الفعّالة للبرمجيات."],
    ["Describe the standard structure of a user manual.","وصف البنية القياسية لدليل المستخدم."],
    ["Describe the standard process description template and the two UML notations used for process mapping.","وصف قالب وصف العملية القياسي ونوعي ترميز UML المستخدمين لتخطيط العمليات."]
  ],
  sec:[
   {t:["What Is Software & Process Documentation?","ما هو توثيق البرمجيات والعمليات؟"], b:[
     {k:'p', x:["In the modern IT ecosystem, software is only as good as its documentation. Software & Process Documentation refers to the structured written materials, visual guides, and technical specifications that accompany software products to assist end-users, system administrators, and software engineers.","في منظومة تقنية المعلومات الحديثة، لا تكون البرمجيات أفضل من توثيقها. ويشير توثيق البرمجيات والعمليات (Software & Process Documentation) إلى المواد المكتوبة المنظّمة والأدلة البصرية والمواصفات التقنية المرافقة للمنتجات البرمجية لمساعدة المستخدمين النهائيين ومديري الأنظمة ومهندسي البرمجيات."]},
     {k:'p', x:["While Requirements Specifications (SRS) focus on what to build, Software & Process Documentation focuses on:","بينما تُركّز مواصفات المتطلبات (SRS) على ما الذي يجب بناؤه، يُركّز توثيق البرمجيات والعمليات على:"]},
     {k:'ul', x:[
       ["How to use the software (User Documentation / End-User Manuals).","كيفية استخدام البرنامج (توثيق المستخدم / أدلة المستخدم النهائي)."],
       ["How the internal processes flow (Process Descriptions & Architecture Diagrams).","كيفية تدفق العمليات الداخلية (أوصاف العمليات ومخططات البنية)."],
       ["How systems integrate (API Documentation).","كيفية تكامل الأنظمة (توثيق واجهات برمجة التطبيقات)."],
       ["How to diagnose and repair failures (Troubleshooting Guides & Post-Mortems).","كيفية تشخيص الأعطال وإصلاحها (أدلة استكشاف الأخطاء وتحليلات ما بعد الحادثة)."]]}
   ]},
   {t:["Five Pillars of Technical Writing for Software","الركائز الخمس للكتابة التقنية للبرمجيات"], b:[
     {k:'p', x:["Effective software documentation adheres to five fundamental pillars of technical communication.","يلتزم التوثيق البرمجي الفعّال بخمس ركائز أساسية للتواصل التقني."]},
     {k:'ul', x:[
       ["Conciseness.","الإيجاز."],
       ["Clarity.","الوضوح."],
       ["Consistency.","الاتساق."],
       ["Accuracy.","الدقة."],
       ["Accessibility.","سهولة الوصول."]]}
   ]},
   {t:["User Documentation & User Manuals","توثيق المستخدم وأدلة المستخدم"], b:[
     {k:'def', x:["A User Manual (or User Guide) provides step-by-step instructions enabling non-technical or technical end-users to operate a software application effectively.","دليل المستخدم (User Manual أو User Guide) يُقدّم تعليمات خطوة بخطوة تُمكّن المستخدمين النهائيين، التقنيين وغير التقنيين، من تشغيل تطبيق برمجي بفعالية."]}
   ]},
   {t:["Structural Standard for a User Manual","البنية القياسية لدليل المستخدم"], b:[
     {k:'ul', x:[
       ["1. Title Page & Document Metadata (Version, Date, Author).","1. صفحة العنوان وبيانات الوثيقة الوصفية (الإصدار، التاريخ، المؤلف)."],
       ["2. System Requirements / Prerequisites.","2. متطلبات النظام / المتطلبات المسبقة."],
       ["3. Getting Started / Installation Guide.","3. البدء / دليل التثبيت."],
       ["4. Interface Overview & Navigation.","4. نظرة عامة على الواجهة والتنقل."],
       ["5. Core Tasks / Step-by-Step Procedures.","5. المهام الأساسية / الإجراءات خطوة بخطوة."],
       ["6. Troubleshooting & Frequently Asked Questions (FAQ).","6. استكشاف الأخطاء والأسئلة الشائعة (FAQ)."],
       ["7. Glossary of Terms & Index.","7. قائمة المصطلحات والفهرس."]]}
   ]},
   {t:["Process Mapping Notation: UML & Flowcharts","ترميز تخطيط العمليات: UML والمخططات الانسيابية"], b:[
     {k:'p', x:["Technical writers use standard visual notations to complement written text.","يستخدم الكتّاب التقنيون ترميزات بصرية قياسية لتكملة النص المكتوب."]},
     {k:'ul', x:[
       ["UML Activity Diagrams / Flowcharts — for decision trees and control flow.","مخططات النشاط UML / المخططات الانسيابية — لأشجار القرار وتدفق التحكم."],
       ["UML Sequence Diagrams — for interaction between different software subsystems or APIs.","مخططات التسلسل UML — للتفاعل بين الأنظمة الفرعية البرمجية المختلفة أو واجهات برمجة التطبيقات."]]}
   ]},
   {t:["Standard Process Description Template","قالب وصف العملية القياسي"], b:[
     {k:'p', x:["When documenting a system process, include the following structural elements.","عند توثيق عملية نظام، أدرج العناصر البنيوية التالية."]},
     {k:'ul', x:[
       ["Process Title — clear name (e.g., User Password Reset Workflow).","عنوان العملية — اسم واضح (مثل سير عمل إعادة تعيين كلمة مرور المستخدم)."],
       ["Objective — what this process achieves.","الهدف — ما الذي تحققه هذه العملية."],
       ["Triggers — what initiates the process (e.g., user clicks 'Forgot Password').","المُحفّزات — ما الذي يُطلق العملية (مثل نقر المستخدم على 'نسيت كلمة المرور')."],
       ["Inputs — required data or conditions before execution.","المُدخلات — البيانات أو الشروط المطلوبة قبل التنفيذ."],
       ["Execution Steps — sequential list of actions taken by actors/systems.","خطوات التنفيذ — قائمة متسلسلة بالإجراءات التي يتخذها الفاعلون/الأنظمة."],
       ["Outputs — resulting state, data saved, or notifications dispatched.","المُخرجات — الحالة الناتجة، أو البيانات المحفوظة، أو الإشعارات المُرسلة."],
       ["Exceptions / Alternative Flows — how errors during the process are handled.","الاستثناءات / المسارات البديلة — كيفية التعامل مع الأخطاء أثناء العملية."]]}
   ]}
  ],
  take:[
   ["Software is only as good as its documentation; SRS defines what to build, while S&PD explains how to use, how it flows internally, how it integrates, and how to fix it.","لا تكون البرمجيات أفضل من توثيقها؛ تُحدّد SRS ما يجب بناؤه، بينما يشرح توثيق البرمجيات والعمليات كيفية الاستخدام، والتدفق الداخلي، والتكامل، والإصلاح."],
   ["Five pillars of software documentation: conciseness, clarity, consistency, accuracy, accessibility.","خمس ركائز لتوثيق البرمجيات: الإيجاز، الوضوح، الاتساق، الدقة، سهولة الوصول."],
   ["A user manual follows a 7-part structure: title/metadata, prerequisites, getting started, interface overview, core tasks, troubleshooting/FAQ, glossary/index.","يتبع دليل المستخدم بنية من 7 أجزاء: العنوان/البيانات الوصفية، المتطلبات المسبقة، البدء، نظرة الواجهة، المهام الأساسية، استكشاف الأخطاء/الأسئلة الشائعة، المصطلحات/الفهرس."],
   ["UML Activity Diagrams/Flowcharts map decision trees and control flow; UML Sequence Diagrams map interaction between subsystems/APIs.","تُخطط مخططات النشاط UML/المخططات الانسيابية أشجار القرار وتدفق التحكم؛ بينما تُخطط مخططات التسلسل UML التفاعل بين الأنظمة الفرعية/واجهات برمجة التطبيقات."],
   ["A process description includes: title, objective, triggers, inputs, execution steps, outputs, and exceptions/alternative flows.","يتضمن وصف العملية: العنوان، الهدف، المُحفّزات، المُدخلات، خطوات التنفيذ، المُخرجات، والاستثناءات/المسارات البديلة."]
  ],
  fc:[
   [["What does Software & Process Documentation refer to?","إلى ماذا يشير توثيق البرمجيات والعمليات؟"],["Structured written materials, visual guides, and technical specs accompanying software to assist end-users, admins, and engineers.","المواد المكتوبة المنظّمة والأدلة البصرية والمواصفات التقنية المرافقة للبرمجيات لمساعدة المستخدمين النهائيين ومديري الأنظمة والمهندسين."]],

LECTURES.push({ id:'l7', n:7,
  title:["Technical Incident Report","تقرير الحادثة التقنية"],
  obj:[
    ["Define a technical incident and a technical incident report, and list the eight questions it should answer.","تعريف الحادثة التقنية وتقرير الحادثة التقنية، وسرد الأسئلة الثمانية التي يجب أن يُجيب عليها."],
    ["List the five purposes and ten main parts of a technical incident report.","سرد الأغراض الخمسة والأجزاء الرئيسية العشرة لتقرير الحادثة التقنية."],
    ["Distinguish a technical incident report from a technical report.","التمييز بين تقرير الحادثة التقنية والتقرير التقني."],

  sec:[
   {t:["What Is a Technical Incident Report?","ما هو تقرير الحادثة التقنية؟"], b:[
     {k:'def', x:["A Technical Incident Report is a formal document used to record and explain a technical problem or unexpected event.","تقرير الحادثة التقنية (Technical Incident Report) هو وثيقة رسمية تُستخدم لتسجيل وشرح مشكلة تقنية أو حدث غير متوقع."]},
     {k:'ul', h:["It provides information about:","يُقدّم معلومات حول:"], x:[
       ["What happened?","ماذا حدث؟"],["When did it happen?","متى حدث؟"],["Where did it happen?","أين حدث؟"],["What was affected?","ماذا تأثر؟"],
       ["What caused the problem?","ما سبب المشكلة؟"],["What actions were taken?","ما الإجراءات التي اتُّخذت؟"],["How was the problem solved?","كيف حُلّت المشكلة؟"],["How can we prevent it from happening again?","كيف يمكننا منع تكرارها؟"]]}
   ]},
   {t:["What Is a Technical Incident?","ما هي الحادثة التقنية؟"], b:[
     {k:'def', x:["A technical incident is an unexpected event that affects a computer system, network, software, hardware, database, or IT service.","الحادثة التقنية هي حدث غير متوقع يؤثر على نظام حاسوبي أو شبكة أو برنامج أو عتاد أو قاعدة بيانات أو خدمة تقنية معلومات."]},
     {k:'ul', h:["Examples of Technical Incidents","أمثلة على الحوادث التقنية"], x:[
       ["Network failure.","عطل الشبكة."],["Server failure.","عطل الخادم."],["Computer virus infection.","الإصابة بفيروس حاسوبي."],["Database failure.","عطل قاعدة البيانات."],["Software error.","خطأ برمجي."]]}
   ]},
   {t:["Purpose of a Technical Incident Report","غرض تقرير الحادثة التقنية"], b:[
     {k:'ul', x:[
       ["1. Documentation — to create an official record of the incident.","1. التوثيق — لإنشاء سجل رسمي للحادثة."],
       ["2. Investigation — to identify what caused the problem.","2. التحقيق — لتحديد سبب المشكلة."],
       ["3. Communication — to communicate the incident to managers, IT staff, or other responsible people.","3. التواصل — لإبلاغ المديرين أو طاقم تقنية المعلومات أو الجهات المسؤولة الأخرى بالحادثة."],
       ["4. Problem Resolution — to record how the problem was solved.","4. حل المشكلة — لتسجيل كيفية حل المشكلة."],
       ["5. Prevention — to help prevent the same problem from happening again.","5. الوقاية — للمساعدة في منع تكرار المشكلة نفسها."]]}
   ]},
   {t:["Main Parts of a Technical Incident Report","الأجزاء الرئيسية لتقرير الحادثة التقنية"], b:[
     {k:'p', x:["A Technical Incident Report normally contains:","يحتوي تقرير الحادثة التقنية عادةً على:"]},
     {k:'ul', x:[
       ["1. Title","1. العنوان"],["2. Incident Information","2. معلومات الحادثة"],["3. Description of the Incident","3. وصف الحادثة"],["4. Impact","4. الأثر"],
       ["5. Investigation","5. التحقيق"],["6. Root Cause","6. السبب الجذري"],["7. Actions Taken","7. الإجراءات المتخذة"],["8. Resolution","8. الحل"],
       ["9. Recommendations","9. التوصيات"],["10. Conclusion","10. الخاتمة"]]}
   ]},
   {t:["Complete Example: Network Failure Incident Report","مثال كامل: تقرير حادثة عطل الشبكة"], b:[
     {k:'ex', x:["Technical Incident Report – Network Failure\n\nIncident Information\nIncident Date: 20 September 2026\nIncident Time: 10:30 AM\nLocation: Computer Laboratory\nSystem: University Network\nReported By: IT Support Team\nSeverity: High\n\nDescription of the Incident\nAt 10:30 AM, the Internet connection stopped working in the computer laboratory. Students and staff were unable to access online services.\n\nImpact\nThe incident affected 25 computers in the laboratory. Students were unable to access the university's online learning system.\n\nInvestigation\nThe IT support team checked the network cables, switch, router, and server connection. The router configuration was also examined.\n\nRoot Cause\nThe investigation showed that a configuration error caused the router to stop providing Internet access.\n\nActions Taken\nThe IT team corrected the configuration and restarted the router. The network connection was then tested on several computers.\n\nResolution\nInternet access was successfully restored at 12:15 PM.\n\nRecommendations\nIt is recommended that router configurations be backed up regularly and network devices be monitored to prevent similar incidents.\n\nConclusion\nThe network incident was successfully investigated and resolved. Normal Internet services were restored to the computer laboratory.","تقرير حادثة تقنية – عطل الشبكة\n\nمعلومات الحادثة\nتاريخ الحادثة: 20 سبتمبر 2026\nوقت الحادثة: 10:30 صباحًا\nالموقع: مختبر الحاسوب\nالنظام: شبكة الجامعة\nمُقدِّم البلاغ: فريق الدعم التقني\nالخطورة: عالية\n\nوصف الحادثة\nفي الساعة 10:30 صباحًا، توقف اتصال الإنترنت عن العمل في مختبر الحاسوب. لم يتمكن الطلاب والموظفون من الوصول إلى الخدمات الإلكترونية.\n\nالأثر\nأثرت الحادثة على 25 حاسوبًا في المختبر. لم يتمكن الطلاب من الوصول إلى نظام التعلم الإلكتروني للجامعة.\n\nالتحقيق\nفحص فريق الدعم التقني كابلات الشبكة والمحوّل والموجّه واتصال الخادم. كما فُحص إعداد الموجّه.\n\nالسبب الجذري\nأظهر التحقيق أن خطأً في الإعداد تسبب في توقف الموجّه عن توفير الوصول إلى الإنترنت.\n\nالإجراءات المتخذة\nصحّح فريق تقنية المعلومات الإعداد وأعاد تشغيل الموجّه. ثم جُرِّب اتصال الشبكة على عدة أجهزة.\n\nالحل\nاستُعيد الوصول إلى الإنترنت بنجاح في الساعة 12:15 ظهرًا.\n\nالتوصيات\nيُوصى بعمل نسخ احتياطية دورية لإعدادات الموجّه ومراقبة أجهزة الشبكة لمنع تكرار حوادث مماثلة.\n\nالخاتمة\nجرى التحقيق في حادثة الشبكة وحلّها بنجاح. واستُعيدت خدمات الإنترنت الطبيعية لمختبر الحاسوب."]}
   ]},
   {t:["Incident Report vs. Technical Report","تقرير الحادثة مقابل التقرير التقني"], b:[

      r:[

       [["Example: Server Performance Analysis.","مثال: تحليل أداء الخادم."],["Example: Server Failure.","مثال: عطل الخادم."]]

   {t:["Qualities of a Good Incident Report","صفات التقرير الجيد عن الحادثة"], b:[
     {k:'ul', x:[
       ["1. Clear — the information should be easy to understand.","1. واضح — يجب أن تكون المعلومات سهلة الفهم."],
       ["2. Accurate — the information should be correct.","2. دقيق — يجب أن تكون المعلومات صحيحة."],
       ["3. Objective — the report should present facts rather than personal opinions.","3. موضوعي — يجب أن يعرض التقرير الحقائق لا الآراء الشخصية."],
       ["4. Concise — the report should not contain unnecessary information.","4. موجز — يجب ألا يحتوي التقرير على معلومات غير ضرورية."],
       ["5. Organized — information should be presented in a logical order.","5. منظم — يجب تقديم المعلومات بترتيب منطقي."],
       ["6. Specific — the report should include exact dates, times, systems, and actions whenever possible.","6. محدد — يجب أن يتضمن التقرير تواريخ وأوقاتًا وأنظمة وإجراءات دقيقة كلما أمكن."]]}
   ]}

  take:[
   ["A technical incident report formally records and explains a technical problem — answering what, when, where, what was affected, cause, actions, resolution, and prevention.","يُسجّل تقرير الحادثة التقنية ويشرح مشكلة تقنية رسميًا — مُجيبًا عن ماذا ومتى وأين وماذا تأثر والسبب والإجراءات والحل والوقاية."],
   ["Five purposes: documentation, investigation, communication, problem resolution, and prevention.","خمسة أغراض: التوثيق، التحقيق، التواصل، حل المشكلة، والوقاية."],
   ["Ten main parts, from Title through Conclusion, including Root Cause and Recommendations.","عشرة أجزاء رئيسية، من العنوان إلى الخاتمة، بما في ذلك السبب الجذري والتوصيات."],
   ["Technical reports study a topic (can exist without an incident); incident reports explain what happened after a specific event.","تدرس التقارير التقنية موضوعًا (يمكن أن توجد دون حادثة)؛ بينما تشرح تقارير الحوادث ما حدث بعد واقعة محددة."],
   ["A good incident report is clear, accurate, objective, concise, organized, and specific.","التقرير الجيد عن الحادثة واضح ودقيق وموضوعي وموجز ومنظم ومحدد."]
  ],
  fc:[
   [["Define a Technical Incident Report.","عرّف تقرير الحادثة التقنية."],["A formal document used to record and explain a technical problem or unexpected event.","وثيقة رسمية تُستخدم لتسجيل وشرح مشكلة تقنية أو حدث غير متوقع."]],
   [["Name four of the eight questions a technical incident report answers.","اذكر أربعة من الأسئلة الثمانية التي يُجيب عليها تقرير الحادثة التقنية."],["Any four of: what happened, when, where, what was affected, what caused it, what actions were taken, how it was solved, how to prevent recurrence.","أي أربعة من: ماذا حدث، متى، أين، ماذا تأثر، ما السبب، ما الإجراءات المتخذة، كيف حُلّت، كيف تُمنع إعادة الحدوث."]],
   [["Define a technical incident, and give two examples.","عرّف الحادثة التقنية، واذكر مثالين."],["An unexpected event affecting a computer system, network, software, hardware, database, or IT service — e.g. network failure, software error.","حدث غير متوقع يؤثر على نظام حاسوبي أو شبكة أو برنامج أو عتاد أو قاعدة بيانات أو خدمة تقنية معلومات — مثل عطل الشبكة أو خطأ برمجي."]],
   [["List the five purposes of a technical incident report.","اذكر الأغراض الخمسة لتقرير الحادثة التقنية."],["Documentation, investigation, communication, problem resolution, and prevention.","التوثيق، التحقيق، التواصل، حل المشكلة، والوقاية."]],
   [["Name five of the ten main parts of a technical incident report.","اذكر خمسة من الأجزاء الرئيسية العشرة لتقرير الحادثة التقنية."],["Any five of: Title, Incident Information, Description, Impact, Investigation, Root Cause, Actions Taken, Resolution, Recommendations, Conclusion.","أي خمسة من: العنوان، معلومات الحادثة، الوصف، الأثر، التحقيق، السبب الجذري، الإجراءات المتخذة، الحل، التوصيات، الخاتمة."]],
   [["In the worked example, what was the root cause of the network failure?","في المثال المحلول، ما السبب الجذري لعطل الشبكة؟"],["A configuration error caused the router to stop providing Internet access.","خطأ في الإعداد تسبب في توقف الموجّه عن توفير الوصول إلى الإنترنت."]],
   [["In the worked example, how many computers were affected, and when was the issue resolved?","في المثال المحلول، كم حاسوبًا تأثر، ومتى حُلّت المشكلة؟"],["25 computers were affected; Internet access was restored at 12:15 PM.","تأثر 25 حاسوبًا؛ واستُعيد الوصول إلى الإنترنت في الساعة 12:15 ظهرًا."]],
   [["What recommendation was given in the worked example's incident report?","ما التوصية التي وردت في تقرير الحادثة في المثال المحلول؟"],["Back up router configurations regularly and monitor network devices to prevent similar incidents.","عمل نسخ احتياطية دورية لإعدادات الموجّه ومراقبة أجهزة الشبكة لمنع تكرار حوادث مماثلة."]],
   [["How does a technical report differ from an incident report in terms of focus?","كيف يختلف التقرير التقني عن تقرير الحادثة من حيث التركيز؟"],["A technical report focuses on analysis and results; an incident report focuses on the cause and solution.","يُركّز التقرير التقني على التحليل والنتائج؛ بينما يُركّز تقرير الحادثة على السبب والحل."]],

function save(){

function sd(id){ id=id||state.subject; return state.data[id]||(state.data[id]={seen:{},best:{},exam:0}); }
function mastery(s){
  if(!s.ready) return 0;
  const d=sd(s.id); let sum=0;
  s.lectures.forEach(l=>{ sum += (d.best[l.id]||0)/100; });
  sum += (d.exam||0)/100;
  return Math.round(sum/(s.lectures.length+1)*100);
}

/* ============================================================
   HELPERS  (invisible citation handling + XSS protection)
   ============================================================ */
const clean = s => String(s)
  .replace(/<\/?(antml:)?cite[^>]*>/gi,'')
  .replace(/\[cite[^\]]*\]/gi,'')
  .replace(/\[(source|ref)[^\]]*\]/gi,'')
  .replace(/[ \t]{2,}/g,' ').trim();
const esc = s => clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/(\$?\d[\d,.]*\d|\$?\d)/g,'<span class="mono">$1</span>');
const li = () => state.lang==='ar'?1:0;
const tx = a => fmt(a[li()]);
const u = k => UI[k][li()];
const $ = id => document.getElementById(id);
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function mixQ(q){ const idx=shuf(q.o.map((_,i)=>i)); return {q:q.q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)}; }
function applyTheme(){
  const t = THEMES[(state.subject&&subj().color)||'teal'];
  document.documentElement.style.setProperty('--b5',t[0]);
  document.documentElement.style.setProperty('--b6',t[1]);
}
