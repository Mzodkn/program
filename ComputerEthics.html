     {k:'tip', x:["Socially responsible activities create good will, and good will makes it easier for corporations to conduct business.","تخلق الأنشطة ذات المسؤولية الاجتماعية حسن النية، وحسن النية يُسهّل على الشركات ممارسة أعمالها."]}

   {t:["Sarbanes-Oxley Act of 2002","قانون ساربينز-أوكسلي لعام 2002"], b:[

     {k:'p', x:["A code of ethics cannot gain company-wide acceptance unless it is developed with employee participation and fully endorsed by the organization's leadership. It must continually be applied to the company's decision making and emphasized as part of its culture, and breaches must be identified and dealt with appropriately.","لا يمكن لمدونة الأخلاقيات أن تحظى بقبول على مستوى الشركة بأكملها إلا إذا طُوّرت بمشاركة الموظفين وحظيت بتأييد كامل من قيادة المؤسسة. ويجب تطبيقها باستمرار في اتخاذ قرارات الشركة والتأكيد عليها كجزء من ثقافتها، كما يجب تحديد الخروقات والتعامل معها بشكل مناسب."]}

     {k:'tip', x:["It is critical that training increase the percentage of employees who report incidents of misconduct. Employees must learn effective ways of reporting incidents and be reassured their feedback will be acted on without retaliation.","من الضروري أن يزيد التدريب من نسبة الموظفين الذين يُبلّغون عن حوادث سوء السلوك. ويجب أن يتعلّم الموظفون طرقًا فعّالة للإبلاغ عن الحوادث، وأن يُطمأَنوا إلى أن ملاحظاتهم ستُعالَج دون انتقام."]}

   [["Why was the Sarbanes-Oxley Act of 2002 enacted?","لماذا سُنّ قانون ساربينز-أوكسلي لعام 2002؟"],["In response to public outrage over several major accounting scandals.","استجابةً للسخط العام الناتج عن عدة فضائح محاسبية كبرى."]],
   [["What does Section 404 of Sarbanes-Oxley require?","ماذا تتطلب المادة 404 من قانون ساربينز-أوكسلي؟"],["That the CEO and CFO sign any SEC filing to attest to its accuracy.","أن يوقّع الرئيس التنفيذي والمدير المالي على أي ملف يُقدَّم لهيئة SEC إقرارًا بدقته."]],

   [["What two conditions must be met for a code of ethics to gain company-wide acceptance?","ما الشرطان اللازمان لتحظى مدونة الأخلاقيات بقبول على مستوى الشركة؟"],["It must be developed with employee participation and fully endorsed by the organization's leadership.","يجب أن تُطوَّر بمشاركة الموظفين وأن تحظى بتأييد كامل من قيادة المؤسسة."]],

     {k:'ex', x:["Example of a GOOD problem statement:\n\"Our product supply organization is continually running out of stock of finished products, creating an out-of-stock situation on over 15 percent of our customer orders, resulting in over $300,000 in lost sales per month.\"\n\nExamples of POOR problem statements:\n\"We need to implement a new inventory control system.\" (this is a possible solution, not a problem statement)\n\"We have a problem with finished product inventory.\" (not specific enough)","مثال على بيان مشكلة جيد:\n\"مؤسسة توريد منتجاتنا تنفد مخزونها باستمرار من المنتجات الجاهزة، مما يخلق حالة نفاد مخزون في أكثر من 15 بالمئة من طلبات عملائنا، ويؤدي إلى خسارة مبيعات تتجاوز 300,000 دولار شهريًا.\"\n\nأمثلة على بيانات مشكلة ضعيفة:\n\"نحتاج إلى تطبيق نظام جديد لإدارة المخزون.\" (هذا حل محتمل، وليس بيان مشكلة)\n\"لدينا مشكلة في مخزون المنتجات الجاهزة.\" (غير محدد بما فيه الكفاية)"]}

      r:[

        ["Focuses on daily life in a community; people are guided by virtues to reach the 'right' decision — more effective than following a set of principles/rules.","تُركّز على الحياة اليومية داخل المجتمع؛ ويسترشد الناس بالفضائل للوصول إلى القرار 'الصائب' — وهي أكثر فعالية من اتباع مجموعة مبادئ/قواعد."],
        ["Does not provide a guide for action; virtue cannot be worked out objectively, since it depends on circumstances.","لا تقدم دليلًا للفعل؛ ولا يمكن تحديد الفضيلة بشكل موضوعي، لأنها تعتمد على الظروف."]],
       [["Utilitarian Approach","المنهج النفعي"],

        ["Measuring and comparing values is often difficult; predicting resulting benefits and harm is difficult.","قياس القيم ومقارنتها غالبًا ما يكون صعبًا؛ والتنبؤ بالمنافع والأضرار الناتجة أمر صعب."]],
       [["Fairness Approach","منهج الإنصاف"],

        ["Decisions can be influenced by personal bias; others may consider the decision unfair.","قد تتأثر القرارات بالتحيز الشخصي؛ وقد يرى آخرون أن القرار غير عادل."]],
       [["Common Good Approach","منهج الصالح العام"],

        ["Reaching consensus is difficult; some people are required to bear greater costs than others.","الوصول إلى توافق أمر صعب؛ ويُطلب من بعض الناس تحمّل تكاليف أكبر من غيرهم."]]
      ]}
   ]},
   {t:["Implementing the Decision and Evaluating the Results","تنفيذ القرار وتقييم النتائج"], b:[

   {t:["Ethics in Information Technology","الأخلاقيات في تقنية المعلومات"], b:[

       ["Creating an environment where ethical dilemmas can be discussed openly, objectively, and constructively.","تهيئة بيئة يمكن فيها مناقشة المعضلات الأخلاقية بانفتاح وموضوعية وبنّاءً."]]}

   {t:["Goals of This Course","أهداف هذا المقرر"], b:[
     {k:'ul', x:[

  take:[
   ["The decision-making process: develop problem statement → identify alternatives → evaluate/choose → implement → evaluate results.","عملية اتخاذ القرار: صياغة بيان المشكلة ← تحديد البدائل ← التقييم/الاختيار ← التنفيذ ← تقييم النتائج."],
   ["A good problem statement is specific and quantified (e.g., '15% of orders, $300,000/month'); a solution disguised as a problem statement is a common mistake.","بيان المشكلة الجيد محدد وكمّي (مثل '15% من الطلبات، 300,000 دولار شهريًا')؛ والخلط بين الحل وبيان المشكلة خطأ شائع."],
   ["A chosen alternative must be ethically/legally defensible, policy-consistent, mindful of impact on others, and actually solve the problem.","يجب أن يكون البديل المختار مبررًا أخلاقيًا/قانونيًا، ومتسقًا مع السياسات، ومراعيًا لتأثيره على الآخرين، وحلًا فعليًا للمشكلة."],
   ["Four approaches — virtue ethics, utilitarian, fairness, common good — each has a distinct focus and a distinct weakness.","أربعة مناهج — أخلاقيات الفضيلة، النفعي، الإنصاف، الصالح العام — لكل منها تركيز مختلف وضعف مختلف."],
   ["Public IT ethics concerns include monitoring, piracy, spam, hacking/identity theft, plagiarism, and spyware/cookies.","تشمل المخاوف الأخلاقية العامة بشأن تقنية المعلومات المراقبة والقرصنة والسبام والقرصنة الإلكترونية/سرقة الهوية والانتحال العلمي وبرامج التجسس/ملفات تعريف الارتباط."]

  fc:[
   [["List the steps in the decision-making process.","اذكر خطوات عملية اتخاذ القرار."],["Develop problem statement, identify alternatives, evaluate and choose alternative, implement decision, evaluate results, success.","صياغة بيان المشكلة، تحديد البدائل، تقييم واختيار بديل، تنفيذ القرار، تقييم النتائج، النجاح."]],
   [["What is a problem statement?","ما هو بيان المشكلة؟"],["A clear, concise description of the issue.","وصف واضح ومختصر للقضية."]],

   [["Why is 'We need to implement a new inventory control system' a POOR problem statement?","لماذا يُعد 'نحتاج إلى تطبيق نظام جديد لإدارة المخزون' بيان مشكلة ضعيفًا؟"],["It's a possible solution, not a problem statement.","لأنه حل محتمل، وليس بيان مشكلة."]],
   [["In the good problem statement example, what percentage of orders are affected, and what is the monthly cost?","في مثال بيان المشكلة الجيد، ما نسبة الطلبات المتأثرة، وما التكلفة الشهرية؟"],["Over 15 percent of customer orders, resulting in over $300,000 in lost sales per month.","أكثر من 15 بالمئة من طلبات العملاء، بخسارة تتجاوز 300,000 دولار شهريًا."]],
   [["Name two conditions a selected alternative must satisfy.","اذكر شرطين يجب أن يستوفيهما البديل المختار."],["Any two of: ethically/legally defensible, consistent with policies/code of ethics, accounts for impact on others, solves the problem well.","أي شرطين من: مبرر أخلاقيًا/قانونيًا، متسق مع السياسات/مدونة الأخلاقيات، يراعي التأثير على الآخرين، يحل المشكلة جيدًا."]],
   [["What does the virtue ethics approach focus on, and what is its main problem?","على ماذا يُركّز منهج أخلاقيات الفضيلة، وما مشكلته الرئيسية؟"],["Focuses on daily life in a community, guided by virtues; its problem is that virtue can't be worked out objectively.","يُركّز على الحياة اليومية في المجتمع، مسترشدًا بالفضائل؛ ومشكلته أن الفضيلة لا يمكن تحديدها بشكل موضوعي."]],
   [["What does the utilitarian approach choose, and what is its main problem?","ماذا يختار المنهج النفعي، وما مشكلته الرئيسية؟"],["The action with the best overall consequences; its problem is that measuring and comparing values is often difficult.","الفعل ذا أفضل العواقب الإجمالية؛ ومشكلته أن قياس القيم ومقارنتها غالبًا ما يكون صعبًا."]],
   [["What is the guiding principle of the fairness approach, and its main problem?","ما المبدأ الموجّه لمنهج الإنصاف، وما مشكلته الرئيسية؟"],["Treat all people the same; its problem is that decisions can be influenced by personal bias.","معاملة الجميع بالتساوي؛ ومشكلته أن القرارات قد تتأثر بالتحيز الشخصي."]],

   [["What are the three goals of this course, as stated in the lecture?","ما الأهداف الثلاثة لهذا المقرر، كما وردت في المحاضرة؟"],["To educate about ethics' impact on IT, to motivate recognizing these issues in business decisions, and to provide tools for ethical decision-making.","تثقيف حول تأثير الأخلاقيات على تقنية المعلومات، تحفيز إدراك هذه القضايا في قرارات الأعمال، وتوفير أدوات لاتخاذ القرار الأخلاقي."]]

  obj:[
    ["Define accountability and explain why laws alone are insufficient to ensure it.","تعريف المساءلة وتوضيح سبب عدم كفاية القوانين وحدها لضمانها."],
    ["Distinguish between role responsibility, causal responsibility, and blameworthy responsibility.","التمييز بين مسؤولية الدور والمسؤولية السببية والمسؤولية المستوجبة للّوم."],
    ["Explain the difference between liability and blame.","توضيح الفرق بين المسؤولية القانونية واللوم."],
    ["Describe the factors behind diffusion of responsibility, and summarize the THERAC-25 case.","وصف العوامل الكامنة وراء تشتت المسؤولية، وتلخيص قضية ثيراك-25."]
  ],
  sec:[
   {t:["Introduction: What Is Accountability?","مقدمة: ما هي المساءلة؟"], b:[
     {k:'def', x:["Accountability is the means of ensuring that, despite the complexity of the work and the context in which it exists, individuals, groups, and ultimately the organization as a whole will understand their part in accomplishing goals.","المساءلة (Accountability) هي الوسيلة التي تضمن أنه، رغم تعقيد العمل والسياق الذي يجري فيه، سيفهم الأفراد والجماعات، وفي النهاية المؤسسة ككل، دورهم في تحقيق الأهداف."]},
     {k:'tip', x:["Accountability is the flip side of delegation: when authority is delegated, accountability for how it is used follows along with it.","المساءلة هي الوجه الآخر للتفويض: فعندما تُفوَّض السلطة، تنتقل معها المساءلة عن كيفية استخدامها."]}
   ]},
   {t:["Ensuring Accountability","ضمان المساءلة"], b:[
     {k:'p', x:["Computer systems are powerful and can cause harm financially, physically, or psychologically. Being mindful of this is one of the professional duties identified in most codes of ethics and/or conduct. One approach is to find appropriate laws and use them.","الأنظمة الحاسوبية قوية ويمكن أن تُسبب ضررًا ماليًا أو جسديًا أو نفسيًا. والانتباه لذلك هو أحد الواجبات المهنية التي تُحددها معظم مدونات الأخلاقيات و/أو السلوك. ويتمثل أحد المناهج في إيجاد القوانين المناسبة واستخدامها."]},
     {k:'p', x:["However, different laws apply in different situations — for example, one law might apply to a defective product, while another applies to negligence. Another factor is the rate of change of technology: it typically takes a long time to pass a piece of legislation, by which time the technology might have evolved.","لكن قوانين مختلفة تُطبَّق في مواقف مختلفة — فمثلًا، قد يُطبَّق قانون معين على منتج معيب، بينما يُطبَّق آخر على الإهمال. وهناك عامل آخر هو معدل تغيّر التقنية: فعادة ما يستغرق سنّ تشريع ما وقتًا طويلًا، وقد تكون التقنية قد تطورت بحلول ذلك الوقت."]},
     {k:'tip', x:["In addition to relying on legislation, a mixed approach can be used in terms of accountability, responsibility, liability, and blame.","بالإضافة إلى الاعتماد على التشريعات، يمكن استخدام منهج مختلط يشمل المساءلة والمسؤولية والمسؤولية القانونية واللوم."]}
   ]},
   {t:["a. Accountability","أ. المساءلة"], b:[
     {k:'def', x:["Accountability, used in its broadest meaning, refers to the appropriate agent to respond, and depends on various factors. For example, in a company department, the head of department might be held accountable. Accountability rests with whoever holds the ultimate responsibility.","المساءلة (Accountability)، بمعناها الأوسع، تشير إلى الجهة المناسبة للاستجابة، وتعتمد على عوامل متعددة. فمثلًا، في قسم داخل شركة، قد يُساءَل رئيس القسم. وتقع المساءلة على عاتق مَن يحمل المسؤولية النهائية."]}
   ]},
   {t:["b. Responsibility: Three Types","ب. المسؤولية: ثلاثة أنواع"], b:[
     {k:'def', x:["Role Responsibility: analogous to duty — it is what people are expected to do within their role. For example, in the LambdaMOO scenario, players are expected to play by the rules even if unstated; most players assume this means not taking over another player's character.","مسؤولية الدور (Role Responsibility): تشبه الواجب — وهي ما يُتوقع من الأفراد فعله ضمن دورهم. فمثلًا، في سيناريو LambdaMOO، يُتوقع من اللاعبين الالتزام بالقواعد حتى لو لم تُذكر صراحة؛ ويفترض معظم اللاعبين أن ذلك يعني عدم الاستيلاء على شخصية لاعب آخر."]},
     {k:'def', x:["Causal Responsibility: responsibility as a result of causality — X did something and caused an event to happen. For example, Kim invests a large amount of money in the market and causes the company to lose money, even though she might have done everything required of her duty.","المسؤولية السببية (Causal Responsibility): مسؤولية ناتجة عن علاقة سببية — حيث يفعل X شيئًا يتسبب في وقوع حدث. فمثلًا، تستثمر كيم مبلغًا كبيرًا من المال في السوق فتتسبب في خسارة الشركة للمال، حتى لو كانت قد أدت كل ما يتطلبه واجبها."]},
     {k:'def', x:["Blameworthy Responsibility: Kim may or may not be (causally) responsible, but she is not necessarily blameworthy. Perhaps the software was faulty — in that case, the software designer might be blameworthy if they failed to fulfil a role responsibility.","المسؤولية المستوجبة للّوم (Blameworthy Responsibility): قد تكون كيم مسؤولة (سببيًا) أو لا، لكنها ليست بالضرورة مستوجبة للّوم. فربما كان البرنامج معيبًا — وفي هذه الحالة، قد يكون مصمم البرنامج مستوجبًا للّوم إذا أخفق في أداء مسؤولية دوره."]},
     {k:'tip', x:["These three types are independent: you can be causally responsible without being blameworthy, as Kim's example shows.","هذه الأنواع الثلاثة مستقلة عن بعضها: فقد تكون مسؤولًا سببيًا دون أن تكون مستوجبًا للّوم، كما يُظهر مثال كيم."]}
   ]},
   {t:["c. Liability","ج. المسؤولية القانونية"], b:[
     {k:'def', x:["Liability is a legal obligation to compensate for harm, which can exist independently of blame.","المسؤولية القانونية (Liability) هي التزام قانوني بتعويض الضرر، ويمكن أن توجد بشكل مستقل عن اللوم."]},
     {k:'ex', x:["A friend slips on the polished floor of your house and breaks a leg. You might be held liable, but you may not be blameworthy.","ينزلق صديق على أرضية منزلك المصقولة ويكسر ساقه. قد تُحمَّل المسؤولية القانونية، لكنك قد لا تكون مستوجبًا للّوم."]}
   ]},
   {t:["f. Diffusion of Responsibility","و. تشتت المسؤولية"], b:[
     {k:'p', x:["In creating a computer system, we should appreciate the following.","عند إنشاء نظام حاسوبي، يجب تقدير ما يلي."]},
     {k:'ul', x:[
       ["The scale and complexity of the system.","حجم النظام وتعقيده."],
       ["The number of people involved in its development, distribution, training, and use.","عدد الأشخاص المشاركين في تطويره وتوزيعه والتدريب عليه واستخدامه."],
       ["What the system will be involved in — many systems are involved in important decision making.","ما الذي سيشارك فيه النظام — إذ تشارك أنظمة كثيرة في اتخاذ قرارات مهمة."]]},
     {k:'tip', x:["Kant: humans are responsible for their actions because they have the capacity to control their actions.","كانط: الإنسان مسؤول عن أفعاله لأنه يملك القدرة على التحكم فيها."]}
   ]},
   {t:["Example: THERAC-25","مثال: ثيراك-25 (THERAC-25)"], b:[
     {k:'p', x:["THERAC-25 is a computer-controlled system that gives radiation treatments to patients. Several patients received massive doses, resulting in at least three fatalities.","ثيراك-25 هو نظام يتحكم فيه الحاسوب يُستخدم لإعطاء علاجات إشعاعية للمرضى. تلقى عدة مرضى جرعات هائلة، مما أدى إلى ثلاث وفيات على الأقل."]},
     {k:'p', x:["It was difficult to discover who was responsible, but Therac was found liable and paid compensation to the victims' families. Eventually, it was found that the operator's actions caused the accidents. However, it was also found that if an operator entered an incorrect mode, noticed it, and corrected the error (within the 8 seconds specified), the system still went wrong and the patient was killed. So while the operator caused the accident, they were not to blame.","كان من الصعب تحديد المسؤول، لكن ثيراك وُجدت مسؤولة قانونيًا ودفعت تعويضات لعائلات الضحايا. وتبيّن في النهاية أن تصرفات المشغّل تسببت في الحوادث. لكن تبيّن أيضًا أنه حتى لو أدخل المشغّل وضعًا خاطئًا، ولاحظ ذلك، وصحّح الخطأ (خلال الثواني الثماني المحددة)، كان النظام لا يزال يخطئ ويودي بحياة المريض. لذا، رغم أن المشغّل تسبب في الحادث، فإنه لم يكن مستوجبًا للّوم."]},
     {k:'cards', c:[
       {t:["Open questions this case raises","أسئلة مفتوحة تطرحها هذه القضية"], l:[
         ["The same error existed in a previous software version but caused no problems there, because that version had only one mode. Was the designer or the tester at fault?","كان نفس الخطأ موجودًا في نسخة سابقة من البرنامج لكنه لم يُسبب مشاكل هناك، لأن تلك النسخة كانت تحتوي على وضع واحد فقط. فهل كان الخطأ خطأ المصمم أم المختبِر؟"],
         ["The case illustrates the difficulty of testing real-time systems.","توضح القضية صعوبة اختبار الأنظمة اللحظية (Real-Time Systems)."],
         ["Should there have been a feature limiting the radiation dose to some maximum, regardless of everything else? If so, should this have been specified by the clients? Are they also partially to blame?","هل كان ينبغي وجود خاصية تحد من جرعة الإشعاع بحد أقصى معين، بصرف النظر عن أي شيء آخر؟ وإن كان الأمر كذلك، ألم يكن ينبغي أن يحدد العملاء ذلك؟ وهل يتحملون جزءًا من اللوم أيضًا؟"]
       ]}
     ]}
   ]}
  ],
  take:[
   ["Accountability ensures individuals, groups, and organizations understand their part in accomplishing goals; it's the flip side of delegation.","تضمن المساءلة أن يفهم الأفراد والجماعات والمؤسسات دورهم في تحقيق الأهداف؛ وهي الوجه الآخر للتفويض."],
   ["Laws alone aren't enough: different laws apply to different situations, and technology changes faster than legislation.","القوانين وحدها لا تكفي: فقوانين مختلفة تُطبَّق على مواقف مختلفة، والتقنية تتغير أسرع من التشريعات."],
   ["Role responsibility = expected duty; causal responsibility = you caused it; blameworthy responsibility = you're at fault — these are independent.","مسؤولية الدور = الواجب المتوقع؛ المسؤولية السببية = أنت تسببت فيه؛ المسؤولية المستوجبة للّوم = أنت المخطئ — وهذه الأنواع مستقلة عن بعضها."],
   ["Liability can exist without blame, as the slip-and-fall example shows.","يمكن أن توجد المسؤولية القانونية دون لوم، كما يوضح مثال الانزلاق والسقوط."],
   ["THERAC-25: the operator caused the accident but was not to blame — the real fault traced back to the software design/testing.","ثيراك-25: تسبب المشغّل في الحادث لكنه لم يكن مستوجبًا للّوم — إذ يعود الخطأ الحقيقي إلى تصميم البرنامج أو اختباره."]
  ],
  fc:[
   [["What is accountability?","ما هي المساءلة؟"],["The means of ensuring individuals, groups, and the organization understand their part in accomplishing goals.","الوسيلة التي تضمن فهم الأفراد والجماعات والمؤسسة لدورهم في تحقيق الأهداف."]],
   [["Accountability is the flip side of what?","المساءلة هي الوجه الآخر لماذا؟"],["Delegation.","التفويض."]],
   [["Why aren't laws alone sufficient to ensure accountability?","لماذا لا تكفي القوانين وحدها لضمان المساءلة؟"],["Different laws apply to different situations, and technology changes faster than legislation can be passed.","قوانين مختلفة تُطبَّق على مواقف مختلفة، والتقنية تتغير أسرع من إمكانية سنّ التشريعات."]],
   [["Define role responsibility, with its example.","عرّف مسؤولية الدور، مع مثالها."],["What people are expected to do within their role — e.g., LambdaMOO players expected to follow unstated rules.","ما يُتوقع من الأفراد فعله ضمن دورهم — مثل لاعبي LambdaMOO المتوقع منهم اتباع قواعد غير مذكورة."]],
   [["Define causal responsibility, with its example.","عرّف المسؤولية السببية، مع مثالها."],["Responsibility resulting from causality — e.g., Kim's investment causes the company to lose money.","مسؤولية ناتجة عن علاقة سببية — مثل استثمار كيم الذي يتسبب في خسارة الشركة."]],
   [["Define blameworthy responsibility, with its example.","عرّف المسؤولية المستوجبة للّوم، مع مثالها."],["Being at fault — e.g., the software designer may be blameworthy if faulty software, not Kim, caused the loss.","أن تكون مخطئًا — مثل مصمم البرنامج الذي قد يكون مستوجبًا للّوم إذا كان البرنامج المعيب، لا كيم، هو سبب الخسارة."]],
   [["Give the example illustrating liability without blame.","اذكر المثال الذي يوضح المسؤولية القانونية دون لوم."],["A friend slips on your polished floor and breaks a leg — you may be liable but not blameworthy.","ينزلق صديق على أرضيتك المصقولة ويكسر ساقه — قد تُحمَّل المسؤولية القانونية دون أن تكون مستوجبًا للّوم."]],
   [["Name three things to appreciate regarding diffusion of responsibility in system creation.","اذكر ثلاثة أمور يجب تقديرها بخصوص تشتت المسؤولية عند إنشاء الأنظمة."],["Scale/complexity of the system, the number of people involved, and what the system will be involved in (e.g. decision making).","حجم النظام وتعقيده، وعدد الأشخاص المشاركين، وما سيشارك فيه النظام (مثل اتخاذ القرار)."]],
   [["What does Kant say about human responsibility?","ماذا يقول كانط عن مسؤولية الإنسان؟"],["Humans are responsible for their actions because they have the capacity to control their actions.","الإنسان مسؤول عن أفعاله لأنه يملك القدرة على التحكم فيها."]],
   [["What was THERAC-25, and what was the outcome?","ما هو ثيراك-25، وما كانت النتيجة؟"],["A computer-controlled radiation therapy system; several patients received massive doses, resulting in at least three fatalities.","نظام علاج إشعاعي يتحكم فيه الحاسوب؛ تلقى عدة مرضى جرعات هائلة، مما أدى إلى ثلاث وفيات على الأقل."]],
   [["In THERAC-25, why wasn't the operator to blame even though they caused the accident?","في قضية ثيراك-25، لماذا لم يكن المشغّل مستوجبًا للّوم رغم تسببه في الحادث؟"],["Even when the operator corrected an entry error within the specified 8 seconds, the system still malfunctioned and killed the patient.","حتى عندما صحّح المشغّل خطأ الإدخال خلال الثواني الثماني المحددة، كان النظام لا يزال يتعطل ويودي بحياة المريض."]],
   [["What open question does THERAC-25 raise about dose limits?","ما السؤال المفتوح الذي تطرحه قضية ثيراك-25 حول حدود الجرعات؟"],["Should there have been a feature capping the radiation dose at some maximum regardless of everything else, and should clients have specified this?","هل كان ينبغي وجود خاصية تحد من الجرعة الإشعاعية بحد أقصى بصرف النظر عن أي شيء آخر، وهل كان ينبغي أن يحدد العملاء ذلك؟"]]
  ],
  quiz:[
   {q:["What is accountability the flip side of?","المساءلة هي الوجه الآخر لماذا؟"], o:[["Punishment","العقاب"],["Delegation","التفويض"],["Negligence","الإهمال"],["Bribery","الرشوة"]], a:1},
   {q:["Why can't we rely on legislation alone for accountability?","لماذا لا يمكننا الاعتماد على التشريعات وحدها للمساءلة؟"], o:[["Laws never change","القوانين لا تتغير أبدًا"],["Different laws apply to different situations, and tech changes faster than laws","قوانين مختلفة تُطبَّق على مواقف مختلفة، والتقنية تتغير أسرع من القوانين"],["Laws are always perfectly enforced","القوانين تُطبَّق دائمًا بشكل مثالي"],["There are no computer-related laws","لا توجد قوانين متعلقة بالحاسوب"]], a:1},
   {q:["Role responsibility is best described as:","أفضل وصف لمسؤولية الدور هو:"], o:[["What people are expected to do within their role","ما يُتوقع من الأفراد فعله ضمن دورهم"],["A legal punishment","عقوبة قانونية"],["Responsibility resulting from causality","مسؤولية ناتجة عن علاقة سببية"],["A type of software license","نوع من تراخيص البرمجيات"]], a:0},
   {q:["In the Kim example, what type of responsibility does Kim have for the company's loss?","في مثال كيم، أي نوع من المسؤولية تتحملها كيم عن خسارة الشركة؟"], o:[["No responsibility at all","لا مسؤولية على الإطلاق"],["Causal responsibility (even though she may not be blameworthy)","مسؤولية سببية (رغم أنها قد لا تكون مستوجبة للّوم)"],["Criminal liability","مسؤولية جنائية"],["Blameworthy responsibility only","مسؤولية مستوجبة للّوم فقط"]], a:1},
   {q:["In the floor-slip example, what are you held, even if you're not blameworthy?","في مثال الانزلاق على الأرضية، بماذا تُحمَّل حتى لو لم تكن مستوجبًا للّوم؟"], o:[["Nothing at all","لا شيء على الإطلاق"],["Criminally guilty","مذنبًا جنائيًا"],["Liable","مسؤولًا قانونيًا"],["A professional, by law","محترفًا، بحكم القانون"]], a:2},
   {q:["Which is NOT listed as a factor behind diffusion of responsibility?","أي مما يلي لم يُذكر كعامل وراء تشتت المسؤولية؟"], o:[["Scale and complexity of the system","حجم النظام وتعقيده"],["Number of people involved","عدد الأشخاص المشاركين"],["The system's physical color","لون النظام الفيزيائي"],["What important decisions the system will be involved in","القرارات المهمة التي سيشارك فيها النظام"]], a:2},
   {q:["According to Kant (as cited in the lecture), humans are responsible for their actions because:","وفق كانط (كما وردت الإشارة إليه في المحاضرة)، الإنسان مسؤول عن أفعاله لأنه:"], o:[["They are always supervised","دائمًا تحت الإشراف"],["They have the capacity to control their actions","يملك القدرة على التحكم في أفعاله"],["Laws require it","القوانين تتطلب ذلك"],["Society punishes them otherwise","المجتمع يعاقبه لولا ذلك"]], a:1},
   {q:["What was THERAC-25?","ما هو ثيراك-25؟"], o:[["A software license agreement","اتفاقية ترخيص برمجيات"],["A computer-controlled radiation treatment system","نظام علاج إشعاعي يتحكم فيه الحاسوب"],["An accounting scandal","فضيحة محاسبية"],["A type of firewall","نوع من الجدران النارية"]], a:1},
   {q:["In THERAC-25, what was the specified time window for an operator to correct a mode error?","في قضية ثيراك-25، ما المدة الزمنية المحددة لتصحيح المشغّل لخطأ في الوضع؟"], o:[["8 seconds","8 ثوانٍ"],["8 minutes","8 دقائق"],["80 seconds","80 ثانية"],["1 second","ثانية واحدة"]], a:0},
   {q:["Even when the THERAC-25 operator corrected the error in time, what still happened?","حتى عندما صحّح مشغّل ثيراك-25 الخطأ في الوقت المحدد، ماذا حدث مع ذلك؟"], o:[["The patient was unaffected","لم يتأثر المريض"],["The system still malfunctioned and the patient was killed","لا يزال النظام يتعطل وقُتل المريض"],["The machine shut down safely","توقفت الآلة بأمان"],["The operator was fired immediately","طُرد المشغّل على الفور"]], a:1},
   {q:["Who was ultimately found liable and paid compensation in the THERAC-25 case?","من وُجد مسؤولًا قانونيًا ودفع التعويضات في نهاية المطاف في قضية ثيراك-25؟"], o:[["The individual operator only","المشغّل الفرد فقط"],["Therac (the company)","ثيراك (الشركة)"],["The hospital's cleaning staff","طاقم النظافة في المستشفى"],["No one was found liable","لم يُحمَّل أحد المسؤولية"]], a:1}
  ]
});

LECTURES.push({ id:'l6', n:6,
  title:["Software Liability and Case Studies","المسؤولية القانونية للبرمجيات ودراسات حالة"],
  obj:[
    ["Describe the ethical responsibilities of software sellers and buyers, including the disclosure dilemma.","وصف المسؤوليات الأخلاقية لبائعي ومشتري البرمجيات، بما في ذلك معضلة الإفصاح."],
    ["Distinguish mass-market, customized, and mixed software in terms of liability.","التمييز بين برمجيات السوق الجماهيري والبرمجيات المُخصَّصة والحالات المختلطة من حيث المسؤولية القانونية."],
    ["Define negligence and apply it to a concrete example.","تعريف الإهمال وتطبيقه على مثال واقعي."],
    ["Summarize the Y2K case study and the Stratton v. Prodigy ISP liability case.","تلخيص دراسة حالة مشكلة الألفية (Y2K) وقضية Stratton v. Prodigy الخاصة بمسؤولية مزودي خدمة الإنترنت."]
  ],
  sec:[
   {t:["Buying and Selling Software: The Seller's Responsibilities","شراء وبيع البرمجيات: مسؤوليات البائع"], b:[
     {k:'p', x:["What are the various responsibilities of the different role players — buyer and seller? The seller:","ما هي المسؤوليات المختلفة لأصحاب الأدوار المختلفين — المشتري والبائع؟ البائع:"]},
     {k:'ul', x:[
       ["Has the right to sell.","يملك الحق في البيع."],
       ["Has a duty to be honest.","يتحمل واجب الصدق."],
       ["Has a duty not to coerce a client.","يتحمل واجب عدم إكراه العميل."],
       ["Is expected to emphasize the good aspects of the product.","يُتوقع منه إبراز الجوانب الجيدة للمنتج."],
       ["Is expected to answer questions honestly.","يُتوقع منه الإجابة بصدق عن الأسئلة."]]}
   ]},
   {t:["The Disclosure Dilemma","معضلة الإفصاح"], b:[
     {k:'p', x:["Is a seller being dishonest if they do not disclose a problem area not asked about? This is probably the case, but it is very difficult to say — especially if the user's needs are varied and complex, since it's unclear how the salesperson could know what those needs are. To a naïve user, the answer might be yes, but it is difficult to compel this.","هل يكون البائع غير صادق إذا لم يُفصح عن مشكلة لم يُسأل عنها؟ على الأرجح نعم، لكن من الصعب جدًا الجزم بذلك — خصوصًا إذا كانت احتياجات المستخدم متنوعة ومعقدة، إذ ليس واضحًا كيف يمكن لمندوب المبيعات معرفة تلك الاحتياجات. وبالنسبة للمستخدم غير المطّلع، قد تكون الإجابة نعم، لكن يصعب إلزام البائع بذلك."]},
     {k:'p', x:["Usually, the product itself (either its packaging or license agreement) will contain all the necessary information. A contract can be voided if all relevant information is not given.","عادة ما يحتوي المنتج نفسه (سواء عبوته أو اتفاقية الترخيص) على كل المعلومات اللازمة. ويمكن إبطال العقد إذا لم تُقدَّم كل المعلومات ذات الصلة."]},
     {k:'tip', x:["The buyer also has the responsibility to find out all the necessary information and ask the right questions if there is a lack of it.","يتحمل المشتري أيضًا مسؤولية البحث عن كل المعلومات اللازمة وطرح الأسئلة الصحيحة إذا كانت ناقصة."]}
   ]},
   {t:["a. Software: Product or Service?","أ. البرمجيات: منتج أم خدمة؟"], b:[
     {k:'p', x:["This depends on the circumstances of how the software is produced and/or sold. A comparison can be made between software and buying a suit (Prince, 1980). There are three types of suit purchase.","يعتمد ذلك على ظروف إنتاج البرنامج و/أو بيعه. ويمكن عمل مقارنة بين البرمجيات وشراء بدلة (Prince، 1980). وهناك ثلاثة أنواع لشراء البدلة."]},
     {k:'tbl', h:[["Suit Analogy","تشبيه البدلة"],["Software Equivalent","المقابل في البرمجيات"]],
      r:[
       [["Off the peg / ready to wear (no alteration)","جاهزة للارتداء (بدون تعديل)"],["Mass market (a product)","السوق الجماهيري (منتج)"]],
       [["Tailor-made to the person's specific requirements","مُفصَّلة حسب متطلبات الشخص المحددة"],["Customized software (a service)","برمجيات مُخصَّصة (خدمة)"]],
       [["In between (ready to wear + alterations)","بينهما (جاهزة + تعديلات)"],["Mixed (product + service)","حالة مختلطة (منتج + خدمة)"]]
      ]}
   ]},
   {t:["b. Mass Market Software","ب. برمجيات السوق الجماهيري"], b:[
     {k:'def', x:["With mass market products, strict liability can be imposed. Producers can be sued for errors or malfunctions causing damage.","في منتجات السوق الجماهيري، يمكن فرض المسؤولية المشددة (Strict Liability). ويمكن مقاضاة المنتِجين عن الأخطاء أو الأعطال التي تُسبب ضررًا."]},
     {k:'ul', h:["Why strict liability applies here","لماذا تُطبَّق المسؤولية المشددة هنا"], x:[
       ["The producer puts the product in the public domain and invites people to buy or use it.","يضع المنتِج المنتج في متناول العامة ويدعو الناس لشرائه أو استخدامه."],
       ["The producer earns profit and should bear the risks.","يحقق المنتِج أرباحًا وينبغي أن يتحمل المخاطر."],
       ["The producer is in the best position to anticipate and control the risks associated with the product, so the onus is on the producer to get it right.","المنتِج في أفضل موقع لتوقّع المخاطر المرتبطة بالمنتج والتحكم بها، لذا يقع عليه عبء إتقانه."],
       ["The producer can spread the cost of injury and insurance over all clients.","يمكن للمنتِج توزيع تكلفة الضرر والتأمين على جميع العملاء."]]},
     {k:'tip', x:["The reasoning here is utilitarian: placing the onus on the producer has positive overall effects.","المنطق هنا نفعي: فوضع العبء على المنتِج له آثار إيجابية إجمالية."]}
   ]},
   {t:["c. Customized Software","ج. البرمجيات المُخصَّصة"], b:[
     {k:'p', x:["Strict liability does not make sense here, since the software is created and designed specifically for the client. The client knows the context in which the software will be used and specifies what is required, so the client must take on part of the risk. This type of software should be considered a service.","لا معنى للمسؤولية المشددة هنا، لأن البرنامج صُمم وأُنشئ خصيصًا للعميل. فالعميل يعرف السياق الذي سيُستخدم فيه البرنامج ويحدد المطلوب، لذا يجب أن يتحمل جزءًا من المخاطرة. ويُعتبر هذا النوع من البرمجيات خدمة."]}
   ]},
   {t:["d. Mixed Case","د. الحالة المختلطة"], b:[
     {k:'p', x:["The product and the service parts should each be treated on their own.","يجب التعامل مع جزء المنتج وجزء الخدمة كل على حدة."]}
   ]},
   {t:["e. Negligence","هـ. الإهمال"], b:[
     {k:'def', x:["Negligence is a failure to do something that is expected of a reasonable and prudent person.","الإهمال (Negligence) هو التقصير في فعل ما يُتوقع من شخص عاقل وحصيف."]},
     {k:'ex', x:["If a security guard is knocked unconscious, he cannot be blamed. But if he is drunk, he might be considered negligent. There is always a presumption of a reasonable standard of behavior.","إذا فُقد حارس الأمن وعيه بالضرب، فلا يمكن لومه. لكن إذا كان ثملًا، فقد يُعتبر مهملًا. وهناك دائمًا افتراض بوجود معيار معقول للسلوك."]},
     {k:'p', x:["This concept is often used to describe blameworthy behavior of professionals. The definition of the standard applicable to the offence is often quite difficult to arrive at, and is often best judged by other professionals — which raises possible conflict-of-interest issues.","يُستخدم هذا المفهوم غالبًا لوصف السلوك المستوجب للّوم لدى المهنيين. وغالبًا ما يصعب تحديد المعيار المنطبق على المخالفة، وغالبًا ما يُحكَم عليه بشكل أفضل من قِبل مهنيين آخرين — مما يثير احتمال تضارب المصالح."]}
   ]},
   {t:["Case Study: Who Was Responsible? (The Y2K Problem)","دراسة حالة: من كان المسؤول؟ (مشكلة الألفية Y2K)"], b:[
     {k:'p', x:["Systems stored the year using 2 digits to save expensive storage space. Was that a good decision?","خزّنت الأنظمة السنة باستخدام رقمين فقط لتوفير مساحة تخزين باهظة التكلفة. فهل كان هذا قرارًا جيدًا؟"]},
     {k:'formula', x:"1970: 2-byte year storage saved expensive space — the professionals did a good job.\n1980: Same answer.\n1990: Same answer? Were the systems expected to last 10 years? What was the cost of storage then? What was the cost of upgrading an old system?\n1995: Same answer? Were the systems expected to last 5 more years? What about storage/upgrade cost? Should professionals have warned companies of the Y2K problem? Should there have been a recommended code of practice on this issue?\n1998: Same question, different answer? Client companies all had policies by now, communicated to shareholders, and everyone accepted their responsibilities."},
     {k:'p', x:["So it has been a chapter of evolving answers. The best strategy is:","لقد كان هذا فصلًا من الإجابات المتطورة. وأفضل استراتيجية هي:"]},
     {k:'ul', x:[
       ["State clearly the role responsibilities of all concerned — professionals needed to explain and document the problem, then offer options.","توضيح مسؤوليات الدور لجميع الأطراف المعنية بوضوح — إذ احتاج المهنيون لشرح المشكلة وتوثيقها، ثم تقديم خيارات."],
       ["Make sure all involved understood the effect of their work on people — clients needed to understand the available options, realizing that staying with 2 digits was a short-term, unsafe choice.","التأكد من فهم جميع المعنيين لتأثير عملهم على الناس — إذ احتاج العملاء لفهم الخيارات المتاحة، وإدراك أن البقاء على رقمين كان خيارًا قصير الأجل وغير آمن."],
       ["Hold those responsible who fail to live up to their responsibility.","محاسبة من يُخفق في الوفاء بمسؤوليته."]]}
   ]},
   {t:["Example: ISP Responsibility (Stratton v. Prodigy)","مثال: مسؤولية مزود خدمة الإنترنت (Stratton v. Prodigy)"], b:[
     {k:'p', x:["Recall the scenario with Milo: a service provider gives him chat room and forum facilities. Milo was defamed by another user and has the right of recourse. The obvious route is to hold the individual responsible — but the problem is that the individual is anonymous.","لنتذكر سيناريو ميلو: يزوّده مزود خدمة بغرف دردشة ومنتديات. تعرّض ميلو للتشهير من مستخدم آخر وله الحق في التظلم. والمسار الواضح هو تحميل الفرد المسؤولية — لكن المشكلة أن ذلك الفرد مجهول الهوية."]},
     {k:'ex', x:["Stratton v. ISP Prodigy (1995): Prodigy was sued by users regarding content in its online forums, over which Prodigy had advertised that it exercised editorial control. The court applied the law governing newspapers and found Prodigy guilty. Prodigy claimed it was more like a telephone company than a newspaper company. The following year, the U.S. Communications Decency Act reversed this, on the basis that ISPs are closer to telephone companies. The act also introduced Good Samaritan immunity, under which an entity can exercise some control without liability, and is encouraged to do so.","قضية Stratton ضد مزود خدمة الإنترنت Prodigy (1995): رفع مستخدمون دعوى ضد Prodigy بخصوص محتوى في منتدياتها الإلكترونية، التي أعلنت Prodigy أنها تمارس عليها رقابة تحريرية. طبّقت المحكمة القانون المُطبَّق على الصحف ووجدت Prodigy مذنبة. ادّعت Prodigy أنها أشبه بشركة هاتف منها بشركة صحافة. وفي العام التالي، ألغى قانون آداب الاتصالات الأمريكي (Communications Decency Act) هذا الحكم، على أساس أن مزودي خدمة الإنترنت أقرب إلى شركات الهاتف. كما أدخل القانون حصانة 'السامري الصالح' (Good Samaritan Immunity)، التي بموجبها يمكن لجهة ما ممارسة بعض الرقابة دون تحمل مسؤولية قانونية، بل تُشجَّع على ذلك."]}
   ]}
  ],
  take:[
   ["Sellers must be honest, not coerce clients, and answer questions honestly; buyers must also seek out the information they need.","يجب أن يكون البائعون صادقين، وألا يُكرهوا العملاء، وأن يجيبوا عن الأسئلة بصدق؛ ويجب على المشترين أيضًا البحث عن المعلومات التي يحتاجونها."],
   ["Mass-market software = product (strict liability); customized software = service (client shares risk); mixed case = treat each part separately.","برمجيات السوق الجماهيري = منتج (مسؤولية مشددة)؛ البرمجيات المُخصَّصة = خدمة (يشارك العميل في المخاطرة)؛ الحالة المختلطة = يُعامل كل جزء على حدة."],
   ["Negligence = failing to do what a reasonable, prudent person would do (e.g., a drunk guard vs. one who was knocked unconscious).","الإهمال = التقصير في فعل ما يفعله شخص عاقل وحصيف (مثل حارس ثمل مقارنة بآخر فُقد وعيه بالضرب)."],
   ["The Y2K case shows that 'who was responsible?' changes over time as costs, risks, and available information evolve.","توضح قضية Y2K أن إجابة 'من كان المسؤول؟' تتغير مع الوقت مع تطور التكاليف والمخاطر والمعلومات المتاحة."],
   ["Stratton v. Prodigy initially held the ISP liable like a newspaper; the Communications Decency Act later introduced Good Samaritan immunity.","حمّلت قضية Stratton v. Prodigy في البداية مزود خدمة الإنترنت المسؤولية مثل صحيفة؛ لاحقًا أدخل قانون آداب الاتصالات حصانة 'السامري الصالح'."]
  ],
  fc:[
   [["List two of the seller's responsibilities when selling software.","اذكر اثنتين من مسؤوليات البائع عند بيع البرمجيات."],["Any two of: right to sell, duty to be honest, duty not to coerce, emphasize good aspects, answer questions honestly.","أي اثنتين من: الحق في البيع، واجب الصدق، واجب عدم الإكراه، إبراز الجوانب الجيدة، الإجابة بصدق."]],
   [["What is the buyer's responsibility in a software purchase?","ما مسؤولية المشتري في عملية شراء البرنامج؟"],["To find out all necessary information and ask the right questions if information is lacking.","البحث عن كل المعلومات اللازمة وطرح الأسئلة الصحيحة إذا كانت المعلومات ناقصة."]],
   [["What three types of suit purchase does software liability get compared to?","بأي ثلاثة أنواع من شراء البدلات تُقارَن مسؤولية البرمجيات؟"],["Off the peg (ready-to-wear), tailor-made, and in-between.","جاهزة للارتداء، مُفصَّلة حسب الطلب، وبينهما."]],
   [["Which software grouping matches 'off the peg', and is it a product or a service?","أي تصنيف للبرمجيات يقابل 'جاهزة للارتداء'، وهل هو منتج أم خدمة؟"],["Mass market software — a product.","برمجيات السوق الجماهيري — منتج."]],
   [["Name two reasons strict liability is imposed on mass market software producers.","اذكر سببين لفرض المسؤولية المشددة على منتجي برمجيات السوق الجماهيري."],["Any two of: puts product in public domain, earns profit so bears risk, best positioned to control risk, can spread injury/insurance cost over clients.","أي سببين من: يضع المنتج في متناول العامة، يحقق أرباحًا فيتحمل المخاطر، في أفضل موقع للتحكم بالمخاطر، يمكنه توزيع تكلفة الضرر/التأمين على العملاء."]],
   [["Why doesn't strict liability apply to customized software?","لماذا لا تُطبَّق المسؤولية المشددة على البرمجيات المُخصَّصة؟"],["The client specifies the requirements and knows the context of use, so the client must share the risk — it's treated as a service.","يحدد العميل المتطلبات ويعرف سياق الاستخدام، لذا يجب أن يشارك في المخاطرة — وتُعامَل كخدمة."]],
   [["Define negligence.","عرّف الإهمال."],["A failure to do something that is expected of a reasonable and prudent person.","التقصير في فعل ما يُتوقع من شخص عاقل وحصيف."]],
   [["In the security guard example, when is he NOT negligent, and when might he be?","في مثال حارس الأمن، متى لا يُعتبر مهملًا، ومتى قد يكون كذلك؟"],["Not negligent if knocked unconscious; might be considered negligent if he was drunk.","لا يُعتبر مهملًا إذا فُقد وعيه بالضرب؛ وقد يُعتبر مهملًا إذا كان ثملًا."]],
   [["Who is often best positioned to judge the standard of negligence for a professional, and what issue can this raise?","من غالبًا ما يكون في أفضل موقع للحكم على معيار الإهمال لمهني، وما المشكلة التي قد يثيرها ذلك؟"],["Other professionals — which can raise conflict-of-interest issues.","مهنيون آخرون — مما قد يثير مشكلات تضارب المصالح."]],
   [["In the Y2K case study, what changed between 1970 and 1998 regarding the 2-digit year decision?","في دراسة حالة Y2K، ماذا تغيّر بين عامي 1970 و1998 بخصوص قرار تخزين السنة برقمين؟"],["The justification shifted over time as storage costs fell and systems lasted longer, until by 1998 companies had policies and accepted responsibility.","تغيّر المبرر مع الوقت مع انخفاض تكاليف التخزين وطول عمر الأنظمة، حتى أصبح لدى الشركات بحلول 1998 سياسات وقبلت بمسؤولياتها."]],
   [["What is the obvious (but problematic) route to deal with defamation in ISP forums?","ما المسار الواضح (لكن الإشكالي) للتعامل مع التشهير في منتديات مزودي خدمة الإنترنت؟"],["Hold the individual responsible — the problem is the individual is often anonymous.","تحميل الفرد المسؤولية — والمشكلة أن الفرد غالبًا ما يكون مجهول الهوية."]],
   [["What did the court initially rule in Stratton v. Prodigy, and why?","بماذا حكمت المحكمة ابتداءً في قضية Stratton v. Prodigy، ولماذا؟"],["It found Prodigy guilty, applying the law governing newspapers, since Prodigy advertised editorial control over its forums.","وجدت Prodigy مذنبة، مُطبِّقةً القانون المنطبق على الصحف، لأن Prodigy أعلنت ممارستها رقابة تحريرية على منتدياتها."]],
   [["What did the Communications Decency Act introduce the following year?","ماذا أدخل قانون آداب الاتصالات في العام التالي؟"],["Good Samaritan immunity, allowing an entity to exercise some control without liability.","حصانة 'السامري الصالح'، التي تسمح لجهة ما بممارسة بعض الرقابة دون تحمل مسؤولية قانونية."]]
  ],
  quiz:[
   {q:["Which is NOT one of the seller's responsibilities listed?","أي مما يلي ليس من مسؤوليات البائع المذكورة؟"], o:[["Duty to be honest","واجب الصدق"],["Duty not to coerce a client","واجب عدم إكراه العميل"],["Duty to guarantee the client's business success","واجب ضمان نجاح أعمال العميل"],["Right to sell","الحق في البيع"]], a:2},
   {q:["In the suit analogy, which type matches 'tailor-made to specific requirements'?","في تشبيه البدلة، أي نوع يقابل 'مُفصَّلة حسب متطلبات محددة'؟"], o:[["Mass market software","برمجيات السوق الجماهيري"],["Customized software","البرمجيات المُخصَّصة"],["Mixed case","الحالة المختلطة"],["None of the above","لا شيء مما سبق"]], a:1},
   {q:["Mass-market software is generally treated, for liability purposes, as a:","تُعامَل برمجيات السوق الجماهيري عمومًا، لأغراض المسؤولية القانونية، باعتبارها:"], o:[["Service","خدمة"],["Product","منتجًا"],["Gift","هدية"],["Charity","عملًا خيريًا"]], a:1},
   {q:["Which is NOT one of the reasons strict liability applies to mass-market software?","أي مما يلي ليس من أسباب تطبيق المسؤولية المشددة على برمجيات السوق الجماهيري؟"], o:[["Producer earns profit and should bear the risks","المنتِج يحقق أرباحًا وينبغي أن يتحمل المخاطر"],["Producer is best positioned to control the risks","المنتِج في أفضل موقع للتحكم بالمخاطر"],["Producer can spread injury/insurance cost over clients","يمكن للمنتِج توزيع تكلفة الضرر/التأمين على العملاء"],["Producer has no relationship to the product once sold","لا علاقة للمنتِج بالمنتج بعد بيعه"]], a:3},
   {q:["Why is customized software treated as a service rather than a product?","لماذا تُعامَل البرمجيات المُخصَّصة كخدمة لا كمنتج؟"], o:[["It is always free of charge","لأنها دائمًا مجانية"],["The client specifies requirements and shares part of the risk","العميل يحدد المتطلبات ويشارك في جزء من المخاطرة"],["It is illegal to sell as a product","يُحظر قانونيًا بيعها كمنتج"],["It never contains errors","لأنها لا تحتوي أخطاءً أبدًا"]], a:1},
   {q:["Negligence is best defined as:","يُعرَّف الإهمال على أفضل وجه بأنه:"], o:[["Any accident, regardless of fault","أي حادث، بصرف النظر عن الخطأ"],["A failure to do something expected of a reasonable, prudent person","التقصير في فعل ما يُتوقع من شخص عاقل وحصيف"],["A type of software bug","نوع من أخطاء البرمجيات"],["A criminal offense only","جريمة جنائية فقط"]], a:1},
   {q:["In the security guard example, when might he be considered negligent?","في مثال حارس الأمن، متى قد يُعتبر مهملًا؟"], o:[["If he was knocked unconscious","إذا فُقد وعيه بالضرب"],["If he was drunk","إذا كان ثملًا"],["If he was on vacation","إذا كان في إجازة"],["Never, under any circumstance","أبدًا، تحت أي ظرف"]], a:1},
   {q:["Who is often best placed to judge the standard applicable to professional negligence?","من غالبًا ما يكون في أفضل موقع للحكم على المعيار المنطبق على إهمال المهنيين؟"], o:[["The general public","عامة الناس"],["Other professionals","مهنيون آخرون"],["The media","وسائل الإعلام"],["No one can judge this","لا أحد يستطيع الحكم على ذلك"]], a:1},
   {q:["In the Y2K case study, what was the ORIGINAL justification (1970) for using 2-digit years?","في دراسة حالة Y2K، ما كان المبرر الأصلي (1970) لاستخدام رقمين لتخزين السنة؟"], o:[["It was required by law","كان مطلوبًا بموجب القانون"],["It saved expensive storage space","وفّر مساحة تخزين باهظة التكلفة"],["No one thought of an alternative","لم يفكر أحد ببديل"],["Computers could not handle 4 digits at all","لم تكن الحواسيب قادرة على التعامل مع أربعة أرقام إطلاقًا"]], a:1},
   {q:["What was the obvious but problematic route to resolve the Milo defamation scenario?","ما المسار الواضح لكن الإشكالي لحل سيناريو تشهير ميلو؟"], o:[["Suing the ISP directly, with no other option considered","مقاضاة مزود خدمة الإنترنت مباشرة، دون اعتبار أي خيار آخر"],["Holding the individual responsible, but they are usually anonymous","تحميل الفرد المسؤولية، لكنه غالبًا ما يكون مجهول الهوية"],["Ignoring the incident entirely","تجاهل الحادثة تمامًا"],["Shutting down the entire forum","إغلاق المنتدى بأكمله"]], a:1},
   {q:["In Stratton v. Prodigy (1995), the court initially applied the law governing:","في قضية Stratton v. Prodigy (1995)، طبّقت المحكمة ابتداءً القانون المنطبق على:"], o:[["Telephone companies","شركات الهاتف"],["Newspapers","الصحف"],["Banks","البنوك"],["Universities","الجامعات"]], a:1},
   {q:["What did the Good Samaritan immunity (from the Communications Decency Act) allow?","ماذا سمحت به حصانة 'السامري الصالح' (من قانون آداب الاتصالات)؟"], o:[["An entity to exercise some control without liability","لجهة ما ممارسة بعض الرقابة دون تحمل مسؤولية قانونية"],["Complete immunity from all laws","حصانة كاملة من جميع القوانين"],["ISPs to be classified exactly like newspapers","تصنيف مزودي خدمة الإنترنت تمامًا مثل الصحف"],["Users to remain anonymous forever","بقاء المستخدمين مجهولي الهوية إلى الأبد"]], a:0}
  ]
});

LECTURES.push({ id:'l7', n:7,
  title:["IT Professionals and Relationships with Employers and Clients","أخصائيو تقنية المعلومات وعلاقاتهم بأصحاب العمل والعملاء"],
  obj:[
    ["Define what makes an occupation a 'profession' and explain why IT workers do not meet the legal definition.","تعريف ما يجعل المهنة 'مهنة احترافية' وتوضيح سبب عدم استيفاء أخصائيي تقنية المعلومات للتعريف القانوني."],
    ["Name the seven forces changing the professional services industry.","ذكر القوى السبع التي تُغيّر صناعة الخدمات المهنية."],
    ["Describe IT workers' ethical obligations to employers, including software piracy, trade secrets, and whistle-blowing.","وصف الالتزامات الأخلاقية لأخصائيي تقنية المعلومات تجاه أصحاب العمل، بما في ذلك قرصنة البرمجيات والأسرار التجارية والإبلاغ عن المخالفات."],
    ["Describe IT workers' ethical obligations to clients, including conflict of interest, fraud, misrepresentation, and breach of contract.","وصف الالتزامات الأخلاقية لأخصائيي تقنية المعلومات تجاه العملاء، بما في ذلك تضارب المصالح والاحتيال والتحريف والإخلال بالعقد."]
  ],
  sec:[
   {t:["What Makes Someone a Professional?","ما الذي يجعل الشخص محترفًا؟"], b:[
     {k:'def', x:["A profession is a calling that requires specialized knowledge and long, intensive academic preparation.","المهنة الاحترافية (Profession) هي دعوة تتطلب معرفة متخصصة وإعدادًا أكاديميًا طويلًا ومكثفًا."]},
     {k:'ul', h:["Professionals:","المحترفون:"], x:[
       ["Require advanced training and experience.","يحتاجون إلى تدريب وخبرة متقدمين."],
       ["Must exercise discretion and judgment in their work.","يجب أن يمارسوا التقدير والحكم في عملهم."],
       ["Have work that cannot be standardized.","يقومون بعمل لا يمكن توحيده قياسيًا."],
       ["Contribute to society, participate in lifelong training, and assist other professionals.","يساهمون في المجتمع، ويشاركون في تدريب مستمر مدى الحياة، ويساعدون محترفين آخرين."],
       ["Carry special rights and responsibilities.","يحملون حقوقًا ومسؤوليات خاصة."]]}
   ]},
   {t:["IT Workers as Professionals","أخصائيو تقنية المعلومات كمحترفين"], b:[
     {k:'ul', h:["Partial list of IT specialists","قائمة جزئية بأخصائيي تقنية المعلومات"], x:[
       ["Programmers","المبرمجون"],["Systems analysts","محللو الأنظمة"],["Software engineers","مهندسو البرمجيات"],
       ["Database administrators","مديرو قواعد البيانات"],["Local area network (LAN) administrators","مديرو الشبكات المحلية (LAN)"],["Chief information officers (CIOs)","كبار مسؤولي المعلومات (CIOs)"]]},
     {k:'def', x:["Legal perspective: IT workers do not meet the legal definition of a professional. They are not licensed by state or federal government, and are not liable for malpractice.","المنظور القانوني: لا يستوفي أخصائيو تقنية المعلومات التعريف القانوني للمحترف. فهم غير مرخصين من قِبل الحكومة الفيدرالية أو حكومة الولاية، وغير مسؤولين قانونيًا عن سوء الممارسة المهنية."]}
   ]},
   {t:["The Changing Professional Services Industry","صناعة الخدمات المهنية المتغيرة"], b:[
     {k:'p', x:["IT workers are considered part of the professional services industry. Seven forces are changing professional services.","يُعتبر أخصائيو تقنية المعلومات جزءًا من صناعة الخدمات المهنية. وهناك سبع قوى تُغيّر الخدمات المهنية."]},
     {k:'ul', x:[
       ["Client sophistication — clients are able to drive hard bargains.","تطور العملاء — القدرة على المساومة بقوة."],
       ["Governance — due to major scandals.","الحوكمة — بسبب الفضائح الكبرى."],
       ["Connectivity — instant communications.","الاتصال — التواصل الفوري."],
       ["Transparency — ability to view work-in-progress in real time.","الشفافية — إمكانية متابعة العمل الجاري آنيًا."],
       ["Modularization — able to outsource modules.","التجزئة — إمكانية إسناد وحدات العمل لجهات خارجية."],
       ["Globalization — worldwide sourcing.","العولمة — الاستعانة بمصادر حول العالم."],
       ["Commoditization — for low-end services.","التسليع — بالنسبة للخدمات المتدنية الجودة."]]}
   ]},
   {t:["Professional Relationships IT Workers Must Manage","العلاقات المهنية التي يجب على أخصائيي تقنية المعلومات إدارتها"], b:[
     {k:'p', x:["IT workers are involved in relationships with six groups.","يرتبط أخصائيو تقنية المعلومات بعلاقات مع ست جهات."]},
     {k:'ul', x:[
       ["1. Employers.","1. أصحاب العمل."],
       ["2. Clients.","2. العملاء."],
       ["3. Suppliers.","3. الموردون."],
       ["4. Other professionals.","4. المحترفون الآخرون."],
       ["5. IT users.","5. مستخدمو تقنية المعلومات."],
       ["6. Society at large.","6. المجتمع عمومًا."]]}
   ]},
   {t:["1. Relationships Between IT Workers and Employers","1. العلاقات بين أخصائيي تقنية المعلومات وأصحاب العمل"], b:[
     {k:'p', x:["IT workers agree on many aspects of the work relationship before accepting a job offer. Other aspects are defined in the company's policy and procedure manual or code of conduct, and some aspects develop over time. As stewards of the organization's IT resources, IT workers must set an example and enforce policies regarding the ethical use of IT.","يتفق أخصائيو تقنية المعلومات على كثير من جوانب علاقة العمل قبل قبول عرض الوظيفة. وتُحدَّد جوانب أخرى في دليل سياسات وإجراءات الشركة أو مدونة السلوك، بينما تتطور جوانب أخرى بمرور الوقت. وبصفتهم أمناء على موارد تقنية المعلومات بالمؤسسة، يجب أن يكونوا قدوة وأن يُطبّقوا السياسات المتعلقة بالاستخدام الأخلاقي لتقنية المعلومات."]},
     {k:'def', x:["Software piracy: the act of illegally making copies of software, or enabling access to software to which one is not entitled. This is an area in which IT workers can be tempted to violate laws and policies.","قرصنة البرمجيات (Software Piracy): فعل نسخ البرمجيات بشكل غير قانوني، أو تمكين الوصول إلى برمجيات لا يحق للشخص الوصول إليها. وهذا مجال قد يُغري أخصائيي تقنية المعلومات بمخالفة القوانين والسياسات."]},
     {k:'p', x:["The Business Software Alliance (BSA) is a trade group representing the world's largest software and hardware manufacturers, with a mission to stop the unauthorized copying of software. Thousands of cases are prosecuted each year.","تحالف البرمجيات التجارية (Business Software Alliance - BSA) هو مجموعة تجارية تمثل أكبر مصنّعي البرمجيات والأجهزة في العالم، ومهمته وقف النسخ غير المصرح به للبرمجيات. وتُلاحَق آلاف القضايا قضائيًا كل عام."]},
     {k:'def', x:["Trade secrets: business information that is generally unknown to the public, which the company takes action to keep confidential, requires cost or effort to develop, and has some degree of uniqueness or novelty.","الأسرار التجارية (Trade Secrets): معلومات تجارية غير معروفة عمومًا للجمهور، وتتخذ الشركة إجراءات للحفاظ على سريتها، وتتطلب تكلفة أو جهدًا لتطويرها، ولها درجة من التفرد أو الحداثة."]},
     {k:'def', x:["Whistle-blowing: when an employee attracts attention to a negligent, illegal, unethical, abusive, or dangerous act that threatens the public interest.","الإبلاغ عن المخالفات (Whistle-Blowing): عندما يلفت موظف الانتباه إلى فعل مهمل أو غير قانوني أو غير أخلاقي أو مسيء أو خطير يهدد المصلحة العامة."]}
   ]},
   {t:["2. Relationships Between IT Workers and Clients","2. العلاقات بين أخصائيي تقنية المعلومات والعملاء"], b:[
     {k:'p', x:["The IT worker provides hardware, software, or services at a certain cost and within a given time frame. The client provides compensation, access to key contacts, and work space. The relationship is usually documented in contractual terms.","يقدّم أخصائي تقنية المعلومات العتاد أو البرمجيات أو الخدمات بتكلفة محددة وضمن إطار زمني معين. ويقدّم العميل التعويض المالي، وإمكانية الوصول إلى جهات الاتصال الرئيسية، ومساحة العمل. وعادة ما تُوثَّق العلاقة بشروط تعاقدية."]},
     {k:'p', x:["The client makes decisions about a project based on information, alternatives, and recommendations provided by the IT worker, and trusts the IT worker to act in the client's best interests. The IT worker, in turn, trusts that the client will provide relevant information, listen to and understand what the IT worker says, ask questions to understand the impact of key decisions, and use the information to make wise choices.","يتخذ العميل قرارات بشأن المشروع بناءً على المعلومات والبدائل والتوصيات التي يقدمها أخصائي تقنية المعلومات، ويثق في أنه يعمل لمصلحته الفضلى. ويثق أخصائي تقنية المعلومات بدوره في أن العميل سيقدم المعلومات ذات الصلة، وسيستمع إلى ما يقوله ويفهمه، وسيطرح أسئلة لفهم تأثير القرارات المهمة، وسيستخدم المعلومات لاتخاذ خيارات حكيمة."]},
     {k:'tip', x:["Ethical problems arise if a company recommends its own products and services to remedy problems it has detected — this creates a conflict of interest. Problems also arise if IT workers are unable to provide full and accurate reporting of a project's status, which can lead to finger-pointing and heated discussions.","تنشأ مشكلات أخلاقية إذا أوصت شركة بمنتجاتها أو خدماتها الخاصة لمعالجة مشكلات اكتشفتها هي نفسها — مما يخلق تضارب مصالح. كما تنشأ مشكلات إذا عجز أخصائيو تقنية المعلومات عن تقديم تقارير كاملة ودقيقة عن حالة المشروع، مما قد يؤدي إلى تبادل الاتهامات ونقاشات حادة."]},
     {k:'def', x:["Fraud: the crime of obtaining goods, services, or property through deception or trickery.","الاحتيال (Fraud): جريمة الحصول على سلع أو خدمات أو ممتلكات عن طريق الخداع أو التحايل."]},
     {k:'def', x:["Misrepresentation: a misstatement or incomplete statement of a material fact. If misrepresentation causes a party to enter into a contract, that party may have the right to cancel the contract or seek reimbursement for damages.","التحريف (Misrepresentation): تصريح خاطئ أو غير مكتمل بحقيقة جوهرية. وإذا تسبب التحريف في دخول طرف ما في عقد، فقد يحق لذلك الطرف إلغاء العقد أو طلب تعويض عن الأضرار."]},
     {k:'def', x:["Breach of contract: when one party fails to meet the terms of a contract. When there is a material breach, the non-breaching party may rescind the contract, seek restitution of any compensation already paid, and be discharged from any further performance under the contract.","الإخلال بالعقد (Breach of Contract): عندما يُخفق أحد الطرفين في الوفاء بشروط العقد. وفي حال الإخلال الجوهري، يجوز للطرف غير المُخِلّ فسخ العقد، وطلب استرداد أي تعويض دُفع، والإعفاء من أي أداء إضافي بموجب العقد."]},
     {k:'tip', x:["IT projects are joint efforts in which vendors and customers work together, so when problems arise, it is often difficult to assign who is at fault.","مشاريع تقنية المعلومات جهود مشتركة يعمل فيها الموردون والعملاء معًا، لذا عندما تنشأ مشكلات، يصعب غالبًا تحديد المسؤول عنها."]}
   ]}
  ],
  take:[
   ["A profession requires specialized knowledge, long academic preparation, and work that can't be standardized.","تتطلب المهنة الاحترافية معرفة متخصصة، وإعدادًا أكاديميًا طويلًا، وعملًا لا يمكن توحيده قياسيًا."],
   ["IT workers do NOT meet the legal definition of 'professional' — they are unlicensed and not liable for malpractice.","لا يستوفي أخصائيو تقنية المعلومات التعريف القانوني لـ'المحترف' — فهم غير مرخصين وغير مسؤولين قانونيًا عن سوء الممارسة."],
   ["Seven forces reshaping professional services: client sophistication, governance, connectivity, transparency, modularization, globalization, commoditization.","سبع قوى تُعيد تشكيل الخدمات المهنية: تطور العملاء، الحوكمة، الاتصال، الشفافية، التجزئة، العولمة، التسليع."],
   ["As stewards of IT resources, IT workers must guard against software piracy, protect trade secrets, and support whistle-blowing when needed.","بصفتهم أمناء على موارد تقنية المعلومات، يجب أن يحذر أخصائيو تقنية المعلومات من قرصنة البرمجيات، ويحموا الأسرار التجارية، ويدعموا الإبلاغ عن المخالفات عند الحاجة."],
   ["Recommending your own product to fix a problem you found creates a conflict of interest; fraud, misrepresentation, and breach of contract are distinct legal wrongs in client relationships.","التوصية بمنتجك الخاص لحل مشكلة اكتشفتها أنت يخلق تضارب مصالح؛ والاحتيال والتحريف والإخلال بالعقد مخالفات قانونية متمايزة في علاقات العملاء."]
  ],
  fc:[
   [["What is a profession?","ما هي المهنة الاحترافية؟"],["A calling that requires specialized knowledge and long, intensive academic preparation.","دعوة تتطلب معرفة متخصصة وإعدادًا أكاديميًا طويلًا ومكثفًا."]],
   [["Name two qualities professionals are expected to have.","اذكر صفتين يُتوقع أن يتحلى بهما المحترفون."],["Any two of: advanced training/experience, exercise discretion/judgment, non-standardized work, contribute to society, carry special rights/responsibilities.","أي صفتين من: تدريب/خبرة متقدمين، ممارسة التقدير/الحكم، عمل غير موحّد قياسيًا، المساهمة في المجتمع، حمل حقوق/مسؤوليات خاصة."]],
   [["Why do IT workers not meet the LEGAL definition of 'professional'?","لماذا لا يستوفي أخصائيو تقنية المعلومات التعريف القانوني لـ'المحترف'؟"],["They are not licensed by state or federal government, and are not liable for malpractice.","لأنهم غير مرخصين من حكومة الولاية أو الحكومة الفيدرالية، وغير مسؤولين قانونيًا عن سوء الممارسة."]],
   [["List the seven forces changing the professional services industry.","اذكر القوى السبع التي تُغيّر صناعة الخدمات المهنية."],["Client sophistication, governance, connectivity, transparency, modularization, globalization, commoditization.","تطور العملاء، الحوكمة، الاتصال، الشفافية، التجزئة، العولمة، التسليع."]],
   [["List the six groups IT workers have professional relationships with.","اذكر الجهات الست التي يرتبط معها أخصائيو تقنية المعلومات بعلاقات مهنية."],["Employers, clients, suppliers, other professionals, IT users, and society at large.","أصحاب العمل، العملاء، الموردون، المحترفون الآخرون، مستخدمو تقنية المعلومات، والمجتمع عمومًا."]],
   [["Define software piracy.","عرّف قرصنة البرمجيات."],["Illegally making copies of software, or enabling access to software one is not entitled to.","نسخ البرمجيات بشكل غير قانوني، أو تمكين الوصول إلى برمجيات لا يحق للشخص الوصول إليها."]],
   [["What is the BSA, and what is its mission?","ما هو تحالف BSA، وما مهمته؟"],["The Business Software Alliance — a trade group representing major software/hardware manufacturers, whose mission is to stop unauthorized copying of software.","تحالف البرمجيات التجارية — مجموعة تجارية تمثل كبار مصنّعي البرمجيات/الأجهزة، ومهمته وقف النسخ غير المصرح به للبرمجيات."]],
   [["Define trade secrets.","عرّف الأسرار التجارية."],["Business information generally unknown to the public, kept confidential, requiring cost/effort to develop, with some uniqueness or novelty.","معلومات تجارية غير معروفة عمومًا للجمهور، تُبقى سرية، وتتطلب تكلفة/جهدًا لتطويرها، ولها درجة من التفرد أو الحداثة."]],
   [["Define whistle-blowing.","عرّف الإبلاغ عن المخالفات."],["An employee attracting attention to a negligent, illegal, unethical, abusive, or dangerous act that threatens the public interest.","لفت موظف الانتباه إلى فعل مهمل أو غير قانوني أو غير أخلاقي أو مسيء أو خطير يهدد المصلحة العامة."]],
   [["What does a client provide in the IT worker-client relationship?","ماذا يقدّم العميل في علاقة أخصائي تقنية المعلومات بالعميل؟"],["Compensation, access to key contacts, and work space.","التعويض المالي، وإمكانية الوصول إلى جهات الاتصال الرئيسية، ومساحة العمل."]],
   [["Why does recommending your own product to fix a detected problem create an ethical issue?","لماذا تخلق التوصية بمنتجك الخاص لحل مشكلة مكتشفة مشكلة أخلاقية؟"],["It creates a conflict of interest.","لأنها تخلق تضارب مصالح."]],
   [["Define fraud and misrepresentation.","عرّف الاحتيال والتحريف."],["Fraud: obtaining goods/services/property through deception. Misrepresentation: a misstatement or incomplete statement of a material fact.","الاحتيال: الحصول على سلع/خدمات/ممتلكات عن طريق الخداع. التحريف: تصريح خاطئ أو غير مكتمل بحقيقة جوهرية."]]
  ],
  quiz:[

function save(){

function sd(id){ id=id||state.subject; return state.data[id]||(state.data[id]={seen:{},best:{},exam:0}); }
function mastery(s){
  if(!s.ready) return 0;
  const d=sd(s.id); let sum=0;
  s.lectures.forEach(l=>{ sum += (d.best[l.id]||0)/100; });
  sum += (d.exam||0)/100;
  return Math.round(sum/(s.lectures.length+1)*100);
}

/* ============================================================
   HELPERS  (invisible citation handling + XSS protection)
   ============================================================ */
const clean = s => String(s)
  .replace(/<\/?(antml:)?cite[^>]*>/gi,'')
  .replace(/\[cite[^\]]*\]/gi,'')
  .replace(/\[(source|ref)[^\]]*\]/gi,'')
  .replace(/[ \t]{2,}/g,' ').trim();
const esc = s => clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/(\$?\d[\d,.]*\d|\$?\d)/g,'<span class="mono">$1</span>');
const li = () => state.lang==='ar'?1:0;
const tx = a => fmt(a[li()]);
const u = k => UI[k][li()];
const $ = id => document.getElementById(id);
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function mixQ(q){ const idx=shuf(q.o.map((_,i)=>i)); return {q:q.q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)}; }
function applyTheme(){
  const t = THEMES[(state.subject&&subj().color)||'teal'];
  document.documentElement.style.setProperty('--b5',t[0]);
  document.documentElement.style.setProperty('--b6',t[1]);
}

function pool(){ const p=[]; LECT().forEach(l=>l.quiz.forEach(q=>p.push(q))); return p; }
function newExam(size){
  const qs=shuf(pool()).slice(0,size).map(mixQ);
  state.exam={qs,i:0,score:0,wrong:[],finished:false,size};
}
function renderExam(){
  const e=state.exam, total=pool().length, d=sd();
  if(!e){
    const sizes=[20,40,total];
    return `<div class="fade text-center py-8"><h1 class="text-3xl font-extrabold mb-2">🏆 ${u('exam')}</h1>
      <p class="text-dark-muted mb-1">${state.lang==='ar'?`بنك الأسئلة: ${total} سؤالًا من كل المحاضرات. تتغير الأسئلة وترتيب الخيارات في كل مرة.`:`Question bank: ${total} questions from all lectures. Questions and answer order change every time.`}</p>
      <p class="mono text-sm text-dark-muted mb-6">${u('best')}: ${d.exam?d.exam+'%':'—'}</p>
      <p class="font-semibold mb-3">${u('chooseSize')}</p>
      <div class="flex flex-wrap justify-center gap-3">${sizes.map((n,i)=>`<button data-size="${n}" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold"><span class="mono">${n}</span> ${i===2?`(${u('all')})`:u('questions')}</button>`).join('')}</div></div>`;
  }
  if(e.finished){
    const p=Math.round(e.score/e.qs.length*100);
    return `<div class="fade py-6"><div class="text-center">
      <h1 class="text-3xl font-extrabold mb-3">🏆 ${u('exam')}</h1>
      <div class="mono text-5xl font-extrabold ${p>=90?'text-green-400':p>=60?'text-amber-400':'text-red-400'} mb-2">${e.score}/${e.qs.length}</div>
      <div class="mono text-xl mb-4">${p}%</div>
      <p class="mb-6">${p>=90?(state.lang==='ar'?'ممتاز! أنت جاهز للامتحان 🎉':'Excellent! You are ready 🎉'):(state.lang==='ar'?'راجع المحاضرات وأعد المحاولة للوصول إلى 90%+':'Review the lectures and try again to reach 90%+')}</p>
      <button data-act="examAgain" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold">${u('retry')}</button></div>
      ${e.wrong.length?`<h2 class="font-bold text-lg mt-8 mb-3">❌ ${u('mistakes')} (${e.wrong.length})</h2>
      ${e.wrong.map(w=>`<div class="bg-dark-elevated border border-dark-border border-s-4 border-s-red-500 rounded-xl p-4 mb-3"><div class="font-semibold mb-1">${tx(w.q)}</div><div class="text-sm text-green-400">${u('yourAns')}: ${tx(w.c)}</div></div>`).join('')}`:''}
    </div>`;
  }
  const q=e.qs[e.i];
  return `<div class="fade"><h1 class="text-2xl font-extrabold mb-3">🏆 ${u('exam')}</h1>
    <div class="h-2 bg-dark-surface rounded-full mb-4 overflow-hidden"><div class="h-full bg-brand-500" style="width:${e.i/e.qs.length*100}%"></div></div>
    <div data-exam="1">${qHTML(q,e.i+1,e.qs.length)}</div>
    <div class="flex justify-between items-center"><span class="mono text-sm text-dark-muted">${u('score')}: ${e.score}</span>
    <button id="examNext" class="hidden px-5 py-2 rounded-lg bg-brand-600 text-white">${e.i===e.qs.length-1?u('finish'):u('next')}</button></div></div>`;
}

/* ============================================================
   SHELL: nav, layout, render
   ============================================================ */
function renderNav(){
  const item=(id,icon,label,extra='')=>`<button data-go="${id}" class="w-full flex items-center gap-3 text-start px-3 py-2.5 rounded-lg transition ${state.page===id?'bg-brand-600 text-white':'hover:bg-dark-elevated text-dark-text'}"><span>${icon}</span><span class="flex-1 text-sm">${label}</span>${extra}</button>`;
  const head=t=>`<div class="px-3 pt-3 pb-1 text-xs uppercase tracking-wider text-dark-muted">${t}</div>`;
  const s=subj(), d=sd();
  let h=`<a href="index.html" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-dark-elevated text-dark-text"><span>🗂️</span><span class="flex-1 text-sm">${u('hub')}</span></a>`;
  h += `<div class="px-3 pt-3 pb-1 text-sm font-bold text-brand-500">${s.icon} ${tx(s.name)}</div>`;
  h += item('home','🏠',u('home'));
  h += head(u('lectures')) + s.lectures.map(l=>item(l.id,`<span class="mono text-xs">${l.n}</span>`,tx(l.title),d.best[l.id]!=null?`<span class="mono text-[10px] opacity-80">${d.best[l.id]}%</span>`:'')).join('');
  h += head(u('tools')) + item('exam','🏆',u('exam'),d.exam?`<span class="mono text-[10px] opacity-80">${d.exam}%</span>`:'') + item('glossary','📖','Glossary / قاموس المصطلحات');
  $('nav').innerHTML=h;
}
function applyLayout(){
  const sb=$('sidebar'), main=$('main'), bd=$('backdrop');
  sb.classList.toggle('ltr:-translate-x-full',!state.sidebar);
  sb.classList.toggle('rtl:translate-x-full',!state.sidebar);
  main.classList.toggle('lg:ps-72',state.sidebar);
  bd.classList.toggle('hidden',!(state.sidebar && window.innerWidth<1024));
}
function updateTop(){
  const show=!!state.subject, m=show?mastery(subj()):0;
  $('topProgWrap').classList.toggle('hidden',!show); $('topProgWrap').classList.toggle('sm:flex',show);
  $('topBar').style.width=m+'%'; $('topPct').textContent=m+'%';
}
function render(){
  document.documentElement.lang=state.lang;
  document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
  $('langBtn').textContent = state.lang==='ar'?'English':'العربية';
  applyTheme();
  const lects = state.subject?LECT():[];
  const idx=lects.findIndex(l=>l.id===state.page);
  let html='', title='';
  if(state.page==='home'){ html=renderHome(); title=tx(subj().name).replace(/<[^>]+>/g,''); }
  else if(idx>=0){ html=renderLecture(lects[idx],idx); title=`${u('lecture')} ${lects[idx].n}`; }
  else if(state.page==='exam'){ html=renderExam(); title=u('exam'); }
  else if(state.page==='glossary'){ html=renderGlossary(); title='Glossary / قاموس المصطلحات'; }
  $('app').innerHTML=html; $('topTitle').textContent=title;
  updateTop(); renderNav(); applyLayout();
}
function go(p){
  state.page=p; state.qz={}; state.decks={}; if(p!=='exam') state.exam=null;
  if(window.innerWidth<1024) state.sidebar=false;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }

  const sz=e.target.closest('[data-size]'); if(sz){ newExam(+sz.dataset.size); render(); window.scrollTo({top:0}); return; }

  const opt=e.target.closest('.opt');
  if(opt){
    const box=opt.closest('.qbox'); if(box.dataset.done) return;
    box.dataset.done='1';
    const a=+box.dataset.a, i=+opt.dataset.i, ok=(i===a);
    if(ok) box.dataset.ok='1';
    box.querySelectorAll('.opt').forEach(b=>{
      b.disabled=true; b.classList.remove('hover:border-brand-500'); b.classList.add('cursor-not-allowed');
      if(+b.dataset.i===a) b.classList.add('!bg-green-600/30','!border-green-500');
    });
    if(!ok) opt.classList.add('!bg-red-600/30','!border-red-500');
    const fb=box.querySelector('.fb'); fb.classList.remove('hidden');
    fb.className='fb mt-3 text-sm font-semibold '+(ok?'text-green-400':'text-red-400');
    fb.textContent=ok?u('correct'):u('wrong');

    const exam=box.closest('[data-exam]');
    if(exam){
      const ex=state.exam, q=ex.qs[ex.i];
      if(ok) ex.score++; else ex.wrong.push({q:q.q,c:q.o[q.a]});
      $('examNext').classList.remove('hidden'); return;
    }
    const qz=box.closest('[data-quiz]');
    if(qz){
      const boxes=[...qz.querySelectorAll('.qbox')];
      if(boxes.every(b=>b.dataset.done)){
        const sc=boxes.filter(b=>b.dataset.ok).length, pct=Math.round(sc/boxes.length*100);
        const sEl=qz.querySelector('.qscore'); sEl.classList.remove('hidden');
        qz.querySelector('.qs-text').textContent=`${u('score')}: ${sc}/${boxes.length} (${pct}%)`;
        const d=sd(), id=qz.dataset.quiz;
        if(d.best[id]==null||pct>d.best[id]){ d.best[id]=pct; save(); }
        updateTop(); renderNav();
      }
    }
    return;
  }

  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act.startsWith('dk-')){
    const id=a.dataset.deck, d=state.decks[id]; if(!d) return;
    if(act==='dk-flip'){ d.flip=!d.flip; const f=document.querySelector(`#deck-${id} .flip`); if(f) f.classList.toggle('on',d.flip); return; }
    if(act==='dk-next') d.i=(d.i+1)%d.list.length;
    if(act==='dk-prev') d.i=(d.i-1+d.list.length)%d.list.length;
    if(act==='dk-shuf'){ d.list=shuf(d.list); d.i=0; }
    d.flip=false; redrawDeck(id); return;
  }
  if(act==='retryQuiz'){
    const L=LECT().find(l=>l.id===a.dataset.id); delete state.qz[L.id];
    $('quiz-'+L.id).innerHTML=quizInner(L); $('quiz-'+L.id).scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if(act==='examAgain'){ state.exam=null; render(); return; }
  if(act==='reset'){ state.data[state.subject]={seen:{},best:{},exam:0}; save(); render(); return; }
});
document.addEventListener('click',e=>{
  if(e.target.id==='examNext'){
    const ex=state.exam;
    if(ex.i<ex.qs.length-1) ex.i++;
    else { ex.finished=true; const p=Math.round(ex.score/ex.qs.length*100), d=sd(); if(p>(d.exam||0)){ d.exam=p; save(); } }
    render(); window.scrollTo({top:0});
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='gSearch'){
    const q=e.target.value.toLowerCase();
    $('gList').innerHTML=gItems(subj().glossary.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(q)));
  }
});
$('menuBtn').onclick=()=>{ state.sidebar=!state.sidebar; applyLayout(); };
$('backdrop').onclick=()=>{ state.sidebar=false; applyLayout(); };
$('langBtn').onclick=()=>{ state.lang=state.lang==='ar'?'en':'ar'; save(); render(); };
window.addEventListener('resize',applyLayout);

render();
</script>
</body>
</html>
