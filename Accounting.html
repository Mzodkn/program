   [["What is a partnership? What are the owners called?","ما هي الشراكة؟ وماذا يسمى المالكون؟"],["A group of two or more people who run and own a business together. The owners are called partners.","مجموعة من شخصين أو أكثر يديرون ويملكون النشاط معًا. ويسمى المالكون شركاء (Partners)."]],
   [["What is a corporation?","ما هي الشركة المساهمة (Corporation)؟"],["A business with a separate legal identity from its owners, so the owners have limited liability.","نشاط له كيان قانوني منفصل عن مالكيه، لذلك تكون مسؤولية المالكين محدودة."]],
   [["What is the proof of ownership in a corporation?","ما دليل الملكية في الشركة المساهمة؟"],["The stock.","الأسهم (Stock)."]],
   [["What are the owners of a corporation called?","ماذا يسمى مالكو الشركة المساهمة؟"],["Stockholders or shareholders.","المساهمون (Stockholders أو Shareholders)."]],
   [["Is there a limit on the number of owners of a corporation?","هل هناك حد لعدد مالكي الشركة المساهمة؟"],["No, there is no limit.","لا، لا يوجد حد."]],
   [["What are the three kinds of business (from the exercises)?","ما هي أنواع الأعمال الثلاثة (من التمارين)؟"],["Service, merchandising and manufacturing.","خدمي (Service)، وتجاري (Merchandising)، وصناعي (Manufacturing)."]]
  ],
  quiz:[
   {q:["A business is an organization where goods and services are exchanged:","النشاط التجاري منظمة تُتبادل فيها السلع والخدمات:"], o:[["only for money","مقابل المال فقط"],["for one another or for money","مع بعضها أو مقابل المال"],["only for other goods","مقابل سلع أخرى فقط"],["only between governments","بين الحكومات فقط"]], a:1},
   {q:["The person who sells or offers products or services to buyers is the:","الشخص الذي يبيع أو يعرض المنتجات أو الخدمات للمشترين هو:"], o:[["Seller","البائع"],["Buyer","المشتري"],["Partner","الشريك"],["Stockholder","المساهم"]], a:0},
   {q:["Which form of business is owned and run by only one person?","أي شكل من الأعمال يملكه ويديره شخص واحد فقط؟"], o:[["Partnership","الشراكة"],["Corporation","الشركة المساهمة"],["Cooperative","التعاونية"],["Sole proprietorship","المنشأة الفردية"]], a:3},
   {q:["Why is the sole proprietorship the most common form of business organization?","لماذا المنشأة الفردية هي أكثر أشكال الأعمال شيوعًا؟"], o:[["It has the most government regulations","لها أكثر اللوائح الحكومية"],["It has so few legal requirements to set up","متطلباتها القانونية قليلة جدًا"],["It always earns the highest profit","تحقق دائمًا أعلى ربح"],["It has unlimited number of owners","عدد مالكيها غير محدود"]], a:1},
   {q:["The owners of a partnership are called:","يسمى مالكو الشراكة:"], o:[["Stockholders","مساهمين"],["Sole proprietors","ملاكًا وحيدين"],["Partners","شركاء"],["Creditors","دائنين"]], a:2},
   {q:["A partnership consists of:","تتكون الشراكة من:"], o:[["One person","شخص واحد"],["Two or more people","شخصين أو أكثر"],["Only the government","الحكومة فقط"],["Only banks","البنوك فقط"]], a:1},
   {q:["Which form of business has a separate legal identity from its owners?","أي شكل من الأعمال له كيان قانوني منفصل عن مالكيه؟"], o:[["Sole proprietorship","المنشأة الفردية"],["Partnership","الشراكة"],["Corporation","الشركة المساهمة"],["All of them","جميعها"]], a:2},
   {q:["The owners' proof of ownership in a corporation is the:","دليل ملكية المالكين في الشركة المساهمة هو:"], o:[["Stock","الأسهم"],["Loan","القرض"],["Receipt","الإيصال"],["Bank account","الحساب البنكي"]], a:0},
   {q:["Owners of a corporation have:","مالكو الشركة المساهمة لهم:"], o:[["Unlimited liability","مسؤولية غير محدودة"],["No ownership at all","لا ملكية على الإطلاق"],["Limited liability","مسؤولية محدودة"],["Only one owner is allowed","يُسمح بمالك واحد فقط"]], a:2},
   {q:["In Exercise 1, which form has the 'greater access to capital' advantage?","في التمرين 1، أي شكل له ميزة 'فرصة أكبر للحصول على رأس المال'؟"], o:[["Sole proprietorship","المنشأة الفردية"],["Partnership","الشراكة"],["Corporation","الشركة المساهمة"],["None","لا شيء"]], a:2},
   {q:["Awab buys a necklace for 85,000 and sells it for 135,000 pounds. Her business is a:","اشترت عواب عقدًا بـ 85,000 وباعته بـ 135,000 جنيه. نشاطها:"], o:[["Manufacturing business","نشاط صناعي"],["Service business","نشاط خدمي"],["Merchandising business","نشاط تجاري (Merchandising)"],["Non-profit organization","منظمة غير ربحية"]], a:2},

LECTURES.push({ id:'l2', n:2,
  title:["Nature of Accounting","طبيعة المحاسبة (Nature of Accounting)"],
  obj:[
    ["Define accounting using the different definitions.","تعريف المحاسبة (Accounting) باستخدام التعريفات المختلفة."],
    ["Know who Luca Pacioli was and why he matters.","معرفة من هو لوكا باتشولي (Luca Pacioli) ولماذا هو مهم."],
    ["List and explain the five functions of accounting.","ذكر وشرح الوظائف الخمس للمحاسبة (Functions of accounting)."],
    ["Explain the role and importance of accounting in business.","شرح دور المحاسبة وأهميتها في النشاط التجاري."],
    ["Identify the six users of accounting information and what each one wants.","تحديد مستخدمي المعلومات المحاسبية الستة وما يريده كل منهم."],
    ["Know what GAAP is and who developed it (FASB).","معرفة ما هي مبادئ المحاسبة المتعارف عليها (GAAP) ومن وضعها (FASB)."]
  ],
  sec:[
   {t:["Nature of Accounting","طبيعة المحاسبة"], b:[
     {k:'def', x:["Accounting is a service activity whose function is to provide quantitative information, primarily financial in nature, about economic entities that is intended to be useful in making economic decisions.","المحاسبة نشاط خدمي وظيفته تقديم معلومات كمية (Quantitative information)، مالية في طبيعتها بالدرجة الأولى، عن الوحدات الاقتصادية (Economic entities) بهدف أن تكون مفيدة في اتخاذ القرارات الاقتصادية."]},
     {k:'tip', x:["The term \"financial in nature\" means that the necessary financial information provided is expressed in monetary terms.","عبارة \"مالية في طبيعتها\" تعني أن المعلومات المالية المقدمة تُعبَّر عنها بوحدات نقدية (Monetary terms)."]}
   ]},
   {t:["Definitions of Accounting","تعريفات المحاسبة"], b:[
     {k:'cards', c:[
       {t:["Definition 1: the recording process","التعريف 1: عملية التسجيل"], l:[["Accounting is the process of recording financial transactions pertaining to a business.","المحاسبة هي عملية تسجيل المعاملات المالية الخاصة بنشاط تجاري."],["The accounting process includes summarizing, analyzing, and reporting these transactions to oversight agencies, regulators, and tax collection entities.","تشمل العملية المحاسبية تلخيص هذه المعاملات وتحليلها والإبلاغ عنها إلى الجهات الرقابية والمنظمين وجهات تحصيل الضرائب."],["The financial statements used in accounting are a concise summary of financial transactions over an accounting period, summarizing a company's operations, financial position, and cash flows.","القوائم المالية المستخدمة في المحاسبة ملخص موجز للمعاملات المالية خلال فترة محاسبية، تلخص عمليات الشركة ومركزها المالي (Financial position) وتدفقاتها النقدية (Cash flows)."]]},
       {t:["Definition 2: systematic recording","التعريف 2: التسجيل المنتظم"], l:[["Accounting is the process of systematically recording, measuring, and communicating information about financial transactions.","المحاسبة هي عملية تسجيل وقياس وإيصال المعلومات عن المعاملات المالية بصورة منتظمة (Systematically)."],["Accounting is a practice and body of knowledge concerned primarily with methods for recording transactions, keeping financial records, performing internal audits, reporting and analyzing financial information to the management, and advising on taxation matters.","المحاسبة ممارسة ومجموعة معارف تهتم أساسًا بطرق تسجيل المعاملات، وحفظ السجلات المالية، وإجراء المراجعة الداخلية (Internal audits)، ورفع تقارير عن المعلومات المالية وتحليلها للإدارة، وتقديم المشورة في الأمور الضريبية."]]}
     ]},
     {k:'def', x:["The most complete definition is the one pronounced by the Committee on Terminology of the American Institute of Certified Public Accountants: Accounting is the art of recording, classifying, summarizing, in a significant manner and in terms of money, transactions and events which are in part at least of a financial character, and interpreting the results thereof.","أكمل تعريف هو الذي أصدرته لجنة المصطلحات في المعهد الأمريكي للمحاسبين القانونيين (AICPA): المحاسبة هي فن تسجيل وتصنيف وتلخيص المعاملات والأحداث التي لها طابع مالي، ولو جزئيًا، بطريقة ذات معنى وبوحدات نقدية، وتفسير نتائجها."]},
     {k:'tip', x:["Key words of the AICPA definition: recording, classifying, summarizing, interpreting, in terms of money.","الكلمات المفتاحية في تعريف AICPA: التسجيل، التصنيف، التلخيص، التفسير، بوحدات نقدية."]}
   ]},
   {t:["Luca Pacioli","لوكا باتشولي (Luca Pacioli)"], b:[
     {k:'ul', x:[["In 1494, the first book on double-entry accounting was published by Luca Pacioli.","في عام 1494 نشر لوكا باتشولي أول كتاب عن المحاسبة بالقيد المزدوج (Double-entry accounting)."],["Since Pacioli was a Franciscan friar, he might be referred to simply as Friar Luca.","لأن باتشولي كان راهبًا فرنسيسكانيًا، يمكن أن يُشار إليه ببساطة بالراهب لوكا (Friar Luca)."],["While Friar Luca is regarded as the \"Father of Accounting\", he did not invent the system.","ورغم أن الراهب لوكا يُعتبر \"أبا المحاسبة\" (Father of Accounting)، فإنه لم يخترع النظام."]]}
   ]},
   {t:["Functions of Accounting","وظائف المحاسبة (Functions of Accounting)"], b:[
     {k:'ul', h:["The five functions:","الوظائف الخمس:"], x:[["1. Analyzing","1. التحليل (Analyzing)"],["2. Recording","2. التسجيل (Recording)"],["3. Classifying","3. التصنيف (Classifying)"],["4. Summarizing","4. التلخيص (Summarizing)"],["5. Interpreting","5. التفسير (Interpreting)"]]},
     {k:'def', x:["Bookkeeping is the activity or occupation of keeping records of the financial affairs of a business. (It is the Recording function.)","مسك الدفاتر (Bookkeeping) هو نشاط أو مهنة حفظ سجلات الشؤون المالية للنشاط التجاري. (وهو وظيفة التسجيل.)"]},
     {k:'tip', x:["Extra explanation (the slides only list the functions): Analyzing = study each transaction to know whether it is a business transaction and what it affects. Recording = write it in the books in order. Classifying = group similar items together (such as all cash items). Summarizing = prepare reports and statements. Interpreting = explain what the results mean.","شرح إضافي (الشرائح تذكر الوظائف فقط): التحليل = دراسة كل معاملة لمعرفة هل هي معاملة تجارية وماذا تؤثر فيه. التسجيل = كتابتها في الدفاتر بالترتيب. التصنيف = تجميع البنود المتشابهة معًا (مثل كل بنود النقدية). التلخيص = إعداد التقارير والقوائم. التفسير = شرح معنى النتائج."]}
   ]},
   {t:["Role and Importance of Accounting in Business","دور المحاسبة وأهميتها في النشاط التجاري"], b:[
     {k:'ul', h:["Role of accounting in business:","دور المحاسبة في النشاط التجاري:"], x:[["1. It helps the owner/s or managers make plans and decisions.","1. تساعد المالك/الملاك أو المديرين على وضع الخطط واتخاذ القرارات."],["2. It reports and analyzes business transactions through the financial statements.","2. تُبلّغ عن المعاملات التجارية وتحللها من خلال القوائم المالية."],["3. It communicates financial information to all interested parties.","3. تنقل المعلومات المالية إلى جميع الأطراف المهتمة."]]},
     {k:'def', x:["Importance: the primary purpose of accounting is to provide the financial information needed for the efficient operation of an economic unit.","الأهمية: الغرض الأساسي من المحاسبة هو توفير المعلومات المالية اللازمة للتشغيل الكفء للوحدة الاقتصادية (Economic unit)."]}
   ]},
   {t:["Users of Accounting Information","مستخدمو المعلومات المحاسبية"], b:[
     {k:'cards', c:[
       {t:["1. Owners","1. الملاك (Owners)"], l:[["Have invested their money or goods in a business organization.","استثمروا أموالهم أو بضائعهم في المنظمة."],["They want information regarding the company's earnings, its prospects for future earnings, and its ability to pay its debts.","يريدون معلومات عن أرباح الشركة وفرص أرباحها المستقبلية وقدرتها على سداد ديونها."]]},
       {t:["2. Managers and supervisors","2. المديرون والمشرفون (Managers)"], l:[["Have to prepare financial reports, understand accounting data contained in reports and budgets, and express future plans in financial terms.","عليهم إعداد التقارير المالية وفهم البيانات المحاسبية في التقارير والموازنات (Budgets) والتعبير عن الخطط المستقبلية بلغة مالية."],["People with management jobs must know how accounting information is developed in order to evaluate performance in meeting goals.","على من يشغلون وظائف إدارية أن يعرفوا كيف تُعدّ المعلومات المحاسبية ليقيّموا الأداء في تحقيق الأهداف."]]},
       {t:["3. Creditors","3. الدائنون (Creditors)"], l:[["Lend money or extend credit to the company for the purchase of goods and services.","يقرضون المال أو يمنحون الائتمان للشركة لشراء السلع والخدمات."],["They include suppliers, banks, and other lending institutions, such as loan companies.","ويشملون الموردين والبنوك ومؤسسات الإقراض الأخرى مثل شركات القروض."],["Creditors are interested in the firm's ability to pay its debts.","يهتم الدائنون بقدرة الشركة على سداد ديونها."]]},
       {t:["4. Government agencies","4. الجهات الحكومية (Government Agencies)"], l:[["Taxing authorities verify information submitted by companies concerning a variety of taxes, such as income taxes, sales taxes, and employment taxes.","تتحقق السلطات الضريبية من المعلومات التي تقدمها الشركات عن ضرائب مختلفة مثل ضرائب الدخل وضرائب المبيعات وضرائب التوظيف."]]},
       {t:["5. Financial analysts","5. المحللون الماليون (Financial Analysts)"], l:[["Use accounting data to form opinions on which they base investment recommendations.","يستخدمون البيانات المحاسبية لتكوين آراء يبنون عليها توصيات الاستثمار."]]},
       {t:["6. Employees","6. الموظفون (Employees)"], l:[["Want to work for successful companies to further their individual careers, and they often have bonuses or options tied to enterprise performance.","يريدون العمل في شركات ناجحة لتطوير مسيرتهم المهنية، وغالبًا ما ترتبط مكافآتهم أو خياراتهم بأداء المنشأة."]]}
     ]}
   ]},
   {t:["GAAP and FASB","مبادئ GAAP ومجلس FASB"], b:[
     {k:'def', x:["Generally Accepted Accounting Principles (GAAP): rules or guidelines in the accounting process developed by the Financial Accounting Standards Board (FASB).","مبادئ المحاسبة المتعارف عليها (GAAP): قواعد أو إرشادات في العملية المحاسبية وضعها مجلس معايير المحاسبة المالية (FASB)."]},
     {k:'p', x:["Professional accountants follow a set of standards known as GAAP when preparing financial statements.","يتبع المحاسبون المهنيون مجموعة من المعايير تُعرف بـ GAAP عند إعداد القوائم المالية."]},
     {k:'tip', x:["FASB = Financial Accounting Standards Board. It developed the rules or guidelines in the accounting process.","FASB = مجلس معايير المحاسبة المالية. هو الذي وضع القواعد والإرشادات في العملية المحاسبية."]}
   ]},
   {t:["Exercise: Questions and Suggested Answers","التمرين: الأسئلة وإجابات مقترحة"], b:[
     {k:'ul', h:["Q1. List down the different functions of accounting. Explain each.","س1. اذكر وظائف المحاسبة المختلفة. اشرح كلًا منها."], x:[["Analyzing, recording (bookkeeping), classifying, summarizing and interpreting. See the Functions section for the explanation.","التحليل والتسجيل (مسك الدفاتر) والتصنيف والتلخيص والتفسير. انظر قسم الوظائف للشرح."]]},
     {k:'ul', h:["Q2. What is meant by systematic recording of business transactions?","س2. ما المقصود بالتسجيل المنتظم للمعاملات التجارية؟"], x:[["Recording every transaction in an orderly, consistent way using the same rules and the same books, so records are complete and easy to check.","تسجيل كل معاملة بطريقة منظمة ومتسقة وفق القواعد نفسها وفي الدفاتر نفسها، بحيث تكون السجلات كاملة وسهلة المراجعة."]]},
     {k:'ul', h:["Q3. What is the primary purpose of accounting?","س3. ما الغرض الأساسي من المحاسبة؟"], x:[["To provide the financial information needed for the efficient operation of an economic unit.","توفير المعلومات المالية اللازمة للتشغيل الكفء للوحدة الاقتصادية."]]},
     {k:'ul', h:["Q4. Who developed the rules or guidelines in the accounting process?","س4. من وضع القواعد أو الإرشادات في العملية المحاسبية؟"], x:[["The Financial Accounting Standards Board (FASB).","مجلس معايير المحاسبة المالية (FASB)."]]}
   ]}
  ],
  take:[
    ["Accounting is a service activity that provides quantitative, mainly financial, information to help in economic decisions.","المحاسبة نشاط خدمي يوفر معلومات كمية، مالية في الأساس، للمساعدة في اتخاذ القرارات الاقتصادية."],
    ["\"Financial in nature\" means expressed in money.","\"مالية في طبيعتها\" تعني معبَّرًا عنها بالنقود."],
    ["AICPA definition: the art of recording, classifying, summarizing and interpreting financial transactions in terms of money.","تعريف AICPA: فن تسجيل وتصنيف وتلخيص وتفسير المعاملات المالية بوحدات نقدية."],
    ["Luca Pacioli published the first book on double-entry accounting in 1494, but he did not invent the system.","نشر لوكا باتشولي أول كتاب عن القيد المزدوج عام 1494 لكنه لم يخترع النظام."],
    ["Five functions: analyzing, recording, classifying, summarizing, interpreting.","خمس وظائف: التحليل، التسجيل، التصنيف، التلخيص، التفسير."],
    ["Six users: owners, managers, creditors, government agencies, financial analysts, employees.","ستة مستخدمين: الملاك، المديرون، الدائنون، الجهات الحكومية، المحللون الماليون، الموظفون."],
    ["GAAP are the accounting rules developed by FASB.","GAAP هي القواعد المحاسبية التي وضعها FASB."]
  ],
  fc:[
   [["What is accounting (first definition)?","ما هي المحاسبة (التعريف الأول)؟"],["A service activity whose function is to provide quantitative information, primarily financial, about economic entities, to help in making economic decisions.","نشاط خدمي وظيفته تقديم معلومات كمية، مالية بالدرجة الأولى، عن الوحدات الاقتصادية للمساعدة في اتخاذ القرارات الاقتصادية."]],
   [["What does \"financial in nature\" mean?","ماذا تعني عبارة \"مالية في طبيعتها\"؟"],["The information is expressed in monetary terms.","أن المعلومات مُعبَّر عنها بوحدات نقدية."]],
   [["What do the financial statements summarize?","ماذا تلخص القوائم المالية؟"],["A company's operations, financial position, and cash flows over an accounting period.","عمليات الشركة ومركزها المالي وتدفقاتها النقدية خلال فترة محاسبية."]],
   [["Give the AICPA (most complete) definition of accounting.","اذكر تعريف AICPA (الأكمل) للمحاسبة."],["The art of recording, classifying, summarizing, in a significant manner and in terms of money, transactions and events which are at least in part of a financial character, and interpreting the results.","فن تسجيل وتصنيف وتلخيص المعاملات والأحداث ذات الطابع المالي، ولو جزئيًا، بطريقة ذات معنى وبوحدات نقدية، وتفسير نتائجها."]],
   [["Who is the \"Father of Accounting\"?","من هو \"أبو المحاسبة\"؟"],["Luca Pacioli (Friar Luca). He published the first book on double-entry accounting in 1494, but he did not invent the system.","لوكا باتشولي (الراهب لوكا). نشر أول كتاب عن القيد المزدوج عام 1494 لكنه لم يخترع النظام."]],
   [["Why is Pacioli called Friar Luca?","لماذا يُسمى باتشولي الراهب لوكا؟"],["Because he was a Franciscan friar.","لأنه كان راهبًا فرنسيسكانيًا."]],
   [["List the five functions of accounting.","اذكر الوظائف الخمس للمحاسبة."],["Analyzing, recording, classifying, summarizing, interpreting.","التحليل، التسجيل، التصنيف، التلخيص، التفسير."]],
   [["What is bookkeeping?","ما هو مسك الدفاتر (Bookkeeping)؟"],["The activity or occupation of keeping records of the financial affairs of a business.","نشاط أو مهنة حفظ سجلات الشؤون المالية للنشاط التجاري."]],
   [["Give the three roles of accounting in business.","اذكر الأدوار الثلاثة للمحاسبة في النشاط التجاري."],["1) Helps owners/managers plan and decide. 2) Reports and analyzes transactions through financial statements. 3) Communicates financial information to all interested parties.","1) تساعد الملاك/المديرين على التخطيط واتخاذ القرار. 2) تُبلّغ عن المعاملات وتحللها عبر القوائم المالية. 3) تنقل المعلومات المالية إلى جميع الأطراف المهتمة."]],
   [["What is the primary purpose of accounting?","ما الغرض الأساسي من المحاسبة؟"],["To provide the financial information needed for the efficient operation of an economic unit.","توفير المعلومات المالية اللازمة للتشغيل الكفء للوحدة الاقتصادية."]],
   [["What do owners want to know from accounting information?","ماذا يريد الملاك معرفته من المعلومات المحاسبية؟"],["The company's earnings, prospects for future earnings, and ability to pay its debts.","أرباح الشركة وفرص أرباحها المستقبلية وقدرتها على سداد ديونها."]],
   [["Who are creditors? What are they interested in?","من هم الدائنون؟ وبماذا يهتمون؟"],["Suppliers, banks and other lenders who lend money or extend credit. They are interested in the firm's ability to pay its debts.","الموردون والبنوك والمقرضون الآخرون الذين يقرضون المال أو يمنحون ائتمانًا. يهتمون بقدرة الشركة على سداد ديونها."]],
   [["Why do government agencies use accounting information?","لماذا تستخدم الجهات الحكومية المعلومات المحاسبية؟"],["Taxing authorities verify the information submitted about income, sales and employment taxes.","تتحقق السلطات الضريبية من المعلومات المقدمة عن ضرائب الدخل والمبيعات والتوظيف."]],
   [["What do financial analysts do with accounting data?","ماذا يفعل المحللون الماليون بالبيانات المحاسبية؟"],["Form opinions on which they base investment recommendations.","يكوّنون آراء يبنون عليها توصيات الاستثمار."]],
   [["What are GAAP and who developed them?","ما هي GAAP ومن وضعها؟"],["Generally Accepted Accounting Principles: rules or guidelines for the accounting process, developed by the Financial Accounting Standards Board (FASB).","مبادئ المحاسبة المتعارف عليها: قواعد وإرشادات للعملية المحاسبية، وضعها مجلس معايير المحاسبة المالية (FASB)."]]
  ],
  quiz:[
   {q:["Accounting is a service activity that mainly provides:","المحاسبة نشاط خدمي يقدم أساسًا:"], o:[["Legal advice","مشورة قانونية"],["Quantitative, mainly financial information","معلومات كمية مالية في الأساس"],["Only tax forms","نماذج ضريبية فقط"],["Only marketing plans","خطط تسويق فقط"]], a:1},
   {q:["\"Financial in nature\" means that the information is:","\"مالية في طبيعتها\" تعني أن المعلومات:"], o:[["Expressed in monetary terms","مُعبَّر عنها بوحدات نقدية"],["Secret","سرية"],["Written only by banks","يكتبها البنوك فقط"],["Only about taxes","عن الضرائب فقط"]], a:0},
   {q:["Which function of accounting is also called bookkeeping?","أي وظيفة محاسبية تسمى أيضًا مسك الدفاتر؟"], o:[["Interpreting","التفسير"],["Summarizing","التلخيص"],["Recording","التسجيل"],["Classifying","التصنيف"]], a:2},
   {q:["Who published the first book on double-entry accounting in 1494?","من نشر أول كتاب عن القيد المزدوج عام 1494؟"], o:[["John N. Myer","جون مايرز"],["Luca Pacioli","لوكا باتشولي"],["The FASB","FASB"],["Adam Smith","آدم سميث"]], a:1},
   {q:["Luca Pacioli is regarded as the Father of Accounting, but he:","يُعتبر لوكا باتشولي أبا المحاسبة، لكنه:"], o:[["Wrote no book","لم يكتب كتابًا"],["Was a banker","كان مصرفيًا"],["Did not invent the system","لم يخترع النظام"],["Lived in 1994","عاش في 1994"]], a:2},
   {q:["Which is NOT one of the five functions of accounting?","أي مما يلي ليس من الوظائف الخمس للمحاسبة؟"], o:[["Analyzing","التحليل"],["Advertising","الإعلان"],["Classifying","التصنيف"],["Interpreting","التفسير"]], a:1},
   {q:["The most complete definition of accounting was pronounced by the:","أكمل تعريف للمحاسبة أصدرته:"], o:[["Committee on Terminology of the AICPA","لجنة المصطلحات في AICPA"],["Local bank","مصرف محلي"],["Tax office","مصلحة الضرائب"],["Stock market","سوق الأسهم"]], a:0},
   {q:["Which user lends money or extends credit to the company?","أي مستخدم يقرض المال أو يمنح الائتمان للشركة؟"], o:[["Employees","الموظفون"],["Creditors","الدائنون"],["Owners","الملاك"],["Financial analysts","المحللون الماليون"]], a:1},
   {q:["Taxing authorities that verify income, sales and employment taxes belong to which user group?","السلطات الضريبية التي تتحقق من ضرائب الدخل والمبيعات والتوظيف تنتمي لأي مجموعة مستخدمين؟"], o:[["Owners","الملاك"],["Managers","المديرون"],["Employees","الموظفون"],["Government agencies","الجهات الحكومية"]], a:3},
   {q:["Which users use accounting data to form opinions for investment recommendations?","أي مستخدمين يستخدمون البيانات المحاسبية لتكوين آراء لتوصيات الاستثمار؟"], o:[["Financial analysts","المحللون الماليون"],["Creditors","الدائنون"],["Suppliers","الموردون"],["Customers","العملاء"]], a:0},
   {q:["Employees are interested in accounting information because:","يهتم الموظفون بالمعلومات المحاسبية لأن:"], o:[["They set the taxes","هم من يضعون الضرائب"],["They want to work for successful companies and may have bonuses tied to performance","يريدون العمل في شركات ناجحة وقد ترتبط مكافآتهم بالأداء"],["They lend money","هم من يقرضون المال"],["They develop GAAP","هم من يضعون GAAP"]], a:1},
   {q:["Which of these is NOT a role of accounting in business?","أي مما يلي ليس دورًا للمحاسبة في النشاط التجاري؟"], o:[["Helps owners or managers make plans and decisions","تساعد الملاك أو المديرين على التخطيط واتخاذ القرارات"],["Reports and analyzes transactions through financial statements","تبلّغ عن المعاملات وتحللها عبر القوائم المالية"],["Communicates financial information to interested parties","تنقل المعلومات المالية للأطراف المهتمة"],["Manufactures the products to be sold","تصنّع المنتجات التي تُباع"]], a:3},
   {q:["GAAP stands for:","GAAP هي اختصار:"], o:[["General Accounting and Auditing Practice","General Accounting and Auditing Practice"],["Generally Accepted Accounting Principles","Generally Accepted Accounting Principles"],["Government Approved Accounting Plans","Government Approved Accounting Plans"],["Global Annual Accounts Policy","Global Annual Accounts Policy"]], a:1},
   {q:["Which body developed the rules or guidelines used in the accounting process (GAAP)?","أي جهة وضعت القواعد المستخدمة في العملية المحاسبية (GAAP)؟"], o:[["The FASB","FASB"],["The World Bank","البنك الدولي"],["The stock exchange","البورصة"],["The creditors","الدائنون"]], a:0}

LECTURES.push({ id:'l3', n:3,
  title:["Basic Accounting Elements","العناصر المحاسبية الأساسية (Basic Accounting Elements)"],
  obj:[
    ["Define the three basic accounting elements: assets, liabilities and capital.","تعريف العناصر المحاسبية الأساسية الثلاثة: الأصول (Assets) والخصوم (Liabilities) ورأس المال (Capital)."],
    ["Differentiate creditor and debtor.","التمييز بين الدائن (Creditor) والمدين (Debtor)."],
    ["Define the additional elements: revenue, expense and drawing.","تعريف العناصر الإضافية: الإيراد (Revenue) والمصروف (Expense) والمسحوبات (Drawing)."],
    ["Differentiate tangible and intangible assets.","التمييز بين الأصول الملموسة وغير الملموسة."],
    ["Understand the accounting equation: Assets = Liabilities + Capital.","فهم المعادلة المحاسبية (Accounting equation): الأصول = الخصوم + رأس المال."]
  ],
  sec:[
   {t:["A. Basic Accounting Elements or Values: 1. Assets","أ. العناصر أو القيم المحاسبية الأساسية: 1. الأصول (Assets)"], b:[
     {k:'def', x:["Assets are the properties or the economic resources of the entity or business enterprise. They may also refer to all properties, belongings or ownership which have value.","الأصول هي ممتلكات أو موارد اقتصادية للكيان أو المنشأة. وقد تشير أيضًا إلى كل الممتلكات أو المقتنيات أو الملكيات التي لها قيمة (Value)."]},
     {k:'ul', h:["Characteristics of assets","خصائص الأصول"], x:[["Assets entail probable future economic benefits to the owner.","الأصول تنطوي على منافع اقتصادية مستقبلية محتملة للمالك."],["Assets may be tangible and intangible.","قد تكون الأصول ملموسة (Tangible) وغير ملموسة (Intangible)."],["Assets are always affected by the transactions of the business.","الأصول تتأثر دائمًا بمعاملات النشاط."],["Assets may be increased or decreased depending on what kind of transaction the business incurred.","قد تزيد الأصول أو تنقص حسب نوع المعاملة التي أجراها النشاط."]]},
     {k:'ul', h:["Examples of assets","أمثلة على الأصول"], x:[["Cash","النقدية (Cash)"],["Accounts Receivables","الذمم المدينة (Accounts Receivable)"],["Inventories","المخزون (Inventories)"],["Office Supplies","مستلزمات المكتب (Office Supplies)"],["Equipment","المعدات (Equipment)"],["Land and Buildings","الأراضي والمباني (Land and Buildings)"]]}
   ]},
   {t:["2. Liability","2. الخصوم / الالتزامات (Liability)"], b:[
     {k:'def', x:["A liability is the amount of money owed or borrowed to or from others (people or business enterprises) relating to loans, extension of credit and other obligations arising in the course of business. It may also be called Borrowings, Loans, or Debt.","الخصم (Liability) هو مبلغ المال المستحق أو المقترض لأو من الآخرين (أشخاص أو منشآت) فيما يتعلق بالقروض ومنح الائتمان والالتزامات الأخرى الناشئة في سياق النشاط. ويسمى أيضًا الاقتراض (Borrowings) أو القروض (Loans) أو الدين (Debt)."]},
     {k:'p', x:["In a transaction involving borrowings or loans, there will always be two (2) parties involved: the creditor and the debtor.","في المعاملة التي تتضمن اقتراضًا أو قروضًا، يوجد دائمًا طرفان: الدائن والمدين."]},
     {k:'cards', c:[
       {t:["Creditor","الدائن (Creditor)"], l:[["The one who gives or extends money or other things to the borrower.","من يعطي أو يقدم المال أو أشياء أخرى للمقترض."]]},
       {t:["Debtor","المدين (Debtor)"], l:[["The one who borrows money or other things from the creditor. He/she is the borrower.","من يقترض المال أو أشياء أخرى من الدائن. هو المقترض."]]}
     ]},
     {k:'ex', x:["Example of a liability: Accounts Payable.","مثال على الخصوم: الذمم الدائنة (Accounts Payable)."]}
   ]},
   {t:["3. Capital (Owner's Equity)","3. رأس المال (حقوق الملكية)"], b:[
     {k:'def', x:["Capital, also called Owner's Equity, is the owner's interest in the business. It is sometimes called net assets because it is equivalent to assets minus liabilities for a particular business.","رأس المال (Capital)، ويسمى أيضًا حقوق الملكية (Owner's Equity)، هو حق المالك في النشاط. ويسمى أحيانًا صافي الأصول (Net assets) لأنه يساوي الأصول ناقص الخصوم لنشاط معين."]},
     {k:'formula', x:"Capital = Assets - Liabilities"}
   ]},
   {t:["Additional Accounting Elements or Values","عناصر أو قيم محاسبية إضافية"], b:[
     {k:'cards', c:[
       {t:["4. Revenue","4. الإيراد (Revenue)"], l:[["All sales or income coming in to the company from clients or customers as a result of business transactions.","كل المبيعات أو الدخل الداخل إلى الشركة من العملاء نتيجة المعاملات التجارية."],["This increases assets of the company.","وهذا يزيد أصول الشركة."]]},
       {t:["5. Expense","5. المصروف (Expense)"], l:[["The cost of doing the business.","تكلفة ممارسة النشاط."],["Also refers to all payments made by the business.","ويشير أيضًا إلى كل المدفوعات التي يسددها النشاط."],["Refers to transactions that decrease assets of the company.","يشير إلى المعاملات التي تقلل أصول الشركة."]]},
       {t:["6. Drawing (Personal)","6. المسحوبات الشخصية (Drawing / Personal)"], l:[["The withdrawal made by the owner from the business.","ما يسحبه المالك من النشاط."]]}
     ]}
   ]},
   {t:["Extra: The Accounting Equation","إضافة: المعادلة المحاسبية (Accounting Equation)"], b:[
     {k:'tip', x:["Extra explanation (not in the slide text): the three basic elements are tied together by the accounting equation. Capital = Assets - Liabilities is the same equation written another way.","شرح إضافي (غير موجود في نص الشرائح): العناصر الأساسية الثلاثة مرتبطة بالمعادلة المحاسبية. المعادلة رأس المال = الأصول - الخصوم هي نفس المعادلة مكتوبة بصيغة أخرى."]},
     {k:'formula', x:"Assets = Liabilities + Capital (Owner's Equity)"},
     {k:'formula', x:"Expanded: Assets = Liabilities + Capital + Revenue - Expenses - Drawings"},
     {k:'ex', x:["The owner invests 100,000 in cash: Assets 100,000 = Liabilities 0 + Capital 100,000.\nThe business buys equipment for 30,000 on credit: Assets 130,000 = Liabilities 30,000 + Capital 100,000.\nCheck: 130,000 = 30,000 + 100,000.","يستثمر المالك 100,000 نقدًا: الأصول 100,000 = الخصوم 0 + رأس المال 100,000.\nيشتري النشاط معدات بـ 30,000 بالأجل: الأصول 130,000 = الخصوم 30,000 + رأس المال 100,000.\nالتحقق: 130,000 = 30,000 + 100,000."]}
   ]},
   {t:["Exercises and Suggested Answers","التمارين وإجابات مقترحة"], b:[
     {k:'tbl', h:[["Item","البند"],["Tangible asset","أصل ملموس (Tangible)"],["Intangible asset","أصل غير ملموس (Intangible)"]],
      r:[
       [["Meaning","المعنى"],["Has a physical form; it can be seen and touched.","له شكل مادي؛ يمكن رؤيته ولمسه."],["Has no physical form but has value.","ليس له شكل مادي لكن له قيمة."]],
       [["Examples","أمثلة"],["Cash, inventories, equipment, land, buildings","النقدية والمخزون والمعدات والأراضي والمباني"],["Goodwill, patents, trademarks, copyrights","الشهرة (Goodwill) وبراءات الاختراع والعلامات التجارية وحقوق النشر"]]
      ]},
     {k:'ul', h:["What is a long-term liability? Give 5 examples.","ما هو الخصم طويل الأجل؟ اذكر 5 أمثلة."], x:[["A long-term liability is an obligation that is due in more than one year.","الخصم طويل الأجل التزام يستحق السداد بعد أكثر من سنة."],["Examples: long-term bank loan, bonds payable, mortgage payable, long-term notes payable, long-term lease obligations.","أمثلة: قرض بنكي طويل الأجل، سندات مستحقة الدفع، رهن عقاري مستحق، أوراق دفع طويلة الأجل، التزامات إيجار طويلة الأجل."]]},
     {k:'tip', x:["The slides give the exercise questions only. The answers shown here are standard accounting answers.","الشرائح تعطي أسئلة التمارين فقط. الإجابات الظاهرة هنا إجابات محاسبية قياسية."]}
   ]},
   {t:["Extra Slides in the File: Economics Notes (Elasticity)","شرائح إضافية في الملف: ملاحظات اقتصادية (المرونة)"], b:[
     {k:'tip', x:["These slides are about economics (price elasticity of demand), not accounting. They are kept here so no content from the file is lost.","هذه الشرائح عن الاقتصاد (مرونة الطلب السعرية) وليست عن المحاسبة. تُركت هنا حتى لا يضيع أي محتوى من الملف."]},
     {k:'ul', h:["Graphs of Perfectly Elastic and Perfectly Inelastic Demand","رسوم الطلب كامل المرونة وكامل عدم المرونة"], x:[["Perfectly Elastic Demand (Graph #1): Elasticity = infinity (∞).","الطلب كامل المرونة (الرسم 1): المرونة = ما لا نهاية (∞)."],["Perfectly Inelastic Demand (Graph #2): Elasticity = 0.","الطلب عديم المرونة تمامًا (الرسم 2): المرونة = 0."]]},
     {k:'ul', h:["Why consumers may not increase their purchases at once when a price falls","لماذا قد لا يزيد المستهلكون مشترياتهم فورًا عند انخفاض السعر"], x:[["If it is thought that the price is likely to fall further, consumers will not increase their purchase at once.","إذا ساد الاعتقاد بأن السعر سينخفض أكثر، فلن يزيد المستهلكون مشترياتهم فورًا."],["Some goods are durable and consumers will not replace them until they are worn out, even if their price has fallen.","بعض السلع معمرة ولن يستبدلها المستهلكون حتى تبلى، حتى لو انخفض سعرها."]]}
   ]}
  ],
  take:[
    ["Assets are properties or economic resources that have value and bring probable future benefits.","الأصول ممتلكات أو موارد اقتصادية لها قيمة وتحقق منافع مستقبلية محتملة."],
    ["Assets can be tangible or intangible. Examples: cash, accounts receivable, inventories, office supplies, equipment, land and buildings.","الأصول قد تكون ملموسة أو غير ملموسة. أمثلة: النقدية والذمم المدينة والمخزون ومستلزمات المكتب والمعدات والأراضي والمباني."],
    ["A liability is money owed to others (loans, credit, debt). The creditor lends; the debtor borrows. Example: Accounts Payable.","الخصم هو مال مستحق للآخرين (قروض، ائتمان، دين). الدائن يقرض والمدين يقترض. مثال: الذمم الدائنة."],
    ["Capital (owner's equity) = Assets - Liabilities, so it is also called net assets.","رأس المال (حقوق الملكية) = الأصول - الخصوم، ولذلك يسمى أيضًا صافي الأصول."],
    ["Revenue increases assets; expense decreases assets; drawing is the owner's withdrawal.","الإيراد يزيد الأصول؛ والمصروف يقلل الأصول؛ والمسحوبات هي ما يسحبه المالك."],
    ["Accounting equation: Assets = Liabilities + Capital.","المعادلة المحاسبية: الأصول = الخصوم + رأس المال."]
  ],
  fc:[
   [["What are assets?","ما هي الأصول (Assets)؟"],["The properties or economic resources of the entity. All properties, belongings or ownership that have value.","ممتلكات أو موارد اقتصادية للكيان. كل الممتلكات أو المقتنيات أو الملكيات التي لها قيمة."]],
   [["What do assets entail?","ماذا تنطوي عليه الأصول؟"],["Probable future economic benefits to the owner.","منافع اقتصادية مستقبلية محتملة للمالك."]],
   [["Give six examples of assets.","اذكر ستة أمثلة على الأصول."],["Cash, accounts receivables, inventories, office supplies, equipment, land and buildings.","النقدية، الذمم المدينة، المخزون، مستلزمات المكتب، المعدات، الأراضي والمباني."]],
   [["What is a liability?","ما هو الخصم / الالتزام (Liability)؟"],["The amount of money owed or borrowed to or from others relating to loans, extension of credit and other obligations.","مبلغ المال المستحق أو المقترض لأو من الآخرين فيما يتعلق بالقروض ومنح الائتمان والالتزامات الأخرى."]],
   [["What other names does a liability have?","ما الأسماء الأخرى للخصم؟"],["Borrowings, loans, or debt.","الاقتراض (Borrowings) أو القروض (Loans) أو الدين (Debt)."]],
   [["Who is the creditor?","من هو الدائن (Creditor)؟"],["The one who gives or extends money or other things to the borrower.","من يعطي أو يقدم المال أو أشياء أخرى للمقترض."]],
   [["Who is the debtor?","من هو المدين (Debtor)؟"],["The one who borrows money or other things from the creditor. The borrower.","من يقترض المال أو أشياء أخرى من الدائن. المقترض."]],
   [["Give an example of a liability.","اذكر مثالًا على الخصوم."],["Accounts Payable.","الذمم الدائنة (Accounts Payable)."]],
   [["What is capital (owner's equity)?","ما هو رأس المال (حقوق الملكية)؟"],["The owner's interest in the business. It equals assets minus liabilities.","حق المالك في النشاط. ويساوي الأصول ناقص الخصوم."]],
   [["Why is capital sometimes called net assets?","لماذا يسمى رأس المال أحيانًا صافي الأصول؟"],["Because it is equivalent to assets minus liabilities.","لأنه يعادل الأصول ناقص الخصوم."]],
   [["What is revenue? What does it do to assets?","ما هو الإيراد؟ وماذا يفعل بالأصول؟"],["All sales or income coming in from clients or customers. It increases assets.","كل المبيعات أو الدخل الداخل من العملاء. وهو يزيد الأصول."]],
   [["What is an expense? What does it do to assets?","ما هو المصروف؟ وماذا يفعل بالأصول؟"],["The cost of doing the business, all payments made by the business. It decreases assets.","تكلفة ممارسة النشاط، وكل المدفوعات التي يسددها النشاط. وهو يقلل الأصول."]],

LECTURES.push({ id:'l4', n:4,
  title:["Chart of Accounts and Types of Accounts","دليل الحسابات وأنواع الحسابات (Chart of Accounts)"],
  obj:[
    ["Define the chart of accounts (COA) and explain its purpose.","تعريف دليل الحسابات (COA) وشرح الغرض منه."],
    ["Identify the five types of accounts: asset, liability, equity, revenue and expense.","تحديد أنواع الحسابات الخمسة: الأصول والخصوم وحقوق الملكية والإيرادات والمصروفات."],
    ["Know the categories of assets (current, fixed) and liabilities (short-term, long-term).","معرفة فئات الأصول (متداولة وثابتة) والخصوم (قصيرة الأجل وطويلة الأجل)."],
    ["Know the rules of debit and credit.","معرفة قواعد المدين والدائن (Debit and Credit)."],
    ["Know the revenue concepts: total, average, marginal revenue and break-even point.","معرفة مفاهيم الإيراد: الإيراد الكلي والمتوسط والحدي ونقطة التعادل (Break-even point)."]
  ],
  sec:[
   {t:["Chart of Accounts (COA)","دليل الحسابات (Chart of Accounts)"], b:[
     {k:'def', x:["The Chart of Accounts is a created list of the accounts used by a business entity to define each class of items for which money or the equivalent is spent or received.","دليل الحسابات قائمة مُنشأة بالحسابات التي يستخدمها كيان تجاري لتحديد كل فئة من البنود التي يُنفق أو يُستلم مقابلها مال أو ما يعادله."]},
     {k:'p', x:["It is used to organize the finances of the entity and to segregate expenditures, revenue, assets and liabilities in order to give interested parties a better understanding of the financial health of the entity.","يُستخدم لتنظيم مالية الكيان وفصل النفقات والإيرادات والأصول والخصوم لإعطاء الأطراف المهتمة فهمًا أفضل للصحة المالية للكيان."]}
   ]},
   {t:["Types of Accounts","أنواع الحسابات (Types of Accounts)"], b:[
     {k:'cards', c:[
       {t:["Asset accounts","حسابات الأصول (Asset Accounts)"], l:[["Represent the different types of economic resources owned or controlled by the business.","تمثل أنواع الموارد الاقتصادية المختلفة التي يملكها النشاط أو يسيطر عليها."],["Examples: cash, accounts receivables, inventory, machinery, equipment, land, building, prepaid rent, and goodwill.","أمثلة: النقدية، الذمم المدينة، المخزون، الآلات، المعدات، الأرض، المبنى، الإيجار المدفوع مقدمًا (Prepaid rent)، والشهرة (Goodwill)."],["Categories: Current Assets, Fixed Assets.","الفئات: الأصول المتداولة (Current Assets)، الأصول الثابتة (Fixed Assets)."]]},
       {t:["Liability accounts","حسابات الخصوم (Liability Accounts)"], l:[["Represent the different types of economic obligations of a business.","تمثل أنواع الالتزامات الاقتصادية المختلفة على النشاط."],["Examples: accounts payable, bank loan, bonds payable, accrued interest.","أمثلة: الذمم الدائنة، القرض البنكي، السندات المستحقة (Bonds payable)، الفوائد المستحقة (Accrued interest)."],["Categories: Short-term Liabilities, Long-term Liabilities.","الفئات: الخصوم قصيرة الأجل (Short-term)، الخصوم طويلة الأجل (Long-term)."]]},
       {t:["Equity accounts","حسابات حقوق الملكية (Equity Accounts)"], l:[["Represent the residual equity of a business (after deducting from assets all the liabilities), including Retained Earnings and Appropriations.","تمثل حقوق الملكية المتبقية في النشاط (بعد طرح كل الخصوم من الأصول)، وتشمل الأرباح المحتجزة (Retained Earnings) والمخصصات (Appropriations)."],["Personal Drawings (as written on the slide): loan by the owner to the business.","المسحوبات الشخصية (كما هي مكتوبة في الشريحة): قرض من المالك إلى النشاط."]]},
       {t:["Revenue accounts (income)","حسابات الإيرادات (Revenue Accounts)"], l:[["Represent the company's gross earnings.","تمثل إجمالي أرباح الشركة (إيراداتها)."],["Common examples: Sales, Service revenue, and Interest Income.","أمثلة شائعة: المبيعات (Sales)، وإيراد الخدمات (Service revenue)، وإيراد الفوائد (Interest Income)."]]},
       {t:["Expense accounts","حسابات المصروفات (Expense Accounts)"], l:[["Represent the company's expenditures to enable itself to operate.","تمثل نفقات الشركة اللازمة لتتمكن من العمل."],["Common examples: electricity and water, rentals, depreciation, doubtful accounts, interest, insurance.","أمثلة شائعة: الكهرباء والمياه، الإيجارات، الإهلاك (Depreciation)، الديون المشكوك فيها (Doubtful accounts)، الفوائد، التأمين (Insurance)."]]}
     ]},
     {k:'tip', x:["Note: in Chapter 3, drawing is defined as the withdrawal made by the owner from the business. The slide here says \"loan by the owner to the business\", which does not match. In standard accounting, drawings are the owner's withdrawals. Ask your instructor which wording to use in the exam.","ملاحظة: في الفصل 3 تُعرَّف المسحوبات (Drawing) بأنها ما يسحبه المالك من النشاط. أما الشريحة هنا فتقول \"قرض من المالك إلى النشاط\" وهذا لا يتطابق. في المحاسبة القياسية المسحوبات هي سحوبات المالك. اسأل محاضرك أي الصياغتين تعتمد في الامتحان."]}
   ]},
   {t:["Extra: Categories Explained","إضافة: شرح الفئات"], b:[

       [["Fixed assets","الأصول الثابتة"],["Long-lived assets used in operations, not for resale","أصول طويلة العمر تُستخدم في التشغيل لا لإعادة البيع"],["Machinery, equipment, land, building","الآلات، المعدات، الأرض، المبنى"]],
       [["Short-term liabilities","الخصوم قصيرة الأجل"],["Debts due within one year","ديون تستحق خلال سنة"],["Accounts payable, accrued interest","الذمم الدائنة، الفوائد المستحقة"]],
       [["Long-term liabilities","الخصوم طويلة الأجل"],["Debts due after more than one year","ديون تستحق بعد أكثر من سنة"],["Long-term bank loan, bonds payable","قرض بنكي طويل الأجل، سندات مستحقة"]]

   {t:["Rules of Debit and Credit","قواعد المدين والدائن (Rules of Debit and Credit)"], b:[

     {k:'tbl', h:[["Account type","نوع الحساب"],["Increase","الزيادة"],["Decrease","النقص"],["Normal balance","الرصيد الطبيعي"]],

     {k:'tip', x:["Memory help: Assets, Expenses and Drawings increase with a debit. Liabilities, Capital and Revenue increase with a credit. In every entry, total debits must equal total credits.","للحفظ: الأصول والمصروفات والمسحوبات تزيد بالمدين. الخصوم ورأس المال والإيرادات تزيد بالدائن. وفي كل قيد يجب أن يتساوى مجموع المدين مع مجموع الدائن."]},
     {k:'tip', x:["Optional numbering used by many charts of accounts: 1 = Assets, 2 = Liabilities, 3 = Equity, 4 = Revenue, 5 = Expenses.","ترقيم شائع في كثير من أدلة الحسابات: 1 = الأصول، 2 = الخصوم، 3 = حقوق الملكية، 4 = الإيرادات، 5 = المصروفات."]}
   ]},
   {t:["Revenue Concepts and Break-Even Point","مفاهيم الإيراد ونقطة التعادل"], b:[
     {k:'cards', c:[
       {t:["1. Marginal Revenue","1. الإيراد الحدي (Marginal Revenue)"], l:[["Is the change of total revenue.","هو التغير في الإيراد الكلي."],["As a result of sales change of production by one unit value.","نتيجة تغير المبيعات أو الإنتاج بوحدة واحدة."],["Equates the price of the commodity in competition price.","يساوي سعر السلعة في ظل سعر المنافسة."]]},
       {t:["2. Total Revenue","2. الإيراد الكلي (Total Revenue)"], l:[["Money that comes as a result of selling all sold units.","المال الناتج عن بيع كل الوحدات المباعة."],["Equal price x sold quantity.","يساوي السعر × الكمية المباعة."]]},
       {t:["3. Average Revenue","3. الإيراد المتوسط (Average Revenue)"], l:[["Rate of money that came to the seller or producer as a result of selling a specific quantity of the commodity.","معدل المال الذي حصل عليه البائع أو المنتج نتيجة بيع كمية محددة من السلعة."],["Equal Total revenue / sold quantity.","يساوي الإيراد الكلي ÷ الكمية المباعة."]]},
       {t:["4. Break-Even Point","4. نقطة التعادل (Break-Even Point)"], l:[["The point that equates total revenue with total cost.","النقطة التي يتساوى عندها الإيراد الكلي مع التكلفة الكلية."]]}
     ]},
     {k:'formula', x:"Total Revenue = Price x Quantity sold\nAverage Revenue = Total Revenue / Quantity sold\nBreak-even point: Total Revenue = Total Cost"},
     {k:'ex', x:["Price = 50, quantity sold = 200 units.\nTotal Revenue = 50 x 200 = 10,000.\nAverage Revenue = 10,000 / 200 = 50.","السعر = 50، الكمية المباعة = 200 وحدة.\nالإيراد الكلي = 50 × 200 = 10,000.\nالإيراد المتوسط = 10,000 ÷ 200 = 50."]},
     {k:'tip', x:["The example above is an extra example added for practice; it is not on the slides.","المثال أعلاه مثال إضافي للتدريب؛ وهو غير موجود في الشرائح."]}
   ]},
   {t:["Exercise: Questions and Suggested Answers","التمرين: الأسئلة وإجابات مقترحة"], b:[
     {k:'ul', h:["1. What is an Asset?","1. ما هو الأصل (Asset)؟"], x:[["The properties or economic resources of the business that have value and bring probable future economic benefits to the owner.","ممتلكات أو موارد اقتصادية للنشاط لها قيمة وتحقق منافع اقتصادية مستقبلية محتملة للمالك."]]},
     {k:'ul', h:["2. Give 5 examples of the following:","2. اذكر 5 أمثلة لكل مما يلي:"], x:[["a. Current assets: cash, accounts receivable, inventory, office supplies, prepaid rent.","a. أصول متداولة: النقدية، الذمم المدينة، المخزون، مستلزمات المكتب، الإيجار المدفوع مقدمًا."],["b. Revenue: sales, service revenue, interest income, commission income, rent income.","b. إيرادات: المبيعات، إيراد الخدمات، إيراد الفوائد، إيراد العمولات، إيراد الإيجار."],["c. Expenses: electricity and water, rentals, depreciation, interest, insurance.","c. مصروفات: الكهرباء والمياه، الإيجارات، الإهلاك، الفوائد، التأمين."]]},
     {k:'tip', x:["The slides give the exercise questions only; the answers use the account examples listed on the slides plus standard ones.","الشرائح تعطي أسئلة التمرين فقط؛ والإجابات تستخدم أمثلة الحسابات المذكورة في الشرائح بالإضافة إلى أمثلة قياسية."]}
   ]},
   {t:["Extra Slides in the File: Forecasting Notes","شرائح إضافية في الملف: ملاحظات عن التنبؤ"], b:[
     {k:'tip', x:["This slide is about forecasting (operations/economics), not accounting. It is kept so no content from the file is lost.","هذه الشريحة عن التنبؤ (Forecasting) في العمليات/الاقتصاد وليست عن المحاسبة. تُركت حتى لا يضيع أي محتوى من الملف."]},
     {k:'ul', x:[["Forecasts are always wrong.","التنبؤات خاطئة دائمًا."],["Forecasts are more accurate for groups or families of items.","التنبؤات أدق لمجموعات أو عائلات البنود."],["Forecasts are more accurate for shorter time periods.","التنبؤات أدق للفترات الزمنية الأقصر."],["Every forecast should include an error estimate.","يجب أن يتضمن كل تنبؤ تقديرًا للخطأ."],["Forecasts are no substitute for calculated demand.","التنبؤات ليست بديلًا عن الطلب المحسوب."]]}

  take:[

    ["Five types of accounts: asset, liability, equity, revenue, expense.","خمسة أنواع من الحسابات: أصول، خصوم، حقوق ملكية، إيرادات، مصروفات."],
    ["Assets: current and fixed. Liabilities: short-term and long-term.","الأصول: متداولة وثابتة. الخصوم: قصيرة الأجل وطويلة الأجل."],

   [["Name the five types of accounts.","اذكر أنواع الحسابات الخمسة."],["Asset, liability, equity, revenue and expense accounts.","حسابات الأصول والخصوم وحقوق الملكية والإيرادات والمصروفات."]],

     {k:'ul', h:["Summary","ملخص"], x:[["An indifference curve is the mixing of two different goods (x, y) that obtain equal satisfaction.","منحنى السواء (Indifference curve) هو مزيج من سلعتين مختلفتين (x, y) يحقق مستوى الإشباع نفسه."],["Marginal Rate of Substitution (MRS; written \"Marginal Revenue Substitute\" on the slide) is the quantity of a specific good that the consumer is ready to give up while increasing consumption of the other good, keeping the same level of satisfaction.","معدل الإحلال الحدي (MRS؛ كُتب في الشريحة \"Marginal Revenue Substitute\") هو الكمية من سلعة معينة التي يكون المستهلك مستعدًا للتخلي عنها مقابل زيادة استهلاك السلعة الأخرى مع بقاء مستوى الإشباع نفسه."]]},

  return Math.round(sum/(s.lectures.length+1)*100);

/* ============================================================
   HELPERS  (invisible citation handling + XSS protection)
   ============================================================ */
const clean = s => String(s)
  .replace(/<\/?(antml:)?cite[^>]*>/gi,'')
  .replace(/\[cite[^\]]*\]/gi,'')
  .replace(/\[(source|ref)[^\]]*\]/gi,'')
  .replace(/[ \t]{2,}/g,' ').trim();
const esc = s => clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/(\$?\d[\d,.]*\d|\$?\d)/g,'<span class="mono">$1</span>');
const li = () => state.lang==='ar'?1:0;
const tx = a => fmt(a[li()]);
const u = k => UI[k][li()];
const $ = id => document.getElementById(id);
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function mixQ(q){ const idx=shuf(q.o.map((_,i)=>i)); return {q:q.q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)}; }

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }

  const sz=e.target.closest('[data-size]'); if(sz){ newExam(+sz.dataset.size); render(); window.scrollTo({top:0}); return; }

  const opt=e.target.closest('.opt');
  if(opt){
    const box=opt.closest('.qbox'); if(box.dataset.done) return;
    box.dataset.done='1';
    const a=+box.dataset.a, i=+opt.dataset.i, ok=(i===a);
    if(ok) box.dataset.ok='1';
    box.querySelectorAll('.opt').forEach(b=>{
      b.disabled=true; b.classList.remove('hover:border-brand-500'); b.classList.add('cursor-not-allowed');
      if(+b.dataset.i===a) b.classList.add('!bg-green-600/30','!border-green-500');
    });
    if(!ok) opt.classList.add('!bg-red-600/30','!border-red-500');
    const fb=box.querySelector('.fb'); fb.classList.remove('hidden');
    fb.className='fb mt-3 text-sm font-semibold '+(ok?'text-green-400':'text-red-400');
    fb.textContent=ok?u('correct'):u('wrong');

    const exam=box.closest('[data-exam]');
    if(exam){
      const ex=state.exam, q=ex.qs[ex.i];
      if(ok) ex.score++; else ex.wrong.push({q:q.q,c:q.o[q.a]});
      $('examNext').classList.remove('hidden'); return;
    }
    const qz=box.closest('[data-quiz]');
    if(qz){
      const boxes=[...qz.querySelectorAll('.qbox')];
      if(boxes.every(b=>b.dataset.done)){
        const sc=boxes.filter(b=>b.dataset.ok).length, pct=Math.round(sc/boxes.length*100);
        const sEl=qz.querySelector('.qscore'); sEl.classList.remove('hidden');
        qz.querySelector('.qs-text').textContent=`${u('score')}: ${sc}/${boxes.length} (${pct}%)`;
        const d=sd(), id=qz.dataset.quiz;
        if(d.best[id]==null||pct>d.best[id]){ d.best[id]=pct; save(); }
        updateTop(); renderNav();
      }
    }
    return;
  }

  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act.startsWith('dk-')){
    const id=a.dataset.deck, d=state.decks[id]; if(!d) return;
    if(act==='dk-flip'){ d.flip=!d.flip; const f=document.querySelector(`#deck-${id} .flip`); if(f) f.classList.toggle('on',d.flip); return; }
    if(act==='dk-next') d.i=(d.i+1)%d.list.length;
    if(act==='dk-prev') d.i=(d.i-1+d.list.length)%d.list.length;
    if(act==='dk-shuf'){ d.list=shuf(d.list); d.i=0; }
    d.flip=false; redrawDeck(id); return;
  }
  if(act==='retryQuiz'){
    const L=LECT().find(l=>l.id===a.dataset.id); delete state.qz[L.id];
    $('quiz-'+L.id).innerHTML=quizInner(L); $('quiz-'+L.id).scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if(act==='examAgain'){ state.exam=null; render(); return; }
  if(act==='reset'){ state.data[state.subject]={seen:{},best:{},exam:0}; save(); render(); return; }
});
document.addEventListener('click',e=>{
  if(e.target.id==='examNext'){
    const ex=state.exam;
    if(ex.i<ex.qs.length-1) ex.i++;
    else { ex.finished=true; const p=Math.round(ex.score/ex.qs.length*100), d=sd(); if(p>(d.exam||0)){ d.exam=p; save(); } }
    render(); window.scrollTo({top:0});
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='gSearch'){
    const q=e.target.value.toLowerCase();
    $('gList').innerHTML=gItems(subj().glossary.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(q)));
  }
});
$('menuBtn').onclick=()=>{ state.sidebar=!state.sidebar; applyLayout(); };
$('backdrop').onclick=()=>{ state.sidebar=false; applyLayout(); };
$('langBtn').onclick=()=>{ state.lang=state.lang==='ar'?'en':'ar'; save(); render(); };
window.addEventListener('resize',applyLayout);

render();
</script>
</body>
</html>
