   [["Name the four forms of business ownership.","اذكر أشكال ملكية الأعمال الأربعة."],["Sole proprietorship, partnership, corporation, LLC.","منشأة فردية، شراكة، شركة مساهمة، LLC."]],
   [["What is a sole proprietorship?","ما هي المنشأة الفردية؟"],["A business owned and managed by one person. Simplest and most common. Owner keeps all profits but has unlimited liability.","شركة يملكها ويديرها شخص واحد. الأبسط والأشيع. المالك يحتفظ بكل الأرباح لكن مسؤوليته غير محدودة."]],
   [["Main disadvantages of a sole proprietorship?","أهم عيوب المنشأة الفردية؟"],["Unlimited liability, limited financial resources, limited growth, high workload.","مسؤولية غير محدودة، موارد مالية محدودة، نمو محدود، عبء عمل كبير."]],
   [["What is a partnership? Name its two types.","ما هي الشراكة؟ اذكر نوعيها."],["Owned by two or more people who share management and profits. Types: general partnership and limited partnership.","يملكها شخصان أو أكثر يتشاركون الإدارة والأرباح. النوعان: شراكة عامة وشراكة محدودة."]],
   [["General vs limited partnership?","الشراكة العامة مقابل المحدودة؟"],["General: all partners share management and liabilities. Limited: some partners invest money but do not participate in management.","العامة: كل الشركاء يتشاركون الإدارة والالتزامات. المحدودة: بعض الشركاء يستثمرون المال دون المشاركة في الإدارة."]],
   [["What is a corporation?","ما هي الشركة المساهمة؟"],["A legal entity separate from its owners. Ownership is in shares of stock. Managed by a board of directors.","كيان قانوني منفصل عن مالكيه. الملكية بأسهم. يديرها مجلس إدارة."]],
   [["Advantages of a corporation?","مزايا الشركة المساهمة؟"],["Limited liability, ability to raise capital, business continuity, large growth potential.","مسؤولية محدودة، القدرة على جمع رأس المال، استمرارية الشركة، إمكانية نمو كبيرة."]],
   [["What is an LLC? What are its owners called?","ما هي الـ LLC؟ وماذا يسمى مالكوها؟"],["A hybrid structure combining partnership and corporation features, with limited liability and flexible management. Owners are called members.","هيكل هجين يجمع ميزات الشراكة والشركة المساهمة، بمسؤولية محدودة وإدارة مرنة. يسمى المالكون أعضاء."]],
   [["Which forms have unlimited liability and which have limited?","أي الأشكال مسؤوليتها غير محدودة وأيها محدودة؟"],["Unlimited: sole proprietorship, partnership. Limited: corporation, LLC.","غير محدودة: المنشأة الفردية والشراكة. محدودة: الشركة المساهمة والـ LLC."]],
   [["List the 6 factors for choosing a structure.","اذكر العوامل الستة لاختيار الهيكل."],["Number of owners, liability protection, capital requirements, management structure, tax considerations, future growth.","عدد المالكين، حماية المسؤولية، متطلبات رأس المال، الهيكل الإداري، الاعتبارات الضريبية، النمو المستقبلي."]],

     {k:'ul', h:["Importance of a Business Plan","أهمية خطة العمل"], x:[["Guides business operations","توجه عمليات الشركة"],["Helps secure funding","تساعد في الحصول على التمويل"],["Defines business goals","تحدد أهداف الشركة"],["Reduces risks","تقلل المخاطر"]]},
     {k:'cards', c:[

     {k:'ul', x:[["1. Financial Constraints: Limited funding and resources.","1. القيود المالية: تمويل وموارد محدودة."],["2. Market Competition: Competing with existing businesses.","2. منافسة السوق: التنافس مع الشركات القائمة."],["3. Lack of Experience: New entrepreneurs may lack business knowledge.","3. نقص الخبرة: قد يفتقر رواد الأعمال الجدد إلى المعرفة التجارية."],["4. Risk of Failure: Many startups fail due to poor planning or execution.","4. خطر الفشل: كثير من الشركات الناشئة تفشل بسبب سوء التخطيط أو التنفيذ."],["5. Legal and Regulatory Issues: Businesses must comply with laws and regulations.","5. قضايا قانونية وتنظيمية: يجب على الشركات الالتزام بالقوانين واللوائح."],["6. Managing Growth: Rapid growth can create operational challenges.","6. إدارة النمو: النمو السريع قد يخلق تحديات تشغيلية."],["7. Technology Challenges: Developing reliable systems, maintaining security, handling data.","7. تحديات تقنية: تطوير أنظمة موثوقة، الحفاظ على الأمان، التعامل مع البيانات."]]}
