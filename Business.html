LECTURES.push({ id:'l2', n:2,
  title:["Forms of Business Ownership","أشكال ملكية الأعمال (Business Ownership)"],
  obj:[
    ["Understand the different forms of business ownership.","فهم أشكال ملكية الأعمال المختلفة."],
    ["Explain the characteristics of sole proprietorship, partnership, corporation, and LLC.","شرح خصائص المنشأة الفردية (Sole Proprietorship) والشراكة (Partnership) والشركة المساهمة (Corporation) والشركة ذات المسؤولية المحدودة (LLC)."],
    ["Identify the advantages and disadvantages of each business structure.","تحديد مزايا وعيوب كل هيكل أعمال."],
    ["Understand how entrepreneurs choose the appropriate form of business ownership.","فهم كيف يختار رواد الأعمال شكل الملكية المناسب."],
    ["Recognize how business ownership structures apply to technology startups.","التعرف على كيفية تطبيق هياكل الملكية على الشركات التقنية الناشئة (Startups)."]
  ],
  sec:[
   {t:["Introduction to Business Ownership","مقدمة في ملكية الأعمال"], b:[
     {k:'def', x:["A business ownership structure refers to the legal form of an organization.","هيكل ملكية الأعمال (Business ownership structure) هو الشكل القانوني للمنظمة."]},
     {k:'ul', h:["It determines:","وهو يحدد:"], x:[["who owns the business","من يملك الشركة"],["who is responsible for business decisions","من المسؤول عن قرارات الشركة"],["how profits are distributed","كيف توزع الأرباح"],["the level of legal responsibility (liability) of the owners","مستوى المسؤولية القانونية (Liability) للمالكين"]]},
     {k:'ul', h:["Choosing the correct business structure is very important because it affects:","اختيار الهيكل الصحيح مهم جدًا لأنه يؤثر في:"], x:[["taxation","الضرائب (Taxation)"],["legal responsibilities","المسؤوليات القانونية"],["ability to raise capital","القدرة على جمع رأس المال"],["management structure","الهيكل الإداري"],["business growth opportunities","فرص نمو الشركة"]]},
     {k:'ul', h:["There are four common forms of business ownership:","هناك أربعة أشكال شائعة لملكية الأعمال:"], x:[["1. Sole Proprietorship","1. المنشأة الفردية (Sole Proprietorship)"],["2. Partnership","2. الشراكة (Partnership)"],["3. Corporation","3. الشركة المساهمة (Corporation)"],["4. Limited Liability Company (LLC)","4. الشركة ذات المسؤولية المحدودة (LLC)"]]}
   ]},
   {t:["Sole Proprietorship","المنشأة الفردية (Sole Proprietorship)"], b:[
     {k:'def', x:["A sole proprietorship is a business that is owned and managed by one individual. It is the simplest and most common form of business ownership. The owner is responsible for all business decisions and receives all profits.","المنشأة الفردية هي شركة يملكها ويديرها شخص واحد. وهي أبسط وأكثر أشكال الملكية شيوعًا. المالك مسؤول عن كل القرارات ويحصل على كل الأرباح."]},
     {k:'ul', h:["Characteristics","الخصائص"], x:[["Owned by one person","يملكها شخص واحد"],["Easy to establish","سهلة التأسيس"],["Owner has full control of the business","للمالك سيطرة كاملة على الشركة"],["Owner receives all profits","المالك يحصل على كل الأرباح"],["Owner is personally responsible for all debts","المالك مسؤول شخصيًا عن جميع الديون"]]},
     {k:'ul', h:["Examples","أمثلة"], x:[["freelance web developers","مطورو الويب المستقلون (Freelance)"],["small IT consultants","مستشارو تقنية المعلومات الصغار"],["online shop owners","أصحاب المتاجر الإلكترونية"],["independent app developers","مطورو التطبيقات المستقلون"]]},
     {k:'ul', h:["Advantages","المزايا"], x:[["Easy to start: Requires minimal legal procedures.","سهلة البدء: تحتاج إجراءات قانونية قليلة."],["Full control: The owner makes all business decisions.","سيطرة كاملة: المالك يتخذ كل القرارات."],["Keep all profits: The owner does not share profits with others.","الاحتفاظ بكل الأرباح: المالك لا يشارك الأرباح مع أحد."],["Low startup cost: It usually requires less capital to start.","تكلفة بدء منخفضة: تحتاج عادة رأس مال أقل للبدء."]]},
     {k:'ul', h:["Disadvantages","العيوب"], x:[["Unlimited liability: The owner is personally responsible for business debts.","مسؤولية غير محدودة (Unlimited liability): المالك مسؤول شخصيًا عن ديون الشركة."],["Limited financial resources: It may be difficult to raise large amounts of capital.","موارد مالية محدودة: قد يصعب جمع مبالغ كبيرة من رأس المال."],["Limited business growth: The business may depend heavily on the owner's skills and time.","نمو محدود: قد تعتمد الشركة بشدة على مهارات المالك ووقته."],["High workload: The owner must manage all aspects of the business.","عبء عمل كبير: يجب على المالك إدارة كل جوانب الشركة."]]}
   ]},
   {t:["Partnership","الشراكة (Partnership)"], b:[
     {k:'def', x:["A partnership is a business owned by two or more individuals who share responsibility for managing the business and sharing profits. Partnerships are common when people want to combine their skills, resources, and expertise.","الشراكة هي شركة يملكها شخصان أو أكثر يتشاركون مسؤولية الإدارة والأرباح. الشراكات شائعة عندما يريد الناس جمع مهاراتهم ومواردهم وخبراتهم."]},
     {k:'cards', c:[
       {t:["General Partnership","شراكة عامة (General Partnership)"], l:[["All partners share management responsibilities and liabilities.","جميع الشركاء يتشاركون مسؤوليات الإدارة والالتزامات."]]},
       {t:["Limited Partnership","شراكة محدودة (Limited Partnership)"], l:[["Some partners invest money but do not participate in management.","بعض الشركاء يستثمرون المال لكن لا يشاركون في الإدارة."]]}
     ]},
     {k:'ul', h:["Characteristics","الخصائص"], x:[["Owned by two or more people","يملكها شخصان أو أكثر"],["Shared decision making","اتخاذ القرارات مشترك"],["Shared profits and losses","الأرباح والخسائر مشتركة"],["Partnership agreement often required","غالبًا يلزم اتفاق شراكة (Partnership agreement)"]]},
     {k:'ul', h:["Examples","أمثلة"], x:[["two software developers creating a startup","مطوران يؤسسان شركة ناشئة"],["IT consultants working together","مستشارو تقنية يعملون معًا"],["small technology firms","شركات تقنية صغيرة"]]},
     {k:'ul', h:["Advantages","المزايا"], x:[["More financial resources: Partners contribute capital.","موارد مالية أكثر: الشركاء يساهمون برأس المال."],["Shared responsibilities: Work and management tasks are divided.","مسؤوليات مشتركة: يتم تقسيم العمل والإدارة."],["More expertise: Partners may have different skills and knowledge.","خبرة أكثر: قد يمتلك الشركاء مهارات ومعارف مختلفة."],["Easier to start than corporations","أسهل في البدء من الشركات المساهمة"]]},
     {k:'ul', h:["Disadvantages","العيوب"], x:[["Unlimited liability: Partners may be responsible for business debts.","مسؤولية غير محدودة: قد يكون الشركاء مسؤولين عن ديون الشركة."],["Potential conflicts: Partners may disagree on decisions.","احتمال حدوث خلافات: قد يختلف الشركاء في القرارات."],["Profit sharing: Profits must be divided among partners.","تقاسم الأرباح: يجب توزيع الأرباح بين الشركاء."],["Shared risk: One partner's mistake can affect the entire business.","مخاطر مشتركة: خطأ شريك واحد قد يؤثر في الشركة كلها."]]}
   ]},
   {t:["Corporation","الشركة المساهمة (Corporation)"], b:[
     {k:'def', x:["A corporation is a legal entity that is separate from its owners. Ownership is represented by shares of stock.","الشركة المساهمة كيان قانوني (Legal entity) منفصل عن مالكيها. وتُمثل الملكية بأسهم (Shares of stock)."]},
     {k:'ul', h:["This means the corporation itself can:","وهذا يعني أن الشركة نفسها يمكنها:"], x:[["own property","امتلاك الممتلكات"],["enter contracts","إبرام العقود"],["sue or be sued","أن ترفع دعوى أو تُرفع عليها دعوى"]]},
     {k:'ul', h:["Characteristics","الخصائص"], x:[["Separate legal entity","كيان قانوني منفصل"],["Ownership divided into shares","الملكية مقسمة إلى أسهم"],["Managed by a board of directors","يديرها مجلس إدارة (Board of directors)"],["Shareholders are owners of the company","المساهمون هم مالكو الشركة"]]},
     {k:'ex', x:["Large companies often operate as corporations. Examples include major technology companies that sell products globally.","الشركات الكبيرة غالبًا ما تعمل كشركات مساهمة، مثل كبرى شركات التكنولوجيا التي تبيع منتجاتها عالميًا."]},
     {k:'ul', h:["Advantages","المزايا"], x:[["Limited liability: Shareholders are not personally responsible for company debts.","مسؤولية محدودة (Limited liability): المساهمون غير مسؤولين شخصيًا عن ديون الشركة."],["Ability to raise capital: Corporations can sell shares to investors.","القدرة على جمع رأس المال: يمكن للشركات بيع الأسهم للمستثمرين."],["Business continuity: The business continues even if owners change.","استمرارية الشركة (Business continuity): تستمر الشركة حتى لو تغير المالكون."],["Large growth potential","إمكانية نمو كبيرة"]]},
     {k:'ul', h:["Disadvantages","العيوب"], x:[["Complex and expensive to establish","معقدة ومكلفة في التأسيس"],["More government regulations","لوائح حكومية أكثر"],["Possible double taxation","احتمال الازدواج الضريبي (Double taxation)"],["Less direct control by owners","سيطرة مباشرة أقل للمالكين"]]}
   ]},
   {t:["Limited Liability Company (LLC)","الشركة ذات المسؤولية المحدودة (LLC)"], b:[
     {k:'def', x:["A Limited Liability Company (LLC) is a hybrid business structure that combines features of both partnerships and corporations. It provides limited liability protection while maintaining flexible management.","الشركة ذات المسؤولية المحدودة (LLC) هي هيكل هجين (Hybrid) يجمع بين ميزات الشراكات والشركات المساهمة. توفر حماية المسؤولية المحدودة مع إدارة مرنة."]},
     {k:'ul', h:["Characteristics","الخصائص"], x:[["Owners are called members","يسمى المالكون أعضاء (Members)"],["Members have limited liability","الأعضاء لديهم مسؤولية محدودة"],["Flexible management structure","هيكل إداري مرن"],["Combines partnership and corporate features","تجمع بين ميزات الشراكة والشركة المساهمة"]]},
     {k:'ul', h:["Examples: Many small and medium-sized businesses operate as LLCs, including:","أمثلة: كثير من الشركات الصغيرة والمتوسطة تعمل كـ LLC، ومنها:"], x:[["IT service companies","شركات خدمات تقنية المعلومات"],["software development firms","شركات تطوير البرمجيات"],["consulting businesses","شركات الاستشارات"]]},
     {k:'ul', h:["Advantages","المزايا"], x:[["Limited liability: Members are not personally responsible for business debts.","مسؤولية محدودة: الأعضاء غير مسؤولين شخصيًا عن ديون الشركة."],["Flexible management","إدارة مرنة"],["Less regulation than corporations","لوائح أقل من الشركات المساهمة"],["Tax advantages","مزايا ضريبية"]]},
     {k:'ul', h:["Disadvantages","العيوب"], x:[["More complex than sole proprietorship","أكثر تعقيدًا من المنشأة الفردية"],["May require legal documentation","قد تتطلب وثائق قانونية"],["Regulations vary by country","اللوائح تختلف من بلد لآخر"]]}
   ]},
   {t:["Comparison of Business Ownership Types","مقارنة بين أنواع ملكية الأعمال"], b:[
     {k:'tbl', h:[["Type","النوع"],["Owners","المالكون"],["Liability","المسؤولية"],["Ease of Setup","سهولة التأسيس"],["Capital","رأس المال"]],
      r:[
       [["Sole Proprietorship","منشأة فردية"],["1","1"],["Unlimited","غير محدودة"],["Very Easy","سهل جدًا"],["Limited","محدود"]],
       [["Partnership","شراكة"],["2 or more","2 أو أكثر"],["Unlimited","غير محدودة"],["Easy","سهل"],["Moderate","متوسط"]],
       [["Corporation","شركة مساهمة"],["Shareholders","مساهمون"],["Limited","محدودة"],["Complex","معقد"],["High","مرتفع"]],
       [["LLC","شركة ذات مسؤولية محدودة"],["Members","أعضاء"],["Limited","محدودة"],["Moderate","متوسط"],["Moderate","متوسط"]]
      ]},
     {k:'tip', x:["Memory trick: the two SMALL forms (sole proprietorship and partnership) have UNLIMITED liability. The two forms with 'limited' protection are the corporation and the LLC.","حيلة للحفظ: الشكلان الصغيران (المنشأة الفردية والشراكة) مسؤوليتهما غير محدودة (Unlimited). أما الشركة المساهمة والـ LLC فمسؤوليتهما محدودة (Limited)."]}
   ]},
   {t:["Choosing the Right Business Structure","اختيار هيكل الأعمال المناسب"], b:[
     {k:'ul', h:["Entrepreneurs must consider several factors when choosing a business structure. Important factors:","يجب على رواد الأعمال مراعاة عدة عوامل عند اختيار الهيكل. العوامل المهمة:"], x:[["1. Number of owners","1. عدد المالكين"],["2. Level of liability protection","2. مستوى حماية المسؤولية"],["3. Capital requirements","3. متطلبات رأس المال"],["4. Management structure","4. الهيكل الإداري"],["5. Tax considerations","5. الاعتبارات الضريبية"],["6. Future business growth","6. نمو الشركة في المستقبل"]]},
     {k:'p', x:["Choosing the correct structure can affect the long-term success of the business.","اختيار الهيكل الصحيح يمكن أن يؤثر في نجاح الشركة على المدى الطويل."]}
   ]},
   {t:["Example: Technology Startup Decision","مثال: قرار شركة تقنية ناشئة"], b:[
     {k:'p', x:["Many technology startups must decide whether to operate as a partnership or corporation.","كثير من الشركات التقنية الناشئة يجب أن تقرر هل تعمل كشراكة أم كشركة مساهمة."]},
     {k:'cards', c:[
       {t:["Partnership Example","مثال الشراكة"], l:[["How software developers create a mobile app and share profits equally.","كيف ينشئ مطورو البرمجيات تطبيق هاتف ويتقاسمون الأرباح بالتساوي."]]},
       {t:["Corporation Example","مثال الشركة المساهمة"], l:[["A technology company plans to attract investors and expand globally, so it becomes a corporation.","شركة تقنية تخطط لجذب المستثمرين والتوسع عالميًا، فتصبح شركة مساهمة."]]}
     ]},
     {k:'ul', h:["Corporations are often preferred when startups plan to:","غالبًا تُفضّل الشركات المساهمة عندما تخطط الشركات الناشئة إلى:"], x:[["raise large investments","جمع استثمارات كبيرة"],["expand internationally","التوسع دوليًا"],["grow rapidly","النمو بسرعة"]]}
   ]}
  ],
  take:[
   ["Four forms: sole proprietorship, partnership, corporation, LLC.","أربعة أشكال: منشأة فردية، شراكة، شركة مساهمة، LLC."],
   ["Unlimited liability: sole proprietorship and partnership. Limited liability: corporation and LLC.","مسؤولية غير محدودة: المنشأة الفردية والشراكة. مسؤولية محدودة: الشركة المساهمة والـ LLC."],
   ["Corporation = separate legal entity, owned through shares.","الشركة المساهمة = كيان قانوني منفصل، تُملك عبر الأسهم."],
   ["Startups that want big investment and global growth prefer corporations.","الشركات الناشئة التي تريد استثمارًا كبيرًا ونموًا عالميًا تفضل الشركة المساهمة."]
  ],
  fc:[
   [["What does a business ownership structure determine?","ماذا يحدد هيكل ملكية الأعمال؟"],["Who owns the business, who makes decisions, how profits are distributed, and the owners' liability.","من يملك الشركة، ومن يتخذ القرارات، وكيف توزع الأرباح، ومسؤولية المالكين."]],
   [["Name the four forms of business ownership.","اذكر أشكال ملكية الأعمال الأربعة."],["Sole proprietorship, partnership, corporation, LLC.","منشأة فردية، شراكة، شركة مساهمة، LLC."]],
   [["What is a sole proprietorship?","ما هي المنشأة الفردية؟"],["A business owned and managed by one person. Simplest and most common. Owner keeps all profits but has unlimited liability.","شركة يملكها ويديرها شخص واحد. الأبسط والأشيع. المالك يحتفظ بكل الأرباح لكن مسؤوليته غير محدودة."]],
   [["Main disadvantages of a sole proprietorship?","أهم عيوب المنشأة الفردية؟"],["Unlimited liability, limited financial resources, limited growth, high workload.","مسؤولية غير محدودة، موارد مالية محدودة، نمو محدود، عبء عمل كبير."]],
   [["What is a partnership? Name its two types.","ما هي الشراكة؟ اذكر نوعيها."],["Owned by two or more people who share management and profits. Types: general partnership and limited partnership.","يملكها شخصان أو أكثر يتشاركون الإدارة والأرباح. النوعان: شراكة عامة وشراكة محدودة."]],
   [["General vs limited partnership?","الشراكة العامة مقابل المحدودة؟"],["General: all partners share management and liabilities. Limited: some partners invest money but do not participate in management.","العامة: كل الشركاء يتشاركون الإدارة والالتزامات. المحدودة: بعض الشركاء يستثمرون المال دون المشاركة في الإدارة."]],
   [["What is a corporation?","ما هي الشركة المساهمة؟"],["A legal entity separate from its owners. Ownership is in shares of stock. Managed by a board of directors.","كيان قانوني منفصل عن مالكيه. الملكية بأسهم. يديرها مجلس إدارة."]],
   [["Advantages of a corporation?","مزايا الشركة المساهمة؟"],["Limited liability, ability to raise capital, business continuity, large growth potential.","مسؤولية محدودة، القدرة على جمع رأس المال، استمرارية الشركة، إمكانية نمو كبيرة."]],
   [["What is an LLC? What are its owners called?","ما هي الـ LLC؟ وماذا يسمى مالكوها؟"],["A hybrid structure combining partnership and corporation features, with limited liability and flexible management. Owners are called members.","هيكل هجين يجمع ميزات الشراكة والشركة المساهمة، بمسؤولية محدودة وإدارة مرنة. يسمى المالكون أعضاء."]],
   [["Which forms have unlimited liability and which have limited?","أي الأشكال مسؤوليتها غير محدودة وأيها محدودة؟"],["Unlimited: sole proprietorship, partnership. Limited: corporation, LLC.","غير محدودة: المنشأة الفردية والشراكة. محدودة: الشركة المساهمة والـ LLC."]],
   [["List the 6 factors for choosing a structure.","اذكر العوامل الستة لاختيار الهيكل."],["Number of owners, liability protection, capital requirements, management structure, tax considerations, future growth.","عدد المالكين، حماية المسؤولية، متطلبات رأس المال، الهيكل الإداري، الاعتبارات الضريبية، النمو المستقبلي."]],

   {t:["Ethical Decision Making","اتخاذ القرار الأخلاقي"], b:[

     {k:'ul', h:["Steps in Ethical Decision Making","خطوات اتخاذ القرار الأخلاقي"], x:[

       ["2. Gather Information: Understand all facts and stakeholders involved.","2. جمع المعلومات: فهم كل الحقائق وأصحاب المصلحة المعنيين."],
       ["3. Evaluate Alternatives: Consider different possible actions.","3. تقييم البدائل: النظر في الإجراءات الممكنة المختلفة."],

       {t:["4. Intellectual Property Rights","4. حقوق الملكية الفكرية (Intellectual Property Rights)"], l:[["Businesses must respect ownership of: software, digital content, innovations","يجب على الأعمال احترام ملكية: البرمجيات، المحتوى الرقمي، الابتكارات"],["Example: Illegal copying of software is unethical and illegal.","مثال: النسخ غير القانوني للبرمجيات غير أخلاقي وغير قانوني."]]},

     {k:'p', x:["Globalization has both positive and negative impacts.","للعولمة آثار إيجابية وسلبية."]},
     {k:'cards', c:[
       {t:["Positive Impacts","الآثار الإيجابية"], l:[["1. Market Expansion: Businesses can reach customers worldwide.","1. توسع السوق: تستطيع الشركات الوصول إلى عملاء حول العالم."],["2. Increased Innovation: Companies learn from global competition and improve their products.","2. زيادة الابتكار: تتعلم الشركات من المنافسة العالمية وتحسن منتجاتها."],["3. Cost Reduction: Businesses can outsource production to reduce costs.","3. خفض التكاليف: تستطيع الشركات الاستعانة بمصادر خارجية (Outsource) للإنتاج لتقليل التكاليف."],["4. Access to Talent: Companies can hire skilled employees from different countries.","4. الوصول إلى المواهب: تستطيع الشركات توظيف موظفين مهرة من دول مختلفة."]]},
       {t:["Negative Impacts","الآثار السلبية"], l:[["1. Increased Competition: Local businesses face global competitors.","1. زيادة المنافسة: الشركات المحلية تواجه منافسين عالميين."],["2. Cultural Challenges: Businesses must adapt to different cultures.","2. تحديات ثقافية: يجب على الشركات التكيف مع ثقافات مختلفة."],["3. Economic Risks: Global crises can affect businesses worldwide.","3. مخاطر اقتصادية: الأزمات العالمية قد تؤثر في الشركات حول العالم."],["4. Job Displacement: Outsourcing may reduce jobs in some regions.","4. فقدان الوظائف (Job displacement): الاستعانة بمصادر خارجية قد تقلل الوظائف في بعض المناطق."]]}

   [["What are the 4 drivers of globalization?","ما هي المحركات الأربعة للعولمة؟"],["Technology, transportation, trade agreements between countries, global communication systems.","التكنولوجيا، النقل، اتفاقيات التجارة بين الدول، أنظمة الاتصال العالمية."]],
   [["Exports vs imports?","الصادرات مقابل الواردات؟"],["Exports: goods and services sold to other countries. Imports: goods and services purchased from other countries.","الصادرات: سلع وخدمات تُباع لدول أخرى. الواردات: سلع وخدمات تُشترى من دول أخرى."]],

   [["Why does understanding culture matter?","لماذا يهم فهم الثقافة؟"],["It helps businesses communicate effectively, avoid misunderstandings, build strong relationships, and succeed in global markets.","يساعد على التواصل بفعالية، وتجنب سوء الفهم، وبناء علاقات قوية، والنجاح في الأسواق العالمية."]],
   [["Positive impacts of globalization?","الآثار الإيجابية للعولمة؟"],["Market expansion, increased innovation, cost reduction, access to talent.","توسع السوق، زيادة الابتكار، خفض التكاليف، الوصول إلى المواهب."]],

  fc:[

   [["Why is marketing important?","لماذا التسويق مهم؟"],["Understand customer needs, increase sales and revenue, build brand awareness, create competitive advantage, improve customer satisfaction.","فهم احتياجات العملاء، زيادة المبيعات، بناء الوعي بالعلامة، ميزة تنافسية، تحسين رضا العملاء."]],

   [["What is operations management?","ما هي إدارة العمليات؟"],["Planning, organizing and controlling the production of goods and services so operations run efficiently. It improves efficiency, reduces costs, ensures quality, meets demand.","التخطيط والتنظيم والرقابة على إنتاج السلع والخدمات لتعمل العمليات بكفاءة. تحسن الكفاءة وتقلل التكاليف وتضمن الجودة وتلبي الطلب."]],

   [["What is a supply chain? Its components?","ما هي سلسلة الإمداد؟ ومكوناتها؟"],["The network of organizations producing and delivering a product: suppliers, manufacturers, distributors, retailers. Example: hardware supplier → manufacturer → retailer → customer.","شبكة المنظمات التي تنتج المنتج وتسلمه: موردون، مصنّعون، موزعون، تجار تجزئة. مثال: مورد ← مصنّع ← تاجر تجزئة ← عميل."]],
   [["Quality control vs quality assurance?","مراقبة الجودة مقابل ضمان الجودة؟"],["Quality control: checking products. Quality assurance: preventing defects. Example: testing software before release.","مراقبة الجودة: فحص المنتجات. ضمان الجودة: منع العيوب. مثال: اختبار البرمجيات قبل الإصدار."]],

   ============================================================ */
const KEY = 'studyHubV2';
const store = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } })();
const state = { lang: store.lang||'en', subject:SUBJECT.id, page:'home', sidebar: window.innerWidth>=1024, data: store.data||{}, decks:{}, qz:{}, exam:null };
function save(){
  try{
    const cur=JSON.parse(localStorage.getItem(KEY)||'{}'); cur.data=cur.data||{};
    cur.lang=state.lang;
    const d=sd(SUBJECT.id); d.mastery=mastery(SUBJECT); d.n=SUBJECT.lectures.length;
    cur.data[SUBJECT.id]=d;
    localStorage.setItem(KEY, JSON.stringify(cur));
  }catch(e){}
}
const subj = () => SUBJECTS.find(s=>s.id===state.subject);
const LECT = () => subj().lectures;
function sd(id){ id=id||state.subject; return state.data[id]||(state.data[id]={seen:{},best:{},exam:0}); }
function mastery(s){
  if(!s.ready) return 0;
  const d=sd(s.id); let sum=0;
  s.lectures.forEach(l=>{ sum += (d.best[l.id]||0)/100; });
  sum += (d.exam||0)/100;
  return Math.round(sum/(s.lectures.length+1)*100);
}

/* ============================================================
   HELPERS  (invisible citation handling + XSS protection)
   ============================================================ */
const clean = s => String(s)
  .replace(/<\/?(antml:)?cite[^>]*>/gi,'')
  .replace(/\[cite[^\]]*\]/gi,'')
  .replace(/\[(source|ref)[^\]]*\]/gi,'')
  .replace(/[ \t]{2,}/g,' ').trim();
const esc = s => clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/(\$?\d[\d,.]*\d|\$?\d)/g,'<span class="mono">$1</span>');
const li = () => state.lang==='ar'?1:0;
const tx = a => fmt(a[li()]);
const u = k => UI[k][li()];
const $ = id => document.getElementById(id);
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function mixQ(q){ const idx=shuf(q.o.map((_,i)=>i)); return {q:q.q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)}; }
function applyTheme(){
  const t = THEMES[(state.subject&&subj().color)||'teal'];
  document.documentElement.style.setProperty('--b5',t[0]);
  document.documentElement.style.setProperty('--b6',t[1]);
}

  return '';

function deckHTML(id){
  const d=state.decks[id], c=d.list[d.i], l=li();

    </div>`;
}

}
function renderGlossary(){
  const G=subj().glossary;
  return `<div class="fade">
    <h1 class="text-3xl font-extrabold mb-1">Glossary / قاموس المصطلحات</h1>
    <p class="text-dark-muted mb-5 mono text-sm">${G.length} terms</p>
    <div class="bg-dark-elevated border border-dark-border rounded-2xl p-5 mb-6">
      <h2 class="font-bold text-lg mb-3">🃏 ${u('glossFlash')}</h2>
      ${deckBox('gl','g',shuf(G))}
    </div>
    <h2 class="font-bold text-lg mb-2">📖 ${u('glossList')}</h2>
    <input id="gSearch" placeholder="${u('search')}" class="w-full p-3 rounded-xl bg-dark-elevated border border-dark-border focus:border-brand-500 outline-none mb-4">
    <div id="gList" class="grid gap-2">${gItems(G)}</div></div>`;
}

/* ---------- FINAL EXAM ---------- */
function pool(){ const p=[]; LECT().forEach(l=>l.quiz.forEach(q=>p.push(q))); return p; }
function newExam(size){
  const qs=shuf(pool()).slice(0,size).map(mixQ);
  state.exam={qs,i:0,score:0,wrong:[],finished:false,size};
}
function renderExam(){
  const e=state.exam, total=pool().length, d=sd();
  if(!e){
    const sizes=[20,40,total];
    return `<div class="fade text-center py-8"><h1 class="text-3xl font-extrabold mb-2">🏆 ${u('exam')}</h1>
      <p class="text-dark-muted mb-1">${state.lang==='ar'?`بنك الأسئلة: ${total} سؤالًا من كل المحاضرات. تتغير الأسئلة وترتيب الخيارات في كل مرة.`:`Question bank: ${total} questions from all lectures. Questions and answer order change every time.`}</p>
      <p class="mono text-sm text-dark-muted mb-6">${u('best')}: ${d.exam?d.exam+'%':'—'}</p>
      <p class="font-semibold mb-3">${u('chooseSize')}</p>
      <div class="flex flex-wrap justify-center gap-3">${sizes.map((n,i)=>`<button data-size="${n}" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold"><span class="mono">${n}</span> ${i===2?`(${u('all')})`:u('questions')}</button>`).join('')}</div></div>`;
  }
  if(e.finished){
    const p=Math.round(e.score/e.qs.length*100);
    return `<div class="fade py-6"><div class="text-center">
      <h1 class="text-3xl font-extrabold mb-3">🏆 ${u('exam')}</h1>
      <div class="mono text-5xl font-extrabold ${p>=90?'text-green-400':p>=60?'text-amber-400':'text-red-400'} mb-2">${e.score}/${e.qs.length}</div>
      <div class="mono text-xl mb-4">${p}%</div>
      <p class="mb-6">${p>=90?(state.lang==='ar'?'ممتاز! أنت جاهز للامتحان 🎉':'Excellent! You are ready 🎉'):(state.lang==='ar'?'راجع المحاضرات وأعد المحاولة للوصول إلى 90%+':'Review the lectures and try again to reach 90%+')}</p>
      <button data-act="examAgain" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold">${u('retry')}</button></div>
      ${e.wrong.length?`<h2 class="font-bold text-lg mt-8 mb-3">❌ ${u('mistakes')} (${e.wrong.length})</h2>
      ${e.wrong.map(w=>`<div class="bg-dark-elevated border border-dark-border border-s-4 border-s-red-500 rounded-xl p-4 mb-3"><div class="font-semibold mb-1">${tx(w.q)}</div><div class="text-sm text-green-400">${u('yourAns')}: ${tx(w.c)}</div></div>`).join('')}`:''}
    </div>`;
  }
  const q=e.qs[e.i];
  return `<div class="fade"><h1 class="text-2xl font-extrabold mb-3">🏆 ${u('exam')}</h1>
    <div class="h-2 bg-dark-surface rounded-full mb-4 overflow-hidden"><div class="h-full bg-brand-500" style="width:${e.i/e.qs.length*100}%"></div></div>
    <div data-exam="1">${qHTML(q,e.i+1,e.qs.length)}</div>
    <div class="flex justify-between items-center"><span class="mono text-sm text-dark-muted">${u('score')}: ${e.score}</span>
    <button id="examNext" class="hidden px-5 py-2 rounded-lg bg-brand-600 text-white">${e.i===e.qs.length-1?u('finish'):u('next')}</button></div></div>`;
}

/* ============================================================
   SHELL: nav, layout, render
   ============================================================ */
function renderNav(){
  const item=(id,icon,label,extra='')=>`<button data-go="${id}" class="w-full flex items-center gap-3 text-start px-3 py-2.5 rounded-lg transition ${state.page===id?'bg-brand-600 text-white':'hover:bg-dark-elevated text-dark-text'}"><span>${icon}</span><span class="flex-1 text-sm">${label}</span>${extra}</button>`;
  const head=t=>`<div class="px-3 pt-3 pb-1 text-xs uppercase tracking-wider text-dark-muted">${t}</div>`;
  const s=subj(), d=sd();
  let h=`<a href="index.html" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-dark-elevated text-dark-text"><span>🗂️</span><span class="flex-1 text-sm">${u('hub')}</span></a>`;
  h += `<div class="px-3 pt-3 pb-1 text-sm font-bold text-brand-500">${s.icon} ${tx(s.name)}</div>`;
  h += item('home','🏠',u('home'));
  h += head(u('lectures')) + s.lectures.map(l=>item(l.id,`<span class="mono text-xs">${l.n}</span>`,tx(l.title),d.best[l.id]!=null?`<span class="mono text-[10px] opacity-80">${d.best[l.id]}%</span>`:'')).join('');
  h += head(u('tools')) + item('exam','🏆',u('exam'),d.exam?`<span class="mono text-[10px] opacity-80">${d.exam}%</span>`:'') + item('glossary','📖','Glossary / قاموس المصطلحات');
  $('nav').innerHTML=h;
}
function applyLayout(){
  const sb=$('sidebar'), main=$('main'), bd=$('backdrop');
  sb.classList.toggle('ltr:-translate-x-full',!state.sidebar);
  sb.classList.toggle('rtl:translate-x-full',!state.sidebar);
  main.classList.toggle('lg:ps-72',state.sidebar);
  bd.classList.toggle('hidden',!(state.sidebar && window.innerWidth<1024));
}
function updateTop(){
  const show=!!state.subject, m=show?mastery(subj()):0;
  $('topProgWrap').classList.toggle('hidden',!show); $('topProgWrap').classList.toggle('sm:flex',show);
  $('topBar').style.width=m+'%'; $('topPct').textContent=m+'%';
}
function render(){
  document.documentElement.lang=state.lang;
  document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
  $('langBtn').textContent = state.lang==='ar'?'English':'العربية';
  applyTheme();
  const lects = state.subject?LECT():[];
  const idx=lects.findIndex(l=>l.id===state.page);
  let html='', title='';
  if(state.page==='home'){ html=renderHome(); title=tx(subj().name).replace(/<[^>]+>/g,''); }
  else if(idx>=0){ html=renderLecture(lects[idx],idx); title=`${u('lecture')} ${lects[idx].n}`; }
  else if(state.page==='exam'){ html=renderExam(); title=u('exam'); }
  else if(state.page==='glossary'){ html=renderGlossary(); title='Glossary / قاموس المصطلحات'; }
  $('app').innerHTML=html; $('topTitle').textContent=title;
  updateTop(); renderNav(); applyLayout();
}
function go(p){
  state.page=p; state.qz={}; state.decks={}; if(p!=='exam') state.exam=null;
  if(window.innerWidth<1024) state.sidebar=false;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }

  const sz=e.target.closest('[data-size]'); if(sz){ newExam(+sz.dataset.size); render(); window.scrollTo({top:0}); return; }

  const opt=e.target.closest('.opt');
  if(opt){
    const box=opt.closest('.qbox'); if(box.dataset.done) return;
    box.dataset.done='1';
    const a=+box.dataset.a, i=+opt.dataset.i, ok=(i===a);
    if(ok) box.dataset.ok='1';
    box.querySelectorAll('.opt').forEach(b=>{
      b.disabled=true; b.classList.remove('hover:border-brand-500'); b.classList.add('cursor-not-allowed');
      if(+b.dataset.i===a) b.classList.add('!bg-green-600/30','!border-green-500');
    });
    if(!ok) opt.classList.add('!bg-red-600/30','!border-red-500');
    const fb=box.querySelector('.fb'); fb.classList.remove('hidden');
    fb.className='fb mt-3 text-sm font-semibold '+(ok?'text-green-400':'text-red-400');
    fb.textContent=ok?u('correct'):u('wrong');

    const exam=box.closest('[data-exam]');
    if(exam){
      const ex=state.exam, q=ex.qs[ex.i];
      if(ok) ex.score++; else ex.wrong.push({q:q.q,c:q.o[q.a]});
      $('examNext').classList.remove('hidden'); return;
    }
    const qz=box.closest('[data-quiz]');
    if(qz){
      const boxes=[...qz.querySelectorAll('.qbox')];
      if(boxes.every(b=>b.dataset.done)){
        const sc=boxes.filter(b=>b.dataset.ok).length, pct=Math.round(sc/boxes.length*100);
        const sEl=qz.querySelector('.qscore'); sEl.classList.remove('hidden');
        qz.querySelector('.qs-text').textContent=`${u('score')}: ${sc}/${boxes.length} (${pct}%)`;
        const d=sd(), id=qz.dataset.quiz;
        if(d.best[id]==null||pct>d.best[id]){ d.best[id]=pct; save(); }
        updateTop(); renderNav();
      }
    }
    return;
  }

  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act.startsWith('dk-')){
    const id=a.dataset.deck, d=state.decks[id]; if(!d) return;
    if(act==='dk-flip'){ d.flip=!d.flip; const f=document.querySelector(`#deck-${id} .flip`); if(f) f.classList.toggle('on',d.flip); return; }
    if(act==='dk-next') d.i=(d.i+1)%d.list.length;
    if(act==='dk-prev') d.i=(d.i-1+d.list.length)%d.list.length;
    if(act==='dk-shuf'){ d.list=shuf(d.list); d.i=0; }
    d.flip=false; redrawDeck(id); return;
  }
  if(act==='retryQuiz'){
    const L=LECT().find(l=>l.id===a.dataset.id); delete state.qz[L.id];
    $('quiz-'+L.id).innerHTML=quizInner(L); $('quiz-'+L.id).scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if(act==='examAgain'){ state.exam=null; render(); return; }
  if(act==='reset'){ state.data[state.subject]={seen:{},best:{},exam:0}; save(); render(); return; }
});
document.addEventListener('click',e=>{
  if(e.target.id==='examNext'){
    const ex=state.exam;
    if(ex.i<ex.qs.length-1) ex.i++;
    else { ex.finished=true; const p=Math.round(ex.score/ex.qs.length*100), d=sd(); if(p>(d.exam||0)){ d.exam=p; save(); } }
    render(); window.scrollTo({top:0});
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='gSearch'){
    const q=e.target.value.toLowerCase();
    $('gList').innerHTML=gItems(subj().glossary.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(q)));
  }
});
$('menuBtn').onclick=()=>{ state.sidebar=!state.sidebar; applyLayout(); };
$('backdrop').onclick=()=>{ state.sidebar=false; applyLayout(); };
$('langBtn').onclick=()=>{ state.lang=state.lang==='ar'?'en':'ar'; save(); render(); };
window.addEventListener('resize',applyLayout);

render();
</script>
</body>
</html>
