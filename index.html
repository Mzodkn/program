<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="it-logo.svg">
<title>It Study Hub | مركز تقنية معلومات</title>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      brand: { 500: 'rgb(var(--b5) / <alpha-value>)', 600: 'rgb(var(--b6) / <alpha-value>)' },
      dark: { base: '#060911', surface: '#0c101d', elevated: '#151c2c', border: '#30384b', text: '#f3f4f6', muted: '#94a3b8' }
    },
    fontFamily: { sans: ['Inter', 'sans-serif'], arabic: ['Cairo', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
  } }
}
</script>
<style>
  :root { 
    --b5: 249 115 22;
    --b6: 234 88 12; 
  }
  html[lang="en"] body { font-family: 'Inter', sans-serif; }
  html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  
  body {
    background-color: #060911;
    background-image: 
      linear-gradient(to right, rgba(56, 189, 248, 0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
    background-size: 36px 36px;
    animation: gridPan 50s linear infinite;
  }
  @keyframes gridPan {
    from { transform: 0 0; }
    to   { transform: 360px 360px; }
  }

  .bg-glow { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-glow span {
    position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform;
  }
  .bg-glow .orb1 { width: 420px; height: 420px; top: -12%; left: -8%; background: rgb(var(--b5) / .35); animation: drift1 24s ease-in-out infinite; }
  .bg-glow .orb2 { width: 360px; height: 360px; bottom: -14%; right: -8%; background: rgba(56,189,248,.28); animation: drift2 30s ease-in-out infinite; }
  .bg-glow .orb3 { width: 300px; height: 300px; top: 45%; left: 60%; background: rgba(168,85,247,.18); animation: drift3 36s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(110px,70px) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-90px,-60px) scale(1.1); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px,50px) scale(1.2); } }

  #netCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  main, header { position: relative; z-index: 1; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #060911; }
  ::-webkit-scrollbar-thumb { background: #30384b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgb(var(--b6)); }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* تنسيقات سلايدر الصور اللانهائي */
  .slider-wrapper {
    overflow: hidden;
    position: relative;
    width: 100%;
    direction: ltr; /* مهم جداً لكي لا يختفي السلايدر في اللغة العربية على الهاتف */
  }
  .slider-track {
    display: flex;
    width: max-content;
    gap: 14px;
    animation: scrollInfinite 25s linear infinite;
  }
  .slider-track:hover {
    animation-play-state: paused;
  }
.slider-track img {
  width: 345px;   /* تم تكبير العرض ليناسب الشاشات */
  height: 347px;  /* تم زيادة الارتفاع لتبدو الصورة واضحة وكبيرة */
  object-fit: cover; /* لضمان عدم تشويه الصورة وتعبئتها للمساحة المخصصة بالكامل */
  border-radius: 12px;
  border: 2px solid #30384b;
  flex-shrink: 0; /* لمنع انكماش الصور عند كثرة عددها */
}
  @keyframes scrollInfinite {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body class="bg-dark-base text-dark-text min-h-screen">

<!-- الصوت التلقائي عند فتح الموقع -->
<audio id="matchAudio" src="sound.mp3" autoplay loop></audio>

<canvas id="netCanvas"></canvas>
<div class="bg-glow" aria-hidden="true"><span class="orb1"></span><span class="orb2"></span><span class="orb3"></span></div>

<header class="fixed top-0 inset-x-0 z-40 h-14 bg-dark-surface/95 backdrop-blur border-b border-dark-border flex items-center justify-between px-4">
<span class="font-bold text-brand-500 inline-flex items-center gap-2 align-middle mono text-base">
  <img src="it-logo.svg" alt="IT Logo" class="w-8 h-8 inline-block object-contain"> 
  <span>IT <span class="text-brand-500">&gt;_</span></span>
</span>  
<button id="langBtn" class="px-3.5 py-1.5 rounded-lg bg-dark-elevated border border-dark-border hover:border-brand-500 text-white text-xs sm:text-sm font-semibold mono transition"></button>
</header>

<main class="pt-14"><div id="app" class="max-w-4xl mx-auto p-4 sm:p-6 pb-24"></div></main>

<script>
const SUBJECTS = [
  {id:'prg', file:'Programming.html',        type:'orange', ready:true,  icon:'⚡', header:'Programming.h',   lecCount:'10', name:["Programming","البرمجة المتقدمة"]},
  {id:'it',  file:'IT.html',                 type:'orange', ready:true,  icon:'🌐', header:'Networking.h',    lecCount:'10', name:["Introduction to IT","مقدمة في تقنية المعلومات"]},
  {id:'mth', file:'DiscreteMath.html',       type:'orange', ready:true,  icon:'🧮', header:'Math.h',          lecCount:'9',  name:["Discrete Math","الرياضيات المنفصلة"]},
  {id:'is',  file:'InformationSystems.html',  type:'orange', ready:true,  icon:'🗄️', header:'Systems.h',       lecCount:'7',  name:["Information Systems","نظم المعلومات (IS)"]},
  {id:'Etc', file:'ComputerEthics.html',     type:'sky',    ready:true,  icon:'⚖️', header:'Ethics.h',        lecCount:'8',  name:["Computer Ethics","أخلاقيات الكمبيوتر"]},
  {id:'eng', file:'TechnicalEnglish.html',   type:'sky',    ready:true,  icon:'📜', header:'English.h',       lecCount:'7',  name:["Technical English II","اللغة الإنجليزية التقنية 2"]},
  {id:'biz', file:'Business.html',           type:'sky',    ready:true,  icon:'💼', header:'Business.h',      lecCount:'8',  name:["Business Fundamentals","أساسيات الأعمال"]},
  {id:'acc', file:'Accounting.html',         type:'sky',    ready:true,  icon:'📊', header:'Financial.h',     lecCount:'6',  name:["Principles of Accounting","مبادئ المحاسبة"]},
];

const THEMES = {
  orange: {
    borderColor: '#f97316',              
    badgeBg: 'rgba(249, 115, 22, 0.12)',  
    badgeText: '#fb923c',                
    barGrad: 'from-orange-500 to-amber-400', 
    glow: 'hover:shadow-[0_0_20px_rgba(249,115,22,0.18)] hover:border-orange-500/50'
  },
  sky: {
    borderColor: '#38bdf8',              
    badgeBg: 'rgba(56, 189, 248, 0.12)',  
    badgeText: '#38bdf8',                 
    barGrad: 'from-sky-400 to-blue-500',  
    glow: 'hover:shadow-[0_0_20px_rgba(56,189,248,0.18)] hover:border-sky-400/50'
  }
};

const KEY='studyHubV2';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } }
let lang = load().lang||'en';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function render(){
  const ar=lang==='ar', data=load().data||{};
  document.documentElement.lang=lang; document.documentElement.dir=ar?'rtl':'ltr';
  document.getElementById('langBtn').textContent=ar?'English':'العربية';
  
  const cards = SUBJECTS.map(s => {
    const t = THEMES[s.type] || THEMES.orange;
    const d = data[s.id] || {}, m = s.ready ? (d.mastery || 0) : 0;
    const tag = s.ready ? 'a href="' + esc(s.file) + '"' : 'div';
    const close = s.ready ? 'a' : 'div';

    return `<${tag} class="block text-start rounded-2xl p-5 border border-dark-border bg-dark-surface/95 hover:bg-dark-elevated transition ${t.glow} ${s.ready ? 'hover:-translate-y-0.5 hover:shadow-xl' : 'opacity-70 cursor-not-allowed'}" style="border-top: 4px solid ${t.borderColor}">
      <div class="flex items-center justify-between mb-2">
        <span class="text-3xl">${s.icon}</span>
        <span class="text-xs mono px-2.5 py-1 rounded-md font-bold" style="background: ${t.badgeBg}; color: ${t.badgeText}">
          ${s.ready ? m + '%' : (ar ? 'قريبًا' : 'Coming soon')}
        </span>
      </div>
      <div class="font-bold text-lg mb-1">${esc(s.name[ar ? 1 : 0])}</div>
      <div class="text-xs mono text-brand-500/90 mb-3 font-semibold">#include &lt;${s.header}&gt;</div>
      ${s.ready ? `
        <div class="text-xs text-dark-muted mb-4">${s.lecCount}${ar ? ' محاضرات ' : ' Lectures '}</div>
        <div class="h-2 bg-dark-base rounded-full overflow-hidden">
          <div class="h-full bg-gradient-to-r ${t.barGrad} rounded-full transition-all duration-500" style="width: ${m}%"></div>
        </div>
      ` : ''}
    </${close}>`;
  }).join('');

  document.getElementById('app').innerHTML=`<div class="fade">
    
    <!-- قسم الكلاسيكو البديل للترحيب والسمستر -->
    <div class="rounded-2xl bg-dark-surface/95 backdrop-blur p-5 sm:p-6 mb-6 border-2 border-brand-500/40 shadow-2xl text-center">
      
      <!-- 1. صورة الدكتاتور امبابي في الأعلى (مصغرة) -->
      <div class="flex flex-col items-center mb-5">
        <img src="losers/Dictator_Mbappe.webp" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Kylian_Mbapp%C3%A9_2018.jpg/400px-Kylian_Mbapp%C3%A9_2018.jpg'" alt="امبابي" class="w-32 h-32 sm:w-28 sm:h-28 object-cover rounded-2xl border-2 border-brand-500 shadow-lg mb-2">
        <h2 class="text-lg sm:text-xl font-extrabold text-amber-400" style="font-family:'Cairo',sans-serif;">الدكتاتور امبابي</h2>
      </div>

      <!-- 2. النتيجة: يسار ريال مدريد ويمين برشلونة (ثابتة بالاتجاه ltr) -->
      <div dir="ltr" class="flex items-center justify-between max-w-md mx-auto bg-dark-base/90 border border-dark-border rounded-2xl p-4 mb-6 shadow-inner">
        <!-- اليسار: ريال مدريد -->
        <div class="flex flex-col items-center w-1/3">
          <img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" alt="Real Madrid" class="w-12 h-12 sm:w-14 sm:h-14 object-contain mb-1.5">
          <span class="text-xs sm:text-sm font-bold text-white" style="font-family:'Cairo',sans-serif;">ريال مدريد</span>
        </div>

        <!-- الوسط: النتيجة -->
        <div class="flex items-center gap-3 text-3xl sm:text-4xl font-extrabold mono text-brand-500">
          <span>2</span>
          <span class="text-dark-muted text-xl">-</span>
          <span>1</span>
        </div>

        <!-- اليمين: برشلونة -->
        <div class="flex flex-col items-center w-1/3">
          <img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg" alt="Barcelona" class="w-12 h-12 sm:w-14 sm:h-14 object-contain mb-1.5">
          <span class="text-xs sm:text-sm font-bold text-white" style="font-family:'Cairo',sans-serif;">برشلونة</span>
        </div>
      </div>

      <!-- 3. السلايدر التلقائي اللانهائي تحت كلمة استمتععع -->
      <div class="mb-1">
        <h3 class="text-base sm:text-lg font-extrabold text-brand-500 mb-3" style="font-family:'Cairo',sans-serif;">استمتععع</h3>
        <div class="slider-wrapper rounded-xl" dir="ltr">
          <div id="sliderTrack" class="slider-track"></div>
        </div>
      </div>

    </div>

    <!-- شبكة المواد -->
    <div class="grid gap-4 sm:grid-cols-2">${cards}</div>
  </div>`;

  // استدعاء دالة تحميل صور السلايدر بعد رسم الصفحة مباشرة
  loadLosersSlider();
}

// الدالة المسؤولة عن جلب الصور وعرضها في الهاتف والكمبيوتر
async function loadLosersSlider() {
  const track = document.getElementById('sliderTrack');
  if (!track) return;

  let images = [];

  // 1. المحاولة الأولى: قراءة ملف losers/list.json (يعمل 100% على Vercel والهاتف)
  try {
    const res = await fetch('losers/list.json');
    if (res.ok) {
      const files = await res.json();
      images = files.map(name => `losers/${encodeURIComponent(name)}`);
    }
  } catch (e) {}

  // 2. المحاولة الثانية: قراءة المجلد مباشرة في localhost
  if (images.length === 0) {
    try {
      const res = await fetch('losers/');
      if (res.ok) {
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const links = Array.from(doc.querySelectorAll('a'))
          .map(a => a.getAttribute('href'))
          .filter(href => href && /\.(jpe?g|png|webp|gif)$/i.test(href));
        images = links.map(href => href.startsWith('losers/') || href.startsWith('/') ? href : `losers/${href}`);
      }
    } catch (e) {}
  }

  // إذا وجد الصور عبر list.json أو localhost يعرضها فوراً
  if (images.length > 0) {
    const loopImages = [...images, ...images];
    track.innerHTML = loopImages.map(src => `<img src="${src}" alt="slide">`).join('');
    track.style.animationDuration = `${Math.max(10, images.length * 3)}s`;
    return;
  }

  // 3. المحاولة الثالثة الاحتياطية: إذا كانت الصور مرقمة (1.jpg, 2.jpg...)
  const found = [];
  let timer = null;
  const exts = ['jpg', 'png', 'jpeg', 'webp', 'JPG', 'PNG'];
  for (let i = 1; i <= 50; i++) {
    exts.forEach(ext => {
      const img = new Image();
      const path = `losers/${i}.${ext}`;
      img.onload = () => {
        if (!found.includes(path)) {
          found.push(path);
          clearTimeout(timer);
          timer = setTimeout(() => {
            const loop = [...found, ...found];
            track.innerHTML = loop.map(s => `<img src="${s}" alt="slide">`).join('');
            track.style.animationDuration = `${Math.max(10, found.length * 3)}s`;
          }, 100);
        }
      };
      img.src = path;
    });
  }
}

// تشغيل الصوت فور فتح الصفحة أو عند أول لمسة للشاشة في الهاتف
window.addEventListener('DOMContentLoaded', () => {
  const audio = document.getElementById('matchAudio');
  if (audio) {
    audio.play().catch(() => {
      const playOnInteraction = () => {
        audio.play();
        document.removeEventListener('click', playOnInteraction);
        document.removeEventListener('touchstart', playOnInteraction);
      };
      document.addEventListener('click', playOnInteraction);
      document.addEventListener('touchstart', playOnInteraction);
    });
  }
});

document.getElementById('langBtn').onclick=()=>{
  lang=lang==='ar'?'en':'ar';
  try{ const c=load(); c.lang=lang; localStorage.setItem(KEY,JSON.stringify(c)); }catch(e){}
  render();
};
render();

(function networkBackground(){
  const canvas = document.getElementById('netCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['249,115,22','56,189,248'];
  let w, h, particles = [], rafId = null;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function initParticles(){
    const density = reduceMotion ? 0 : Math.min(60, Math.round((w * h) / 24000));
    particles = Array.from({length: density}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
    }));
  }

  function step(){
    ctx.clearRect(0, 0, w, h);
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > w) p.vx *= -1;
      if(p.y < 0 || p.y > h) p.vy *= -1;
    }
    for(let i = 0; i < particles.length; i++){
      const a = particles[i];
      ctx.beginPath();
      ctx.arc(a.x, a.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(148,163,184,.55)';
      ctx.fill();
      for(let j = i + 1; j < particles.length; j++){
        const b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < 130){
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(${colors[(i + j) % 2]},${0.16 * (1 - dist / 130)})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
  }

  function loop(){ step(); rafId = requestAnimationFrame(loop); }
  function start(){ if(!rafId && !reduceMotion) rafId = requestAnimationFrame(loop); }
  function stop(){ if(rafId){ cancelAnimationFrame(rafId); rafId = null; } }

  window.addEventListener('resize', () => { resize(); initParticles(); });
  document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });

  resize();
  initParticles();
  if(reduceMotion){ step(); } else { start(); }
})();
</script>
</body>
