<style>
  :root { 
    --b5: 249 115 22; /* برتقالي ساطع */
    --b6: 234 88 12; 
  }
  html[lang="en"] body { font-family: 'Inter', sans-serif; }
  html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  
  body {
    background-color: #060911;
    background-image: 
      linear-gradient(to right, rgba(56, 189, 248, 0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
    background-size: 36px 36px;
    animation: gridPan 50s linear infinite;
  }
  @keyframes gridPan {
    from { transform: 0 0; }
    to   { transform: 360px 360px; }
  }

  .bg-glow { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-glow span {
    position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform;
  }
  .bg-glow .orb1 { width: 420px; height: 420px; top: -12%; left: -8%; background: rgb(var(--b5) / .35); animation: drift1 24s ease-in-out infinite; }
  .bg-glow .orb2 { width: 360px; height: 360px; bottom: -14%; right: -8%; background: rgba(56,189,248,.28); animation: drift2 30s ease-in-out infinite; }
  .bg-glow .orb3 { width: 300px; height: 300px; top: 45%; left: 60%; background: rgba(168,85,247,.18); animation: drift3 36s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(110px,70px) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-90px,-60px) scale(1.1); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px,50px) scale(1.2); } }

  #netCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  main, header { position: relative; z-index: 1; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #060911; }
  ::-webkit-scrollbar-thumb { background: #30384b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgb(var(--b6)); }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .terminal-cursor { animation: blink 0.8s infinite; }

  /* استايل السلايدر التلقائي اللانهائي لصور losers/ */
  @keyframes infiniteScroll {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-50%, 0, 0); }
  }
  .slider-container {
    overflow: hidden;
    width: 100%;
    position: relative;
  }
  .slider-track {
    display: flex;
    width: max-content;
    animation: infiniteScroll 20s linear infinite;
  }
  .slide-img {
    width: 210px;
    height: 150px;
    object-fit: cover;
    border-radius: 1rem;
    margin: 0 8px;
    flex-shrink: 0;
    border: 2px solid rgba(249, 115, 22, 0.35);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
  }
</style>

<body class="bg-dark-base text-dark-text min-h-screen">

<!-- الصوت التلقائي عند فتح الموقع -->

</header>

<main class="pt-14"><div id="app" class="max-w-4xl mx-auto p-4 sm:p-6 pb-24"></div></main>

<script>
const SUBJECTS = [
  {id:'prg', file:'Programming.html',        type:'orange', ready:true,  icon:'⚡', header:'Programming.h',   lecCount:'10', name:["Programming","البرمجة المتقدمة"]},
  {id:'it',  file:'IT.html',                 type:'orange', ready:true,  icon:'🌐', header:'Networking.h',    lecCount:'10', name:["Introduction to IT","مقدمة في تقنية المعلومات"]},
  {id:'mth', file:'DiscreteMath.html',       type:'orange', ready:true,  icon:'🧮', header:'Math.h',          lecCount:'9',  name:["Discrete Math","الرياضيات المنفصلة"]},
  {id:'is',  file:'InformationSystems.html',  type:'orange', ready:true,  icon:'🗄️', header:'Systems.h',       lecCount:'7',  name:["Information Systems","نظم المعلومات (IS)"]},
  {id:'Etc', file:'ComputerEthics.html',     type:'sky',    ready:true,  icon:'⚖️', header:'Ethics.h',        lecCount:'8',  name:["Computer Ethics","أخلاقيات الكمبيوتر"]},
  {id:'eng', file:'TechnicalEnglish.html',   type:'sky',    ready:true,  icon:'📜', header:'English.h',       lecCount:'7',  name:["Technical English II","اللغة الإنجليزية التقنية 2"]},
  {id:'biz', file:'Business.html',           type:'sky',    ready:true,  icon:'💼', header:'Business.h',      lecCount:'8',  name:["Business Fundamentals","أساسيات الأعمال"]},
  {id:'acc', file:'Accounting.html',         type:'sky',    ready:true,  icon:'📊', header:'Financial.h',     lecCount:'6',  name:["Principles of Accounting","مبادئ المحاسبة"]},
];

const THEMES = {
  orange: {
    borderColor: '#f97316',              
    badgeBg: 'rgba(249, 115, 22, 0.12)',  
    badgeText: '#fb923c',                
    barGrad: 'from-orange-500 to-amber-400', 
    glow: 'hover:shadow-[0_0_20px_rgba(249,115,22,0.18)] hover:border-orange-500/50'
  },
  sky: {
    borderColor: '#38bdf8',              
    badgeBg: 'rgba(56, 189, 248, 0.12)',  
    badgeText: '#38bdf8',                 
    barGrad: 'from-sky-400 to-blue-500',  
    glow: 'hover:shadow-[0_0_20px_rgba(56,189,248,0.18)] hover:border-sky-400/50'
  }
};
const KEY='studyHubV2';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } }
let lang = load().lang||'en';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ============================================================================
// إدارة جلب وعرض كل الصور من مجلد losers/ تلقائياً
// ============================================================================
const FOLDER_PATH = 'losers/';
const MAX_IMAGES = 100;
let cachedLosersImages = null;

async function scanDirectory(folderPath) {
  try {
    const response = await fetch(folderPath);
    if (!response.ok) return [];
    const htmlText = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlText, 'text/html');
    const links = Array.from(doc.querySelectorAll('a'));
    const imageRegex = /\.(jpe?g|png|webp|gif)$/i;
    const images = [];

    for (const link of links) {
      const href = link.getAttribute('href');
      if (href && imageRegex.test(href)) {
        const fileName = decodeURIComponent(href.split('/').pop());
        images.push(`${folderPath}${fileName}`);
      }
    }
    return images;
  } catch (err) {
    return [];
  }
}

function checkImageExists(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(url);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function loadSequentialImages(folderPath, maxCount) {
  const extensions = ['jpg', 'png', 'webp', 'jpeg', 'gif'];
  const tasks = [];

  for (let i = 1; i <= maxCount; i++) {
    tasks.push((async (index) => {
      for (const ext of extensions) {
        const found = await checkImageExists(`${folderPath}${index}.${ext}`);
        if (found) return found;
      }
      return null;
    })(i));
  }

  const results = await Promise.all(tasks);
  return results.filter(Boolean);
}

function renderInfiniteSlider(imageList) {
  const sliderTrack = document.getElementById('slider-track');
  if (!sliderTrack) return;
  sliderTrack.innerHTML = '';

  const finalImages = imageList.length > 0
    ? imageList
    : Array.from({ length: 8 }, (_, i) => `https://placehold.co/210x150/151c2c/f97316?text=losers/${i + 1}.jpg`);

  const durationSeconds = Math.max(finalImages.length * 3, 12);
  sliderTrack.style.animationDuration = `${durationSeconds}s`;

  const doubledList = [...finalImages, ...finalImages];
  doubledList.forEach((src) => {
    const img = document.createElement('img');
    img.src = src;
    img.className = 'slide-img';
    img.alt = '';
    img.loading = 'eager';
    sliderTrack.appendChild(img);
  });
}

async function initSlider() {
  if (cachedLosersImages !== null) {
    renderInfiniteSlider(cachedLosersImages);
    return;
  }
  let images = await scanDirectory(FOLDER_PATH);
  if (images.length === 0) {
    images = await loadSequentialImages(FOLDER_PATH, MAX_IMAGES);
  }
  cachedLosersImages = images;
  renderInfiniteSlider(images);
}

function initAudioAutoplay() {
  const audio = document.getElementById('bg-sound');
  if (!audio) return;

  audio.play().catch(() => {
    const unlockAudio = () => {
      audio.play().catch(() => {});
      document.removeEventListener('click', unlockAudio);
      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('keydown', unlockAudio);
    };
    document.addEventListener('click', unlockAudio, { once: true });
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('keydown', unlockAudio, { once: true });
  });
}

function render(){
  const ar=lang==='ar', data=load().data||{};
  document.documentElement.lang=lang; document.documentElement.dir=ar?'rtl':'ltr';
  document.getElementById('langBtn').textContent=ar?'English':'العربية';
  const cards = SUBJECTS.map(s => {
    const t = THEMES[s.type] || THEMES.orange;
    const d = data[s.id] || {}, m = s.ready ? (d.mastery || 0) : 0;
    const tag = s.ready ? 'a href="' + esc(s.file) + '"' : 'div';
    const close = s.ready ? 'a' : 'div';

    return `<${tag} class="block text-start rounded-2xl p-5 border border-dark-border bg-dark-surface/95 hover:bg-dark-elevated transition ${t.glow} ${s.ready ? 'hover:-translate-y-0.5 hover:shadow-xl' : 'opacity-70 cursor-not-allowed'}" style="border-top: 4px solid ${t.borderColor}">
      
      <div class="flex items-center justify-between mb-2">
        <span class="text-3xl">${s.icon}</span>
        <span class="text-xs mono px-2.5 py-1 rounded-md font-bold" style="background: ${t.badgeBg}; color: ${t.badgeText}">

      ${s.ready ? `

          <div class="h-full bg-gradient-to-r ${t.barGrad} rounded-full transition-all duration-500" style="width: ${m}%"></div>

  /* ==========================================================================
     الكود الأصلي (صندوق الترحيب + خانة اختيار السمستر) محفوظ هنا للرجوع إليه لاحقاً:
     ==========================================================================
    <!-- صندوق الترحيب البرمجي الشامل -->

      <div class="absolute top-3 left-4 flex items-center gap-1.5 opacity-70 ">
        <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
        <span class="text-[11px] mono text-dark-muted ms-2">it_hub_main.cpp</span>
      </div>
      <div class="absolute -right-10 -top-10 w-48 h-48 bg-brand-500/15 rounded-full blur-3xl pointer-events-none"></div>
      <div class="flex flex-col sm:flex-row items-center gap-6 text-center sm:text-start relative z-10 mt-3 sm:mt-0">
        <div class="relative shrink-0 p-3.5 bg-dark-base/95 rounded-2xl border border-brand-500/30 shadow-inner">
          <img src="it-logo.svg" alt="IT Logo" style="width: 130px; height: 130px;" class="object-contain drop-shadow-[0_0_20px_rgba(249,115,22,0.4)]">
        </div>
        <div class="w-full">
          <div class="text-xs sm:text-sm mono text-brand-500 mb-1 font-bold">&gt; g++ -o IT_TOP.cpp && ./run </div>
          <h1 class="text-2xl sm:text-4xl font-extrabold mb-2 tracking-wide flex items-center justify-center sm:justify-start gap-2">
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-amber-400 font-mono">
              ${ar ? 'مركز تقنية معلومات' : 'IT Study Hub'}
            </span>
          </h1>
          <p class="text-dark-muted text-xs sm:text-sm mono min-h-[24px]">
            <span id="typed-text"></span><span class="text-brand-500 terminal-cursor">_</span>
          </p>
        </div>
      </div>
    </div>

    <!-- خانة اختيار السمستر (Dropdown / Select) -->
    <div class="flex items-center gap-3 rounded-2xl p-4 mb-6 border border-brand-500/40 bg-dark-surface/95 shadow-lg">
      <span class="text-2xl">🎓</span>
      <div class="flex-1">
        <label for="semesterSelect" class="block text-xs mono text-brand-500 font-bold mb-1">
          ${ar ? '// تغير السمستر ' : '//  Jump to Your Semester  <  كلها سمسترين العندي >'}
        </label>
        <p class="text-dark-muted text-xs sm:text-sm mono min-h-[24px] m-3">
          <span id="typed-semester"></span><span class="text-brand-500 terminal-cursor">_</span>
        </p>
        <select id="semesterSelect" onchange="if(this.value) window.location.href=this.value;" class="w-full bg-dark-base border border-dark-border focus:border-brand-500 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white outline-none transition cursor-pointer">
          <option value="" disabled >${ar ? '— اختر السمستر الدراسي —' : '— Select Semester —'}</option>
          <option value="s1/index.html">${ar ? 'السمستر الأول ' : 'Semester 1'}</option>
          <option value="index.html" selected >${ar ? 'السمستر الثاني ' : 'Semester 2'}</option>
        </select>
      </div>
    </div>
  ========================================================================== */

  document.getElementById('app').innerHTML=`<div class="fade">
    
    <!-- قسم الكلاسيكو المؤقت (بديل الترحيب والسمستر) -->
    <div class="rounded-2xl bg-dark-surface/95 backdrop-blur p-5 sm:p-7 mb-6 border-2 border-brand-500/40 shadow-2xl space-y-6 text-center relative overflow-hidden" style="font-family: 'Cairo', sans-serif;">
      
      <!-- 1. صورة امبابي في الأعلى -->
      <div class="flex flex-col items-center">
        <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-full overflow-hidden border-2 border-amber-400 shadow-[0_0_25px_rgba(249,115,22,0.35)]">
          <img src="losers/Dictator_Mbappe.webp" 
               onerror="this.onerror=null; this.src='https://placehold.co/300x300/151c2c/fbbf24?text=Mbappe';"
               alt="الدكتاتور امبابي" 
               class="w-full h-full object-cover">
        </div>
        <h1 class="mt-3 text-2xl sm:text-3xl font-black text-amber-400">
          الدكتاتور امبابي
        </h1>
      </div>

      <!-- 2. النتيجة (اليسار: ريال مدريد | اليمين: برشلونة) -->
      <div dir="ltr" class="w-full max-w-xl mx-auto bg-dark-base/90 border border-dark-border rounded-2xl p-4 sm:p-6 shadow-xl flex items-center justify-between gap-3">
        
        <!-- اليسار: ريال مدريد -->
        <div class="flex flex-col items-center text-center flex-1">
          <img src="https://ssl.gstatic.com/onebox/media/sports/logos/optimized/Th4fAVAZeCJWRcKoLW7koA_500x500.png" 
               alt="ريال مدريد" 
               class="w-14 h-14 sm:w-20 sm:h-20 object-contain mb-2">
          <span class="text-sm sm:text-lg font-black text-white">ريال مدريد</span>

        <!-- المنتصف: النتيجة -->

        </div>

        <div dir="ltr" class="slider-container py-2">

    </div>

    <!-- شبكة المواد -->
    <div class="grid gap-4 sm:grid-cols-2">${cards}</div>
  </div>`;

  initSlider();
}

document.getElementById('langBtn').onclick=()=>{
  lang=lang==='ar'?'en':'ar';
  try{ const c=load(); c.lang=lang; localStorage.setItem(KEY,JSON.stringify(c)); }catch(e){}
  render();
};

render();
initAudioAutoplay();

(function networkBackground(){
  const canvas = document.getElementById('netCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['249,115,22','56,189,248'];
  let w, h, particles = [], rafId = null;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function initParticles(){
    const density = reduceMotion ? 0 : Math.min(60, Math.round((w * h) / 24000));
    particles = Array.from({length: density}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
    }));
  }

  function step(){
    ctx.clearRect(0, 0, w, h);
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > w) p.vx *= -1;
      if(p.y < 0 || p.y > h) p.vy *= -1;
    }
    for(let i = 0; i < particles.length; i++){
      const a = particles[i];
      ctx.beginPath();
      ctx.arc(a.x, a.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(148,163,184,.55)';
      ctx.fill();
      for(let j = i + 1; j < particles.length; j++){
        const b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < 130){
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(${colors[(i + j) % 2]},${0.16 * (1 - dist / 130)})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
  }

  function loop(){ step(); rafId = requestAnimationFrame(loop); }
  function start(){ if(!rafId && !reduceMotion) rafId = requestAnimationFrame(loop); }
  function stop(){ if(rafId){ cancelAnimationFrame(rafId); rafId = null; } }

  window.addEventListener('resize', () => { resize(); initParticles(); });
  document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });

  resize();
  initParticles();
  if(reduceMotion){ step(); } else { start(); }
})();
</script>
