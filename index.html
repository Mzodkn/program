<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="it-logo.svg">
<title>It Study Hub | مركز تقنية معلومات</title>

  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      brand: { 500: 'rgb(var(--b5) / <alpha-value>)', 600: 'rgb(var(--b6) / <alpha-value>)' },
      dark: { base: '#060911', surface: '#0c101d', elevated: '#151c2c', border: '#30384b', text: '#f3f4f6', muted: '#94a3b8' }
    },
    fontFamily: { sans: ['Inter', 'sans-serif'], arabic: ['Cairo', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
  } }
}
</script>
<style>
  :root { 
    --b5: 249 115 22; /* برتقالي ساطع */
    --b6: 234 88 12; 
  }
  html[lang="en"] body { font-family: 'Inter', sans-serif; }
  html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  
  body {
    background-color: #060911;
    background-image: 
      linear-gradient(to right, rgba(56, 189, 248, 0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
    background-size: 36px 36px;
    animation: gridPan 50s linear infinite;
  }
  @keyframes gridPan {
    from { transform: 0 0; }
    to   { transform: 360px 360px; }
  }

  .bg-glow { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-glow span {
    position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform;
  }
  .bg-glow .orb1 { width: 420px; height: 420px; top: -12%; left: -8%; background: rgb(var(--b5) / .35); animation: drift1 24s ease-in-out infinite; }
  .bg-glow .orb2 { width: 360px; height: 360px; bottom: -14%; right: -8%; background: rgba(56,189,248,.28); animation: drift2 30s ease-in-out infinite; }
  .bg-glow .orb3 { width: 300px; height: 300px; top: 45%; left: 60%; background: rgba(168,85,247,.18); animation: drift3 36s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(110px,70px) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-90px,-60px) scale(1.1); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px,50px) scale(1.2); } }

  #netCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  main, header { position: relative; z-index: 1; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #060911; }
  ::-webkit-scrollbar-thumb { background: #30384b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgb(var(--b6)); }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .terminal-cursor { animation: blink 0.8s infinite; }
</style>
</head>
<body class="bg-dark-base text-dark-text min-h-screen">

<canvas id="netCanvas"></canvas>
<div class="bg-glow" aria-hidden="true"><span class="orb1"></span><span class="orb2"></span><span class="orb3"></span></div>

<header class="fixed top-0 inset-x-0 z-40 h-14 bg-dark-surface/95 backdrop-blur border-b border-dark-border flex items-center justify-between px-4">
<span class="font-bold text-brand-500 inline-flex items-center gap-2 align-middle mono text-base">
  <img src="it-logo.svg" alt="IT Logo" class="w-8 h-8 inline-block object-contain"> 
  <span>IT <span class="text-brand-500">&gt;_</span></span>
</span>  
<button id="langBtn" class="px-3.5 py-1.5 rounded-lg bg-dark-elevated border border-dark-border hover:border-brand-500 text-white text-xs sm:text-sm font-semibold mono transition"></button>
</header>

<main class="pt-14"><div id="app" class="max-w-4xl mx-auto p-4 sm:p-6 pb-24"></div></main>

<script>
const SUBJECTS = [
  {id:'prg', file:'Programming.html', color:'yellow', ready:true,  icon:'⚡', header:'Programming.h',   lecCount:'10',name:["Programming","البرمجة المتقدمة"]},
  {id:'it',  file:'IT.html',          color:'blue',   ready:true,  icon:'🌐', header:'Networking.h',    lecCount:'10 ',name:["Introduction to IT","مقدمة في تقنية المعلومات"]},
  {id:'mth', file:'DiscreteMath.html',color:'pink',   ready:true,  icon:'🧮', header:'Math.h',     lecCount:'8' ,name:["Discrete Math","الرياضيات المنفصلة"]},
  {id:'is',  file:'InformationSystems.html', color:'orange', ready:true, icon:'🗄️', header:'Systems.h',  lecCount:'7' ,name:["Information Systems","نظم المعلومات (IS)"]},
  {id:'Etc', file:'ComputerEthics.html',color:'green',  ready:true,  icon:'⚖️', header:'Ethics.h',    lecCount:'8' ,name:["Computer Ethics","أخلاقيات الكمبيوتر"]},
  {id:'eng', file:'TechnicalEnglish.html', color:'red', ready:true, icon:'📜', header:'English.h', lecCount:'8',       name:["Technical English II","اللغة الإنجليزية التقنية 2"]},
  {id:'biz', file:'Business.html',      color:'teal',   ready:true,  icon:'💼', header:'Business.h',  lecCount:'7 ',    name:["Business Fundamentals","أساسيات الأعمال"]},
  {id:'acc', file:'Accounting.html',  color:'purple', ready:true,  icon:'📊', header:'Financial.h', lecCount:'6' ,  name:["Principles of Accounting","مبادئ المحاسبة"]},
];

const THEMES = {
  teal:['20 184 166','13 148 136'], pink:['236 72 153','219 39 119'], purple:['168 85 247','147 51 234'],
  blue:['59 130 246','37 99 235'], orange:['249 115 22','234 88 12'], green:['34 197 94','22 163 74'],
  yellow:['234 179 8','202 138 4'], red:['239 68 68','220 38 38']
};

const KEY='studyHubV2';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } }
let lang = load().lang||'en';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function render(){
  const ar=lang==='ar', data=load().data||{};
  document.documentElement.lang=lang; document.documentElement.dir=ar?'rtl':'ltr';
  document.getElementById('langBtn').textContent=ar?'English':'العربية';
  
  const cards=SUBJECTS.map(s=>{
    const t=THEMES[s.color], d=data[s.id]||{}, m=s.ready?(d.mastery||0):0;
    const tag=s.ready?'a href="'+esc(s.file)+'"':'div';
    const close=s.ready?'a':'div';
    return `<${tag} class="block text-start rounded-2xl p-5 border border-dark-border bg-dark-surface/95 hover:bg-dark-elevated transition ${s.ready?'hover:-translate-y-0.5 hover:shadow-xl hover:border-brand-500/50':'opacity-70 cursor-not-allowed'}" style="border-top:4px solid rgb(${t[0]})">
      <div class="flex items-center justify-between mb-2"><span class="text-3xl">${s.icon}</span>
      <span class="text-xs mono px-2.5 py-1 rounded-md font-bold" style="background:rgb(${t[0]} / .15);color:rgb(${t[0]})">${s.ready?m+'%':(ar?'قريبًا':'Coming soon')}</span></div>
      <div class="font-bold text-lg mb-1">${esc(s.name[ar?1:0])}</div>
      <div class="text-xs mono text-brand-500/90 mb-3 font-semibold">#include &lt;${s.header}&gt;</div>
     ${s.ready ? `<div class="text-xs text-dark-muted mb-4">${s.lecCount}${ar ? ' محاضرات ' : ' Lectures '}</div>
<div class="h-2 bg-dark-base rounded-full overflow-hidden"><div class="h-full transition-all" style="width:${m}\%;background:rgb(${t[0]})"></div></div>` : ''}
    </${close}>`;
  }).join('');

  document.getElementById('app').innerHTML=`<div class="fade">
    
    <!-- صندوق الترحيب البرمجي الشامل -->
    <div class="rounded-2xl bg-dark-surface/95 backdrop-blur p-6 sm:p-8 mb-5 border-2 border-brand-500/40 shadow-2xl relative overflow-hidden">
      
      <div class="absolute top-3 left-4 flex items-center gap-1.5 opacity-70 ">
        <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
        <span class="text-[11px] mono text-dark-muted ms-2">it_hub_main.cpp</span>
      </div>

      <div class="absolute -right-10 -top-10 w-48 h-48 bg-brand-500/15 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex flex-col sm:flex-row items-center gap-6 text-center sm:text-start relative z-10 mt-3 sm:mt-0">
        
        <div class="relative shrink-0 p-3.5 bg-dark-base/95 rounded-2xl border border-brand-500/30 shadow-inner">
          <img src="it-logo.svg" alt="IT Logo" style="width: 130px; height: 130px;" class="object-contain drop-shadow-[0_0_20px_rgba(249,115,22,0.4)]">
        </div>

        <div class="w-full">
          <div class="text-xs sm:text-sm mono text-brand-500 mb-1 font-bold">&gt; g++ -o IT_TOP.cpp && ./run </div>
          <h1 class="text-2xl sm:text-4xl font-extrabold mb-2 tracking-wide flex items-center justify-center sm:justify-start gap-2">
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-amber-400 font-mono">
              ${ar ? 'مركز تقنية معلومات' : 'IT Study Hub'}
            </span>
          </h1>
          <p class="text-dark-muted text-xs sm:text-sm mono min-h-[24px]">
            <span id="typed-text"></span><span class="text-brand-500 terminal-cursor">_</span>
          </p>
        </div>

      </div>
    </div>

    <!-- خانة اختيار السمستر (Dropdown / Select) -->
    <div class="flex items-center gap-3 rounded-2xl p-4 mb-6 border border-brand-500/40 bg-dark-surface/95 shadow-lg">
      <span class="text-2xl">🎓</span>
      <div class="flex-1">
        <label for="semesterSelect" class="block text-xs mono text-brand-500 font-bold mb-1">
          ${ar ? '// تغير السمستر ' : '//  Jump to Your Semester  <  كلها سمسترين العندي >'}

        </label>
        <p class="text-dark-muted text-xs sm:text-sm mono min-h-[24px] m-3">
            <span id="typed-semester"></span><span class="text-brand-500 terminal-cursor">_</span>
          </p>
        <select id="semesterSelect" onchange="if(this.value) window.location.href=this.value;" class="w-full bg-dark-base border border-dark-border focus:border-brand-500 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white outline-none transition cursor-pointer">
          <option value="" disabled >${ar ? '— اختر السمستر الدراسي —' : '— Select Semester —'}</option>
          <option value="s1/index.html">${ar ? 'السمستر الأول ' : 'Semester 1'}</option>
          <option value="index.html" selected >${ar ? 'السمستر الثاني ' : 'Semester 2'}</option>

        </select>
      </div>
    </div>

    <!-- شبكة المواد -->
    <div class="grid gap-4 sm:grid-cols-2">${cards}</div>
  </div>`;

  startTypewriter(ar);
}

let typingInterval;
function startTypewriter(isAr) {
  const el = document.getElementById('typed-text');
    const els = document.getElementById('typed-semester');

  if(!el) return;
  
  const texts = isAr ? [
    '// تقنية معلومات فوووق',
    '// ونبيس عمك ',
    '// احضر بلاك كلوفر اول و امشي أقراااا%'
  ] : [
    '// It Top on univeristy !!',
    '// one Piece your uncle',
    '// Prepare for final exams and قوم أقري'
  ];
const texts_s = isAr ? [
    '// السمستر الافتراضي:2 الثاني',
    '// الخطة الدراسية نشطة',
    '// اختر السمستر للمتابعة'
  ] : [
    '// Default Semester: 2',
    '// Study plan active',
    '// Select semester to proceed'
  ];


  let textIdx = 0, charIdx = 0, isDeleting = false;

  clearInterval(typingInterval);
  typingInterval = setInterval(() => {
    const currentText = texts[textIdx];
    const currentText_s = texts_s[textIdx];

    if (!isDeleting) {
      el.textContent = currentText.substring(0, charIdx + 1);
      els.textContent = currentText_s.substring(0, charIdx + 1);
      charIdx++;
      if (charIdx === currentText.length) {
        setTimeout(() => { isDeleting = true; }, 2000);
      }
    } else {
      el.textContent = currentText.substring(0, charIdx - 1);
      els.textContent = currentText_s.substring(0, charIdx - 1);
      
      charIdx--;
      if (charIdx === 0) {
        isDeleting = false;
        textIdx = (textIdx + 1) % texts.length;
      }
    }
  }, 60);
}


document.getElementById('langBtn').onclick=()=>{
  lang=lang==='ar'?'en':'ar';
  try{ const c=load(); c.lang=lang; localStorage.setItem(KEY,JSON.stringify(c)); }catch(e){}
  render();
};
render();

(function networkBackground(){
  const canvas = document.getElementById('netCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['249,115,22','56,189,248'];
  let w, h, particles = [], rafId = null;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function initParticles(){
    const density = reduceMotion ? 0 : Math.min(60, Math.round((w * h) / 24000));
    particles = Array.from({length: density}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
    }));
  }

  function step(){
    ctx.clearRect(0, 0, w, h);
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > w) p.vx *= -1;
      if(p.y < 0 || p.y > h) p.vy *= -1;
    }
    for(let i = 0; i < particles.length; i++){
      const a = particles[i];
      ctx.beginPath();
      ctx.arc(a.x, a.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(148,163,184,.55)';
      ctx.fill();
      for(let j = i + 1; j < particles.length; j++){
        const b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < 130){
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(${colors[(i + j) % 2]},${0.16 * (1 - dist / 130)})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
  }

  function loop(){ step(); rafId = requestAnimationFrame(loop); }
  function start(){ if(!rafId && !reduceMotion) rafId = requestAnimationFrame(loop); }
  function stop(){ if(rafId){ cancelAnimationFrame(rafId); rafId = null; } }

  window.addEventListener('resize', () => { resize(); initParticles(); });
  document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });

  resize();
  initParticles();
  if(reduceMotion){ step(); } else { start(); }
})();
</script>
</body>
</html>
