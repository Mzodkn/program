<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programming II (Concise) | تقنيات البرمجة 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: 'rgb(var(--b5) / 1)', 600: 'rgb(var(--b6) / 1)' },
            dark: { base: '#0b0f17', surface: '#111827', elevated: '#1f2937', border: '#374151', text: '#f3f4f6', muted: '#9ca3af' }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            arabic: ['Cairo', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    :root { --b5: 59 130 246; --b6: 37 99 235; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #0b0f17; color: #f3f4f6; font-family: 'Cairo', 'sans-serif'; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .card { background: rgba(17,24,39,0.9); border: 1px solid #374151; border-radius: 1rem; }
    .nav-btn.active { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
    .btn { border: 1px solid #374151; background: #111827; border-radius: 0.75rem; padding: 0.6rem 1rem; }
    .btn.primary { background: #2563eb; border-color: #2563eb; color: white; }
    .answer-right { background: rgba(34,197,94,0.12); border-color: #22c55e; }
    .answer-wrong { background: rgba(239,68,68,0.12); border-color: #ef4444; }
  </style>
</head>
<body class="min-h-screen">
  <header class="fixed inset-x-0 top-0 z-30 h-16 border-b border-dark-border bg-dark-surface/95 backdrop-blur">
    <div class="mx-auto flex h-full max-w-6xl items-center justify-between px-4">
      <div class="flex items-center gap-3">
        <button id="menuBtn" class="btn p-2" aria-label="Menu">☰</button>
        <a href="index.html" class="btn p-2" title="All subjects">🗂️</a>
        <div id="topTitle" class="text-lg font-bold text-brand-500">Programming II</div>
      </div>
      <button id="langBtn" class="btn primary text-sm font-semibold">English</button>
    </div>
  </header>

  <div class="mx-auto flex max-w-6xl pt-20">
    <aside id="sidebar" class="hidden w-72 shrink-0 border-e border-dark-border bg-dark-surface p-4 lg:block">
      <nav id="nav" class="space-y-2"></nav>
    </aside>

    <main class="flex-1 p-4 md:p-6">
      <div id="app"></div>
    </main>
  </div>

  <script>
    const UI = {
      home: ['Home', 'الرئيسية'],
      lecture: ['Lecture', 'المحاضرة'],
      quiz: ['Quiz', 'اختبار'],
      glossary: ['Glossary', 'المفردات'],
      next: ['Next', 'التالي'],
      previous: ['Previous', 'السابق'],
      read: ['Read', 'مقروءة'],
      answer: ['Answer', 'الإجابة'],
      score: ['Score', 'النتيجة']
    };

    const LECTURES = [
      {
        id: 'l1',
        title: ['Intro to C++ & Naming Rules', 'مقدمة C++ وقواعد التسمية'],
        sections: [
          {
            t: ['Assessment & Program Components', 'توزيع الدرجات ومكونات البرنامج'],
            b: [
              'Course Marks: 20 CW + 20 Mid + 60 Final.',
              'A program is a set of instructions that performs a task.',
              'Main components: constants, variables, and methods.'
            ]
          },
          {
            t: ['C++ Naming Rules', 'قواعد تسمية C++'],
            b: [
              'Names must start with a letter or underscore.',
              'Names cannot start with a number.',
              'Only letters, digits, and underscores are allowed.',
              'C++ is case-sensitive: age and AGE are different.'
            ]
          }
        ],
        flash: [
          ['What is a program?', 'برنامج الحاسوب هو مجموعة تعليمات لتنفيذ مهمة معينة.'],
          ['What is a constant?', 'الثابت هو قيمة لا يمكن تغييرها أثناء التنفيذ.'],
          ['What does case-sensitive mean?', 'يعني أن age و AGE اسمين مختلفين.']
        ],
        quiz: [
          { q: ['Which is a valid C++ name?', 'أي اسم صحيح في C++؟'], options: ['1age', 'sutd_name', 'stud name', 'cnt*'], answer: 1 },
          { q: ['Which statement is true?', 'أي جملة صحيحة؟'], options: ['C++ names can start with a number', 'age and AGE are different', 'Spaces are allowed', 'All names must be short'], answer: 1 }
        ]
      },
      {
        id: 'l2',
        title: ['Data Types, Memory & Declarations', 'أنواع البيانات والذاكرة والتصريح'],
        sections: [
          {
            t: ['Data Types Summary', 'ملخص أنواع البيانات'],
            b: [
              'char stores one character.',
              'int stores integers.',
              'float and double store real numbers.',
              'bool stores true or false.'
            ]
          },
          {
            t: ['Declaration Rules', 'قواعد التصريح'],
            b: [
              'Variable: data type + name;',
              'Constant: const + data type + name;',
              'Example: int x; const int MAX = 10;' 
            ]
          }
        ],
        flash: [
          ['How big is int?', 'int غالباً يشغل 4 بايت.'],
          ['How do we declare a constant?', 'نكتب const ثم نوع البيانات ثم الاسم.'],
          ['How do we write a string?', 'يكتب النص بين علامتي تنصيص مزدوجتين مثل "Ahmed".']
        ],
        quiz: [
          { q: ['Which type stores true/false?', 'أي نوع يخزن true/false؟'], options: ['char', 'bool', 'string', 'float'], answer: 1 },
          { q: ['Which declaration is correct?', 'ما التصريح الصحيح؟'], options: ['const int x;', 'const int x = 5;', 'int const = 5;', 'float x = true;'], answer: 1 }
        ]
      }
    ];

    const GLOSSARY = [
      ['Variable', 'متغير'],
      ['Constant', 'ثابت'],
      ['int', 'نوع صحيح'],
      ['float', 'نوع حقيقي'],
      ['bool', 'منطقي'],
      ['Algorithm', 'خوارزمية']
    ];

    const SUBJECT = {
      id: 'program',
      name: ['Programming II (Concise)', 'تقنيات البرمجة 2 (النسخة المختصرة)'],
      icon: '💻',
      lectures: LECTURES,
      glossary: GLOSSARY
    };

    const state = { lang: localStorage.getItem('studyLang') || 'ar', page: 'home' };

    function t(value) {
      return Array.isArray(value) ? value[state.lang === 'ar' ? 1 : 0] : value;
    }

    function renderNav() {
      const nav = document.getElementById('nav');
      const buttons = [];
      buttons.push('<button data-page="home" class="nav-btn ' + (state.page === 'home' ? 'active' : '') + ' w-full rounded-lg px-3 py-2 text-start">' + UI.home[state.lang === 'ar' ? 1 : 0] + '</button>');
      SUBJECT.lectures.forEach((lec) => {
        const key = 'lecture:' + lec.id;
        buttons.push('<button data-page="' + key + '" class="nav-btn ' + (state.page === key ? 'active' : '') + ' w-full rounded-lg px-3 py-2 text-start">' + t(lec.title) + '</button>');
      });
      buttons.push('<button data-page="glossary" class="nav-btn ' + (state.page === 'glossary' ? 'active' : '') + ' w-full rounded-lg px-3 py-2 text-start">' + UI.glossary[state.lang === 'ar' ? 1 : 0] + '</button>');
      nav.innerHTML = buttons.join('');
    }

    function renderHome() {
      const cards = SUBJECT.lectures.map((lec, idx) => {
        return `
          <button data-page="lecture:${lec.id}" class="card p-4 text-start transition hover:border-brand-500">
            <div class="mb-2 text-xs font-semibold text-brand-500">${UI.lecture[state.lang === 'ar' ? 1 : 0]} ${idx + 1}</div>
            <div class="text-xl font-bold">${t(lec.title)}</div>
          </button>
        `;
      }).join('');

      document.getElementById('app').innerHTML = `
        <div class="card p-6">
          <div class="mb-4 text-4xl">${SUBJECT.icon}</div>
          <h1 class="text-3xl font-extrabold">${t(SUBJECT.name)}</h1>
          <p class="mt-3 text-dark-muted">${state.lang === 'ar' ? 'ملخص سريع ومفيد لشرح البرمجة مع أسئلة ومفردات.' : 'Quick study summary for programming with quizzes and vocabulary.'}</p>
        </div>
        <div class="mt-6 grid gap-4 md:grid-cols-2">${cards}</div>
      `;
    }

    function renderLecture(id) {
      const lecture = SUBJECT.lectures.find((item) => item.id === id);
      if (!lecture) {
        renderHome();
        return;
      }

      const sectionsHtml = lecture.sections.map((section, index) => {
        return `
          <section class="card mb-4 p-4">
            <h2 class="mb-3 text-xl font-bold">${index + 1}. ${t(section.t)}</h2>
            <ul class="space-y-2 text-dark-muted">
              ${section.b.map((item) => '<li>• ' + item + '</li>').join('')}
            </ul>
          </section>
        `;
      }).join('');

      const flashHtml = lecture.flash.map((pair, index) => {
        return `
          <div class="card mb-3 p-4">
            <div class="mb-2 text-xs font-semibold text-brand-500">${index + 1}</div>
            <div class="font-bold">${pair[0]}</div>
            <div class="mt-2 text-dark-muted">${pair[1]}</div>
          </div>
        `;
      }).join('');

      const quizHtml = lecture.quiz.map((item, index) => {
        return `
          <div class="card mb-4 p-4">
            <div class="mb-3 font-bold">${index + 1}. ${t(item.q)}</div>
            <div class="space-y-2">
              ${item.options.map((opt, optionIndex) => {
                const correct = optionIndex === item.answer ? '1' : '0';
                return `<button class="answer-btn w-full rounded-lg border border-dark-border bg-dark-surface px-3 py-2 text-left" data-correct="${correct}">${opt}</button>`;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('app').innerHTML = `
        <div class="mb-4 text-sm font-semibold text-brand-500">${UI.lecture[state.lang === 'ar' ? 1 : 0]} ${lecture.id.replace('l', '')}</div>
        <h1 class="mb-6 text-3xl font-extrabold">${t(lecture.title)}</h1>
        ${sectionsHtml}
        <div class="card mb-4 p-4">
          <h2 class="mb-3 text-xl font-bold">${UI.quiz[state.lang === 'ar' ? 1 : 0]}</h2>
          ${flashHtml}
        </div>
        <div class="mb-4">
          <h2 class="mb-3 text-xl font-bold">${UI.quiz[state.lang === 'ar' ? 1 : 0]}</h2>
          ${quizHtml}
        </div>
      `;
    }

    function renderGlossary() {
      const items = GLOSSARY.map(([en, ar]) => {
        return `
          <div class="rounded-lg border border-dark-border bg-dark-surface p-3">
            <div class="font-bold text-brand-500">${en}</div>
            <div class="text-dark-muted">${ar}</div>
          </div>
        `;
      }).join('');

      document.getElementById('app').innerHTML = `
        <div class="card p-5">
          <h1 class="mb-4 text-2xl font-extrabold">${UI.glossary[state.lang === 'ar' ? 1 : 0]}</h1>
          <div class="space-y-3">${items}</div>
        </div>
      `;
    }

    function render() {
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('langBtn').textContent = state.lang === 'ar' ? 'English' : 'العربية';
      document.getElementById('topTitle').textContent = t(SUBJECT.name);
      renderNav();

      if (state.page === 'home') {
        renderHome();
      } else if (state.page === 'glossary') {
        renderGlossary();
      } else if (state.page.startsWith('lecture:')) {
        renderLecture(state.page.split(':')[1]);
      }
    }

    document.addEventListener('click', (event) => {
      const navBtn = event.target.closest('[data-page]');
      if (navBtn) {
        state.page = navBtn.dataset.page;
        render();
        return;
      }

      const answerBtn = event.target.closest('.answer-btn');
      if (answerBtn) {
        const isCorrect = answerBtn.dataset.correct === '1';
        answerBtn.classList.toggle('answer-right', isCorrect);
        answerBtn.classList.toggle('answer-wrong', !isCorrect);
      }

      const menuBtn = event.target.closest('#menuBtn');
      if (menuBtn) {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('hidden');
        sidebar.classList.toggle('lg:block');
      }

      const langBtn = event.target.closest('#langBtn');
      if (langBtn) {
        state.lang = state.lang === 'ar' ? 'en' : 'ar';
        localStorage.setItem('studyLang', state.lang);
        render();
      }
    });

    render();
  </script>
</body>
</html>
