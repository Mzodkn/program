   [["Can you copy an array in C++ using 'list = myList;'? Why or why not?","هل يمكنك نسخ مصفوفة في C++ باستخدام 'list = myList;'؟ وكيف يتم النسخ الصحيح؟"],["No, direct array assignment is not allowed in C++. You must use a loop to copy individual elements: for(int i=0; i<ARRAY_SIZE; i++) list[i] = myList[i];","لا، هذا غير مسموح به في C++. يجب نسخ العناصر عنصرًا بعنصر باستخدام حلقة تكرار for."]],

   [["Why must we save 'double temp = myList[0];' before shifting array elements to the left?","لماذا يجب حفظ العنصر الأول في 'double temp = myList[0];' قبل إزاحة عناصر المصفوفة إلى اليسار؟"],["Because the first step of the left-shift loop (myList[0] = myList[1]) overwrites myList[0]. Saving it in temp lets us place it at the end (myList[length - 1] = temp).","لأن الخطوة الأولى في حلقة الإزاحة لليسار تكتب فوق العنصر الأول myList[0]، لذا نحفظه في temp لنضعه في آخر موقع بالمصفوفة بعد انتهاء الإزاحة."]],

const stripAnsi = s => String(s || '').replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');

/* Auto-wrap student code in #include + int main() ONLY if they wrote quick statements without main() */
function prepareFreeCppCode(rawCode) {
  let c = String(rawCode || '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").trim();
  if (!c) return '';
  if (!/\bmain\s*\(/.test(c)) {
    return `#include <iostream>\n#include <string>\n#include <cmath>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n${c}\n    return 0;\n}`;
  }
  if (!/#include/.test(c)) {
    return `#include <iostream>\n#include <string>\n#include <cmath>\n#include <algorithm>\nusing namespace std;\n\n` + c;
  }
  return c;
}

/* Real GCC C++17 Execution via Compiler Explorer (Godbolt) + Wandbox + Local Fallback */
async function compileAndRunFreeCpp(rawCode, stdinText) {
  const source = prepareFreeCppCode(rawCode);
  if (!source) {
    return { ok: false, out: '', err: state.lang === 'ar' ? 'المحرر فارغ! اكتب كود C++ أولًا.' : 'Editor is empty! Write some C++ code first.' };
  }

  // 1. Primary Real GCC C++17 Engine: Compiler Explorer (Godbolt) REST API
  const compilers = ['g132', 'g141', 'clang1810'];
  for (const compId of compilers) {
    try {
      const res = await fetch(`https://godbolt.org/api/compiler/${compId}/compile`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          source: source,
          compiler: compId,
          lang: 'c++',
          options: {
            userArguments: '-std=c++17 -O2',
            executeParameters: { args: [], stdin: String(stdinText || '') },
            compilerOptions: { executorRequest: true, skipAsm: true },
            filters: { execute: true },
            tools: [],
            libraries: []
          },
          allowStoreCodeDebug: true
        })
      });
      if (res.ok) {
        const d = await res.json();
        const ex = d.execResult || d;
        const outArr = (ex.stdout && ex.stdout.length ? ex.stdout : d.stdout) || [];
        const errArr = [
          ...((d.buildResult && d.buildResult.stderr) || []),
          ...((ex.buildResult && ex.buildResult.stderr) || []),
          ...(ex.stderr || []),
          ...(d.stderr || [])
        ];
        const out = stripAnsi(outArr.map(x => x.text).join('\n'));
        const err = stripAnsi(errArr.map(x => x.text).join('\n'));
        const bCode = (d.buildResult && d.buildResult.code != null)
          ? d.buildResult.code
          : ((ex.buildResult && ex.buildResult.code != null) ? ex.buildResult.code : 0);
        const runCode = ex.code != null ? ex.code : (d.code != null ? d.code : 0);
        const ok = (bCode === 0) && (runCode === 0);
        if (out || err || ok) {
          return {
            ok,
            out: out || (ok && !err ? (state.lang === 'ar' ? '✓ تم التنفيذ بنجاح (الكود لم يطبع شيئًا عبر cout)' : '✓ Executed successfully (no cout output)') : ''),
            err
          };
        }
      }
    } catch (_) {}
  }

  // 2. Secondary Real GCC Engine: Wandbox API
  try {
    const res2 = await fetch('https://wandbox.org/api/compile.json', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        compiler: 'gcc-head',
        code: source,
        stdin: String(stdinText || ''),
        'compiler-option-raw': '-std=c++17\n-O2'
      })
    });
    if (res2.ok) {
      const d2 = await res2.json();
      const err = stripAnsi((d2.compiler_error || '') + (d2.program_error || ''));
      const out = stripAnsi(d2.program_output || '');
      const ok = String(d2.status) === '0';
      return {
        ok,
        out: out || (ok && !err ? (state.lang === 'ar' ? '✓ تم التنفيذ بنجاح (الكود لم يطبع شيئًا عبر cout)' : '✓ Executed successfully (no cout output)') : ''),
        err
      };
    }
  } catch (_) {}

  // 3. Offline Fallback: Local Instant Interpreter (when student has no internet)
  const localRes = runLocalSheetCpp(rawCode, stdinText);
  return {
    ok: localRes.ok,
    out: (localRes.out ? localRes.out + '\n\n' : '') + (state.lang === 'ar' ? '[تم التشغيل عبر المحرك المحلي بدون إنترنت]' : '[Executed via Offline Local Engine]'),
    err: localRes.err
  };
}

/* Instant built-in C++ interpreter for lecture sheet snippets (works 0ms offline) */
function runLocalSheetCpp(rawCode, stdinStr) {
  let code = String(rawCode || '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
  code = code.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '').trim();

  const constVars = new Set();
  const constRe = /\bconst\s+(?:char|byte|short|int|long|Long|float|double|bool|string)\s+([A-Za-z_]\w*)/g;
  let cm;
  while ((cm = constRe.exec(code)) !== null) constVars.add(cm[1]);
  for (const cv of constVars) {
    const assignRe = new RegExp(`(?:^|[;{}\\n])\\s*${cv}\\s*=[^=]`, 'm');
    if (assignRe.test(code)) {
      return {
        ok: false,
        out: '',
        err: `error C3892: '${cv}': you cannot assign to a variable that is const`
      };
    }
  }

  const env = {
    ARRAY_SIZE: 5,
    deg: 2,
    npts: 2,
    i: 0, j: 0, k: 0, x: 10
  };
  const arrays = {
    myList: [10, 20, 30, 40, 50],
    list: [0, 0, 0, 0, 0],
    tc: [10, 20, 30, 0, 0],
    uc: [0, 0, 0, 0, 0, 0]
  };
  const ptrs = {};
  const addrs = {
    x: '0x61ff08',
    arr: '0x61fef0',
    Ar: '0x61fed0',
    ar: '0x61feb0',
    values: '0x61fe90',
    myList: '0x61fe70'
  };
  const funcs = {};
  const touchedVars = [];
  const touchedArrays = new Set();
  let stdout = '';

  const stdinTokens = String(stdinStr || '').trim().split(/\s+/).filter(Boolean);
  let stdinIdx = 0;

  code = code.replace(/(?:void|Function)\s+([A-Za-z_]\w*)\s*\(([^)]*)\)\s*\{([\s\S]*?)\}/g, (_, fname, params, fbody) => {
    const pm = params.match(/\*\s*([A-Za-z_]\w*)/);
    funcs[fname] = { param: pm ? pm[1] : null, body: fbody };
    return '';
  });

  code = code.replace(/#include\s*<[^>]+>/g, '').replace(/using\s+namespace\s+std\s*;/g, '');
  const mainMatch = code.match(/(?:int\s+)?main\s*\([^)]*\)\s*\{([\s\S]*)\}/);
  if (mainMatch) code = mainMatch[1];

  function evalExpr(expr) {
    let e = String(expr || '').trim();
    if (!e) return 0;
    if (e === 'true') return 1;
    if (e === 'false') return 0;
    if (e === 'nullptr') return '0x0';
    if (/^".*"$/.test(e) || /^'.*'$/.test(e)) return e.slice(1, -1);
    if (e === 'myList.length') return (arrays.myList || []).length;

    let m = e.match(/^&\s*([A-Za-z_]\w*)\s*\[\s*0\s*\]$/);
    if (m) return addrs[m[1]] || '0x61fef0';
    m = e.match(/^&\s*([A-Za-z_]\w*)$/);
    if (m) return addrs[m[1]] || '0x61ff08';

    m = e.match(/^\*\s*\(\s*([A-Za-z_]\w*)\s*\+\s*([^)]+)\)$/);
    if (m && ptrs[m[1]]) {
      const off = Number(evalExpr(m[2])) || 0;
      const info = ptrs[m[1]];
      if (arrays[info.target]) return arrays[info.target][info.offset + off];
    }
    m = e.match(/^\*\s*([A-Za-z_]\w*)$/);
    if (m && ptrs[m[1]]) {
      const info = ptrs[m[1]];
      if (info.isArray) return arrays[info.target][info.offset];
      return env[info.target];
    }

    if (arrays[e] && !(e in env)) return addrs[e] || '0x61fef0';
    if (ptrs[e]) {
      const info = ptrs[e];
      return addrs[info.target] || '0x61ff08';
    }

    while (/([A-Za-z_]\w*)\s*\[\s*([^\[\]]+)\s*\]/.test(e)) {
      e = e.replace(/([A-Za-z_]\w*)\s*\[\s*([^\[\]]+)\s*\]/g, (_, aname, idxExpr) => {
        const idx = Number(evalExpr(idxExpr)) || 0;
        const arr = arrays[aname] || [];
        return arr[idx] !== undefined ? arr[idx] : 0;
      });
    }

    e = e.replace(/\b([A-Za-z_]\w*)\b/g, (id) => {
      if (id in env) {
        const v = env[id];
        return typeof v === 'string' ? JSON.stringify(v) : v;
      }
      return 0;
    });

    try {
      return Function('"use strict"; return (' + e + ');')();
    } catch (_) {
      return 0;
    }
  }

  function execSimpleStmt(st) {
    st = st.trim();
    if (!st || st.startsWith('return')) return;

    let m = st.match(/^([A-Za-z_]\w*)\s*\(\s*(?:&\s*([A-Za-z_]\w*))?\s*\)$/);
    if (m && funcs[m[1]]) {
      const fn = funcs[m[1]];
      if (fn.param && m[2]) {
        ptrs[fn.param] = { target: m[2], isArray: false, offset: 0 };
      }
      execBlock(fn.body);
      return;
    }

    if (/^cout\s*<</.test(st)) {
      const parts = st.replace(/^cout\s*<<\s*/, '').split('<<');
      for (let p of parts) {
        p = p.trim();
        if (p === 'endl') stdout += '\n';
        else stdout += String(evalExpr(p));
      }
      return;
    }

    if (/^cin\s*>>/.test(st)) {
      const targets = st.replace(/^cin\s*>>\s*/, '').split('>>');
      for (let t of targets) {
        t = t.trim();
        const rawVal = stdinTokens[stdinIdx] !== undefined ? stdinTokens[stdinIdx++] : '3';
        const numVal = isNaN(Number(rawVal)) ? rawVal : Number(rawVal);
        const am = t.match(/^([A-Za-z_]\w*)\s*\[\s*(.+)\s*\]$/);
        if (am) {
          const idx = Number(evalExpr(am[2])) || 0;
          if (!arrays[am[1]]) arrays[am[1]] = [];
          arrays[am[1]][idx] = numVal;
          touchedArrays.add(am[1]);
        } else {
          env[t] = numVal;
          if (!touchedVars.includes(t)) touchedVars.push(t);
        }
      }
      return;
    }

    m = st.match(/^(?:const\s+)?(?:int|double|float|char|short|long|Long|byte)\s+([A-Za-z_]\w*)\s*\[\s*(\d*)\s*\]\s*=\s*\{([^}]*)\}$/);
    if (m) {
      const name = m[1], size = Number(m[2]) || 0;
      const vals = m[3].split(',').map(x => evalExpr(x.trim()));
      while (vals.length < size) vals.push(0);
      arrays[name] = vals;
      touchedArrays.add(name);
      return;
    }

    m = st.match(/^(?:int|float|double|char)\s*\*\s*([A-Za-z_]\w*)(?:\s*=\s*(.+))?$/);
    if (m) {
      const pname = m[1], rhs = (m[2] || '').trim();
      if (rhs.startsWith('&')) {
        const tname = rhs.slice(1).trim();
        ptrs[pname] = { target: tname, isArray: false, offset: 0 };
      } else if (rhs && arrays[rhs]) {
        ptrs[pname] = { target: rhs, isArray: true, offset: 0 };
      } else if (rhs === 'nullptr') {
        ptrs[pname] = { target: 'nullptr', isArray: false, offset: 0 };
        addrs.nullptr = '0x0';
      } else {
        ptrs[pname] = { target: 'x', isArray: false, offset: 0 };
      }
      if (!touchedVars.includes(pname)) touchedVars.push(pname);
      return;
    }

    m = st.match(/^(?:const\s+)?(char|Char|byte|short|int|long|Long|float|double|bool|string)\s+(.+)$/);
    if (m) {
      const type = m[1], rest = m[2];
      const decls = rest.split(',');
      for (let d of decls) {
        d = d.trim();
        const arrM = d.match(/^([A-Za-z_]\w*)\s*\[\s*([^\]]+)\s*\]$/);
        if (arrM) {
          const aname = arrM[1], sz = Number(evalExpr(arrM[2])) || 10;
          arrays[aname] = new Array(sz).fill(0);
          touchedArrays.add(aname);
          continue;
        }
        const eqM = d.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
        if (eqM) {
          env[eqM[1]] = evalExpr(eqM[2]);
          if (!touchedVars.includes(eqM[1])) touchedVars.push(eqM[1]);
        } else if (/^[A-Za-z_]\w*$/.test(d)) {
          env[d] = (type === 'string') ? '""' : (type === 'char' || type === 'Char') ? "' '" : (type === 'bool') ? false : 0;
          if (!touchedVars.includes(d)) touchedVars.push(d);
        }
      }
      return;
    }

    m = st.match(/^\*\s*([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if (m && ptrs[m[1]]) {
      const val = evalExpr(m[2]);
      const info = ptrs[m[1]];
      if (info.isArray) {
        arrays[info.target][info.offset] = val;
        touchedArrays.add(info.target);
      } else {
        env[info.target] = val;
        if (!touchedVars.includes(info.target)) touchedVars.push(info.target);
      }
      return;
    }

    m = st.match(/^([A-Za-z_]\w*)\s*\[\s*(.+)\s*\]\s*(\+=|=)\s*(.+)$/);
    if (m) {
      const aname = m[1], idx = Number(evalExpr(m[2])) || 0, op = m[3], val = evalExpr(m[4]);
      if (!arrays[aname]) arrays[aname] = [];
      if (op === '+=') arrays[aname][idx] = (Number(arrays[aname][idx]) || 0) + Number(val);
      else arrays[aname][idx] = val;
      touchedArrays.add(aname);
      return;
    }

    m = st.match(/^([A-Za-z_]\w*)\s*(\+=|-=|=)\s*(.+)$/);
    if (m) {
      const vname = m[1], op = m[2], val = evalExpr(m[3]);
      if (op === '+=') env[vname] = (Number(env[vname]) || 0) + Number(val);
      else if (op === '-=') env[vname] = (Number(env[vname]) || 0) - Number(val);
      else env[vname] = val;
      if (!touchedVars.includes(vname)) touchedVars.push(vname);
    }
  }

  function execBlock(block) {
    let s = String(block || '').trim();
    let pos = 0;
    while (pos < s.length) {
      while (pos < s.length && /[\s;]/.test(s[pos])) pos++;
      if (pos >= s.length) break;

      const rem = s.slice(pos);
      const forM = rem.match(/^for\s*\(([^;]+);([^;]+);([^)]+)\)\s*/);
      if (forM) {
        pos += forM[0].length;
        let body = '';
        if (s[pos] === '{') {
          let depth = 1; pos++;
          const start = pos;
          while (pos < s.length && depth > 0) {
            if (s[pos] === '{') depth++;
            else if (s[pos] === '}') depth--;
            pos++;
          }
          body = s.slice(start, pos - 1);
        } else {
          const semi = s.indexOf(';', pos);
          body = semi >= 0 ? s.slice(pos, semi) : s.slice(pos);
          pos = semi >= 0 ? semi + 1 : s.length;
        }
        execSimpleStmt(forM[1]);
        let guard = 0;
        while (evalExpr(forM[2]) && guard++ < 500) {
          execBlock(body);
          const inc = forM[3].trim();
          const incM = inc.match(/^([A-Za-z_]\w*)\s*\+\+$/);
          if (incM) env[incM[1]] = (Number(env[incM[1]]) || 0) + 1;
          else execSimpleStmt(inc);
        }
        continue;
      }

      const ifM = rem.match(/^if\s*\(([^)]+)\)\s*/);
      if (ifM) {
        pos += ifM[0].length;
        const semi = s.indexOf(';', pos);
        const body = semi >= 0 ? s.slice(pos, semi) : s.slice(pos);
        pos = semi >= 0 ? semi + 1 : s.length;
        if (evalExpr(ifM[1])) execSimpleStmt(body);
        continue;
      }

      const semi = s.indexOf(';', pos);
      const stmt = semi >= 0 ? s.slice(pos, semi) : s.slice(pos);
      pos = semi >= 0 ? semi + 1 : s.length;
      execSimpleStmt(stmt);
    }
  }

  try {
    execBlock(code);
    if (!stdout.trim()) {
      const lines = [];
      for (const a of touchedArrays) {
        lines.push(`${a} = [ ${arrays[a].join(', ')} ]`);
      }
      for (const v of touchedVars) {
        if (ptrs[v]) {
          const info = ptrs[v];
          const addr = addrs[info.target] || '0x61ff08';
          const deref = info.target === 'nullptr' ? 'null' : (info.isArray ? arrays[info.target][0] : env[info.target]);
          lines.push(`${v} (pointer) = ${addr}` + (deref !== 'null' ? `  |  *${v} = ${deref}` : ''));
        } else if (v in env) {
          lines.push(`${v} = ${env[v]}`);
        }
      }
      stdout = lines.length
        ? lines.join('\n')
        : (state.lang === 'ar' ? '✓ تم تنفيذ الكود بنجاح' : '✓ Code executed successfully');
    }
    return { ok: true, out: stdout, err: '' };
  } catch (err) {
    return { ok: false, out: '', err: String(err.message || err) };
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', async e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }

  const sz=e.target.closest('[data-size]'); if(sz){ newExam(+sz.dataset.size); render(); window.scrollTo({top:0}); return; }

  const opt=e.target.closest('.opt');
  if(opt){
    const box=opt.closest('.qbox'); if(box.dataset.done) return;
    box.dataset.done='1';
    const a=+box.dataset.a, i=+opt.dataset.i, ok=(i===a);
    if(ok) box.dataset.ok='1';
    box.querySelectorAll('.opt').forEach(b=>{
      b.disabled=true; b.classList.remove('hover:border-brand-500'); b.classList.add('cursor-not-allowed');
      if(+b.dataset.i===a) b.classList.add('!bg-green-600/30','!border-green-500');
    });
    if(!ok) opt.classList.add('!bg-red-600/30','!border-red-500');
    const fb=box.querySelector('.fb'); fb.classList.remove('hidden');
    fb.className='fb mt-3 text-sm font-semibold '+(ok?'text-green-400':'text-red-400');
    fb.textContent=ok?u('correct'):u('wrong');

    const exam=box.closest('[data-exam]');
    if(exam){
      const ex=state.exam, q=ex.qs[ex.i];
      if(ok) ex.score++; else ex.wrong.push({q:q.q,c:q.o[q.a]});
      $('examNext').classList.remove('hidden'); return;
    }
    const qz=box.closest('[data-quiz]');
    if(qz){
      const boxes=[...qz.querySelectorAll('.qbox')];
      if(boxes.every(b=>b.dataset.done)){
        const sc=boxes.filter(b=>b.dataset.ok).length, pct=Math.round(sc/boxes.length*100);
        const sEl=qz.querySelector('.qscore'); sEl.classList.remove('hidden');
        qz.querySelector('.qs-text').textContent=`${u('score')}: ${sc}/${boxes.length} (${pct}%)`;
        const d=sd(), id=qz.dataset.quiz;
        if(d.best[id]==null||pct>d.best[id]){ d.best[id]=pct; save(); }
        updateTop(); renderNav();
      }
    }
    return;
  }

  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;

  /* ----- FREE PLAYGROUND TEMPLATE LOADER ----- */
  if(act==='free-tpl'){
    const tpl = FREE_TEMPLATES[+a.dataset.idx];
    if(tpl){
      const ta=$('rcode-free-ide'), st=$('rstdin-free-ide'), out=$('rout-free-ide');
      if(ta){
        ta.value = tpl.code;
        runnerMap['free-ide'] = tpl.code;
        try { localStorage.setItem(FREE_CODE_KEY, tpl.code); } catch(_){}
      }
      if(st) st.value = tpl.stdin || '';
      if(out) out.classList.add('hidden');
    }
    return;
  }

  /* ----- OPEN SHEET SNIPPET IN FREE IDE ----- */
  if(act==='cpp-open-free'){
    const rid=a.dataset.rid, raw=runnerMap[rid]||'';
    const fullCode = prepareFreeCppCode(raw);
    runnerMap['free-ide'] = fullCode;
    try { localStorage.setItem(FREE_CODE_KEY, fullCode); } catch(_){}
    go('playground');
    return;
  }

  /* ----- C++ RUNNER ACTIONS (SHEET + FREE IDE) ----- */
  if(act==='cpp-toggle'){
    const rid=a.dataset.rid, w=$('rwrap-'+rid);
    if(w){
      w.classList.toggle('hidden');
      if(!w.classList.contains('hidden')){
        const ta=$('rcode-'+rid), st=$('rstdin-'+rid), out=$('rout-'+rid);
        if(ta && out){
          const res = runLocalSheetCpp(ta.value, st ? st.value : '');
          out.classList.remove('hidden');
          out.className='mt-3 rounded-lg bg-dark-base border p-3 mono text-xs whitespace-pre-wrap overflow-x-auto ' + (res.ok ? 'border-green-500/60 text-green-400' : 'border-red-500/60 text-red-400');
          out.textContent = (res.out ? res.out : '') + (res.err ? (res.out ? '\n' : '') + res.err : '');
        }
      }
    }
    return;
  }
  if(act==='cpp-clear'){
    const rid=a.dataset.rid, ta=$('rcode-'+rid), out=$('rout-'+rid);
    if(ta){
      ta.value = `#include <iostream>\nusing namespace std;\n\nint main() {\n    \n    return 0;\n}`;
      ta.focus();
      if(out) out.classList.add('hidden');
    }
    return;
  }
  if(act==='cpp-copy'){
    const rid=a.dataset.rid, ta=$('rcode-'+rid);
    if(ta && navigator.clipboard){
      try {
        await navigator.clipboard.writeText(ta.value);
        const old = a.textContent;
        a.textContent = state.lang==='ar' ? '✓ تم النسخ' : '✓ Copied';
        setTimeout(()=>{ a.textContent = old; }, 1200);
      } catch(_){}
    }
    return;
  }
  if(act==='cpp-reset'){
    const rid=a.dataset.rid, ta=$('rcode-'+rid), st=$('rstdin-'+rid), out=$('rout-'+rid);
    if(ta){
      const defVal = rid==='free-ide' ? DEFAULT_FREE_CODE : (runnerMap[rid] || '');
      ta.value = defVal;
      if(rid==='free-ide'){
        runnerMap['free-ide'] = defVal;
        try { localStorage.setItem(FREE_CODE_KEY, defVal); } catch(_){}
      }
      if(st) st.value=defaultStdinFor(defVal);
      if(out) out.classList.add('hidden');
    }
    return;
  }
  if(act==='cpp-sym'){
    const rid=a.dataset.rid, sym=a.dataset.sym, ta=$('rcode-'+rid);
    if(ta){
      const ins = sym==='\\n' ? '\n' : sym;
      const start = ta.selectionStart || 0, end = ta.selectionEnd || 0;
      ta.value = ta.value.slice(0,start) + ins + ta.value.slice(end);
      ta.focus();
      ta.selectionStart = ta.selectionEnd = start + ins.length;
      if(rid==='free-ide'){
        try { localStorage.setItem(FREE_CODE_KEY, ta.value); } catch(_){}
      }
    }
    return;
  }
  if(act==='cpp-run'){
    const rid=a.dataset.rid, w=$('rwrap-'+rid), ta=$('rcode-'+rid), st=$('rstdin-'+rid), out=$('rout-'+rid), btn=$('rbtn-'+rid);
    if(!ta || !out) return;
    const isFree = w && w.dataset.mode === 'free';
    const ar = state.lang==='ar';

    if(isFree){
      try { localStorage.setItem(FREE_CODE_KEY, ta.value); } catch(_){}
      out.classList.remove('hidden');
      out.className='mt-3 rounded-lg bg-dark-base border border-dark-border p-3 mono text-xs whitespace-pre-wrap overflow-x-auto text-amber-400';
      out.textContent = ar ? '⏳ جاري ترجمة وتشغيل الكود عبر مترجم GCC C++17...' : '⏳ Compiling & running with GCC C++17...';
      if(btn) btn.disabled = true;
      const res = await compileAndRunFreeCpp(ta.value, st ? st.value : '');
      if(btn) btn.disabled = false;
      out.className='mt-3 rounded-lg bg-dark-base border p-3 mono text-xs whitespace-pre-wrap overflow-x-auto ' + (res.ok ? 'border-green-500/60 text-green-400' : 'border-red-500/60 text-red-400');
      out.textContent = (res.out ? res.out : '') + (res.err ? (res.out ? '\n' : '') + res.err : '');
    } else {
      const res = runLocalSheetCpp(ta.value, st ? st.value : '');
      out.classList.remove('hidden');
      out.className='mt-3 rounded-lg bg-dark-base border p-3 mono text-xs whitespace-pre-wrap overflow-x-auto ' + (res.ok ? 'border-green-500/60 text-green-400' : 'border-red-500/60 text-red-400');
      out.textContent = (res.out ? res.out : '') + (res.err ? (res.out ? '\n' : '') + res.err : '');
    }
    return;
  }

  if(act.startsWith('dk-')){
    const id=a.dataset.deck, d=state.decks[id]; if(!d) return;
    if(act==='dk-flip'){ d.flip=!d.flip; const f=document.querySelector(`#deck-${id} .flip`); if(f) f.classList.toggle('on',d.flip); return; }
    if(act==='dk-next') d.i=(d.i+1)%d.list.length;
    if(act==='dk-prev') d.i=(d.i-1+d.list.length)%d.list.length;
    if(act==='dk-shuf'){ d.list=shuf(d.list); d.i=0; }
    d.flip=false; redrawDeck(id); return;
  }
  if(act==='retryQuiz'){
    const L=LECT().find(l=>l.id===a.dataset.id); delete state.qz[L.id];
    $('quiz-'+L.id).innerHTML=quizInner(L); $('quiz-'+L.id).scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if(act==='examAgain'){ state.exam=null; render(); return; }
  if(act==='reset'){ state.data[state.subject]={seen:{},best:{},exam:0}; save(); render(); return; }
});
document.addEventListener('click',e=>{
  if(e.target.id==='examNext'){
    const ex=state.exam;
    if(ex.i<ex.qs.length-1) ex.i++;
    else { ex.finished=true; const p=Math.round(ex.score/ex.qs.length*100), d=sd(); if(p>(d.exam||0)){ d.exam=p; save(); } }
    render(); window.scrollTo({top:0});
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='labPreset'){
    const p=LAB_PRESETS[+e.target.value];
    if(p){
      runnerMap['lab-main']=p.code;
      const ta=$('rcode-lab-main'), st=$('rstdin-lab-main'), out=$('rout-lab-main');
      if(ta) ta.value=p.code;
      if(st) st.value=defaultStdinFor(p.code);
      if(out) out.classList.add('hidden');
    }
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='gSearch'){
    const q=e.target.value.toLowerCase();
    $('gList').innerHTML=gItems(subj().glossary.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(q)));
  }
  if(e.target.id==='rcode-free-ide'){
    runnerMap['free-ide'] = e.target.value;
    try { localStorage.setItem(FREE_CODE_KEY, e.target.value); } catch(_){}
  }
});
$('menuBtn').onclick=()=>{ state.sidebar=!state.sidebar; applyLayout(); };
$('backdrop').onclick=()=>{ state.sidebar=false; applyLayout(); };
$('langBtn').onclick=()=>{ state.lang=state.lang==='ar'?'en':'ar'; save(); render(); };
window.addEventListener('resize',applyLayout);

render();
</script>
</body>
</html>
