LECTURES.push({ id:'l5', n:5,
  title:["Databases and Data Fundamentals","قواعد البيانات وأساسيات البيانات (Databases)"],
  obj:[
    ["Define a database and give examples of database types.","تعريف قاعدة البيانات (Database) وذكر أمثلة على أنواعها."],
    ["Define a database management system (DBMS) and explain its role.","تعريف نظام إدارة قواعد البيانات (DBMS) وشرح دوره."],
    ["Describe the hierarchy of data: bit, character, field, record, file, and database.","وصف التسلسل الهرمي للبيانات: البت والحرف والحقل والسجل والملف وقاعدة البيانات."],
    ["Explain entities, attributes, data items, and keys.","شرح الكيانات (Entities) والسمات (Attributes) وعناصر البيانات (Data items) والمفاتيح (Keys)."],
    ["Explain the database approach to data management.","شرح نهج قواعد البيانات في إدارة البيانات (Database approach)."]
  ],
  sec:[
   {t:["1. Introduction to Database","1. مقدمة في قواعد البيانات"], b:[
     {k:'def', x:["A database is a well-designed, organized, and carefully managed collection of data. Another definition: a collection of related data.","قاعدة البيانات (Database) هي مجموعة من البيانات جيدة التصميم ومنظمة وتُدار بعناية. تعريف آخر: مجموعة من البيانات المترابطة."]},
     {k:'p', x:["Examples of databases:","أمثلة على قواعد البيانات:"]},
     {k:'cards', c:[
       {t:["Traditional database applications","تطبيقات قواعد البيانات التقليدية"], l:[["Store textual or numeric information.","تخزن معلومات نصية أو رقمية."]]},
       {t:["Multimedia databases","قواعد بيانات الوسائط المتعددة (Multimedia)"], l:[["Store images, audio clips, and video streams digitally.","تخزن الصور والمقاطع الصوتية ومقاطع الفيديو رقميًا."]]},
       {t:["Geographic information systems (GIS)","نظم المعلومات الجغرافية (GIS)"], l:[["Store and analyze maps, weather data, and satellite images.","تخزن وتحلل الخرائط وبيانات الطقس وصور الأقمار الصناعية."]]},
       {t:["Data warehouses and OLAP systems","مستودعات البيانات (Data warehouses) ونظم المعالجة التحليلية الفورية (OLAP)"], l:[["Extract and analyze useful business information from very large databases.","تستخرج وتحلل معلومات أعمال مفيدة من قواعد بيانات ضخمة جدًا."],["Support decision making.","تدعم اتخاذ القرار."]]},
       {t:["Real-time and active database technology","تقنية قواعد البيانات الفورية والنشطة (Real-time and active)"], l:[["Control industrial and manufacturing processes.","تتحكم في العمليات الصناعية وعمليات التصنيع."]]}
     ]},
     {k:'p', x:["OLAP stands for online analytical processing.","OLAP تعني المعالجة التحليلية الفورية (Online analytical processing)."]}
   ]},
   {t:["Database Management System (DBMS)","نظام إدارة قواعد البيانات (DBMS)"], b:[
     {k:'def', x:["A database management system (DBMS) is a group of programs used to access and manage a database as well as provide an interface between the database and its users and other application programs.","نظام إدارة قواعد البيانات (DBMS) هو مجموعة من البرامج تُستخدم للوصول إلى قاعدة البيانات وإدارتها، وتوفر واجهة بين قاعدة البيانات ومستخدميها وبرامج التطبيقات الأخرى."]},
     {k:'def', x:["Another definition: the DBMS is a general-purpose software system that facilitates the processes of defining, constructing, manipulating, and sharing databases among various users and applications.","تعريف آخر: نظام DBMS هو نظام برمجي عام الغرض يسهّل عمليات تعريف قواعد البيانات (Defining) وبنائها (Constructing) ومعالجتها (Manipulating) ومشاركتها (Sharing) بين مستخدمين وتطبيقات متعددة."]},
     {k:'p', x:["In the DBMS diagram, a central database contains employee, order, inventory, pricing and customer data. The order filling system, the invoicing system, and the payroll system all use it through the DBMS.","في مخطط DBMS، تحتوي قاعدة بيانات مركزية على بيانات الموظفين والطلبات والمخزون والتسعير والعملاء. ويستخدمها نظام تنفيذ الطلبات ونظام الفواتير ونظام الرواتب عبر DBMS."]},
     {k:'ul', h:["The central database is:","قاعدة البيانات المركزية:"], x:[
       ["A central repository of shared data","مستودع مركزي للبيانات المشتركة (Central repository)"],
       ["Data is managed by a controlling agent","تُدار البيانات بواسطة عنصر تحكم (Controlling agent)"],
       ["Stored in a standardized, convenient form","مخزنة بصيغة موحدة ومريحة"]]}
   ]},
   {t:["2. Data Fundamentals","2. أساسيات البيانات"], b:[
     {k:'p', x:["2.1 Hierarchy of data","2.1 التسلسل الهرمي للبيانات (Hierarchy of Data)"]},
     {k:'ul', x:[
       ["Bit: a binary digit (i.e., 0 or 1) that represents a circuit that is either on or off.","البت (Bit): رقم ثنائي (أي 0 أو 1) يمثل دائرة إما مشغلة أو مطفأة."],
       ["Character: a basic building block of most information, consisting of uppercase letters, lowercase letters, numeric digits, or special symbols.","الحرف (Character): لبنة أساسية لمعظم المعلومات، ويتكون من أحرف كبيرة أو صغيرة أو أرقام أو رموز خاصة."],
       ["Field: typically, a name, a number, or a combination of characters that describes an aspect of a business object or activity.","الحقل (Field): عادةً اسم أو رقم أو مجموعة أحرف تصف جانبًا من كائن أو نشاط أعمال."],
       ["Record: a collection of data fields all related to one object, activity, or individual.","السجل (Record): مجموعة من حقول البيانات كلها مرتبطة بكائن أو نشاط أو فرد واحد."],
       ["File: a collection of related records.","الملف (File): مجموعة من السجلات المترابطة."],
       ["Database: at the highest level of the data hierarchy, a collection of integrated and related files.","قاعدة البيانات (Database): في أعلى مستوى من التسلسل الهرمي للبيانات، مجموعة من الملفات المتكاملة والمترابطة."]]},
     {k:'p', x:["Together, bits, characters, fields, records, files, and databases form the hierarchy of data.","تشكل البتات والأحرف والحقول والسجلات والملفات وقواعد البيانات معًا التسلسل الهرمي للبيانات."]},
     {k:'tip', x:["Characters are combined to make a field, fields are combined to make a record, records are combined to make a file, and files are combined to make a database.","تُجمع الأحرف لتكوين حقل، وتُجمع الحقول لتكوين سجل، وتُجمع السجلات لتكوين ملف، وتُجمع الملفات لتكوين قاعدة بيانات."]},

   {t:["Classification of Computer Networks","تصنيف شبكات الحاسوب"], b:[

   {t:["Geographical Span","النطاق الجغرافي (Geographical Span)"], b:[
     {k:'p', x:["Geographically, a network can be seen in one of the following categories:","من الناحية الجغرافية يمكن أن تقع الشبكة في إحدى الفئات التالية:"]},
     {k:'ul', x:[
       ["It may be spanned across your table, among Bluetooth enabled devices, ranging not more than a few meters.","قد تمتد عبر طاولتك، بين أجهزة مزودة بالبلوتوث (Bluetooth)، بمدى لا يزيد عن بضعة أمتار."],
       ["It may be spanned across a whole building, including intermediate devices to connect all floors.","قد تمتد عبر مبنى كامل، بما في ذلك أجهزة وسيطة لربط جميع الطوابق."],
       ["It may be spanned across a whole city.","قد تمتد عبر مدينة كاملة."],

       ["It may be one network covering the whole world.","قد تكون شبكة واحدة تغطي العالم بأسره."]]}
   ]},
   {t:["Inter-Connectivity","الترابط (Inter-Connectivity)"], b:[
     {k:'p', x:["Components of a network can be connected to each other differently in some fashion. By connectedness we mean either logically, physically, or both ways.","يمكن ربط مكونات الشبكة ببعضها بطرق مختلفة. ونعني بالترابط الاتصال منطقيًا (Logically) أو فعليًا (Physically) أو بالطريقتين."]},
     {k:'cards', c:[
       {t:["Mesh","الشبكة المتشابكة (Mesh)"], l:[["Every single device can be connected to every other device on the network, making the network mesh.","يمكن توصيل كل جهاز بكل جهاز آخر في الشبكة، فتصبح الشبكة متشابكة (Mesh)."]]},
       {t:["Bus-like structure","هيكل شبيه بالناقل (Bus)"], l:[["All devices can be connected to a single medium but geographically disconnected, creating a bus-like structure.","يمكن توصيل جميع الأجهزة بوسيط واحد مع كونها منفصلة جغرافيًا، فينشأ هيكل شبيه بالناقل (Bus)."]]},
       {t:["Linear structure","هيكل خطي (Linear)"], l:[["Each device is connected to its left and right peers only, creating a linear structure.","يتصل كل جهاز بنظيريه الأيسر والأيمن فقط، فينشأ هيكل خطي."]]},
       {t:["Star-like structure","هيكل شبيه بالنجمة (Star)"], l:[["All devices are connected together with a single device, creating a star-like structure.","تتصل جميع الأجهزة معًا بجهاز واحد، فينشأ هيكل شبيه بالنجمة (Star)."]]},
       {t:["Hybrid structure","هيكل هجين (Hybrid)"], l:[["All devices connected arbitrarily using all previous ways to connect each other, resulting in a hybrid structure.","تتصل جميع الأجهزة عشوائيًا باستخدام كل الطرق السابقة، فينتج هيكل هجين (Hybrid)."]]}
     ]}
   ]},
   {t:["Administration","الإدارة (Administration)"], b:[
     {k:'ul', x:[
       ["A network can be private: it belongs to a single autonomous system and cannot be accessed outside its physical or logical domain.","يمكن أن تكون الشبكة خاصة (Private): تنتمي إلى نظام مستقل واحد ولا يمكن الوصول إليها من خارج نطاقها الفعلي أو المنطقي."],
       ["A network can be public: it is accessed by all.","ويمكن أن تكون عامة (Public): يصل إليها الجميع."]]},
     {k:'ul', h:["Three forms:","ثلاثة أشكال:"], x:[["Intranet","الإنترانت (Intranet)"],["Extranet","الإكسترانت (Extranet)"],["Internet","الإنترنت (Internet)"]]}
   ]},
   {t:["Network Architecture","بنية الشبكة (Network Architecture)"], b:[
     {k:'p', x:["Computer networks can be discriminated into various types such as client-server, peer-to-peer, or hybrid, depending upon their architecture.","يمكن تمييز شبكات الحاسوب إلى أنواع مختلفة مثل العميل-الخادم (Client-Server) والنظير للنظير (Peer-to-peer) أو الهجينة (Hybrid)، بحسب بنيتها."]},
     {k:'cards', c:[
       {t:["Client-Server","العميل-الخادم (Client-Server)"], l:[["There can be one or more systems acting as server. The others, being clients, request the server to serve requests. The server takes and processes requests on behalf of clients.","يمكن أن يعمل نظام واحد أو أكثر كخادم (Server). والأنظمة الأخرى، بصفتها عملاء (Clients)، تطلب من الخادم تلبية الطلبات. يستقبل الخادم الطلبات ويعالجها نيابةً عن العملاء."]]},
       {t:["Peer-to-Peer","النظير للنظير (Peer-to-Peer)"], l:[["Two systems can be connected point-to-point, or in back-to-back fashion. They both reside at the same level and are called peers.","يمكن ربط نظامين نقطة-إلى-نقطة (Point-to-point) أو بشكل ظهر-إلى-ظهر (Back-to-back). يقعان في المستوى نفسه ويُسميان أنداد (Peers)."]]},
       {t:["Hybrid","الهجين (Hybrid)"], l:[["There can be a hybrid network which involves network architecture of both the above types.","يمكن أن توجد شبكة هجينة تتضمن بنية الشبكة من النوعين أعلاه."]]}
     ]}
   ]},

       ["Information sharing by using the Web or Internet.","مشاركة المعلومات عبر الويب أو الإنترنت."],
       ["Interaction with other users using dynamic web pages.","التفاعل مع المستخدمين الآخرين عبر صفحات الويب الديناميكية (Dynamic web pages)."],

  take:[
   ["A network is 2 or more computers (nodes) connected by links that communicate and share resources.","الشبكة حاسوبان أو أكثر (عُقد) متصلة بروابط تتواصل وتشارك الموارد."],

   ["Networks are classified by geographical span, inter-connectivity, administration, and architecture.","تُصنَّف الشبكات حسب النطاق الجغرافي والترابط والإدارة والبنية."],

  fc:[
   [["What is a computer network?","ما هي شبكة الحاسوب؟"],["Two or more computers connected together that can communicate and share resources (hardware, software, data/information, etc.).","حاسوبان أو أكثر متصلان معًا يمكنهما التواصل ومشاركة الموارد (عتاد وبرمجيات وبيانات/معلومات وغيرها)."]],
   [["What is a node?","ما هي العقدة (Node)؟"],["A computer, printer, or any other device capable of sending and/or receiving data generated by other nodes on the network.","حاسوب أو طابعة أو أي جهاز قادر على إرسال و/أو استقبال البيانات التي تولّدها عُقد أخرى في الشبكة."]],
   [["What criteria must a network meet?","ما المعايير التي يجب أن تفي بها الشبكة؟"],["Performance, reliability, standardization, and security.","الأداء والموثوقية والتوحيد القياسي والأمان."]],
   [["How can computers connect to each other?","كيف يمكن للحواسيب الاتصال ببعضها؟"],["By wired or wireless media.","عبر وسائط سلكية أو لاسلكية."]],
   [["Name the 5 parts of the simplified communications model.","اذكر الأجزاء الخمسة لنموذج الاتصال المبسط."],["Source, transmitter, transmission system, receiver, destination.","المصدر، المرسل، نظام الإرسال، المستقبل، الوجهة."]],
   [["Define source, transmitter, transmission system, receiver, destination.","عرّف المصدر والمرسل ونظام الإرسال والمستقبل والوجهة."],["Source generates data; transmitter converts data into transmittable signals; transmission system carries data; receiver converts received signal into data; destination takes incoming data.","المصدر يولّد البيانات؛ المرسل يحوّلها إلى إشارات؛ نظام الإرسال ينقل البيانات؛ المستقبل يحوّل الإشارة إلى بيانات؛ الوجهة تستلم البيانات."]],
   [["What are the uses of computer networks?","ما استخدامات شبكات الحاسوب؟"],["Business applications (sharing resources, e-commerce); home applications (remote information, person-to-person communication, interactive entertainment, e-commerce); mobile users; social issues.","تطبيقات الأعمال (مشاركة الموارد والتجارة الإلكترونية)؛ التطبيقات المنزلية (معلومات عن بُعد، تواصل بين الأشخاص، ترفيه تفاعلي، تجارة إلكترونية)؛ المستخدمون المتنقلون؛ القضايا الاجتماعية."]],
   [["Why do we need computer networks? (list)","لماذا نحتاج شبكات الحاسوب؟ (قائمة)"],["Sharing resources; distributing processing; centralized control for geographically distributed systems; centralized management and allocation of resources; compatibility of dissimilar equipment and software; maximum performance at minimum cost; efficient transport of large volumes of data among remote locations.","مشاركة الموارد؛ توزيع المعالجة؛ تحكم مركزي لنظام موزع جغرافيًا؛ إدارة مركزية وتخصيص للموارد؛ توافق المعدات والبرمجيات المختلفة؛ أقصى أداء بأقل تكلفة؛ نقل فعال لكميات كبيرة من البيانات بين مواقع بعيدة."]],
   [["Name the advantages of computer networks.","اذكر مزايا شبكات الحاسوب."],["Resource sharing, high reliability, low cost/saving money, communications, Internet access sharing, data security and management.","مشاركة الموارد، موثوقية عالية، تكلفة منخفضة/توفير المال، الاتصالات، مشاركة الوصول إلى الإنترنت، أمن البيانات وإدارتها."]],
   [["Name the disadvantages of computer networks.","اذكر عيوب شبكات الحاسوب."],["Network hardware, software and setup costs; hardware and software management and administration costs; undesirable sharing; illegal or undesirable behavior; data security concerns.","تكاليف عتاد الشبكة وبرمجياتها وإعدادها؛ تكاليف الإدارة؛ المشاركة غير المرغوبة؛ سلوك غير قانوني أو غير مرغوب؛ مخاوف أمن البيانات."]],
   [["On what factors are networks classified?","على أي عوامل تُصنَّف الشبكات؟"],["Geographical span, inter-connectivity, administration, architecture.","النطاق الجغرافي، الترابط، الإدارة، البنية."]],
   [["Describe the geographical span categories.","صف فئات النطاق الجغرافي."],["Across a table (Bluetooth devices, a few meters); a whole building; a whole city; multiple cities or provinces; one network covering the whole world.","عبر طاولة (أجهزة بلوتوث، بضعة أمتار)؛ مبنى كامل؛ مدينة كاملة؛ عدة مدن أو مقاطعات؛ شبكة واحدة تغطي العالم."]],
   [["Describe the five inter-connectivity structures.","صف هياكل الترابط الخمسة."],["Mesh: every device connected to every other. Bus-like: all connected to a single medium. Linear: each connected to left and right peers only. Star-like: all connected to one device. Hybrid: arbitrary combination of the previous ways.","متشابكة: كل جهاز موصول بكل جهاز. شبيهة بالناقل: الكل موصول بوسيط واحد. خطية: كل جهاز موصول بنظيريه الأيسر والأيمن. شبيهة بالنجمة: الكل موصول بجهاز واحد. هجينة: مزيج عشوائي من الطرق السابقة."]],
   [["Private vs public networks?","الشبكة الخاصة مقابل العامة؟"],["Private: belongs to a single autonomous system and cannot be accessed outside its physical or logical domain. Public: accessed by all.","الخاصة: تنتمي إلى نظام مستقل واحد ولا يُوصل إليها من خارج نطاقها. العامة: يصل إليها الجميع."]],
   [["What are the three forms of network administration?","ما الأشكال الثلاثة لإدارة الشبكة؟"],["Intranet, extranet, Internet.","إنترانت، إكسترانت، إنترنت."]],
   [["Explain client-server architecture.","اشرح بنية العميل-الخادم."],["One or more systems act as server. Other systems, the clients, request the server to serve requests. The server takes and processes requests on behalf of clients.","نظام أو أكثر يعمل كخادم. والأنظمة الأخرى (العملاء) تطلب من الخادم تلبية الطلبات، فيستقبلها الخادم ويعالجها نيابةً عنهم."]],
   [["Explain peer-to-peer architecture.","اشرح بنية النظير للنظير."],["Two systems connected point-to-point or back-to-back. They reside at the same level and are called peers.","نظامان متصلان نقطة-إلى-نقطة أو ظهر-إلى-ظهر. يقعان في المستوى نفسه ويُسميان أنداد."]],
   [["What is a hybrid network?","ما هي الشبكة الهجينة؟"],["A network that involves the network architecture of both client-server and peer-to-peer.","شبكة تتضمن بنية كلٍّ من العميل-الخادم والنظير للنظير."]],
   [["Give 8 examples of network applications.","اذكر 8 أمثلة على تطبيقات الشبكات."],["Resource sharing (printers, storage); e-mail and file transfer; information sharing via Web/Internet; dynamic web pages; IP phones; video conferences; parallel computing; instant messaging.","مشاركة الموارد (الطابعات والتخزين)؛ البريد الإلكتروني ونقل الملفات؛ مشاركة المعلومات عبر الويب/الإنترنت؛ صفحات الويب الديناميكية؛ هواتف IP؛ مؤتمرات الفيديو؛ الحوسبة المتوازية؛ المراسلة الفورية."]]
  ],

   {t:["Network Topologies","طوبولوجيات الشبكات (Network Topologies)"], b:[

     {k:'p', x:["The path data travels between computers on a network is considered the network’s logical topology.","المسار الذي تسلكه البيانات بين الحواسيب في الشبكة يُعتبر الطوبولوجيا المنطقية (Logical topology) للشبكة."]},

   ]},
   {t:["Star Topology","طوبولوجيا النجمة (Star)"], b:[
     {k:'ul', x:[
       ["A network in which all network devices connect to one another through a single central device called the hub node.","شبكة تتصل فيها جميع أجهزة الشبكة ببعضها عبر جهاز مركزي واحد يسمى عقدة المركز (Hub node)."],
       ["A failure in any link of the star network will isolate only the device connected to that link.","تعطل أي رابط في شبكة النجمة يعزل الجهاز المتصل بذلك الرابط فقط."],
       ["However, should the hub fail, all devices on the entire network will be unable to communicate.","لكن إذا تعطل الموزّع (Hub)، ستعجز جميع الأجهزة في الشبكة بأكملها عن التواصل."]]}

   {t:["Bus Topology","طوبولوجيا الناقل (Bus)"], b:[
     {k:'ul', x:[
       ["A network in which all network devices are connected to a common backbone (bus) that serves as a shared communications medium.","شبكة تتصل فيها جميع الأجهزة بعمود فقري مشترك (Backbone / Bus) يعمل كوسيط اتصال مشترك."],
       ["To communicate with any other device on the network, a device sends a broadcast message onto the communications medium.","للتواصل مع أي جهاز آخر في الشبكة، يرسل الجهاز رسالة بث (Broadcast) على وسيط الاتصال."],
       ["All devices on the network can “see” the message, but only the intended recipient actually accepts and processes the message.","يمكن لجميع الأجهزة في الشبكة “رؤية” الرسالة، لكن المستلم المقصود فقط هو من يقبلها ويعالجها."]]}
   ]},
   {t:["Ring Topology","طوبولوجيا الحلقة (Ring)"], b:[
     {k:'ul', x:[
       ["In a ring topology, every device is connected in a circular fashion with each node linked to two other nodes.","في طوبولوجيا الحلقة، يتصل كل جهاز بشكل دائري بحيث تكون كل عقدة مرتبطة بعقدتين أخريين."],
       ["Packet: a packet is a message that’s sent over the network from one node to another.","الحزمة (Packet): رسالة تُرسل عبر الشبكة من عقدة إلى أخرى."],
       ["Each computer looks at each packet to decide whether the packet was intended for it. If not, the packet is passed on to the next computer in the ring.","يفحص كل حاسوب كل حزمة ليقرر هل هي موجهة إليه. وإن لم تكن، تُمرَّر الحزمة إلى الحاسوب التالي في الحلقة."]]}
   ]},
   {t:["Mesh Topology","طوبولوجيا الشبكة المتشابكة (Mesh)"], b:[
     {k:'p', x:["A mesh topology connects each device to every other device in a network.","تربط الطوبولوجيا المتشابكة كل جهاز بكل جهاز آخر في الشبكة."]},
     {k:'cards', c:[

       {t:["Partially Mesh","متشابكة جزئيًا (Partially Mesh)"], l:[["Only some nodes have direct links with each other.","بعض العقد فقط لها روابط مباشرة ببعضها."]]}

   {t:["Point-to-Point Topology (P2P)","طوبولوجيا نقطة-إلى-نقطة (Point-to-Point)"], b:[
     {k:'def', x:["A Point-to-Point topology (P2P) is a direct link between two devices. Most often used in Wide Area Networks (WANs). Used for specialized purposes.","طوبولوجيا نقطة-إلى-نقطة (P2P) هي رابط مباشر بين جهازين. وتُستخدم غالبًا في الشبكات واسعة النطاق (WANs). وتُستخدم لأغراض متخصصة."]},
     {k:'ul', h:["Common Uses","الاستخدامات الشائعة"], x:[

     {k:'tbl', h:[["Advantages","المزايا"],["Disadvantages","العيوب"]],
      r:[
       [["Data travels on a dedicated link.","تنتقل البيانات على رابط مخصص."],["Can be quite expensive, especially for long-distance WAN links.","قد تكون مكلفة جدًا، خصوصًا لروابط WAN بعيدة المدى."]],
       [["Bandwidth is not shared with other networks.","لا يُشارَك عرض النطاق الترددي (Bandwidth) مع شبكات أخرى."],["Allows only two computers on the network.","تسمح بحاسوبين فقط على الشبكة."]]
      ]},
     {k:'ul', h:["Other Applications","تطبيقات أخرى"], x:[
       ["Used in wireless networks as a wireless bridge.","تُستخدم في الشبكات اللاسلكية كجسر لاسلكي (Wireless bridge)."],
       ["Connects two buildings without a wired network.","تربط مبنيين دون شبكة سلكية."],
       ["Extends an existing wireless network.","تمدّ شبكة لاسلكية قائمة."],
       ["Connects two computers directly for file transfer when a switch is unavailable.","تربط حاسوبين مباشرة لنقل الملفات عند عدم توفر مبدّل (Switch)."]]}
   ]},
   {t:["Network Devices","أجهزة الشبكة (Network Devices)"], b:[
     {k:'cards', c:[
       {t:["1- Network Interface Card (NIC)","1- بطاقة واجهة الشبكة (NIC)"], l:[["NIC provides the physical interface between computer and cabling.","توفر NIC الواجهة المادية بين الحاسوب والكابلات."],["It prepares data, sends data, and controls the flow of data. It can also receive and translate data into bytes for the CPU to understand.","تُجهّز البيانات وترسلها وتتحكم في تدفقها. ويمكنها أيضًا استقبال البيانات وترجمتها إلى بايتات ليفهمها المعالج (CPU)."]]},
       {t:["2- Hub","2- الموزّع (Hub)"], l:[["A network hub is a basic physical-layer (Layer 1) networking device that connects multiple Ethernet devices to act as a single network segment.","الموزّع (Hub) جهاز شبكات أساسي في الطبقة المادية (الطبقة 1) يربط عدة أجهزة Ethernet لتعمل كقطاع شبكة واحد."],["It acts as a multi-port repeater, receiving data from one port and broadcasting it to all other ports, leading to inefficient bandwidth usage and shared collision domains.","يعمل كمكرر متعدد المنافذ (Multi-port repeater)، يستقبل البيانات من منفذ ويبثها إلى جميع المنافذ الأخرى، مما يؤدي إلى استخدام غير فعال لعرض النطاق ومجالات تصادم مشتركة (Shared collision domains)."]]},
       {t:["3- Router","3- الموجّه (Router)"], l:[["Routers are highly intelligent devices that connect multiple network types and determine the best path for sending data.","الموجّهات أجهزة ذكية جدًا تربط أنواعًا متعددة من الشبكات وتحدد أفضل مسار لإرسال البيانات."],["Routers are normally used to connect one LAN to another.","تُستخدم الموجّهات عادةً لربط شبكة LAN بأخرى."],["Typically, when a WAN is set up, there will be at least two routers used.","عادةً عند إنشاء شبكة WAN، يُستخدم موجّهان على الأقل."]]},
       {t:["4- Switch","4- المبدّل (Switch)"], l:[["A switch is a data link layer device.","المبدّل (Switch) جهاز في طبقة ربط البيانات (Data link layer)."],["A network switch is a computer networking device that connects network segments.","المبدّل جهاز شبكات يربط قطاعات الشبكة."],["Network switches are capable of inspecting data packets as they are received, determining the source and destination device of that packet, and forwarding it appropriately.","يستطيع المبدّل فحص حزم البيانات فور استقبالها، وتحديد جهاز المصدر والوجهة للحزمة، وإعادة توجيهها بشكل مناسب."]]}
     ]},
     {k:'tip', x:["Hub = broadcasts to all ports (Layer 1). Switch = inspects packets and forwards them appropriately (data link layer). Router = connects networks and chooses the best path.","Hub = يبث إلى كل المنافذ (الطبقة 1). Switch = يفحص الحزم ويوجهها بشكل مناسب (طبقة ربط البيانات). Router = يربط الشبكات ويختار أفضل مسار."]}
   ]}

   ["Physical topology is the structure; logical topology is the path data travels.","الطوبولوجيا الفعلية هي الهيكل؛ والمنطقية هي مسار البيانات."],

  fc:[
   [["On what factors are network types classified?","على أي عوامل تُصنَّف أنواع الشبكات؟"],["Geographical area, transmission medium, ownership and access control.","المنطقة الجغرافية، وسيط الإرسال، الملكية والتحكم في الوصول."]],
   [["What is a PAN?","ما هي شبكة PAN؟"],["Personal Area Network: connects personal devices within a very short range around a single user. Range 1–10 m. Technologies: Bluetooth, NFC, Infrared. Example: smartphone with wireless earbuds.","شبكة شخصية: تربط الأجهزة الشخصية ضمن نطاق قصير جدًا حول مستخدم واحد. المدى 1–10 م. التقنيات: Bluetooth وNFC وInfrared. مثال: هاتف مع سماعات لاسلكية."]],
   [["What is a LAN?","ما هي شبكة LAN؟"],["Local Area Network: connects computers and devices within a limited area (home, office, building). Range: one room, building, or small campus. Technologies: Ethernet, Wi-Fi. Example: home or office Wi-Fi.","شبكة محلية: تربط الحواسيب والأجهزة ضمن منطقة محدودة (منزل أو مكتب أو مبنى). المدى: غرفة أو مبنى أو حرم صغير. التقنيات: Ethernet وWi-Fi. مثال: Wi-Fi منزلي أو مكتبي."]],
   [["Can a LAN extend beyond one building?","هل يمكن أن تمتد LAN لأكثر من مبنى؟"],["Usually a LAN is within a single building, but it can extend to several buildings on a campus.","عادةً تكون LAN داخل مبنى واحد، لكن قد تمتد إلى عدة مبانٍ في حرم جامعي."]],
   [["What is a MAN?","ما هي شبكة MAN؟"],["Metropolitan Area Network: connects multiple networks within a city or metropolitan region. Range: city or large town. Technologies: fiber optics, microwave, Metro Ethernet. Example: city-wide ISP network.","شبكة حضرية: تربط عدة شبكات داخل مدينة أو منطقة حضرية. المدى: مدينة أو بلدة كبيرة. التقنيات: ألياف ضوئية وموجات دقيقة وMetro Ethernet. مثال: شبكة ISP على مستوى المدينة."]],
   [["What is a WAN?","ما هي شبكة WAN؟"],["Wide Area Network: connects networks over large geographical areas such as countries or continents. Technologies: leased lines, satellite links, Internet. Example: the Internet.","شبكة واسعة النطاق: تربط الشبكات عبر مناطق جغرافية كبيرة مثل الدول والقارات. التقنيات: خطوط مستأجرة وأقمار صناعية وإنترنت. مثال: الإنترنت."]],
   [["What is network topology?","ما هي طوبولوجيا الشبكة؟"],["The shape or structure of a network, including the arrangement of the communication links and hardware devices (physical topology).","شكل الشبكة أو هيكلها بما في ذلك ترتيب روابط الاتصال وأجهزة العتاد (الطوبولوجيا الفعلية)."]],
   [["What is logical topology?","ما هي الطوبولوجيا المنطقية؟"],["The path data travels between computers on a network.","المسار الذي تسلكه البيانات بين الحواسيب في الشبكة."]],
   [["List the 5 topologies.","اذكر الطوبولوجيات الخمس."],["Bus, star, ring, mesh, point-to-point.","الناقل، النجمة، الحلقة، المتشابكة، نقطة-إلى-نقطة."]],
   [["Describe star topology and what happens on failure.","صف طوبولوجيا النجمة وماذا يحدث عند التعطل."],["All devices connect through a single central hub node. A failed link isolates only that device; if the hub fails, all devices cannot communicate.","تتصل كل الأجهزة عبر موزّع مركزي واحد. تعطل رابط يعزل ذلك الجهاز فقط؛ وإذا تعطل الموزّع تعجز كل الأجهزة عن التواصل."]],
   [["Describe bus topology.","صف طوبولوجيا الناقل."],["All devices connect to a common backbone (bus) that serves as a shared communications medium. A device sends a broadcast message; all can “see” it, but only the intended recipient accepts and processes it.","تتصل كل الأجهزة بعمود فقري مشترك يعمل كوسيط اتصال مشترك. يرسل الجهاز رسالة بث؛ يراها الجميع لكن المستلم المقصود فقط يقبلها ويعالجها."]],
   [["Describe ring topology and what a packet is.","صف طوبولوجيا الحلقة وما هي الحزمة."],["Every device is connected in a circular fashion, each node linked to two other nodes. A packet is a message sent over the network from one node to another. Each computer checks each packet; if not for it, it passes it to the next computer.","كل جهاز متصل بشكل دائري وكل عقدة مرتبطة بعقدتين. الحزمة رسالة تُرسل من عقدة إلى أخرى. يفحص كل حاسوب الحزمة وإن لم تكن له يمررها إلى الحاسوب التالي."]],
   [["Fully mesh vs partially mesh?","المتشابكة بالكامل مقابل الجزئية؟"],["Fully mesh: every node is connected to every other node. Partially mesh: only some nodes have direct links with each other.","بالكامل: كل عقدة متصلة بكل عقدة أخرى. جزئيًا: بعض العقد فقط لها روابط مباشرة."]],
   [["What is a point-to-point topology and where is it mostly used?","ما هي طوبولوجيا نقطة-إلى-نقطة وأين تُستخدم غالبًا؟"],["A direct link between two devices. Used mostly in WANs and for specialized purposes.","رابط مباشر بين جهازين. تُستخدم غالبًا في شبكات WAN ولأغراض متخصصة."]],
   [["Common uses of point-to-point?","الاستخدامات الشائعة لنقطة-إلى-نقطة؟"],["Connects a business network to a telecom provider; provides Internet access; creates a WAN or MAN link to a branch office. Used more in WANs and large internetworks than LANs.","تربط شبكة شركة بمزود اتصالات؛ توفر الوصول إلى الإنترنت؛ تنشئ رابط WAN أو MAN إلى فرع. تُستخدم في WAN والشبكات البينية الكبيرة أكثر من LAN."]],
   [["Advantages and disadvantages of point-to-point?","مزايا وعيوب نقطة-إلى-نقطة؟"],["Advantages: data travels on a dedicated link; bandwidth is not shared. Disadvantages: can be expensive for long-distance WAN links; allows only two computers.","المزايا: بيانات على رابط مخصص؛ عرض النطاق غير مشترك. العيوب: مكلفة لروابط WAN بعيدة؛ تسمح بحاسوبين فقط."]],
   [["Other applications of point-to-point?","تطبيقات أخرى لنقطة-إلى-نقطة؟"],["Wireless bridge; connects two buildings without a wired network; extends an existing wireless network; connects two computers directly for file transfer when a switch is unavailable.","جسر لاسلكي؛ ربط مبنيين دون شبكة سلكية؛ تمديد شبكة لاسلكية قائمة؛ ربط حاسوبين مباشرة لنقل الملفات عند عدم وجود مبدّل."]],
   [["What does a NIC do?","ماذا تفعل بطاقة NIC؟"],["Provides the physical interface between the computer and cabling; prepares data, sends data, and controls the flow of data; receives and translates data into bytes for the CPU.","توفر الواجهة المادية بين الحاسوب والكابلات؛ تجهّز البيانات وترسلها وتتحكم في تدفقها؛ وتستقبل البيانات وتترجمها إلى بايتات للمعالج."]],
   [["What is a hub?","ما هو الموزّع (Hub)؟"],["A basic physical-layer (Layer 1) device that connects multiple Ethernet devices as a single network segment. A multi-port repeater that broadcasts data from one port to all other ports, leading to inefficient bandwidth usage and shared collision domains.","جهاز أساسي في الطبقة المادية (الطبقة 1) يربط عدة أجهزة Ethernet كقطاع واحد. مكرر متعدد المنافذ يبث البيانات من منفذ إلى بقية المنافذ، مما يسبب استخدامًا غير فعال لعرض النطاق ومجالات تصادم مشتركة."]],
   [["What does a router do?","ماذا يفعل الموجّه؟"],["A highly intelligent device that connects multiple network types and determines the best path for sending data. Normally connects one LAN to another; a WAN setup typically uses at least two routers.","جهاز ذكي جدًا يربط أنواعًا متعددة من الشبكات ويحدد أفضل مسار لإرسال البيانات. يربط عادةً LAN بأخرى؛ وإعداد WAN يستخدم عادةً موجّهين على الأقل."]],
   [["What does a switch do?","ماذا يفعل المبدّل؟"],["A data link layer device that connects network segments. It inspects data packets, determines their source and destination device, and forwards them appropriately.","جهاز في طبقة ربط البيانات يربط قطاعات الشبكة. يفحص حزم البيانات ويحدد جهازي المصدر والوجهة ويوجّهها بشكل مناسب."]]
  ],

   {t:["1.2 How the Internet Works","1.2 كيف يعمل الإنترنت (How the Internet Works)"], b:[
     {k:'p', x:["In the early days of the Internet, the major communications companies around the world agreed to connect their networks so that users on all the networks could share information over the Internet.","في الأيام الأولى للإنترنت، اتفقت شركات الاتصالات الكبرى حول العالم على ربط شبكاتها ليتمكن المستخدمون في جميع الشبكات من تبادل المعلومات عبر الإنترنت."]},
     {k:'def', x:["These large communications companies are called network service providers (NSPs). They include Verizon, Sprint, British Telecom, and AT&T.","تسمى هذه الشركات الكبرى للاتصالات مزودي خدمة الشبكة (Network service providers - NSPs). ومنها Verizon وSprint وBritish Telecom وAT&T."]},
     {k:'p', x:["The networks connected through use of the Internet protocol (IP).","تتصل الشبكات باستخدام بروتوكول الإنترنت (Internet protocol - IP)."]},
     {k:'def', x:["Internet Protocol (IP): a communication standard that enables computers to route communications traffic from one network to another as needed.","بروتوكول الإنترنت (IP): معيار اتصال يمكّن الحواسيب من توجيه حركة الاتصالات من شبكة إلى أخرى حسب الحاجة."]},
     {k:'def', x:["Internet backbone: one of the Internet’s high-speed, long-distance communications links (e.g., fiber-optic cables).","العمود الفقري للإنترنت (Internet backbone): أحد وصلات الاتصال عالية السرعة وبعيدة المدى في الإنترنت (مثل كابلات الألياف الضوئية)."]},
     {k:'p', x:["The Internet transmits data from one computer (called a host) to another.","ينقل الإنترنت البيانات من حاسوب (يسمى المضيف - Host) إلى آخر."]},
     {k:'p', x:["The data passes through the network in chunks called packets, each of which carries the addresses of its sender and receiver along with other technical information.","تمر البيانات عبر الشبكة في أجزاء تسمى حزمًا (Packets)، تحمل كل منها عنوان المرسل والمستقبل مع معلومات تقنية أخرى."]},
     {k:'p', x:["The set of rules used to pass packets from one host to another is the IP protocol.","مجموعة القواعد المستخدمة لتمرير الحزم من مضيف إلى آخر هي بروتوكول IP."]},
     {k:'p', x:["Many other communications protocols are used in connection with IP. The best known is the Transmission Control Protocol (TCP).","تُستخدم بروتوكولات اتصال أخرى كثيرة مع IP. وأشهرها بروتوكول التحكم في الإرسال (Transmission Control Protocol - TCP)."]},
     {k:'p', x:["After a network following these standards links to the Internet’s backbone, it becomes part of the worldwide Internet community.","بعد أن ترتبط شبكة تتبع هذه المعايير بالعمود الفقري للإنترنت، تصبح جزءًا من مجتمع الإنترنت العالمي."]},
     {k:'def', x:["Each computer on the Internet has an assigned address, called its IP address, that identifies it on the Internet.","لكل حاسوب على الإنترنت عنوان مخصص يسمى عنوان IP (IP address) يحدده على الإنترنت."]},
     {k:'p', x:["Because people prefer to work with words rather than numbers, a system called the Domain Name System (DNS) was created. Domain names such as www.yahoo.com are mapped to IP addresses such as 69.32.133.79 using the DNS.","لأن الناس يفضلون العمل بالكلمات بدلًا من الأرقام، أُنشئ نظام يسمى نظام أسماء النطاقات (Domain Name System - DNS). تُربط أسماء النطاقات مثل www.yahoo.com بعناوين IP مثل 69.32.133.79 باستخدام DNS."]},
     {k:'formula', x:"www.yahoo.com  --DNS-->  69.32.133.79"},
     {k:'p', x:["Routing messages over the Internet: data is transmitted from one host computer to another on the Internet.","توجيه الرسائل عبر الإنترنت: تُنقل البيانات من حاسوب مضيف إلى آخر على الإنترنت."]}
   ]},
   {t:["1.3 Accessing the Internet","1.3 الوصول إلى الإنترنت (Accessing the Internet)"], b:[
     {k:'cards', c:[
       {t:["1. Connecting via a LAN Server","1. الاتصال عبر خادم الشبكة المحلية (LAN Server)"], l:[["This approach is used by businesses and organizations that manage a local area network (LAN).","يستخدم هذا النهج من قبل الشركات والمنظمات التي تدير شبكة محلية (LAN)."],["By connecting a server on the LAN to the Internet using a router, all users on the LAN are provided access to the Internet.","بربط خادم في الشبكة المحلية بالإنترنت باستخدام موجّه (Router)، يحصل جميع مستخدمي الشبكة على إمكانية الوصول إلى الإنترنت."]]},
       {t:["2. Connecting via Internet Service Providers","2. الاتصال عبر مزودي خدمة الإنترنت (ISPs)"], l:[["Companies and residences unable to connect directly to the Internet through a LAN server must access the Internet through an Internet service provider.","الشركات والمساكن غير القادرة على الاتصال مباشرة بالإنترنت عبر خادم LAN يجب أن تصل إلى الإنترنت عبر مزود خدمة إنترنت."]]},
       {t:["3. Wireless Connection","3. الاتصال اللاسلكي (Wireless Connection)"], l:[["Thousands of public Wi-Fi services are available in coffee shops, airports, hotels, and elsewhere, where Internet access is provided free, for an hourly rate, or for a monthly subscription fee.","تتوافر آلاف خدمات Wi-Fi العامة في المقاهي والمطارات والفنادق وغيرها، حيث يُقدَّم الوصول إلى الإنترنت مجانًا أو بسعر بالساعة أو برسوم اشتراك شهرية."]]}
     ]}
   ]},
   {t:["2. The World Wide Web","2. الشبكة العنكبوتية العالمية (The World Wide Web)"], b:[
     {k:'p', x:["The World Wide Web was developed by Tim Berners-Lee at CERN, the European Organization for Nuclear Research in Geneva.","طوّر الويب (World Wide Web) تيم بيرنرز-لي (Tim Berners-Lee) في CERN، المنظمة الأوروبية للأبحاث النووية في جنيف."]},
     {k:'p', x:["He realized the potential of combining Internet technology with the concept of linked documents, called hypertext.","أدرك إمكانات الجمع بين تقنية الإنترنت ومفهوم المستندات المترابطة، المسمى النص التشعبي (Hypertext)."]},
     {k:'def', x:["Hyperlink: highlighted text or graphics in a Web document that, when clicked, opens a new Web page containing related content.","الرابط التشعبي (Hyperlink): نص أو رسومات مميزة في مستند ويب، عند النقر عليها تفتح صفحة ويب جديدة تحتوي على محتوى ذي صلة."]},
     {k:'def', x:["Hypertext documents are normally transferred between browsers and web servers using a protocol known as the Hypertext Transfer Protocol (HTTP).","تُنقل مستندات النص التشعبي عادةً بين المتصفحات وخوادم الويب باستخدام بروتوكول يعرف باسم بروتوكول نقل النص التشعبي (Hypertext Transfer Protocol - HTTP)."]},
     {k:'def', x:["A Uniform Resource Locator (URL) is a Web address that specifies the exact location of a Web page using letters and words that map to an IP address and a location on the host.","محدد موقع الموارد الموحد (Uniform Resource Locator - URL) هو عنوان ويب يحدد الموقع الدقيق لصفحة ويب باستخدام حروف وكلمات تُربط بعنوان IP وموقع على المضيف."]},
     {k:'ex', x:["Example: http://www.google.com.sa","مثال: http://www.google.com.sa"]},
     {k:'p', x:["The “www” part of the address signifies that the address is associated with the World Wide Web service.","يشير الجزء “www” من العنوان إلى أن العنوان مرتبط بخدمة الشبكة العنكبوتية العالمية."]},
     {k:'p', x:["Many Internet addresses have a code denoting affiliation categories, such as com for business sites and edu for education sites.","تحتوي عناوين إنترنت كثيرة على رمز يدل على فئات الانتماء، مثل com للمواقع التجارية وedu للمواقع التعليمية."]},
     {k:'def', x:["A website is simply data which is stored on a www server and which can be freely accessed by people “surfing the web”.","الموقع الإلكتروني (Website) هو ببساطة بيانات مخزنة على خادم www يمكن للناس الوصول إليها بحرية أثناء “تصفح الويب”."]},
     {k:'def', x:["Web browser: Web client software used to view Web pages.","متصفح الويب (Web browser): برنامج عميل للويب يُستخدم لعرض صفحات الويب."]},
     {k:'p', x:["Some websites can store hidden information about you on your hard disk using cookies.","يمكن لبعض المواقع تخزين معلومات مخفية عنك على قرصك الصلب باستخدام ملفات الكوكيز (Cookies)."]},
     {k:'def', x:["Internet cache: each time you display a website within your web browser, a copy of the information (both text and pictures) is saved on your hard disk.","الذاكرة المخبئية للإنترنت (Internet cache): في كل مرة تعرض فيها موقعًا في متصفحك تُحفظ نسخة من المعلومات (النصوص والصور) على قرصك الصلب."]},
     {k:'def', x:["FTP (File Transfer Protocol) is just a way of transferring data from one place to another over the Internet.","FTP (بروتوكول نقل الملفات - File Transfer Protocol) هو ببساطة طريقة لنقل البيانات من مكان إلى آخر عبر الإنترنت."]}
   ]}
  ],
  take:[
   ["The Internet is a collection of connected networks built and maintained by ISPs.","الإنترنت مجموعة شبكات متصلة تبنيها وتصونها شركات ISPs."],
   ["ARPANET (1969, U.S. DoD) was the ancestor of the Internet.","ARPANET (عام 1969، وزارة الدفاع الأمريكية) كان سلف الإنترنت."],
   ["IP routes traffic between networks; TCP is the best known protocol used with IP.","IP يوجّه الحركة بين الشبكات؛ وTCP أشهر بروتوكول يُستخدم مع IP."],
   ["Data travels in packets that carry sender and receiver addresses.","تنتقل البيانات في حزم تحمل عنواني المرسل والمستقبل."],
   ["DNS maps domain names (www.yahoo.com) to IP addresses (69.32.133.79).","DNS يربط أسماء النطاقات (www.yahoo.com) بعناوين IP (69.32.133.79)."],
   ["The Web was developed by Tim Berners-Lee at CERN; it uses hypertext, HTTP, and URLs.","طوّر الويب تيم بيرنرز-لي في CERN؛ ويستخدم النص التشعبي وHTTP وURL."]

  fc:[
   [["What is the Internet?","ما هو الإنترنت؟"],["A collection of connected networks, generally constructed and maintained by organizations called Internet Service Providers (ISPs).","مجموعة شبكات متصلة تبنيها وتصونها عمومًا منظمات تسمى مزودي خدمة الإنترنت (ISPs)."]],
   [["What was ARPANET?","ما هو ARPANET؟"],["The ancestor of the Internet, a project started by the U.S. Department of Defense (DoD) in 1969.","سلف الإنترنت، مشروع بدأته وزارة الدفاع الأمريكية عام 1969."]],
   [["What was the goal of ARPANET?","ما هدف ARPANET؟"],["To link a variety of computer networks so they could function as a connected system that would not be disrupted by local disasters.","ربط مجموعة متنوعة من شبكات الحاسوب لتعمل كنظام متصل لا تعطله الكوارث المحلية."]],
   [["What is DARPA?","ما هي DARPA؟"],["The Defense Advanced Research Projects Agency, through which the U.S. government sponsored much of the work. Later the Internet shifted from a government project to an academic research project.","وكالة مشاريع البحوث المتقدمة الدفاعية، التي رعت من خلالها الحكومة الأمريكية جزءًا كبيرًا من العمل. ثم تحوّل الإنترنت لاحقًا من مشروع حكومي إلى مشروع بحث أكاديمي."]],
   [["What are NSPs? Give examples.","ما هي NSPs؟ اذكر أمثلة."],["Network service providers: large communications companies that agreed to connect their networks. Examples: Verizon, Sprint, British Telecom, AT&T.","مزودو خدمة الشبكة: شركات اتصالات كبرى اتفقت على ربط شبكاتها. أمثلة: Verizon وSprint وBritish Telecom وAT&T."]],
   [["What is the Internet Protocol (IP)?","ما هو بروتوكول الإنترنت (IP)؟"],["A communication standard that enables computers to route communications traffic from one network to another as needed.","معيار اتصال يمكّن الحواسيب من توجيه حركة الاتصالات من شبكة إلى أخرى حسب الحاجة."]],
   [["What is the Internet backbone?","ما هو العمود الفقري للإنترنت؟"],["One of the Internet’s high-speed, long-distance communications links (e.g., fiber-optic cables).","أحد وصلات الاتصال عالية السرعة وبعيدة المدى في الإنترنت (مثل الألياف الضوئية)."]],
   [["What is a host and what are packets?","ما هو المضيف وما هي الحزم؟"],["A host is a computer on the Internet. Data is passed in chunks called packets, each carrying the addresses of its sender and receiver and other technical information.","المضيف حاسوب على الإنترنت. تُمرَّر البيانات في أجزاء تسمى حزمًا تحمل كل منها عنواني المرسل والمستقبل ومعلومات تقنية أخرى."]],
   [["What is TCP?","ما هو TCP؟"],["Transmission Control Protocol: the best known of the many communications protocols used in connection with IP.","بروتوكول التحكم في الإرسال: أشهر بروتوكولات الاتصال العديدة المستخدمة مع IP."]],
   [["What is an IP address?","ما هو عنوان IP؟"],["An assigned address that identifies each computer on the Internet.","عنوان مخصص يحدد كل حاسوب على الإنترنت."]],
   [["What is DNS? Give an example.","ما هو DNS؟ اذكر مثالًا."],["Domain Name System: maps domain names to IP addresses because people prefer words to numbers. Example: www.yahoo.com maps to 69.32.133.79.","نظام أسماء النطاقات: يربط أسماء النطاقات بعناوين IP لأن الناس يفضلون الكلمات على الأرقام. مثال: www.yahoo.com يقابل 69.32.133.79."]],
   [["Name the 3 ways of accessing the Internet.","اذكر طرق الوصول الثلاث إلى الإنترنت."],["Connecting via a LAN server, via an Internet service provider, or via a wireless connection.","عبر خادم LAN، أو عبر مزود خدمة إنترنت، أو عبر اتصال لاسلكي."]],
   [["How does connecting via a LAN server work?","كيف يعمل الاتصال عبر خادم LAN؟"],["Used by businesses and organizations that manage a LAN. A server on the LAN is connected to the Internet using a router, giving all LAN users access.","تستخدمه الشركات والمنظمات التي تدير LAN. يُربط خادم في الشبكة بالإنترنت عبر موجّه فيحصل جميع المستخدمين على الوصول."]],
   [["When must an ISP be used?","متى يجب استخدام ISP؟"],["When companies and residences are unable to connect directly to the Internet through a LAN server.","عندما تعجز الشركات والمساكن عن الاتصال مباشرة بالإنترنت عبر خادم LAN."]],
   [["Describe wireless Internet connection.","صف الاتصال اللاسلكي بالإنترنت."],["Thousands of public Wi-Fi services in coffee shops, airports, hotels, etc., free, for an hourly rate, or a monthly subscription fee.","آلاف خدمات Wi-Fi العامة في المقاهي والمطارات والفنادق وغيرها، مجانًا أو بسعر بالساعة أو باشتراك شهري."]],
   [["Who developed the World Wide Web and where?","من طوّر الويب وأين؟"],["Tim Berners-Lee at CERN, the European Organization for Nuclear Research in Geneva.","تيم بيرنرز-لي في CERN، المنظمة الأوروبية للأبحاث النووية في جنيف."]],
   [["What are hypertext and hyperlink?","ما هما النص التشعبي والرابط التشعبي؟"],["Hypertext: the concept of linked documents. Hyperlink: highlighted text or graphics in a Web document that, when clicked, opens a new Web page with related content.","النص التشعبي: مفهوم المستندات المترابطة. الرابط التشعبي: نص أو رسومات مميزة تفتح عند النقر صفحة ويب جديدة بمحتوى ذي صلة."]],
   [["What is HTTP?","ما هو HTTP؟"],["Hypertext Transfer Protocol: the protocol normally used to transfer hypertext documents between browsers and web servers.","بروتوكول نقل النص التشعبي: البروتوكول المستخدم عادةً لنقل مستندات النص التشعبي بين المتصفحات وخوادم الويب."]],
   [["What is a URL? Give an example.","ما هو URL؟ اذكر مثالًا."],["Uniform Resource Locator: a Web address that specifies the exact location of a Web page using letters and words that map to an IP address and a location on the host. Example: http://www.google.com.sa","محدد موقع الموارد الموحد: عنوان ويب يحدد الموقع الدقيق لصفحة ويب بحروف وكلمات تُربط بعنوان IP وموقع على المضيف. مثال: http://www.google.com.sa"]],
   [["What do “www”, “com”, and “edu” mean in addresses?","ماذا تعني www وcom وedu في العناوين؟"],["“www” signifies the World Wide Web service. Codes denote affiliation: com for business sites, edu for education sites.","www تدل على خدمة الشبكة العنكبوتية العالمية. والرموز تدل على الانتماء: com للمواقع التجارية وedu للتعليمية."]],
   [["What is a website and a web browser?","ما هو الموقع الإلكتروني ومتصفح الويب؟"],["Website: data stored on a www server that can be freely accessed by people surfing the web. Web browser: Web client software used to view Web pages.","الموقع: بيانات مخزنة على خادم www يصل إليها الناس بحرية. المتصفح: برنامج عميل للويب لعرض صفحات الويب."]],
   [["What are cookies?","ما هي الكوكيز (Cookies)؟"],["Some websites can store hidden information about you on your hard disk using cookies.","يمكن لبعض المواقع تخزين معلومات مخفية عنك على قرصك الصلب باستخدام الكوكيز."]],
   [["What is the Internet cache?","ما هي الذاكرة المخبئية للإنترنت؟"],["Each time you display a website in your browser, a copy of the information (text and pictures) is saved on your hard disk.","في كل مرة تعرض فيها موقعًا في المتصفح تُحفظ نسخة من المعلومات (نصوص وصور) على القرص الصلب."]],
   [["What is FTP?","ما هو FTP؟"],["File Transfer Protocol: a way of transferring data from one place to another over the Internet.","بروتوكول نقل الملفات: طريقة لنقل البيانات من مكان إلى آخر عبر الإنترنت."]]

LECTURES.push({ id:'l9', n:9,
  title:["Business Information Systems","أنظمة المعلومات التجارية (Business Information Systems)"],
  obj:[
    ["Describe the most common business information systems.","وصف أكثر أنواع أنظمة المعلومات التجارية شيوعًا."],
    ["Explain electronic commerce (e-commerce), mobile commerce (m-commerce), and e-business.","شرح التجارة الإلكترونية (e-commerce) والتجارة المتنقلة (m-commerce) والأعمال الإلكترونية (e-business)."],
    ["Explain transaction processing systems (TPS) and enterprise resource planning (ERP) systems.","شرح أنظمة معالجة المعاملات (TPS) وأنظمة تخطيط موارد المؤسسة (ERP)."],
    ["Explain management information systems (MIS) and decision support systems (DSS).","شرح نظم المعلومات الإدارية (MIS) ونظم دعم القرار (DSS)."],
    ["Describe specialized business systems: knowledge management and artificial intelligence.","وصف الأنظمة التجارية المتخصصة: إدارة المعرفة والذكاء الاصطناعي."]
  ],
  sec:[
   {t:["1. Business information systems","1. أنظمة المعلومات التجارية (Business Information Systems)"], b:[
     {k:'p', x:["The most common types of information systems in business organizations are those designed for electronic and mobile commerce, transaction processing, management information, and decision support.","أكثر أنواع أنظمة المعلومات شيوعًا في المنظمات التجارية هي تلك المصممة للتجارة الإلكترونية والمتنقلة، ومعالجة المعاملات، والمعلومات الإدارية، ودعم القرار."]},
     {k:'p', x:["Business information systems are often integrated into one product and can be delivered by the same software package.","غالبًا ما تُدمج أنظمة المعلومات التجارية في منتج واحد، ويمكن تقديمها ضمن حزمة برمجية واحدة."]},
     {k:'tbl', h:[["Layer (bottom to top)","الطبقة (من الأسفل إلى الأعلى)"],["What it covers","ما تغطيه"]],
      r:[
       [["Enterprise systems","أنظمة المؤسسة"],["E-commerce and m-commerce","التجارة الإلكترونية والمتنقلة"]],
       [["Management information and decision support","المعلومات الإدارية ودعم القرار"],["MIS and DSS","نظم MIS وDSS"]],
       [["Knowledge management and special-purpose systems","إدارة المعرفة والأنظمة المتخصصة"],["Top of the pyramid","قمة الهرم"]]
      ]},
     {k:'tip', x:["Think of it as a pyramid: enterprise systems form the base, and knowledge management sits at the top.","فكّر فيها كهرم: أنظمة المؤسسة تشكّل القاعدة، وإدارة المعرفة في القمة."]}
   ]},
   {t:["1.1 Timeline of business information systems","1.1 الخط الزمني لأنظمة المعلومات التجارية"], b:[
     {k:'tbl', h:[["Period","الفترة"],["System","النظام"]],
      r:[
       [["1950s","خمسينيات القرن العشرين"],["TPS (transaction processing)","TPS (معالجة المعاملات)"]],
       [["1960s","ستينيات القرن العشرين"],["MIS (management information)","MIS (المعلومات الإدارية)"]],
       [["1970s and 1980s","سبعينيات وثمانينيات القرن العشرين"],["DSS (decision support)","DSS (دعم القرار)"]],
       [["1990s","تسعينيات القرن العشرين"],["Specialized business systems and e- and m-commerce","أنظمة تجارية متخصصة والتجارة الإلكترونية والمتنقلة"]],
       [["2000 and beyond","من عام 2000 وما بعده"],["Continued growth of these systems","استمرار نمو هذه الأنظمة"]]
      ]}
   ]},
   {t:["2. Electronic and mobile commerce","2. التجارة الإلكترونية والمتنقلة (Electronic and Mobile Commerce)"], b:[
     {k:'def', x:["Electronic commerce (e-commerce) involves any business transaction executed electronically between companies, companies and consumers, consumers and other consumers, business and the public sector, and consumers and the public sector.","التجارة الإلكترونية (e-commerce) تشمل أي معاملة تجارية تُنفَّذ إلكترونيًا بين الشركات، وبين الشركات والمستهلكين، وبين المستهلكين أنفسهم، وبين القطاع التجاري والقطاع العام، وبين المستهلكين والقطاع العام."]},
     {k:'ul', h:["Types of e-commerce","أنواع التجارة الإلكترونية"], x:[
       ["Business-to-business (B2B): between companies","من الشركات إلى الشركات (B2B): بين الشركات"],
       ["Business-to-consumer (B2C): between companies and consumers","من الشركات إلى المستهلكين (B2C): بين الشركات والمستهلكين"],
       ["Consumer-to-consumer (C2C): between consumers","من المستهلكين إلى المستهلكين (C2C): بين المستهلكين"],
       ["Business and the public sector, and consumers and the public sector","بين القطاع التجاري والقطاع العام، وبين المستهلكين والقطاع العام"]
     ]},
     {k:'def', x:["Mobile commerce (m-commerce) is the use of mobile, wireless devices to place orders and conduct business.","التجارة المتنقلة (m-commerce) هي استخدام الأجهزة المتنقلة اللاسلكية لتقديم الطلبات وإجراء الأعمال."]},
     {k:'def', x:["Electronic business (e-business) goes beyond e-commerce and e-procurement (the process of getting supplies) by using information systems and the Internet to perform all business-related tasks and functions, such as accounting, finance, marketing, and human resource activities.","الأعمال الإلكترونية (e-business) تتجاوز التجارة الإلكترونية والشراء الإلكتروني (عملية الحصول على الإمدادات) باستخدام نظم المعلومات والإنترنت لتنفيذ جميع المهام والوظائف المتعلقة بالأعمال، مثل المحاسبة والتمويل والتسويق وإدارة الموارد البشرية."]},
     {k:'ul', h:["How e-business connects the organization","كيف تربط الأعمال الإلكترونية المنظمة"], x:[
       ["Suppliers: e-procurement","الموردون: الشراء الإلكتروني"],
       ["The organization and its partners: the center of the flow","المنظمة وشركاؤها: مركز التدفق"],
       ["Customers: e-commerce","العملاء: التجارة الإلكترونية"],
       ["Management oversees the whole system","الإدارة تشرف على النظام كله"]
     ]}
   ]},
   {t:["3. Enterprise systems","3. أنظمة المؤسسة (Enterprise Systems)"], b:[
     {k:'p', x:["Enterprise systems that process daily transactions have evolved over the years and offer important solutions for businesses of all sizes.","تطورت أنظمة المؤسسة التي تعالج المعاملات اليومية على مر السنين، وتقدم حلولًا مهمة للشركات بكل أحجامها."]},
     {k:'def', x:["A transaction is any business-related exchange, such as payments to employees, sales to customers, or payments to suppliers.","المعاملة (Transaction) هي أي تبادل متعلق بالأعمال، مثل صرف رواتب الموظفين، أو البيع للعملاء، أو الدفع للموردين."]},
     {k:'def', x:["A transaction processing system (TPS) is an organized collection of people, procedures, software, databases, and devices used to perform and record business transactions.","نظام معالجة المعاملات (TPS) هو مجموعة منظمة من الأشخاص والإجراءات والبرمجيات وقواعد البيانات والأجهزة تُستخدم لتنفيذ المعاملات التجارية وتسجيلها."]},
     {k:'p', x:["Processing business transactions was the first computer application developed for most organizations.","كانت معالجة المعاملات التجارية أول تطبيق حاسوبي طوّرته معظم المنظمات."]},
     {k:'def', x:["An enterprise resource planning (ERP) system is a set of integrated programs that manages the vital business operations for an entire multisite, global organization. It can support functions such as customer service, human resources, sales, and distribution.","نظام تخطيط موارد المؤسسة (ERP) هو مجموعة من البرامج المتكاملة التي تدير العمليات التجارية الحيوية لمنظمة عالمية متعددة المواقع بأكملها. ويمكن أن يدعم وظائف مثل خدمة العملاء، والموارد البشرية، والمبيعات، والتوزيع."]},
     {k:'ul', h:["Benefits of ERP","فوائد ERP"], x:[
       ["Easing the adoption of improved work processes","تسهيل تبنّي أساليب عمل محسّنة"],
       ["Increasing access to timely data for decision making","زيادة الوصول إلى بيانات محدّثة لاتخاذ القرار"]
     ]},
     {k:'tip', x:["A TPS records what happened; ERP connects all the departments in one system.","نظام TPS يسجّل ما حدث، بينما ERP يربط جميع الأقسام في نظام واحد."]}
   ]},
   {t:["4. Management information systems (MIS)","4. نظم المعلومات الإدارية (Management Information Systems - MIS)"], b:[
     {k:'p', x:["The benefits of an effective TPS or ERP, including reduced processing costs and fewer personnel needs, are substantial. Companies soon realize that they can use the data stored in these systems to help managers make better decisions.","فوائد نظام TPS أو ERP الفعّال، ومنها خفض تكاليف المعالجة وتقليل الاحتياج للموظفين، كبيرة جدًا. وسرعان ما تدرك الشركات أنها تستطيع استخدام البيانات المخزنة في هذه الأنظمة لمساعدة المديرين على اتخاذ قرارات أفضل."]},
     {k:'def', x:["A management information system (MIS) is an organized collection of people, procedures, software, databases, and devices that provides routine information to managers and decision makers.","نظام المعلومات الإدارية (MIS) هو مجموعة منظمة من الأشخاص والإجراءات والبرمجيات وقواعد البيانات والأجهزة تُقدّم معلومات روتينية للمديرين وصنّاع القرار."]},
     {k:'p', x:["MISs typically provide standard reports generated with data from the TPS or ERP.","عادةً ما تقدم أنظمة MIS تقارير معيارية تُنشأ من بيانات TPS أو ERP."]},
     {k:'p', x:["Functional management information systems draw data from the organization’s transaction processing system, and they share a common database.","تستمد أنظمة المعلومات الإدارية الوظيفية بياناتها من نظام معالجة المعاملات في المنظمة، وتشترك في قاعدة بيانات مشتركة."]},
     {k:'ul', h:["Examples of functional MIS","أمثلة على نظم MIS الوظيفية"], x:[
       ["Marketing management information system","نظام معلومات إدارة التسويق"],
       ["Manufacturing management information system","نظام معلومات إدارة التصنيع"],
       ["Financial management information system","نظام معلومات الإدارة المالية"],
       ["Other management information systems","أنظمة معلومات إدارية أخرى"]
     ]}
   ]},
   {t:["5. Decision support systems (DSS)","5. نظم دعم القرار (Decision Support Systems - DSS)"], b:[
     {k:'def', x:["A decision support system (DSS) is an organized collection of people, procedures, software, databases, and devices that support problem-specific decision making.","نظام دعم القرار (DSS) هو مجموعة منظمة من الأشخاص والإجراءات والبرمجيات وقواعد البيانات والأجهزة تدعم اتخاذ القرار الخاص بمشكلة محددة."]},
     {k:'tip', x:["MIS helps an organization “do things right”; DSS helps a manager “do the right thing.”","نظام MIS يساعد المنظمة على “فعل الأشياء بشكل صحيح”، بينما نظام DSS يساعد المدير على “فعل الشيء الصحيح”."]},
     {k:'p', x:["A DSS can include a collection of models used to support a decision maker, a collection of facts and information to assist in decision making, and systems and procedures that help users interact with the DSS.","يمكن أن يشمل نظام DSS مجموعة من النماذج لدعم صانع القرار، ومجموعة من الحقائق والمعلومات للمساعدة في اتخاذ القرار، وأنظمة وإجراءات تساعد المستخدمين على التفاعل مع النظام."]},
     {k:'ul', h:["A DSS typically includes","يتكون نظام DSS عادةً من"], x:[
       ["Model base: the collection of models that support the decision maker","قاعدة النماذج: مجموعة النماذج التي تدعم صانع القرار"],
       ["Database: the facts and information used for decisions","قاعدة البيانات: الحقائق والمعلومات المستخدمة في القرار"],
       ["User interface (dialogue manager): how decision makers interact with the DSS","واجهة المستخدم (مدير الحوار): طريقة تفاعل صُنّاع القرار مع النظام"]
     ]},
     {k:'p', x:["Software called the database management system (DBMS) is often used to manage the database, and software called the model management system (MMS) manages the model base.","تُستخدم غالبًا برمجيات تسمى نظام إدارة قواعد البيانات (DBMS) لإدارة قاعدة البيانات، بينما تُستخدم برمجيات تسمى نظام إدارة النماذج (MMS) لإدارة قاعدة النماذج."]}
   ]},
   {t:["6. Specialized business information systems","6. أنظمة المعلومات التجارية المتخصصة (Specialized Business Information Systems)"], b:[
     {k:'p', x:["In addition to ERPs, MISs, and DSSs, organizations often rely on specialized systems.","بالإضافة إلى ERP وMIS وDSS، تعتمد المنظمات كثيرًا على أنظمة متخصصة."]},
     {k:'def', x:["A knowledge management system is an organized collection of people, procedures, software, databases, and devices that stores and retrieves knowledge, improves collaboration, locates knowledge sources, and captures and uses knowledge.","نظام إدارة المعرفة هو مجموعة منظمة من الأشخاص والإجراءات والبرمجيات وقواعد البيانات والأجهزة تُخزّن المعرفة وتسترجعها، وتحسّن التعاون، وتحدد مصادر المعرفة، وتلتقط المعرفة وتستخدمها."]},
     {k:'p', x:["Knowledge is created, captured, refined, stored, managed, and disseminated, and all of these steps feed a central knowledge base. Managing knowledge means an organization can capture and retain specialized knowledge for future use.","تُنشأ المعرفة وتُلتقط وتُصقل وتُخزَّن وتُدار وتُنشر، وكل هذه الخطوات تغذي قاعدة المعرفة المركزية. وإدارة المعرفة تعني أن المنظمة تستطيع التقاط المعرفة المتخصصة والاحتفاظ بها للاستخدام في المستقبل."]},
     {k:'def', x:["Artificial intelligence (AI) is a field in which the computer system takes on the characteristics of human intelligence.","الذكاء الاصطناعي (AI) مجال تكتسب فيه أنظمة الحاسوب خصائص الذكاء البشري."]},
     {k:'ul', h:["Subfields of AI","فروع الذكاء الاصطناعي"], x:[
       ["Robotics","الروبوتات (Robotics)"],
       ["Vision systems","أنظمة الرؤية (Vision systems)"],
       ["Learning systems","أنظمة التعلم (Learning systems)"],
       ["Natural language processing","معالجة اللغة الطبيعية (Natural language processing)"],
       ["Neural networks","الشبكات العصبية (Neural networks)"],
       ["Expert systems","الأنظمة الخبيرة (Expert systems)"]
     ]}
   ]}
  ],
  take:[
   ["Business information systems include e-commerce, TPS, MIS, and DSS, often integrated into one software package.","تشمل أنظمة المعلومات التجارية التجارة الإلكترونية وTPS وMIS وDSS، وغالبًا ما تُدمج في حزمة برمجية واحدة."],
   ["E-commerce covers B2B, B2C, C2C, and dealings with the public sector; m-commerce uses mobile devices.","تشمل التجارة الإلكترونية B2B وB2C وC2C والتعامل مع القطاع العام، بينما تستخدم التجارة المتنقلة الأجهزة المحمولة."],
   ["TPS records daily business transactions; ERP integrates the vital operations of a whole organization.","نظام TPS يسجّل المعاملات التجارية اليومية، أما ERP فيدمج العمليات الحيوية للمنظمة بأكملها."],
   ["MIS gives managers routine reports; DSS supports specific decisions (“do the right thing”).","نظام MIS يقدم للمديرين تقارير روتينية، بينما يدعم DSS قرارات محددة (“فعل الشيء الصحيح”)."],
   ["A DSS includes a model base, a database, and a user interface.","يتكون نظام DSS من قاعدة نماذج وقاعدة بيانات وواجهة مستخدم."],
   ["Knowledge management systems and AI are specialized systems that preserve and use expertise.","أنظمة إدارة المعرفة والذكاء الاصطناعي أنظمة متخصصة تحفظ الخبرة وتستخدمها."]
  ],
  fc:[
   [["What is electronic commerce (e-commerce)?","ما هي التجارة الإلكترونية (e-commerce)؟"],["Any business transaction executed electronically between companies, consumers, and the public sector.","أي معاملة تجارية تُنفَّذ إلكترونيًا بين الشركات والمستهلكين والقطاع العام."]],
   [["What is B2B compared to B2C?","ما الفرق بين B2B وB2C؟"],["B2B is between companies. B2C is between companies and consumers.","B2B بين الشركات، وB2C بين الشركات والمستهلكين."]],
   [["What is mobile commerce (m-commerce)?","ما هي التجارة المتنقلة (m-commerce)؟"],["Using mobile, wireless devices to place orders and conduct business.","استخدام الأجهزة المتنقلة اللاسلكية لتقديم الطلبات وإجراء الأعمال."]],
   [["What is electronic business (e-business)?","ما هي الأعمال الإلكترونية (e-business)؟"],["Using information systems and the Internet for all business tasks, such as accounting, finance, marketing, and HR.","استخدام نظم المعلومات والإنترنت لكل المهام التجارية، مثل المحاسبة والتمويل والتسويق والموارد البشرية."]],
   [["What is a transaction processing system (TPS)?","ما هو نظام معالجة المعاملات (TPS)؟"],["An organized collection of people, procedures, software, databases, and devices that performs and records business transactions.","مجموعة منظمة من الأشخاص والإجراءات والبرمجيات وقواعد البيانات والأجهزة تنفّذ المعاملات التجارية وتسجّلها."]],
   [["What is ERP?","ما هو ERP؟"],["Enterprise resource planning: a set of integrated programs that manages the vital operations of a whole organization.","تخطيط موارد المؤسسة: مجموعة برامج متكاملة تدير العمليات الحيوية للمنظمة بأكملها."]],
   [["What does an MIS provide?","ماذا يقدم نظام MIS؟"],["Routine information for managers, usually as standard reports from TPS or ERP data.","معلومات روتينية للمديرين، غالبًا على شكل تقارير معيارية من بيانات TPS أو ERP."]],
   [["What is a DSS?","ما هو نظام DSS؟"],["An organized collection of people, procedures, software, databases, and devices that supports problem-specific decisions.","مجموعة منظمة من الأشخاص والإجراءات والبرمجيات وقواعد البيانات والأجهزة تدعم القرارات الخاصة بمشكلة محددة."]],
   [["What is the difference between MIS and DSS?","ما الفرق بين MIS وDSS؟"],["MIS helps “do things right”; DSS helps a manager “do the right thing.”","نظام MIS يساعد على “فعل الأشياء بشكل صحيح”، وDSS يساعد المدير على “فعل الشيء الصحيح”."]],
   [["What are the three typical parts of a DSS?","ما المكونات الثلاثة المعتادة لنظام DSS؟"],["A model base, a database, and a user interface (dialogue manager).","قاعدة نماذج، وقاعدة بيانات، وواجهة مستخدم (مدير حوار)."]]
  ],

LECTURES.push({ id:'l10', n:10,
  title:["Business Intelligence and Analytics","ذكاء الأعمال وتحليلات البيانات (Business Intelligence and Analytics)"],
  obj:[
    ["Explain business analytics and business intelligence (BI).","شرح تحليلات الأعمال (Business Analytics) وذكاء الأعمال (BI)."],
    ["Describe the benefits organizations gain from BI and analytics.","وصف الفوائد التي تحققها المنظمات من BI وتحليلات البيانات."],
    ["Describe the role of a data scientist and the skills it requires.","وصف دور عالم البيانات (Data Scientist) والمهارات التي يتطلبها."],
    ["Identify the components required for effective BI and analytics.","تحديد المكونات اللازمة لنجاح BI وتحليلات البيانات."],
    ["List the common BI and analytics tools.","سرد أدوات BI وتحليلات البيانات الشائعة."]
  ],
  sec:[
   {t:["1. Business analytics","1. تحليلات الأعمال (Business Analytics)"], b:[
     {k:'def', x:["Business analytics is the extensive use of data and quantitative analysis to support fact-based decision making within organizations.","تحليلات الأعمال هي الاستخدام الواسع للبيانات والتحليل الكمي لدعم اتخاذ القرارات المبنية على الحقائق داخل المنظمات."]},
     {k:'p', x:["It can be used to understand current business performance, reveal new business patterns and relationships, explain why certain results occurred, optimize current operations, and forecast future business results.","يمكن استخدامها لفهم أداء الأعمال الحالي، وكشف أنماط وعلاقات جديدة، وتفسير أسباب نتائج معينة، وتحسين العمليات الحالية، والتنبؤ بنتائج الأعمال المستقبلية."]}
   ]},
   {t:["2. Business intelligence (BI)","2. ذكاء الأعمال (Business Intelligence - BI)"], b:[
     {k:'def', x:["Business intelligence is a wide range of applications, practices, and technologies for the extraction, transformation, integration, visualization, analysis, interpretation, and presentation of data to support improved decision making.","ذكاء الأعمال هو مجموعة واسعة من التطبيقات والممارسات والتقنيات لاستخراج البيانات وتحويلها ودمجها وتصورها وتحليلها وتفسيرها وعرضها، بهدف دعم تحسين اتخاذ القرار."]},
     {k:'p', x:["The data used in BI is often pulled from multiple sources, which may be internal or external to the organization.","غالبًا ما تُجمع البيانات المستخدمة في BI من مصادر متعددة، وقد تكون داخلية أو خارجية بالنسبة للمنظمة."]},
     {k:'p', x:["Many organizations store this data in large collections such as data warehouses, data marts, and data lakes, for use in BI applications.","تخزن كثير من المنظمات هذه البيانات في مجموعات كبيرة مثل مستودعات البيانات (Data warehouses)، وأسواق البيانات (Data marts)، وبحيرات البيانات (Data lakes)، لاستخدامها في تطبيقات BI."]},
     {k:'tip', x:["The goal of BI is to get the most value out of information and present results in a way that anyone can understand.","هدف BI هو الحصول على أكبر قيمة من المعلومات وعرض النتائج بطريقة يفهمها أي شخص."]}
   ]},
   {t:["2.1 Benefits achieved from BI and analytics","2.1 الفوائد التي تحققها BI وتحليلات البيانات"], b:[
     {k:'tbl', h:[["Benefit","الفائدة"],["Company","الشركة"],["Result","النتيجة"]],
      r:[
       [["Detect fraud","كشف الاحتيال"],["MetLife","MetLife"],["Analytical software helps its special investigations unit identify medical provider, attorney, and repair shop fraud.","تساعد برمجيات التحليل وحدة التحقيقات الخاصة على كشف الاحتيال من مقدمي الخدمات الطبية والمحامين وورش الإصلاح."]],
       [["Improve forecasting","تحسين التنبؤ"],["Kroger","Kroger"],["An inventory system shows inventory levels, adapts to user feedback, and supports “what-if” analysis. Out-of-stock prescriptions dropped by 1.5 million per year, and sales rose by $80 million per year.","نظام مخزون يعرض مستويات المخزون ويتكيف مع ملاحظات المستخدمين ويدعم تحليل “ماذا لو”. انخفضت الوصفات غير المتوفرة بمقدار 1.5 مليون سنويًا، وارتفعت المبيعات بمقدار 80 مليون دولار سنويًا."]],
       [["Increase sales","زيادة المبيعات"],["DaimlerChrysler","DaimlerChrysler"],["A price-elasticity model helps optimize pricing across vehicle models. The firm estimates additional annual sales of $500 million.","نموذج مرونة الأسعار يساعد على تحسين التسعير عبر طرازات السيارات. وتقدر الشركة مبيعات إضافية بمقدار 500 مليون دولار سنويًا."]],
       [["Reduce costs","خفض التكاليف"],["Coca-Cola Enterprises","Coca-Cola Enterprises"],["A vehicle-routing optimization system saves $45 million a year through less gas consumption and fewer drivers needed.","نظام تحسين مسارات المركبات يوفر 45 مليون دولار سنويًا من خلال تقليل استهلاك الوقود وعدد السائقين المطلوبين."]]
      ]}
   ]},
   {t:["3. The role of a data scientist","3. دور عالم البيانات (The Role of a Data Scientist)"], b:[
     {k:'def', x:["Data scientists are individuals who combine strong business acumen, a deep understanding of analytics, and a healthy appreciation of the limitations of their data, tools, and techniques to deliver real improvements in decision making.","عالم البيانات هو شخص يجمع بين فهم قوي للأعمال، وعمق في التحليلات، وإدراك سليم لحدود بياناته وأدواته وأساليبه، لتحقيق تحسينات حقيقية في اتخاذ القرار."]},
     {k:'p', x:["They view a situation from many angles, determine what data and tools can help further their understanding, and then apply the appropriate data and tools.","ينظرون إلى الموقف من زوايا متعددة، ويحددون البيانات والأدوات التي تساعد على فهمه بشكل أعمق، ثم يطبقون البيانات والأدوات المناسبة."]},
     {k:'ul', h:["Typical traits and skills","السمات والمهارات المعتادة"], x:[
       ["Highly inquisitive: they keep asking questions and challenge assumptions and existing processes","فضوليون جدًا: يطرحون الأسئلة باستمرار ويتحدّون الافتراضات والعمليات القائمة"],
       ["They perform “what-if” analyses","يُجرون تحليلات “ماذا لو”"],
       ["Rigorous education: mastery of statistics, math, and computer programming","تعليم صارم: إتقان الإحصاء والرياضيات وبرمجة الحاسوب"],
       ["Common tools and languages: Hadoop, Hive, SQL, Python, R, and Java","أدوات ولغات شائعة: Hadoop وHive وSQL وPython وR وJava"]
     ]}
   ]},
   {t:["4. Components required for effective BI and analytics","4. المكونات اللازمة لنجاح BI وتحليلات البيانات"], b:[
     {k:'ul', x:[
       ["A solid data management program, including data governance. This comes first and foremost.","برنامج قوي لإدارة البيانات يشمل حوكمة البيانات (Data governance). وهذا هو الأساس قبل كل شيء."],
       ["Creative data scientists: people who understand the business and the analytics technology, and who recognize the limits of their data, tools, and techniques.","علماء بيانات مبدعون: أشخاص يفهمون الأعمال وتقنية التحليلات، ويدركون حدود بياناتهم وأدواتهم وأساليبهم."],
       ["A strong management commitment to data-driven decision making.","التزام قوي من الإدارة باتخاذ القرار المبني على البيانات."]
     ]},
     {k:'p', x:["Organizations that put these components in place can act quickly to make superior decisions in uncertain and changing environments, gaining a strong competitive advantage.","المنظمات التي توفر هذه المكونات تستطيع التصرف بسرعة واتخاذ قرارات أفضل في بيئات غير مؤكدة ومتغيرة، مما يمنحها ميزة تنافسية قوية."]},
     {k:'tip', x:["Technology alone is not enough. People and management commitment matter just as much as the tools.","التقنية وحدها لا تكفي. الأشخاص والتزام الإدارة لهما الأهمية نفسها التي للأدوات."]}
   ]},
   {t:["5. BI and analytics tools","5. أدوات BI وتحليلات البيانات"], b:[
     {k:'ul', x:[
       ["Spreadsheets","جداول البيانات (Spreadsheets)"],
       ["Reporting and querying tools","أدوات التقارير والاستعلام (Reporting and querying tools)"],
       ["Data visualization tools","أدوات تصور البيانات (Data visualization tools)"],
       ["Online analytical processing (OLAP)","المعالجة التحليلية الفورية (OLAP)"],
       ["Data mining","تنقيب البيانات (Data mining)"],
       ["Dashboards","لوحات المؤشرات (Dashboards)"]
     ]}
   ]}
  ],
  take:[
   ["Business analytics uses data and quantitative analysis to support fact-based decisions.","تحليلات الأعمال تستخدم البيانات والتحليل الكمي لدعم القرارات المبنية على الحقائق."],
   ["BI turns data from many sources into information that is easy to understand.","يحوّل BI البيانات من مصادر متعددة إلى معلومات سهلة الفهم."],
   ["Organizations gain from BI in fraud detection, forecasting, higher sales, and lower costs.","تستفيد المنظمات من BI في كشف الاحتيال والتنبؤ وزيادة المبيعات وخفض التكاليف."],
   ["A data scientist combines business sense, analytics skills, and awareness of data limits.","يجمع عالم البيانات بين الحس التجاري ومهارات التحليل والوعي بحدود البيانات."],
   ["Strong data management and governance come first, followed by people and management commitment.","تأتي إدارة البيانات القوية وحوكمتها أولًا، يليها الأشخاص والتزام الإدارة."],
   ["Common tools include spreadsheets, reporting tools, visualization tools, OLAP, data mining, and dashboards.","من الأدوات الشائعة: جداول البيانات، وأدوات التقارير، وأدوات التصور، وOLAP، وتنقيب البيانات، ولوحات المؤشرات."]

const KEY = 'studyHubV2';
const store = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } })();
const state = { lang: store.lang||'en', subject:SUBJECT.id, page:'home', sidebar: window.innerWidth>=1024, data: store.data||{}, decks:{}, qz:{}, exam:null };
function save(){
  try{
    const cur=JSON.parse(localStorage.getItem(KEY)||'{}'); cur.data=cur.data||{};
    cur.lang=state.lang;
    const d=sd(SUBJECT.id); d.mastery=mastery(SUBJECT); d.n=SUBJECT.lectures.length;
    cur.data[SUBJECT.id]=d;
    localStorage.setItem(KEY, JSON.stringify(cur));
  }catch(e){}
}
const subj = () => SUBJECTS.find(s=>s.id===state.subject);
const LECT = () => subj().lectures;
function sd(id){ id=id||state.subject; return state.data[id]||(state.data[id]={seen:{},best:{},exam:0}); }
function mastery(s){
  if(!s.ready) return 0;
  const d=sd(s.id); let sum=0;
  s.lectures.forEach(l=>{ sum += (d.best[l.id]||0)/100; });
  sum += (d.exam||0)/100;
  return Math.round(sum/(s.lectures.length+1)*100);
}

/* ============================================================
   HELPERS  (invisible citation handling + XSS protection)
   ============================================================ */
const clean = s => String(s)
  .replace(/<\/?(antml:)?cite[^>]*>/gi,'')
  .replace(/\[cite[^\]]*\]/gi,'')
  .replace(/\[(source|ref)[^\]]*\]/gi,'')
  .replace(/[ \t]{2,}/g,' ').trim();
const esc = s => clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/(\$?\d[\d,.]*\d|\$?\d)/g,'<span class="mono">$1</span>');
const li = () => state.lang==='ar'?1:0;
const tx = a => fmt(a[li()]);
const u = k => UI[k][li()];
const $ = id => document.getElementById(id);
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function mixQ(q){ const idx=shuf(q.o.map((_,i)=>i)); return {q:q.q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)}; }
function applyTheme(){
  const t = THEMES[(state.subject&&subj().color)||'teal'];
  document.documentElement.style.setProperty('--b5',t[0]);
  document.documentElement.style.setProperty('--b6',t[1]);
}
