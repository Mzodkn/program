LECTURES.push({ id:'l1', n:1,
  title:["Introduction to IT: Data, Information and Information Systems","مقدمة في تقنية المعلومات: البيانات والمعلومات ونظم المعلومات (Information Systems)"],
  obj:[
    ["Explain the difference between data, information, and process.","شرح الفرق بين البيانات (Data) والمعلومات (Information) والعملية (Process)."],
    ["Define knowledge and explain how data is transformed into information.","تعريف المعرفة (Knowledge) وشرح كيفية تحويل البيانات إلى معلومات."],
    ["List the characteristics of valuable information.","ذكر خصائص المعلومات القيّمة (Valuable Information)."],
    ["Define knowledge workers and knowledge management.","تعريف عمال المعرفة (Knowledge workers) وإدارة المعرفة (Knowledge management)."],
    ["Describe an information system and its elements: input, processing, output, and feedback.","وصف نظام المعلومات (Information System) وعناصره: المدخلات والمعالجة والمخرجات والتغذية الراجعة."],
    ["Define Information Technology (IT) and explain the difference between IS and IT.","تعريف تقنية المعلومات (IT) وشرح الفرق بين نظم المعلومات (IS) وتقنية المعلومات (IT)."]
  ],
  sec:[
   {t:["Data, Information and Process","البيانات والمعلومات والعملية (Data, Information & Process)"], b:[
     {k:'def', x:["Data consists of raw facts, such as an employee number, total hours worked in a week, or an inventory part number. Data represents real-world things.","تتكون البيانات (Data) من حقائق خام (Raw facts)، مثل رقم الموظف، أو إجمالي ساعات العمل في الأسبوع، أو رقم قطعة في المخزون. تمثل البيانات أشياء من العالم الحقيقي."]},
     {k:'def', x:["Information is a collection of data organized and processed so that it has additional value beyond the value of the individual facts.","المعلومات (Information) هي مجموعة من البيانات تم تنظيمها ومعالجتها بحيث تكتسب قيمة إضافية تتجاوز قيمة الحقائق الفردية."]},
     {k:'def', x:["Process: a set of logically related tasks performed to achieve a defined outcome.","العملية (Process): مجموعة من المهام المترابطة منطقيًا تُنفَّذ لتحقيق نتيجة محددة."]},
     {k:'tip', x:["Data = raw facts. Information = organized and processed data that has more value.","البيانات = حقائق خام. المعلومات = بيانات منظمة ومعالجة لها قيمة أكبر."]}
   ]},
   {t:["The Railroad Track Analogy","تشبيه قطع السكة الحديدية"], b:[
     {k:'p', x:["Consider data as pieces of railroad track in a model railroad kit.","اعتبر البيانات (Data) كقطع سكة حديدية في مجموعة سكة حديد نموذجية."]},
     {k:'ul', x:[
       ["Each piece of track has limited inherent value as a single object.","لكل قطعة سكة قيمة ذاتية محدودة بوصفها شيئًا منفردًا."],
       ["However, if you define a relationship among the pieces of the track, they gain value.","لكن إذا حددت علاقة بين قطع السكة، فإنها تكتسب قيمة."],
       ["By arranging the pieces in a certain way, a railroad layout begins to emerge.","وبترتيب القطع بطريقة معينة، يبدأ مخطط السكة الحديدية (Layout) في الظهور."]]},
     {k:'p', x:["The type of information created depends on the relationships defined among existing data.","يعتمد نوع المعلومات الناتجة على العلاقات المحددة بين البيانات الموجودة."]},
     {k:'ul', x:[
       ["For example, you could rearrange the pieces of track to form different layouts.","على سبيل المثال، يمكنك إعادة ترتيب قطع السكة لتكوين مخططات مختلفة."],
       ["Adding new or different data means you can redefine relationships and create new information.","إضافة بيانات جديدة أو مختلفة تعني أنه يمكنك إعادة تحديد العلاقات وإنشاء معلومات جديدة."],
       ["For instance, adding new pieces to the track can greatly increase the value.","مثلًا، إضافة قطع جديدة إلى السكة يمكن أن تزيد القيمة كثيرًا."]]}
   ]},
   {t:["Knowledge","المعرفة (Knowledge)"], b:[
     {k:'p', x:["The process of defining relationships among data to create useful information requires knowledge.","تتطلب عملية تحديد العلاقات بين البيانات لإنشاء معلومات مفيدة وجود معرفة (Knowledge)."]},
     {k:'def', x:["Knowledge is the awareness and understanding of a set of information and the ways that information can be made useful to support a specific task or reach a decision.","المعرفة (Knowledge) هي الإدراك والفهم لمجموعة من المعلومات وللطرق التي يمكن بها جعل هذه المعلومات مفيدة لدعم مهمة محددة أو الوصول إلى قرار."]}
   ]},
   {t:["Process of Transforming Data into Information","عملية تحويل البيانات إلى معلومات"], b:[
     {k:'p', x:["Transforming data into information starts by selecting data, then organizing it, and finally manipulating the data.","يبدأ تحويل البيانات إلى معلومات باختيار البيانات (Selecting)، ثم تنظيمها (Organizing)، وأخيرًا معالجتها والتعامل معها (Manipulating)."]},
     {k:'formula', x:"Data → Select → Organize → Manipulate → Information"}
   ]},
   {t:["Characteristics of Valuable Information","خصائص المعلومات القيّمة (Valuable Information)"], b:[
     {k:'p', x:["The value of information is directly linked to how it helps decision makers achieve their organization’s goals.","ترتبط قيمة المعلومات مباشرة بمدى مساعدتها لمتخذي القرار على تحقيق أهداف مؤسستهم."]},
     {k:'p', x:["Valuable information can help people in their organizations perform tasks more efficiently and effectively.","يمكن للمعلومات القيّمة أن تساعد الأشخاص في مؤسساتهم على أداء المهام بكفاءة (Efficiently) وفعالية (Effectively) أكبر."]},
     {k:'tbl', h:[["Characteristic","الخاصية"],["Definition","التعريف"]],
      r:[
       [["Accessible","متاحة (Accessible)"],["Information should be easily accessible by authorized users.","يجب أن يسهل وصول المستخدمين المصرح لهم إلى المعلومات."]],
       [["Accurate","دقيقة (Accurate)"],["Accurate information is error free.","المعلومات الدقيقة خالية من الأخطاء."]],
       [["Complete","كاملة (Complete)"],["Complete information contains all the important facts.","المعلومات الكاملة تحتوي على جميع الحقائق المهمة."]],
       [["Flexible","مرنة (Flexible)"],["Flexible information can be used for a variety of purposes.","المعلومات المرنة يمكن استخدامها لأغراض متنوعة."]],
       [["Reliable","موثوقة (Reliable)"],["Reliable information can be trusted by users.","المعلومات الموثوقة يمكن للمستخدمين الوثوق بها."]],
       [["Secure","آمنة (Secure)"],["Information should be secure from access by unauthorized users.","يجب أن تكون المعلومات محمية من وصول المستخدمين غير المصرح لهم."]],
       [["Simple","بسيطة (Simple)"],["Information should be simple, not complex.","يجب أن تكون المعلومات بسيطة وليست معقدة."]],
       [["Timely","في الوقت المناسب (Timely)"],["Timely information is delivered when it is needed.","المعلومات في الوقت المناسب تُسلَّم عندما تكون مطلوبة."]],
       [["Verifiable","قابلة للتحقق (Verifiable)"],["This means that you can check it to make sure it is correct.","أي أنه يمكنك فحصها للتأكد من صحتها."]]
      ]},
     {k:'tip', x:["9 characteristics: Accessible, Accurate, Complete, Flexible, Reliable, Secure, Simple, Timely, Verifiable.","9 خصائص: Accessible، Accurate، Complete، Flexible، Reliable، Secure، Simple، Timely، Verifiable."]}
   ]},
   {t:["Knowledge Workers and Knowledge Management","عمال المعرفة وإدارة المعرفة"], b:[
     {k:'def', x:["Knowledge workers (KWs) are people who create, use, and disseminate knowledge and are usually professionals in science, engineering, business, and other areas.","عمال المعرفة (Knowledge workers - KWs) هم أشخاص ينشئون المعرفة ويستخدمونها وينشرونها، وعادةً ما يكونون مهنيين في العلوم والهندسة والأعمال ومجالات أخرى."]},
     {k:'def', x:["Knowledge management is a strategy by which an organization determinedly and systematically gathers, organizes, stores, analyzes, and shares its collective knowledge and experience.","إدارة المعرفة (Knowledge management) هي استراتيجية تقوم بها المؤسسة بإصرار ومنهجية لجمع معرفتها وخبرتها الجماعية وتنظيمها وتخزينها وتحليلها ومشاركتها."]},
     {k:'ul', h:["Knowledge management steps","خطوات إدارة المعرفة"], x:[["Gathers","يجمع (Gathers)"],["Organizes","ينظّم (Organizes)"],["Stores","يخزّن (Stores)"],["Analyzes","يحلّل (Analyzes)"],["Shares","يشارك (Shares)"]]}
   ]},
   {t:["What is an Information System?","ما هو نظام المعلومات؟ (Information System)"], b:[
     {k:'def', x:["An information system (IS) is a set of interrelated components that collect (input), manipulate (processing), store, and disseminate (output) data and information and provide a feedback mechanism to meet an objective.","نظام المعلومات (IS) هو مجموعة من المكونات المترابطة التي تجمع (المدخلات - Input) وتعالج (المعالجة - Processing) وتخزن وتنشر (المخرجات - Output) البيانات والمعلومات، وتوفر آلية للتغذية الراجعة (Feedback) لتحقيق هدف معين."]},
     {k:'cards', c:[
       {t:["Input","المدخلات (Input)"], l:[["In IS, input is the activity of gathering and capturing raw data.","في نظام المعلومات، المدخلات هي نشاط جمع البيانات الخام والتقاطها."]]},
       {t:["Processing","المعالجة (Processing)"], l:[["In IS, processing means converting or transforming data into useful outputs.","في نظام المعلومات، المعالجة تعني تحويل البيانات إلى مخرجات مفيدة."],["Processing can be done manually or with computer assistance.","يمكن أن تتم المعالجة يدويًا أو بمساعدة الحاسوب."]]},
       {t:["Output","المخرجات (Output)"], l:[["In IS, output involves producing useful information, usually in the form of documents and reports.","في نظام المعلومات، تتضمن المخرجات إنتاج معلومات مفيدة، عادةً على شكل مستندات وتقارير."]]},
       {t:["Feedback","التغذية الراجعة (Feedback)"], l:[["In IS, feedback is information from the system that is used to make changes to input or processing activities.","في نظام المعلومات، التغذية الراجعة هي معلومات من النظام تُستخدم لإجراء تغييرات على أنشطة المدخلات أو المعالجة."]]}
     ]},
     {k:'p', x:["In addition to feedback, a computer system can predict future events to avoid problems. This concept is often called forecasting.","بالإضافة إلى التغذية الراجعة، يمكن لنظام الحاسوب التنبؤ بالأحداث المستقبلية لتجنب المشكلات. يُسمى هذا المفهوم غالبًا التنبؤ (Forecasting)."]},
     {k:'formula', x:"Input → Processing → Output (with Feedback)"}
   ]},
   {t:["Information Technology (IT)","تقنية المعلومات (Information Technology)"], b:[
     {k:'def', x:["Information Technology (IT) is the use of any computers, storage, networking and other physical devices, infrastructure and processes to create, process, store, secure and exchange all forms of electronic data.","تقنية المعلومات (IT) هي استخدام أي حواسيب ووسائط تخزين وشبكات وأجهزة مادية أخرى وبنية تحتية وعمليات لإنشاء جميع أشكال البيانات الإلكترونية ومعالجتها وتخزينها وتأمينها وتبادلها."]},
     {k:'p', x:["IT is used in the context of enterprise operations as opposed to personal or entertainment technologies. The commercial use of IT encompasses both computer technology and telephony.","تُستخدم تقنية المعلومات في سياق عمليات المؤسسات (Enterprise operations) بخلاف التقنيات الشخصية أو الترفيهية. ويشمل الاستخدام التجاري لتقنية المعلومات تقنية الحاسوب والاتصالات الهاتفية (Telephony)."]},
     {k:'p', x:["IT includes several layers of physical equipment (hardware), virtualization and management or automation tools, operating systems and applications (software) used to perform essential functions.","تتضمن تقنية المعلومات عدة طبقات من المعدات المادية (Hardware)، وأدوات المحاكاة الافتراضية (Virtualization) والإدارة أو الأتمتة (Automation)، وأنظمة التشغيل (Operating systems) والتطبيقات (Software) المستخدمة لأداء الوظائف الأساسية."]},

  take:[
   ["Data = raw facts. Information = organized and processed data with added value.","البيانات = حقائق خام. المعلومات = بيانات منظمة ومعالجة ذات قيمة مضافة."],
   ["Knowledge is the understanding that makes information useful for a task or decision.","المعرفة هي الفهم الذي يجعل المعلومات مفيدة لمهمة أو قرار."],

   ["Valuable information is Accessible, Accurate, Complete, Flexible, Reliable, Secure, Simple, Timely, and Verifiable.","المعلومات القيّمة: متاحة، دقيقة، كاملة، مرنة، موثوقة، آمنة، بسيطة، في الوقت المناسب، وقابلة للتحقق."],
   ["An information system has input, processing, output, and feedback.","نظام المعلومات له مدخلات ومعالجة ومخرجات وتغذية راجعة."],

  fc:[
   [["What is data?","ما هي البيانات (Data)؟"],["Raw facts, such as an employee number, total hours worked in a week, or an inventory part number. Data represents real-world things.","حقائق خام مثل رقم الموظف أو إجمالي ساعات العمل الأسبوعية أو رقم قطعة في المخزون. تمثل البيانات أشياء من العالم الحقيقي."]],
   [["What is information?","ما هي المعلومات (Information)؟"],["A collection of data organized and processed so that it has additional value beyond the value of the individual facts.","مجموعة من البيانات المنظمة والمعالجة بحيث تكتسب قيمة إضافية تتجاوز قيمة الحقائق الفردية."]],
   [["What is a process?","ما هي العملية (Process)؟"],["A set of logically related tasks performed to achieve a defined outcome.","مجموعة من المهام المترابطة منطقيًا تُنفَّذ لتحقيق نتيجة محددة."]],
   [["What does the railroad track analogy explain?","ماذا يشرح تشبيه قطع السكة الحديدية؟"],["Data are like pieces of track. Each piece has limited value alone, but when relationships are defined among them, they gain value and a layout emerges (information). Adding new pieces can greatly increase the value.","البيانات مثل قطع السكة. لكل قطعة قيمة محدودة وحدها، لكن عند تحديد العلاقات بينها تكتسب قيمة ويظهر مخطط (المعلومات). إضافة قطع جديدة قد تزيد القيمة كثيرًا."]],
   [["What is knowledge?","ما هي المعرفة (Knowledge)؟"],["The awareness and understanding of a set of information and the ways that information can be made useful to support a specific task or reach a decision.","الإدراك والفهم لمجموعة من المعلومات وللطرق التي تجعلها مفيدة لدعم مهمة محددة أو الوصول إلى قرار."]],
   [["What are the steps of transforming data into information?","ما خطوات تحويل البيانات إلى معلومات؟"],["Select the data, organize it, and finally manipulate it.","اختيار البيانات، ثم تنظيمها، وأخيرًا معالجتها."]],
   [["Name the 9 characteristics of valuable information.","اذكر الخصائص التسع للمعلومات القيّمة."],["Accessible, Accurate, Complete, Flexible, Reliable, Secure, Simple, Timely, Verifiable.","Accessible وAccurate وComplete وFlexible وReliable وSecure وSimple وTimely وVerifiable."]],
   [["What does 'Timely' mean for information?","ماذا تعني 'في الوقت المناسب' (Timely) للمعلومات؟"],["Timely information is delivered when it is needed.","المعلومات في الوقت المناسب تُسلَّم عند الحاجة إليها."]],
   [["Who are knowledge workers (KWs)?","من هم عمال المعرفة (KWs)؟"],["People who create, use, and disseminate knowledge. They are usually professionals in science, engineering, business, and other areas.","أشخاص ينشئون المعرفة ويستخدمونها وينشرونها، وهم عادةً مهنيون في العلوم والهندسة والأعمال ومجالات أخرى."]],
   [["What is knowledge management?","ما هي إدارة المعرفة (Knowledge management)؟"],["A strategy by which an organization determinedly and systematically gathers, organizes, stores, analyzes, and shares its collective knowledge and experience.","استراتيجية تجمع بها المؤسسة معرفتها وخبرتها الجماعية وتنظمها وتخزنها وتحللها وتشاركها بإصرار ومنهجية."]],
   [["What is an information system (IS)?","ما هو نظام المعلومات (IS)؟"],["A set of interrelated components that collect (input), manipulate (processing), store, and disseminate (output) data and information and provide a feedback mechanism to meet an objective.","مجموعة من المكونات المترابطة تجمع (مدخلات) وتعالج وتخزن وتنشر (مخرجات) البيانات والمعلومات وتوفر آلية تغذية راجعة لتحقيق هدف."]],
   [["Define input, processing, output, and feedback in an IS.","عرّف المدخلات والمعالجة والمخرجات والتغذية الراجعة في نظام المعلومات."],["Input: gathering and capturing raw data. Processing: converting data into useful outputs (manually or with a computer). Output: producing useful information, usually documents and reports. Feedback: information used to change input or processing.","المدخلات: جمع البيانات الخام والتقاطها. المعالجة: تحويل البيانات إلى مخرجات مفيدة (يدويًا أو بالحاسوب). المخرجات: إنتاج معلومات مفيدة غالبًا مستندات وتقارير. التغذية الراجعة: معلومات تُستخدم لتغيير المدخلات أو المعالجة."]],
   [["What is forecasting?","ما هو التنبؤ (Forecasting)؟"],["A computer system can predict future events to avoid problems. This concept is often called forecasting.","يمكن لنظام الحاسوب التنبؤ بالأحداث المستقبلية لتجنب المشكلات، ويُسمى هذا المفهوم غالبًا Forecasting."]],
   [["What is Information Technology (IT)?","ما هي تقنية المعلومات (IT)؟"],["The use of any computers, storage, networking and other physical devices, infrastructure and processes to create, process, store, secure and exchange all forms of electronic data.","استخدام أي حواسيب وتخزين وشبكات وأجهزة مادية أخرى وبنية تحتية وعمليات لإنشاء جميع أشكال البيانات الإلكترونية ومعالجتها وتخزينها وتأمينها وتبادلها."]],
   [["IS vs IT: what is the difference?","ما الفرق بين IS وIT؟"],["IT (hardware, software, databases, networks, other components) is used to build IS (payroll, inventory, marketing, customer service systems).","IT (عتاد وبرمجيات وقواعد بيانات وشبكات ومكونات أخرى) تُستخدم لبناء IS (نظم الرواتب والمخزون والتسويق وخدمة العملاء)."]]

     {k:'p', x:["Processing devices include computer chips that contain the central processing unit and main memory.","تشمل أجهزة المعالجة رقائق الحاسوب (Chips) التي تحتوي على وحدة المعالجة المركزية (Central processing unit) والذاكرة الرئيسية (Main memory)."]},

     {k:'p', x:["Scientists estimated that in 2011 there was 1.8 zettabytes (10^21) of digital data in the world and that the amount of data was doubling every two years.","قدّر العلماء أنه في عام 2011 كان هناك 1.8 زيتابايت (Zettabytes) (10^21) من البيانات الرقمية في العالم، وأن كمية البيانات كانت تتضاعف كل عامين."]},

     {k:'ul', h:["Two big questions","سؤالان كبيران"], x:[
       ["How will organizations meet the increased demand for data storage?","كيف ستلبي المؤسسات الطلب المتزايد على تخزين البيانات؟"],
       ["How can an organization keep a vast database secure and safe from the prying eyes of outside individuals and groups?","كيف يمكن للمؤسسة حماية قاعدة بيانات ضخمة وإبقاؤها آمنة من أعين الأفراد والجماعات الخارجية المتطفلة؟"]]}
   ]},
   {t:["4) Telecommunications, Networks and Internet","4) الاتصالات والشبكات والإنترنت"], b:[
     {k:'def', x:["Telecommunications is the electronic transmission of signals for communications, which enables organizations to carry out their processes and tasks through effective computer networks.","الاتصالات (Telecommunications) هي النقل الإلكتروني للإشارات لأغراض التواصل، وهي تمكّن المؤسسات من تنفيذ عملياتها ومهامها عبر شبكات حاسوب فعالة."]},
     {k:'ul', h:["Telecommunications can take place through","يمكن أن تتم الاتصالات عبر"], x:[["Wired transmissions","الإرسال السلكي (Wired)"],["Wireless transmissions","الإرسال اللاسلكي (Wireless)"],["Satellite transmissions","الإرسال عبر الأقمار الصناعية (Satellite)"]]},
     {k:'p', x:["Today, telecommunications is used by people and organizations of all sizes around the world.","اليوم، تُستخدم الاتصالات من قبل الأشخاص والمؤسسات بجميع أحجامها حول العالم."]},
     {k:'p', x:["With telecommunications, people can work at home or while traveling. This approach to work is often called “telework” or “telecommuting”.","بفضل الاتصالات، يمكن للأشخاص العمل من المنزل أو أثناء السفر. يُسمى هذا النمط من العمل غالبًا العمل عن بُعد (Telework) أو (Telecommuting)."]},
     {k:'p', x:["Telecommunications also enables the use of virtual teams of people working on a project to meet and communicate without ever physically being in the same place.","تتيح الاتصالات أيضًا استخدام الفرق الافتراضية (Virtual teams) من الأشخاص العاملين على مشروع للاجتماع والتواصل دون التواجد فعليًا في المكان نفسه."]},
     {k:'def', x:["Networks connect computers and equipment in a building, around the country, or around the world to enable electronic communication.","الشبكات (Networks) تربط الحواسيب والمعدات داخل مبنى أو في أنحاء البلد أو حول العالم لتمكين التواصل الإلكتروني."]},
     {k:'p', x:["Wireless transmission networks enable the use of mobile devices such as smartphones and portable computers.","تتيح شبكات الإرسال اللاسلكي استخدام الأجهزة المحمولة مثل الهواتف الذكية والحواسيب المحمولة."]}
   ]},
   {t:["The Internet, Cloud Computing and the Web","الإنترنت والحوسبة السحابية والويب"], b:[
     {k:'def', x:["The Internet is the world’s largest computer network, consisting of thousands of interconnected networks, all freely exchanging information.","الإنترنت (Internet) هو أكبر شبكة حاسوب في العالم، ويتكون من آلاف الشبكات المترابطة التي تتبادل المعلومات بحرية."]},
     {k:'def', x:["Cloud computing is an environment in which software and data storage are provided by the Internet (“the cloud”). The services are run on another organization’s computer hardware, and both software and data are easily accessed.","الحوسبة السحابية (Cloud computing) هي بيئة تُقدَّم فيها البرمجيات وتخزين البيانات عبر الإنترنت (“السحابة”). تعمل الخدمات على عتاد حاسوب تابع لمؤسسة أخرى، ويسهل الوصول إلى البرمجيات والبيانات."]},
     {k:'p', x:["This increased use of the Internet is not without its risks. Some people fear that increased usage can lead to problems, including loss of privacy and security, with criminals hacking into an organization’s data via the Internet to gain access to sensitive company and customer information.","هذا الاستخدام المتزايد للإنترنت لا يخلو من المخاطر. يخشى بعض الناس أن يؤدي إلى مشكلات منها فقدان الخصوصية (Privacy) والأمان (Security)، حيث يخترق المجرمون بيانات المؤسسة عبر الإنترنت للوصول إلى معلومات حساسة عن الشركة والعملاء."]},
     {k:'def', x:["The World Wide Web (WWW), or the Web, is a network of links on the Internet to documents containing text, graphics, video, and sound.","الشبكة العنكبوتية العالمية (World Wide Web - WWW) أو الويب هي شبكة من الروابط على الإنترنت تؤدي إلى مستندات تحتوي على نصوص ورسومات وفيديو وصوت."]},
     {k:'p', x:["Information about the documents and access to them are controlled and provided by tens of thousands of special computers called Web servers.","تُدار المعلومات عن المستندات والوصول إليها وتُقدَّم من خلال عشرات الآلاف من الحواسيب الخاصة التي تسمى خوادم الويب (Web servers)."]},
     {k:'p', x:["The Web is one of many services available over the Internet and provides access to millions of documents.","الويب هو إحدى الخدمات العديدة المتاحة عبر الإنترنت، ويتيح الوصول إلى ملايين المستندات."]}
   ]},
   {t:["Intranet and Extranet","الإنترانت والإكسترانت"], b:[
     {k:'cards', c:[
       {t:["Intranet","الإنترانت (Intranet)"], l:[["An internal network based on Web technologies that allows people within an organization to exchange information and work on projects.","شبكة داخلية تعتمد على تقنيات الويب تتيح للأشخاص داخل المؤسسة تبادل المعلومات والعمل على المشاريع."]]},
       {t:["Extranet","الإكسترانت (Extranet)"], l:[["A network based on Web technologies that allows selected outsiders, such as business partners and customers, to access authorized resources of a company’s intranet.","شبكة تعتمد على تقنيات الويب تتيح لأشخاص خارجيين مختارين، مثل شركاء الأعمال والعملاء، الوصول إلى موارد مصرح بها في إنترانت الشركة."]]}
     ]},
     {k:'tip', x:["Intranet = inside the organization. Extranet = selected outsiders (partners, customers). Internet = open to the world.","Intranet = داخل المؤسسة. Extranet = أشخاص خارجيون مختارون (شركاء وعملاء). Internet = مفتوح للعالم."]}
   ]},
   {t:["5) People","5) الأشخاص (People)"], b:[
     {k:'p', x:["People are the most important element in computer-based information systems.","الأشخاص (People) هم أهم عنصر في نظم المعلومات المعتمدة على الحاسوب."]},
     {k:'p', x:["Good systems can enable ordinary people to produce extraordinary results.","يمكن للنظم الجيدة أن تمكّن الأشخاص العاديين من تحقيق نتائج استثنائية."]},
     {k:'def', x:["The chief information officer (CIO) is the person who manages the IS department.","مدير المعلومات التنفيذي (Chief information officer - CIO) هو الشخص الذي يدير قسم نظم المعلومات (IS department)."]}
   ]},
   {t:["6) Procedures","6) الإجراءات (Procedures)"], b:[
     {k:'def', x:["Procedures are the strategies, policies, methods, and rules for using a CBIS. A procedure defines the steps to follow in order to achieve a specific end result.","الإجراءات (Procedures) هي الاستراتيجيات والسياسات والأساليب والقواعد لاستخدام نظام CBIS. يحدد الإجراء الخطوات الواجب اتباعها لتحقيق نتيجة نهائية محددة."]},
     {k:'ul', h:["Good procedures describe","الإجراءات الجيدة تصف"], x:[["How to achieve the desired end result","كيفية تحقيق النتيجة النهائية المطلوبة"],["Who does what and when","من يفعل ماذا ومتى"],["What to do in the event that something goes wrong","ماذا يُفعل في حال حدوث خطأ ما"]]},
     {k:'p', x:["When people are well trained and follow effective procedures, they can get work done faster, cut costs, make better use of people resources, and enable people to adapt to change.","عندما يكون الأشخاص مدرَّبين جيدًا ويتبعون إجراءات فعالة، يمكنهم إنجاز العمل أسرع، وخفض التكاليف، واستخدام الموارد البشرية بشكل أفضل، ومساعدة الناس على التكيف مع التغيير."]},
     {k:'p', x:["When procedures are well documented, they can greatly reduce training costs and shorten the learning curve.","عندما تكون الإجراءات موثقة جيدًا، يمكنها أن تقلل تكاليف التدريب كثيرًا وتقصّر منحنى التعلم (Learning curve)."]}
   ]}
  ],
  take:[
   ["CBIS = hardware, software, databases, telecommunications, people, and procedures working together.","CBIS = العتاد والبرمجيات وقواعد البيانات والاتصالات والأشخاص والإجراءات تعمل معًا."],
   ["IT refers to hardware, software, databases, and telecommunications.","IT تشير إلى العتاد والبرمجيات وقواعد البيانات والاتصالات."],
   ["Two types of software: system software and application software.","نوعان من البرمجيات: برمجيات النظام وبرمجيات التطبيقات."],
   ["Intranet is internal; extranet gives selected outsiders access; the Internet is the largest network.","الإنترانت داخلي، والإكسترانت يمنح خارجيين مختارين وصولًا، والإنترنت هو أكبر شبكة."],
   ["People are the most important element of a CBIS.","الأشخاص هم أهم عنصر في نظام CBIS."],
   ["Good, documented procedures speed up work, cut costs, and shorten the learning curve.","الإجراءات الجيدة والموثقة تسرّع العمل وتخفض التكاليف وتقصّر منحنى التعلم."]
  ],
  fc:[
   [["What is a CBIS?","ما هو نظام CBIS؟"],["A single set of hardware, software, databases, telecommunications, people, and procedures configured to collect, manipulate, store, and process data into information. Also called technology infrastructure.","مجموعة واحدة من العتاد والبرمجيات وقواعد البيانات والاتصالات والأشخاص والإجراءات، مهيأة لجمع البيانات ومعالجتها وتخزينها وتحويلها إلى معلومات. تسمى أيضًا البنية التحتية التقنية."]],
   [["What does IT refer to?","إلى ماذا تشير IT؟"],["Hardware, software, databases, and telecommunications.","العتاد والبرمجيات وقواعد البيانات والاتصالات."]],
   [["Name the 6 components of a CBIS.","اذكر المكونات الستة لنظام CBIS."],["Hardware, software, databases, telecommunications/networks/Internet, people, procedures.","العتاد، البرمجيات، قواعد البيانات، الاتصالات/الشبكات/الإنترنت، الأشخاص، الإجراءات."]],
   [["What is hardware in a CBIS?","ما هو العتاد في نظام CBIS؟"],["Computer equipment used to perform input, processing, storage, and output activities.","معدات الحاسوب المستخدمة لتنفيذ أنشطة الإدخال والمعالجة والتخزين والإخراج."]],
   [["What does better chip design give?","ماذا يعطي تحسين تصميم الرقائق؟"],["Faster speeds, less power consumption, and larger storage capacity, so the computer performs more efficiently.","سرعات أعلى، واستهلاكًا أقل للطاقة، وسعة تخزين أكبر، فيعمل الحاسوب بكفاءة أكبر."]],
   [["What is the hardware trend in the computer industry?","ما الاتجاه في عتاد الحواسيب؟"],["Smaller, faster, and more mobile hardware, such as tablet computers.","عتاد أصغر وأسرع وأكثر قابلية للتنقل، مثل الحواسيب اللوحية."]],
   [["What are the two primary types of software?","ما النوعان الرئيسيان للبرمجيات؟"],["System software (e.g., Microsoft Windows) and application software (e.g., Microsoft Excel) which allows you to accomplish specific tasks.","برمجيات النظام (مثل Windows) وبرمجيات التطبيقات (مثل Excel) التي تتيح إنجاز مهام محددة."]],
   [["What is a database?","ما هي قاعدة البيانات؟"],["An organized collection of facts and information, typically consisting of two or more related data files.","مجموعة منظمة من الحقائق والمعلومات، تتكون عادةً من ملفي بيانات مترابطين أو أكثر."]],
   [["How much digital data was estimated in 2011?","كم قُدّرت البيانات الرقمية في عام 2011؟"],["1.8 zettabytes (10^21), and the amount was doubling every two years.","1.8 زيتابايت (10^21)، وكانت الكمية تتضاعف كل عامين."]],
   [["What does the increase in digital data require?","ماذا تتطلب زيادة البيانات الرقمية؟"],["More storage devices, more space to house them, and additional electricity to operate them.","مزيدًا من أجهزة التخزين، ومساحة أكبر لاستيعابها، وكهرباء إضافية لتشغيلها."]],
   [["What is telecommunications?","ما هي الاتصالات (Telecommunications)؟"],["The electronic transmission of signals for communications, enabling organizations to carry out processes and tasks through effective computer networks. It can use wired, wireless, and satellite transmissions.","النقل الإلكتروني للإشارات لأغراض التواصل، وتمكّن المؤسسات من تنفيذ عملياتها عبر شبكات حاسوب فعالة. وقد تكون سلكية أو لاسلكية أو عبر الأقمار الصناعية."]],
   [["What are telework and virtual teams?","ما هما العمل عن بُعد والفرق الافتراضية؟"],["Telework (telecommuting) means working at home or while traveling. Virtual teams meet and communicate on a project without being in the same place.","العمل عن بُعد (Telecommuting) هو العمل من المنزل أو أثناء السفر. الفرق الافتراضية تجتمع وتتواصل على مشروع دون التواجد في المكان نفسه."]],
   [["What is the Internet?","ما هو الإنترنت؟"],["The world’s largest computer network, consisting of thousands of interconnected networks, all freely exchanging information.","أكبر شبكة حاسوب في العالم، تتكون من آلاف الشبكات المترابطة التي تتبادل المعلومات بحرية."]],
   [["What is cloud computing?","ما هي الحوسبة السحابية؟"],["An environment where software and data storage are provided by the Internet (“the cloud”). Services run on another organization’s hardware, and software and data are easily accessed.","بيئة تُقدَّم فيها البرمجيات وتخزين البيانات عبر الإنترنت (السحابة). تعمل الخدمات على عتاد مؤسسة أخرى ويسهل الوصول إلى البرمجيات والبيانات."]],
   [["What are the risks of increased Internet use?","ما مخاطر زيادة استخدام الإنترنت؟"],["Loss of privacy and security, with criminals hacking into an organization’s data to access sensitive company and customer information.","فقدان الخصوصية والأمان، واختراق المجرمين لبيانات المؤسسة للوصول إلى معلومات حساسة عن الشركة والعملاء."]],
   [["What is the World Wide Web?","ما هي الشبكة العنكبوتية العالمية (WWW)؟"],["A network of links on the Internet to documents containing text, graphics, video, and sound, provided by tens of thousands of computers called Web servers. It is one of many services over the Internet.","شبكة من الروابط على الإنترنت إلى مستندات تحتوي على نص ورسوم وفيديو وصوت، تقدمها عشرات الآلاف من الحواسيب المسماة خوادم الويب. وهي إحدى الخدمات العديدة عبر الإنترنت."]],
   [["Intranet vs extranet?","الإنترانت مقابل الإكسترانت؟"],["Intranet: internal network based on Web technologies for people within an organization. Extranet: lets selected outsiders (business partners, customers) access authorized resources of the intranet.","الإنترانت: شبكة داخلية تعتمد تقنيات الويب للأشخاص داخل المؤسسة. الإكسترانت: تتيح لخارجيين مختارين (شركاء وعملاء) الوصول إلى موارد مصرح بها في الإنترانت."]],
   [["Who is the CIO?","من هو CIO؟"],["The chief information officer, who manages the IS department.","مدير المعلومات التنفيذي، وهو من يدير قسم نظم المعلومات."]],
   [["What are procedures and what should good procedures describe?","ما هي الإجراءات وماذا تصف الإجراءات الجيدة؟"],["Strategies, policies, methods, and rules for using a CBIS. Good procedures describe how to achieve the desired result, who does what and when, and what to do if something goes wrong.","استراتيجيات وسياسات وأساليب وقواعد لاستخدام CBIS. تصف الإجراءات الجيدة كيفية تحقيق النتيجة، ومن يفعل ماذا ومتى، وماذا يُفعل عند حدوث خطأ."]]
  ],

   {q:["An internal network based on Web technologies is called a(n):","الشبكة الداخلية المبنية على تقنيات الويب تسمى:"], o:[["Extranet","إكسترانت"],["Internet","إنترنت"],["Intranet","إنترانت"],["Cloud","سحابة"]], a:2},

   {q:["The CIO is the person who:","مدير المعلومات التنفيذي (CIO) هو الشخص الذي:"], o:[["Repairs hardware","يصلح العتاد"],["Manages the IS department","يدير قسم نظم المعلومات"],["Writes all software","يكتب كل البرمجيات"],["Installs cables","يركّب الكابلات"]], a:1},

LECTURES.push({ id:'l3', n:3,
  title:["Hardware","العتاد (Hardware)"],
  obj:[
    ["Explain why organizations invest in hardware and software.","شرح سبب استثمار المؤسسات في العتاد والبرمجيات."],
    ["Describe the CPU, ALU, control unit, registers, bus, and primary storage.","وصف وحدة المعالجة المركزية (CPU) ووحدة الحساب والمنطق (ALU) ووحدة التحكم (Control unit) والمسجلات (Registers) والناقل (Bus) والتخزين الرئيسي (Primary storage)."],
    ["Explain processing speed, memory types, and multiprocessing.","شرح سرعة المعالجة وأنواع الذاكرة والمعالجة المتعددة (Multiprocessing)."],
    ["Describe secondary storage devices and access methods.","وصف أجهزة التخزين الثانوي (Secondary storage) وطرق الوصول (Access methods)."],
    ["Identify the types of computer systems.","التعرف على أنواع أنظمة الحاسوب."],
    ["Explain data centers and green computing.","شرح مراكز البيانات (Data centers) والحوسبة الخضراء (Green computing)."]
  ],
  sec:[
   {t:["1. Introduction","1. مقدمة"], b:[
     {k:'p', x:["Organizations invest in computer hardware and software to improve worker productivity, increase revenue, reduce costs, and provide better customer service.","تستثمر المؤسسات في عتاد الحاسوب والبرمجيات لتحسين إنتاجية العاملين وزيادة الإيرادات وخفض التكاليف وتقديم خدمة أفضل للعملاء."]},
     {k:'p', x:["Choosing the right computer hardware requires understanding its relationship to the information systems and the current and future needs of the organization.","يتطلب اختيار عتاد الحاسوب المناسب فهم علاقته بنظم المعلومات واحتياجات المؤسسة الحالية والمستقبلية."]},
     {k:'def', x:["Hardware refers to the physical components of a computer that perform the input, processing, storage, and output activities of the computer.","يشير العتاد (Hardware) إلى المكونات المادية للحاسوب التي تنفذ أنشطة الإدخال والمعالجة والتخزين والإخراج."]},
     {k:'def', x:["Software consists of the computer programs that govern the operation of the computer.","تتكون البرمجيات (Software) من برامج الحاسوب التي تتحكم في تشغيل الحاسوب."]}
   ]},
   {t:["2. Hardware Components","2. مكونات العتاد (Hardware Components)"], b:[
     {k:'def', x:["The central processing unit (CPU), or simply processor, is the part of a computer that sequences and executes instructions.","وحدة المعالجة المركزية (CPU) أو المعالج (Processor) هي الجزء من الحاسوب الذي يرتب التعليمات وينفذها."]},
     {k:'p', x:["The CPU consists of three primary elements: the arithmetic/logic unit, the control unit, and storage registers.","تتكون وحدة CPU من ثلاثة عناصر رئيسية: وحدة الحساب والمنطق (Arithmetic/logic unit)، ووحدة التحكم (Control unit)، ومسجلات التخزين (Storage registers)."]},
     {k:'cards', c:[
       {t:["Arithmetic/Logic Unit (ALU)","وحدة الحساب والمنطق (ALU)"], l:[["Performs mathematical calculations and makes logical comparisons.","تنفذ العمليات الحسابية وتجري المقارنات المنطقية."]]},
       {t:["Control Unit","وحدة التحكم (Control Unit)"], l:[["Sequentially accesses program instructions, decodes them, and coordinates the flow of data in and out of the ALU, primary storage, and even secondary storage and various output devices.","تصل إلى تعليمات البرنامج بالتسلسل وتفك ترميزها (Decode) وتنسق تدفق البيانات من وإلى ALU والتخزين الرئيسي وحتى التخزين الثانوي وأجهزة الإخراج المختلفة."]]},
       {t:["Registers","المسجلات (Registers)"], l:[["High-speed storage areas used to temporarily hold small units of program instructions and data immediately before, during, and after execution by the CPU.","مناطق تخزين عالية السرعة تُستخدم لحفظ وحدات صغيرة من تعليمات البرنامج والبيانات مؤقتًا قبل التنفيذ بواسطة CPU وأثناءه وبعده مباشرة."]]}
     ]},
     {k:'def', x:["Bus: a set of electronic circuits used to route data and instructions to and from the various components of a computer.","الناقل (Bus): مجموعة من الدوائر الإلكترونية تُستخدم لتوجيه البيانات والتعليمات من وإلى مكونات الحاسوب المختلفة."]},
     {k:'def', x:["Primary storage, also called main memory or memory, holds program instructions and data and is closely associated with the CPU.","التخزين الرئيسي (Primary storage)، ويسمى أيضًا الذاكرة الرئيسية (Main memory) أو الذاكرة (Memory)، يحتفظ بتعليمات البرنامج والبيانات وهو مرتبط ارتباطًا وثيقًا بوحدة CPU."]}
   ]},
   {t:["3. Processing and Memory Devices: Power, Speed, and Capacity","3. أجهزة المعالجة والذاكرة: القدرة والسرعة والسعة"], b:[
     {k:'p', x:["Processing characteristics and functions: Because efficient processing and timely output are important, organizations use a variety of measures to gauge processing speed.","خصائص المعالجة ووظائفها: لأن المعالجة الفعالة والمخرجات في الوقت المناسب مهمة، تستخدم المؤسسات مقاييس متنوعة لقياس سرعة المعالجة."]},
     {k:'def', x:["Clock speed: a series of electronic pulses produced at a predetermined rate that affects machine cycle time.","سرعة الساعة (Clock speed): سلسلة من النبضات الإلكترونية تُنتج بمعدل محدد مسبقًا وتؤثر في زمن دورة الآلة (Machine cycle time)."]},
     {k:'def', x:["Gigahertz (GHz): billions of cycles per second, a measure of clock speed.","الجيجاهرتز (GHz): مليارات الدورات في الثانية، وهو مقياس لسرعة الساعة."]},
     {k:'p', x:["Memory characteristics and functions: Memory provides the CPU with a working storage area for program instructions and data. The chief feature of memory is that it rapidly provides the data and instructions to the CPU.","خصائص الذاكرة ووظائفها: توفر الذاكرة لوحدة CPU منطقة تخزين عمل (Working storage) لتعليمات البرنامج والبيانات. وأهم ميزة للذاكرة هي أنها تزود CPU بالبيانات والتعليمات بسرعة."]},
     {k:'p', x:["Storage capacity: Like the CPU, memory devices contain thousands of circuits imprinted on a silicon chip. Data is stored in memory as a combination of on or off circuit states.","سعة التخزين (Storage capacity): مثل CPU، تحتوي أجهزة الذاكرة على آلاف الدوائر المطبوعة على رقاقة سيليكون (Silicon chip). تُخزَّن البيانات في الذاكرة كمجموعة من حالات الدوائر المشغلة أو المطفأة (On/Off)."]},
     {k:'p', x:["In most cases, storage capacity is measured in bytes, with 1 byte equivalent to one character of data.","في معظم الحالات تُقاس سعة التخزين بالبايت (Byte)، حيث يعادل 1 بايت حرفًا واحدًا من البيانات."]},
     {k:'formula', x:"1 byte = 1 character of data"}
   ]},
   {t:["Types of Memory","أنواع الذاكرة"], b:[
     {k:'cards', c:[
       {t:["Random Access Memory (RAM)","الذاكرة العشوائية (RAM)"], l:[["A form of memory in which instructions or data can be temporarily stored.","شكل من الذاكرة يمكن فيه تخزين التعليمات أو البيانات مؤقتًا."]]},
       {t:["Read-Only Memory (ROM)","ذاكرة القراءة فقط (ROM)"], l:[["A type of memory that is nonvolatile.","نوع من الذاكرة غير المتطايرة (Nonvolatile)."],["The combination of circuit states is fixed, so its contents are not lost if the power is removed.","حالات الدوائر ثابتة، لذا لا تُفقد محتوياتها إذا انقطعت الطاقة."],["ROM provides permanent storage for data and instructions that do not change.","توفر ROM تخزينًا دائمًا للبيانات والتعليمات التي لا تتغير."]]}
     ]},
     {k:'tip', x:["RAM = temporary storage. ROM = permanent, nonvolatile storage.","RAM = تخزين مؤقت. ROM = تخزين دائم وغير متطاير."]}
   ]},
   {t:["Multiprocessing","المعالجة المتعددة (Multiprocessing)"], b:[
     {k:'p', x:["There are a number of forms of multiprocessing, which involves the simultaneous execution of two or more instructions.","هناك أشكال عديدة من المعالجة المتعددة (Multiprocessing)، وهي التنفيذ المتزامن لتعليمتين أو أكثر."]},
     {k:'def', x:["Multicore microprocessor: a microprocessor that combines two or more independent processors into a single computer so that they share the workload and improve processing capacity.","المعالج متعدد النوى (Multicore microprocessor): معالج دقيق يجمع معالجين مستقلين أو أكثر في حاسوب واحد ليتقاسموا عبء العمل ويحسّنوا قدرة المعالجة."]},
     {k:'p', x:["When selecting a CPU, organizations must balance the benefits of processing speed with energy requirements, size, and cost.","عند اختيار CPU، يجب على المؤسسات الموازنة بين فوائد سرعة المعالجة ومتطلبات الطاقة والحجم والتكلفة."]},
     {k:'p', x:["Chip designers and manufacturers are exploring various means to avoid heat problems in their new designs.","يستكشف مصممو الرقائق ومصنّعوها وسائل متنوعة لتجنب مشكلات الحرارة في تصاميمهم الجديدة."]},
     {k:'ex', x:["ARM is a computer chip design company whose energy-efficient chip architecture is broadly used in smartphones and tablet computers.","ARM شركة لتصميم رقائق الحاسوب، وتُستخدم بنية رقائقها الموفرة للطاقة على نطاق واسع في الهواتف الذكية والحواسيب اللوحية."]},
     {k:'def', x:["Parallel computing: the simultaneous execution of the same task on multiple processors to obtain results faster.","الحوسبة المتوازية (Parallel computing): التنفيذ المتزامن للمهمة نفسها على عدة معالجات للحصول على النتائج أسرع."]},
     {k:'p', x:["The most frequent uses for parallel computing include modeling, simulation, and analyzing large amounts of data.","أكثر استخدامات الحوسبة المتوازية شيوعًا: النمذجة (Modeling) والمحاكاة (Simulation) وتحليل كميات كبيرة من البيانات."]},
     {k:'def', x:["Massively parallel processing system: a form of multiprocessing that speeds processing by linking hundreds or thousands of processors to operate at the same time.","نظام المعالجة المتوازية الضخمة (Massively parallel processing): شكل من المعالجة المتعددة يسرّع المعالجة بربط مئات أو آلاف المعالجات لتعمل في الوقت نفسه."]},
     {k:'def', x:["Grid computing: the use of a collection of computers, often owned by multiple individuals or organizations, to work in a coordinated manner to solve a common problem. Grid computing is a low-cost approach to parallel processing.","الحوسبة الشبكية (Grid computing): استخدام مجموعة من الحواسيب، غالبًا مملوكة لعدة أفراد أو مؤسسات، للعمل بشكل منسق لحل مشكلة مشتركة. وهي نهج منخفض التكلفة للمعالجة المتوازية."]},
     {k:'tip', x:["Key to the success of grid computing is a central server that acts as the grid leader and traffic monitor.","مفتاح نجاح الحوسبة الشبكية هو خادم مركزي يعمل كقائد للشبكة (Grid leader) ومراقب لحركة البيانات (Traffic monitor)."]}
   ]},
   {t:["4. Secondary Storage","4. التخزين الثانوي (Secondary Storage)"], b:[
     {k:'p', x:["Computer systems also need to store larger amounts of data, instructions, and information more permanently than main memory allows. Secondary storage, also called permanent storage, serves this purpose.","تحتاج أنظمة الحاسوب أيضًا إلى تخزين كميات أكبر من البيانات والتعليمات والمعلومات بشكل أكثر دوامًا مما تسمح به الذاكرة الرئيسية. ويؤدي التخزين الثانوي (Secondary storage)، ويسمى أيضًا التخزين الدائم (Permanent storage)، هذا الغرض."]},
     {k:'p', x:["Access methods: data and information access can be either sequential or direct.","طرق الوصول (Access methods): يمكن أن يكون الوصول إلى البيانات والمعلومات تسلسليًا أو مباشرًا."]},
     {k:'cards', c:[
       {t:["Sequential access","الوصول التسلسلي (Sequential access)"], l:[["Data must be accessed in the order in which it is stored.","يجب الوصول إلى البيانات بالترتيب الذي خُزّنت به."],["Sequential access storage device (SASD): a device used to sequentially access secondary storage data.","جهاز التخزين ذو الوصول التسلسلي (SASD): جهاز يُستخدم للوصول التسلسلي إلى بيانات التخزين الثانوي."]]},
       {t:["Direct access","الوصول المباشر (Direct access)"], l:[["Data can be retrieved directly, without having to pass by other data in sequence.","يمكن استرجاع البيانات مباشرة دون المرور على بيانات أخرى بالتسلسل."],["Direct access storage device (DASD): a device used for direct access of secondary storage data.","جهاز التخزين ذو الوصول المباشر (DASD): جهاز يُستخدم للوصول المباشر إلى بيانات التخزين الثانوي."]]}
     ]}
   ]},
   {t:["Secondary Storage Devices","أجهزة التخزين الثانوي"], b:[
     {k:'def', x:["Magnetic tapes: a type of sequential secondary storage medium, now used primarily for storing backups of critical organizational data in the event of a disaster.","الأشرطة المغناطيسية (Magnetic tapes): نوع من وسائط التخزين الثانوي التسلسلية، تُستخدم الآن أساسًا لتخزين النسخ الاحتياطية (Backups) لبيانات المؤسسة الحرجة تحسبًا للكوارث."]},
     {k:'def', x:["Hard disks: a hard disk drive (HDD) is a direct access storage device used to store and retrieve data from rapidly rotating disks coated with magnetic material.","الأقراص الصلبة (Hard disks): محرك القرص الصلب (HDD) هو جهاز تخزين ذو وصول مباشر يُستخدم لتخزين البيانات واسترجاعها من أقراص تدور بسرعة مغطاة بمادة مغناطيسية."]},
     {k:'def', x:["RAID: a redundant array of independent/inexpensive disks (RAID) is a method of storing data that generates extra bits of data from existing data, enabling the system to create a “reconstruction map” so that if a hard drive fails, it can rebuild lost data.","RAID: المصفوفة الزائدة من الأقراص المستقلة/الرخيصة (Redundant array of independent/inexpensive disks) هي طريقة لتخزين البيانات تولّد بتات إضافية من البيانات الموجودة، فيتمكن النظام من إنشاء “خريطة إعادة بناء” (Reconstruction map) بحيث إذا تعطل قرص صلب يمكنه إعادة بناء البيانات المفقودة."]},
     {k:'def', x:["Disk mirroring: a process of storing data that provides an exact copy that protects users fully in the event of data loss.","عكس القرص (Disk mirroring): عملية تخزين بيانات توفر نسخة مطابقة تمامًا تحمي المستخدمين حماية كاملة في حال فقدان البيانات."]},
     {k:'def', x:["Storage area network (SAN): a high-speed, special-purpose network that integrates different types of data storage devices (e.g., HDD, magnetic tape, SSD) into a single storage system and connects that to computing resources across an entire organization.","شبكة منطقة التخزين (SAN): شبكة عالية السرعة ذات غرض خاص تدمج أنواعًا مختلفة من أجهزة تخزين البيانات (مثل HDD والشريط المغناطيسي وSSD) في نظام تخزين واحد وتربطه بموارد الحوسبة في المؤسسة بأكملها."]},
     {k:'def', x:["Optical secondary storage devices: an optical storage device uses special lasers to read and write data.","أجهزة التخزين الثانوي البصرية (Optical storage): جهاز تخزين بصري يستخدم أشعة ليزر خاصة لقراءة البيانات وكتابتها."]},
     {k:'def', x:["Solid state secondary storage devices (SSD): a storage device that stores data in memory chips rather than on hard disk drives or optical media.","أجهزة التخزين ذات الحالة الصلبة (SSD): جهاز تخزين يخزن البيانات في رقائق ذاكرة بدلًا من محركات الأقراص الصلبة أو الوسائط البصرية."]},
     {k:'p', x:["SSD memory chips require less power and provide much faster data access than magnetic data storage devices.","تتطلب رقائق ذاكرة SSD طاقة أقل وتوفر وصولًا أسرع بكثير إلى البيانات من أجهزة التخزين المغناطيسية."]},
     {k:'def', x:["Storage as a service: a data storage model where a data storage service provider rents space to individuals and organizations. Users access their rented data storage via the Internet.","التخزين كخدمة (Storage as a service): نموذج لتخزين البيانات يؤجّر فيه مزود خدمة التخزين مساحة للأفراد والمؤسسات. ويصل المستخدمون إلى مساحة التخزين المستأجرة عبر الإنترنت."]}
   ]},
   {t:["5. Input/Output Devices","5. أجهزة الإدخال والإخراج (Input/Output Devices)"], b:[
     {k:'def', x:["Input/output devices provide data and instructions to the computer and receive results from it.","أجهزة الإدخال/الإخراج (Input/output devices) تزود الحاسوب بالبيانات والتعليمات وتستقبل النتائج منه."]}
   ]},
   {t:["6. Computer System Types","6. أنواع أنظمة الحاسوب"], b:[
     {k:'cards', c:[
       {t:["Portable Computers","الحواسيب المحمولة (Portable Computers)"], l:[["A computer small enough to carry easily.","حاسوب صغير بما يكفي لحمله بسهولة."],["Laptop: a personal computer designed for use by mobile users, being small and light enough to sit comfortably on a user’s lap.","الحاسوب المحمول (Laptop): حاسوب شخصي مصمم للمستخدمين المتنقلين، صغير وخفيف بما يكفي ليوضع بارتياح على حضن المستخدم."],["Tablet computer: a portable, lightweight computer with no keyboard that allows you to roam the office, home, or factory floor carrying the device like a clipboard.","الحاسوب اللوحي (Tablet computer): حاسوب محمول خفيف بلا لوحة مفاتيح يتيح لك التجول في المكتب أو المنزل أو أرضية المصنع وحمل الجهاز كلوح الكتابة (Clipboard)."]]},
       {t:["Nonportable Single-User Computers","الحواسيب الثابتة لمستخدم واحد"], l:[["Thin client: a low-cost, centrally managed computer with no internal or external attached drives for data storage. Thin clients work well in a cloud-computing environment to enable users to access the computing and data resources available within the cloud.","العميل الرفيع (Thin client): حاسوب منخفض التكلفة تُدار مركزيًا بلا محركات تخزين داخلية أو خارجية. يعمل جيدًا في بيئة الحوسبة السحابية لتمكين المستخدمين من الوصول إلى موارد الحوسبة والبيانات المتاحة داخل السحابة."],["Desktop computer: a non-portable computer that fits on a desktop and provides sufficient computing power, memory, and storage for most business computing tasks.","الحاسوب المكتبي (Desktop computer): حاسوب غير محمول يوضع على المكتب ويوفر قدرة حوسبة وذاكرة وتخزينًا كافية لمعظم مهام الأعمال."],["Workstation: a more powerful personal computer used for mathematical computing, computer-assisted design, and other high-end processing but still small enough to fit on a desktop.","محطة العمل (Workstation): حاسوب شخصي أقوى يُستخدم للحوسبة الرياضية والتصميم بمساعدة الحاسوب (Computer-assisted design) والمعالجة العالية الأداء الأخرى، لكنه صغير بما يكفي ليوضع على المكتب."]]}

      r:[
       [["Server","الخادم (Server)"],["A computer employed by many users to perform a specific task, such as running network or Internet applications.","حاسوب يستخدمه عدة مستخدمين لأداء مهمة محددة، مثل تشغيل تطبيقات الشبكة أو الإنترنت."]],
       [["Server farm","مزرعة الخوادم (Server farm)"],["A facility that houses a large number of servers in the same room, where access to the machines can be controlled and authorized support personnel can more easily manage and maintain the servers.","منشأة تضم عددًا كبيرًا من الخوادم في الغرفة نفسها، حيث يمكن التحكم في الوصول إلى الأجهزة ويسهل على فريق الدعم المصرح له إدارة الخوادم وصيانتها."]],
       [["Virtual server","الخادم الافتراضي (Virtual server)"],["A method of logically dividing the resources of a single physical server to create multiple logical servers, each acting as its own dedicated machine.","طريقة لتقسيم موارد خادم مادي واحد منطقيًا لإنشاء عدة خوادم منطقية، يعمل كل منها كجهاز مخصص مستقل."]],
       [["Mainframe computer","الحاسوب المركزي (Mainframe)"],["A large, powerful computer shared by dozens or even hundreds of concurrent users connected to the machine over a network.","حاسوب كبير وقوي يشترك فيه عشرات أو حتى مئات المستخدمين المتزامنين المتصلين بالجهاز عبر شبكة."]],
       [["Supercomputer","الحاسوب الفائق (Supercomputer)"],["The most powerful computers, with the fastest processing speed and highest performance.","أقوى الحواسيب، بأسرع سرعة معالجة وأعلى أداء."]]

  take:[
   ["The CPU has three parts: ALU, control unit, and registers.","وحدة CPU لها ثلاثة أجزاء: ALU ووحدة التحكم والمسجلات."],
   ["Clock speed is measured in GHz (billions of cycles per second).","تُقاس سرعة الساعة بالجيجاهرتز (مليارات الدورات في الثانية)."],
   ["RAM is temporary; ROM is permanent (nonvolatile).","RAM مؤقتة؛ ROM دائمة (غير متطايرة)."],

   ["Secondary storage is permanent; access is sequential (tape) or direct (HDD, SSD).","التخزين الثانوي دائم؛ والوصول تسلسلي (الشريط) أو مباشر (HDD وSSD)."],
   ["RAID and disk mirroring protect data from drive failure.","RAID وعكس القرص يحميان البيانات من تعطل القرص."],

  fc:[
   [["Why do organizations invest in hardware and software?","لماذا تستثمر المؤسسات في العتاد والبرمجيات؟"],["To improve worker productivity, increase revenue, reduce costs, and provide better customer service.","لتحسين إنتاجية العاملين وزيادة الإيرادات وخفض التكاليف وتقديم خدمة أفضل للعملاء."]],
   [["What is the CPU and what are its three elements?","ما هي وحدة CPU وما عناصرها الثلاثة؟"],["The part of a computer that sequences and executes instructions. Elements: arithmetic/logic unit, control unit, and storage registers.","الجزء الذي يرتب التعليمات وينفذها. العناصر: وحدة الحساب والمنطق ووحدة التحكم ومسجلات التخزين."]],
   [["What does the ALU do?","ماذا تفعل وحدة ALU؟"],["Performs mathematical calculations and makes logical comparisons.","تنفذ العمليات الحسابية وتجري المقارنات المنطقية."]],
   [["What does the control unit do?","ماذا تفعل وحدة التحكم؟"],["Sequentially accesses program instructions, decodes them, and coordinates the flow of data in and out of the ALU, primary storage, and even secondary storage and output devices.","تصل إلى التعليمات بالتسلسل وتفك ترميزها وتنسق تدفق البيانات من وإلى ALU والتخزين الرئيسي وحتى التخزين الثانوي وأجهزة الإخراج."]],
   [["What are registers?","ما هي المسجلات (Registers)؟"],["High-speed storage areas that temporarily hold small units of program instructions and data immediately before, during, and after execution by the CPU.","مناطق تخزين عالية السرعة تحتفظ مؤقتًا بوحدات صغيرة من التعليمات والبيانات قبل التنفيذ بواسطة CPU وأثناءه وبعده."]],
   [["What is a bus?","ما هو الناقل (Bus)؟"],["A set of electronic circuits used to route data and instructions to and from the various components of a computer.","مجموعة من الدوائر الإلكترونية لتوجيه البيانات والتعليمات من وإلى مكونات الحاسوب."]],
   [["What is primary storage?","ما هو التخزين الرئيسي؟"],["Also called main memory or memory. It holds program instructions and data and is closely associated with the CPU.","يسمى أيضًا الذاكرة الرئيسية أو الذاكرة. يحتفظ بتعليمات البرنامج والبيانات ومرتبط بوحدة CPU."]],
   [["What are clock speed and GHz?","ما هما سرعة الساعة والجيجاهرتز؟"],["Clock speed: a series of electronic pulses produced at a predetermined rate that affects machine cycle time. GHz: billions of cycles per second, a measure of clock speed.","سرعة الساعة: سلسلة نبضات إلكترونية بمعدل محدد تؤثر في زمن دورة الآلة. GHz: مليارات الدورات في الثانية، مقياس لسرعة الساعة."]],
   [["How is data stored in memory and measured?","كيف تُخزَّن البيانات في الذاكرة وكيف تُقاس؟"],["As a combination of on or off circuit states on silicon chips. Capacity is measured in bytes; 1 byte = one character.","كمجموعة من حالات الدوائر المشغلة أو المطفأة على رقائق السيليكون. تُقاس السعة بالبايت؛ 1 بايت = حرف واحد."]],
   [["RAM vs ROM?","RAM مقابل ROM؟"],["RAM: temporary storage of instructions or data. ROM: nonvolatile, fixed circuit states, contents are not lost when power is removed; permanent storage for data and instructions that do not change.","RAM: تخزين مؤقت للتعليمات أو البيانات. ROM: غير متطايرة، حالات دوائر ثابتة، لا تُفقد محتوياتها عند انقطاع الطاقة؛ تخزين دائم للبيانات والتعليمات التي لا تتغير."]],
   [["What is a multicore microprocessor?","ما هو المعالج متعدد النوى؟"],["A microprocessor that combines two or more independent processors into a single computer so they share the workload and improve processing capacity.","معالج دقيق يجمع معالجين مستقلين أو أكثر في حاسوب واحد ليتقاسموا عبء العمل ويحسّنوا قدرة المعالجة."]],
   [["What must organizations balance when selecting a CPU? What is ARM?","ماذا توازن المؤسسات عند اختيار CPU؟ وما ARM؟"],["Processing speed versus energy requirements, size, and cost. ARM is a chip design company whose energy-efficient architecture is broadly used in smartphones and tablets.","سرعة المعالجة مقابل متطلبات الطاقة والحجم والتكلفة. ARM شركة تصميم رقائق تُستخدم بنيتها الموفرة للطاقة على نطاق واسع في الهواتف الذكية والحواسيب اللوحية."]],
   [["What is parallel computing and what is it used for?","ما هي الحوسبة المتوازية وفيم تُستخدم؟"],["Simultaneous execution of the same task on multiple processors to get results faster. Used for modeling, simulation, and analyzing large amounts of data.","تنفيذ المهمة نفسها بالتزامن على عدة معالجات للحصول على نتائج أسرع. تُستخدم للنمذجة والمحاكاة وتحليل كميات كبيرة من البيانات."]],
   [["What is massively parallel processing?","ما هي المعالجة المتوازية الضخمة؟"],["A form of multiprocessing that speeds processing by linking hundreds or thousands of processors to operate at the same time.","شكل من المعالجة المتعددة يسرّع المعالجة بربط مئات أو آلاف المعالجات لتعمل في الوقت نفسه."]],
   [["What is grid computing?","ما هي الحوسبة الشبكية؟"],["Using a collection of computers, often owned by multiple individuals or organizations, working in a coordinated manner to solve a common problem. It is a low-cost approach to parallel processing. A central server acts as grid leader and traffic monitor.","استخدام مجموعة حواسيب، غالبًا مملوكة لعدة أفراد أو مؤسسات، تعمل بتنسيق لحل مشكلة مشتركة. نهج منخفض التكلفة للمعالجة المتوازية. وخادم مركزي يعمل كقائد للشبكة ومراقب للحركة."]],
   [["What is secondary storage?","ما هو التخزين الثانوي؟"],["Also called permanent storage. It stores larger amounts of data, instructions, and information more permanently than main memory allows.","يسمى أيضًا التخزين الدائم. يخزن كميات أكبر من البيانات والتعليمات والمعلومات بشكل أكثر دوامًا مما تسمح به الذاكرة الرئيسية."]],
   [["Sequential access vs direct access?","الوصول التسلسلي مقابل المباشر؟"],["Sequential: data must be accessed in the order stored (SASD). Direct: data can be retrieved directly without passing other data (DASD).","التسلسلي: يجب الوصول بالترتيب المخزّن (SASD). المباشر: يمكن استرجاع البيانات مباشرة دون المرور على غيرها (DASD)."]],
   [["What are magnetic tapes used for today?","فيم تُستخدم الأشرطة المغناطيسية اليوم؟"],["A sequential secondary storage medium, now used primarily for backups of critical organizational data in case of disaster.","وسيط تخزين ثانوي تسلسلي، يُستخدم الآن أساسًا لنسخ احتياطية لبيانات المؤسسة الحرجة تحسبًا للكوارث."]],
   [["What is a hard disk drive (HDD)?","ما هو محرك القرص الصلب (HDD)؟"],["A direct access storage device used to store and retrieve data from rapidly rotating disks coated with magnetic material.","جهاز تخزين ذو وصول مباشر يخزن البيانات ويسترجعها من أقراص تدور بسرعة مغطاة بمادة مغناطيسية."]],
   [["What is RAID?","ما هو RAID؟"],["A redundant array of independent/inexpensive disks: stores data so that extra bits are generated from existing data, creating a “reconstruction map” to rebuild lost data if a hard drive fails.","مصفوفة زائدة من الأقراص المستقلة/الرخيصة: تولّد بتات إضافية من البيانات الموجودة لإنشاء “خريطة إعادة بناء” تعيد بناء البيانات المفقودة إذا تعطل قرص صلب."]],
   [["What is disk mirroring?","ما هو عكس القرص؟"],["Storing data so that an exact copy exists, fully protecting users in the event of data loss.","تخزين البيانات بحيث توجد نسخة مطابقة تحمي المستخدمين حماية كاملة عند فقدان البيانات."]],
   [["What is a storage area network (SAN)?","ما هي شبكة منطقة التخزين (SAN)؟"],["A high-speed, special-purpose network that integrates different storage devices (HDD, magnetic tape, SSD) into a single storage system connected to computing resources across the organization.","شبكة عالية السرعة ذات غرض خاص تدمج أجهزة تخزين مختلفة (HDD وشريط وSSD) في نظام تخزين واحد متصل بموارد الحوسبة في المؤسسة."]],
   [["What are optical storage and SSD?","ما هما التخزين البصري وSSD؟"],["Optical: uses special lasers to read and write data. SSD: stores data in memory chips rather than on hard disks or optical media; needs less power and gives much faster access than magnetic storage.","البصري: يستخدم أشعة ليزر لقراءة البيانات وكتابتها. SSD: يخزن البيانات في رقائق ذاكرة بدل الأقراص الصلبة أو الوسائط البصرية؛ يحتاج طاقة أقل ويوفر وصولًا أسرع بكثير من التخزين المغناطيسي."]],
   [["What is storage as a service?","ما هو التخزين كخدمة؟"],["A model where a provider rents data storage space to individuals and organizations, who access it via the Internet.","نموذج يؤجّر فيه مزود مساحة تخزين للأفراد والمؤسسات الذين يصلون إليها عبر الإنترنت."]],
   [["What are input/output devices?","ما هي أجهزة الإدخال/الإخراج؟"],["Devices that provide data and instructions to the computer and receive results from it.","أجهزة تزود الحاسوب بالبيانات والتعليمات وتستقبل النتائج منه."]],
   [["Laptop vs tablet computer?","الحاسوب المحمول مقابل اللوحي؟"],["Laptop: personal computer for mobile users, small and light enough to sit on a lap. Tablet: portable, lightweight, no keyboard, carried like a clipboard.","المحمول: حاسوب شخصي للمستخدمين المتنقلين خفيف يوضع على الحضن. اللوحي: محمول خفيف بلا لوحة مفاتيح يُحمل كلوح الكتابة."]],
   [["What is a thin client?","ما هو العميل الرفيع؟"],["A low-cost, centrally managed computer with no internal or external drives for data storage. Works well in a cloud-computing environment.","حاسوب منخفض التكلفة مُدار مركزيًا بلا محركات تخزين داخلية أو خارجية. يعمل جيدًا في بيئة الحوسبة السحابية."]],
   [["Desktop computer vs workstation?","الحاسوب المكتبي مقابل محطة العمل؟"],["Desktop: non-portable, enough power for most business tasks. Workstation: more powerful, for mathematical computing, computer-assisted design, and high-end processing, but still fits on a desktop.","المكتبي: غير محمول وبقدرة كافية لمعظم مهام الأعمال. محطة العمل: أقوى، للحوسبة الرياضية والتصميم بمساعدة الحاسوب والمعالجة العالية، لكنها تتسع على المكتب."]],
   [["Server vs server farm vs virtual server?","الخادم مقابل مزرعة الخوادم مقابل الخادم الافتراضي؟"],["Server: used by many users for a specific task. Server farm: facility housing many servers in one room under controlled access. Virtual server: logically dividing one physical server into multiple logical servers.","الخادم: يستخدمه عدة مستخدمين لمهمة محددة. مزرعة الخوادم: منشأة تضم خوادم كثيرة في غرفة واحدة بوصول مُتحكَّم فيه. الخادم الافتراضي: تقسيم خادم مادي واحد منطقيًا إلى عدة خوادم."]],
   [["Mainframe vs supercomputer?","الحاسوب المركزي مقابل الفائق؟"],["Mainframe: large, powerful, shared by dozens or hundreds of concurrent users over a network. Supercomputer: most powerful, fastest processing speed, highest performance (e.g., Tianhe-2 at 33.86 petaflops).","المركزي: كبير وقوي يشترك فيه عشرات أو مئات المستخدمين عبر شبكة. الفائق: الأقوى بأسرع معالجة وأعلى أداء (مثل Tianhe-2 بسرعة 33.86 بيتافلوب)."]],
   [["What is a data center?","ما هو مركز البيانات؟"],["A climate-and-access-controlled building or set of buildings housing the computer hardware that delivers an organization’s data and information services.","مبنى أو مبانٍ يُتحكم في مناخها والوصول إليها وتضم عتاد الحاسوب الذي يقدم خدمات البيانات والمعلومات للمؤسسة."]],
   [["What is green computing?","ما هي الحوسبة الخضراء؟"],["A program concerned with the efficient and environmentally responsible design, manufacture, operation, and disposal of IS-related products.","برنامج يُعنى بالتصميم والتصنيع والتشغيل والتخلص من منتجات نظم المعلومات بكفاءة وبمسؤولية بيئية."]]

    ["Describe operating systems, utility programs, and middleware.","وصف أنظمة التشغيل (Operating systems) وبرامج المساعدة (Utility programs) والبرمجيات الوسيطة (Middleware)."],

  sec:[
   {t:["1. An Overview of Software","1. نظرة عامة على البرمجيات"], b:[
     {k:'def', x:["Software consists of computer programs that control the workings of computer hardware.","تتكون البرمجيات (Software) من برامج حاسوب تتحكم في عمل عتاد الحاسوب."]},
     {k:'p', x:["Software can be divided into two types: systems software and application software.","يمكن تقسيم البرمجيات إلى نوعين: برمجيات النظام (Systems software) وبرمجيات التطبيقات (Application software)."]},
     {k:'cards', c:[
       {t:["System software","برمجيات النظام (System software)"], l:[["Includes operating systems, utilities, and middleware that coordinate the activities and functions of the hardware and other programs throughout the computer system.","تشمل أنظمة التشغيل وبرامج المساعدة والبرمجيات الوسيطة التي تنسق أنشطة العتاد والبرامج الأخرى ووظائفها في نظام الحاسوب بأكمله."]]},
       {t:["Application software","برمجيات التطبيقات (Application software)"], l:[["Consists of programs that help users solve particular computing problems.","تتكون من برامج تساعد المستخدمين على حل مشكلات حاسوبية معينة."]]}
     ]}
   ]},
   {t:["1.1 Systems Software","1.1 برمجيات النظام (Systems Software)"], b:[
     {k:'p', x:["The primary role of system software is to control the operations of computer hardware.","الدور الرئيسي لبرمجيات النظام هو التحكم في عمليات عتاد الحاسوب."]},
     {k:'p', x:["System software also supports the problem-solving capabilities of application programs.","تدعم برمجيات النظام أيضًا قدرات حل المشكلات لبرامج التطبيقات."]},
     {k:'def', x:["Operating system (OS): a set of computer programs that controls the computer hardware and acts as an interface to application software.","نظام التشغيل (Operating system - OS): مجموعة من برامج الحاسوب تتحكم في عتاد الحاسوب وتعمل كواجهة (Interface) لبرمجيات التطبيقات."]},
     {k:'ul', h:["The various combinations of OSs, computers, and users","التركيبات المختلفة لأنظمة التشغيل والحواسيب والمستخدمين"], x:[
       ["1- Single computer with a single user.","1- حاسوب واحد لمستخدم واحد."],
       ["2- Single computer with multiple simultaneous users (server or mainframe computers, e.g., UNIX).","2- حاسوب واحد لعدة مستخدمين متزامنين (الخوادم أو الحواسيب المركزية، مثل UNIX)."],
       ["3- Multiple computers with multiple users (computer networks, including home networks, e.g., network server OSs).","3- عدة حواسيب لعدة مستخدمين (شبكات الحاسوب، بما فيها الشبكات المنزلية، مثل أنظمة تشغيل خوادم الشبكة)."],
       ["4- Special-purpose computers (control sophisticated military aircraft, digital cameras).","4- حواسيب ذات أغراض خاصة (تتحكم في الطائرات العسكرية المتطورة والكاميرات الرقمية)."]]},
     {k:'def', x:["Kernel: the heart of the operating system that controls the most critical processes of the OS.","النواة (Kernel): قلب نظام التشغيل التي تتحكم في أهم عمليات نظام التشغيل."]},
     {k:'cards', c:[
       {t:["Personal Computing Operating Systems","أنظمة تشغيل الحواسيب الشخصية"], l:[["Operating systems that are found on personal computers, portable computers, and mobile devices.","أنظمة تشغيل موجودة في الحواسيب الشخصية والمحمولة والأجهزة المتنقلة."],["Some common operating systems: Microsoft Windows, Mac OS, Linux","بعض أنظمة التشغيل الشائعة: Microsoft Windows وMac OS وLinux"]]},
       {t:["Workgroup Operating Systems","أنظمة تشغيل مجموعات العمل (Workgroup)"], l:[["Powerful and sophisticated operating systems are needed to run the servers that meet these business needs for workgroups.","هناك حاجة لأنظمة تشغيل قوية ومتطورة لتشغيل الخوادم التي تلبي احتياجات الأعمال هذه لمجموعات العمل."],["Examples: UNIX, Windows Server, Red Hat Linux, Mac OS X Server","أمثلة: UNIX وWindows Server وRed Hat Linux وMac OS X Server"]]}
     ]},
     {k:'def', x:["Utility program: a program that helps to perform maintenance or correct problems with a computer system.","برنامج المساعدة (Utility program): برنامج يساعد في تنفيذ الصيانة أو تصحيح المشكلات في نظام الحاسوب."]},
     {k:'def', x:["Middleware is software that provides messaging services that allow different applications to communicate and exchange data.","البرمجيات الوسيطة (Middleware) هي برمجيات توفر خدمات المراسلة (Messaging services) التي تتيح لتطبيقات مختلفة التواصل وتبادل البيانات."]},
     {k:'def', x:["Enterprise application integration (EAI): the systematic tying together of disparate applications, often through the use of middleware.","تكامل تطبيقات المؤسسة (Enterprise application integration - EAI): الربط المنهجي للتطبيقات المتباينة، غالبًا باستخدام البرمجيات الوسيطة."]},
     {k:'def', x:["Service-oriented architecture (SOA) is a software design approach based on the use of discrete pieces of software (modules) to provide specific functions as services to other applications.","البنية الموجهة بالخدمات (Service-oriented architecture - SOA) هي أسلوب تصميم برمجيات يعتمد على استخدام أجزاء برمجية منفصلة (وحدات - Modules) لتقديم وظائف محددة كخدمات لتطبيقات أخرى."]}
   ]},

     {k:'p', x:["Proprietary software and off-the-shelf software are two important types of application software.","البرمجيات الخاصة (Proprietary) والبرمجيات الجاهزة (Off-the-shelf) نوعان مهمان من برمجيات التطبيقات."]}
   ]},
   {t:["Types of Application Software","أنواع برمجيات التطبيقات"], b:[
     {k:'cards', c:[

       {t:["Off-the-shelf software","البرمجيات الجاهزة (Off-the-shelf software)"], l:[["Produced by software vendors to address needs that are common across businesses, organizations, or individuals.","تنتجها شركات البرمجيات (Vendors) لتلبية احتياجات مشتركة بين الشركات أو المؤسسات أو الأفراد."]]}
     ]},
     {k:'tip', x:["Organizations typically use off-the-shelf application software to meet common business needs and proprietary application software to meet unique business needs and provide a competitive advantage.","تستخدم المؤسسات عادةً البرمجيات الجاهزة لتلبية احتياجات الأعمال المشتركة، والبرمجيات الخاصة لتلبية احتياجات الأعمال الفريدة ومنح ميزة تنافسية (Competitive advantage)."]},
     {k:'def', x:["Software as a service (SaaS): a service that allows businesses to subscribe to Web-delivered application software.","البرمجيات كخدمة (SaaS): خدمة تتيح للشركات الاشتراك في برمجيات تطبيقات تُقدَّم عبر الويب."]},
     {k:'def', x:["Personal application software: software that includes the general-purpose tools and programs that support individual needs.","برمجيات التطبيقات الشخصية (Personal application software): برمجيات تشمل الأدوات والبرامج العامة الغرض التي تدعم احتياجات الأفراد."]},
     {k:'def', x:["Workgroup application software: software that supports teamwork, whether team members are in the same location or dispersed around the world.","برمجيات تطبيقات مجموعات العمل (Workgroup application software): برمجيات تدعم العمل الجماعي، سواء كان أعضاء الفريق في المكان نفسه أو منتشرين حول العالم."]},
     {k:'def', x:["Enterprise application software: software that benefits an entire organization. Enterprise application software can be developed specifically for the business or purchased off the shelf.","برمجيات تطبيقات المؤسسة (Enterprise application software): برمجيات تفيد المؤسسة بأكملها. ويمكن تطويرها خصيصًا للشركة أو شراؤها جاهزة."]},

     {k:'def', x:["Programming languages: sets of keywords, commands, symbols, and rules for constructing statements by which humans can communicate instructions to a computer.","لغات البرمجة (Programming languages): مجموعات من الكلمات المفتاحية والأوامر والرموز والقواعد لبناء العبارات التي يستطيع البشر من خلالها إيصال التعليمات إلى الحاسوب."]},
     {k:'def', x:["Syntax: a set of rules associated with a programming language.","بناء الجملة (Syntax): مجموعة القواعد المرتبطة بلغة برمجة."]}

  fc:[
   [["What is software?","ما هي البرمجيات؟"],["Computer programs that control the workings of computer hardware. It is divided into systems software and application software.","برامج حاسوب تتحكم في عمل العتاد. وتنقسم إلى برمجيات النظام وبرمجيات التطبيقات."]],
   [["What does system software include?","ماذا تشمل برمجيات النظام؟"],["Operating systems, utilities, and middleware that coordinate the activities and functions of the hardware and other programs.","أنظمة التشغيل وبرامج المساعدة والبرمجيات الوسيطة التي تنسق أنشطة العتاد والبرامج الأخرى."]],
   [["What is application software?","ما هي برمجيات التطبيقات؟"],["Programs that help users solve particular computing problems.","برامج تساعد المستخدمين على حل مشكلات حاسوبية معينة."]],
   [["What is the primary role of system software?","ما الدور الرئيسي لبرمجيات النظام؟"],["To control the operations of computer hardware. It also supports the problem-solving capabilities of application programs.","التحكم في عمليات العتاد. كما تدعم قدرات حل المشكلات لبرامج التطبيقات."]],
   [["What is an operating system?","ما هو نظام التشغيل؟"],["A set of computer programs that controls the computer hardware and acts as an interface to application software.","مجموعة برامج تتحكم في عتاد الحاسوب وتعمل كواجهة لبرمجيات التطبيقات."]],
   [["Name the 4 combinations of OSs, computers, and users.","اذكر التركيبات الأربع لأنظمة التشغيل والحواسيب والمستخدمين."],["Single computer/single user; single computer/multiple simultaneous users (UNIX); multiple computers/multiple users (network server OSs); special-purpose computers (military aircraft, digital cameras).","حاسوب واحد/مستخدم واحد؛ حاسوب واحد/عدة مستخدمين متزامنين (UNIX)؛ عدة حواسيب/عدة مستخدمين (أنظمة خوادم الشبكة)؛ حواسيب ذات أغراض خاصة (الطائرات العسكرية والكاميرات الرقمية)."]],
   [["What is the kernel?","ما هي النواة (Kernel)؟"],["The heart of the operating system that controls the most critical processes of the OS.","قلب نظام التشغيل الذي يتحكم في أهم عملياته."]],
   [["Name common personal computing operating systems.","اذكر أنظمة تشغيل الحواسيب الشخصية الشائعة."],["Microsoft Windows, Mac OS, Linux.","Microsoft Windows وMac OS وLinux."]],
   [["Name workgroup operating systems.","اذكر أنظمة تشغيل مجموعات العمل."],["UNIX, Windows Server, Red Hat Linux, Mac OS X Server.","UNIX وWindows Server وRed Hat Linux وMac OS X Server."]],
   [["What is a utility program?","ما هو برنامج المساعدة؟"],["A program that helps to perform maintenance or correct problems with a computer system.","برنامج يساعد في تنفيذ الصيانة أو تصحيح مشكلات نظام الحاسوب."]],
   [["What is middleware?","ما هي البرمجيات الوسيطة؟"],["Software that provides messaging services that allow different applications to communicate and exchange data.","برمجيات توفر خدمات مراسلة تتيح لتطبيقات مختلفة التواصل وتبادل البيانات."]],
   [["What are EAI and SOA?","ما هما EAI وSOA؟"],["EAI: systematic tying together of disparate applications, often via middleware. SOA: software design approach using discrete modules to provide specific functions as services to other applications.","EAI: الربط المنهجي للتطبيقات المتباينة غالبًا عبر برمجيات وسيطة. SOA: أسلوب تصميم يستخدم وحدات منفصلة لتقديم وظائف محددة كخدمات لتطبيقات أخرى."]],
   [["What is the primary function of application software?","ما الوظيفة الرئيسية لبرمجيات التطبيقات؟"],["To apply the power of a computer system so people, workgroups, and organizations can solve problems and perform specific tasks.","تسخير قوة نظام الحاسوب لتمكين الأفراد ومجموعات العمل والمؤسسات من حل المشكلات وتنفيذ مهام محددة."]],
   [["Proprietary vs off-the-shelf software?","البرمجيات الخاصة مقابل الجاهزة؟"],["Proprietary: one-of-a-kind, designed for a specific application and owned by the user. Off-the-shelf: produced by vendors for needs common across businesses or individuals.","الخاصة: فريدة مصممة لتطبيق محدد ويملكها مستخدمها. الجاهزة: تنتجها شركات لتلبية احتياجات مشتركة بين الشركات أو الأفراد."]],
   [["When do organizations use each type?","متى تستخدم المؤسسات كل نوع؟"],["Off-the-shelf for common business needs; proprietary for unique needs and to provide a competitive advantage.","الجاهزة للاحتياجات المشتركة؛ والخاصة للاحتياجات الفريدة ولمنح ميزة تنافسية."]],
   [["What is SaaS?","ما هو SaaS؟"],["Software as a service: a service that allows businesses to subscribe to Web-delivered application software.","البرمجيات كخدمة: خدمة تتيح للشركات الاشتراك في برمجيات تطبيقات تُقدَّم عبر الويب."]],
   [["What is personal application software?","ما هي برمجيات التطبيقات الشخصية؟"],["Software that includes the general-purpose tools and programs that support individual needs.","برمجيات تشمل الأدوات والبرامج العامة الغرض التي تدعم احتياجات الأفراد."]],
   [["What is workgroup application software?","ما هي برمجيات مجموعات العمل؟"],["Software that supports teamwork, whether team members are in the same location or dispersed around the world.","برمجيات تدعم العمل الجماعي سواء كان الفريق في مكان واحد أو منتشرًا حول العالم."]],
   [["What is enterprise application software?","ما هي برمجيات تطبيقات المؤسسة؟"],["Software that benefits an entire organization; it can be developed specifically for the business or purchased off the shelf.","برمجيات تفيد المؤسسة بأكملها؛ يمكن تطويرها خصيصًا للشركة أو شراؤها جاهزة."]],
   [["What are programming languages and syntax?","ما هي لغات البرمجة وبناء الجملة؟"],["Programming languages: sets of keywords, commands, symbols, and rules for constructing statements to communicate instructions to a computer. Syntax: the set of rules associated with a programming language.","لغات البرمجة: مجموعات كلمات مفتاحية وأوامر ورموز وقواعد لبناء عبارات توصل التعليمات إلى الحاسوب. بناء الجملة: مجموعة القواعد المرتبطة بلغة البرمجة."]]
  ],
