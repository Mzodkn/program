function save(){
  try{

    const d = sd(SUBJECT.id);
    d.mastery = mastery(SUBJECT);

    cur.data[SUBJECT.id] = d;

function sd(id){ id = id || state.subject; return state.data[id] || (state.data[id] = {seen:{}, best:{}, exam:0}); }

function mastery(s){
  if(!s.ready) return 0;
  const d = sd(s.id);
  let sum = 0;
  s.lectures.forEach(l => { sum += (d.best[l.id] || 0) / 100; });
  sum += (d.exam || 0) / 100;
  return Math.round(sum / (s.lectures.length + 1) * 100);
}

function shuf(a){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function mixQ(q){
  const idx = [0,1,2,3].filter(i => i < q.o.length);
  const s = shuf(idx);
  return { q: q.q, o: s.map(i => q.o[i]), a: s.indexOf(q.a) };
}

}

function redrawDeck(id){ const el=$('deck-'+id); if(el) el.innerHTML=deckHTML(id); }

function deckHTML(id){
  const d=state.decks[id], c=d.list[d.i], l=li();

  if(d.kind==='g'){
    front=`<div class="mono text-xl sm:text-2xl text-brand-500 font-bold" dir="ltr">${esc(c[0])}</div>`;

function newExam(sz){
  const allQs=[];
  subj().lectures.forEach(l=>{ l.quiz.forEach(q=>allQs.push(q)); });

  const n = (sz && sz>0 && sz<=pool.length) ? sz : pool.length;
  state.exam = { qs: pool.slice(0, n), i: 0, score: 0, wrong: [], finished: false };
}

function render(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='ar' ? 'rtl' : 'ltr';
  $('langBtn').textContent = state.lang==='ar' ? 'English' : 'العربية';
  applyTheme();

  const lects = LECT();
  const idx = lects.findIndex(l => l.id === state.page);
  let html = '', title = '';

  if(state.page==='home'){ 
    html = renderHome(); 
    title = tx(subj().name); 
  } else if(idx>=0){ 
    html = renderLecture(lects[idx], idx); 
    title = `${u('lecture')} ${lects[idx].n}: ${tx(lects[idx].title)}`; 
  } else if(state.page==='exam'){ 
    html = renderExam(); 
    title = u('exam'); 
  } else if(state.page==='glossary'){ 
    html = renderGlossary(); 
    title = tx(["Glossary & Acronyms","قاموس المصطلحات والاختصارات"]); 
  }

  $('app').innerHTML = html;
  $('topTitle').textContent = title;
  updateTop();
  renderNav();
  applyLayout();
}

function go(p){
  state.page = p;
  state.qz = {};
  state.decks = {};
  if(p !== 'exam') state.exam = null;
  if(window.innerWidth < 1024) state.sidebar = false;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if(g){ go(g.dataset.go); return; }

  const sz = e.target.closest('[data-size]');
  if(sz){ newExam(+sz.dataset.size); render(); window.scrollTo({top:0}); return; }

  const opt = e.target.closest('.opt');
  if(opt){
    const box = opt.closest('.qbox');
    if(box.dataset.done) return;
    box.dataset.done = '1';
    const a = +box.dataset.a, i = +opt.dataset.i, ok = (i === a);
    if(ok) box.dataset.ok = '1';
    box.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      b.classList.remove('hover:border-brand-500');
      b.classList.add('cursor-not-allowed');
      if(+b.dataset.i === a) b.classList.add('!bg-green-600/30', '!border-green-500');
    });
    if(!ok) opt.classList.add('!bg-red-600/30', '!border-red-500');
    const fb = box.querySelector('.fb');
    fb.classList.remove('hidden');
    fb.className = 'fb mt-3 text-sm font-semibold ' + (ok ? 'text-green-400' : 'text-red-400');
    fb.textContent = ok ? u('correct') : u('wrong');

    const exam = box.closest('[data-exam]');
    if(exam){
      const ex = state.exam, q = ex.qs[ex.i];
      if(ok) ex.score++; else ex.wrong.push({q: q.q, c: q.o[q.a]});
      $('examNext').classList.remove('hidden');
      return;
    }

    const qz = box.closest('[data-quiz]');
    if(qz){
      const boxes = [...qz.querySelectorAll('.qbox')];
      if(boxes.every(b => b.dataset.done)){
        const sc = boxes.filter(b => b.dataset.ok).length, pct = Math.round(sc / boxes.length * 100);
        const sEl = qz.querySelector('.qscore');
        sEl.classList.remove('hidden');
        qz.querySelector('.qs-text').textContent = `${u('score')}: ${sc}/${boxes.length} (${pct}%)`;
        const d = sd(), id = qz.dataset.quiz;
        if(d.best[id] == null || pct > d.best[id]){ d.best[id] = pct; save(); }
        updateTop();
        renderNav();
      }
    }
    return;
  }

  const a = e.target.closest('[data-act]');
  if(!a) return;
  const act = a.dataset.act;

  if(act.startsWith('dk-')){
    const id = a.dataset.deck, d = state.decks[id];
    if(!d) return;
    if(act === 'dk-flip'){
      d.flip = !d.flip;
      const f = document.querySelector(`#deck-${id} .flip`);
      if(f) f.classList.toggle('on', d.flip);
      return;
    }
    if(act === 'dk-next') d.i = (d.i + 1) % d.list.length;
    if(act === 'dk-prev') d.i = (d.i - 1 + d.list.length) % d.list.length;
    if(act === 'dk-shuf'){ d.list = shuf(d.list); d.i = 0; }
    d.flip = false;
    redrawDeck(id);
    return;
  }

  if(act === 'retryQuiz'){
    const L = LECT().find(l => l.id === a.dataset.id);
    delete state.qz[L.id];
    $('quiz-' + L.id).innerHTML = quizInner(L);
    $('quiz-' + L.id).scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }

  if(act === 'examAgain'){
    state.exam = null;
    render();
    return;
  }

  if(act === 'reset'){
    state.data[state.subject] = {seen:{}, best:{}, exam:0};
    save();
    render();
    return;
  }
});

document.addEventListener('click', e => {
  if(e.target.id === 'examNext'){
    const ex = state.exam;
    if(ex.i < ex.qs.length - 1){
      ex.i++;
    } else {
      ex.finished = true;
      const p = Math.round(ex.score / ex.qs.length * 100), d = sd();
      if(p > (d.exam || 0)){ d.exam = p; save(); }
    }
    render();
    window.scrollTo({top:0});
  }
});

document.addEventListener('input', e => {
  if(e.target.id === 'gSearch'){
    const q = e.target.value.toLowerCase();
    $('gList').innerHTML = gItems(subj().glossary.filter(g => (g[0] + ' ' + g[1]).toLowerCase().includes(q)));
  }
});

$('menuBtn').onclick = () => { state.sidebar = !state.sidebar; applyLayout(); };
$('backdrop').onclick = () => { state.sidebar = false; applyLayout(); };
$('langBtn').onclick = () => { state.lang = state.lang === 'ar' ? 'en' : 'ar'; save(); render(); };
window.addEventListener('resize', applyLayout);

// Initial boot
render();
</script>
</body>
</html>
