<style>
  :root { --b5: 249 115 22; --b6: 234 88 12; }
  html[lang="en"] body { font-family: 'Inter', sans-serif; }
  html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  body {
    background-color: #060911;
    background-image:
      linear-gradient(to right, rgba(56, 189, 248, 0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
    background-size: 36px 36px;
  }
  .bg-glow { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-glow span { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
  .bg-glow .orb1 { width: 420px; height: 420px; top: -12%; left: -8%; background: rgb(var(--b5) / .35); animation: drift1 24s ease-in-out infinite; }
  .bg-glow .orb2 { width: 360px; height: 360px; bottom: -14%; right: -8%; background: rgba(56,189,248,.28); animation: drift2 30s ease-in-out infinite; }
  .bg-glow .orb3 { width: 300px; height: 300px; top: 45%; left: 60%; background: rgba(168,85,247,.18); animation: drift3 36s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(110px,70px) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-90px,-60px) scale(1.1); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px,50px) scale(1.2); } }
  #netCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  main, header { position: relative; z-index: 1; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #060911; }
  ::-webkit-scrollbar-thumb { background: #30384b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgb(var(--b6)); }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .terminal-cursor { animation: blink 0.8s infinite; }
  @media (prefers-reduced-motion: reduce){ .bg-glow span,.terminal-cursor,.fade{animation:none} }
  .ltr-txt{direction:ltr;unicode-bidi:plaintext}
  summary{list-style:none} summary::-webkit-details-marker{display:none}
  details[open] .chev{transform:rotate(180deg)}
  details[open] summary .tapmsg{display:none}
</style>
</head>

  nameNote:'Name written differently on the Semester 1 sheet:', nocomp:'Cannot compare', noRes:'No result',
  foot1:'Students were matched by name, because index numbers differ between the two sheets. Each match was checked against the CGPA printed on the Semester 2 sheet.',
  foot2:'Subjects differ between the two semesters, so the comparison is by GPA, not by subject. CGPA can be higher than the average of both GPAs when a supplementary exam was passed.', back:'Back'},
 ar:{res:'النتائج', title:'السمستر الأول مقابل الثاني', sub:'الدفعة 24 — يونيو 2026 مقابل أكتوبر 2026', cmd:'> ./compare --sem 1 --sem 2',
  avg:'متوسط المعدل', s1:'السمستر 1', s2:'السمستر 2', chg:'متوسط التغيّر', up:'تحسّن', down:'تراجع', same:'ثابت', n:'طالب', base:(n,tot)=>`المقارنة على ${n} طالب لديهم معدل في السمسترين (من أصل ${tot} اسم).`,
  fT:'تقدير F', fStud:'طلاب عندهم F واحدة على الأقل', fShare:'نسبة F من كل التقديرات', clean:'طلاب بدون F',
  top:'أكبر تحسّن', bot:'أكبر تراجع', find:'// ابحث بالاسم', ph:'اكتب الاسم (مثال: Ali Mahir)', sort:'الترتيب',
  sorts:{idx:'ترتيب الكشف',up:'الأكثر تحسّناً',down:'الأكثر تراجعاً',g2:'الأعلى GPA في السمستر 2',g1:'الأعلى GPA في السمستر 1',name:'الاسم (A–Z)'},
  fl:{all:'الكل',up:'تحسّن',down:'تراجع',same:'ثابت',na:'لا يمكن المقارنة'},
  gpa1:'GPA السمستر 1', gpa2:'GPA السمستر 2', cgpa:'CGPA السمستر 2', status:'حالة السمستر 2', subj:'المادة', grade:'التقدير', sem1:'السمستر الأول', sem2:'السمستر الثاني',
  tap:'اضغط لعرض درجات المواد في السمسترين', none:'ما لقينا اسم مطابق.', noS1:'لا توجد نتيجة للسمستر الأول لهذا الطالب.', noS2:'لا توجد نتيجة للسمستر الثاني لهذا الطالب.',
  nameNote:'الاسم مكتوب بصيغة مختلفة في كشف السمستر الأول:', nocomp:'لا يمكن المقارنة', noRes:'بدون نتيجة',
  foot1:'تمت مطابقة الطلاب بالاسم لأن الأرقام الجامعية تختلف بين الكشفين. وتم التأكد من كل مطابقة بالمعدل التراكمي المطبوع في كشف السمستر الثاني.',
  foot2:'المواد تختلف بين السمسترين، فالمقارنة بالمعدل (GPA) وليست بالمادة. والتراكمي قد يكون أعلى من متوسط المعدلين لو الطالب نجح في ملحق.', back:'رجوع'}
};
const r2=x=>Math.round(x*100)/100;
P.forEach(p=>{ p.cmp = p.gpa1!=null && p.gpa2!=null; p.d = p.cmp? r2(p.gpa2-p.gpa1):null; p.k = !p.cmp?'na':(p.d>0?'up':p.d<0?'down':'same'); });
const B=P.filter(p=>p.cmp);
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const f2=x=>x.toFixed(2), sg=x=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(2);
const pct=(x,n)=>n?(x/n*100).toFixed(1):'0.0';
let query='', sortKey='idx', filt='all';

function recCls(r){ if(!r) return 'text-slate-300'; if(r==='Pass') return 'text-emerald-300'; if(/Repeat|3 Supps/.test(r)) return 'text-red-300'; return 'text-amber-300'; }
const KC={up:['#10b981','text-emerald-300','▲'],down:['#ef4444','text-red-300','▼'],same:['#94a3b8','text-slate-300','='],na:['#64748b','text-slate-300','?']};
const stat=(k,label,val,sub)=>`<div class="rounded-xl border border-dark-border bg-dark-base/70 p-3 text-center"><div class="text-[11px] text-dark-muted mb-1">${label}</div><div class="text-xl font-extrabold mono ${k||''}" dir="ltr">${val}</div>${sub?`<div class="text-[11px] text-dark-muted mt-0.5" dir="ltr">${sub}</div>`:''}</div>`;

function summary(){
  const t=T[lang], ar=lang==='ar';
  const a1=avg(B.map(p=>p.gpa1)), a2=avg(B.map(p=>p.gpa2)), ch=a2-a1;
  const cu=B.filter(p=>p.k==='up').length, cd=B.filter(p=>p.k==='down').length, cs=B.filter(p=>p.k==='same').length;
  const f1=B.filter(p=>p.g1.includes('F')).length, f2c=B.filter(p=>p.g2.includes('F')).length;
  const nf1=B.reduce((x,p)=>x+p.g1.filter(g=>g==='F').length,0), nf2=B.reduce((x,p)=>x+p.g2.filter(g=>g==='F').length,0);
  const tot1=B.length*7, tot2=B.length*8;
  const bar=(n,c)=>`<div style="width:${pct(n,B.length)}%;background:${c}" class="h-full"></div>`;
  const movers=(list,title,cls)=>`<div class="rounded-2xl border border-dark-border bg-dark-surface/95 p-4"><div class="text-xs mono font-bold mb-3 ${cls}">${title}</div>`+
    list.map(p=>`<div class="flex items-center justify-between gap-2 py-1.5 border-t border-dark-border first:border-0 text-sm"><span class="font-semibold ltr-txt min-w-0 truncate">${esc(p.name)}</span><span class="mono text-xs shrink-0 ${cls}" dir="ltr">${f2(p.gpa1)} → ${f2(p.gpa2)} (${sg(p.d)})</span></div>`).join('')+`</div>`;
  const srt=B.slice().sort((x,y)=>y.d-x.d||x.name.localeCompare(y.name));
  const topUp=srt.slice(0,5), topDown=srt.slice().reverse().slice(0,5);
  return `<div class="rounded-2xl border border-dark-border bg-dark-surface/95 p-5 mb-4 shadow-xl" style="border-top:4px solid #f97316">
      <div class="text-xs mono text-brand-500 font-bold mb-3">${t.avg} · ${B.length} ${t.n}</div>
      <div class="grid grid-cols-3 gap-2">
        ${stat('',t.s1,f2(a1))}${stat('text-brand-500',t.s2,f2(a2))}${stat(ch>0?'text-emerald-300':ch<0?'text-red-300':'',t.chg,sg(ch))}
      </div>
      <div class="h-3 rounded-full overflow-hidden flex mt-5 bg-dark-base" dir="ltr">${bar(cu,'#10b981')}${bar(cs,'#94a3b8')}${bar(cd,'#ef4444')}</div>
      <div class="grid grid-cols-3 gap-2 mt-3 text-center text-sm">
        <div><div class="font-extrabold mono text-emerald-300" dir="ltr">${cu} <span class="text-xs opacity-70">(${pct(cu,B.length)}%)</span></div><div class="text-[11px] text-dark-muted">${t.up}</div></div>
        <div><div class="font-extrabold mono text-slate-300" dir="ltr">${cs} <span class="text-xs opacity-70">(${pct(cs,B.length)}%)</span></div><div class="text-[11px] text-dark-muted">${t.same}</div></div>
        <div><div class="font-extrabold mono text-red-300" dir="ltr">${cd} <span class="text-xs opacity-70">(${pct(cd,B.length)}%)</span></div><div class="text-[11px] text-dark-muted">${t.down}</div></div>
      </div>
    </div>
    <div class="rounded-2xl border border-dark-border bg-dark-surface/95 p-5 mb-4">
      <div class="text-xs mono text-brand-500 font-bold mb-3">${t.fT}</div>
      <div class="grid grid-cols-3 gap-2 text-center mb-1"><div></div><div class="text-[11px] text-dark-muted">${t.s1}</div><div class="text-[11px] text-dark-muted">${t.s2}</div></div>
      ${[[t.fStud,f1+' ('+pct(f1,B.length)+'%)',f2c+' ('+pct(f2c,B.length)+'%)'],[t.clean,(B.length-f1)+' ('+pct(B.length-f1,B.length)+'%)',(B.length-f2c)+' ('+pct(B.length-f2c,B.length)+'%)'],[t.fShare,nf1+'/'+tot1+' ('+pct(nf1,tot1)+'%)',nf2+'/'+tot2+' ('+pct(nf2,tot2)+'%)']].map(r=>`<div class="grid grid-cols-3 gap-2 py-2 border-t border-dark-border text-center items-center"><div class="text-xs text-start">${r[0]}</div><div class="mono text-xs font-bold" dir="ltr">${r[1]}</div><div class="mono text-xs font-bold text-brand-500" dir="ltr">${r[2]}</div></div>`).join('')}
    </div>
    <div class="grid sm:grid-cols-2 gap-4 mb-6">${movers(topUp,'▲ '+t.top,'text-emerald-300')}${movers(topDown,'▼ '+t.bot,'text-red-300')}</div>`;
}

function track(p){
  if(!p.cmp) return '';
  const a=p.gpa1/4*100, b=p.gpa2/4*100, lo=Math.min(a,b), w=Math.abs(b-a), c=KC[p.k][0];
  return `<div class="relative h-2 rounded-full bg-dark-base mt-3" dir="ltr" aria-hidden="true">
    <div class="absolute top-0 h-2 rounded-full" style="left:${lo}%;width:${w}%;background:${c};opacity:.55"></div>
    <div class="absolute -top-0.5 w-3 h-3 rounded-full border-2 border-dark-surface" style="left:calc(${a}% - 6px);background:#38bdf8"></div>
    <div class="absolute -top-0.5 w-3 h-3 rounded-full border-2 border-dark-surface" style="left:calc(${b}% - 6px);background:#f97316"></div></div>`;
}
function gradeTable(courses,grades,title){
  const t=T[lang], ar=lang==='ar';
  if(!grades) return '';
  return `<div><div class="px-4 py-2 text-xs mono font-bold text-brand-500 bg-dark-base/70">${title}</div><table class="w-full text-sm"><tbody>`+
   courses.map((c,i)=>{const g=grades[i],f=g==='F';return `<tr class="border-t border-dark-border"><td class="px-4 py-2"><div class="font-semibold ltr-txt ${ar?'text-right':'text-left'}">${c.en}</div>${ar?`<div class="text-xs text-dark-muted">${c.ar}</div>`:''}</td><td class="px-4 py-2 text-center w-20"><span class="inline-block min-w-[44px] mono font-bold px-2.5 py-1 rounded-md ${f?'bg-red-500 text-white':'bg-dark-base border border-dark-border'}" style="${f?'':'color:#fb923c'}">${g}</span></td></tr>`}).join('')+`</tbody></table></div>`;
}
function card(p){
  const t=T[lang], ar=lang==='ar', k=KC[p.k];
  const dTxt = p.cmp ? `<span class="${k[1]} font-extrabold mono" dir="ltr">${k[2]} ${sg(p.d)}</span>` : `<span class="text-slate-300 text-xs">${t.nocomp}</span>`;
  const g1=p.gpa1!=null?f2(p.gpa1):'—', g2=p.gpa2!=null?f2(p.gpa2):'—';
  const note=[];
  if(p.alt1) note.push(`${t.nameNote} <span class="ltr-txt font-semibold">${esc(p.alt1)}</span>`);
  if(p.gpa1==null) note.push(t.noS1);
  if(p.gpa2==null) note.push(t.noS2);
  const body=gradeTable(C1,p.g1,t.sem1)+gradeTable(C2,p.g2,t.sem2)+(note.length?`<p class="p-4 text-sm bg-amber-500/10 text-amber-300 border-t border-dark-border">${note.join('<br>')}</p>`:'');
  return `<details class="rounded-2xl border border-dark-border bg-dark-surface/95 overflow-hidden shadow-xl" style="border-inline-start:5px solid ${k[0]}">
   <summary class="cursor-pointer p-4 select-none hover:bg-dark-elevated transition">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0"><div class="text-base sm:text-lg font-bold ltr-txt ${ar?'text-right':'text-left'}">${esc(p.name)}</div><div class="mono text-xs text-brand-500 mt-0.5 ltr-txt ${ar?'text-right':'text-left'}">${p.idx2}</div></div>
      <div class="flex items-center gap-3 shrink-0"><div class="text-end">${dTxt}</div><span class="chev text-brand-500 text-lg transition-transform" aria-hidden="true">▼</span></div>
    </div>
    <div class="grid grid-cols-3 gap-2 mt-3">${stat('',t.gpa1,g1)}${stat('text-brand-500',t.gpa2,g2)}${stat('',t.cgpa,p.cgpa2!=null?f2(p.cgpa2):'—')}</div>
    ${track(p)}
    <div class="tapmsg text-[11px] text-dark-muted mt-3 text-center">${t.tap}</div>
   </summary><div class="border-t border-dark-border">${body}${p.rec2?`<div class="px-4 py-3 border-t border-dark-border text-sm flex justify-between"><span class="text-dark-muted">${t.status}</span><span class="mono font-bold ltr-txt ${recCls(p.rec2)}">${esc(p.rec2)}</span></div>`:''}</div></details>`;
}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9؀-ۿ ]/g," ").replace(/\s+/g," ").trim();
function sorted(r){
  const n=(v,d)=>v==null?(d?-Infinity:Infinity):v;
  const by={idx:(a,b)=>a.no-b.no, up:(a,b)=>n(b.d,1)-n(a.d,1)||a.no-b.no, down:(a,b)=>n(a.d,0)-n(b.d,0)||a.no-b.no,
    g2:(a,b)=>n(b.gpa2,1)-n(a.gpa2,1)||a.no-b.no, g1:(a,b)=>n(b.gpa1,1)-n(a.gpa1,1)||a.no-b.no, name:(a,b)=>a.name.localeCompare(b.name,'en')};
  return r.slice().sort(by[sortKey]);
}
function list(){
  const t=T[lang], box=document.getElementById('out');
  const w=norm(query).split(' ').filter(Boolean);
  let r=P.filter(p=>(filt==='all'||p.k===filt)&&w.every(x=>norm(p.name+' '+(p.alt1||'')).includes(x)));
  r=sorted(r);
  box.innerHTML = r.length ? `<div class="text-xs mono text-dark-muted mb-3" dir="ltr">// ${r.length} / ${P.length}</div><div class="grid gap-4">${r.map(card).join('')}</div>` : `<div class="rounded-2xl p-4 border border-dashed border-dark-border text-dark-muted text-sm">${t.none}</div>`;
}
function chips(){
  const t=T[lang], el=document.getElementById('chips');
  el.innerHTML=Object.keys(t.fl).map(k=>{const on=k===filt, c=k==='all'?P.length:P.filter(p=>p.k===k).length;
    return `<button type="button" data-f="${k}" aria-pressed="${on}" class="px-3 py-1.5 rounded-lg border text-xs font-semibold transition ${on?'bg-brand-500 text-black border-brand-500':'bg-dark-base border-dark-border text-dark-muted hover:border-brand-500'}">${t.fl[k]} <span class="mono opacity-70">${c}</span></button>`;}).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{filt=b.dataset.f;chips();list();});
}
function shell(){
  const t=T[lang], ar=lang==='ar';
  document.documentElement.lang=lang; document.documentElement.dir=ar?'rtl':'ltr';
  document.getElementById('langBtn').textContent=ar?'English':'العربية';
  document.getElementById('navRes').textContent=t.res;
  document.getElementById('app').innerHTML=`<div>
   <div class="rounded-2xl bg-dark-surface/95 backdrop-blur p-6 sm:p-8 mb-5 border-2 border-brand-500/40 shadow-2xl relative overflow-hidden">
    <div class="absolute top-3 ${ar?'right-4':'left-4'} flex items-center gap-1.5 opacity-70" dir="ltr"><span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span><span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span><span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span><span class="text-[11px] mono text-dark-muted ms-2">compare_sem1_sem2.cpp</span></div>
    <div class="relative z-10 mt-5 text-center sm:text-start">
      <div class="text-xs sm:text-sm mono text-brand-500 mb-1 font-bold" dir="ltr">${t.cmd}</div>
      <h1 class="text-2xl sm:text-4xl font-extrabold mb-2 tracking-wide"><span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-amber-400">${t.title}</span></h1>
      <p class="text-dark-muted text-xs sm:text-sm mono">${t.sub}<span class="text-brand-500 terminal-cursor">_</span></p>
    </div></div>
   ${summary()}
   <p class="text-dark-muted text-xs mb-6 -mt-2">${t.base(B.length,P.length)}</p>
   <div class="rounded-2xl p-4 mb-6 border border-brand-500/40 bg-dark-surface/95 shadow-lg">
     <label for="q" class="block text-xs mono text-brand-500 font-bold mb-2">${t.find}</label>
     <input id="q" type="search" autocomplete="off" value="${esc(query)}" placeholder="${esc(t.ph)}" class="w-full bg-dark-base border border-dark-border focus:border-brand-500 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white outline-none transition">
     <div class="mt-3 flex flex-col sm:flex-row sm:items-center gap-3">
       <label class="flex items-center gap-2 text-xs mono text-brand-500 font-bold shrink-0">${t.sort}
        <select id="sortSel" class="bg-dark-base border border-dark-border focus:border-brand-500 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-white outline-none cursor-pointer">${Object.keys(t.sorts).map(k=>`<option value="${k}" ${k===sortKey?'selected':''}>${t.sorts[k]}</option>`).join('')}</select></label>
       <div id="chips" class="flex flex-wrap gap-2"></div></div></div>
   <div id="out"></div>
   <p class="text-dark-muted text-xs mt-8">${t.foot1}</p><p class="text-dark-muted text-xs mt-2">${t.foot2}</p>
  </div>`;
  document.getElementById('q').addEventListener('input',e=>{query=e.target.value;list();});
  document.getElementById('sortSel').onchange=e=>{sortKey=e.target.value;list();};
  chips(); list();
}
document.getElementById('langBtn').onclick=()=>{ lang=lang==='ar'?'en':'ar'; try{ const c=load(); c.lang=lang; localStorage.setItem(KEY,JSON.stringify(c)); }catch(e){} shell(); };
shell();

(function networkBackground(){
  const canvas=document.getElementById('netCanvas'); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors=['249,115,22','56,189,248'];
  let w,h,particles=[],rafId=null;
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
  function initParticles(){const n=reduceMotion?0:Math.min(60,Math.round((w*h)/24000));
    particles=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}));}
  function step(){ctx.clearRect(0,0,w,h);
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;}
    for(let i=0;i<particles.length;i++){const a=particles[i];
      ctx.beginPath();ctx.arc(a.x,a.y,1.5,0,Math.PI*2);ctx.fillStyle='rgba(148,163,184,.55)';ctx.fill();
      for(let j=i+1;j<particles.length;j++){const b=particles[j];const dx=a.x-b.x,dy=a.y-b.y;const d=Math.sqrt(dx*dx+dy*dy);
        if(d<130){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(${colors[(i+j)%2]},${.16*(1-d/130)})`;ctx.lineWidth=1;ctx.stroke();}}}}
  function loop(){step();rafId=requestAnimationFrame(loop);}
  function start(){if(!rafId&&!reduceMotion)rafId=requestAnimationFrame(loop);}
  function stop(){if(rafId){cancelAnimationFrame(rafId);rafId=null;}}
  window.addEventListener('resize',()=>{resize();initParticles();});
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
  resize();initParticles();
  if(reduceMotion){step();}else{start();}
})();

</script>
