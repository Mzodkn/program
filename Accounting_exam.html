<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Principles of Accounting | مبادئ المحاسبة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#0b0f17; --card:#1f2937; --ink:#f3f4f6; --mute:#9ca3af; --line:#374151;
  --v:rgb(168, 85, 247); --v-soft:rgba(168, 85, 247, 0.15); --v-ink:#ffffff;
  --ok:#16a34a; --ok-soft:rgba(22, 163, 74, 0.15); --bad:#ef4444; --bad-soft:rgba(239, 68, 68, 0.15);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);
  background-image: linear-gradient(to right, rgba(56, 189, 248, 0.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
  background-size: 36px 36px;
  font-family:"Inter","Cairo",system-ui,sans-serif;line-height:1.55;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:54px 14px 60px}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--v);outline-offset:2px}

/* start screen */
.hero{background:linear-gradient(135deg, rgb(147, 51, 234), #111827);color:var(--v-ink);border-radius:14px;padding:24px 20px;margin-bottom:14px; border:1px solid var(--line);}
.hero h1{font-size:1.65rem;line-height:1.2}
.hero p{margin:6px 0 0;opacity:.92}
.modes{display:grid;gap:12px}
.mode{text-align:start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.mode:hover{border-color:var(--v)}
.mode h2{font-size:1.2rem;color:var(--v)}
.mode p{margin:4px 0 0;color:var(--mute);font-size:.93rem}
.facts{margin:14px 2px 0;color:var(--mute);font-size:.9rem}
.step{margin:18px 2px 8px;font-size:1rem;color:var(--v)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.size{text-align:start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.size h2{font-size:1.05rem}
.size p{margin:3px 0 0;font-size:.85rem;color:var(--mute)}
.size .nums{font-size:.8rem}
.size[aria-pressed="true"]{border-color:var(--v);background:var(--v-soft)}
.size[aria-pressed="true"] h2{color:var(--v)}
@media (max-width:520px){.sizes{grid-template-columns:1fr}}

/* exam frame */
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--v);transition:width .2s}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 2px 10px;font-size:.88rem;color:var(--mute)}
.qhead b{color:var(--v)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.how{margin:0 0 14px;padding:9px 12px;background:var(--v-soft);border-radius:8px;font-size:.92rem}
.stmt{margin:0 0 12px;font-size:1.06rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.btn{transition: background 0.3s; padding:12px 24px;border-radius:10px;border:0;background:var(--v);color:var(--v-ink);font-weight:700;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--v);border:1.5px solid var(--v);font-weight:600}
.btn.alt:disabled{opacity:.35}

/* true / false circles */
.opts{display:flex;gap:12px;flex-wrap:wrap}
.circ{min-width:96px;padding:9px 20px;border-radius:999px;border:2px solid transparent;background:transparent;font-weight:600;cursor:pointer}
.circ:hover:not(:disabled){background:var(--v-soft)}
.circ[aria-checked="true"]{border-color:var(--v);background:var(--v-soft);color:var(--v);transform:rotate(-1.5deg)}
.circ.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.circ.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.circ:disabled{cursor:default}

/* multiple choice with circled letter */
.choices{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;padding:10px 12px;border-radius:10px;
  border:1.5px solid var(--line);background:transparent;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--v)}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;
  font-weight:700;font-size:.9rem;color:var(--mute);margin-top:1px}
.opt[aria-checked="true"] .ltr{border-color:var(--v);background:var(--v);color:var(--v-ink)}
.opt[aria-checked="true"]{border-color:var(--v)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{border-color:var(--bad);background:var(--bad);color:#fff}
.opt:disabled{cursor:default}

.fb{margin:12px 0 0;padding:9px 12px;border-radius:8px;font-size:.92rem}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}

/* matching */
.match{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:6px 10px}
.term{display:flex;align-items:center;padding:10px 12px;border-radius:8px;background:var(--v-soft);font-weight:600}
.slot{min-height:54px;border:2px dashed var(--line);border-radius:8px;padding:4px;display:flex;align-items:center}
.slot:not(.filled)::before{color:var(--mute);font-size:.86rem;padding:0 8px}
.slot.filled{border-style:solid;border-color:var(--v)}
.slot.over,#bank.over{border-color:var(--v);background:var(--v-soft)}
.row.done .slot{border-color:var(--ok);background:var(--ok-soft)}
.fix{grid-column:1/-1;font-size:.88rem;color:var(--bad);margin:0}
.bankhead{margin:16px 0 6px;font-weight:600;font-size:.95rem}
#bank{display:flex;flex-direction:column;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:10px;min-height:64px}
.chip{width:100%;text-align:start;font-size:.93rem;line-height:1.4;padding:9px 11px;border-radius:8px;
  background:var(--card);border:1.5px solid var(--v);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.slot .chip{border:0;background:transparent;padding:6px 8px}
.chip.picked{background:var(--v);color:var(--v-ink)}
.chip.lifting{opacity:.35}
.chip.fixed{cursor:default;touch-action:auto}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.3);background:var(--card);
  border:1.5px solid var(--v);border-radius:8px;padding:9px 11px;font-size:.93rem;line-height:1.4;transform:rotate(1.5deg)}

/* talk */
.topics{display:grid;gap:8px;margin-bottom:12px}
.topic{display:flex;gap:10px;text-align:start;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.topic[aria-checked="true"]{border-color:var(--v);background:var(--v-soft)}
textarea{width:100%;min-height:160px;resize:vertical;padding:12px;border-radius:10px;border:1.5px solid var(--line);
  font:inherit;background:var(--bg);color:var(--ink)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 0}
.mic{padding:8px 14px;border-radius:999px;border:1.5px solid var(--v);background:transparent;color:var(--v);cursor:pointer}
.mic.on{background:var(--v);color:var(--v-ink)}
.count{color:var(--mute);font-size:.9rem}
.sample{margin-top:12px;padding:10px 12px;background:var(--v-soft);border-radius:8px;font-size:.93rem}

/* result */
.score{font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--v)}
table{border-collapse:collapse;width:100%;margin:8px 0 14px}
td{padding:6px 0;border-top:1px solid var(--line)}
td:last-child{text-align:end;font-variant-numeric:tabular-nums}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
summary{cursor:pointer;font-weight:600}
.rev{list-style:none;padding:0;margin:10px 0 0}
.rev li{padding:10px 0;border-top:1px solid var(--line);font-size:.93rem}
.rev .a{color:var(--bad)} .rev .c{color:var(--ok)} .rev .w{color:var(--mute)}
.mine{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;font-size:.93rem}
@media (max-width:520px){.row{grid-template-columns:1fr}.hero h1{font-size:1.4rem}}

/* ===== v6 additions ===== */
html[dir="rtl"] body{font-family:"Cairo","Inter",system-ui,sans-serif}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-36px 0 14px}
.lang{padding:7px 14px;border-radius:999px;border:1.5px solid var(--v);background:var(--card);color:var(--v);font-weight:700;cursor:pointer;font-size:.9rem}
.lang:hover{background:var(--v-soft)}
.slot:not(.filled)::before{content:attr(data-ph)}
.qbox{background:var(--bg);border:1px solid var(--line);border-inline-start:4px solid var(--v);border-radius:10px;padding:14px 14px;margin:0 0 16px}
.qbox .stmt{margin:0;font-size:1.08rem;line-height:1.65}
.alabel{margin:0 0 8px;font-size:.82rem;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.alabel::after{content:"";flex:1;height:1px;background:var(--line)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.circ{min-height:58px;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-radius:12px;font-size:1.05rem;background:transparent}
.circ i{font-style:normal;font-weight:800;font-size:1.15rem}
.circ[aria-checked="true"]{transform:none;border-color:var(--v);background:var(--v-soft);color:var(--v)}
.circ.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.circ.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.dot{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:transparent;font-size:.72rem;color:var(--mute);cursor:pointer;padding:0}
.dot.ans{background:var(--v-soft);border-color:var(--v);color:var(--v)}
.dot.cur{background:var(--v);border-color:var(--v);color:var(--v-ink);font-weight:700}
.dot:disabled{opacity:.5;cursor:default}
.ghostlink{background:none;border:0;color:var(--mute);cursor:pointer;font-size:.88rem;padding:4px 0;text-decoration:underline}
.warn{margin:12px 0 0;padding:9px 12px;border-radius:8px;background:rgba(234,179,8,.15);color:#facc15;font-size:.9rem}
.pct{color:var(--mute);font-size:1rem;margin-inline-start:8px}
.fb{display:flex;gap:8px}
@media (max-width:520px){.topbar{margin-top:-40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="topbar"><span></span><button class="lang" id="langbtn" type="button"></button></div><div id="app"></div></div>

<script>
(function(){
/* ================= DATA ================= */
const PARTS_UNUSED={
  1:"Part 1: True or False",
  2:"Part 2: Circle the correct answer",
  3:"Part 3: Match A with B",
  4:"Part 4: Talk about it"
};

const TF=[
 {q:"In the first definition, the accounting process reports the transactions to owners, regulators and tax collection entities.",a:false,
  why:"It says oversight agencies, regulators and tax collection entities. Owners are not named there."},
 {q:"The first definition says the financial statements summarize a company's operations, its financial position and its cash flows over an accounting period.",a:true,
  why:"That is the end of the third bullet of the definition."},
 {q:"Pacioli, called the Father of Accounting, published the first double-entry book in 1494 and also invented the system.",a:false,
  why:"He published the first book on it, but he did not invent the system."},
 {q:"The phrase 'financial in nature' means that the information is expressed in monetary terms.",a:true,
  why:"Accounting information is mainly financial, so it is measured in money."},
 {q:"A retailer buys goods in large quantities, usually from manufacturers, and resells them in smaller batches.",a:false,
  why:"That describes a wholesaler. A retailer buys from wholesalers and sells directly to consumers."},
 {q:"Wholesale and retail businesses are also known as trade businesses.",a:true,
  why:"Both buy goods and resell them."},
 {q:"A corporation gives its owners limited liability, and the number of owners it can have is limited.",a:false,
  why:"There is no limit on the number of owners."},
 {q:"A sole proprietorship is the most common form of business because there are so few legal requirements to set it up.",a:true,
  why:"The owner is called the sole proprietor."},
 {q:"Managers need accounting information mainly to verify the tax figures that the company submitted.",a:false,
  why:"Verifying taxes is what government agencies do. Managers prepare reports, read budgets and evaluate performance."},
 {q:"Employees use accounting information partly because their bonuses or options may be tied to the enterprise's performance.",a:true,
  why:"They also want to work for successful companies."},
 {q:"An asset may be intangible.",a:true,
  why:"Assets may be tangible or intangible."},
 {q:"A business has assets of 31,000 and owner's equity of 20,000. Its liabilities are 10,000.",a:false,
  why:"31,000 - 20,000 = 11,000."},
 {q:"In the sample chart of accounts, Cash is numbered 1000 and Accounts Payable is numbered 3000.",a:false,
  why:"Accounts Payable is 2000. The 3000s are for owner's equity."},
 {q:"In the ledger, the PR column shows the journal page that the entry came from, such as G1.",a:true,
  why:"The journal's PR column holds the account number, and the ledger's PR column holds the journal reference."},
 {q:"A compound entry has exactly one debit and one credit.",a:false,
  why:"A compound entry has more than one debit or more than one credit."},
 {q:"Only business transactions and events that affect the business are recorded in the general journal and the general ledger.",a:true,
  why:"Other events are not recorded."},
 {q:"A trial balance lists the account balances in the order of the income statement.",a:false,
  why:"It lists them in balance sheet order."},
 {q:"In a sole proprietorship, the owner's withdrawal account is closed together with the revenue and expense accounts.",a:true,
  why:"Revenue, expense and withdrawal accounts are all temporary accounts."},
 {q:"A quarterly income statement uses the revenues and expenses of a six-month period.",a:false,
  why:"Quarterly means three months. An annual statement covers 12 months."},
 {q:"The balance sheet lists assets, liabilities and owner's equity at a particular point in time, so it shows the net worth of the business.",a:true,
  why:"The income statement, in contrast, covers a period."}
];

/* first option is always the correct one; options are shuffled when the exam starts */
const MCQ=[
 {q:"Which kind of business needs a reseller's permit in most states, according to the lecture?",
  o:["Retail business","Manufacturing business","Service business","Partnership"],
  why:"The retailer bullet says most states require a reseller's permit to purchase and resell."},
 {q:"What do a wholesaler and a retailer have in common?",
  o:["Both resell goods that they buy","Both convert materials into goods","Both earn their income from fees","Both sell directly to the end buyers"],
  why:"They are called trade businesses. Only the retailer sells directly to the end consumer."},
 {q:"Besides some form of investment, what does every business need in order to make a profit?",
  o:["Enough customers to buy its output regularly","More than one owner to share the risk","A reseller's permit from the government","A bank loan that is paid back each year"],
  why:"The lecture says it needs enough customers to whom its output can be sold on a consistent basis."},
 {q:"Which of these is the owners' proof of ownership in a corporation?",
  o:["Stock","Capital account","Partnership deed","Reseller's permit"],
  why:"The owners are called stockholders or shareholders."},
 {q:"Which of these is greater in a corporation than in the other two forms of business?",
  o:["Government regulation","Ease of dissolving","Ease of starting up","Control by one person"],
  why:"A corporation has more regulation. The other three fit a sole proprietorship better."},
 {q:"According to the first definition, the accounting process reports the transactions to which group?",
  o:["Oversight agencies, regulators, tax collection entities","Shareholders, creditors, employees and financial analysts","Customers, suppliers, banks and competing companies","Owners, managers, directors and the company's staff"],
  why:"The first definition names oversight agencies, regulators and tax collection entities."},
 {q:"Which of these is NOT something the financial statements summarize, according to the first definition?",
  o:["The budget for the next period","The company's operations","The company's financial position","The company's cash flows"],
  why:"The statements summarize operations, financial position and cash flows."},
 {q:"The second definition describes accounting as a body of knowledge about all of these EXCEPT:",
  o:["Preparing goods for sale","Keeping financial records","Performing internal audits","Advising on taxation matters"],
  why:"It covers recording transactions, keeping records, internal audits, reporting to management and tax advice."},
 {q:"In the AICPA committee's definition, which activity comes right after classifying?",
  o:["Summarizing","Recording","Interpreting","Analyzing"],
  why:"The order is recording, classifying, summarizing, and then interpreting the results."},
 {q:"Which statement about Friar Luca is correct?",
  o:["He published the first double-entry book but did not invent it","He invented the double-entry system and published it in 1494","He founded the FASB and wrote the first accounting rules","He was the AICPA committee member who defined accounting"],
  why:"The first book on double entry was published in 1494, but he did not invent the system."},
 {q:"Which user is interested in the company's earnings, its prospects for future earnings and its ability to pay its debts?",
  o:["Owners","Creditors","Tax authorities","Employees"],
  why:"Owners want all three. Creditors mainly want to know they will be paid."},
 {q:"A tax inspector checks the figures a company submitted for income tax, sales tax and employment tax. Which user is this?",
  o:["A government agency","A financial analyst","A creditor","A manager"],
  why:"Taxing authorities verify the information submitted by companies."},
 {q:"Managers and supervisors must understand the accounting data in reports and budgets, and express future plans in:",
  o:["Financial terms","Legal terms","Physical units","Marketing terms"],
  why:"They must be able to express future plans in financial terms."},
 {q:"Which user forms opinions from accounting data in order to make investment recommendations?",
  o:["Financial analyst","Employee","Creditor","Owner"],
  why:"Financial analysts base their investment recommendations on accounting data."},
 {q:"Which statement about assets is correct, according to the lecture?",
  o:["They may be tangible or intangible","They are not affected by transactions","They only change when the owner invests more money","They are limited to items that can be touched"],
  why:"Assets may be tangible or intangible, and they are affected by the transactions of the business."},
 {q:"A bank lends the business 23,000 for a truck. In this loan the business is the:",
  o:["Debtor","Creditor","Stockholder","Partner"],
  why:"The one who borrows is the debtor. The bank is the creditor."},
 {q:"Capital is sometimes called net assets because it equals:",
  o:["Assets minus liabilities","Assets plus liabilities","Revenue minus expenses","Liabilities minus drawings"],
  why:"Owner's equity = assets - liabilities."},
 {q:"A truck costs 35,000. The owner invests 12,000 and the bank lends the rest. In the equation, the 23,000 appears under:",
  o:["Liabilities","Assets","Owner's equity","Revenue"],
  why:"The borrowed amount is owed to the bank, so it is a liability."},
 {q:"The assets of a business are 31,000 and the owner's equity is 20,000. What are the liabilities?",
  o:["11,000","51,000","9,000","20,000"],
  why:"Liabilities = assets - equity = 31,000 - 20,000."},
 {q:"The liabilities are 20,000 and the owner's equity is 80,000. What are the assets?",
  o:["100,000","60,000","80,000","120,000"],
  why:"Assets = liabilities + owner's equity."},
 {q:"The owner takes 3,000 cash from the business to pay a personal bill. Which element does this affect?",
  o:["Drawing","Expense","Revenue","Liability"],
  why:"Cash withdrawn by the owner is a drawing, not an expense of the business."},
 {q:"What is a chart of accounts used for?",
  o:["Listing the accounts used, grouped by class","Proving that total debits equal total credits","Recording each transaction in date order","Reporting the result of one accounting period"],
  why:"It organizes the accounts into assets, liabilities, equity, revenue and expenses."},
 {q:"In the sample chart of accounts, which numbers are used for Owner's Equity accounts?",
  o:["3000s","1000s","2000s","4000s"],
  why:"Owner's Capital is 3000, Owner's Withdrawals 3010 and Retained Earnings 3020."},
 {q:"Which of these is listed among the liability accounts in the lecture?",
  o:["Accrued interest","Prepaid rent","Retained earnings","Depreciation"],
  why:"Prepaid rent is an asset, retained earnings is equity and depreciation is an expense."},
 {q:"Which of these is listed among the expense accounts in the lecture?",
  o:["Doubtful accounts","Interest income","Retained earnings","Bonds payable"],
  why:"Interest income is revenue, retained earnings is equity and bonds payable is a liability."},
 {q:"Which pair of accounts both normally have debit balances?",
  o:["Equipment and utilities expense","Equipment and accounts payable","Sales and rent expense","Capital and cash"],
  why:"Assets and expenses have a normal debit balance."},
 {q:"A credit to an asset account means that the account:",
  o:["Decreases","Increases","Is closed","Has its normal balance"],
  why:"Assets increase with debits and decrease with credits."},
 {q:"Which two books receive the recorded business transactions?",
  o:["General journal and general ledger","Trial balance and balance sheet","Chart of accounts and journal","Ledger and income statement"],
  why:"Transactions are recorded in the general journal and then posted to the general ledger."},
 {q:"A journal entry with more than one debit or more than one credit is called a:",
  o:["Compound entry","Single entry","Closing entry","Opening entry"],
  why:"This is the lecture's definition of a compound entry."},
 {q:"A company buys supplies for 2,500 cash and later buys 7,100 of supplies on credit. After both are posted, the Supplies account shows:",
  o:["Two debits: 2,500 and 7,100","A debit of 2,500 and a credit of 7,100","One credit of 9,600","A debit of 7,100 only"],
  why:"Supplies are an asset that increased both times, so both entries are debits."},
 {q:"A business provides consulting services and immediately collects 4,200 in cash. Which account is credited?",
  o:["Consulting Revenue","Cash","Accounts Receivable","Unearned Revenue"],
  why:"Cash is debited and the revenue earned is credited."},
 {q:"For the owner's investment of 30,000 in the business, which account is credited?",
  o:["The owner's capital account","Cash","Consulting revenue","Accounts payable"],
  why:"Cash is debited and the owner's capital is credited."},
 {q:"Which order matches the columns of a ledger account in the lecture?",
  o:["Date, description, PR, debit, credit, balance","Date, debit, credit, PR, description, balance","Description, date, PR, debit, credit, balance","Date, description, debit, credit, PR, balance"],
  why:"The ledger page has Date, Description, PR, Debit, Credit and Balance."},
 {q:"After posting, the ledger's PR column shows a reference such as G1. What does it point to?",
  o:["The journal page that the entry came from","The number of the ledger account","The date of the transaction","The balance after posting"],
  why:"The account number goes in the journal's PR column, and the journal page goes in the ledger's PR column."},
 {q:"A trial balance lists the account balances in the order of the:",
  o:["Balance sheet","Income statement","Alphabet","Dates of the transactions"],
  why:"The lecture says balance sheet order."},
 {q:"The debit balances are Cash 4,350, Supplies 9,720, Prepaid insurance 2,400, Equipment 26,000, Withdrawals 200, Salaries 1,400, Rent 1,000 and Utilities 230. What is the total of the debit column?",
  o:["45,300","44,300","46,300","45,100"],
  why:"4,350 + 9,720 + 2,400 + 26,000 + 200 + 1,400 + 1,000 + 230 = 45,300."},
 {q:"A shop's income statement shows sales of 24,800, lesson income of 3,000 and total expenses of 14,850. What is the net income?",
  o:["12,950","9,950","27,800","14,850"],

  ph:"ابدأ هنا...",words:"كلمات",micOn:"تشغيل الميكروفون",micOff:"إيقاف الميكروفون",show:"إظهار إجابة نموذجية",hide:"إخفاء الإجابة النموذجية",sample:"نموذج:",
  result:"النتيجة",pMode:"وضع التدريب",eMode:"وضع الامتحان",len:"الطول",time:"الوقت",auto:"الأجزاء من 1 إلى 3 تُصحَّح تلقائياً. الجزء 4 يصححه المدرّس.",

  change:"تغيير الوضع",retry:"حاول مرة أخرى",toggle:"🌐 English",answered:"تمت الإجابة"}

const u=k=>(UI[lang][k]!==undefined?UI[lang][k]:UI.en[k]);
function t(str){ if(lang==='en') return str; return DICT[str]||str; }
const qt=q=>(lang==='ar'&&q.type==='mcq'&&MCQ_AR[q.i])?MCQ_AR[q.i]:t(q.q);
const wt=q=>(lang==='ar'&&WHY_AR[q.i]&&q.type==='tf')?WHY_AR[q.i]:q.why;
const num=n=>lang==='ar'?String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]):String(n);

function setLang(l){
  lang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr'; document.documentElement.lang=l;
  document.getElementById('langbtn').textContent=u('toggle');
}
document.getElementById('langbtn').onclick=()=>{ setLang(lang==='en'?'ar':'en'); if(mode===null) home(); else render(false); };

const app=document.getElementById("app");
let size="medium",mode=null,Q=[],ans=[],idx=0,picked=null,startT=0,clockT=null,drag=null,ghost=null,tapStamp=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET="ABCD";

const SIZES={
  short:{k:"short",d:"dShort",tf:10,mcq:20,lists:2,items:3},
  medium:{k:"medium",d:"dMedium",tf:15,mcq:20,lists:1,items:6},
  long:{k:"long",d:"dLong",tf:20,mcq:Math.min(40,MCQ.length),lists:2,items:6}
};
function build(){
  const S=SIZES[size],out=[];
  shuffle(TF.map((x,i)=>Object.assign({i},x))).slice(0,S.tf).forEach(t=>out.push({type:"tf",part:1,i:t.i,q:t.q,a:t.a,why:t.why}));
  shuffle(MCQ.map((x,i)=>Object.assign({i},x))).slice(0,S.mcq).forEach(m=>out.push({type:"mcq",part:2,i:m.i,q:m.q,why:m.why,opts:shuffle(m.o.map((t,i)=>({t,c:i===0})))}));
  shuffle(MATCH).slice(0,S.lists).forEach(s=>{
    let terms=s.terms; if(S.items<terms.length) terms=shuffle(terms).slice(0,S.items);
    const defs={}; terms.forEach(t=>defs[t.id]=s.defs[t.id]); defs.x=s.defs.x; defs.y=s.defs.y;
    out.push({type:"match",part:3,title:s.title,how:s.how,terms,defs,order:shuffle(Object.keys(defs))});
  });
  out.push({type:"talk",part:4});
  return out;
}
function initAns(q){
  if(q.type==="match") return {map:{},bad:{},done:{}};
  if(q.type==="talk") return {topic:0,text:"",sample:false};
  return {v:null,done:false};
}

/* ================= START SCREEN ================= */
function home(){
  clearInterval(clockT); mode=null; window.onbeforeunload=null; setLang(lang);
  const card=k=>{

  app.innerHTML=

   '<p class="facts">'+u('facts')+'</p>';
}
function start(m){
  mode=m; Q=build(); ans=Q.map(initAns); idx=0; picked=null; startT=Date.now();
  clearInterval(clockT);
  if(m==="exam") clockT=setInterval(paintClock,1000);
  window.onbeforeunload=()=>true;
  render(true);
}
function paintClock(){ const el=document.getElementById("clock"); if(el) el.textContent=fmtTime(Date.now()-startT); }
function fmtTime(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

/* ================= RENDER ================= */
function isAnswered(i){
  const q=Q[i],a=ans[i];
  if(q.type==="tf"||q.type==="mcq") return a.v!==null;
  if(q.type==="match") return q.terms.every(x=>a.map[x.id]);
  return a.text.trim().length>0;
}
function canNext(){
  if(mode!=="practice") return true;
  const q=Q[idx],a=ans[idx];
  if(q.type==="tf"||q.type==="mcq") return a.done;
  if(q.type==="match") return q.terms.every(x=>a.done[x.id]);
  return true;
}
function render(toTop){
  if(idx>=Q.length){ return results(); }
  const q=Q[idx], a=ans[idx], last=idx===Q.length-1;
  let body="";
  if(q.type==="tf") body=bodyTF(q,a); else if(q.type==="mcq") body=bodyMCQ(q,a);
  else if(q.type==="match") body=bodyMatch(q,a); else body=bodyTalk(q,a);
  const dots=Q.map((_,i)=>'<button class="dot'+(i===idx?' cur':(isAnswered(i)?' ans':''))+'" data-act="go" data-i="'+i+'"'+(mode==="practice"&&i>idx?' disabled':'')+
    ' aria-label="'+esc(u('qOf')(i+1,Q.length))+'"'+(i===idx?' aria-current="step"':'')+'>'+num(i+1)+'</button>').join("");
  app.innerHTML=
   '<div class="bar"><div style="width:'+((idx+1)/Q.length*100)+'%"></div></div>'+
   '<div class="qhead"><span><b>'+esc(u('p'+q.part))+'</b></span><span>'+u('qOf')(num(idx+1),num(Q.length))+'</span>'+
   (mode==="exam"?'<span id="clock">'+fmtTime(Date.now()-startT)+'</span>':'<span>'+u('practice')+'</span>')+'</div>'+
   '<div class="dots">'+dots+'</div>'+
   '<div class="card">'+body+'</div>'+
   '<div class="nav"><button class="btn alt" data-act="prev"'+(idx===0?' disabled':'')+'>'+(lang==='ar'?'→ ':'← ')+u('back')+'</button>'+
   '<button class="btn" data-act="next"'+(canNext()?'':' disabled')+'>'+(last?u('finish'):u('next')+(lang==='ar'?' ←':' →'))+'</button></div>'+
   '<p style="text-align:center;margin:14px 0 0"><button class="ghostlink" data-act="quit">'+u('home')+'</button></p>';
  if(toTop) window.scrollTo(0,0);
}
function feedback(ok,text){ return '<p class="fb '+(ok?'ok':'bad')+'" role="status"><b>'+(ok?'✓':'✗')+'</b><span>'+esc(text)+'</span></p>'; }

function bodyTF(q,a){
  const show=mode==="practice"&&a.done, corr=q.a?"T":"F";
  const btn=(v,label,ic)=>{
    let cls="circ";
    if(show){ if(v===corr) cls+=" right"; else if(a.v===v) cls+=" wrong"; }
    return '<button class="'+cls+'" role="radio" aria-checked="'+(a.v===v)+'" data-act="tf" data-v="'+v+'"'+(show?' disabled':'')+'><i>'+ic+'</i>'+label+'</button>';
  };
  let h='<p class="how">'+u('howTF')+'</p><div class="qbox"><p class="stmt">'+esc(t(q.q))+'</p></div>'+
        '<p class="alabel">'+u('choose')+'</p><div class="opts" role="radiogroup">'+btn("T",u('T'),"✓")+btn("F",u('F'),"✗")+'</div>';
  if(show){ const ok=a.v===corr; h+=feedback(ok,(ok?u('right'):u('ans')+(q.a?u('T'):u('F'))+". ")+wt(q)); }
  return h;
}
function bodyMCQ(q,a){
  const show=mode==="practice"&&a.done, L=lang==='ar'?"أبجد":LET;
  let h='<p class="how">'+u('howMC')+'</p><div class="qbox"><p class="stmt">'+esc(qt(q))+'</p></div><p class="alabel">'+u('choose')+'</p><div class="choices" role="radiogroup">';
  q.opts.forEach((o,k)=>{
    let cls="opt";
    if(show){ if(o.c) cls+=" right"; else if(a.v===k) cls+=" wrong"; }
    h+='<button class="'+cls+'" role="radio" aria-checked="'+(a.v===k)+'" data-act="mcq" data-k="'+k+'"'+(show?' disabled':'')+'><span class="ltr">'+L[k]+'</span><span>'+esc(t(o.t))+'</span></button>';
  });
  h+='</div>';
  if(show){ const ok=q.opts[a.v].c, right=L[q.opts.findIndex(o=>o.c)]; h+=feedback(ok,(ok?u('right'):u('ans')+right+". ")+t(q.why)); }
  return h;
}
function bodyMatch(q,a){
  const used=Object.values(a.map);
  const chip=(d,fixed)=>'<button class="chip'+(fixed?' fixed':'')+(picked===d?' picked':'')+'" data-d="'+d+'"'+(fixed?' disabled':'')+'>'+esc(t(q.defs[d]))+'</button>';
  let h='<p class="how">'+esc(t(q.how))+' '+u('tap')+'</p><p class="alabel">'+u('termsH')+'</p><div class="match">';
  q.terms.forEach(tm=>{
    const d=a.map[tm.id], done=!!a.done[tm.id];
    h+='<div class="row'+(done?' done':'')+'"><div class="term">'+esc(t(tm.t))+'</div>'+
       '<div class="slot'+(d?' filled':'')+'" data-t="'+tm.id+'" data-ph="'+u('drop')+'">'+(d?chip(d,done):'')+'</div>';
    if(done&&a.bad[tm.id]) h+='<p class="fix">'+u('chosen')+esc(t(q.defs[a.bad[tm.id]]))+'</p>';
    h+='</div>';
  });
  h+='</div><div class="bankhead">'+u('bank')+'</div><div id="bank">'+q.order.filter(k=>!used.includes(k)).map(k=>chip(k,false)).join("")+'</div>';
  return h;
}
function bodyTalk(q,a){
  const T=TOPICS[a.topic];
  let h='<p class="how">'+u('talkHow')+'</p><div class="topics" role="radiogroup">';
  TOPICS.forEach((tp,k)=>{ h+='<button class="topic" role="radio" aria-checked="'+(a.topic===k)+'" data-act="topic" data-k="'+k+'"><span>'+esc(t(tp.t))+'</span></button>'; });
  h+='</div><textarea id="talk" dir="ltr" placeholder="'+u('ph')+'" aria-label="'+u('myTalk')+'">'+esc(a.text)+'</textarea>'+
     '<div class="tools"><button class="mic" id="mic" data-act="mic" hidden>'+u('micOn')+'</button>'+
     '<span class="count" id="count">'+num(wc(a.text))+' '+u('words')+'</span>'+
     (mode==="practice"?'<button class="mic" data-act="sample">'+(a.sample?u('hide'):u('show'))+'</button>':'')+'</div>';
  if(mode==="practice"&&a.sample) h+='<p class="sample" dir="ltr"><b>'+u('sample')+'</b> '+esc(T.s)+'</p>';
  return h;
}
function wc(t){const m=t.trim().match(/\S+/g);return m?m.length:0}

/* ================= EVENTS ================= */
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); 
  if(el){
    const act=el.dataset.act, a=ans[idx];
    if(act==="size"){ size=el.dataset.s; return home(); }
    if(act==="start") return start(el.dataset.m);
    if(act==="home") return home();
    if(act==="retry") return start(mode);
    if(act==="next"){
      stopMic(); picked=null;
      if(idx===Q.length-1){ const n=Q.filter((_,i)=>!isAnswered(i)&&Q[i].type!=="talk").length; if(mode==="exam"&&n&&!confirm(u('unans')(num(n)))) return; }
      idx++; return render(true); }
    if(act==="go"){ stopMic(); picked=null; idx=+el.dataset.i; return render(true); }
    if(act==="quit"){ if(confirm(u('leave'))) return home(); return; }
    if(act==="prev"){ stopMic(); picked=null; idx=Math.max(0,idx-1); return render(true); }
    if(act==="tf"){ if(mode==="practice"&&a.done) return; a.v=el.dataset.v; if(mode==="practice") a.done=true; return render(); }
    if(act==="mcq"){ if(mode==="practice"&&a.done) return; a.v=+el.dataset.k; if(mode==="practice") a.done=true; return render(); }
    if(act==="topic"){ a.topic=+el.dataset.k; return render(); }
    if(act==="sample"){ a.sample=!a.sample; return render(); }
    if(act==="mic") return toggleMic();
    return;
  }
  /* matching taps */
  if(Date.now()-tapStamp<400) return;
  const q=Q[idx]; if(!q||q.type!=="match") return;
  const chip=e.target.closest(".chip");
  if(chip&&!chip.classList.contains("fixed")){
    /* a tap on a chip is handled on pointerup (see below) */ return;
  }
  const slot=e.target.closest(".slot");
  if(slot&&picked){ placeDef(picked,slot.dataset.t); return; }
  if(e.target.closest("#bank")&&picked){ placeDef(picked,null); }
});

document.addEventListener("input",e=>{
  if(e.target.id!=="talk") return;
  ans[idx].text=e.target.value;
  const c=document.getElementById("count"); if(c) c.textContent=num(wc(e.target.value))+" "+u("words");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&picked){picked=null;render()}
});

/* ---- matching: drag + tap ---- */
function placeDef(d,t){
  const q=Q[idx], a=ans[idx];
  for(const k in a.map){ if(a.map[k]===d&&!a.done[k]) delete a.map[k]; }
  picked=null;
  if(t){
    if(a.done[t]) return render();
    a.map[t]=d;
    if(mode==="practice"){
      a.done[t]=true;
      if(d!==t){ a.bad[t]=d; a.map[t]=t; }
    }
  }
  render();
}
function targetAt(x,y){
  const el=document.elementFromPoint(x,y); if(!el) return null;
  return el.closest(".slot")||el.closest("#bank");
}
function clearOver(){document.querySelectorAll(".over").forEach(n=>n.classList.remove("over"))}
document.addEventListener("pointerdown",e=>{
  const chip=e.target.closest(".chip"); if(!chip||chip.classList.contains("fixed")) return;
  drag={d:chip.dataset.d,chip,sx:e.clientX,sy:e.clientY,moving:false};
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(!drag.moving){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<7) return;
    drag.moving=true; picked=null;
    const r=drag.chip.getBoundingClientRect();
    ghost=drag.chip.cloneNode(true); ghost.className="ghost"; ghost.style.width=r.width+"px";
    document.body.appendChild(ghost);
    drag.chip.classList.add("lifting");
    drag.dx=Math.min(40,r.width/2); drag.dy=18;
  }
  ghost.style.left=(e.clientX-drag.dx)+"px"; ghost.style.top=(e.clientY-drag.dy)+"px";
  clearOver(); const t=targetAt(e.clientX,e.clientY); if(t) t.classList.add("over");
});
function endDrag(e,cancel){
  if(!drag) return;
  const d=drag; drag=null; tapStamp=Date.now();
  if(d.moving){
    const t=cancel?null:targetAt(e.clientX,e.clientY);
    if(ghost){ghost.remove();ghost=null}
    clearOver(); d.chip.classList.remove("lifting");
    if(t) placeDef(d.d, t.classList.contains("slot")?t.dataset.t:null);
  } else if(!cancel){
    const inSlot=d.chip.parentNode.classList&&d.chip.parentNode.classList.contains("slot");
    if(picked&&picked!==d.d&&inSlot) return placeDef(picked,d.chip.parentNode.dataset.t);
    picked=(picked===d.d)?null:d.d; render();
  }
}
document.addEventListener("pointerup",e=>endDrag(e,false));
document.addEventListener("pointercancel",e=>endDrag(e,true));

/* ---- microphone ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
function stopMic(){ if(listening&&rec){try{rec.stop()}catch(_){}} }
function toggleMic(){
  if(!SR) return;
  if(listening){ stopMic(); return; }
  const a=ans[idx];
  rec=new SR(); rec.lang="en-US"; rec.continuous=true; rec.interimResults=false;
  rec.onresult=ev=>{
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      if(ev.results[i].isFinal){
        a.text=(a.text+" "+ev.results[i][0].transcript).trim();
        const t=document.getElementById("talk"),c=document.getElementById("count");
        if(t) t.value=a.text; if(c) c.textContent=num(wc(a.text))+" "+u("words");
      }
    }
  };
  rec.onend=()=>{listening=false;const m=document.getElementById("mic");if(m){m.classList.remove("on");m.textContent=u("micOn")}};
  rec.onerror=()=>{};
  rec.start(); listening=true;
  const m=document.getElementById("mic"); if(m){m.classList.add("on");m.textContent=u("micOff")}
}
/* show the mic button only when supported (checked after every render) */
new MutationObserver(()=>{const m=document.getElementById("mic"); if(m&&SR) m.hidden=false;}).observe(app,{childList:true,subtree:true});

/* ================= RESULTS ================= */
function scoreOf(i){
  const q=Q[i],a=ans[i];
  if(q.type==="tf") return a.v===(q.a?"T":"F")?1:0;
  if(q.type==="mcq") return (a.v!==null&&q.opts[a.v].c)?1:0;
  if(q.type==="match") return q.terms.filter(t=>a.map[t.id]===t.id&&!a.bad[t.id]).length;
  return 0;
}
function results(){
  clearInterval(clockT); stopMic(); window.onbeforeunload=null;
  const by={1:[0,0],2:[0,0],3:[0,0]};
  Q.forEach((q,i)=>{ if(q.part===4) return; by[q.part][0]+=scoreOf(i); by[q.part][1]+= q.type==="match"?q.terms.length:1; });
  const got=by[1][0]+by[2][0]+by[3][0], tot=by[1][1]+by[2][1]+by[3][1], pct=Math.round(got/tot*100);
  const talk=ans[Q.length-1], rev=[], L=lang==='ar'?"أبجد":LET;
  const yn=v=>v==="T"?u('T'):u('F');
  Q.forEach((q,i)=>{
    const a=ans[i];
    if(q.type==="tf"&&scoreOf(i)===0){
      rev.push('<li><b>'+num(i+1)+'.</b> '+esc(t(q.q))+'<br><span class="'+(a.v?'a':'w')+'">'+u('yours')+(a.v?yn(a.v):u('na'))+'</span><br><span class="c">'+u('correct')+(q.a?u('T'):u('F'))+'.</span> '+esc(wt(q))+'</li>');
    }
    if(q.type==="mcq"&&scoreOf(i)===0){
      const c=q.opts.find(o=>o.c).t;
      rev.push('<li><b>'+num(i+1)+'.</b> '+esc(qt(q))+'<br><span class="'+(a.v!==null?'a':'w')+'">'+u('yours')+(a.v!==null?esc(t(q.opts[a.v].t)):u('na'))+'</span><br><span class="c">'+u('correct')+esc(t(c))+'.</span> '+esc(t(q.why))+'</li>');
    }
    if(q.type==="match"){
      q.terms.forEach(tm=>{
        if(a.map[tm.id]===tm.id&&!a.bad[tm.id]) return;
        const mine=a.bad[tm.id]||a.map[tm.id];
        rev.push('<li><b>'+num(i+1)+'.</b> '+esc(t(tm.t))+'<br><span class="'+(mine?'a':'w')+'">'+u('yours')+(mine?esc(t(q.defs[mine])):u('na'))+'</span><br><span class="c">'+u('correct')+esc(t(q.defs[tm.id]))+'</span></li>');
      });
    }
  });
  const row=(n,k)=>'<tr><td>'+n+'</td><td>'+num(by[k][0])+' / '+num(by[k][1])+'</td></tr>';
  app.innerHTML=
   '<div class="hero"><h1>'+u('result')+'</h1><p>'+(mode==="exam"?u('eMode'):u('pMode'))+' · '+u(SIZES[size].k)+(mode==="exam"?' · '+u('time')+' '+fmtTime(Date.now()-startT):'')+'</p></div>'+
   '<div class="card"><div class="score">'+num(got)+' / '+num(tot)+'<span class="pct">'+num(pct)+'%</span></div>'+
   '<p style="margin:2px 0 10px;color:var(--mute)">'+u('auto')+'</p>'+
   '<table>'+row(u('p1'),1)+row(u('p2'),2)+row(u('p3'),3)+'<tr><td>'+u('p4')+'</td><td>'+num(wc(talk.text))+' '+u('words')+'</td></tr></table>'+
   '<details'+(rev.length?' open':'')+'><summary>'+u('review')+' ('+num(rev.length)+')</summary>'+
   (rev.length?'<ol class="rev" style="list-style:none">'+rev.join("")+'</ol>':'<p>'+u('none')+'</p>')+'</details>'+
   (talk.text.trim()?'<details><summary>'+u('myTalk')+'</summary><p dir="ltr"><b>'+esc(TOPICS[talk.topic].t)+'</b></p><p class="mine" dir="ltr">'+esc(talk.text)+'</p></details>':'')+
   '</div><div class="nav"><button class="btn alt" data-act="home">'+u('change')+'</button><button class="btn" data-act="retry">'+u('retry')+'</button></div>';
  window.scrollTo(0,0);
}

setLang("en");home();
})();
</script>
