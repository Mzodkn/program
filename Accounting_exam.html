<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Principles of Accounting | مبادئ المحاسبة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#0b0f17; --card:#1f2937; --ink:#f3f4f6; --mute:#9ca3af; --line:#374151;
  --v:rgb(168, 85, 247); --v-soft:rgba(168, 85, 247, 0.15); --v-ink:#ffffff;
  --ok:#16a34a; --ok-soft:rgba(22, 163, 74, 0.15); --bad:#ef4444; --bad-soft:rgba(239, 68, 68, 0.15);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);
  background-image: linear-gradient(to right, rgba(56, 189, 248, 0.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
  background-size: 36px 36px;
  font-family:"Inter","Cairo",system-ui,sans-serif;line-height:1.55;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 60px}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--v);outline-offset:2px}

/* start screen */
.hero{background:linear-gradient(135deg, rgb(147, 51, 234), #111827);color:var(--v-ink);border-radius:14px;padding:24px 20px;margin-bottom:14px; border:1px solid var(--line);}
.hero h1{font-size:1.65rem;line-height:1.2}
.hero p{margin:6px 0 0;opacity:.92}
.modes{display:grid;gap:12px}
.mode{text-align:start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.mode:hover{border-color:var(--v)}
.mode h2{font-size:1.2rem;color:var(--v)}
.mode p{margin:4px 0 0;color:var(--mute);font-size:.93rem}
.facts{margin:14px 2px 0;color:var(--mute);font-size:.9rem}
.step{margin:18px 2px 8px;font-size:1rem;color:var(--v)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.size{text-align:start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.size h2{font-size:1.05rem}
.size p{margin:3px 0 0;font-size:.85rem;color:var(--mute)}
.size .nums{font-size:.8rem}
.size[aria-pressed="true"]{border-color:var(--v);background:var(--v-soft)}
.size[aria-pressed="true"] h2{color:var(--v)}
@media (max-width:520px){.sizes{grid-template-columns:1fr}}

/* exam frame */
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--v);transition:width .2s}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 2px 10px;font-size:.88rem;color:var(--mute)}
.qhead b{color:var(--v)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.how{margin:0 0 14px;padding:9px 12px;background:var(--v-soft);border-radius:8px;font-size:.92rem}
.stmt{margin:0 0 12px;font-size:1.06rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.btn{transition: background 0.3s; padding:12px 24px;border-radius:10px;border:0;background:var(--v);color:var(--v-ink);font-weight:700;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--v);border:1.5px solid var(--v);font-weight:600}
.btn.alt:disabled{opacity:.35}

/* true / false circles */
.opts{display:flex;gap:12px;flex-wrap:wrap}
.circ{min-width:96px;padding:9px 20px;border-radius:999px;border:2px solid transparent;background:transparent;font-weight:600;cursor:pointer}
.circ:hover:not(:disabled){background:var(--v-soft)}
.circ[aria-checked="true"]{border-color:var(--v);background:var(--v-soft);color:var(--v);transform:rotate(-1.5deg)}
.circ.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.circ.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.circ:disabled{cursor:default}

/* multiple choice with circled letter */
.choices{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;padding:10px 12px;border-radius:10px;
  border:1.5px solid var(--line);background:transparent;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--v)}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;
  font-weight:700;font-size:.9rem;color:var(--mute);margin-top:1px}
.opt[aria-checked="true"] .ltr{border-color:var(--v);background:var(--v);color:var(--v-ink)}
.opt[aria-checked="true"]{border-color:var(--v)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{border-color:var(--bad);background:var(--bad);color:#fff}
.opt:disabled{cursor:default}

.fb{margin:12px 0 0;padding:9px 12px;border-radius:8px;font-size:.92rem}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}

/* matching */
.match{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:6px 10px}
.term{display:flex;align-items:center;padding:10px 12px;border-radius:8px;background:var(--v-soft);font-weight:600}
.slot{min-height:54px;border:2px dashed var(--line);border-radius:8px;padding:4px;display:flex;align-items:center}
.slot:not(.filled)::before{content:"Drop here";color:var(--mute);font-size:.86rem;padding:0 8px}
.slot.filled{border-style:solid;border-color:var(--v)}
.slot.over,#bank.over{border-color:var(--v);background:var(--v-soft)}
.row.done .slot{border-color:var(--ok);background:var(--ok-soft)}
.fix{grid-column:1/-1;font-size:.88rem;color:var(--bad);margin:0}
.bankhead{margin:16px 0 6px;font-weight:600;font-size:.95rem}
#bank{display:flex;flex-direction:column;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:10px;min-height:64px}
.chip{width:100%;text-align:start;font-size:.93rem;line-height:1.4;padding:9px 11px;border-radius:8px;
  background:var(--card);border:1.5px solid var(--v);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.slot .chip{border:0;background:transparent;padding:6px 8px}
.chip.picked{background:var(--v);color:var(--v-ink)}
.chip.lifting{opacity:.35}
.chip.fixed{cursor:default;touch-action:auto}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.3);background:var(--card);
  border:1.5px solid var(--v);border-radius:8px;padding:9px 11px;font-size:.93rem;line-height:1.4;transform:rotate(1.5deg)}

/* talk */
.topics{display:grid;gap:8px;margin-bottom:12px}
.topic{display:flex;gap:10px;text-align:start;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.topic[aria-checked="true"]{border-color:var(--v);background:var(--v-soft)}
textarea{width:100%;min-height:160px;resize:vertical;padding:12px;border-radius:10px;border:1.5px solid var(--line);
  font:inherit;background:var(--bg);color:var(--ink)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 0}
.mic{padding:8px 14px;border-radius:999px;border:1.5px solid var(--v);background:transparent;color:var(--v);cursor:pointer}
.mic.on{background:var(--v);color:var(--v-ink)}
.count{color:var(--mute);font-size:.9rem}
.sample{margin-top:12px;padding:10px 12px;background:var(--v-soft);border-radius:8px;font-size:.93rem}

/* result */
.score{font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--v)}
table{border-collapse:collapse;width:100%;margin:8px 0 14px}
td{padding:6px 0;border-top:1px solid var(--line)}
td:last-child{text-align:end;font-variant-numeric:tabular-nums}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
summary{cursor:pointer;font-weight:600}
.rev{list-style:none;padding:0;margin:10px 0 0}
.rev li{padding:10px 0;border-top:1px solid var(--line);font-size:.93rem}
.rev .a{color:var(--bad)} .rev .c{color:var(--ok)} .rev .w{color:var(--mute)}
.mine{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;font-size:.93rem}
@media (max-width:520px){.row{grid-template-columns:1fr}.hero h1{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

];

function tr(str) {
    if (lang === 'en') return str;
    return DICT[str] || str;
}

const app=document.getElementById("app");
let size="medium",mode=null,Q=[],ans=[],idx=0,picked=null,startT=0,clockT=null,drag=null,ghost=null,tapStamp=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET="ABCD";

const SIZES={
  short:{name:"Short",ar:"قصير",tf:10,mcq:20,lists:2,items:3,desc:"Half of everything"},
  medium:{name:"Medium",ar:"متوسط",tf:15,mcq:20,lists:1,items:6,desc:"One matching list"},
  long:{name:"Long",ar:"طويل",tf:20,mcq:40,lists:2,items:6,desc:"The full exam"}
};
function build(){
  const S=SIZES[size],out=[];
  shuffle(TF).slice(0,S.tf).forEach(t=>out.push({type:"tf",part:1,q:t.q,a:t.a,why:t.why}));
  shuffle(MCQ).slice(0,S.mcq).forEach(m=>out.push({type:"mcq",part:2,q:m.q,why:m.why,opts:shuffle(m.o.map((t,i)=>({t,c:i===0})))}));
  shuffle(MATCH).slice(0,S.lists).forEach(s=>{
    let terms=s.terms; if(S.items<terms.length) terms=shuffle(terms).slice(0,S.items);
    const defs={}; terms.forEach(t=>defs[t.id]=s.defs[t.id]); defs.x=s.defs.x; defs.y=s.defs.y;
    out.push({type:"match",part:3,title:s.title,how:s.how,terms,defs,order:shuffle(Object.keys(defs))});
  });
  out.push({type:"talk",part:4});
  return out;
}
function initAns(q){
  if(q.type==="match") return {map:{},bad:{},done:{}};
  if(q.type==="talk") return {topic:0,text:"",sample:false};
  return {v:null,done:false};
}

/* ================= START SCREEN ================= */
function home(){
  clearInterval(clockT); mode=null;
  const card=k=>{
    const S=SIZES[k], pages=S.tf+S.mcq+S.lists+1;
    return '<button class="size" data-act="size" data-s="'+k+'" aria-pressed="'+(size===k)+'"><h2>'+S.name+' <span dir="rtl">| '+S.ar+'</span></h2>'+
      '<p>'+S.desc+'</p><p class="nums">'+S.tf+' True/False · '+S.mcq+' circle · '+S.lists+(S.lists>1?' lists':' list')+
      (S.items<6?' ('+S.items+' items each)':'')+' · 1 talk<br>'+pages+' questions</p></button>';
  };
  app.innerHTML=
   '<div class="hero"><h1>Principles of Accounting</h1><p dir="rtl">مبادئ المحاسبة — امتحان تجريبي</p></div>'+
   '<h3 class="step">1. Choose the length <span dir="rtl">| اختر الطول</span></h3>'+
   '<div class="sizes">'+card("short")+card("medium")+card("long")+'</div>'+
   '<h3 class="step">2. Choose the mode <span dir="rtl">| اختر الوضع</span></h3>'+
   '<div class="modes">'+
    '<button class="mode" data-act="start" data-m="practice"><h2>Practice <span dir="rtl">| تدريب</span></h2>'+
    '<p>You see the correct answer right after each question. Good for studying.</p></button>'+
    '<button class="mode" data-act="start" data-m="exam"><h2>Exam <span dir="rtl">| امتحان</span></h2>'+
    '<p>No answers until the end. You can go back and change your answers. A timer runs.</p></button>'+
   '</div>'+
   '<p class="facts">Questions are picked at random from the whole bank and shuffled each time.</p>';
}

function start(m){
  mode=m; Q=build(); ans=Q.map(initAns); idx=0; picked=null; startT=Date.now();
  clearInterval(clockT);
  if(m==="exam") clockT=setInterval(paintClock,1000);
  render(true);
}
function paintClock(){
  const el=document.getElementById("clock"); if(!el) return;
  el.textContent=fmtTime(Date.now()-startT);
}
function fmtTime(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

/* ================= RENDER ================= */
function canNext(){
  if(mode!=="practice") return true;
  const q=Q[idx],a=ans[idx];
  if(q.type==="tf"||q.type==="mcq") return a.done;
  if(q.type==="match") return q.terms.every(t=>a.done[t.id]);
  return true;
}
function render(toTop){
  if(idx>=Q.length){ return results(); }
  const q=Q[idx], a=ans[idx], last=idx===Q.length-1;
  let body="";
  if(q.type==="tf") body=bodyTF(q,a);
  else if(q.type==="mcq") body=bodyMCQ(q,a);
  else if(q.type==="match") body=bodyMatch(q,a);
  else body=bodyTalk(q,a);
  app.innerHTML=
   '<div class="bar"><div style="width:'+(idx/Q.length*100)+'%"></div></div>'+
   '<div class="qhead"><span><b>'+esc(tr(PARTS[q.part]))+'</b></span><span>Question '+(idx+1)+' of '+Q.length+'</span>'+
   (mode==="exam"?'<span id="clock">'+fmtTime(Date.now()-startT)+'</span>':'<span>Practice</span>')+'</div>'+
   '<div class="card">'+body+'</div>'+
   '<div class="nav"><button class="btn alt" data-act="prev"'+(idx===0?' disabled':'')+'>Back</button>'+
   '<button class="btn" data-act="next"'+(canNext()?'':' disabled')+'>'+(last?'See result':'Next')+'</button></div>';
  if(toTop) window.scrollTo(0,0);
}

function feedback(ok,text){
  return '<p class="fb '+(ok?'ok':'bad')+'">'+esc(text)+'</p>';
}

function bodyTF(q,a){
  const show=mode==="practice"&&a.done, corr=q.a?"T":"F";
  const btn=(v,label)=>{
    let cls="circ";
    if(show){ if(v===corr) cls+=" right"; else if(a.v===v) cls+=" wrong"; }
    return '<button class="'+cls+'" role="radio" aria-checked="'+(a.v===v)+'" data-act="tf" data-v="'+v+'"'+(show?' disabled':'')+'>'+label+'</button>';
  };
  let h='<p class="how">Circle <b>True</b> or <b>False</b>.</p><p class="stmt">'+esc(tr(q.q))+'</p>'+
        '<div class="opts" role="radiogroup">'+btn("T",tr("True"))+btn("F",tr("False"))+'</div>';
  if(show){
    const ok=a.v===corr;
    h+=feedback(ok,(ok?"Correct. ":tr("Answer: ")+(q.a?"True":"False")+". ")+q.why);
  }
  return h;
}

function bodyMCQ(q,a){
  const show=mode==="practice"&&a.done;
  let h='<p class="how">Circle the letter of the correct answer.</p><p class="stmt">'+esc(tr(q.q))+'</p><div class="choices" role="radiogroup">';
  q.opts.forEach((o,k)=>{
    let cls="opt";
    if(show){ if(o.c) cls+=" right"; else if(a.v===k) cls+=" wrong"; }
    h+='<button class="'+cls+'" role="radio" aria-checked="'+(a.v===k)+'" data-act="mcq" data-k="'+k+'"'+(show?' disabled':'')+'>'+
       '<span class="ltr">'+LET[k]+'</span><span>'+esc(tr(o.t))+'</span></button>';
  });
  h+='</div>';
  if(show){
    const ok=q.opts[a.v].c, right=LET[q.opts.findIndex(o=>o.c)];
    h+=feedback(ok,(ok?"Correct. ":tr("Answer: ")+right+". ")+q.why);
  }
  return h;
}

function bodyMatch(q,a){
  const used=Object.values(a.map);
  const chip=(d,fixed)=>'<button class="chip'+(fixed?' fixed':'')+(picked===d?' picked':'')+'" data-d="'+d+'"'+(fixed?' disabled':'')+'>'+esc(tr(q.defs[d]))+'</button>';
  let h='<p class="how">'+esc(tr(q.how))+' You can also tap a description, then tap a slot.</p><div class="match">';
  q.terms.forEach(t=>{
    const d=a.map[t.id], done=!!a.done[t.id];
    h+='<div class="row'+(done?' done':'')+'"><div class="term">'+esc(tr(t.t))+'</div>'+
       '<div class="slot'+(d?' filled':'')+'" data-t="'+t.id+'">'+(d?chip(d,done):'')+'</div>';
    if(done&&a.bad[t.id]) h+='<p class="fix">Your choice was: '+esc(q.defs[a.bad[t.id]])+'</p>';
    h+='</div>';
  });
  h+='</div><div class="bankhead">Descriptions (B)</div><div id="bank">'+
     q.order.filter(k=>!used.includes(k)).map(k=>chip(k,false)).join("")+'</div>';
  return h;
}

function bodyTalk(q,a){
  const T=TOPICS[a.topic];
  let h='<p class="how">Choose one topic. Speak with the microphone or type 4 to 6 simple sentences. Use at least three terms from the course.</p><div class="topics" role="radiogroup">';
  TOPICS.forEach((t,k)=>{
    h+='<button class="topic" role="radio" aria-checked="'+(a.topic===k)+'" data-act="topic" data-k="'+k+'"><span>'+esc(tr(t.t))+'</span></button>';
  });
  h+='</div><textarea id="talk" placeholder="Start here..." aria-label="Your answer">'+esc(a.text)+'</textarea>'+
     '<div class="tools"><button class="mic" id="mic" data-act="mic" hidden>Start microphone</button>'+
     '<span class="count" id="count">'+wc(a.text)+' words</span>'+
     (mode==="practice"?'<button class="mic" data-act="sample">'+(a.sample?'Hide':'Show')+' sample answer</button>':'')+'</div>';
  if(mode==="practice"&&a.sample) h+='<p class="sample"><b>Sample:</b> '+esc(tr(T.s))+'</p>';
  return h;
}
function wc(t){const m=t.trim().match(/\S+/g);return m?m.length:0}

/* ================= EVENTS ================= */
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); 
  if(el){
    const act=el.dataset.act, a=ans[idx];
    if(act==="size"){ size=el.dataset.s; return home(); }
    if(act==="start") return start(el.dataset.m);
    if(act==="home") return home();
    if(act==="retry") return start(mode);
    if(act==="next"){ stopMic(); picked=null; idx++; return render(true); }
    if(act==="prev"){ stopMic(); picked=null; idx=Math.max(0,idx-1); return render(true); }
    if(act==="tf"){ if(mode==="practice"&&a.done) return; a.v=el.dataset.v; if(mode==="practice") a.done=true; return render(); }
    if(act==="mcq"){ if(mode==="practice"&&a.done) return; a.v=+el.dataset.k; if(mode==="practice") a.done=true; return render(); }
    if(act==="topic"){ a.topic=+el.dataset.k; return render(); }
    if(act==="sample"){ a.sample=!a.sample; return render(); }
    if(act==="mic") return toggleMic();
    return;
  }
  /* matching taps */
  if(Date.now()-tapStamp<400) return;
  const q=Q[idx]; if(!q||q.type!=="match") return;
  const chip=e.target.closest(".chip");
  if(chip&&!chip.classList.contains("fixed")){
    /* a tap on a chip is handled on pointerup (see below) */ return;
  }
  const slot=e.target.closest(".slot");
  if(slot&&picked){ placeDef(picked,slot.dataset.t); return; }
  if(e.target.closest("#bank")&&picked){ placeDef(picked,null); }
});

document.addEventListener("input",e=>{
  if(e.target.id!=="talk") return;
  ans[idx].text=e.target.value;
  const c=document.getElementById("count"); if(c) c.textContent=wc(e.target.value)+tr(" words");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&picked){picked=null;render()}
});

/* ---- matching: drag + tap ---- */
function placeDef(d,t){
  const q=Q[idx], a=ans[idx];
  for(const k in a.map){ if(a.map[k]===d&&!a.done[k]) delete a.map[k]; }
  picked=null;
  if(t){
    if(a.done[t]) return render();
    a.map[t]=d;
    if(mode==="practice"){
      a.done[t]=true;
      if(d!==t){ a.bad[t]=d; a.map[t]=t; }
    }
  }
  render();
}
function targetAt(x,y){
  const el=document.elementFromPoint(x,y); if(!el) return null;
  return el.closest(".slot")||el.closest("#bank");
}
function clearOver(){document.querySelectorAll(".over").forEach(n=>n.classList.remove("over"))}
document.addEventListener("pointerdown",e=>{
  const chip=e.target.closest(".chip"); if(!chip||chip.classList.contains("fixed")) return;
  drag={d:chip.dataset.d,chip,sx:e.clientX,sy:e.clientY,moving:false};
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(!drag.moving){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<7) return;
    drag.moving=true; picked=null;
    const r=drag.chip.getBoundingClientRect();
    ghost=drag.chip.cloneNode(true); ghost.className="ghost"; ghost.style.width=r.width+"px";
    document.body.appendChild(ghost);
    drag.chip.classList.add("lifting");
    drag.dx=Math.min(40,r.width/2); drag.dy=18;
  }
  ghost.style.left=(e.clientX-drag.dx)+"px"; ghost.style.top=(e.clientY-drag.dy)+"px";
  clearOver(); const t=targetAt(e.clientX,e.clientY); if(t) t.classList.add("over");
});
function endDrag(e,cancel){
  if(!drag) return;
  const d=drag; drag=null; tapStamp=Date.now();
  if(d.moving){
    const t=cancel?null:targetAt(e.clientX,e.clientY);
    if(ghost){ghost.remove();ghost=null}
    clearOver(); d.chip.classList.remove("lifting");
    if(t) placeDef(d.d, t.classList.contains("slot")?t.dataset.t:null);
  } else if(!cancel){
    const inSlot=d.chip.parentNode.classList&&d.chip.parentNode.classList.contains("slot");
    if(picked&&picked!==d.d&&inSlot) return placeDef(picked,d.chip.parentNode.dataset.t);
    picked=(picked===d.d)?null:d.d; render();
  }
}
document.addEventListener("pointerup",e=>endDrag(e,false));
document.addEventListener("pointercancel",e=>endDrag(e,true));

/* ---- microphone ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
function stopMic(){ if(listening&&rec){try{rec.stop()}catch(_){}} }
function toggleMic(){
  if(!SR) return;
  if(listening){ stopMic(); return; }
  const a=ans[idx];
  rec=new SR(); rec.lang="en-US"; rec.continuous=true; rec.interimResults=false;
  rec.onresult=ev=>{
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      if(ev.results[i].isFinal){
        a.text=(a.text+" "+ev.results[i][0].transcript).trim();
        const t=document.getElementById("talk"),c=document.getElementById("count");
        if(t) t.value=a.text; if(c) c.textContent=wc(a.text)+tr(" words");
      }
    }
  };
  rec.onend=()=>{listening=false;const m=document.getElementById("mic");if(m){m.classList.remove("on");m.textContent=tr("Start microphone")}};
  rec.onerror=()=>{};
  rec.start(); listening=true;
  const m=document.getElementById("mic"); if(m){m.classList.add("on");m.textContent=tr("Stop microphone")}
}
/* show the mic button only when supported (checked after every render) */
new MutationObserver(()=>{const m=document.getElementById("mic"); if(m&&SR) m.hidden=false;}).observe(app,{childList:true,subtree:true});

/* ================= RESULTS ================= */
function scoreOf(i){
  const q=Q[i],a=ans[i];
  if(q.type==="tf") return a.v===(q.a?"T":"F")?1:0;
  if(q.type==="mcq") return (a.v!==null&&q.opts[a.v].c)?1:0;
  if(q.type==="match") return q.terms.filter(t=>a.map[t.id]===t.id&&!a.bad[t.id]).length;
  return 0;
}
function results(){
  clearInterval(clockT); stopMic();
  const by={1:[0,0],2:[0,0],3:[0,0]};
  Q.forEach((q,i)=>{
    if(q.part===4) return;
    by[q.part][0]+=scoreOf(i);
    by[q.part][1]+= q.type==="match"?q.terms.length:1;
  });
  const got=by[1][0]+by[2][0]+by[3][0], tot=by[1][1]+by[2][1]+by[3][1];
  const talk=ans[Q.length-1];
  const rev=[];
  Q.forEach((q,i)=>{
    const a=ans[i];
    if(q.type==="tf"&&scoreOf(i)===0){
      rev.push('<li><b>'+(i+1)+'.</b> '+esc(tr(q.q))+'<br><span class="'+(a.v?'a':'w')+'">Your answer: '+(a.v?(a.v==="T"?"True":"False"):tr("not answered"))+
        '</span><br><span class="c">Correct: '+(q.a?"True":"False")+'.</span> '+esc(tr(q.why))+'</li>');
    }
    if(q.type==="mcq"&&scoreOf(i)===0){
      const c=q.opts.find(o=>o.c).t;
      rev.push('<li><b>'+(i+1)+'.</b> '+esc(tr(q.q))+'<br><span class="'+(a.v!==null?'a':'w')+'">Your answer: '+(a.v!==null?esc(q.opts[a.v].t):tr("not answered"))+
        '</span><br><span class="c">Correct: '+esc(c)+'.</span> '+esc(tr(q.why))+'</li>');
    }
    if(q.type==="match"){
      q.terms.forEach(t=>{
        if(a.map[t.id]===t.id&&!a.bad[t.id]) return;
        const mine=a.bad[t.id]||a.map[t.id];
        rev.push('<li><b>'+(i+1)+'.</b> '+esc(tr(t.t))+'<br><span class="'+(mine?'a':'w')+'">Your answer: '+(mine?esc(tr(q.defs[mine])):tr("not answered"))+
          '</span><br><span class="c">Correct: '+esc(tr(q.defs[t.id]))+'</span></li>');
      });
    }
  });
  const row=(n,k)=>'<tr><td>'+n+'</td><td>'+by[k][0]+' / '+by[k][1]+'</td></tr>';
  app.innerHTML=
   '<div class="hero"><h1>'+tr("Result")+'</h1><p>'+(mode==="exam"?tr("Exam"):tr("Practice"))+' · '+SIZES[size].name+(mode==="exam"?tr(" · time ")+fmtTime(Date.now()-startT):'')+'</p></div>'+
   '<div class="card"><div class="score">'+got+' / '+tot+'</div>'+
   '<p style="margin:2px 0 10px;color:var(--mute)">Parts 1 to 3 are marked automatically. Part 4 is marked by your instructor.</p>'+
   '<table>'+row(tr("Part 1: True or False"),1)+row(tr("Part 2: Circle the correct answer"),2)+row(tr("Part 3: Matching"),3)+
   '<tr><td>Part 4: Talk about it</td><td>'+wc(talk.text)+' words</td></tr></table>'+
   '<details'+(rev.length?' open':'')+'><summary>Review mistakes ('+rev.length+')</summary>'+
   (rev.length?'<ol class="rev" style="list-style:none">'+rev.join("")+'</ol>':'<p>No mistakes. Well done.</p>')+'</details>'+
   (talk.text.trim()?'<details><summary>Your talk answer</summary><p><b>'+esc(TOPICS[talk.topic].t)+'</b></p><p class="mine">'+esc(talk.text)+'</p></details>':'')+
   '</div>'+
   '<div class="nav"><button class="btn alt" data-act="home">Change mode</button><button class="btn" data-act="retry">Try again</button></div>';
  window.scrollTo(0,0);
}

home();
})();
</script>
