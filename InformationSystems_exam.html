const CFG={fast:{mc:20,tf:15,mt:1,n:5},medium:{mc:35,tf:22,mt:1,n:7},hard:{mc:50,tf:30,mt:2,n:8}};
// ===== Your special midterm questions go here. Formats:
// {t:'mc',q:'Question?',o:['A','B','C','D'],a:0,e:'English explanation',r:'شرح بالعربي'}
// {t:'tf',q:'Statement.',a:true,e:'English explanation',r:'شرح بالعربي'}
const SPECIAL=[];
let S={lang:'en',mode:'fast',prac:true,items:null,i:0};
const T=k=>UI[S.lang][k],$=s=>document.querySelector(s),app=$('#app'),COL=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function mkMC(x){const o=x.fix?x.o.map((t,k)=>({t,c:k==x.a})):sh(x.o.map((t,k)=>({t,c:k==x.a})));return{t:'mc',q:x.q,o,c:o.findIndex(z=>z.c),e:x.e,r:x.r,ans:null}}
function midMC(m){const a=SET[m[1]][m[2]];return mkMC({q:m[0],o:SET[m[1]],a:m[2],fix:1,e:'“'+m[0]+'” → '+a+'.',r:'الإجابة الصحيحة: '+a+' — حسب التعريف في ورقة الامتحان.'})}
function mkMT(p){const pr=p.slice();return{t:'mt',p:pr,ro:sh(pr.map((_,k)=>k)),m:{},sel:null}}
function build(){const c=CFG[S.mode];let it=[];
 if(S.mode=='mid'){it=MID.map(midMC);it.push(mkMT(P0));SPECIAL.forEach(x=>it.push(x.t=='tf'?{t:'tf',q:x.q,c:!!x.a,e:x.e,r:x.r,ans:null}:mkMC(x)));}
 else{const all=MID.map(m=>({q:m[0],o:SET[m[1]],a:m[2],fix:1,e:'“'+m[0]+'” → '+SET[m[1]][m[2]]+'.',r:'الإجابة الصحيحة: '+SET[m[1]][m[2]]+' — حسب التعريف في ورقة الامتحان.'})).concat(MC.map(m=>({q:m[0],o:m[1],a:m[2],e:m[3],r:m[4]})));
 it=sh(all).slice(0,c.mc).map(mkMC).concat(sh(TF).slice(0,c.tf).map(x=>({t:'tf',q:x[0],c:!!x[1],e:x[2],r:x[3],ans:null})));
 const pool=sh(P0.concat(P1));for(let k=0;k<c.mt;k++)it.push(mkMT(pool.slice(k*c.n,k*c.n+c.n)));}
 S.items=it;S.i=0;S.exiting=0;render()}
function pts(it){if(it.t=='mc')return[it.ans===it.c?1:0,1];if(it.t=='tf')return[it.ans===it.c?1:0,1];let s=0;it.p.forEach((_,k)=>{if(it.m[k]===k)s++});return[s,it.p.length]}
function head(){return`<div class="top"><div><h1>${T('title')}</h1></div><button class="lang" onclick="S.lang=S.lang=='en'?'ar':'en';render()">${S.lang=='en'?'العربية':'English'}</button></div>`}
function home(){const M=[['fast','dfast'],['medium','dmed'],['hard','dhard'],['mid','dmid']];
 app.dir=S.lang=='ar'?'rtl':'ltr';
 app.innerHTML=head()+`<p class="sub">${T('sub')}</p>`+M.map(m=>`<button class="mode ${S.mode==m[0]?'on':''}" onclick="S.mode='${m[0]}';render()"><b>${T(m[0]=='mid'?'mid':m[0])}</b><span>${T(m[1])}</span></button>`).join('')+`<div class="seg"><button class="${S.prac?'on':''}" onclick="S.prac=true;render()">${T('prac')}</button><button class="${S.prac?'':'on'}" onclick="S.prac=false;render()">${T('exam')}</button></div><button class="go" onclick="build()">${T('start')}</button>`}
function expl(it,show){const ar=S.lang=='ar';return`<div class="fb bad" dir="${ar?'rtl':'ltr'}"><div class="h">${T('no')}</div>${it.ans!=null?`<p>${T('you')}: <b dir="ltr">${esc(ansTxt(it,it.ans))}</b></p>`:`<p>${T('none')}</p>`}<p>${T('cor')}: <b dir="ltr">${esc(ansTxt(it,it.c))}</b></p><p>${T('why')}: ${esc(ar?it.r:it.e)}</p></div>`}
function ansTxt(it,k){return it.t=='mc'?String.fromCharCode(65+k)+'. '+it.o[k].t:(k?'True':'False')}
function qview(){if(S.exiting)return exitView();const it=S.items[S.i],n=S.items.length,done=S.prac&&it.done;app.dir=S.lang=='ar'?'rtl':'ltr';
 const first={mc:'circ',tf:'tfp',mt:'mp'}[it.t];let h=head()+`<div class="top" style="margin:0"><div class="sub cnt">${T('q')} ${S.i+1} / ${n}</div><button class="lang exit" onclick="S.exiting=1;render()">${T('exit')}</button></div><div class="bar"><i style="width:${(S.i+(done?1:0))/n*100}%"></i></div><div class="card"><div class="part">${T(first)}</div>`;
 if(it.t=='mc'){h+=`<div class="q">${esc(it.q)}</div>`+it.o.map((o,k)=>{let c=it.ans===k?'sel':'';if(done){if(k==it.c)c='ok';else if(it.ans===k)c='bad'}return`<button class="opt ${c}" onclick="pick(${k})"><span class="b">${String.fromCharCode(65+k)}</span><span>${esc(o.t)}</span></button>`}).join('')}
 else if(it.t=='tf'){h+=`<div class="q">${esc(it.q)}</div><div class="tf">`+[1,0].map(k=>{let c=it.ans===!!k?'sel':'';if(done){if(!!k==it.c)c='ok';else if(it.ans===!!k)c='bad'}return`<button class="opt ${c}" onclick="pick(${!!k})">${T(k?'t':'f')}</button>`}).join('')+'</div>'}
 else{const rev=it.m,inv={};Object.keys(rev).forEach(l=>inv[rev[l]]=+l);
  h+=`<p class="hint">${T('hint')}</p><div class="mt"><b>${T('a')}</b><b>${T('b')}</b>`;
  it.p.forEach((p,k)=>{const rk=it.ro[k],c1=it.m[k]!==undefined,c2=inv[rk]!==undefined,col=n=>`background:var(${COL[n%8]})`;
   let c=it.sel===k?'sel':'',d=c2=>done?(c2?'ok':'bad'):'';
   h+=`<button class="mi ${it.sel===k?'sel':''} ${done?(it.m[k]===k?'ok':'bad'):''}" onclick="mt(0,${k})"><span>${esc(p[0])}</span>${c1?`<span class="n" style="${col(k)}">${k+1}</span>`:''}</button>`;
   h+=`<button class="mi ${done?(inv[rk]===rk?'ok':'bad'):''}" onclick="mt(1,${rk})"><span>${esc(it.p[rk][1])}</span>${c2?`<span class="n" style="${col(inv[rk])}">${inv[rk]+1}</span>`:''}</button>`});
  h+='</div>'}
 h+='</div>';
 if(done){const[g,m]=pts(it);if(it.t=='mt'){if(g<m)h+=`<div class="fb bad" dir="ltr"><div class="h">${g} / ${m}</div>`+it.p.map(p=>`<p>${esc(p[0])} → <b>${esc(p[1])}</b></p>`).join('')+'</div>';else h+=`<div class="fb ok"><div class="h">${T('ok')}</div></div>`}else h+=g?`<div class="fb ok"><div class="h">${T('ok')}</div></div>`:expl(it)}
 const last=S.i==n-1;h+=`<div class="nav">`+(S.prac&&it.t=='mt'&&!it.done?`<button class="go sec" onclick="S.items[S.i].done=1;render()">${T('chk')}</button>`:'')+`<button class="go" onclick="nxt()">${T(last?'fin':'next')}</button></div>`;
 app.innerHTML=h;window.scrollTo(0,0)}
function exitView(){app.dir=S.lang=='ar'?'rtl':'ltr';app.innerHTML=head()+`<div class="card"><h2 style="margin:0 0 12px">${T('exq')}</h2><div class="nav" style="flex-direction:column"><button class="go" onclick="S.exiting=0;render()">${T('cont')}</button><button class="go sec" onclick="S.exiting=0;S.i=S.items.length;render()">${T('part')}</button><button class="go sec exit" onclick="S.exiting=0;S.items=null;render()">${T('leave')}</button></div></div>`}
function pick(v){const it=S.items[S.i];if(S.prac&&it.done)return;it.ans=v;if(S.prac)it.done=1;render()}
function mt(side,k){const it=S.items[S.i];if(S.prac&&it.done)return;
 if(side==0){if(it.m[k]!==undefined){delete it.m[k];it.sel=null}else it.sel=it.sel===k?null:k}
 else{const o=Object.keys(it.m).find(l=>it.m[l]===k);if(o!==undefined)delete it.m[o];else if(it.sel!==null){it.m[it.sel]=k;it.sel=null}}
 render()}
function nxt(){S.i++;S.i>=S.items.length?result():qview()}
function result(){app.dir=S.lang=='ar'?'rtl':'ltr';let g=0,m=0;S.items.forEach(it=>{const p=pts(it);g+=p[0];m+=p[1]});
 const bad=S.items.filter(it=>pts(it)[0]<pts(it)[1]);
 let h=head()+`<div class="card"><div class="sub" style="text-align:center">${T('sc')}</div><div class="score">${g} / ${m}</div><div class="sub" style="text-align:center">${Math.round(g/m*100)}%${bad.length?'':' · '+T('perf')}</div></div>`;
 if(bad.length){h+=`<h3>${T('rev')} (${bad.length})</h3>`;bad.forEach(it=>{h+=`<div class="card">`;if(it.t=='mt')h+=`<div dir="ltr">`+it.p.map(p=>`<p>${esc(p[0])} → <b>${esc(p[1])}</b></p>`).join('')+'</div>';else h+=`<div class="q" style="font-size:16px">${esc(it.q)}</div>`+expl(it);h+='</div>'})}
 h+=`<div class="nav"><button class="go sec" onclick="S.items=null;render()">${T('home')}</button><button class="go" onclick="build()">${T('again')}</button></div>`;app.innerHTML=h;window.scrollTo(0,0)}
function render(){document.documentElement.lang=S.lang;if(!S.items)home();else if(S.i>=S.items.length)result();else qview()}
render();
</script></body></html>
