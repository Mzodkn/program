                    { t: "p", e: "Process: a set of logically related tasks performed to achieve a defined outcome.", a: "العملية (Process): مجموعة من المهام المرتبطة منطقياً يتم أداؤها لتحقيق نتيجة محددة." },

                    { t: "p", e: "Knowledge management is a strategy by which an organization determinedly and systematically gathers, organizes, stores, analyzes, and shares its collective knowledge and experience.", a: "إدارة المعرفة (Knowledge Management) هي استراتيجية تقوم من خلالها المؤسسة بجمع وتنظيم وتخزين وتحليل ومشاركة معرفتها وخبراتها الجماعية بشكل حازم ومنهجي." },

                    { t: "h3", e: "Hardware Components", a: "مكونات الأجهزة (Hardware Components)" },
                    { t: "p", e: "CPU (Processor): sequences and executes instructions. Memory: provides working storage area for CPU. Input/output devices: provide data and receive results. Bus: electronic circuits used to route data/instructions.", a: "وحدة المعالجة المركزية (CPU): تسلسل وتنفذ التعليمات. الذاكرة (Memory): توفر مساحة تخزين عمل للمعالج. أجهزة الإدخال/الإخراج: توفر البيانات وتستقبل النتائج. الناقل (Bus): دوائر إلكترونية لتوجيه البيانات والتعليمات." },

                    { t: "p", e: "Operating Systems (OS): controls hardware and acts as interface. Configurations: Single computer/single user, Single computer/multiple users (Server/UNIX), Multiple computers/multiple users (Network server OSs), Special-purpose.", a: "نظام التشغيل (OS): يتحكم في الأجهزة ويعمل كواجهة. تكويناته: كمبيوتر واحد/مستخدم واحد، كمبيوتر واحد/مستخدمين متعددين (UNIX)، أجهزة متعددة/مستخدمين متعددين، وأجهزة ذات غرض خاص." },
                    { t: "p", e: "Kernel is the heart of the operating system that controls the most critical processes. Common OS: Windows, Mac OS, Linux, Ubuntu. Workgroup OS: UNIX, Windows Server, Red Hat Linux, Mac OS X Server.", a: "النواة (Kernel) هي قلب نظام التشغيل وتتحكم في العمليات الحرجة. أنظمة شائعة: Windows، Mac، Linux. أنظمة مجموعات العمل: UNIX و Windows Server." },
                    { t: "alert", e: "Utility Programs help perform maintenance or correct problems. Middleware provides messaging services allowing different apps to communicate. EAI (Enterprise Application Integration) ties disparate apps together. SOA (Service-oriented architecture) uses discrete software modules for specific functions.", a: "البرامج المساعدة (Utility Programs) تساعد في أداء الصيانة أو تصحيح المشاكل. البرمجيات الوسيطة (Middleware) توفر خدمات المراسلة لتواصل التطبيقات. تكامل تطبيقات المؤسسة (EAI) يربط التطبيقات المتباينة معًا." },
                    { t: "h2", e: "Application Software", a: "البرمجيات التطبيقية (Application Software)" },
                    { t: "p", e: "Applies the power of a computer to enable people to solve problems/perform tasks. Proprietary software is one-of-a-kind designed for specific application. Off-the-shelf software is produced by vendors for common needs.", a: "تُطبق قوة الكمبيوتر لتمكين الناس من حل المشاكل. البرمجيات الاحتكارية (Proprietary software) مصممة خصيصاً لجهة معينة. البرمجيات الجاهزة (Off-the-shelf software) تنتجها شركات لتلبية احتياجات شائعة." },
                    { t: "p", e: "SaaS (Software as a service): allows businesses to subscribe to Web-delivered app software. Types: Personal (individual needs), Workgroup (teamwork), Enterprise (entire organization).", a: "البرمجيات كخدمة (SaaS): تتيح للشركات الاشتراك في تطبيقات عبر الويب. الأنواع: شخصية، مجموعات عمل، ومؤسسية (تفيد المنظمة بأكملها)." },
                    { t: "p", e: "Programming Languages: Sets of keywords, commands, symbols, and rules (Syntax) for constructing statements to communicate instructions to a computer.", a: "لغات البرمجة (Programming Languages): مجموعات من الكلمات الرئيسية، الأوامر، والرموز والقواعد (بناء الجملة - Syntax) لتوصيل التعليمات للكمبيوتر." }
                ],

                      opts: [ {e: "Off-the-shelf software", a: "البرمجيات الجاهزة", c:false}, {e: "Proprietary software", a: "البرمجيات الاحتكارية", c:true}, {e: "System software", a: "برمجيات النظام", c:false} ] }

                    { t: "p", e: "A network is a collection of interconnected computing devices that communicate to share data, resources, and services. Importance: Resource sharing, Communication, Data exchange, Internet access.", a: "الشبكة هي مجموعة من أجهزة الحوسبة المترابطة التي تتواصل لمشاركة البيانات والموارد. الأهمية: مشاركة الموارد، التواصل، تبادل البيانات، والوصول للإنترنت." },

                    { t: "h3", e: "Network Topologies", a: "الطوبولوجيا (الهياكل) للشبكات (Network Topologies)" },
                    { t: "p", e: "Topology is the physical arrangement of devices. 1) Star: all devices connect to a central hub node. Hub failure isolates network. 2) Bus: common backbone, broadcast message sent, only intended recipient processes. 3) Ring: circular fashion, packet passed to next computer. 4) Mesh: fully or partially connected devices.", a: "الطوبولوجيا هي الترتيب المادي للأجهزة. 1) النجمة (Star): جميع الأجهزة تتصل بموزع مركزي. 2) الناقل (Bus): عمود فقري مشترك. 3) الحلقة (Ring): ترتيب دائري لتمرير الحزم. 4) الشبكية (Mesh): اتصال كامل أو جزئي بين الأجهزة." },

                content: [
                    { t: "h2", e: "The Internet History & Operation", a: "تاريخ وعمل الإنترنت (The Internet History & Operation)" },
                    { t: "p", e: "Internet is a collection of connected networks maintained by ISPs. Ancestor was ARPANET (1969, US DoD), linking networks to survive local disasters. Sponsored by DARPA, shifted to academic research.", a: "الإنترنت هو مجموعة من الشبكات المتصلة التي يديرها مزودو خدمات الإنترنت (ISPs). السلف كان شبكة ARPANET (عام 1969، وزارة الدفاع الأمريكية)." },
                    { t: "p", e: "Communications companies (NSPs like Verizon, AT&T) connected their networks. The Internet Protocol (IP) enables routing traffic. Internet backbone consists of high-speed links (fiber-optic). Data is transmitted in chunks called packets. TCP (Transmission Control Protocol) is the best known protocol used with IP.", a: "بروتوكول الإنترنت (IP) يُمكّن توجيه حركة المرور. العمود الفقري للإنترنت (Internet backbone) يتكون من روابط عالية السرعة. تُنقل البيانات في قطع تسمى الحزم (Packets). بروتوكول TCP هو الأكثر شهرة." },
                    { t: "p", e: "Each computer has an IP address. Domain Name System (DNS) maps words (e.g., yahoo.com) to IP addresses.", a: "كل كمبيوتر لديه عنوان IP. نظام أسماء النطاقات (DNS) يربط الكلمات (مثل yahoo.com) بعناوين IP." },
                    { t: "h3", e: "Accessing the Internet", a: "الوصول إلى الإنترنت (Accessing the Internet)" },
                    { t: "alert", e: "1) Via LAN Server (businesses use a router on LAN). 2) Via ISPs (companies/residences without direct connections). 3) Wireless Connection (Wi-Fi in public spaces).", a: "طرق الوصول: 1) عبر خادم الشبكة المحلية (LAN). 2) عبر مزودي خدمة الإنترنت (ISPs). 3) الاتصال اللاسلكي (Wi-Fi)." },
                    { t: "h2", e: "The World Wide Web (WWW)", a: "الشبكة العنكبوتية العالمية (WWW)" },
                    { t: "p", e: "Developed by Tim Berners-Lee at CERN. Combined internet tech with hypertext (linked documents). Hyperlink: clicked text/graphics that opens related content. Hypertext is transferred using HTTP. URL (Uniform Resource Locator) specifies exact location.", a: "تم تطويرها بواسطة Tim Berners-Lee في CERN. تجمع بين الإنترنت والنص التشعبي (Hypertext). الارتباط التشعبي (Hyperlink) يفتح محتوى ذي صلة. يتم النقل باستخدام بروتوكول HTTP. عنوان URL يحدد الموقع الدقيق." },
                    { t: "p", e: "Affiliations: .com (business), .edu (education), .gov (government), .net (networking), .org (nonprofit).", a: "الامتدادات: com. للأعمال، edu. للتعليم، gov. للحكومة، org. للمنظمات غير الربحية." },
                    { t: "p", e: "Website: stored data freely accessed. Web browser: client software. Cookies: hidden info stored on hard disk. Internet cache: saved copy of info. FTP (File Transfer Protocol): transferring data over internet.", a: "الموقع الإلكتروني: بيانات مخزنة يمكن الوصول إليها. متصفح الويب: برنامج العميل. ملفات تعريف الارتباط (Cookies): معلومات مخفية تُحفظ على القرص الصلب. ذاكرة التخزين المؤقت للإنترنت (Cache): نسخة محفوظة من المعلومات. بروتوكول FTP: لنقل الملفات." }

                    { t: "p", e: "E-commerce involves electronic business transactions between companies (B2B), companies & consumers (B2C), consumers (C2C), and public sector. M-commerce uses mobile/wireless devices to conduct business.", a: "تتضمن التجارة الإلكترونية (E-commerce) المعاملات بين الشركات (B2B)، الشركات والمستهلكين (B2C)، والمستهلكين (C2C). التجارة المتنقلة (M-commerce) تستخدم الأجهزة المحمولة/اللاسلكية لإجراء الأعمال." },
                    { t: "p", e: "E-business goes beyond e-commerce/e-procurement by using info systems for accounting, finance, marketing, and HR activities.", a: "الأعمال الإلكترونية (E-business) تتجاوز التجارة الإلكترونية لتشمل أنظمة المحاسبة، التمويل، التسويق، والموارد البشرية." },

                    { t: "p", e: "Enterprise Resource Planning (ERP): set of integrated programs managing vital operations for an entire multisite, global organization (customer service, HR, sales). Benefits: easing adoption of improved work processes, increasing access to timely data.", a: "تخطيط موارد المؤسسة (ERP): مجموعة من البرامج المتكاملة تدير العمليات الحيوية لمؤسسة عالمية متعددة المواقع. الفوائد: تسهيل تبني عمليات عمل محسنة وزيادة الوصول للبيانات في الوقت المناسب." },

                quiz: [
                    { q: { e: "Which system helps an organization 'do things right' by providing routine standard reports?", a: "أي نظام يساعد المؤسسة على 'القيام بالأشياء بشكل صحيح' من خلال توفير تقارير قياسية روتينية؟" },
                      opts: [ {e: "DSS", a: "نظم دعم القرار", c:false}, {e: "MIS", a: "نظم المعلومات الإدارية", c:true}, {e: "AI", a: "الذكاء الاصطناعي", c:false}, {e: "KMS", a: "نظام إدارة المعرفة", c:false} ] },
                    { q: { e: "Which system integrates and manages vital business operations for an entire multisite global organization?", a: "أي نظام يدمج ويدير العمليات التجارية الحيوية لمؤسسة عالمية بأكملها؟" },
                      opts: [ {e: "ERP", a: "تخطيط موارد المؤسسة", c:true}, {e: "TPS", a: "نظم معالجة المعاملات", c:false}, {e: "DSS", a: "نظم دعم القرار", c:false} ] }
                ]
            },
            {
                id: 8,
                tE: "Lecture 8: Business Intelligence and Analytics",
                tA: "المحاضرة 8: ذكاء الأعمال والتحليلات (Business Intelligence and Analytics)",
                content: [
                    { t: "h2", e: "Business Intelligence and Analytics", a: "ذكاء الأعمال والتحليلات (Business Intelligence and Analytics)" },
                    { t: "p", e: "Business analytics is the extensive use of data/quantitative analysis to support fact-based decision making. Used to understand performance, reveal patterns, optimize ops, and forecast.", a: "تحليلات الأعمال هي الاستخدام المكثف للبيانات والتحليل الكمي لدعم اتخاذ القرار القائم على الحقائق. تُستخدم لفهم الأداء، كشف الأنماط، تحسين العمليات، والتنبؤ." },
                    { t: "p", e: "Business intelligence (BI): applications, practices, tech for extraction, transformation, integration, visualization, analysis, interpretation, presentation of data. Data is pulled into data warehouses, data marts, data lakes. Goal is to get value and present results easily to laymen.", a: "ذكاء الأعمال (BI): تطبيقات وتقنيات لاستخراج وتحويل ودمج وتصور وتحليل البيانات. تُسحب البيانات إلى مستودعات وبحيرات البيانات. الهدف هو الحصول على قيمة وعرض النتائج بسهولة لغير المختصين." },
                    { t: "h3", e: "Benefits Achieved from BI and Analytics", a: "الفوائد المحققة من ذكاء الأعمال والتحليلات" },
                    { t: "table",
                      he: ["Benefit", "Example Case"], ha: ["الفائدة (Benefit)", "مثال الحالة (Example Case)"],
                      r: [
                          [{e: "Detect fraud", a: "كشف الاحتيال"}, {e: "MetLife used analytical software to help its unit identify medical provider/attorney/repair shop fraud.", a: "استخدمت MetLife برامج تحليلية لمساعدة وحدتها في تحديد الاحتيال."}],
                          [{e: "Improve forecasting", a: "تحسين التنبؤ"}, {e: "Kroger developed inventory management, reducing out-of-stock by 1.5M/yr, increasing sales by $80M/yr.", a: "طورت Kroger نظام إدارة المخزون، مما قلل نفاد المخزون وزاد المبيعات بمقدار 80 مليون دولار."}],
                          [{e: "Increase Sales", a: "زيادة المبيعات"}, {e: "DaimlerChrysler implemented price-elasticity model, generating additional annual sales of $500M.", a: "طبقت DaimlerChrysler نموذج مرونة السعر، مما أدى إلى مبيعات إضافية بـ 500 مليون دولار."}],
                          [{e: "Reduce costs", a: "تقليل التكاليف"}, {e: "Coca-Cola Enterprises implemented vehicle-routing optimization, saving $45M a year.", a: "نفذت شركة Coca-Cola تحسين توجيه المركبات، ووفرت 45 مليون دولار سنوياً."}]
                      ]
                    },
                    { t: "h2", e: "The Role of a Data Scientist", a: "دور عالم البيانات (The Role of a Data Scientist)" },
                    { t: "p", e: "Combine strong business acumen, deep understanding of analytics, and appreciation of limitations of data/tools. Inquisitive, perform 'what-if' analysis, challenge assumptions. Requires mastery of stats, math, programming (Hadoop, Hive, SQL, Python, R, Java).", a: "يجمعون بين الفطنة التجارية القوية والفهم العميق للتحليلات وتقدير قيود البيانات/الأدوات. هم فضوليون، يجرون تحليلات 'ماذا لو'، ويتحدون الافتراضات. يتطلب ذلك إتقان الإحصاء، الرياضيات، والبرمجة (Hadoop, SQL, Python)." },
                    { t: "h3", e: "Components for Effective BI & Tools", a: "مكونات وأدوات ذكاء الأعمال الفعالة" },
                    { t: "alert", e: "Components: Solid data management program (data governance), Creative data scientists, Strong commitment to data-driven decision making from management.", a: "المكونات: برنامج إدارة بيانات قوي (حوكمة البيانات)، علماء بيانات مبدعون، التزام قوي من الإدارة باتخاذ القرارات بناءً على البيانات." },
                    { t: "p", e: "BI Tools: Spreadsheets, Reporting and Querying Tools, Data Visualization Tools, Online Analytical Processing (OLAP), Data Mining, Dashboards.", a: "أدوات ذكاء الأعمال: جداول البيانات، أدوات التقارير والاستعلام، أدوات تصور البيانات، المعالجة التحليلية عبر الإنترنت (OLAP)، التنقيب في البيانات، ولوحات المعلومات." }
                ],
                quiz: [
                    { q: { e: "What is the role of Data Governance and management commitment in Business Intelligence?", a: "ما هو دور حوكمة البيانات والتزام الإدارة في ذكاء الأعمال؟" },
                      opts: [ {e: "They are required components for effective BI and analytics.", a: "إنها مكونات مطلوبة لذكاء الأعمال والتحليلات الفعالة.", c:true}, {e: "They are exclusively used to detect fraud.", a: "تُستخدم حصرياً لكشف الاحتيال.", c:false} ] },
                    { q: { e: "Which skill is rigorously required for a data scientist?", a: "أي مهارة مطلوبة بشدة لعالم البيانات؟" },
                      opts: [ {e: "Hardware assembly", a: "تجميع الأجهزة", c:false}, {e: "Mastery of statistics, math, and programming", a: "إتقان الإحصاء والرياضيات والبرمجة", c:true}, {e: "Telephony management", a: "إدارة الاتصالات الهاتفية", c:false} ] }
                ]
            }
        ];

        const glossary = [
            { e: "Alphanumeric Data", a: "بيانات أبجدية رقمية" },
            { e: "Data Governance", a: "حوكمة البيانات" },
            { e: "Data Lake", a: "بحيرة البيانات" },
            { e: "Database Management System (DBMS)", a: "نظام إدارة قواعد البيانات" },
            { e: "Enterprise Application Integration (EAI)", a: "تكامل تطبيقات المؤسسة" },
            { e: "E-procurement", a: "المشتريات الإلكترونية" },
            { e: "Hypervisor", a: "مراقب الأجهزة الافتراضية" },
            { e: "Information System (IS)", a: "نظام المعلومات" },
            { e: "Local Area Network (LAN)", a: "شبكة منطقة محلية" },
            { e: "Packet", a: "حزمة بيانات" },
            { e: "Primary Key", a: "المفتاح الأساسي" },
            { e: "Service-Oriented Architecture (SOA)", a: "بنية موجهة للخدمات" },
            { e: "Virtualization", a: "الافتراضية" }
        ];

        let currentLang = 'en';
        let currentModule = 1;

        // Safely construct citation regex via string concatenation to prevent the platform from truncating it
        const marker = "\\[" + "cite: \\d+\\]";
        const citeRegex = new RegExp(marker, "g");
        
        const sanitize = (text) => {
            if (!text) return '';
            return text.replace(citeRegex, '').trim();
        };

        function closeMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth < 768 && sidebar.classList.contains('flex')) {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('flex');
            }
        }

        document.getElementById('closeSidebar').addEventListener('click', closeMobileSidebar);

        function renderSidebar() {
            const navLinks = document.getElementById('navLinks');
            navLinks.innerHTML = '';
            courseData.forEach(mod => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 mb-2 rounded transition-colors text-sm font-semibold ${currentModule === mod.id ? 'bg-brand-500 text-white' : 'text-dark-muted hover:bg-dark-elevated hover:text-white'}`;
                btn.innerText = currentLang === 'en' ? mod.tE : mod.tA;
                btn.onclick = () => { 
                    currentModule = mod.id; 
                    renderContent(); 
                    renderSidebar(); 
                    closeMobileSidebar(); 
                };
                navLinks.appendChild(btn);
            });

            const glossBtn = document.createElement('button');
            glossBtn.className = `w-full text-left p-3 mt-4 border-t border-dark-border transition-colors text-sm font-semibold ${currentModule === 'glossary' ? 'bg-brand-500 text-white' : 'text-brand-500 hover:bg-dark-elevated'}`;
            glossBtn.innerText = currentLang === 'en' ? "Glossary" : "قاموس المصطلحات (Glossary)";
            glossBtn.onclick = () => { 
                currentModule = 'glossary'; 
                renderContent(); 
                renderSidebar(); 
                closeMobileSidebar(); 
            };
            navLinks.appendChild(glossBtn);
        }

        function renderContent() {
            const contentArea = document.getElementById('contentArea');
            const moduleTitle = document.getElementById('moduleTitle');
            contentArea.innerHTML = '';

            if (currentModule === 'glossary') {
                moduleTitle.innerText = currentLang === 'en' ? "Glossary" : "قاموس المصطلحات (Glossary)";
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';
                glossary.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-dark-elevated border border-dark-border rounded-lg p-4 flex flex-col justify-center shadow-lg';
                    card.innerHTML = `<h3 class="text-brand-500 font-bold text-lg font-mono">${item.e}</h3><p class="text-white mt-1 ${currentLang === 'en' ? 'font-ar text-right' : 'font-ar'}">${item.a}</p>`;
                    grid.appendChild(card);
                });
                contentArea.appendChild(grid);
                return;
            }

            const mod = courseData.find(m => m.id === currentModule);
            moduleTitle.innerText = currentLang === 'en' ? mod.tE : mod.tA;

            mod.content.forEach(blk => {
                if (blk.t === 'table') {
                    const ths = (currentLang === 'en' ? blk.he : blk.ha).map(h => `<th class="px-4 py-3 bg-dark-elevated text-left text-brand-500 font-semibold border-b border-dark-border">${sanitize(h)}</th>`).join('');
                    const trs = blk.r.map(row => {
                        const cell1 = sanitize(currentLang === 'en' ? row[0].e : row[0].a);
                        const cell2 = sanitize(currentLang === 'en' ? row[1].e : row[1].a);
                        return `<tr class="border-b border-dark-border/50 hover:bg-dark-elevated/50 transition-colors"><td class="px-4 py-3 font-semibold text-white">${cell1}</td><td class="px-4 py-3 text-dark-muted">${cell2}</td></tr>`;
                    }).join('');
                    contentArea.innerHTML += `<div class="overflow-x-auto my-6 shadow-lg rounded-lg border border-dark-border"><table class="w-full text-sm text-left"><thead class="text-xs uppercase">${ths}</thead><tbody>${trs}</tbody></table></div>`;
                } else {
                    const text = sanitize(currentLang === 'en' ? blk.e : blk.a);
                    if (blk.t === 'h2') {
                        contentArea.innerHTML += `<h2 class="text-xl font-bold text-brand-500 mt-8 mb-4 border-b border-dark-border pb-2">${text}</h2>`;
                    } else if (blk.t === 'h3') {
                        contentArea.innerHTML += `<h3 class="text-lg font-semibold text-white mt-6 mb-3">${text}</h3>`;
                    } else if (blk.t === 'p') {
                        contentArea.innerHTML += `<p class="text-dark-muted mb-4 leading-relaxed">${text}</p>`;
                    } else if (blk.t === 'alert') {
                        contentArea.innerHTML += `<div class="bg-dark-elevated p-4 my-4 rounded alert-box shadow-md text-dark-text italic">${text}</div>`;
                    }
                }
            });

            contentArea.innerHTML += `<h2 class="text-2xl font-bold text-white mt-12 mb-6 pt-6 border-t border-dark-border">${currentLang === 'en' ? 'Module Quiz' : 'اختبار الوحدة'}</h2>`;
            const quizContainer = document.createElement('div');
            quizContainer.className = 'space-y-6';

            mod.quiz.forEach((q, qIndex) => {
                const qBox = document.createElement('div');
                qBox.className = 'bg-dark-elevated border border-dark-border rounded-lg p-6 shadow-lg';
                qBox.innerHTML = `<h3 class="text-lg font-semibold text-white mb-4">${qIndex + 1}. ${currentLang === 'en' ? q.q.e : q.q.a}</h3>`;
                
                const optContainer = document.createElement('div');
                optContainer.className = 'flex flex-col space-y-2';
                
                q.opts.forEach(opt => {
                    const optBtn = document.createElement('button');
                    optBtn.className = 'text-left px-4 py-3 rounded border border-dark-border bg-dark-surface hover:bg-dark-border transition-colors text-dark-text font-medium';
                    optBtn.innerText = currentLang === 'en' ? opt.e : opt.a;
                    optBtn.dataset.correct = opt.c;
                    optBtn.onclick = function() {
                        Array.from(optContainer.children).forEach(child => {
                            child.disabled = true;
                            child.classList.add('opacity-50', 'cursor-not-allowed');
                        });
                        this.classList.remove('opacity-50', 'bg-dark-surface', 'hover:bg-dark-border');
                        if (opt.c) {
                            this.classList.add('bg-green-600', 'text-white', 'border-green-500');
                        } else {
                            this.classList.add('bg-red-600', 'text-white', 'border-red-500');
                            Array.from(optContainer.children).forEach(child => {
                                if(child.dataset.correct === 'true') {
                                    child.classList.remove('opacity-50', 'bg-dark-surface');
                                    child.classList.add('bg-green-600/30', 'border-green-500', 'text-white', 'ring-2', 'ring-green-500');
                                }
                            });
                        }
                    };
                    optContainer.appendChild(optBtn);
                });
                qBox.appendChild(optContainer);
                quizContainer.appendChild(qBox);
            });
            contentArea.appendChild(quizContainer);
        }

        document.getElementById('langToggle').addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const body = document.body;
            const html = document.documentElement;

            if (currentLang === 'ar') {
                body.classList.remove('ltr');
                body.classList.add('rtl');
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', 'ar');
                document.getElementById('langToggle').innerText = 'English';
            } else {
                body.classList.remove('rtl');
                body.classList.add('ltr');
                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', 'en');
                document.getElementById('langToggle').innerText = 'عربي';
            }
            renderSidebar();
            renderContent();
        });

        document.getElementById('menuToggle').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('flex');
        });

        // Initialize App safely
        try {
            renderSidebar();
            renderContent();
        } catch (error) {
            console.error("Rendering error:", error);
            document.getElementById('contentArea').innerHTML = `<div class="text-red-500 bg-red-100 p-4 rounded border border-red-500 mt-4"><h3>Error Loading Content:</h3><p>${error.message}</p></div>`;
        }
    </script>
</body>
</html>
