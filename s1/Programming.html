int *p = &x;</pre>

                    <h4 class="font-bold text-teal-400 mb-1">Dereference Operator (*)</h4>

int x = 10;

  <div class="relative w-full h-[480px] bg-[#0f172a] overflow-hidden">
    <iframe 
      src="https://onecompiler.com/embed/cpp" 
      class="absolute top-0 left-0 w-full h-full border-0"
      style="color-scheme: dark;"
      loading="lazy"
      allow="accelerometer; ambient-light-sensor; camera; encrypted-media; geolocation; gyroscope; hid; microphone; midi; payment; usb; vr; xr-spatial-tracking"
      sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts">
    </iframe>
  </div>
</div>
          `,
          ar: `
            <div class="space-y-6 flex flex-col h-full min-h-[600px]">
              <h1 class="text-2xl font-bold text-white mb-2">مترجم C++ التفاعلي</h1>
              <p class="text-sm text-gray-300 mb-2">اكتب، وترجم، وشغل أمثلة C++ الخاصة بك من المحاضرات بشكل تفاعلي هنا في المتصفح مباشرة.</p>
              
              <div class="flex-1 w-full rounded-xl overflow-hidden border-2 border-dark-border bg-dark-base relative shadow-lg h-[500px]">
                <iframe src="https://onecompiler.com/embed/cpp" width="100%" height="100%" style="border:0;" title="C++ Compiler"></iframe>
              </div>
            </div>
          `
        },
        quizzes: null
      }
    ];

    // ================= APPLICATION STATE & CONTROLLER =================
    let currentLang = 'en'; 
    let currentIndex = 0;

    const moduleList = document.getElementById('moduleList');
    const contentArea = document.getElementById('contentArea');
    const lectureNumber = document.getElementById('lectureNumber');
    const quizSection = document.getElementById('quizSection');
    const quizContainer = document.getElementById('quizContainer');
    const langToggle = document.getElementById('langToggle');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');

    function renderNav() {
      moduleList.innerHTML = '';
      courseData.forEach((mod, index) => {
        const btn = document.createElement('button');
        btn.className = `w-full text-start px-3 py-2.5 rounded-lg text-sm transition-all flex flex-col gap-0.5 ${
          index === currentIndex ? 'nav-active' : 'text-dark-muted hover:bg-dark-elevated hover:text-white'
        }`;
        
        btn.innerHTML = `
          <span class="text-xs opacity-75 font-mono">${cleanText(mod.number)}</span>
          <span class="truncate font-medium">${cleanText(mod.title[currentLang])}</span>
        `;
        
        btn.onclick = () => { 
          currentIndex = index;
          renderAll();
          if (window.innerWidth < 768) {
            sidebar.classList.add('hidden');
          }
        };
        moduleList.appendChild(btn);
      });
    }

    function renderContent() {
      const data = courseData[currentIndex];
      
      lectureNumber.textContent = `${cleanText(data.number)}`;
      contentArea.innerHTML = cleanText(data.content[currentLang]);
      
      // Render Multiple Quizzes if available
      if (data.quizzes && data.quizzes.length > 0) {
        quizSection.style.display = 'block';
        quizContainer.innerHTML = '';
        
        data.quizzes.forEach((qItem, qIdx) => {
          const qBox = document.createElement('div');
          qBox.className = "bg-dark-elevated rounded-xl p-5 border border-dark-border space-y-3";
          
          const qTitle = document.createElement('p');
          qTitle.className = "font-bold text-white text-sm sm:text-base";
          qTitle.innerHTML = `${qIdx + 1}. ${cleanText(qItem.q[currentLang])}`;
          qBox.appendChild(qTitle);
          
          const optsWrapper = document.createElement('div');
          optsWrapper.className = "space-y-2";
          
          qItem.options[currentLang].forEach((opt, optIdx) => {
            const btn = document.createElement('button');
            btn.className = "w-full text-start p-3 bg-dark-surface border border-dark-border rounded-lg hover:border-brand-500 hover:bg-dark-base transition flex items-center justify-between text-sm text-gray-300";
            btn.innerHTML = `<span>${cleanText(opt)}</span><span class="w-4 h-4 rounded-full border border-dark-border inline-block shrink-0 ms-4"></span>`;
            
            btn.onclick = () => {
              // Lock buttons for this question
              Array.from(optsWrapper.children).forEach(c => {
                c.disabled = true;
                c.classList.add('cursor-not-allowed', 'opacity-70');
              });
              
              if (optIdx === qItem.answer) {
                btn.classList.remove('opacity-70');
                btn.classList.add('border-green-500', 'bg-green-500/10', 'text-green-400');
                btn.querySelector('span:last-child').outerHTML = `<span class="text-green-400 font-bold shrink-0 ms-4">✔</span>`;
              } else {
                btn.classList.remove('opacity-70');
                btn.classList.add('border-red-500', 'bg-red-500/10', 'text-red-400');
                btn.querySelector('span:last-child').outerHTML = `<span class="text-red-400 font-bold shrink-0 ms-4">✖</span>`;
                
                // Highlight correct option
                const correctBtn = optsWrapper.children[qItem.answer];
                correctBtn.classList.remove('opacity-70');
                correctBtn.classList.add('border-green-500', 'bg-green-500/10', 'text-green-400');
                correctBtn.querySelector('span:last-child').outerHTML = `<span class="text-green-400 font-bold shrink-0 ms-4">✔</span>`;
              }
            };
            optsWrapper.appendChild(btn);
          });
          
          qBox.appendChild(optsWrapper);
          quizContainer.appendChild(qBox);
        });
      } else {
        quizSection.style.display = 'none';
      }

      // Handle Navigation Buttons State
      prevBtn.style.opacity = currentIndex === 0 ? '0.4' : '1';
      prevBtn.style.cursor = currentIndex === 0 ? 'not-allowed' : 'pointer';
      
      nextBtn.style.opacity = currentIndex === courseData.length - 1 ? '0.4' : '1';
      nextBtn.style.cursor = currentIndex === courseData.length - 1 ? 'not-allowed' : 'pointer';
    }

    function renderAll() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      
      langToggle.textContent = currentLang === 'ar' ? 'English' : 'العربية';
      document.getElementById('navTitle').textContent = currentLang === 'ar' ? 'وحدات المنهج' : 'Course Modules';
      document.getElementById('quizTitle').textContent = currentLang === 'ar' ? 'اختبر فهمك السريع' : 'Interactive Self-Assessment';
      prevBtn.innerHTML = currentLang === 'ar' ? '&rarr; السابق' : '&larr; Previous';
      nextBtn.innerHTML = currentLang === 'ar' ? 'التالي &larr;' : 'Next &rarr;';
      
      renderNav();
      renderContent();
    }

    // ================= EVENT LISTENERS =================
    langToggle.onclick = () => { 
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      renderAll(); 
    };

    prevBtn.onclick = () => { 
      if (currentIndex > 0) {
        currentIndex--;
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } 
    };

    nextBtn.onclick = () => { 
      if (currentIndex < courseData.length - 1) {
        currentIndex++;
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } 
    };

    sidebarToggle.onclick = () => {
      sidebar.classList.toggle('hidden');
    };

    // Initialize Portal
    renderAll();
  </script>
</body>
</html>
