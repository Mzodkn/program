    function renderBlock(block) {
        const text = sanitize(block.text ? block.text[currentLang] : '');
        switch(block.type) {
            case 'heading':
                if (block.level === 2) {
                    return `<h2 class="text-2xl sm:text-3xl font-bold text-white mt-10 mb-5 border-b border-dark-border pb-3 flex items-center gap-3"><div class="w-1.5 h-8 bg-brand-500 rounded-full"></div>${text}</h2>`;
                } else {
                    return `<h3 class="text-xl font-bold text-teal-400 mt-8 mb-4">${text}</h3>`;
                }
            case 'paragraph':
                return `<p class="text-base text-gray-300 mb-5 leading-relaxed">${text}</p>`;
            case 'list':
                const items = block.items[currentLang].map(i => `<li class="relative ps-5 before:content-[''] before:absolute before:w-1.5 before:h-1.5 before:bg-brand-500 before:rounded-full before:start-0 before:top-2.5">${sanitize(i)}</li>`).join('');
                return `<ul class="mb-8 space-y-3 text-base text-gray-300 bg-dark-elevated p-6 rounded-xl border border-dark-border shadow-sm">${items}</ul>`;
            case 'alert':
                return `<div class="p-5 rounded-xl border-s-4 border-brand-500 bg-brand-500/10 text-base mb-8 text-brand-50 font-medium leading-relaxed shadow-sm">${text}</div>`;
            case 'table':
                const headers = block.headers[currentLang].map(h => `<th class="p-4 bg-dark-elevated text-brand-500 border-b border-dark-border font-bold uppercase tracking-wider text-xs">${sanitize(h)}</th>`).join('');
                const rows = block.rows.map(r => `<tr class="hover:bg-dark-elevated/40 transition-colors">${r[currentLang].map(c => `<td class="p-4 border-b border-dark-border/50 text-gray-200">${sanitize(c)}</td>`).join('')}</tr>`).join('');
                return `<div class="overflow-x-auto border border-dark-border rounded-xl mb-8 shadow-md"><table class="w-full text-start text-sm"><thead class="text-left">${headers}</thead><tbody class="divide-y divide-dark-border bg-dark-surface">${rows}</tbody></table></div>`;
            default:
                return '';
        }
    }

    function renderContent() {
      const data = courseData[currentIndex];
      lectureNumber.textContent = `${data.number}`;
      contentArea.innerHTML = '';

      if (data.id === 'glossary') {
        let html = `<h2 class="text-2xl sm:text-3xl font-bold text-white mt-4 mb-8 border-b border-dark-border pb-3 flex items-center gap-3"><div class="w-1.5 h-8 bg-brand-500 rounded-full"></div>${sanitize(data.title[currentLang])}</h2>`;
        html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">`;
        glossaryData.forEach(item => {
            html += `<div class="bg-dark-elevated p-5 rounded-xl border border-dark-border flex flex-col shadow-sm hover:border-brand-500/50 transition-colors">
                <strong class="text-brand-500 font-mono text-lg mb-2">${sanitize(item.en)}</strong>
                <span class="text-white font-medium text-lg ${currentLang === 'en' ? 'font-cairo text-right' : 'font-cairo'}">${sanitize(item.ar)}</span>
            </div>`;
        });
        html += `</div>`;
        contentArea.innerHTML = html;
      } else {
        data.content.forEach(block => {
            contentArea.innerHTML += renderBlock(block);
        });
      }
      
      // Handle Quiz Render
      if (data.quiz && data.quiz.length > 0) {
        quizSection.classList.remove('hidden');
        quizContainer.innerHTML = '';
        
        data.quiz.forEach((qData, qIdx) => {
            let qHtml = `<div class="mb-8 p-6 bg-dark-elevated rounded-xl border border-dark-border shadow-sm"><p class="font-bold text-lg text-white mb-5">${qIdx + 1}. ${sanitize(qData.q[currentLang])}</p><div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="qopts_${qIdx}"></div></div>`;
            quizContainer.insertAdjacentHTML('beforeend', qHtml);
            
            const optsContainer = document.getElementById(`qopts_${qIdx}`);
            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-start p-4 bg-dark-surface border border-dark-border rounded-xl hover:border-brand-500 hover:bg-dark-elevated transition flex items-center justify-between text-sm font-medium text-gray-200 shadow-sm";
                btn.innerHTML = `<span>${sanitize(opt.text[currentLang])}</span><span class="w-5 h-5 rounded-full border-2 border-dark-border shrink-0 flex items-center justify-center"></span>`;
                
                btn.onclick = () => {
                    Array.from(optsContainer.children).forEach(c => {
                        c.disabled = true;
                        c.classList.add('opacity-50', 'cursor-not-allowed');
                        c.classList.remove('hover:border-brand-500', 'hover:bg-dark-elevated');
                    });
                    
                    btn.classList.remove('opacity-50');
                    if (opt.correct) {
                        btn.classList.add('!border-green-500', '!bg-green-500/10', '!text-green-400');
                        btn.querySelector('span:last-child').outerHTML = `<span class="text-green-400 text-xl font-bold">✓</span>`;
                    } else {
                        btn.classList.add('!border-red-500', '!bg-red-500/10', '!text-red-400');
                        btn.querySelector('span:last-child').outerHTML = `<span class="text-red-400 text-xl font-bold">✗</span>`;
                        
                        // Find and highlight correct answer
                        const correctIdx = qData.options.findIndex(o => o.correct);
                        const correctBtn = optsContainer.children[correctIdx];
                        correctBtn.classList.remove('opacity-50');
                        correctBtn.classList.add('!border-green-500', '!bg-green-500/10', '!text-green-400', 'ring-2', 'ring-green-500/50');
                        correctBtn.querySelector('span:last-child').outerHTML = `<span class="text-green-400 text-xl font-bold">✓</span>`;
                    }
                };
                optsContainer.appendChild(btn);
            });
        });
      } else {
        quizSection.classList.add('hidden');
      }

      // Handle Buttons State
      prevBtn.style.opacity = currentIndex === 0 ? '0.4' : '1';
      prevBtn.style.cursor = currentIndex === 0 ? 'not-allowed' : 'pointer';
      
      nextBtn.style.opacity = currentIndex === courseData.length - 1 ? '0.4' : '1';
      nextBtn.style.cursor = currentIndex === courseData.length - 1 ? 'not-allowed' : 'pointer';
    }

    function renderAll() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      
      document.getElementById('langText').textContent = currentLang === 'ar' ? 'English' : 'العربية';
      document.getElementById('headerTitle').textContent = currentLang === 'ar' ? 'مقدمة في الإنجليزية التقنية 2' : 'Technical English II';
      document.getElementById('navTitle').textContent = currentLang === 'ar' ? 'وحدات المنهج' : 'Modules';
      document.getElementById('quizTitle').textContent = currentLang === 'ar' ? 'اختبر فهمك' : 'Interactive Quiz';
      prevBtn.innerHTML = currentLang === 'ar' ? '&rarr; السابق' : '&larr; Previous';
      nextBtn.innerHTML = currentLang === 'ar' ? 'التالي &larr;' : 'Next &rarr;';
      
      renderNav();
      renderContent();
    }

    // ================= EVENTS =================
    langToggle.onclick = () => { 
      currentLang = currentLang === 'ar' ? 'en' : 'ar'; 
      renderAll(); 
    };

    prevBtn.onclick = () => { 
      if (currentIndex > 0) { 
        currentIndex--; 
        renderAll(); 
        window.scrollTo({top: 0, behavior: 'smooth'}); 
      } 
    };

    nextBtn.onclick = () => { 
      if (currentIndex < courseData.length - 1) { 
        currentIndex++; 
        renderAll(); 
        window.scrollTo({top: 0, behavior: 'smooth'}); 
      } 
    };

    document.getElementById('sidebarToggle').onclick = () => {
      sidebar.classList.toggle('hidden');
    };

    // Initialize the app safely
    try {
        renderAll();
    } catch (error) {
        console.error("Rendering error:", error);
        document.getElementById('contentArea').innerHTML = `<div class="text-red-500 bg-red-500/10 p-4 rounded-xl border border-red-500 mt-4 font-mono text-sm"><h3>Error Loading Content:</h3><p>${error.message}</p></div>`;
    }
  </script>
</body>
</html>
