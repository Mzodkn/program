                        { termEn: "Sole Proprietorship", termAr: "الملكية الفردية (شركة يملكها شخص واحد)" },
                        { termEn: "Partnership", termAr: "الشراكة (شركة يملكها شخصان أو أكثر)" },
                        { termEn: "Corporation", termAr: "الشركة المساهمة (كيان قانوني منفصل يمثله أسهم)" },
                        { termEn: "Limited Liability Company (LLC)", termAr: "الشركة ذات المسؤولية المحدودة (هيكل هجين يحمي الأصول الشخصية)" },
                        { termEn: "Liability", termAr: "المسؤولية القانونية / الالتزام" },
                        { termEn: "Business Ethics", termAr: "أخلاقيات الأعمال (المبادئ المعيارية للسلوك)" },
                        { termEn: "Corporate Social Responsibility (CSR)", termAr: "المسؤولية الاجتماعية للشركات" },
                        { termEn: "Globalization", termAr: "العولمة (تكامل وترابط الأسواق عالمياً)" },
                        { termEn: "Multinational Company (MNC)", termAr: "الشركة متعددة الجنسيات" },
                        { termEn: "Exports", termAr: "الصادرات (السلع المباعة للخارج)" },
                        { termEn: "Imports", termAr: "الواردات (السلع المستوردة من الخارج)" },
                        { termEn: "Entrepreneur", termAr: "رائد الأعمال" },
                        { termEn: "Startup", termAr: "الشركة الناشئة (شركة حديثة قابلة للتوسع)" },
                        { termEn: "Management", termAr: "الإدارة (التخطيط والتنظيم والقيادة والرقابة)" },
                        { termEn: "Human Resource Management (HRM)", termAr: "إدارة الموارد البشرية" },
                        { termEn: "Marketing Mix (4Ps)", termAr: "المزيج التسويقي (المنتج، السعر، المكان، الترويج)" },
                        { termEn: "Operations Management", termAr: "إدارة العمليات" },
                        { termEn: "Supply Chain", termAr: "سلسلة الإمداد" },
                        { termEn: "Accounting", termAr: "المحاسبة (تسجيل وتقديم التقارير المالية)" },
                        { termEn: "Balance Sheet", termAr: "الميزانية العمومية (الأصول = الالتزامات + حقوق الملكية)" },
                        { termEn: "Income Statement", termAr: "قائمة الدخل (تظهر الإيرادات والمصروفات والربح)" },
                        { termEn: "Cybersecurity", termAr: "الأمن السيبراني (حماية الأنظمة والبيانات)" },
                        { termEn: "Digital Transformation", termAr: "التحول الرقمي" }
                    ]
                }
            ]
        };

        // Application State
        let currentLang = 'en';
        let currentLectureId = 1;
        const quizStates = {}; // Tracks selected quiz answers

        // Helper to strip citation markers if any exist in data strings
        function cleanText(text) {
            if (!text) return '';
            return text.replace(/\+\]/g, '').trim();
        }

        // Translation dictionary for UI chrome
        const uiStrings = {
            en: {
                header_title: "Introduction to Business",
                navigation: "Navigation",
                lecture: "Lecture",
                objectives: "Learning Objectives",
                quiz: "Self-Assessment Quiz",
                checkAnswer: "Check Answer",
                correct: "Correct!",
                incorrect: "Incorrect. Try again or check the lecture notes.",
                glossaryTitle: "Glossary / قاموس المصطلحات",
                term: "Term / Concept",
                translation: "Arabic Translation / الشرح بالعربية",
                searchPlaceholder: "Search terms..."
            },
            ar: {
                header_title: "مقدمة في إدارة الأعمال",
                navigation: "التنقل بين المحاضرات",
                lecture: "المحاضرة",
                objectives: "أهداف التعلم",
                quiz: "اختبار ذاتي للتقييم",
                checkAnswer: "تحقق من الإجابة",
                correct: "إجابة صحيحة!",
                incorrect: "إجابة غير صحيحة. حاول مرة أخرى أو راجع محتوى المحاضرة.",
                glossaryTitle: "قاموس المصطلحات / Glossary",
                term: "المصطلح / المفهُوم",
                translation: "الترجمة بالعربية / الشرح",
                searchPlaceholder: "البحث عن مصطلح..."
            }
        };

        // Render Sidebar Navigation
        function renderNavigation() {
            const navList = document.getElementById('nav-list');
            navList.innerHTML = '';

            courseData.lectures.forEach(lec => {
                const isSelected = lec.id === currentLectureId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left rtl:text-right px-4 py-3 rounded-xl transition-all duration-200 flex items-center space-x-3 rtl:space-x-reverse font-medium text-sm ${
                    isSelected 
                        ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/20' 
                        : 'text-dark-muted hover:bg-dark-elevated hover:text-dark-text'
                }`;
                
                const titleText = currentLang === 'ar' ? lec.titleAr : lec.titleEn;
                btn.innerHTML = `
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    <span class="truncate">${cleanText(titleText)}</span>
                `;

                btn.onclick = () => {
                    currentLectureId = lec.id;
                    renderApp();
                    // Close mobile sidebar if open
                    document.getElementById('sidebar').classList.add('-translate-x-full', 'rtl:translate-x-full');
                    document.getElementById('sidebar-backdrop').classList.add('hidden');
                };

                navList.appendChild(btn);
            });
        }

        // Render Main Content Area
        function renderContent() {
            const mainContent = document.getElementById('main-content');
            const lecture = courseData.lectures.find(l => l.id === currentLectureId);

            if (!lecture) return;

            let html = '';

            if (lecture.isGlossary) {
                // Render Glossary Page
                const title = currentLang === 'ar' ? lecture.titleAr : lecture.titleEn;
                html += `
                    <div class="max-w-4xl mx-auto space-y-6 animate-fadeIn">
                        <div class="bg-dark-surface border border-dark-border rounded-2xl p-6 lg:p-8 shadow-xl">
                            <h2 class="text-2xl lg:text-3xl font-bold text-brand-500 mb-4">${cleanText(title)}</h2>
                            <p class="text-dark-muted mb-6">${currentLang === 'ar' ? 'قائمة شاملة بجميع المصطلحات التقنية والاقتصادية الواردة في المادة العلمية مع ترجمتها الدقيقة.' : 'Comprehensive glossary of technical and economic terms extracted from the course material.'}</p>
                            
                            <div class="mb-6">
                                <input type="text" id="glossary-search" placeholder="${uiStrings[currentLang].searchPlaceholder}" class="w-full bg-dark-elevated border border-dark-border rounded-xl px-4 py-3 text-dark-text focus:outline-none focus:border-brand-500 transition-colors">
                            </div>

                            <div class="overflow-x-auto rounded-xl border border-dark-border">
                                <table class="w-full text-left rtl:text-right border-collapse">
                                    <thead>
                                        <tr class="bg-dark-elevated border-b border-dark-border text-xs uppercase tracking-wider text-dark-muted">
                                            <th class="p-4 font-semibold">${uiStrings[currentLang].term}</th>
                                            <th class="p-4 font-semibold">${uiStrings[currentLang].translation}</th>
                                        </tr>
                                    </thead>
                                    <tbody id="glossary-tbody" class="divide-y divide-dark-border font-mono text-sm">
                `;

                lecture.terms.forEach(item => {
                    html += `
                        <tr class="hover:bg-dark-elevated/55 transition-colors">
                            <td class="p-4 text-brand-500 font-semibold">${cleanText(item.termEn)}</td>
                            <td class="p-4 text-dark-text">${cleanText(item.termAr)}</td>
                        </tr>
                    `;
                });

                html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // Render Standard Lecture
                const title = currentLang === 'ar' ? lecture.titleAr : lecture.titleEn;
                html += `
                    <div class="max-w-4xl mx-auto space-y-8 animate-fadeIn">
                        <!-- Title Card -->
                        <div class="bg-dark-surface border border-dark-border rounded-2xl p-6 lg:p-8 shadow-xl">
                            <h2 class="text-2xl lg:text-3xl font-bold text-brand-500 mb-6">${cleanText(title)}</h2>
                            
                            <!-- Objectives Box -->
                            <div class="bg-dark-elevated border-l-4 rtl:border-r-4 rtl:border-l-0 border-brand-500 rounded-r-xl rtl:rounded-r-none rtl:rounded-l-xl p-5 mb-8">
                                <h3 class="font-bold text-lg text-dark-text mb-3 flex items-center">
                                    <svg class="w-5 h-5 mr-2 rtl:ml-2 rtl:mr-0 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    ${uiStrings[currentLang].objectives}
                                </h3>
                                <ul class="space-y-2 text-dark-muted text-sm lg:text-base">
                `;

                lecture.objectives.forEach(obj => {
                    const objText = currentLang === 'ar' ? obj.ar : obj.en;
                    html += `<li class="flex items-start"><span class="text-brand-500 mr-2 rtl:ml-2 rtl:mr-0">•</span><span>${cleanText(objText)}</span></li>`;
                });

                html += `
                                </ul>
                            </div>

                            <!-- Sections Content -->
                            <div class="space-y-6">
                `;

                lecture.sections.forEach(sec => {
                    if (sec.type === 'heading') {
                        const secTitle = currentLang === 'ar' ? sec.contentAr : sec.contentEn;
                        html += `<h3 class="text-xl font-bold text-dark-text pt-4 border-b border-dark-border pb-2">${cleanText(secTitle)}</h3>`;
                    } else if (sec.type === 'paragraph') {
                        const pText = currentLang === 'ar' ? sec.contentAr : sec.contentEn;
                        html += `<p class="text-dark-muted leading-relaxed text-base">${cleanText(pText)}</p>`;
                    } else if (sec.type === 'list') {
                        html += `<ul class="space-y-3 my-4">`;
                        sec.items.forEach(li => {
                            const liText = currentLang === 'ar' ? li.ar : li.en;
                            html += `
                                <li class="bg-dark-elevated p-4 rounded-xl border border-dark-border flex items-start text-dark-text">
                                    <span class="text-brand-500 mr-3 rtl:ml-3 rtl:mr-0 font-bold">•</span>
                                    <span class="leading-relaxed">${cleanText(liText)}</span>
                                </li>
                            `;
                        });
                        html += `</ul>`;
                    } else if (sec.type === 'table') {
                        html += `
                            <div class="overflow-x-auto my-6 rounded-xl border border-dark-border">
                                <table class="w-full text-left rtl:text-right border-collapse">
                                    <thead>
                                        <tr class="bg-dark-elevated border-b border-dark-border text-xs uppercase tracking-wider text-dark-muted">
                        `;
                        sec.headers.forEach(h => {
                            html += `<th class="p-4 font-semibold">${cleanText(h)}</th>`;
                        });
                        html += `</tr></thead><tbody class="divide-y divide-dark-border text-sm">`;
                        sec.rows.forEach(row => {
                            html += `<tr class="hover:bg-dark-elevated/50 transition-colors">`;
                            row.cellList ? row.cellList.forEach(c => html += `<td class="p-4 text-dark-text">${cleanText(c)}</td>`) : row.forEach(c => html += `<td class="p-4 text-dark-text">${cleanText(c)}</td>`);
                            html += `</tr>`;
                        });
                        html += `</tbody></table></div>`;
                    }
                });

                html += `
                            </div>
                        </div>

                        <!-- Interactive Quiz Section -->
                        <div class="bg-dark-surface border border-dark-border rounded-2xl p-6 lg:p-8 shadow-xl">
                            <h3 class="text-xl font-bold text-brand-500 mb-6 flex items-center">
                                <svg class="w-6 h-6 mr-2 rtl:ml-2 rtl:mr-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                ${uiStrings[currentLang].quiz}
                            </h3>
                            <div class="space-y-8">
                `;

                lecture.quiz.forEach((q, qIndex) => {
                    const qKey = `${currentLectureId}-${qIndex}`;
                    const qText = currentLang === 'ar' ? q.questionAr : q.questionEn;
                    const answeredState = quizStates[qKey]; // { selected: number, correct: boolean }

                    html += `
                        <div class="bg-dark-elevated p-6 rounded-xl border border-dark-border space-y-4">
                            <h4 class="font-semibold text-dark-text text-base">Q${qIndex + 1}: ${cleanText(qText)}</h4>
                            <div class="space-y-2" id="quiz-options-${qKey}">
                    `;

                    q.options.forEach((opt, optIndex) => {
                        const optText = currentLang === 'ar' ? opt.ar : opt.en;
                        let btnStyle = "bg-dark-surface border-dark-border text-dark-text hover:border-brand-500";
                        let disabledAttr = "";

                        if (answeredState) {
                            disabledAttr = "disabled";
                            if (optIndex === q.correct) {
                                btnStyle = "bg-emerald-900/40 border-emerald-500 text-emerald-200 font-medium";
                            } else if (answeredState.selected === optIndex) {
                                btnStyle = "bg-rose-900/40 border-rose-500 text-rose-200 font-medium";
                            } else {
                                btnStyle = "bg-dark-surface border-dark-border text-dark-muted opacity-50";
                            }
                        }

                        html += `
                            <button ${disabledAttr} onclick="handleQuizAnswer(${currentLectureId}, ${qIndex}, ${optIndex})" class="w-full text-left rtl:text-right px-4 py-3 rounded-lg border transition-all flex items-center justify-between ${btnStyle}">
                                <span>${cleanText(optText)}</span>
                            </button>
                        `;
                    });

                    html += `</div>`;

                    if (answeredState) {
                        const feedbackMsg = answeredState.correct ? uiStrings[currentLang].correct : uiStrings[currentLang].incorrect;
                        const feedbackColor = answeredState.correct ? "text-emerald-400 bg-emerald-950/30 border-emerald-800" : "text-rose-400 bg-rose-950/30 border-rose-800";
                        html += `<div class="p-3 rounded-lg border text-sm font-medium ${feedbackColor}">${feedbackMsg}</div>`;
                    }

                    html += `</div>`;
                });

                html += `
                            </div>
                        </div>
                    </div>
                `;
            }

            mainContent.innerHTML = html;

            // Bind glossary search listener if on glossary page
            if (lecture.isGlossary) {
                const searchInput = document.getElementById('glossary-search');
                if (searchInput) {
                    searchInput.oninput = (e) => {
                        const query = e.target.value.toLowerCase();
                        const rows = document.querySelectorAll('#glossary-tbody tr');
                        rows.forEach(row => {
                            const text = row.textContent.toLowerCase();
                            row.style.display = text.includes(query) ? '' : 'none';
                        });
                    };
                }
            }
        }

        // Handle Quiz Interaction
        window.handleQuizAnswer = function(lecId, qIndex, optIndex) {
            const lecture = courseData.lectures.find(l => l.id === lecId);
            const q = lecture.quiz[qIndex];
            const qKey = `${lecId}-${qIndex}`;

            quizStates[qKey] = {
                selected: optIndex,
                correct: optIndex === q.correct
            };

            renderContent();
        };

        // Render entire application
        function renderApp() {
            // Update document direction & lang
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

            // Apply font family based on language
            if (currentLang === 'ar') {
                document.body.classList.remove('font-sans');
                document.body.classList.add('font-arabic');
            } else {
                document.body.classList.remove('font-arabic');
                document.body.classList.add('font-sans');
            }

            // Update Header Title
            document.querySelector('[data-i18n="header_title"]').textContent = currentLang === 'ar' ? courseData.metadata.titleAr : courseData.metadata.titleEn;

            renderNavigation();
            renderContent();
        }

        // Event Listeners for UI controls
        document.getElementById('lang-toggle').onclick = () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            renderApp();
        };

        document.getElementById('sidebar-toggle').onclick = () => {
            document.getElementById('sidebar').classList.remove('-translate-x-full', 'rtl:translate-x-full');
            document.getElementById('sidebar-backdrop').classList.remove('hidden');
        };

        document.getElementById('sidebar-close').onclick = () => {
            document.getElementById('sidebar').classList.add('-translate-x-full', 'rtl:translate-x-full');
            document.getElementById('sidebar-backdrop').classList.add('hidden');
        };

        document.getElementById('sidebar-backdrop').onclick = () => {
            document.getElementById('sidebar').classList.add('-translate-x-full', 'rtl:translate-x-full');
            document.getElementById('sidebar-backdrop').classList.add('hidden');
        };

        // Initial render on load
        window.onload = () => {
            renderApp();
        };
    </script>
</body>
</html>
