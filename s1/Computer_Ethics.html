        let currentLang = 'en';
        let currentChapterIndex = 0;
        let isMobileMenuOpen = false;

        function stripCitations(text) {
            if (!text) return "";
            return text.replace(new RegExp('\\[' + 'cite' + ':[^\\]]+\\]', 'gi'), '').trim();
        }

        // --- Mobile Menu Logic ---
        function toggleMobileMenu() {
            isMobileMenuOpen = !isMobileMenuOpen;
            updateSidebarTransform();
        }

        function updateSidebarTransform() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            
            if (window.innerWidth >= 768) {
                // Desktop: reset transforms
                sidebar.style.transform = 'none';
                overlay.classList.add('hidden');
            } else {
                // Mobile
                if (isMobileMenuOpen) {
                    sidebar.style.transform = 'translateX(0)';
                    overlay.classList.remove('hidden');
                } else {
                    // Hide off-screen logically based on LTR/RTL
                    sidebar.style.transform = currentLang === 'ar' ? 'translateX(100%)' : 'translateX(-100%)';
                    overlay.classList.add('hidden');
                }
            }
        }
        window.addEventListener('resize', updateSidebarTransform);
        // -------------------------

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.body.className = currentLang === 'ar' ? 'font-ar h-screen flex flex-col overflow-hidden' : 'font-en h-screen flex flex-col overflow-hidden';
            
            document.getElementById('langToggle').innerText = currentLang === 'ar' ? 'English (EN)' : 'عربي (AR)';
            document.getElementById('menuTitle').innerText = currentLang === 'ar' ? 'القائمة' : 'Menu';
            
            renderSidebar();
            renderContent();
            updateSidebarTransform(); // Re-apply logical positioning for mobile off-canvas
        }

        function navigate(index) {
            currentChapterIndex = index;
            renderSidebar();
            renderContent();
            document.querySelector('main').scrollTo(0, 0);
            
            // Auto-close mobile menu upon selection
            if (isMobileMenuOpen) toggleMobileMenu();
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = '';
            rawData.forEach((ch, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 rounded-lg font-semibold transition-colors ${idx === currentChapterIndex ? 'bg-brand-600 text-white' : 'text-dark-text hover:bg-dark-elevated'}`;
                
                if (currentLang === 'ar') btn.classList.replace('text-left', 'text-right');

                btn.innerText = stripCitations(currentLang === 'en' ? ch.titleEn : ch.titleAr);
                btn.onclick = () => navigate(idx);
                nav.appendChild(btn);
            });

            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.style.display = currentChapterIndex > 0 ? 'block' : 'none';
            prevBtn.innerText = currentLang === 'en' ? 'Previous' : 'السابق';
            prevBtn.onclick = () => navigate(currentChapterIndex - 1);

            nextBtn.style.display = currentChapterIndex < rawData.length - 1 ? 'block' : 'none';
            nextBtn.innerText = currentLang === 'en' ? 'Next' : 'التالي';
            nextBtn.onclick = () => navigate(currentChapterIndex + 1);
        }

        function renderContent() {
            const area = document.getElementById('contentArea');
            const chapter = rawData[currentChapterIndex];
            area.innerHTML = '';

            const title = document.createElement('h1');
            title.className = 'text-2xl md:text-3xl font-bold text-white mb-8 pb-4 border-b border-dark-border leading-tight';
            title.innerHTML = stripCitations(currentLang === 'en' ? chapter.titleEn : chapter.titleAr);
            area.appendChild(title);

            chapter.blocks.forEach(block => {
                if (block.type === 'h2') {
                    const h2 = document.createElement('h2');
                    h2.className = 'text-xl md:text-2xl font-semibold text-brand-500 mt-8 mb-4';
                    h2.innerHTML = stripCitations(currentLang === 'en' ? block.en : block.ar);
                    area.appendChild(h2);
                } else if (block.type === 'alert') {
                    const alert = document.createElement('div');
                    alert.className = 'alert-box text-base md:text-lg leading-relaxed shadow-sm';
                    alert.innerHTML = stripCitations(currentLang === 'en' ? block.en : block.ar);
                    area.appendChild(alert);
                } else if (block.type === 'list') {
                    const card = document.createElement('div');
                    card.className = 'card shadow-lg';
                    const ul = document.createElement('ul');
                    ul.className = 'space-y-3 list-disc list-inside text-base md:text-lg leading-relaxed';
                    const items = currentLang === 'en' ? block.itemsEn : block.itemsAr;
                    items.forEach(item => {
                        const li = document.createElement('li');
                        li.innerHTML = stripCitations(item);
                        ul.appendChild(li);
                    });
                    card.appendChild(ul);
                    area.appendChild(card);
                } else if (block.type === 'table') {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'overflow-x-auto card shadow-lg p-0';
                    const table = document.createElement('table');
                    table.className = 'w-full text-left border-collapse min-w-[600px]';
                    
                    if (currentLang === 'ar') table.classList.replace('text-left', 'text-right');

                    const thead = document.createElement('thead');
                    const trHead = document.createElement('tr');
                    trHead.className = 'bg-dark-surface';
                    const headers = currentLang === 'en' ? block.headersEn : block.headersAr;
                    headers.forEach(h => {
                        const th = document.createElement('th');
                        th.className = 'p-3 md:p-4 border-b border-dark-border font-semibold text-brand-500';
                        th.innerText = stripCitations(h);
                        trHead.appendChild(th);
                    });
                    thead.appendChild(trHead);
                    table.appendChild(thead);

                    const tbody = document.createElement('tbody');
                    block.rows.forEach((row, rIdx) => {
                        const tr = document.createElement('tr');
                        tr.className = rIdx % 2 === 0 ? 'bg-dark-elevated' : 'bg-dark-base';
                        row.forEach((cell, cIdx) => {
                            const td = document.createElement('td');
                            td.className = 'p-3 md:p-4 border-b border-dark-border text-sm md:text-base';
                            if (currentLang === 'ar' && cIdx === 0) {
                                td.className += ' font-tech text-left ltr';
                                td.dir = 'ltr';
                            }
                            td.innerText = stripCitations(cell);
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    });
                    table.appendChild(tbody);
                    wrapper.appendChild(table);
                    area.appendChild(wrapper);
                }
            });

            if (chapter.quiz && chapter.quiz.length > 0) {
                const quizHeader = document.createElement('h2');
                quizHeader.className = 'text-2xl md:text-3xl font-bold text-white mt-12 mb-6 pt-6 border-t border-dark-border';
                quizHeader.innerText = currentLang === 'en' ? 'Interactive Quiz' : 'اختبار تفاعلي';
                area.appendChild(quizHeader);

                chapter.quiz.forEach((q, qIdx) => {
                    const qCard = document.createElement('div');
                    qCard.className = 'card shadow-lg';
                    
                    const qTitle = document.createElement('h3');
                    qTitle.className = 'text-lg md:text-xl font-semibold mb-4 leading-snug';
                    qTitle.innerHTML = `${qIdx + 1}. ${stripCitations(currentLang === 'en' ? q.qEn : q.qAr)}`;
                    qCard.appendChild(qTitle);

                    const optionsBox = document.createElement('div');
                    optionsBox.className = 'space-y-3';
                    
                    const options = currentLang === 'en' ? q.optionsEn : q.optionsAr;
                    options.forEach((opt, oIdx) => {
                        const optBtn = document.createElement('div');
                        optBtn.className = 'quiz-option p-4 rounded-lg border border-dark-border bg-dark-base hover:bg-dark-surface text-sm md:text-base';
                        optBtn.innerHTML = stripCitations(opt);
                        
                        optBtn.onclick = function() {
                            if (qCard.getAttribute('data-answered') === 'true') return;
                            qCard.setAttribute('data-answered', 'true');
                            
                            Array.from(optionsBox.children).forEach((child, cIdx) => {
                                child.classList.add('disabled');
                                const iconSpan = document.createElement('span');
                                iconSpan.className = currentLang === 'ar' ? 'float-left' : 'float-right';
                                
                                if (cIdx === q.correct) {
                                    child.classList.remove('bg-dark-base', 'hover:bg-dark-surface', 'border-dark-border');
                                    child.classList.add('correct');
                                    iconSpan.innerText = '✔️';
                                    child.appendChild(iconSpan);
                                } else if (cIdx === oIdx && cIdx !== q.correct) {
                                    child.classList.remove('bg-dark-base', 'hover:bg-dark-surface', 'border-dark-border');
                                    child.classList.add('incorrect');
                                    iconSpan.innerText = '✖️';
                                    child.appendChild(iconSpan);
                                }
                            });
                        };
                        
                        optionsBox.appendChild(optBtn);
                    });
                    
                    qCard.appendChild(optionsBox);
                    area.appendChild(qCard);
                });
            }
        }

        document.getElementById('langToggle').addEventListener('click', toggleLanguage);

        // Initialize setup
        renderSidebar();
        renderContent();
        updateSidebarTransform();
    </script>
