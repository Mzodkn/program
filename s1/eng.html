  <script>
    const courseData = [
      // ================= LECTURE 1 =================
      {
        id: "lec1",
        number: "Lecture 1",
        title: { en: "Introduction to Technical English & Voice", ar: "مقدمة في الإنجليزية التقنية والمبني للمجهول" },
        content: {
          en: `
            <div class="space-y-6">
              <h1 class="text-2xl sm:text-3xl font-bold text-white">Introduction to Technical English</h1>
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-4 rounded bg-dark-elevated border border-dark-border">
                  <h3 class="font-bold text-teal-400 mb-2">Technical English</h3>
                  <p class="text-sm">The form of English used in scientific, engineering, and computing fields. It emphasizes <strong>clarity</strong>, <strong>accuracy</strong>, and <strong>technical vocabulary</strong>. In short, a way to explain technical information without ambiguity.</p>
                </div>
                <div class="p-4 rounded bg-dark-elevated border border-dark-border">
                  <h3 class="font-bold text-teal-400 mb-2">General English</h3>
                  <p class="text-sm">The English used in daily life communication.</p>
                </div>
              </div>

              <div>
                <h3 class="font-bold text-white mb-2">Importance in the Technical Field:</h3>
                <ol class="list-decimal list-inside text-sm text-gray-300 space-y-1">
                  <li><strong>Understanding technical books and references:</strong> Most computer science books and research papers are written in English.</li>
                  <li><strong>Using software and applications:</strong> Helps you understand menus, commands, and instructions in programs.</li>
                  <li><strong>Understanding technical terms:</strong> Fields use many English terms such as database, network, and algorithm.</li>
                </ol>
              </div>

              <div class="p-4 border-l-4 border-brand-500 bg-dark-elevated text-sm">
                <strong class="text-white">Technical Vocabulary:</strong> The specialized vocabulary of any field which evolves due to the need for experts to communicate with clarity, precision, relevance, and brevity. Strategies to build it: knowing word origins, using a dictionary, inferring meaning from context, and understanding word formation (blending, compounding, coinage, borrowing, clipping, affixes).
              </div>

              <h2 class="text-xl font-bold text-white mt-8">Voice and Tense: Active vs Passive</h2>
              <div class="space-y-2 text-sm text-gray-300">
                <p><strong>1. Active Voice:</strong> The subject performs the action.<br><em>Example:</em> The operators conducted a test on the turbo generator.</p>
                <p><strong>2. Passive Voice:</strong> The subject receives the action.<br><em>Example:</em> A test was conducted on the turbo generator by the operators.</p>
              </div>

              <div class="overflow-x-auto border border-dark-border rounded">
                <table class="w-full text-left text-sm">
                  <thead class="bg-dark-elevated text-brand-500">
                    <tr><th class="p-3">Tense</th><th class="p-3">Active Voice</th><th class="p-3">Passive Voice</th></tr>
                  </thead>
                  <tbody class="divide-y divide-dark-border">
                    <tr><td class="p-3">Simple Present</td><td class="p-3">analyses</td><td class="p-3">is analysed</td></tr>
                    <tr><td class="p-3">Simple Past</td><td class="p-3">analysed</td><td class="p-3">was analysed</td></tr>
                    <tr><td class="p-3">Present Perfect</td><td class="p-3">has analysed</td><td class="p-3">has been analysed</td></tr>
                    <tr><td class="p-3">Future</td><td class="p-3">will analyse</td><td class="p-3">will be analysed</td></tr>
                  </tbody>
                </table>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div class="p-4 rounded bg-dark-elevated">
                  <h3 class="font-bold text-teal-400 mb-2">When to use Active:</h3>
                  <p>Gives importance to the doer. Used for clear, direct, and strong writing. (Crisp and unambiguous).</p>
                </div>
                <div class="p-4 rounded bg-dark-elevated">
                  <h3 class="font-bold text-teal-400 mb-2">When to use Passive:</h3>
                  <p>Gives importance to the action. Used in most formal writing (reports, proposals). (Note: Passive is verbose. Only transitive verbs can be transformed).</p>
                </div>
              </div>
            </div>
          `,
          ar: `
            <div class="space-y-6">
              <h1 class="text-2xl sm:text-3xl font-bold text-white">مقدمة في الإنجليزية التقنية</h1>
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-4 rounded bg-dark-elevated border border-dark-border">
                  <h3 class="font-bold text-teal-400 mb-2">الإنجليزية التقنية (Technical English)</h3>
                  <p class="text-sm">اللغة المستخدمة في المجالات العلمية والهندسية والحاسوبية. تؤكد على <strong>الوضوح</strong>، <strong>الدقة</strong>، و<strong>المفردات التقنية</strong>. هي طريقة لشرح المعلومات التقنية دون غموض (Ambiguity).</p>
                </div>
                <div class="p-4 rounded bg-dark-elevated border border-dark-border">
                  <h3 class="font-bold text-teal-400 mb-2">الإنجليزية العامة (General English)</h3>
                  <p class="text-sm">الإنجليزية المستخدمة في التواصل اليومي المعتاد.</p>
                </div>
              </div>

              <div>
                <h3 class="font-bold text-white mb-2">أهميتها في المجال التقني:</h3>
                <ol class="list-decimal list-inside text-sm text-gray-300 space-y-1">
                  <li><strong>فهم الكتب والمراجع:</strong> معظم كتب علوم الحاسوب والبحوث مكتوبة بالإنجليزية.</li>
                  <li><strong>استخدام البرامج والتطبيقات:</strong> واجهات البرامج والأوامر تستخدم الإنجليزية.</li>
                  <li><strong>فهم المصطلحات التقنية:</strong> استخدام كلمات معيارية عالمياً مثل database و algorithm.</li>
                </ol>
              </div>

              <div class="p-4 border-r-4 border-brand-500 bg-dark-elevated text-sm">
                <strong class="text-white">المفردات التقنية (Technical Vocabulary):</strong> مفردات متخصصة تطورت لحاجة الخبراء للتواصل بوضوح ودقة وإيجاز (Brevity). لزيادتها يجب: معرفة أصل الكلمة، استخدام القاموس، التخمين من السياق، وفهم تكوين الكلمة عبر الإضافات (السوابق واللواحق Affixes).
              </div>

              <h2 class="text-xl font-bold text-white mt-8">الصوت والزمن: المعلوم والمجهول (Active vs Passive)</h2>
              <div class="space-y-2 text-sm text-gray-300">
                <p><strong>1. المبني للمعلوم (Active):</strong> الفاعل يقوم بالفعل.<br><em>مثال:</em> أجرى المشغلون اختباراً على المولد.</p>
                <p><strong>2. المبني للمجهول (Passive):</strong> الفاعل يتلقى الفعل.<br><em>مثال:</em> أُجري اختبار على المولد بواسطة المشغلين.</p>
              </div>

              <div class="overflow-x-auto border border-dark-border rounded">
                <table class="w-full text-right text-sm">
                  <thead class="bg-dark-elevated text-brand-500">
                    <tr><th class="p-3">الزمن (Tense)</th><th class="p-3">المبني للمعلوم</th><th class="p-3">المبني للمجهول</th></tr>
                  </thead>
                  <tbody class="divide-y divide-dark-border">
                    <tr><td class="p-3">المضارع البسيط</td><td class="p-3">analyses</td><td class="p-3">is analysed</td></tr>
                    <tr><td class="p-3">الماضي البسيط</td><td class="p-3">analysed</td><td class="p-3">was analysed</td></tr>
                    <tr><td class="p-3">المضارع التام</td><td class="p-3">has analysed</td><td class="p-3">has been analysed</td></tr>
                    <tr><td class="p-3">المستقبل</td><td class="p-3">will analyse</td><td class="p-3">will be analysed</td></tr>
                  </tbody>
                </table>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div class="p-4 rounded bg-dark-elevated">
                  <h3 class="font-bold text-teal-400 mb-2">متى نستخدم المبني للمعلوم:</h3>
                  <p>عندما يكون الفاعل هو الأهم. يستخدم للكتابة المباشرة والقوية الخالية من الغموض.</p>
                </div>
                <div class="p-4 rounded bg-dark-elevated">
                  <h3 class="font-bold text-teal-400 mb-2">متى نستخدم المبني للمجهول:</h3>
                  <p>في الكتابة الرسمية (التقارير). التركيز هنا على "الفعل" وليس "الفاعل". (ملاحظة: الأفعال المتعدية Transitive verbs فقط هي التي تتحول للمجهول).</p>
                </div>
              </div>
            </div>
          `
        },
        quiz: {
          q: { en: "Which of the following describes Passive Voice?", ar: "أي مما يلي يصف المبني للمجهول (Passive Voice)؟" },
          options: {
            en: ["It gives importance to the doer of the action.", "It is only used with intransitive verbs.", "It gives importance to the action itself and is used in formal writing.", "It is crisp, direct, and unambiguous."],
            ar: ["يعطي الأهمية لفاعل الحدث.", "يُستخدم فقط مع الأفعال اللازمة.", "يعطي الأهمية للحدث نفسه ويُستخدم في الكتابات الرسمية.", "موجز ومباشر وخالٍ من الغموض."]
          },
          answer: 2
        }
      },
      // ================= LECTURE 2 =================
      {
        id: "lec2",
        number: "Lecture 2",
        title: { en: "Note Making & Summarizing", ar: "تدوين الملاحظات والتلخيص" },
        content: {
          en: `
            <div class="space-y-6">
              <h1 class="text-2xl font-bold text-white">Note Making & Summarizing</h1>
              
              <div class="p-4 rounded-lg bg-dark-elevated border-l-4 border-brand-500 text-sm">
                <strong>Note Making</strong> is a systematic method of writing down quickly, briefly, and clearly the important points of a reading text. It integrates reading and writing skills.
              </div>

              <h3 class="font-bold text-white mt-4">Abbreviations in Note Making:</h3>
              <p class="text-sm text-gray-300">Never write full sentences. Use standard abbreviations:</p>
              <ul class="list-disc list-inside text-sm text-gray-300 space-y-1">
                <li>Capitalized initials (Acronyms): USA, UK, USSR</li>
                <li>First & last letters with apostrophe: can't (cannot), w'out (without)</li>
                <li>First letters of phrases: Kg (Kilogram), CV (Curriculum Vitae)</li>
                <li>General usage: e.g. (Example), viz (Namely), et al (and others)</li>
              </ul>

              <h2 class="text-xl font-bold text-white mt-8">Three Methods of Note Making</h2>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                <div class="p-4 border border-dark-border rounded">
                  <h4 class="text-teal-400 font-bold">1. Topicalising</h4>
                  <p>Main points are rephrased in bullet points. Redundant words are removed.</p>
                </div>
                <div class="p-4 border border-dark-border rounded">
                  <h4 class="text-teal-400 font-bold">2. Schematizing</h4>
                  <p>Organizing scientific text and processes into forms, tables, and diagrams.</p>
                </div>
                <div class="p-4 border border-dark-border rounded">
                  <h4 class="text-teal-400 font-bold">3. Sequencing</h4>
                  <p>Making a clear layout for fast interpretation. Arranging points logically.</p>
                </div>
              </div>

              <h2 class="text-xl font-bold text-white mt-8">Summarizing (The 5 C's)</h2>
              <p class="text-sm text-gray-300">A summary provides maximum information in a minimum number of words (Condensation).</p>
              <div class="bg-dark-elevated p-4 rounded mt-4 space-y-2 text-sm border border-dark-border">
                <p><strong class="text-brand-500">1. Completeness:</strong> Has all essential elements of the original.</p>
                <p><strong class="text-brand-500">2. Compactness:</strong> All ideas form a compact whole (Unity).</p>
                <p><strong class="text-brand-500">3. Conciseness:</strong> Brevity is the soul of wit. Clear and concise.</p>
                <p><strong class="text-brand-500">4. Clarity:</strong> No vague statements.</p>
                <p><strong class="text-brand-500">5. Coherence:</strong> Logical, chronological, and spatial order.</p>
              </div>
            </div>
          `,
          ar: `
            <div class="space-y-6">
              <h1 class="text-2xl font-bold text-white">تدوين الملاحظات والتلخيص</h1>
              
              <div class="p-4 rounded-lg bg-dark-elevated border-r-4 border-brand-500 text-sm">
                <strong>تدوين الملاحظات (Note Making):</strong> طريقة منهجية لكتابة النقاط المهمة من النص بسرعة، وإيجاز، ووضوح. تدمج بين مهارتي القراءة والكتابة.
              </div>

              <h3 class="font-bold text-white mt-4">الاختصارات في تدوين الملاحظات:</h3>
              <p class="text-sm text-gray-300">لا تكتب جملاً كاملة أبداً. استخدم الاختصارات القياسية:</p>
              <ul class="list-disc list-inside text-sm text-gray-300 space-y-1" dir="ltr">
                <li class="text-right">الحروف الأولى الكبيرة (Acronyms): USA, UK, USSR</li>
                <li class="text-right">الحرف الأول والأخير مع فاصلة: can't (cannot), w'out (without)</li>
                <li class="text-right">أوائل الكلمات في العبارات: Kg (Kilogram), CV (Curriculum Vitae)</li>
                <li class="text-right">الاختصارات الشائعة: e.g. (مثال), viz (تحديداً), et al (وآخرون)</li>
              </ul>

              <h2 class="text-xl font-bold text-white mt-8">الطرق الثلاث لتدوين الملاحظات</h2>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                <div class="p-4 border border-dark-border rounded">
                  <h4 class="text-teal-400 font-bold">1. التبويب (Topicalising)</h4>
                  <p>إعادة صياغة النقاط الرئيسية وحذف الكلمات الزائدة (Redundant).</p>
                </div>
                <div class="p-4 border border-dark-border rounded">
                  <h4 class="text-teal-400 font-bold">2. التخطيط (Schematizing)</h4>
                  <p>تنظيم النصوص العلمية والعمليات في شكل جداول ومخططات.</p>
                </div>
                <div class="p-4 border border-dark-border rounded">
                  <h4 class="text-teal-400 font-bold">3. التسلسل (Sequencing)</h4>
                  <p>إنشاء تخطيط واضح للتفسير السريع بترتيب منطقي.</p>
                </div>
              </div>

              <h2 class="text-xl font-bold text-white mt-8">عناصر التلخيص (The 5 C's)</h2>
              <p class="text-sm text-gray-300">الملخص يقدم أقصى قدر من المعلومات بأقل عدد من الكلمات (تكثيف / Condensation).</p>
              <div class="bg-dark-elevated p-4 rounded mt-4 space-y-2 text-sm border border-dark-border">
                <p><strong class="text-brand-500">1. الاكتمال (Completeness):</strong> يحتوي على كافة العناصر الأساسية من الأصل.</p>
                <p><strong class="text-brand-500">2. الترابط (Compactness):</strong> دمج الأفكار في كيان متماسك.</p>

                <p><strong class="text-brand-500">4. الوضوح (Clarity):</strong> التعبير السليم وخلو النص من العبارات المبهمة (Vague).</p>
                <p><strong class="text-brand-500">5. التناسق (Coherence):</strong> الترتيب المنطقي والزمني والانتقال السلس.</p>
              </div>
            </div>
          `
        },

            en: ["Topicalising", "Schematizing", "Sequencing", "Summarizing"],
            ar: ["التبويب (Topicalising)", "التخطيط (Schematizing)", "التسلسل (Sequencing)", "التلخيص (Summarizing)"]
          },
          answer: 1
        }
      },

        content: {
          en: `

              <h2 class="text-xl font-bold text-white mt-6">The 5 Core Principles of Technical Writing:</h2>

                <div class="p-3 bg-dark-elevated rounded border border-dark-border"><strong class="text-brand-500">3. Consistency:</strong> Uniform terminology and naming styles.</div>
                <div class="p-3 bg-dark-elevated rounded border border-dark-border"><strong class="text-brand-500">4. Accuracy:</strong> Strict verification against actual APIs/interfaces.</div>
                <div class="p-3 bg-dark-elevated rounded border border-dark-border"><strong class="text-brand-500">5. Accessibility:</strong> Logical navigation and searchable index.</div>

              <h2 class="text-xl font-bold text-white mt-8">Standard Documentation Types</h2>
              <ul class="list-disc list-inside space-y-2 text-sm text-gray-300">
                <li><strong>User Manuals:</strong> Step-by-step instructions for operating software. Includes Prerequisites, Installation, Navigation, Core Tasks, and Troubleshooting.</li>
                <li><strong>Process Descriptions:</strong> Uses 6 steps (Process Title, Objective, Triggers, Inputs, Execution Steps, Outputs). Uses UML Diagrams.</li>
                <li><strong>API Documentation:</strong> Explains how systems integrate (Endpoints, HTTP methods, JSON formats).</li>
                <li><strong>Troubleshooting Guides:</strong> Helps diagnose and repair failures (Symptom → Cause → Solution).</li>
              </ul>

                <div class="bg-dark-elevated p-3 rounded border border-dark-border"><strong class="text-teal-400 block mb-1">Taxonomy</strong>تصنيف / هيكلة منهجية</div>

          ar: `

    // ================= APP ENGINE =================
    let currentLang = 'ar';
    let currentIndex = 0;

    const moduleList = document.getElementById('moduleList');
    const contentArea = document.getElementById('contentArea');
    const lectureNumber = document.getElementById('lectureNumber');
    const quizSection = document.getElementById('quizSection');
    const quizContainer = document.getElementById('quizContainer');
    const langToggle = document.getElementById('langToggle');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const sidebar = document.getElementById('sidebar');

    function renderNav() {
      moduleList.innerHTML = '';
      courseData.forEach((mod, index) => {
        const btn = document.createElement('button');
        btn.className = `w-full text-start px-3 py-2.5 rounded-lg text-sm transition-all flex flex-col gap-0.5 ${
          index === currentIndex ? 'nav-active' : 'text-dark-muted hover:bg-dark-elevated hover:text-white'
        }`;
        btn.innerHTML = `
          <span class="text-xs opacity-75 font-mono">${mod.number}</span>
          <span class="truncate font-medium">${mod.title[currentLang]}</span>
        `;
        btn.onclick = () => { 
          currentIndex = index; 
          renderAll(); 
          if(window.innerWidth < 768) sidebar.classList.add('hidden');
        };
        moduleList.appendChild(btn);
      });
    }

    function renderContent() {
      const data = courseData[currentIndex];
      lectureNumber.textContent = `${data.number}`;
      contentArea.innerHTML = data.content[currentLang];
      
      if (data.quiz) {
        quizSection.style.display = 'block';
        const qData = data.quiz;
        quizContainer.innerHTML = `<p class="font-bold text-white mb-3">${qData.q[currentLang]}</p>`;
        
        qData.options[currentLang].forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = "w-full text-start p-3 bg-dark-surface border border-dark-border rounded hover:border-brand-500 hover:bg-dark-base transition flex items-center justify-between text-sm text-gray-300 mb-2";
          btn.innerHTML = `<span>${opt}</span><span class="w-4 h-4 rounded-full border border-dark-border"></span>`;
          
          btn.onclick = () => {
            Array.from(quizContainer.children).forEach(c => c.disabled = true);
            
            if (idx === qData.answer) {
              btn.classList.add('border-green-500', 'bg-green-500/10', 'text-green-400');
              const icon = btn.querySelector('span:last-child');
              icon.outerHTML = `<span class="text-green-400 text-lg">✔</span>`;
            } else {
              btn.classList.add('border-red-500', 'bg-red-500/10', 'text-red-400');
              const icon = btn.querySelector('span:last-child');
              icon.outerHTML = `<span class="text-red-400 text-lg">✖</span>`;
              
              const correctBtn = quizContainer.children[qData.answer + 1];
              correctBtn.classList.add('border-green-500', 'bg-green-500/10', 'text-green-400');
              correctBtn.querySelector('span:last-child').outerHTML = `<span class="text-green-400 text-lg">✔</span>`;
            }
          };
          quizContainer.appendChild(btn);
        });
      } else {
        quizSection.style.display = 'none';
      }

      prevBtn.style.opacity = currentIndex === 0 ? '0.4' : '1';
      prevBtn.style.cursor = currentIndex === 0 ? 'not-allowed' : 'pointer';
      
      nextBtn.style.opacity = currentIndex === courseData.length - 1 ? '0.4' : '1';
      nextBtn.style.cursor = currentIndex === courseData.length - 1 ? 'not-allowed' : 'pointer';
    }

    function renderAll() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      
      langToggle.textContent = currentLang === 'ar' ? 'English' : 'العربية';
      document.getElementById('navTitle').textContent = currentLang === 'ar' ? 'وحدات المنهج' : 'Course Lectures';
      document.getElementById('quizTitle').textContent = currentLang === 'ar' ? 'اختبر فهمك السريع' : 'Knowledge Check';
      prevBtn.innerHTML = currentLang === 'ar' ? '&rarr; السابق' : '&larr; Previous';
      nextBtn.innerHTML = currentLang === 'ar' ? 'التالي &larr;' : 'Next &rarr;';
      
      renderNav();
      renderContent();
    }

    langToggle.onclick = () => { 
      currentLang = currentLang === 'ar' ? 'en' : 'ar'; 
      renderAll(); 
    };

    prevBtn.onclick = () => { 
      if (currentIndex > 0) { 
        currentIndex--; 
        renderAll(); 
        window.scrollTo(0,0); 
      } 
    };

    nextBtn.onclick = () => { 
      if (currentIndex < courseData.length - 1) { 
        currentIndex++; 
        renderAll(); 
        window.scrollTo(0,0); 
      } 
    };

    document.getElementById('sidebarToggle').onclick = () => {
      sidebar.classList.toggle('hidden');
    };

    renderAll();
  </script>
</body>
</html>
