              'عمليات التصنيع مقابل عمليات الخدمات: التصنيع ينتج سلعاً مادية (ملموسة، يمكن تخزينها). عمليات الخدمات تقدم مخرجات غير ملموسة يتم إنتاجها واستهلاكها في نفس الوقت (مثل تطوير البرمجيات، الخدمات السحابية).',
              'إدارة سلسلة الإمداد (Supply Chain Management): شبكة الموردين والمصنعين والموزعين وتجار التجزئة.',
              'إدارة الجودة (Quality Management): مراقبة الجودة (فحص المنتجات) وضمان الجودة (منع العيوب).'
            ]}
          ]
        },
        quiz: [
          {
            question: { en: 'What are the 4Ps of the marketing mix?', ar: 'ما هي العناصر الأربعة (4Ps) لمزيج التسويق؟' },
            options: {
              en: ['Product, Price, Place, Promotion', 'Planning, Production, People, Profit', 'Private, Public, Partnership, Policy', 'Power, Performance, Process, Price'],
              ar: ['المنتج، السعر، المكان، الترويج (Product, Price, Place, Promotion)', 'التخطيط، الإنتاج، الأشخاص، الربح', 'خاص، عام، شراكة، سياسة', 'طاقة، أداء، عملية، سعر']
            },
            correct: 0
          },
          {
            question: { en: 'Which operation type involves intangible outputs produced and consumed at the same time?', ar: 'أي نوع من العمليات يتضمن مخرجات غير ملموسة يتم إنتاجها واستهلاكها في نفس الوقت؟' },
            options: {
              en: ['Manufacturing operations', 'Service operations', 'Heavy assembly', 'Agricultural harvesting'],
              ar: ['عمليات التصنيع', 'عمليات الخدمات (Service operations)', 'التجميع الثقيل', 'الحصاد الزراعي']
            },
            correct: 1
          }
        ]
      },
      {
        id: 'glossary',
        title: { en: 'Glossary / قاموس المصطلحات', ar: 'قاموس المصطلحات (Glossary)' },
        isGlossary: true,
        content: {
          en: [
            { term: 'Business', translation: 'أعمال / شركة' },
            { term: 'Stakeholders', translation: 'أصحاب المصلحة' },
            { term: 'Sole Proprietorship', translation: 'ملكية فردية' },
            { term: 'Partnership', translation: 'شراكة' },
            { term: 'Corporation', translation: 'شركة مساهمة' },
            { term: 'Limited Liability Company (LLC)', translation: 'شركة ذات مسؤولية محدودة' },
            { term: 'Business Ethics', translation: 'أخلاقيات الأعمال' },
            { term: 'Corporate Social Responsibility (CSR)', translation: 'المسؤولية الاجتماعية للشركات' },
            { term: 'Globalization', translation: 'العولمة' },
            { term: 'Multinational Company (MNC)', translation: 'شركة متعددة الجنسيات' },
            { term: 'Entrepreneurship', translation: 'ريادة الأعمال' },
            { term: 'Startup', translation: 'شركة ناشئة' },
            { term: 'Management', translation: 'الإدارة' },
            { term: 'Human Resource Management (HRM)', translation: 'إدارة الموارد البشرية' },
            { term: 'Marketing Mix (4Ps)', translation: 'مزيج التسويق (العناصر الأربعة)' },
            { term: 'Operations Management', translation: 'إدارة العمليات' },
            { term: 'Supply Chain Management', translation: 'إدارة سلسلة الإمداد' },
            { term: 'Intellectual Property', translation: 'الملكية الفكرية' },
            { term: 'Cybersecurity', translation: 'الأمن السيبراني' },
            { term: 'Cloud Computing', translation: 'الحوسبة السحابية' },
            { term: 'Inflation', translation: 'التضخم' },
            { term: 'Unemployment', translation: 'البطالة' },
            { term: 'Profit', translation: 'الربح' },
            { term: 'Revenue', translation: 'الإيرادات' },
            { term: 'Liability', translation: 'المسؤولية القانونية / الالتزامات' }
          ]
        }
      }
    ];

    // App State
    let currentLang = 'en'; // 'en' or 'ar'
    let currentModuleId = 'intro';

    // DOM Elements
    const navTitle = document.getElementById('nav-title');
    const navSubtitle = document.getElementById('nav-subtitle');
    const sidebarHeading = document.getElementById('sidebar-heading');
    const moduleNav = document.getElementById('module-nav');
    const contentContainer = document.getElementById('content-container');
    const langToggle = document.getElementById('lang-toggle');
    const langLabel = document.getElementById('lang-label');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');

    // Initialize App
    function init() {
      renderSidebar();
      renderContent();
      updateLanguageUI();

      // Event Listeners
      langToggle.addEventListener('click', toggleLanguage);
      sidebarToggle.addEventListener('click', toggleMobileSidebar);
      sidebarBackdrop.addEventListener('click', toggleMobileSidebar);
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'ar' : 'en';
      document.documentElement.setAttribute('lang', currentLang);
      document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
      updateLanguageUI();
      renderSidebar();
      renderContent();
    }

    function updateLanguageUI() {
      if (currentLang === 'ar') {
        langLabel.textContent = 'English';
        navTitle.textContent = 'IS';
        navSubtitle.textContent = 'دورة تعليمية تفاعلية';
        sidebarHeading.textContent = 'وحدات الدورة';
      } else {
        langLabel.textContent = 'العربية';
        navTitle.textContent = 'IS';
        navSubtitle.textContent = 'Interactive Educational Course';
        sidebarHeading.textContent = 'Course Modules';
      }
    }

    function toggleMobileSidebar() {
      sidebar.classList.toggle('-translate-x-full');
      sidebar.classList.toggle('rtl:translate-x-full');
      sidebarBackdrop.classList.toggle('hidden');
    }

    function renderSidebar() {
      moduleNav.innerHTML = '';
      courseData.forEach((mod, index) => {
        const btn = document.createElement('button');
        const isActive = mod.id === currentModuleId;
        btn.className = `w-full text-left rtl:text-right px-3.5 py-2.5 rounded-xl text-xs lg:text-sm font-medium transition-all flex items-center justify-between group ${
          isActive 
            ? 'bg-brand-500 text-dark-base font-semibold shadow-md' 
            : 'text-dark-muted hover:bg-dark-elevated hover:text-white'
        }`;
        
        const titleText = mod.title[currentLang];
        btn.innerHTML = `
          <span class="truncate">${titleText}</span>
          <span class="text-[10px] font-mono px-1.5 py-0.5 rounded ${isActive ? 'bg-dark-base/20 text-dark-base' : 'bg-dark-elevated text-dark-muted'}">0${index + 1}</span>
        `;
        
        btn.addEventListener('click', () => {
          currentModuleId = mod.id;
          renderSidebar();
          renderContent();
          if (window.innerWidth < 1024) {
            toggleMobileSidebar();
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        
        moduleNav.appendChild(btn);
      });
    }

    function renderContent() {
      const module = courseData.find(m => m.id === currentModuleId);
      if (!module) return;

      contentContainer.innerHTML = '';

      // Module Header Card
      const headerCard = document.createElement('div');
      headerCard.className = 'bg-dark-surface border border-dark-border rounded-2xl p-6 shadow-xl relative overflow-hidden';
      headerCard.innerHTML = `
        <div class="absolute top-0 right-0 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl pointer-events-none"></div>
        <span class="text-xs font-mono text-brand-500 uppercase tracking-widest font-semibold">Module Content</span>
        <h2 class="text-2xl lg:text-3xl font-bold text-white mt-1 mb-2">${module.title[currentLang]}</h2>
        <div class="h-1 w-16 bg-brand-500 rounded-full"></div>
      `;
      contentContainer.appendChild(headerCard);

      // Render Glossary if it's the glossary module
      if (module.isGlossary) {
        const glossaryCard = document.createElement('div');
        glossaryCard.className = 'bg-dark-surface border border-dark-border rounded-2xl p-6 shadow-lg space-y-4';
        
        let html = `
          <div class="mb-4">
            <input type="text" id="glossary-search" placeholder="${currentLang === 'ar' ? 'بحث في المصطلحات...' : 'Search glossary terms...'}" 
              class="w-full px-4 py-2.5 rounded-xl bg-dark-base border border-dark-border text-white text-sm focus:outline-none focus:border-brand-500">
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="glossary-grid">
        `;

        module.content.en.forEach((item, idx) => {
          html += `
            <div class="glossary-item bg-dark-elevated p-4 rounded-xl border border-dark-border flex flex-col justify-between hover:border-brand-500/50 transition-colors">
              <span class="font-mono font-bold text-brand-500 text-sm">${item.term}</span>
              <span class="text-dark-text text-sm mt-1 font-semibold">${item.translation}</span>
            </div>
          `;
        });

        html += `</div>`;
        glossaryCard.innerHTML = html;
        contentContainer.appendChild(glossaryCard);

        // Add search functionality
        setTimeout(() => {
          const searchInput = document.getElementById('glossary-search');
          if (searchInput) {
            searchInput.addEventListener('input', (e) => {
              const query = e.target.value.toLowerCase();
              const items = document.querySelectorAll('.glossary-item');
              items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
              });
            });
          }
        }, 100);

        return;
      }

      // Render Standard Module Content
      const contentList = module.content[currentLang] || [];
      contentList.forEach(block => {
        if (block.type === 'heading') {
          const h = document.createElement('h3');
          h.className = 'text-lg lg:text-xl font-bold text-white mt-6 mb-3 flex items-center space-x-2 rtl:space-x-reverse';
          h.innerHTML = `<span class="w-2 h-2 rounded-full bg-brand-500 inline-block"></span><span>${block.text}</span>`;
          contentContainer.appendChild(h);
        } else if (block.type === 'paragraph') {
          const p = document.createElement('p');
          p.className = 'text-dark-muted text-sm lg:text-base leading-relaxed';
          p.textContent = block.text;
          contentContainer.appendChild(p);
        } else if (block.type === 'list') {
          const ul = document.createElement('ul');
          ul.className = 'space-y-2 my-3';
          block.items.forEach(item => {
            const li = document.createElement('li');
            li.className = 'flex items-start space-x-3 rtl:space-x-reverse text-dark-muted text-sm lg:text-base bg-dark-surface/50 p-3 rounded-xl border border-dark-border/50';
            li.innerHTML = `
              <svg class="w-5 h-5 text-brand-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
              <span>${item}</span>
            `;
            ul.appendChild(li);
          });
          contentContainer.appendChild(ul);
        } else if (block.type === 'example') {
          const ex = document.createElement('div');
          ex.className = 'bg-dark-elevated border-l-4 rtl:border-r-4 rtl:border-l-0 border-brand-500 p-4 rounded-r-xl rtl:rounded-r-none rtl:rounded-l-xl my-4 shadow-sm';
          ex.innerHTML = `<p class="text-xs font-mono text-brand-500 font-bold mb-1 uppercase tracking-wider">Example / مثال</p><p class="text-sm text-dark-text">${block.text}</p>`;
          contentContainer.appendChild(ex);
        } else if (block.type === 'table') {
          const tableWrapper = document.createElement('div');
          tableWrapper.className = 'overflow-x-auto my-4 rounded-xl border border-dark-border bg-dark-surface shadow-md';
          
          let tableHTML = `<table class="w-full text-left rtl:text-right border-collapse"><thead><tr class="bg-dark-elevated border-b border-dark-border">`;
          block.headers.forEach(h => {
            tableHTML += `<th class="px-4 py-3 text-xs font-mono uppercase tracking-wider text-brand-500 font-bold">${h}</th>`;
          });
          tableHTML += `</tr></thead><tbody class="divide-y divide-dark-border text-sm text-dark-text">`;
          
          block.rows.forEach(row => {
            tableHTML += `<tr class="hover:bg-dark-elevated/50 transition-colors">`;
            row.forEach(cell => {
              tableHTML += `<td class="px-4 py-3">${cell}</td>`;
            });
            tableHTML += `</tr>`;
          });
          
          tableHTML += `</tbody></table>`;
          tableWrapper.innerHTML = tableHTML;
          contentContainer.appendChild(tableWrapper);
        }
      });

      // Render Interactive Quiz if available
      if (module.quiz && module.quiz.length > 0) {
        const quizContainer = document.createElement('div');
        quizContainer.className = 'bg-dark-surface border border-dark-border rounded-2xl p-6 shadow-xl mt-10 space-y-6';
        
        let quizHTML = `
          <div class="flex items-center space-x-3 rtl:space-x-reverse border-b border-dark-border pb-4">
            <div class="w-8 h-8 rounded-lg bg-brand-500/20 text-brand-500 flex items-center justify-center font-bold font-mono">Q</div>
            <div>
              <h3 class="text-lg font-bold text-white">${currentLang === 'ar' ? 'اختبار ذاتي تفاعلي' : 'Interactive Self-Assessment Quiz'}</h3>
              <p class="text-xs text-dark-muted">${currentLang === 'ar' ? 'اختر الإجابة الصحيحة لعرض النتيجة الفورية' : 'Select the correct option for instant visual feedback'}</p>
            </div>
          </div>
          <div class="space-y-6">
        `;

        module.quiz.forEach((q, qIdx) => {
          const qText = q.question[currentLang];
          const options = q.options[currentLang];
          
          quizHTML += `
            <div class="quiz-question bg-dark-elevated p-5 rounded-xl border border-dark-border space-y-3" data-correct="${q.correct}">
              <p class="font-semibold text-white text-sm lg:text-base"><span class="text-brand-500 font-mono mr-2 rtl:ml-2">0${qIdx + 1}.</span>${qText}</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2">
          `;

          options.forEach((opt, optIdx) => {
            quizHTML += `
              <button class="quiz-option text-left rtl:text-right px-4 py-3 rounded-xl border border-dark-border bg-dark-surface text-dark-muted hover:border-brand-500 hover:text-white text-xs lg:text-sm font-medium transition-all flex items-center justify-between group" data-option="${optIdx}" data-question="${qIdx}">
                <span>${opt}</span>
                <span class="w-4 h-4 rounded-full border border-dark-border group-hover:border-brand-500 flex items-center justify-center flex-shrink-0"></span>
              </button>
            `;
          });

          quizHTML += `</div></div>`;
        });

        quizHTML += `</div>`;
        quizContainer.innerHTML = quizHTML;
        contentContainer.appendChild(quizContainer);

        // Add Quiz Interactivity Logic
        setTimeout(() => {
          const questionCards = quizContainer.querySelectorAll('.quiz-question');
          questionCards.forEach(card => {
            const correctIndex = parseInt(card.getAttribute('data-correct'));
            const options = card.querySelectorAll('.quiz-option');

            options.forEach(optBtn => {
              optBtn.addEventListener('click', (e) => {
                // Disable all options in this question once answered
                options.forEach(btn => btn.disabled = true);

                const selectedIndex = parseInt(optBtn.getAttribute('data-option'));
                
                if (selectedIndex === correctIndex) {
                  optBtn.classList.remove('border-dark-border', 'bg-dark-surface', 'text-dark-muted');
                  optBtn.classList.add('border-emerald-500', 'bg-emerald-500/20', 'text-emerald-400', 'font-bold');
                  optBtn.querySelector('span:last-child').innerHTML = `
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                  `;
                } else {
                  optBtn.classList.remove('border-dark-border', 'bg-dark-surface', 'text-dark-muted');
                  optBtn.classList.add('border-rose-500', 'bg-rose-500/20', 'text-rose-400', 'font-bold');
                  optBtn.querySelector('span:last-child').innerHTML = `
                    <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                  `;

                  // Highlight correct option
                  options[correctIndex].classList.remove('border-dark-border', 'bg-dark-surface', 'text-dark-muted');
                  options[correctIndex].classList.add('border-emerald-500', 'bg-emerald-500/20', 'text-emerald-400', 'font-bold');
                }
              });
            });
          });
        }, 100);
      }
    }

    // Run initialization on load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
