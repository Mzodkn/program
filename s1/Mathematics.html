        let currentLang = 'en';
        let currentModuleId = courseData.modules[0].id;

        const body = document.body;
        const langToggleBtn = document.getElementById('lang-toggle');
        const navMenu = document.getElementById('nav-menu');
        const contentContainer = document.getElementById('content-container');
        const quizContainer = document.getElementById('quiz-container');
        const quizQuestions = document.getElementById('quiz-questions');
        const quizTitle = document.getElementById('quiz-title');
        const menuToggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');

        // Toggle Language
        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            body.className = `bg-slate-900 text-slate-200 min-h-screen flex flex-col ${currentLang}`;
            langToggleBtn.textContent = currentLang === 'en' ? 'عربي' : 'English';
            quizTitle.textContent = currentLang === 'en' ? 'Knowledge Check' : 'اختبار المعرفة';
            renderApp();
        });

        // Mobile Menu
        menuToggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            if (currentLang === 'ar') {
                sidebar.classList.toggle('translate-x-full');
            }
        });

        function renderApp() {
            renderSidebar();
            renderContent(currentModuleId);
        }

        function renderSidebar() {
            navMenu.innerHTML = '';
            courseData.modules.forEach(mod => {
                const btn = document.createElement('button');
                btn.className = `w-full text-start px-4 py-3 rounded-lg font-semibold transition ${mod.id === currentModuleId ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}`;
                btn.textContent = currentLang === 'en' ? mod.titleEn : mod.titleAr;
                btn.onclick = () => {
                    currentModuleId = mod.id;
                    renderApp();
                    if(window.innerWidth < 1024) sidebar.classList.add(currentLang === 'en' ? '-translate-x-full' : 'translate-x-full');
                };
                navMenu.appendChild(btn);
            });
        }

        function renderContent(moduleId) {
            const mod = courseData.modules.find(m => m.id === moduleId);
            contentContainer.innerHTML = `<h2 class="text-3xl font-bold text-slate-100 mb-6 border-b border-slate-700 pb-2">${currentLang === 'en' ? mod.titleEn : mod.titleAr}</h2>`;
            
            mod.content.forEach(block => {
                const text = block[currentLang];
                let el;
                
                switch(block.type) {
                    case 'h2':
                        el = document.createElement('h2');
                        el.className = 'text-2xl font-bold text-blue-300 mt-8 mb-4';
                        el.textContent = text;
                        break;
                    case 'h3':
                        el = document.createElement('h3');
                        el.className = 'text-xl font-semibold text-blue-200 mt-6 mb-3';
                        el.textContent = text;
                        break;
                    case 'p':
                        el = document.createElement('p');
                        el.className = 'text-slate-300 leading-relaxed mb-4 text-lg';
                        el.textContent = text;
                        break;
                    case 'ul':
                        el = document.createElement('ul');
                        el.className = 'list-disc list-inside space-y-2 mb-4 text-slate-300 bg-slate-800 p-4 rounded-lg border border-slate-700 text-lg';
                        text.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = item;
                            el.appendChild(li);
                        });
                        break;
                    case 'alert':
                        el = document.createElement('div');
                        el.className = 'bg-blue-900/30 border-l-4 border-blue-500 text-blue-100 p-4 rounded mb-4 whitespace-pre-line text-lg';
                        el.textContent = text;
                        break;
                    case 'table':
                        el = document.createElement('div');
                        el.className = 'overflow-x-auto bg-slate-800 rounded-lg p-1 border border-slate-700 text-lg';
                        const table = document.createElement('table');
                        table.innerHTML = text;
                        el.appendChild(table);
                        break;
                }
                if(el) contentContainer.appendChild(el);
            });

            renderQuiz(mod.quiz);
        }

        function renderQuiz(quizArray) {
            if (!quizArray || quizArray.length === 0) {
                quizContainer.classList.add('hidden');
                return;
            }
            quizContainer.classList.remove('hidden');
            quizQuestions.innerHTML = '';

            quizArray.forEach((q, qIndex) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'bg-slate-850 p-4 rounded-md border border-slate-700';
                
                const qTitle = document.createElement('p');
                qTitle.className = 'font-semibold text-lg mb-4 text-slate-200';
                qTitle.textContent = `${qIndex + 1}. ${q[currentLang]}`;
                qDiv.appendChild(qTitle);

                const optsDiv = document.createElement('div');
                optsDiv.className = 'space-y-2 flex flex-col';
                
                let answered = false;

                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-btn text-start px-4 py-3 rounded bg-slate-700 hover:bg-slate-600 border border-slate-600 transition text-slate-200';
                    btn.textContent = opt[currentLang];
                    
                    btn.onclick = () => {
                        if (answered) return;
                        answered = true;
                        if (opt.correct) {
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('incorrect');
                            // Highlight correct answer
                            Array.from(optsDiv.children).forEach((childBtn, idx) => {
                                if (q.options[idx].correct) childBtn.classList.add('correct');
                            });
                        }
                    };
                    optsDiv.appendChild(btn);
                });

                qDiv.appendChild(optsDiv);
                quizQuestions.appendChild(qDiv);
            });
        }

        // Init
        renderApp();
    </script>
</body>
</html>
