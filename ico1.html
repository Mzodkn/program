  const pal = PALETTES[logo.p % PALETTES.length];
  return `<svg id="svg-${logo.id}" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <!-- 1. الإطار والدرع الخلفي -->
    ${drawFrame(logo.f, pal)}
    <!-- 2. السلاح أو الخلفية المتقاطعة -->
    ${drawWeapon(logo.w, pal)}
    <!-- 3. الشخصية أو الأيقونة المركزية -->
    ${drawMascot(logo.m, pal)}
    <!-- 4. الكود التكتيكي العلوي (مرفوع للأعلى حتى لا يغطي القبعات) -->
    <rect x="148" y="16" width="104" height="20" rx="5" fill="${pal.b}" stroke="${pal.s}" stroke-width="1.5"/>
    <text x="200" y="30" text-anchor="middle" fill="${pal.s}" font-family="JetBrains Mono, monospace" font-weight="800" font-size="10" letter-spacing="1.5">${logo.tag}</text>
    <!-- 5. لافتة اسم الدفعة واللقب -->
    <polygon points="58,274 342,274 328,320 72,320" fill="${pal.b}" stroke="${pal.p}" stroke-width="3"/>

}

// تغيير اللون لأي شعار بضغطة زر
function cycleColor(id) {
  const logo = SELECTED_LOGOS.find(x => x.id === id);
  if (!logo) return;
  logo.p = (logo.p + 1) % PALETTES.length;
  const mTxt = mainInput.value || 'IT BATCH 26';
  const sTxt = subInput.value || 'ROOT ACCESS • SYSTEM ELITE';
  document.getElementById('wrap-' + id).innerHTML = buildSVG(logo, mTxt, sTxt);
  document.getElementById('pal-label-' + id).textContent = 'Theme: ' + PALETTES[logo.p].name;
}

mainInput.addEventListener('input', () => {
  document.querySelectorAll('.logo-main-text').forEach(el => el.textContent = mainInput.value || 'IT BATCH');
});
subInput.addEventListener('input', () => {
  document.querySelectorAll('.logo-sub-text').forEach(el => el.textContent = subInput.value || '');
});
searchBox.addEventListener('input', renderGallery);

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-cat]');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  renderGallery();
});

function downloadSVG(id, name) {
  const svgEl = document.getElementById('svg-' + id);
  const source = new XMLSerializer().serializeToString(svgEl);
  const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `VIP-Logo-${id}-${name}.svg`; a.click();
  URL.revokeObjectURL(url);
}

function downloadPNG(id, name) {
  const svgEl = document.getElementById('svg-' + id);
  const source = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  const url = URL.createObjectURL(new Blob([source], { type: 'image/svg+xml;charset=utf-8' }));
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = 2000; canvas.height = 2000;
    canvas.getContext('2d').drawImage(img, 0, 0, 2000, 2000);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `VIP-Logo-${id}-${name}.png`;
    a.click();
  };
  img.src = url;
}

renderGallery();
</script>
</body>
