       ["Principle: Knowing the potential impact of information systems and having the ability to put this knowledge to work can result in a successful personal career, organizations that reach their goals, and a society with a higher quality of life. Objective: Identify the basic types of business information systems and discuss who uses them, how they are used, and what kinds of benefits they deliver.","المبدأ: معرفة الأثر المحتمل لنظم المعلومات والقدرة على توظيفها يمكن أن تؤدي إلى مسيرة مهنية ناجحة ومنظمات تحقق أهدافها ومجتمع بجودة حياة أعلى. الهدف: تحديد الأنواع الأساسية لنظم معلومات الأعمال ومناقشة من يستخدمها وكيف تُستخدم وما الفوائد التي تقدمها."],
       ["Principle: System users, business managers, and information systems professionals must work together to build a successful information system. Objective: Identify the major steps of the systems development process and state the goal of each.","المبدأ: يجب أن يعمل مستخدمو النظام ومديرو الأعمال ومتخصصو نظم المعلومات معًا لبناء نظام معلومات ناجح. الهدف: تحديد الخطوات الرئيسية لعملية تطوير النظم وذكر هدف كل خطوة."],

   ]},
   {t:["Why Learn About Information Systems in Organizations?","لماذا نتعلم نظم المعلومات في المنظمات؟"], b:[

     {k:'p', x:["Information systems are indispensable tools to help you achieve your career goals.","نظم المعلومات أدوات لا غنى عنها لمساعدتك في تحقيق أهدافك المهنية."]}

       {t:["3. Business Applications","3. تطبيقات الأعمال (Business Applications)"], l:[["How information systems are applied to business problems is more complex than it might seem.","كيفية تطبيق نظم المعلومات على مشكلات الأعمال أكثر تعقيدًا مما قد يبدو."],["The informed end user learns how to use IS to solve existing problems and to begin using IS as a new way of defining problems and meeting business opportunities.","يتعلم المستخدم المطلع كيف يستخدم نظم المعلومات لحل المشكلات القائمة وكطريقة جديدة لتعريف المشكلات واغتنام فرص الأعمال."]]},
       {t:["4. Development Processes","4. عمليات التطوير (Development Processes)"], l:[["End users need to know the fundamental concepts of problem-solving and development.","يحتاج المستخدمون النهائيون إلى معرفة المفاهيم الأساسية لحل المشكلات والتطوير."],["They should become familiar with methodologies such as the systems approach, the systems development life cycle, and prototyping.","وعليهم التعرف على منهجيات مثل منهج النظم ودورة حياة تطوير النظم (Systems development life cycle) والنمذجة الأولية (Prototyping)."]]},

     {k:'tip', x:["Five areas: Foundation Concepts, Information Technology, Business Applications, Development Processes, Management Challenges.","خمسة مجالات: المفاهيم الأساسية، تقنية المعلومات، تطبيقات الأعمال، عمليات التطوير، التحديات الإدارية."]}

     {k:'ul', h:["Systems have three basic interacting functions:","للأنظمة ثلاث وظائف أساسية متفاعلة:"], x:[["Input","المدخلات (Input)"],["Processing","المعالجة (Processing)"],["Output","المخرجات (Output)"]]},

     {k:'def', x:["E-commerce is any business transaction executed electronically.","التجارة الإلكترونية (E-commerce) هي أي معاملة تجارية تُنفَّذ إلكترونيًا."]},
     {k:'ul', h:["E-commerce takes place between:","تحدث التجارة الإلكترونية بين:"], x:[["Companies (business-to-business, B2B)","الشركات (من شركة إلى شركة، B2B)"],["Companies and consumers (business-to-consumer, B2C)","الشركات والمستهلكين (B2C)"],["Consumers and other consumers (consumer-to-consumer, C2C)","المستهلكين ومستهلكين آخرين (C2C)"],["Business and the public sector","الأعمال والقطاع العام"],["Consumers and the public sector","المستهلكين والقطاع العام"]]},
     {k:'def', x:["Mobile commerce (m-commerce) is the use of mobile, wireless devices to place orders and conduct business.","تجارة الهاتف المحمول (M-commerce) هي استخدام الأجهزة اللاسلكية المحمولة لتقديم الطلبات وإجراء الأعمال."]},
     {k:'p', x:["E-commerce offers many opportunities for streamlining work activities.","توفر التجارة الإلكترونية فرصًا كثيرة لتبسيط أنشطة العمل."]},
     {k:'def', x:["Electronic business (e-business) uses information systems and the Internet to perform all business-related tasks and functions.","الأعمال الإلكترونية (E-business) تستخدم نظم المعلومات والإنترنت لأداء جميع المهام والوظائف المتعلقة بالأعمال."]}
   ]},
   {t:["Enterprise Systems: TPS and ERP","نظم المؤسسة: TPS و ERP"], b:[
     {k:'def', x:["A transaction is any business-related exchange, such as payments to employees and sales to customers.","المعاملة (Transaction) هي أي تبادل متعلق بالأعمال، مثل دفع الرواتب للموظفين والمبيعات للعملاء."]},
     {k:'def', x:["A transaction processing system (TPS) is an organized collection of people, procedures, software, databases, and devices used to perform and record completed business transactions.","نظام معالجة المعاملات (TPS) هو مجموعة منظمة من الأفراد والإجراءات والبرمجيات وقواعد البيانات والأجهزة تُستخدم لتنفيذ وتسجيل المعاملات التجارية المكتملة."]},
     {k:'def', x:["Enterprise Resource Planning (ERP) is a set of integrated programs that manages the vital business operations for an entire multisite, global organization.","تخطيط موارد المؤسسة (ERP) هو مجموعة برامج متكاملة تدير العمليات الحيوية لمنظمة عالمية متعددة المواقع بأكملها."]}
   ]},
   {t:["Information and Decision Support Systems","نظم المعلومات ودعم القرار"], b:[
     {k:'def', x:["A management information system (MIS) is an organized collection of people, procedures, software, databases, and devices that provides routine information to managers and decision makers.","نظام المعلومات الإدارية (MIS) هو مجموعة منظمة من الأفراد والإجراءات والبرمجيات وقواعد البيانات والأجهزة توفر معلومات روتينية للمديرين ومتخذي القرار."]},
     {k:'p', x:["Manufacturing, marketing, production, finance, and other functional areas are supported by MISs and are linked through a common database.","تدعم نظم MIS مجالات التصنيع والتسويق والإنتاج والمالية وغيرها، وترتبط عبر قاعدة بيانات مشتركة."]},
     {k:'def', x:["A decision support system (DSS) is an organized collection of people, procedures, software, databases, and devices that support problem-specific decision making.","نظام دعم القرار (DSS) هو مجموعة منظمة من الأفراد والإجراءات والبرمجيات وقواعد البيانات والأجهزة تدعم اتخاذ القرار الخاص بمشكلة محددة."]},
     {k:'ul', h:["A DSS can include:","قد يتضمن DSS:"], x:[["A collection of models used to support a decision maker or user (model base)","مجموعة نماذج لدعم متخذ القرار أو المستخدم (قاعدة النماذج Model base)"],["A collection of facts and information to assist in decision making (database)","مجموعة حقائق ومعلومات للمساعدة في اتخاذ القرار (قاعدة البيانات)"],["Systems and procedures (user interface or dialogue manager) that help decision makers and other users interact with the DSS","أنظمة وإجراءات (واجهة المستخدم أو مدير الحوار Dialogue manager) تساعد على التفاعل مع DSS"]]}
   ]},
   {t:["Specialized Business Information Systems","نظم معلومات الأعمال المتخصصة"], b:[
     {k:'def', x:["Knowledge management systems (KMS) are organized collections of people, procedures, software, databases, and devices to create, store, share, and use the organization's knowledge and experience.","نظم إدارة المعرفة (KMS) هي مجموعات منظمة من الأفراد والإجراءات والبرمجيات وقواعد البيانات والأجهزة لإنشاء معرفة المنظمة وخبرتها وتخزينها ومشاركتها واستخدامها."]},
     {k:'def', x:["Artificial intelligence (AI): a computer system takes on characteristics of human intelligence.","الذكاء الاصطناعي (AI): نظام حاسوبي يكتسب خصائص الذكاء البشري."]},
     {k:'ul', h:["AI includes:","يشمل الذكاء الاصطناعي:"], x:[["Robotics and nanobots","الروبوتات والروبوتات النانوية (Nanobots)"],["Vision systems","أنظمة الرؤية (Vision systems)"],["Natural language processing","معالجة اللغة الطبيعية (Natural language processing)"],["Learning systems","أنظمة التعلم (Learning systems)"],["Neural networks","الشبكات العصبية (Neural networks)"]]},
     {k:'def', x:["Expert systems give the computer the ability to make suggestions and function like an expert in a particular field.","نظم الخبرة (Expert systems) تمنح الحاسوب القدرة على تقديم اقتراحات والعمل كخبير في مجال معين."]},
     {k:'def', x:["Virtual reality is a simulation of a real or imagined environment that can be experienced visually in three dimensions.","الواقع الافتراضي (Virtual reality) محاكاة لبيئة حقيقية أو متخيلة يمكن اختبارها بصريًا بثلاثة أبعاد."]},
     {k:'p', x:["Augmented reality superimposes digital data over photos or images.","الواقع المعزز (Augmented reality) يضيف بيانات رقمية فوق الصور."]},
     {k:'p', x:["Multimedia can include photos and images, the manipulation of sound, and special 3D effects.","الوسائط المتعددة (Multimedia) قد تشمل الصور ومعالجة الصوت والمؤثرات ثلاثية الأبعاد."]}
   ]},
   {t:["Systems Development","تطوير النظم (Systems Development)"], b:[
     {k:'def', x:["Systems development is the activity of creating or modifying existing business systems.","تطوير النظم هو نشاط إنشاء نظم الأعمال أو تعديل القائمة منها."]},
     {k:'def', x:["Outsourcing allows a company to focus on what it does best and delegate other functions to companies with expertise in systems development. System development is often outsourced.","الاستعانة بمصادر خارجية (Outsourcing) تتيح للشركة التركيز على ما تجيده وتفويض الوظائف الأخرى لشركات متخصصة في تطوير النظم. وغالبًا ما يُسند تطوير النظم لجهات خارجية."]}
   ]},
   {t:["Organizations and Information Systems","المنظمات ونظم المعلومات"], b:[
     {k:'def', x:["An organization is a formal collection of people and other resources established to accomplish a set of goals. It constantly uses money, people, materials, machines and other equipment, data, information, and decisions.","المنظمة (Organization) مجموعة رسمية من الأفراد والموارد الأخرى أُنشئت لتحقيق مجموعة أهداف. وهي تستخدم باستمرار المال والأفراد والمواد والآلات والمعدات والبيانات والمعلومات والقرارات."]},
     {k:'p', x:["Providing value to a stakeholder is the primary goal of any organization.","تقديم القيمة لصاحب المصلحة (Stakeholder) هو الهدف الأساسي لأي منظمة."]},
     {k:'def', x:["Value chain: a series (chain) of activities that includes inbound logistics and warehouse and storage, production and manufacturing, finished product storage, outbound logistics, marketing and sales, and customer service.","سلسلة القيمة (Value chain): سلسلة أنشطة تشمل اللوجستيات الواردة والمستودعات والتخزين، الإنتاج والتصنيع، تخزين المنتج النهائي، اللوجستيات الصادرة، التسويق والمبيعات، وخدمة العملاء."]},
     {k:'ul', h:["Supply chain management (SCM) determines:","إدارة سلسلة الإمداد (SCM) تحدد:"], x:[["What supplies are required for the value chain","ما الإمدادات المطلوبة لسلسلة القيمة"],["What quantities are needed to meet customer demand","ما الكميات اللازمة لتلبية طلب العملاء"],["How supplies should be processed into finished goods and services","كيف تُحوَّل الإمدادات إلى سلع وخدمات نهائية"],["How shipment of supplies and products to customers should be scheduled, monitored, and controlled","كيف تُجدول وتُراقب وتُضبط عملية شحن الإمدادات والمنتجات للعملاء"]]},
     {k:'def', x:["Customer relationship management (CRM) programs help companies manage all aspects of customer encounters including marketing and advertising, sales, customer service after the sale, and programs to retain loyal customers.","برامج إدارة علاقات العملاء (CRM) تساعد الشركات على إدارة جميع جوانب التعامل مع العملاء بما فيها التسويق والإعلان والمبيعات وخدمة ما بعد البيع وبرامج الاحتفاظ بالعملاء المخلصين."]},
     {k:'p', x:["CRM software can be purchased as a service and delivered over the Internet or can be installed on corporate computers.","يمكن شراء برنامج CRM كخدمة تُقدَّم عبر الإنترنت أو تثبيته على حواسيب الشركة."]},
     {k:'def', x:["Innovation: organizations continuously improve their operations by looking for fresh, new ideas.","الابتكار (Innovation): تحسّن المنظمات عملياتها باستمرار بالبحث عن أفكار جديدة."]},
     {k:'ul', x:[["Can bring cutting-edge products and services that create new revenue streams","قد يأتي بمنتجات وخدمات متطورة تخلق مصادر إيرادات جديدة"],["Can explore new markets and business approaches","يمكن استكشاف أسواق وأساليب أعمال جديدة"],["Some IS departments are creating separate groups to explore new, innovative ideas","بعض أقسام نظم المعلومات تنشئ مجموعات منفصلة لاستكشاف الأفكار المبتكرة"]]}
   ]},
   {t:["Organizational Culture and Change","ثقافة المنظمة والتغيير"], b:[
     {k:'cards', c:[
       {t:["Culture","الثقافة (Culture)"], l:[["A set of major understandings and assumptions shared by a group.","مجموعة من التفاهمات والافتراضات الرئيسية يشترك فيها مجموعة."]]},
       {t:["Organizational culture","ثقافة المنظمة (Organizational culture)"], l:[["Major understandings and assumptions of the organization.","التفاهمات والافتراضات الرئيسية في المنظمة."],["May not be formally stated or documented.","قد لا تكون مصرحًا بها أو موثقة رسميًا."]]},
       {t:["Organizational change","التغيير التنظيمي (Organizational change)"], l:[["How organizations plan for, implement, and handle change.","كيف تخطط المنظمات للتغيير وتنفذه وتتعامل معه."]]}
     ]}
   ]},
   {t:["User Satisfaction and Technology Acceptance","رضا المستخدم وقبول التقنية"], b:[
     {k:'def', x:["The technology acceptance model (TAM) specifies the factors that can lead to better attitudes about the information system, along with higher acceptance and usage.","نموذج قبول التقنية (TAM) يحدد العوامل التي قد تؤدي إلى مواقف أفضل تجاه نظام المعلومات وقبول واستخدام أعلى."]},
     {k:'ul', h:["Factors include:","تشمل العوامل:"], x:[["Perceived usefulness","الفائدة المدركة (Perceived usefulness)"],["Ease of use","سهولة الاستخدام (Ease of use)"],["Quality","الجودة (Quality)"],["Degree to which the organization supports its use","درجة دعم المنظمة لاستخدامه"]]}
   ]},
   {t:["Competitive Advantage","الميزة التنافسية (Competitive Advantage)"], b:[
     {k:'def', x:["Competitive advantage is a significant and (ideally) long-term benefit to a company over its competition.","الميزة التنافسية فائدة كبيرة و(مثاليًا) طويلة الأمد للشركة على منافسيها."]},
     {k:'ul', x:[["Can result in higher-quality products, better customer service, and lower costs","قد تؤدي إلى منتجات أعلى جودة وخدمة عملاء أفضل وتكاليف أقل"],["An organization often uses its information systems to help gain a competitive advantage","غالبًا تستخدم المنظمة نظم معلوماتها للمساعدة في تحقيق ميزة تنافسية"]]},
     {k:'ul', h:["Porter's competitive forces model (factors that lead firms to seek competitive advantage):","نموذج بورتر للقوى التنافسية (العوامل التي تدفع الشركات للسعي للميزة التنافسية):"], x:[["Rivalry among existing competitors","التنافس بين المنافسين الحاليين"],["Threat of new entrants","تهديد الداخلين الجدد"],["Threat of substitute products and services","تهديد المنتجات والخدمات البديلة"],["Bargaining power of buyers","القوة التفاوضية للمشترين"],["Bargaining power of suppliers","القوة التفاوضية للموردين"]]},
     {k:'p', x:["The more these forces combine in any instance, the more likely firms will seek competitive advantage.","كلما اجتمعت هذه القوى أكثر في حالة ما، زاد احتمال سعي الشركات إلى الميزة التنافسية."]},
     {k:'tip', x:["Porter's five forces: rivalry, new entrants, substitutes, buyers' power, suppliers' power.","قوى بورتر الخمس: التنافس، الداخلون الجدد، البدائل، قوة المشترين، قوة الموردين."]},
     {k:'ul', h:["Strategic planning for competitive advantage - strategies:","التخطيط الاستراتيجي للميزة التنافسية - الاستراتيجيات:"], x:[["Cost leadership","قيادة التكلفة (Cost leadership)"],["Differentiation","التمايز (Differentiation)"],["Niche strategy","استراتيجية الشريحة المتخصصة (Niche strategy)"],["Altering the industry structure","تغيير هيكل الصناعة"],["Creating new products and services","ابتكار منتجات وخدمات جديدة"],["Improving existing product lines and service","تحسين خطوط المنتجات والخدمات الحالية"]]},
     {k:'ul', h:["Other strategies:","استراتيجيات أخرى:"], x:[["Growth in sales","نمو المبيعات"],["First to market","الأسبقية في دخول السوق (First to market)"],["Customizing products and services","تخصيص المنتجات والخدمات"],["Hiring the best people","توظيف أفضل الكفاءات"],["Innovation","الابتكار"]]}
   ]},
   {t:["Performance-Based Information Systems and ROI","نظم المعلومات المبنية على الأداء والعائد على الاستثمار"], b:[
     {k:'ul', h:["Major stages in the use of information systems:","المراحل الرئيسية في استخدام نظم المعلومات:"], x:[["Cost reduction and productivity","خفض التكاليف والإنتاجية"],["Competitive advantage","الميزة التنافسية"],["Performance-based management","الإدارة المبنية على الأداء"]]},
     {k:'def', x:["Return on investment (ROI) is one measure of IS value. It investigates the additional profits or benefits generated as a percentage of the investment in IS technology.","العائد على الاستثمار (ROI) أحد مقاييس قيمة نظم المعلومات. ويقيس الأرباح أو الفوائد الإضافية المتولدة كنسبة مئوية من الاستثمار في تقنية نظم المعلومات."]},
     {k:'cards', c:[
       {t:["Earnings growth","نمو الأرباح (Earnings growth)"], l:[["The increase in profit that the system brings.","الزيادة في الربح التي يحققها النظام."]]},
       {t:["Market share and speed to market","الحصة السوقية وسرعة الوصول للسوق"], l:[["The percentage of sales that a product or service has in relation to the total market.","نسبة مبيعات المنتج أو الخدمة إلى إجمالي السوق."]]},
       {t:["Customer awareness and satisfaction","وعي العملاء ورضاهم"], l:[["Performance measurement is based on feedback from internal and external users.","يعتمد قياس الأداء على ملاحظات المستخدمين الداخليين والخارجيين."]]},
       {t:["Total cost of ownership (TCO)","التكلفة الإجمالية للملكية (TCO)"], l:[["The sum of all costs over the life of the information system.","مجموع كل التكاليف على مدى عمر نظام المعلومات."]]}
     ]}
   ]},
   {t:["Risk","المخاطر (Risk)"], b:[
     {k:'p', x:["Managers must consider the risks of designing, developing, and implementing systems.","يجب على المديرين مراعاة مخاطر تصميم النظم وتطويرها وتنفيذها."]},
     {k:'p', x:["Information systems can sometimes be costly failures.","قد تكون نظم المعلومات أحيانًا إخفاقات مكلفة."]}
   ]},
   {t:["Careers in Information Systems","المسارات المهنية في نظم المعلومات"], b:[
     {k:'ul', x:[["Career opportunities in IS are expected to increase and IS budgets expected to surge.","من المتوقع أن تزداد فرص العمل في نظم المعلومات وترتفع ميزانياتها."],["Mobile applications will be a key factor in this surge.","ستكون تطبيقات الهاتف المحمول عاملًا رئيسيًا في هذا الارتفاع."],["IS workers need communication skills, detailed knowledge of the organization, and understanding of how information systems can help the organization achieve its goals.","يحتاج العاملون في نظم المعلومات إلى مهارات تواصل ومعرفة تفصيلية بالمنظمة وفهم لكيفية مساعدة النظم في تحقيق أهدافها."]]},
     {k:'cards', c:[
       {t:["Operations","التشغيل (Operations)"], l:[["System operators primarily run and maintain IS equipment.","يقوم مشغلو النظم أساسًا بتشغيل معدات نظم المعلومات وصيانتها."]]},
       {t:["Systems development","تطوير النظم"], l:[["Focuses on specific development projects and ongoing maintenance and review.","يركز على مشاريع تطوير محددة والصيانة والمراجعة المستمرة."]]},
       {t:["Support","الدعم (Support)"], l:[["Provides user assistance in hardware and software acquisition and use, data administration, user training and assistance, and Web administration.","يوفر مساعدة المستخدمين في اقتناء الأجهزة والبرمجيات واستخدامها وإدارة البيانات وتدريب المستخدمين ومساعدتهم وإدارة الويب."]]},
       {t:["Information service units","وحدات خدمات المعلومات"], l:[["A miniature IS department attached and directly reporting to a functional area in a large organization.","قسم نظم معلومات مصغر ملحق بمجال وظيفي ويتبعه مباشرة في منظمة كبيرة."]]}
     ]},
     {k:'ul', h:["Other IS careers: new and exciting careers have developed in:","مسارات أخرى: ظهرت مسارات جديدة ومثيرة في:"], x:[["IS consulting, training, sales, repair, IS customer service, and IS entrepreneurs","الاستشارات والتدريب والمبيعات والإصلاح وخدمة عملاء نظم المعلومات وريادة الأعمال"],["Employment by technology companies such as Microsoft, Google, Dell, and many others","العمل لدى شركات التقنية مثل Microsoft وGoogle وDell وغيرها"]]}
   ]},
   {t:["Global Challenges in Information Systems","التحديات العالمية في نظم المعلومات"], b:[
     {k:'ul', x:[["Cultural and language challenges","تحديات ثقافية ولغوية"],["Time and distance challenges","تحديات الزمن والمسافة"],["Infrastructure challenges","تحديات البنية التحتية"],["Currency challenges","تحديات العملات"],["Product and service challenges","تحديات المنتجات والخدمات"],["Technology transfer issues","قضايا نقل التقنية"],["State, regional, and national laws","القوانين المحلية والإقليمية والوطنية"],["Trade agreements","اتفاقيات التجارة"]]}
   ]}
  ],
  take:[
   ["E-commerce types: B2B, B2C, C2C, business-public sector, consumer-public sector. M-commerce uses mobile devices; e-business covers all business tasks online.","أنواع التجارة الإلكترونية: B2B وB2C وC2C والأعمال-القطاع العام والمستهلك-القطاع العام. M-commerce بالأجهزة المحمولة؛ E-business تغطي كل مهام الأعمال."],
   ["TPS records transactions, MIS gives routine information, DSS supports problem-specific decisions, ERP integrates all operations.","TPS يسجل المعاملات، MIS يوفر معلومات روتينية، DSS يدعم قرارات محددة، ERP يدمج كل العمليات."],
   ["Porter's five forces: rivalry, new entrants, substitutes, buyers, suppliers.","قوى بورتر الخمس: التنافس، الداخلون الجدد، البدائل، المشترون، الموردون."],
   ["TAM factors: perceived usefulness, ease of use, quality, organizational support.","عوامل TAM: الفائدة المدركة، سهولة الاستخدام، الجودة، دعم المنظمة."],
   ["ROI = additional profits/benefits as a percentage of the IS investment; TCO = all costs over the system's life.","ROI = الأرباح/الفوائد الإضافية كنسبة من استثمار النظم؛ TCO = كل التكاليف على عمر النظام."]
  ],
  fc:[
   [["What is e-commerce? Name its types.","ما التجارة الإلكترونية؟ اذكر أنواعها."],["Any business transaction executed electronically: B2B, B2C, C2C, business and public sector, consumers and public sector.","أي معاملة تجارية إلكترونية: B2B وB2C وC2C والأعمال والقطاع العام والمستهلكون والقطاع العام."]],
   [["M-commerce vs e-business?","M-commerce مقابل E-business؟"],["M-commerce: using mobile, wireless devices to place orders and conduct business. E-business: using information systems and the Internet for all business-related tasks and functions.","M-commerce: استخدام الأجهزة اللاسلكية المحمولة للطلب وإجراء الأعمال. E-business: استخدام نظم المعلومات والإنترنت لكل المهام والوظائف التجارية."]],
   [["What is a transaction? What is a TPS?","ما المعاملة؟ وما نظام TPS؟"],["Transaction: any business-related exchange (e.g., payments to employees, sales to customers). TPS: people, procedures, software, databases and devices used to perform and record completed business transactions.","المعاملة: أي تبادل تجاري (مثل رواتب الموظفين ومبيعات العملاء). TPS: أفراد وإجراءات وبرمجيات وقواعد بيانات وأجهزة لتنفيذ وتسجيل المعاملات المكتملة."]],
   [["What is ERP?","ما هو ERP؟"],["A set of integrated programs that manages the vital business operations for an entire multisite, global organization.","مجموعة برامج متكاملة تدير العمليات الحيوية لمنظمة عالمية متعددة المواقع."]],
   [["What is an MIS?","ما هو MIS؟"],["An organized collection of people, procedures, software, databases and devices that provides routine information to managers and decision makers; functional areas are linked through a common database.","مجموعة منظمة من الأفراد والإجراءات والبرمجيات وقواعد البيانات والأجهزة توفر معلومات روتينية للمديرين؛ وتُربط المجالات الوظيفية بقاعدة بيانات مشتركة."]],
   [["What is a DSS and its components?","ما هو DSS ومكوناته؟"],["Supports problem-specific decision making. May include a model base, a database, and a user interface (dialogue manager).","يدعم اتخاذ قرار خاص بمشكلة. قد يضم قاعدة نماذج وقاعدة بيانات وواجهة مستخدم (مدير الحوار)."]],
   [["What is a KMS?","ما هو KMS؟"],["An organized collection of people, procedures, software, databases and devices to create, store, share and use the organization's knowledge and experience.","مجموعة منظمة من الأفراد والإجراءات والبرمجيات وقواعد البيانات والأجهزة لإنشاء معرفة المنظمة وتخزينها ومشاركتها واستخدامها."]],
   [["What is AI and what does it include?","ما الذكاء الاصطناعي وماذا يشمل؟"],["A computer system takes on characteristics of human intelligence: robotics and nanobots, vision systems, natural language processing, learning systems, neural networks.","نظام حاسوبي يكتسب خصائص الذكاء البشري: الروبوتات، أنظمة الرؤية، معالجة اللغة الطبيعية، أنظمة التعلم، الشبكات العصبية."]],
   [["Expert systems vs virtual reality vs augmented reality?","نظم الخبرة مقابل الواقع الافتراضي مقابل المعزز؟"],["Expert systems: make suggestions like an expert. VR: simulation of a real/imagined environment in 3D. AR: superimposes digital data over photos or images.","نظم الخبرة: تقترح كخبير. VR: محاكاة بيئة حقيقية/متخيلة ثلاثية الأبعاد. AR: يضيف بيانات رقمية فوق الصور."]],
   [["What is systems development and outsourcing?","ما تطوير النظم والاستعانة بمصادر خارجية؟"],["Development: creating or modifying existing business systems. Outsourcing: delegating functions to companies with expertise so the firm focuses on what it does best.","التطوير: إنشاء النظم أو تعديلها. الاستعانة: تفويض الوظائف لشركات متخصصة ليركز العمل على ما يجيده."]],
   [["What is the value chain?","ما سلسلة القيمة؟"],["A chain of activities: inbound logistics and warehouse/storage, production/manufacturing, finished product storage, outbound logistics, marketing and sales, customer service.","سلسلة أنشطة: لوجستيات واردة ومستودعات، إنتاج وتصنيع، تخزين المنتج النهائي، لوجستيات صادرة، تسويق ومبيعات، خدمة عملاء."]],
   [["What does SCM determine?","ماذا تحدد SCM؟"],["Supplies required, quantities needed to meet demand, how supplies become finished goods/services, and how shipments are scheduled, monitored and controlled.","الإمدادات المطلوبة، الكميات لتلبية الطلب، كيفية تحويلها لسلع وخدمات، وكيفية جدولة الشحن ومراقبته وضبطه."]],
   [["What is CRM?","ما هو CRM؟"],["Programs that help manage all customer encounters: marketing, advertising, sales, after-sale service, and retaining loyal customers. Can be a service over the Internet or installed on corporate computers.","برامج تدير كل التعامل مع العملاء: التسويق والإعلان والمبيعات وخدمة ما بعد البيع والاحتفاظ بالعملاء. قد تكون خدمة عبر الإنترنت أو مثبتة على حواسيب الشركة."]],
   [["What is TAM and its factors?","ما هو TAM وعوامله؟"],["Technology acceptance model: perceived usefulness, ease of use, quality, and organizational support lead to better attitudes, acceptance and usage.","نموذج قبول التقنية: الفائدة المدركة وسهولة الاستخدام والجودة ودعم المنظمة تقود لمواقف أفضل وقبول واستخدام أعلى."]],
   [["Name Porter's five competitive forces and the competitive strategies.","اذكر قوى بورتر الخمس والاستراتيجيات التنافسية."],["Forces: rivalry, new entrants, substitutes, buyers' power, suppliers' power. Strategies: cost leadership, differentiation, niche, altering industry structure, new products, improving existing lines; also growth in sales, first to market, customization, best people, innovation.","القوى: التنافس، الداخلون الجدد، البدائل، قوة المشترين، قوة الموردين. الاستراتيجيات: قيادة التكلفة، التمايز، الشريحة، تغيير هيكل الصناعة، منتجات جديدة، تحسين القائم؛ ونمو المبيعات، السبق للسوق، التخصيص، أفضل الكفاءات، الابتكار."]],
   [["What are ROI, earnings growth, market share and TCO?","ما ROI ونمو الأرباح والحصة السوقية وTCO؟"],["ROI: additional profits/benefits as a % of IS investment. Earnings growth: increase in profit. Market share: % of total market sales. TCO: sum of all costs over the system's life.","ROI: أرباح/فوائد إضافية كنسبة من الاستثمار. نمو الأرباح: زيادة الربح. الحصة السوقية: نسبة المبيعات من السوق. TCO: مجموع التكاليف على عمر النظام."]],
   [["Name the IS roles and the global challenges.","اذكر أدوار نظم المعلومات والتحديات العالمية."],["Roles: operations, systems development, support, information service units. Challenges: culture/language, time/distance, infrastructure, currency, product/service, technology transfer, laws, trade agreements.","الأدوار: التشغيل، تطوير النظم، الدعم، وحدات خدمات المعلومات. التحديات: الثقافة واللغة، الزمن والمسافة، البنية التحتية، العملات، المنتجات والخدمات، نقل التقنية، القوانين، اتفاقيات التجارة."]]
  ],

  sec:[
   {t:["Case Study: Stan, BRJ and the Bead Bar","دراسة حالة: Stan وBRJ وBead Bar"], b:[
     {k:'ul', h:["Introducing Stan & BRJ","تعريف بـ Stan وBRJ"], x:[
       ["Stan L. lives and works in a digital world: digital house, digital paper, portable digital communications everywhere.","يعيش Stan L. ويعمل في عالم رقمي: منزل رقمي وورق رقمي واتصالات رقمية محمولة في كل مكان."],
       ["Stan owns BRJ Consulting: a completely digital company with no offices.","يملك Stan شركة BRJ Consulting: شركة رقمية بالكامل بلا مكاتب."],
       ["Stan and BRJ have a new client - the Bead Bar.","لدى Stan وBRJ عميل جديد: Bead Bar."]]},
     {k:'ul', h:["Information at the Bead Bar","المعلومات في Bead Bar"], x:[
       ["Founded in 1998 by Meredith S.","أسستها Meredith S. عام 1998."],

       ["Three divisions: Studios (six), Franchises (five), Bead Bar on Board.","ثلاثة أقسام: الاستوديوهات (ستة)، الامتيازات Franchises (خمسة)، وBead Bar on Board."],

     {k:'ul', h:["Paper forms are inefficient for the current size of the Bead Bar:","النماذج الورقية غير كفؤة لحجم Bead Bar الحالي:"], x:[["Lost orders","طلبات مفقودة"],["Incorrect invoicing","فواتير غير صحيحة"],["Fulfillment delays","تأخر التنفيذ"]]},

   {t:["The Nature of the Digital World","طبيعة العالم الرقمي"], b:[
     {k:'ul', h:["Six major characteristics:","ست خصائص رئيسية:"], x:[["Globalization","العولمة (Globalization)"],["The digitization of goods","رقمنة السلع (Digitization of goods)"],["Speed","السرعة (Speed)"],["The merger of products and services","اندماج المنتجات والخدمات"],["The role of ideas","دور الأفكار"],["New markets and pricing","أسواق وتسعير جديدة"]]}
   ]},
   {t:["Globalization","العولمة (Globalization)"], b:[
     {k:'def', x:["Globalization is the system of interconnected economies, based on capital markets and characterized by the use of technology.","العولمة هي نظام من الاقتصادات المترابطة، قائم على أسواق رأس المال ويتميز باستخدام التقنية."]},
     {k:'p', x:["It presents opportunities for growth.","توفر فرصًا للنمو."]},
     {k:'ul', h:["It requires an understanding of:","وتتطلب فهم:"], x:[["Local customs","العادات المحلية"],["Local laws","القوانين المحلية"],["Regulations of foreign countries","لوائح الدول الأجنبية"]]},
     {k:'p', x:["Globalization allows businesses to operate internationally, utilizing digital technologies to reach global markets, streamline operations, and enhance collaboration across borders.","تتيح العولمة للشركات العمل دوليًا باستخدام التقنيات الرقمية للوصول إلى الأسواق العالمية وتبسيط العمليات وتعزيز التعاون عبر الحدود."]}
   ]},
   {t:["The Digitization of Goods","رقمنة السلع"], b:[
     {k:'p', x:["It is a change in the format of many creative products.","هو تغير في شكل كثير من المنتجات الإبداعية."]},
     {k:'ul', x:[["MP3s and DVDs","ملفات MP3 وأقراص DVD"],["Software: download virus protection files automatically to protect your computer","البرمجيات: تنزيل ملفات الحماية من الفيروسات تلقائيًا لحماية حاسوبك"],["Digital documents: newspapers (NYTimes) and electronic library databases","المستندات الرقمية: الصحف (NYTimes) وقواعد بيانات المكتبات الإلكترونية"]]},
     {k:'def', x:["The digitization of goods involves converting physical products into digital formats or creating digital versions of goods that can be easily distributed and consumed online. This includes e-books, digital music, online software, and streaming media.","رقمنة السلع تعني تحويل المنتجات المادية إلى صيغ رقمية أو إنشاء نسخ رقمية منها يسهل توزيعها واستهلاكها عبر الإنترنت. وتشمل الكتب الإلكترونية والموسيقى الرقمية والبرمجيات عبر الإنترنت والوسائط المتدفقة (Streaming)."]},
     {k:'p', x:["The digitization process enhances accessibility, reduces costs, and enables businesses to innovate and provide new services.","تعزز الرقمنة سهولة الوصول وتخفض التكاليف وتمكّن الشركات من الابتكار وتقديم خدمات جديدة."]}
   ]},
   {t:["Speed","السرعة (Speed)"], b:[
     {k:'ul', h:["Digital availability includes the expectation of rapid availability and delivery:","تتضمن الإتاحة الرقمية توقع التوافر والتسليم السريعين:"], x:[["Anytime","في أي وقت"],["Any place","في أي مكان"],["Speed of change","سرعة التغيير"]]},
     {k:'p', x:["Speed refers to the rapid pace at which information, products, and services are created, processed, and delivered in today's digital economy.","تشير السرعة إلى الوتيرة السريعة التي تُنشأ وتُعالج وتُسلَّم بها المعلومات والمنتجات والخدمات في الاقتصاد الرقمي اليوم."]},
     {k:'p', x:["With advancements in information technology, businesses can respond quickly to market changes, customer demands, and competitive pressures, leading to shorter product development cycles and faster delivery times.","مع تطور تقنية المعلومات تستطيع الشركات الاستجابة بسرعة لتغيرات السوق ومطالب العملاء والضغوط التنافسية، مما يقصّر دورات تطوير المنتجات ويسرّع التسليم."]}
   ]},
   {t:["The Merger of Products and Services","اندماج المنتجات والخدمات"], b:[
     {k:'p', x:["It is the blending of tangible products with intangible services; the service becomes a product.","هو مزج المنتجات الملموسة بالخدمات غير الملموسة؛ فتصبح الخدمة منتجًا."]},
     {k:'def', x:["The merger of products and services is the integration of tangible goods with intangible services, creating hybrid offerings that enhance customer value.","اندماج المنتجات والخدمات هو دمج السلع الملموسة بالخدمات غير الملموسة لإنشاء عروض هجينة تعزز قيمة العميل."]},
     {k:'ex', x:["A company might sell a smartphone (product) while also providing software updates, customer support, and cloud storage services (services). This reflects a shift towards holistic solutions that address customer needs beyond just the physical product.","قد تبيع شركة هاتفًا ذكيًا (منتج) وتقدم معه تحديثات برمجية ودعم عملاء وتخزينًا سحابيًا (خدمات). ويعكس ذلك التحول نحو حلول شاملة تلبي احتياجات العميل أبعد من المنتج المادي."]}
   ]},
   {t:["The Role of Ideas","دور الأفكار"], b:[
     {k:'p', x:["The role of ideas highlights the importance of innovation, creativity, and intellectual property in driving business success in the digital age.","يبرز دور الأفكار أهمية الابتكار والإبداع والملكية الفكرية (Intellectual property) في دفع نجاح الأعمال في العصر الرقمي."]},
     {k:'p', x:["In information systems, new ideas can lead to the development of disruptive technologies, business models, and processes that challenge traditional practices and create competitive advantages.","في نظم المعلومات قد تقود الأفكار الجديدة إلى تقنيات ونماذج أعمال وعمليات مُغيِّرة تتحدى الممارسات التقليدية وتخلق مزايا تنافسية."]},
     {k:'p', x:["New ideas are at the heart of IT innovations. Digitalization makes theft much easier: web-site design, digital images, digital content.","الأفكار الجديدة في صميم ابتكارات تقنية المعلومات. والرقمنة تجعل السرقة أسهل بكثير: تصميم المواقع والصور الرقمية والمحتوى الرقمي."]},
     {k:'ul', h:["Protection of intellectual property:","حماية الملكية الفكرية:"], x:[["Patents","براءات الاختراع (Patents)"],["Copyrights","حقوق النشر (Copyrights)"],["Digital watermarks (Digimarc)","العلامات المائية الرقمية (Digital watermarks) مثل Digimarc"],["Trademarks","العلامات التجارية (Trademarks)"],["Trade secrets","الأسرار التجارية (Trade secrets)"]]}
   ]},
   {t:["New Markets and Pricing","أسواق وتسعير جديدة"], b:[
     {k:'p', x:["New markets are emerging opportunities for businesses to expand their reach, often driven by globalization, digitalization, and changes in consumer behavior.","الأسواق الجديدة فرص ناشئة لتوسيع نطاق الشركات، غالبًا بدافع العولمة والرقمنة وتغير سلوك المستهلك."]},
     {k:'p', x:["New pricing strategies, such as subscription models or dynamic pricing, are often adopted to capitalize on these markets, allowing businesses to attract diverse customer segments and optimize revenue streams.","كثيرًا ما تُعتمد استراتيجيات تسعير جديدة، مثل نماذج الاشتراك والتسعير الديناميكي (Dynamic pricing)، للاستفادة من هذه الأسواق وجذب شرائح عملاء متنوعة وتحسين مصادر الإيرادات."]},
     {k:'ul', h:["Digital markets have created new businesses:","أنشأت الأسواق الرقمية أعمالًا جديدة:"], x:[["Travel: Orbitz, Expedia","السفر: Orbitz وExpedia"],["Customer-to-customer exchanges and auctions: eBay, Yahoo auctions","تبادل المستهلكين والمزادات: eBay ومزادات Yahoo"],["Financial: Fidelity, eTrade","الخدمات المالية: Fidelity وeTrade"]]}
   ]},
   {t:["Information Systems in Organizations","نظم المعلومات في المنظمات"], b:[
     {k:'def', x:["An information system is a set of interrelated information technologies that work together to process, store, collect, and distribute information. Major parts: hardware, software, databases, networks.","نظام المعلومات هو مجموعة من تقنيات المعلومات المترابطة التي تعمل معًا لمعالجة المعلومات وتخزينها وجمعها وتوزيعها. الأجزاء الرئيسية: الأجهزة والبرمجيات وقواعد البيانات والشبكات."]},
     {k:'def', x:["An organization is an administrative and functional structure applied to people working toward a specific goal.","المنظمة هي هيكل إداري ووظيفي يُطبَّق على أفراد يعملون لتحقيق هدف محدد."]},
     {k:'ul', h:["Understanding the organization's IT needs means understanding its administrative and functional structure:","فهم احتياجات المنظمة من تقنية المعلومات يعني فهم هيكلها الإداري والوظيفي:"], x:[["Hierarchical","هرمي (Hierarchical)"],["Matrix","مصفوفي (Matrix)"],["Other","أخرى"]]}
   ]},
   {t:["Administrative Information Systems (AIS)","نظم المعلومات الإدارية (AIS)"], b:[
     {k:'def', x:["Administrative Information Systems refer to the systems that support the administration and management of an organization's operations. They play a critical role in the efficient handling of data and processes, enabling better decision-making, communication, and overall organizational performance.","نظم المعلومات الإدارية هي النظم التي تدعم إدارة عمليات المنظمة. وتؤدي دورًا حاسمًا في المعالجة الكفؤة للبيانات والعمليات وتمكّن من اتخاذ قرارات وتواصل وأداء تنظيمي أفضل."]},
     {k:'ul', h:["Types of administrative IS:","أنواع نظم المعلومات الإدارية:"], x:[["Transaction Processing Systems (TPS)","نظم معالجة المعاملات (TPS)"],["Office Automation Systems (OAS)","نظم أتمتة المكاتب (OAS)"],["Knowledge Work Systems (KWS)","نظم عمل المعرفة (KWS)"],["Management Information Systems (MIS)","نظم المعلومات الإدارية (MIS)"],["Decision Support Systems (DSS)","نظم دعم القرار (DSS)"],["Executive Information Systems (EIS)","نظم معلومات الإدارة العليا (EIS)"],["InterOrganizational Systems (IOS)","النظم بين المنظمات (IOS)"]]}
   ]},
   {t:["Functional Information Systems (FIS)","نظم المعلومات الوظيفية (FIS)"], b:[
     {k:'def', x:["Functional Information Systems are specialized information systems designed to support specific business functions within an organization. Each system focuses on enhancing the efficiency, effectiveness, and productivity of its respective area, such as finance, human resources, marketing, production, and customer service.","نظم المعلومات الوظيفية نظم متخصصة مصممة لدعم وظائف أعمال محددة داخل المنظمة. يركز كل نظام على تعزيز كفاءة وفعالية وإنتاجية مجاله، مثل المالية والموارد البشرية والتسويق والإنتاج وخدمة العملاء."]},
     {k:'ul', h:["Types of functional IS:","أنواع نظم المعلومات الوظيفية:"], x:[["Finance and Accounting Systems","نظم المالية والمحاسبة"],["Marketing and Sales Systems","نظم التسويق والمبيعات"],["Manufacturing and Operations Systems","نظم التصنيع والعمليات"],["Human Resources Management Systems","نظم إدارة الموارد البشرية"]]},
     {k:'p', x:["Administrative and functional information systems interact with each other within the organization.","تتفاعل نظم المعلومات الإدارية والوظيفية مع بعضها داخل المنظمة."]}
   ]},
   {t:["Working in the Digital World","العمل في العالم الرقمي"], b:[
     {k:'p', x:["The digital world caused major changes in business and in the ways individuals work.","أحدث العالم الرقمي تغييرات كبرى في الأعمال وفي طرق عمل الأفراد."]},
     {k:'def', x:["Creation of knowledge workers: people who create new knowledge or modify existing knowledge.","ظهور عمال المعرفة (Knowledge workers): أشخاص ينشئون معرفة جديدة أو يعدّلون المعرفة القائمة."]},
     {k:'ul', h:["Knowledge workers:","عمال المعرفة:"], x:[["Work is mental, not physical","عملهم ذهني لا جسدي"],["Advanced education","تعليم متقدم"],["College degree","شهادة جامعية"],["Professional certifications - MCSA","شهادات مهنية - MCSA"]]},
     {k:'def', x:["Telecommuting means working from home or another remote location.","العمل عن بعد (Telecommuting) يعني العمل من المنزل أو من موقع بعيد آخر."]}
   ]},
   {t:["Ethics in the Digital World","الأخلاقيات في العالم الرقمي"], b:[
     {k:'def', x:["Ethics is a set of principles of right conduct; the rules or standards governing the conduct of a person or the members of a profession.","الأخلاقيات (Ethics) مجموعة مبادئ للسلوك الصحيح؛ والقواعد أو المعايير التي تحكم سلوك شخص أو أعضاء مهنة."]},
     {k:'ul', x:[["Ethical is not always the same as legal.","الأخلاقي ليس دائمًا هو القانوني."],["Ethics in the digital world are confusing.","الأخلاقيات في العالم الرقمي مربكة."],["The legal system has not kept pace with technology developments.","لم يواكب النظام القانوني تطورات التقنية."]]},
     {k:'ul', h:["Major ethical issues in the digital world:","أهم القضايا الأخلاقية في العالم الرقمي:"], x:[["Privacy: identity theft, sale of confidential personal information","الخصوصية (Privacy): سرقة الهوية وبيع المعلومات الشخصية السرية"],["Intellectual property: old Napster","الملكية الفكرية: Napster القديم"],["Freedom of speech","حرية التعبير"],["Social concerns","قضايا اجتماعية"]]}
   ]},
   {t:["Case Study: Bead Bar Consultant","دراسة حالة: مستشار Bead Bar"], b:[
     {k:'ul', h:["How do this chapter's issues affect the Bead Bar?","كيف تؤثر قضايا هذا الفصل في Bead Bar؟"], x:[["Meredith - Bead Bar combines product and service","Meredith - تجمع Bead Bar بين المنتج والخدمة"],["Suzanne - Patents and copyrights","Suzanne - براءات الاختراع وحقوق النشر"],["Leda - Trademarks","Leda - العلامات التجارية"],["Mitch - Globalization","Mitch - العولمة"],["Julia - Wants to telecommute","Julia - تريد العمل عن بعد"],["Miriam - Developing a virtual organization","Miriam - تطوير منظمة افتراضية"],["Rachel - Internationalization of supply chain","Rachel - تدويل سلسلة الإمداد"],["Jim - HR policies for new modes of work","Jim - سياسات الموارد البشرية لأنماط العمل الجديدة"]]}
   ]}

  take:[
   ["Six digital world traits: globalization, digitization of goods, speed, product-service merger, role of ideas, new markets and pricing.","ست سمات للعالم الرقمي: العولمة، رقمنة السلع، السرعة، اندماج المنتج والخدمة، دور الأفكار، أسواق وتسعير جديدة."],
   ["IP protection: patents, copyrights, digital watermarks, trademarks, trade secrets.","حماية الملكية الفكرية: براءات، حقوق نشر، علامات مائية رقمية، علامات تجارية، أسرار تجارية."],
   ["Administrative IS: TPS, OAS, KWS, MIS, DSS, EIS, IOS. Functional IS: finance, marketing, manufacturing, HR.","النظم الإدارية: TPS وOAS وKWS وMIS وDSS وEIS وIOS. النظم الوظيفية: المالية، التسويق، التصنيع، الموارد البشرية."],
   ["Ethical is not always the same as legal; ethical issues: privacy, intellectual property, freedom of speech, social concerns.","الأخلاقي ليس دائمًا قانونيًا؛ القضايا: الخصوصية، الملكية الفكرية، حرية التعبير، القضايا الاجتماعية."]
  ],
  fc:[
   [["Name the six characteristics of the digital world.","اذكر الخصائص الست للعالم الرقمي."],["Globalization, digitization of goods, speed, merger of products and services, role of ideas, new markets and pricing.","العولمة، رقمنة السلع، السرعة، اندماج المنتجات والخدمات، دور الأفكار، أسواق وتسعير جديدة."]],
   [["What is globalization?","ما هي العولمة؟"],["A system of interconnected economies based on capital markets and characterized by use of technology. It requires understanding local customs, laws and foreign regulations.","نظام اقتصادات مترابطة قائم على أسواق رأس المال ويتميز باستخدام التقنية، ويتطلب فهم العادات والقوانين المحلية ولوائح الدول الأجنبية."]],
   [["What is the digitization of goods? Give examples.","ما رقمنة السلع؟ أعط أمثلة."],["Converting physical products to digital formats or creating digital versions that are easily distributed online: MP3s, DVDs, e-books, digital music, online software, streaming media, digital newspapers.","تحويل المنتجات المادية إلى صيغ رقمية أو إنشاء نسخ رقمية تُوزع بسهولة: MP3 وDVD والكتب الإلكترونية والموسيقى الرقمية والبرمجيات والوسائط المتدفقة والصحف الرقمية."]],
   [["What does 'speed' mean in the digital world?","ماذا تعني السرعة في العالم الرقمي؟"], ["The rapid pace at which information, products and services are created, processed and delivered; availability anytime, any place; faster response, shorter development cycles.","الوتيرة السريعة لإنشاء ومعالجة وتسليم المعلومات والمنتجات والخدمات؛ التوافر في أي وقت ومكان؛ استجابة أسرع ودورات تطوير أقصر."]],
   [["Explain the merger of products and services with an example.","اشرح اندماج المنتجات والخدمات بمثال."],["Integration of tangible goods with intangible services into hybrid offerings; e.g., a smartphone sold with software updates, customer support and cloud storage.","دمج السلع الملموسة بالخدمات غير الملموسة في عروض هجينة؛ مثل هاتف ذكي مع تحديثات ودعم وتخزين سحابي."]],
   [["Why is the role of ideas important?","لماذا يهم دور الأفكار؟"],["Innovation, creativity and intellectual property drive business success; new ideas create disruptive technologies and competitive advantages; digitalization makes theft easier.","الابتكار والإبداع والملكية الفكرية تدفع نجاح الأعمال؛ والأفكار الجديدة تخلق تقنيات مغيّرة ومزايا تنافسية؛ والرقمنة تسهّل السرقة."]],
   [["List ways to protect intellectual property.","اذكر طرق حماية الملكية الفكرية."],["Patents, copyrights, digital watermarks (Digimarc), trademarks, trade secrets.","براءات الاختراع، حقوق النشر، العلامات المائية الرقمية، العلامات التجارية، الأسرار التجارية."]],
   [["What are new markets and new pricing strategies?","ما الأسواق الجديدة واستراتيجيات التسعير الجديدة؟"],["New markets: opportunities driven by globalization, digitalization and consumer behavior. Pricing: subscription models, dynamic pricing. Examples: Orbitz, Expedia, eBay, Fidelity, eTrade.","الأسواق الجديدة: فرص بفعل العولمة والرقمنة وسلوك المستهلك. التسعير: الاشتراك والتسعير الديناميكي. أمثلة: Orbitz وExpedia وeBay وFidelity وeTrade."]],
   [["Name the types of administrative information systems.","اذكر أنواع نظم المعلومات الإدارية."],["TPS, OAS, KWS, MIS, DSS, EIS, IOS.","TPS وOAS وKWS وMIS وDSS وEIS وIOS."]],
   [["Name the functional information systems.","اذكر نظم المعلومات الوظيفية."],["Finance and accounting, marketing and sales, manufacturing and operations, human resources management.","المالية والمحاسبة، التسويق والمبيعات، التصنيع والعمليات، إدارة الموارد البشرية."]],
   [["Who are knowledge workers? What is telecommuting?","من هم عمال المعرفة؟ وما العمل عن بعد؟"],["Knowledge workers create or modify knowledge; mental work, advanced education, degree, certifications (MCSA). Telecommuting: working from home or a remote location.","عمال المعرفة ينشئون المعرفة أو يعدلونها؛ عمل ذهني وتعليم متقدم وشهادات (MCSA). العمل عن بعد: العمل من المنزل أو موقع بعيد."]],
   [["What are ethics? Name the major ethical issues.","ما الأخلاقيات؟ وما أهم قضاياها؟"],["Principles of right conduct, standards governing a person or profession. Ethical is not always legal. Issues: privacy (identity theft, sale of personal data), intellectual property (Napster), freedom of speech, social concerns.","مبادئ السلوك الصحيح ومعايير تحكم الفرد أو المهنة. الأخلاقي ليس دائمًا قانونيًا. القضايا: الخصوصية وسرقة الهوية وبيع البيانات، الملكية الفكرية (Napster)، حرية التعبير، القضايا الاجتماعية."]],
   [["What problems did the Bead Bar have with paper forms?","ما مشكلات Bead Bar مع النماذج الورقية؟"],["Lost orders, incorrect invoicing, fulfillment delays.","طلبات مفقودة، فواتير غير صحيحة، تأخر التنفيذ."]]
  ],
  quiz:[

   {q:["Which is an example of digitization of goods?","أيها مثال على رقمنة السلع؟"], o:[["MP3s","ملفات MP3"],["Printed letters","الرسائل المطبوعة"],["Paper maps","الخرائط الورقية"],["Vinyl only","الأسطوانات فقط"]], a:0},

   {q:["Which protects intellectual property?","أيها يحمي الملكية الفكرية؟"], o:[["Spam","البريد المزعج"],["Cookies","ملفات الكوكيز"],["Defragmentation","إلغاء التجزئة"],["Patents","براءات الاختراع"]], a:3},
   {q:["Subscription models and dynamic pricing belong to:","نماذج الاشتراك والتسعير الديناميكي تنتمي إلى:"], o:[["New markets and pricing","أسواق وتسعير جديدة"],["Hardware","الأجهزة"],["Ethics","الأخلاقيات"],["Telecommuting","العمل عن بعد"]], a:0},
   {q:["Which is a travel digital market example?","أيها مثال على سوق رقمي للسفر؟"], o:[["eBay","eBay"],["Expedia","Expedia"],["eTrade","eTrade"],["Fidelity","Fidelity"]], a:1},
   {q:["Which is an administrative information system?","أيها نظام معلومات إداري؟"], o:[["Finance system","نظام المالية"],["Marketing system","نظام التسويق"],["Executive Information System (EIS)","نظام معلومات الإدارة العليا (EIS)"],["HR system","نظام الموارد البشرية"]], a:2},
   {q:["Which is a functional information system?","أيها نظام معلومات وظيفي؟"], o:[["TPS","TPS"],["DSS","DSS"],["IOS","IOS"],["Marketing and Sales Systems","نظم التسويق والمبيعات"]], a:3},
   {q:["Knowledge workers are people who:","عمال المعرفة هم أشخاص:"], o:[["Create or modify knowledge","ينشئون المعرفة أو يعدلونها"],["Only do physical labor","يؤدون عملًا جسديًا فقط"],["Never use computers","لا يستخدمون الحواسيب"],["Only manage hardware","يديرون الأجهزة فقط"]], a:0},
   {q:["Working from home or another remote location is called:","العمل من المنزل أو موقع بعيد يسمى:"], o:[["Outsourcing","الاستعانة بمصادر خارجية"],["Telecommuting","العمل عن بعد (Telecommuting)"],["Piracy","القرصنة"],["Streaming","البث المتدفق"]], a:1},
   {q:["Which statement about ethics is correct?","أي عبارة عن الأخلاقيات صحيحة؟"], o:[["Ethical always equals legal","الأخلاقي دائمًا يساوي القانوني"],["The law has fully kept pace with technology","القانون واكب التقنية تمامًا"],["Ethical is not always the same as legal","الأخلاقي ليس دائمًا هو القانوني"],["Ethics has no rules","لا قواعد للأخلاقيات"]], a:2}

       ["Different combinations of bits represent different symbols, e.g., the letter A: ASCII [10000010], EBCDIC [10100010].","تمثل تركيبات البتات المختلفة رموزًا مختلفة، مثل الحرف A: ASCII [10000010]، EBCDIC [10100010]."],

     {k:'ul', h:["Speed is measured in hertz:","تُقاس السرعة بالهرتز:"], x:[["Megahertz - millions of instructions per second","ميغاهرتز - ملايين التعليمات في الثانية"],["Gigahertz - billions of instructions per second","غيغاهرتز - مليارات التعليمات في الثانية"]]},

  take:[

   ["Core components: input, output, primary storage, secondary storage, CPU, busses.","المكونات الأساسية: إدخال، إخراج، تخزين أولي، تخزين ثانوي، CPU، نواقل."],
   ["RAM is volatile; ROM is non-volatile; secondary storage is nonvolatile.","RAM متطايرة؛ ROM غير متطايرة؛ التخزين الثانوي غير متطاير."],
   ["8 bits = 1 byte. CPU = ALU + control unit; cycle: fetch, decode, execute.","8 بتات = بايت واحد. CPU = ALU + وحدة التحكم؛ الدورة: جلب، فك، تنفيذ."],

  fc:[
   [["Who was the first programmer and what was Babbage's machine?","من أول مبرمجة وما آلة بابيج؟"],["Lady Ada Byron was the first programmer; Babbage's Analytical Engine (1820s - 1870s) used a punched card program.","السيدة Ada Byron أول مبرمجة؛ آلة بابيج التحليلية (1820-1870) استخدمت برنامج بطاقات مثقبة."]],
   [["What did Hollerith contribute?","ماذا قدم Hollerith؟"],["Hollerith code and punched card tabulating machines used in the 1890 census.","شفرة Hollerith وآلات جدولة البطاقات المثقبة في تعداد 1890."]],
   [["What technology did ENIAC use, and what replaced it?","ما التقنية التي استخدمها ENIAC وما الذي حل محلها؟"],["Vacuum tubes; replaced by transistors in the 1960s, then integrated circuits, then the microprocessor in the 1970s.","الأنابيب المفرغة؛ حل محلها الترانزستور في الستينيات ثم الدوائر المتكاملة ثم المعالج الدقيق في السبعينيات."]],
   [["Name key events in the rise of the PC.","اذكر أهم أحداث ظهور الحاسوب الشخصي."],["1974 Altair 8800 (first PC); 1976 Apple I (Wozniak and Jobs); 1977 Apple II; 1981 IBM PC with MS-DOS; 1984 Apple Macintosh (GUI pioneered at Xerox PARC).","1974 Altair 8800 (أول PC)؛ 1976 Apple I؛ 1977 Apple II؛ 1981 IBM PC مع MS-DOS؛ 1984 Macintosh (الواجهة الرسومية من Xerox PARC)."]],
   [["Name the core computer components.","اذكر المكونات الأساسية للحاسوب."],["Input devices, output devices, primary storage, secondary storage, CPU, busses.","أجهزة الإدخال، أجهزة الإخراج، التخزين الأولي، التخزين الثانوي، CPU، النواقل."]],
   [["Human vs machine-readable input devices?","أجهزة الإدخال البشرية مقابل المقروءة آليًا؟"],["Human: keyboard, mouse (a person sends data). Machine-readable: send data directly without human involvement - no human error and usually faster (bar code scanners, OCR, MICR).","البشرية: لوحة المفاتيح والفأرة. المقروءة آليًا: ترسل البيانات دون تدخل بشري - بلا خطأ بشري وأسرع عادة (باركود، OCR، MICR)."]],
   [["What are RSIs and how are they reduced?","ما RSIs وكيف تُخفَّف؟"],["Repetitive Stress Injuries caused by QWERTY keyboards; reduced by attention to ergonomics: posture, lighting, working.","إصابات الإجهاد المتكرر بسبب لوحات QWERTY؛ تُخفَّف بالاهتمام بالـ Ergonomics: الوضعية والإضاءة والعمل."]],
   [["Explain bar code scanners, OCR and MICR.","اشرح قارئ الباركود وOCR وMICR."],["Bar code: light reads coded stripes (UPC, UPS tracking). OCR: software with a scanner turns scanned images into editable characters. MICR: banks use it to rapidly route checks.","الباركود: ضوء يقرأ خطوطًا مشفرة (UPC وتتبع UPS). OCR: برنامج مع ماسح يحول الصور إلى حروف قابلة للتعديل. MICR: تستخدمه البنوك لتوجيه الشيكات بسرعة."]],
   [["Name monitor types and quality measures.","اذكر أنواع الشاشات ومقاييس الجودة."],["CRTs and LCDs; quality: resolution and dot pitch. Touch screens give input and output via the display.","CRT وLCD؛ الجودة: الدقة وتباعد النقاط. شاشات اللمس تتيح إدخالًا وإخراجًا عبر الشاشة."]],
   [["Impact vs non-impact printers? Ink-jet vs laser?","الطابعات الصدمية مقابل غير الصدمية؟ الحبر النافث مقابل الليزر؟"],["Impact (dot-matrix) strike paper and ribbon; non-impact spray or roll ink. Ink-jet: small, quiet, cheap color. Laser: toner on a heated drum, can be faster, color costlier. Higher DPI = clearer page.","الصدمية (النقطية) تضرب الورق والشريط؛ غير الصدمية ترش أو تدحرج الحبر. الحبر النافث: صغيرة وهادئة وألوان رخيصة. الليزر: حبر Toner على أسطوانة ساخنة، أسرع وأغلى لونًا. DPI أعلى = وضوح أكبر."]],
   [["List multimedia and alternative I/O devices.","اذكر أجهزة الإدخال والإخراج للوسائط."],["Digital cameras and camera phones, DVD recorders (Sony Handicam), game controllers, VR, voice recognition, text-to-speech, brain wave input.","كاميرات رقمية وهواتف كاميرا، مسجلات DVD، وحدات تحكم ألعاب، واقع افتراضي، تعرف على الصوت، نص إلى كلام، إدخال بموجات الدماغ."]],
   [["What are bits and bytes?","ما البت والبايت؟"],["Bit = BInary digiT. 8 bits = 1 byte. Combinations represent symbols, e.g., A in ASCII is 10000010 and in EBCDIC 10100010.","البت = رقم ثنائي. 8 بتات = بايت. التركيبات تمثل رموزًا، مثل A في ASCII هي 10000010 وفي EBCDIC 10100010."]],
   [["RAM vs ROM vs cache?","RAM مقابل ROM مقابل Cache؟"],["RAM: random access memory, volatile. ROM: read only memory, non-volatile. Cache: internal is ultra fast and very expensive; external is very fast and cheaper.","RAM: متطايرة. ROM: غير متطايرة. Cache: الداخلية فائقة السرعة وغالية جدًا؛ الخارجية سريعة جدًا وأرخص."]],
   [["Describe secondary storage options.","صف خيارات التخزين الثانوي."],["Magnetic: tape (sequential), HDD (direct; up to 7000 rpm), RAID, floppy, Zip. Optical: CD 600 MB (CD-ROM, R, RW); DVD 2 - 17 GB (DVD, +/-R, +/-RW).","مغناطيسي: شريط (تسلسلي)، HDD (مباشر؛ حتى 7000 rpm)، RAID، مرن، Zip. ضوئي: CD سعة 600MB؛ DVD من 2 إلى 17GB."]],
   [["What are the CPU parts and how is speed measured?","ما أجزاء CPU وكيف تُقاس سرعته؟"],["ALU and control unit, with registers as scrap paper. Speed in hertz: MHz = millions, GHz = billions of instructions per second. Moore's Law tracks processor speed growth.","ALU ووحدة التحكم، والمسجلات كورقة مسودة. السرعة بالهرتز: MHz ملايين وGHz مليارات التعليمات في الثانية. قانون مور يتتبع نمو السرعة."]],

       {t:["Program and memory management","إدارة البرامج والذاكرة"], l:[["OS is responsible for sending a program to the CPU, allocating primary storage for the program, and controlling other devices the program requires.","النظام مسؤول عن إرسال البرنامج إلى CPU وتخصيص التخزين الأولي له والتحكم في الأجهزة الأخرى التي يحتاجها."],["Multiprogramming and multitasking: more than one program in memory at once; the OS keeps track of memory for each program; one program runs until it needs data from the user, then the OS switches to the other program.","تعدد البرمجة والمهام (Multiprogramming / Multitasking): أكثر من برنامج في الذاكرة معًا؛ يتتبع النظام ذاكرة كل برنامج؛ يعمل برنامج حتى يحتاج بيانات من المستخدم ثم ينتقل النظام إلى البرنامج الآخر."],["Time sharing","المشاركة الزمنية (Time sharing)"],["Virtual memory","الذاكرة الافتراضية (Virtual memory)"]]},

   [["What is systems software? Give examples.","ما برمجيات النظام؟ أعط أمثلة."],["Programs that manage computer hardware and application software: operating systems (Windows, Linux), language translators (C++, Visual Basic), utility programs (Norton Utilities).","برامج تدير الأجهزة وبرمجيات التطبيقات: أنظمة تشغيل (Windows وLinux)، مترجمات (C++ وVisual Basic)، منفعة (Norton Utilities)."]],
   [["What is application software? Give examples.","ما برمجيات التطبيقات؟ أعط أمثلة."],["Programs that let users accomplish specific tasks: word processing, web browser, tax preparation.","برامج تتيح إنجاز مهام محددة: معالجة النصوص، متصفح الويب، إعداد الضرائب."]],
   [["What is an operating system?","ما نظام التشغيل؟"],["The software platform on which other programs run; it connects application programs with the computer hardware.","منصة البرمجيات التي تعمل عليها البرامج وتربط التطبيقات بالعتاد."]],
   [["List the major OS tasks.","اذكر المهام الرئيسية لنظام التشغيل."],["Booting, managing files, program and memory management, ensuring security, providing a user interface.","الإقلاع، إدارة الملفات، إدارة البرامج والذاكرة، الأمن، واجهة المستخدم."]],
   [["How does the OS manage files?","كيف يدير النظام الملفات؟"],["Tracks where all files are located and manages the directory structure: free, used, and formerly used space.","يتتبع أماكن الملفات ويدير هيكل الأدلة: المساحة الحرة والمستخدمة والمستخدمة سابقًا."]],
   [["Explain multiprogramming/multitasking, time sharing, virtual memory.","اشرح تعدد البرمجة والمهام والمشاركة الزمنية والذاكرة الافتراضية."],["More than one program in memory at once; OS tracks each program's memory and switches when one needs user data. Time sharing and virtual memory are also part of memory management.","أكثر من برنامج في الذاكرة؛ يتتبع النظام ذاكرة كل برنامج وينتقل عندما يحتاج أحدها بيانات المستخدم. المشاركة الزمنية والذاكرة الافتراضية جزء من إدارة الذاكرة."]],
   [["Name the three OS security features.","اذكر ميزات الأمن الثلاث في OS."],["Access control, file permissions, logging (audit trail).","التحكم في الوصول، أذونات الملفات، التسجيل (سجل التدقيق)."]],
   [["Name the types of user interface.","اذكر أنواع واجهة المستخدم."],["Text/command line, graphical user interface (GUI), voice interface.","نصية/سطر أوامر، رسومية GUI، صوتية."]],
   [["What should you consider when choosing an OS?","ماذا تراعي عند اختيار OS؟"],["First, it must support the needed applications. Also stability, security, and ease of use.","أولًا أن يدعم التطبيقات المطلوبة. وكذلك الاستقرار والأمن وسهولة الاستخدام."]],
   [["What do utility programs do?","ماذا تفعل برامج المنفعة؟"],["Common tasks and maintenance: defragmentation, virus protection, editing the Windows registry, removing web cookies.","مهام شائعة وصيانة: إلغاء التجزئة، مكافحة الفيروسات، تحرير السجل، إزالة الكوكيز."]],
   [["COTS vs customized software?","البرمجيات الجاهزة مقابل المخصصة؟"],["COTS: off-the-shelf (productivity suites, enterprise ERP/CRM, freeware/shareware). Customized: developed by programmers for a business's specific problem.","COTS: جاهزة (حزم إنتاجية، ERP/CRM، مجانية/مشاركة). المخصصة: يطورها مبرمجون لمشكلة محددة."]],
   [["List the steps of developing custom software.","اذكر خطوات تطوير البرمجيات المخصصة."],["Plan (requirements), Design, Write (programming language), Test. Errors found may require repeating earlier steps.","التخطيط (المتطلبات)، التصميم، الكتابة، الاختبار. قد تتطلب الأخطاء إعادة خطوات سابقة."]],
   [["What is HTML?","ما هي HTML؟"],["A markup language, not really a programming language; tags determine how web pages are displayed; not machine specific.","لغة ترميز ولا تعد لغة برمجة فعلًا؛ وسومها تحدد عرض صفحات الويب؛ غير مرتبطة بجهاز."]],
   [["What are OOP, object class and inheritance?","ما OOP وفئة الكائنات والوراثة؟"],["OOP provides reusability of components. Object class: objects with similar characteristics. Inheritance: subclasses inherit all characteristics and processes of the parent class. OOP makes programmers more productive.","OOP توفر إعادة الاستخدام. فئة الكائنات: كائنات متشابهة. الوراثة: ترث الفئة الفرعية خصائص وعمليات الأم. تزيد إنتاجية المبرمجين."]],
   [["Why can free upgrades be expensive?","لماذا قد تكون الترقيات المجانية مكلفة؟"],["Installation cost, retraining cost, disrupting operations, compatibility issues; new software needs compelling features to justify cost.","تكلفة التثبيت وإعادة التدريب وتعطيل العمليات ومشكلات التوافق؛ وتحتاج ميزات مقنعة لتبرير التكلفة."]],
   [["What is software piracy and who is responsible?","ما قرصنة البرمجيات ومن المسؤول؟"],["Copying software without paying; ownership vs license to use; companies are responsible for employees who install or download software on company machines.","نسخ البرمجيات دون دفع؛ الملكية مقابل الترخيص؛ والشركات مسؤولة عن موظفيها الذين يثبتون برمجيات على أجهزتها."]]
  ],
  quiz:[
   {q:["Which is systems software?","أيها من برمجيات النظام؟"], o:[["Operating system","نظام التشغيل"],["Tax preparation program","برنامج إعداد الضرائب"],["Web browser","متصفح الويب"],["Word processor","معالج النصوص"]], a:0},
   {q:["Which is application software?","أيها من برمجيات التطبيقات؟"], o:[["Linux","Linux"],["Language translator","مترجم اللغات"],["Web browser","متصفح الويب"],["Norton Utilities","Norton Utilities"]], a:2},
   {q:["Which is NOT a major OS task?","أيها ليس من المهام الرئيسية لـ OS؟"], o:[["Booting","الإقلاع"],["Managing files","إدارة الملفات"],["Ensuring security","ضمان الأمن"],["Designing web pages","تصميم صفحات الويب"]], a:3},
   {q:["Which OS security feature is an audit trail of who accessed the computer?","أي ميزة أمن هي سجل تدقيق لمن وصل للحاسوب؟"], o:[["Access control","التحكم في الوصول"],["Logging","التسجيل"],["File permissions","أذونات الملفات"],["Booting","الإقلاع"]], a:1},
   {q:["Having more than one program in memory at once is:","وجود أكثر من برنامج في الذاكرة معًا هو:"], o:[["Piracy","القرصنة"],["Defragmentation","إلغاء التجزئة"],["Multiprogramming","تعدد البرمجة"],["Inheritance","الوراثة"]], a:2},
   {q:["The first consideration when choosing an OS is:","أول اعتبار عند اختيار OS هو:"], o:[["Color of the screen","لون الشاشة"],["Brand name","اسم العلامة"],["Price of the mouse","سعر الفأرة"],["Support for the applications the business needs","دعم التطبيقات التي تحتاجها الشركة"]], a:3},
   {q:["Which is a utility software task?","أيها مهمة لبرمجيات المنفعة؟"], o:[["Defragmentation","إلغاء التجزئة"],["Writing a letter","كتابة رسالة"],["Playing music","تشغيل الموسيقى"],["Designing a database","تصميم قاعدة بيانات"]], a:0},
   {q:["COTS stands for:","ماذا تعني COTS؟"], o:[["Computer Operating Test System","Computer Operating Test System"],["Commercial-off-the-shelf","Commercial-off-the-shelf"],["Custom Online Training Software","Custom Online Training Software"],["Central Output Transfer System","Central Output Transfer System"]], a:1},
   {q:["Which is shareware?","ماذا عن البرمجيات المشاركة (Shareware)؟"], o:[["Always free forever","مجانية دائمًا"],["Written by employees only","يكتبها الموظفون فقط"],["Not free","ليست مجانية"],["Hardware","عتاد"]], a:2},
   {q:["Which is the correct order of custom software development?","ما الترتيب الصحيح لتطوير البرمجيات المخصصة؟"], o:[["Test, Write, Design, Plan","اختبار، كتابة، تصميم، تخطيط"],["Write, Plan, Test, Design","كتابة، تخطيط، اختبار، تصميم"],["Design, Plan, Test, Write","تصميم، تخطيط، اختبار، كتابة"],["Plan, Design, Write, Test","تخطيط، تصميم، كتابة، اختبار"]], a:3},
   {q:["HTML is:","HTML هي:"], o:[["A markup language","لغة ترميز"],["An operating system","نظام تشغيل"],["A printer","طابعة"],["A database model","نموذج قاعدة بيانات"]], a:0},
   {q:["In OOP, a subclass inheriting characteristics of the parent class is called:","في OOP، وراثة الفئة الفرعية لخصائص الأم تسمى:"], o:[["Piracy","القرصنة"],["Inheritance","الوراثة"],["Booting","الإقلاع"],["Logging","التسجيل"]], a:1}

LECTURES.push({ id:'l6', n:6,
  title:["Database Technologies","تقنيات قواعد البيانات (Databases)"],
  obj:[
    ["Explain how organizations use data and information and the basic concepts of data management.","شرح كيف تستخدم المنظمات البيانات والمعلومات والمفاهيم الأساسية لإدارة البيانات."],
    ["Describe file systems and their problems.","وصف نظم الملفات (File systems) ومشكلاتها."],
    ["Define a DBMS and its functions.","تعريف نظام إدارة قواعد البيانات (DBMS) ووظائفه."],
    ["Explain how the relational database model works.","شرح كيف يعمل النموذج العلائقي لقواعد البيانات."],
    ["Describe how databases are developed.","وصف كيفية تطوير قواعد البيانات."],
    ["Explain data warehousing and data mining for decision making.","شرح مستودعات البيانات (Data warehousing) وتنقيب البيانات (Data mining) لدعم القرار."],
    ["Recognize advanced database models.","التعرف على نماذج قواعد البيانات المتقدمة."]
  ],
  sec:[
   {t:["Basic Concepts in Data Management","المفاهيم الأساسية في إدارة البيانات"], b:[
     {k:'cards', c:[
       {t:["Field","الحقل (Field)"], l:[["An individual piece of data, made up of one or more bytes or characters.","قطعة بيانات مفردة تتكون من بايت أو أكثر أو أحرف."],["Examples: name, address, phone number","أمثلة: الاسم، العنوان، رقم الهاتف"]]},
       {t:["Record","السجل (Record)"], l:[["Fields that are grouped together for a specific purpose.","حقول مجمعة معًا لغرض محدد."]]},
       {t:["Primary key","المفتاح الأساسي (Primary key)"], l:[["A field, or group of fields, that uniquely identifies an individual record.","حقل أو مجموعة حقول تحدد سجلًا بعينه بشكل فريد."],["Example: student ID number for records describing students.","مثال: رقم هوية الطالب في سجلات الطلاب."]]}
     ]},
     {k:'ul', h:["Paper analogy:","التشبيه الورقي:"], x:[
       ["Businesses group paper forms into a file; the database equivalent is called a table.","تجمع الشركات النماذج الورقية في ملف؛ ويسمى المكافئ في قواعد البيانات جدولًا (Table)."],
       ["Files of paper forms are stored in a file cabinet; the computer equivalent of the file cabinet is a database.","تُحفظ ملفات النماذج في خزانة؛ والمكافئ الحاسوبي للخزانة هو قاعدة البيانات."]]}
   ]},
   {t:["File Systems","نظم الملفات (File Systems)"], b:[
     {k:'p', x:["A file system is one of the simplest ways to store data. It stores together groups of records used by a particular software application.","نظام الملفات من أبسط طرق تخزين البيانات. فهو يخزن معًا مجموعات سجلات يستخدمها تطبيق برمجي معين."]},
     {k:'ul', h:["Simple but with a cost:","بسيط لكن بثمن:"], x:[["Inability to share data","عدم القدرة على مشاركة البيانات"],["Inadequate security","أمن غير كافٍ"],["Difficulties in maintenance and expansion","صعوبات في الصيانة والتوسع"],["Allows data duplication (redundancy)","يسمح بتكرار البيانات (Redundancy)"]]},
     {k:'cards', c:[
       {t:["Insertion anomaly","شذوذ الإدراج (Insertion anomaly)"], l:[["Data needs to be entered more than once when the data is located in multiple file systems.","تحتاج البيانات إلى إدخال أكثر من مرة عندما تكون في نظم ملفات متعددة."]]},
       {t:["Modification anomaly","شذوذ التعديل (Modification anomaly)"], l:[["Redundant data in separate file systems becomes inconsistent.","تصبح البيانات المكررة في نظم ملفات منفصلة غير متسقة."]]},
       {t:["Deletion anomaly","شذوذ الحذف (Deletion anomaly)"], l:[["Failure to simultaneously delete all copies of redundant data.","الإخفاق في حذف جميع نسخ البيانات المكررة في الوقت نفسه."]]}
     ]},
     {k:'tip', x:["Anomalies are BAD! Three types: insertion, modification, deletion.","الشذوذات سيئة! ثلاثة أنواع: إدراج، تعديل، حذف."]}
   ]},
   {t:["Database and DBMS","قاعدة البيانات و DBMS"], b:[
     {k:'def', x:["A database is a set of logically related data stored in a shared repository. The software that creates and manipulates data is a database management system (DBMS).","قاعدة البيانات مجموعة بيانات مترابطة منطقيًا مخزنة في مستودع مشترك. والبرنامج الذي ينشئ البيانات ويعالجها هو نظام إدارة قواعد البيانات (DBMS)."]},
     {k:'cards', c:[
       {t:["Manage stored data","إدارة البيانات المخزنة"], l:[["Core function of the DBMS.","وظيفة أساسية لـ DBMS."]]},
       {t:["Transform data into information","تحويل البيانات إلى معلومات"], l:[["Transforms the way data is physically stored into whatever logical view of the data the user chooses.","يحول طريقة التخزين الفعلية إلى أي عرض منطقي للبيانات يختاره المستخدم."],["Hides the physical details of how the data is actually stored.","يخفي التفاصيل الفعلية لكيفية تخزين البيانات."]]},
       {t:["Provide security","توفير الأمن"], l:[["DBMSs control who can add, view, change, or delete data in the database.","تتحكم DBMS في من يمكنه إضافة البيانات أو عرضها أو تغييرها أو حذفها."]]},
       {t:["Allow multiuser access","السماح بوصول متعدد المستخدمين"], l:[["Controls concurrency of access to data; prevents one user from accessing data that has not been completely updated.","يتحكم في تزامن الوصول للبيانات؛ ويمنع مستخدمًا من الوصول لبيانات لم يكتمل تحديثها."],["Example: Ticketmaster lets you hold a ticket for only 2 minutes to decide, then releases it to sell to someone else - that is concurrency control.","مثال: تتيح Ticketmaster حجز تذكرة لدقيقتين فقط لاتخاذ القرار ثم تُطلق لبيعها لشخص آخر - وهذا هو التحكم في التزامن (Concurrency control)."]]},
       {t:["Programming and query language ability","القدرة على البرمجة ولغة الاستعلام"], l:[["Data Definition Language (DDL): define and modify the structure of the data (physical and logical views).","لغة تعريف البيانات (DDL): تعريف بنية البيانات وتعديلها (العرضان الفعلي والمنطقي)."],["Data Manipulation Language (DML): lets users enter, modify, delete, and retrieve data from the database.","لغة معالجة البيانات (DML): تتيح للمستخدمين إدخال البيانات وتعديلها وحذفها واسترجاعها."]]},
       {t:["Provide a data dictionary","توفير قاموس بيانات (Data dictionary)"], l:[["Metadata is data about data.","البيانات الوصفية (Metadata) هي بيانات عن البيانات."],["The data dictionary contains metadata about the characteristics of databases controlled by the DBMS.","يحتوي قاموس البيانات على بيانات وصفية عن خصائص قواعد البيانات التي تديرها DBMS."]]}
     ]}
   ]},
   {t:["Types of DBMSs","أنواع DBMS"], b:[
     {k:'cards', c:[
       {t:["Desktop","المكتبية (Desktop)"], l:[["Used by individuals or small groups.","يستخدمها أفراد أو مجموعات صغيرة."],["Requires little or no formal training.","تتطلب تدريبًا رسميًا قليلًا أو لا تتطلبه."],["Does not have all the capabilities of larger DBMSs.","لا تملك كل قدرات DBMS الأكبر."]]},
       {t:["Enterprise","المؤسسية (Enterprise)"], l:[["Serve multiple locations and store large amounts of data; either centralized or distributed.","تخدم مواقع متعددة وتخزن كميات كبيرة من البيانات؛ إما مركزية أو موزعة."]]},
       {t:["Centralized","المركزية (Centralized)"], l:[["All data on one server.","كل البيانات على خادم واحد."],["Easy to maintain.","سهلة الصيانة."],["Prone to run slowly when many simultaneous users.","عرضة للبطء عند كثرة المستخدمين المتزامنين."],["No access if the one server goes down.","لا وصول إذا تعطل الخادم الوحيد."]]},
       {t:["Distributed","الموزعة (Distributed)"], l:[["Each location has part of the database.","كل موقع لديه جزء من قاعدة البيانات."],["Very complex database administration.","إدارة قواعد البيانات معقدة جدًا."],["Usually faster than centralized.","عادة أسرع من المركزية."],["If one server crashes, others can still continue to operate.","إذا تعطل خادم تستمر الخوادم الأخرى بالعمل."]]}
     ]}
   ]},
   {t:["Database Models","نماذج قواعد البيانات"], b:[
     {k:'def', x:["A database model is a representation of the relationship between structures in a database.","نموذج قاعدة البيانات هو تمثيل للعلاقة بين البنى في قاعدة البيانات."]},
     {k:'ul', h:["Four common database models:","أربعة نماذج شائعة:"], x:[["Flat file model (e.g., an address book)","النموذج المسطح Flat file (مثل دفتر العناوين)"],["Hierarchical, or tree structure, model","النموذج الهرمي أو الشجري (Hierarchical)"],["Network model","نموذج الشبكة (Network)"],["Relational model (the most common)","النموذج العلائقي (Relational) - الأكثر شيوعًا"]]}
   ]},
   {t:["The Relational Model","النموذج العلائقي (Relational Model)"], b:[
     {k:'ul', x:[
       ["Flexible and relatively simple to use.","مرن وبسيط نسبيًا في الاستخدام."],
       ["Somewhat slower than hierarchical and network DBMSs.","أبطأ قليلًا من DBMS الهرمية والشبكية."],
       ["Uses controlled redundancy to create fields that provide linkage relationships between tables in the database.","يستخدم تكرارًا مضبوطًا لإنشاء حقول توفر علاقات ربط بين جداول قاعدة البيانات."]]},
     {k:'def', x:["Foreign keys are the secret to a relational database. A foreign key is a field, or group of fields, in one table that is the primary key of another table.","المفاتيح الأجنبية (Foreign keys) هي سر قاعدة البيانات العلائقية. المفتاح الأجنبي حقل أو مجموعة حقول في جدول هو المفتاح الأساسي لجدول آخر."]},
     {k:'ex', x:["Student table: SID (PK), SN (name), COURSE. Course table: CID (PK), CN (name), teacher. The COURSE field in the student table links to CID in the course table (foreign key). E.g., students 1 and 2 take course 3 (DB); student 3 takes course 2.","جدول الطلاب: SID (مفتاح أساسي)، SN (الاسم)، COURSE. جدول المقررات: CID (مفتاح أساسي)، CN (الاسم)، المدرس. يرتبط حقل COURSE في جدول الطلاب بـ CID في جدول المقررات (مفتاح أجنبي). مثلًا الطالبان 1 و2 يدرسان المقرر 3 (DB) والطالب 3 يدرس المقرر 2."]},
     {k:'tbl', h:[["SID (PK)","SID (PK)"],["SN","SN"],["COURSE (FK)","COURSE (FK)"]], r:[
       [["1","1"],["A","A"],["3","3"]],
       [["2","2"],["A","A"],["3","3"]],
       [["3","3"],["A","A"],["2","2"]]]},
     {k:'tbl', h:[["CID (PK)","CID (PK)"],["CN","CN"]], r:[
       [["1","1"],["IS","IS"]],
       [["2","2"],["M","M"]],
       [["3","3"],["DB","DB"]]]}
   ]},
   {t:["SQL","لغة SQL"], b:[
     {k:'def', x:["Structured Query Language (SQL) is the standard DDL and DML for a relational database.","لغة الاستعلام البنيوية (SQL) هي لغة DDL وDML القياسية لقاعدة البيانات العلائقية."]},
     {k:'ul', h:["Used for:","تُستخدم في:"], x:[["Creating tables (DDL)","إنشاء الجداول (DDL)"],["Deleting tables (DDL)","حذف الجداول (DDL)"],["Add, change, delete, and retrieve data (DML)","إضافة البيانات وتغييرها وحذفها واسترجاعها (DML)"]]},
     {k:'p', x:["Although there is an ANSI standard specification for SQL, most vendors provide their own variety.","رغم وجود مواصفة قياسية ANSI للغة SQL، فإن معظم الشركات تقدم نسختها الخاصة."]}
   ]},
   {t:["Database Development Process","عملية تطوير قاعدة البيانات"], b:[
     {k:'cards', c:[
       {t:["1) Analysis","1) التحليل (Analysis)"], l:[["Develop a clear understanding of how the organization works and what data is used.","تكوين فهم واضح لكيفية عمل المنظمة وما البيانات المستخدمة."]]},
       {t:["2) Conceptual model","2) النموذج المفاهيمي (Conceptual model)"], l:[["Show how data are grouped together and related to each other.","إظهار كيفية تجميع البيانات وارتباطها ببعضها."],["Entity-Relationship diagrams (ERDs) are used to record the conceptual model.","تُستخدم مخططات الكيان والعلاقة (ERD) لتسجيل النموذج المفاهيمي."],["Less expensive to correct an ERD than to redesign an already constructed database.","تصحيح ERD أرخص من إعادة تصميم قاعدة بيانات مبنية فعلًا."]]},
