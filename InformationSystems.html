  take:[
   ["Field → Record → Table → Database. Primary key uniquely identifies a record.","حقل ← سجل ← جدول ← قاعدة بيانات. المفتاح الأساسي يحدد السجل بشكل فريد."],
   ["File system problems: no sharing, weak security, hard maintenance, redundancy; anomalies: insertion, modification, deletion.","مشكلات نظام الملفات: لا مشاركة، أمن ضعيف، صيانة صعبة، تكرار؛ الشذوذات: إدراج، تعديل، حذف."],
   ["DBMS: manage data, hide physical details, security, multiuser concurrency, DDL/DML, data dictionary.","DBMS: إدارة البيانات، إخفاء التفاصيل الفعلية، الأمن، التزامن، DDL/DML، قاموس البيانات."],
   ["Relational model links tables using foreign keys; SQL is the standard DDL and DML.","النموذج العلائقي يربط الجداول بمفاتيح أجنبية؛ SQL هي DDL وDML القياسية."],
   ["Data warehouse: subject-oriented, integrated, time-variant, nonvolatile. Data mining finds patterns.","مستودع البيانات: موجّه بالموضوع، متكامل، متغير زمنيًا، غير متطاير. تنقيب البيانات يجد الأنماط."]
  ],
  fc:[
   [["Define field, record and primary key.","عرّف الحقل والسجل والمفتاح الأساسي."],["Field: individual piece of data. Record: fields grouped for a purpose. Primary key: a field (or group) uniquely identifying a record, e.g., student ID.","الحقل: قطعة بيانات مفردة. السجل: حقول مجمعة لغرض. المفتاح الأساسي: حقل يحدد السجل بشكل فريد مثل رقم الطالب."]],
   [["What is the paper-to-database analogy?","ما التشبيه بين الورق وقاعدة البيانات؟"],["Paper forms grouped in a file = table; file cabinet = database.","النماذج الورقية في ملف = جدول؛ الخزانة = قاعدة بيانات."]],
   [["What are the drawbacks of file systems?","ما عيوب نظم الملفات؟"],["Inability to share data, inadequate security, difficult maintenance and expansion, data duplication (redundancy).","عدم مشاركة البيانات، أمن غير كافٍ، صعوبة الصيانة والتوسع، تكرار البيانات."]],
   [["Name the three file system anomalies.","اذكر الشذوذات الثلاثة في نظم الملفات."],["Insertion (enter data more than once), modification (redundant data becomes inconsistent), deletion (failure to delete all copies).","الإدراج (إدخال أكثر من مرة)، التعديل (عدم اتساق المكرر)، الحذف (عدم حذف كل النسخ)."]],
   [["Define database and DBMS.","عرّف قاعدة البيانات وDBMS."],["Database: logically related data in a shared repository. DBMS: software that creates and manipulates the data.","قاعدة البيانات: بيانات مترابطة منطقيًا في مستودع مشترك. DBMS: برنامج ينشئ البيانات ويعالجها."]],
   [["List DBMS functions.","اذكر وظائف DBMS."],["Manage stored data, transform data into information (hide physical details), provide security, allow multiuser access (concurrency), query/programming languages (DDL, DML), data dictionary.","إدارة البيانات، تحويلها لمعلومات (إخفاء التفاصيل الفعلية)، الأمن، وصول متعدد المستخدمين، لغات (DDL وDML)، قاموس البيانات."]],
   [["Explain concurrency control with an example.","اشرح التحكم في التزامن بمثال."],["Prevents one user accessing data not completely updated; Ticketmaster holds a ticket for 2 minutes then releases it to someone else.","يمنع الوصول لبيانات لم يكتمل تحديثها؛ Ticketmaster تحجز التذكرة دقيقتين ثم تطلقها لغيرك."]],
   [["DDL vs DML? What is metadata?","DDL مقابل DML؟ وما البيانات الوصفية؟"],["DDL defines and modifies data structure; DML enters, modifies, deletes and retrieves data. Metadata is data about data, stored in the data dictionary.","DDL يعرّف بنية البيانات ويعدلها؛ DML يدخل ويعدل ويحذف ويسترجع. البيانات الوصفية: بيانات عن البيانات في قاموس البيانات."]],
   [["Desktop vs enterprise DBMS?","DBMS المكتبية مقابل المؤسسية؟"],["Desktop: individuals or small groups, little training, fewer capabilities. Enterprise: multiple locations, large data, centralized or distributed.","المكتبية: أفراد أو مجموعات صغيرة وتدريب قليل وإمكانات أقل. المؤسسية: مواقع متعددة وبيانات كبيرة، مركزية أو موزعة."]],
   [["Centralized vs distributed databases?","قواعد البيانات المركزية مقابل الموزعة؟"],["Centralized: one server, easy to maintain, slows with many users, no access if server down. Distributed: each location has part, complex administration, usually faster, others continue if one crashes.","المركزية: خادم واحد، سهلة الصيانة، تبطؤ مع كثرة المستخدمين، توقف عند تعطل الخادم. الموزعة: لكل موقع جزء، إدارة معقدة، أسرع عادة، تستمر عند تعطل أحد الخوادم."]],
   [["Name the four database models.","اذكر نماذج قواعد البيانات الأربعة."],["Flat file, hierarchical (tree), network, relational (most common).","مسطح، هرمي (شجري)، شبكي، علائقي (الأكثر شيوعًا)."]],
   [["What is a foreign key and why is it important?","ما المفتاح الأجنبي ولماذا هو مهم؟"],["A field (or group) in one table that is the primary key of another table; the secret to relational databases, creating controlled-redundancy links between tables.","حقل في جدول هو المفتاح الأساسي لجدول آخر؛ سر قواعد البيانات العلائقية ويربط الجداول بتكرار مضبوط."]],
   [["What is SQL?","ما هي SQL؟"],["Structured Query Language: the standard DDL and DML for relational databases (create/delete tables; add, change, delete, retrieve data). ANSI standard exists but vendors have their own varieties.","لغة الاستعلام البنيوية: DDL وDML القياسية (إنشاء الجداول وحذفها؛ إضافة وتغيير وحذف واسترجاع البيانات). يوجد معيار ANSI لكن لكل شركة نسختها."]],
   [["List the five steps of database development.","اذكر خطوات تطوير قاعدة البيانات الخمس."],["Analysis, conceptual model (ERD), physical model (normalization, optimization), implementation (install DBMS, build, test), administration (efficiency, backup/restore, accounts and security).","التحليل، النموذج المفاهيمي (ERD)، النموذج الفعلي (تطبيع وتحسين)، التنفيذ، الإدارة (كفاءة ونسخ احتياطي وحسابات وأمن)."]],
   [["Why use an ERD? What is normalization?","لماذا نستخدم ERD؟ وما التطبيع؟"],["ERD records the conceptual model; correcting it is cheaper than redesigning a built database. Normalization removes redundant data to minimize anomalies.","ERD يسجل النموذج المفاهيمي؛ وتصحيحه أرخص من إعادة تصميم قاعدة مبنية. التطبيع يزيل التكرار لتقليل الشذوذات."]],
   [["Describe a data warehouse.","صف مستودع البيانات."],["Collection of databases that is subject-oriented, integrated (all data about the subject), time-variant, nonvolatile (not updated/deleted); optimized for querying and reporting, not transactional.","مجموعة قواعد بيانات: موجّهة بالموضوع، متكاملة، متغيرة زمنيًا، غير متطايرة؛ محسّنة للاستعلام والتقارير وليست للمعاملات."]],
   [["What is data mining? Give examples.","ما تنقيب البيانات؟ أعط أمثلة."],["Applying analytical and statistical methods to find patterns; retailers find purchasing patterns; pro football teams scout opponents.","تطبيق أساليب تحليلية وإحصائية لإيجاد الأنماط؛ تجار التجزئة لأنماط الشراء؛ فرق كرة القدم لاستكشاف الخصوم."]],
   [["OODM vs hypermedia databases?","OODM مقابل قواعد الوسائط الفائقة؟"],["OODM: object classes with relationships and attributes, inheritance to subclasses. Hypermedia: any node linked to any other node, no pre-specified relationships; the WWW is an example.","OODM: فئات كائنات بعلاقات وخصائص ووراثة. الوسائط الفائقة: أي عقدة مرتبطة بأي عقدة دون علاقات مسبقة؛ الويب مثال."]]
  ],

     {k:'def', x:["Internet service providers (ISPs) provide most individual users with access to the Internet.","مزودو خدمة الإنترنت (ISPs) يوفرون لمعظم المستخدمين الأفراد الوصول إلى الإنترنت."]},
     {k:'ul', h:["Connections:","أنواع الاتصال:"], x:[["Dialup connections: modems and conventional phone lines","الاتصال الهاتفي (Dialup): مودم وخطوط هاتف تقليدية"],["xDSL and cable modems provide broadband access","xDSL ومودمات الكابل توفر اتصالًا عريض النطاق (Broadband)"]]},
     {k:'def', x:["Network Access Points (NAPs): much of the Internet traffic occurs among multiple ISPs; high-speed routers route traffic between ISPs and the Internet backbone.","نقاط الوصول للشبكة (NAPs): يحدث جزء كبير من حركة الإنترنت بين مزودي خدمة متعددين؛ وتوجه موجهات عالية السرعة الحركة بين ISPs والعمود الفقري للإنترنت."]},
     {k:'p', x:["The backbone consists of fiber optic connections owned and operated by large telecommunications companies (e.g., UUNet's North America Internet network).","يتكون العمود الفقري (Backbone) من وصلات ألياف ضوئية تملكها وتشغلها شركات اتصالات كبرى (مثل شبكة UUNet في أمريكا الشمالية)."]}
   ]},
   {t:["TCP/IP","بروتوكول TCP/IP"], b:[
     {k:'def', x:["TCP/IP is a communications protocol suite. It is a packet switched protocol.","TCP/IP مجموعة بروتوكولات اتصال، وهو بروتوكول تبديل الحزم (Packet switched)."]},
     {k:'ul', x:[["No end-to-end connection is required.","لا يلزم اتصال شامل من طرف لطرف."],["Each message is broken down into small pieces called packets.","تُقسَّم كل رسالة إلى قطع صغيرة تسمى حزمًا (Packets)."],["Packets may be routed to the destination over different paths.","قد تُوجَّه الحزم إلى الوجهة عبر مسارات مختلفة."]]},
     {k:'cards', c:[
       {t:["Transmission Control Protocol (TCP)","بروتوكول التحكم بالإرسال (TCP)"], l:[["Breaks messages into packets.","يقسم الرسائل إلى حزم."],["Numbers packets in order.","يرقّم الحزم بالترتيب."],["Reorders packets at the destination.","يعيد ترتيب الحزم عند الوجهة."]]},
       {t:["Internet Protocol (IP)","بروتوكول الإنترنت (IP)"], l:[["Routes packets to the proper destination.","يوجه الحزم إلى الوجهة الصحيحة."]]}
     ]}
   ]},
   {t:["Domain Names and DNS","أسماء النطاقات و DNS"], b:[
     {k:'p', x:["Every computer connected to the Internet must have a unique IP address.","يجب أن يملك كل حاسوب متصل بالإنترنت عنوان IP فريدًا."]},
     {k:'formula', x:"IP address format: xxx.xxx.xxx.xxx  (xxx = number between 0 and 255)"},
     {k:'p', x:["How do we know that 207.46.245.222 is Microsoft? Through the Domain Name System.","كيف نعرف أن 207.46.245.222 هو Microsoft؟ عبر نظام أسماء النطاقات."]},
     {k:'def', x:["The Domain Name System (DNS) is a database of Internet names. DNS servers convert Internet names to IP addresses. Top level domains are part of the system.","نظام أسماء النطاقات (DNS) قاعدة بيانات لأسماء الإنترنت. وتحول خوادم DNS أسماء الإنترنت إلى عناوين IP. ومن عناصره نطاقات المستوى الأعلى (Top level domains)."]},
     {k:'ex', x:["A DNS table maps a NAME (e.g., UGC.EDU) to its IP number.","يربط جدول DNS اسمًا (مثل UGC.EDU) برقم IP الخاص به."]}
   ]},
   {t:["Internet Applications","تطبيقات الإنترنت"], b:[
     {k:'ul', h:["Major applications:","التطبيقات الرئيسية:"], x:[["E-Mail","البريد الإلكتروني"],["File transfers","نقل الملفات"],["Instant messaging (IM)","المراسلة الفورية (IM)"],["Newsgroups","مجموعات الأخبار"],["Streaming audio and video","بث الصوت والفيديو"],["Internet telephony","الهاتف عبر الإنترنت"],["World Wide Web (WWW)","الشبكة العنكبوتية (WWW)"]]},
     {k:'cards', c:[
       {t:["E-Mail","البريد الإلكتروني (E-Mail)"], l:[["Most popular and widely used Internet application; 30 billion e-mails sent every day.","أشهر وأوسع تطبيقات الإنترنت استخدامًا؛ يُرسل 30 مليار رسالة يوميًا."],["Spam - junk e-mail messages; costs corporate America $9 billion per year.","البريد المزعج (Spam) رسائل غير مرغوبة؛ يكلف الشركات الأمريكية 9 مليارات دولار سنويًا."],["Every message contains a header that describes source and destination.","تحتوي كل رسالة على ترويسة (Header) تصف المصدر والوجهة."],["Messages are text but may have attachments of many types of digital data; viruses are often transmitted via e-mail.","الرسائل نصية لكن قد تحمل مرفقات من أنواع كثيرة؛ وغالبًا تنتقل الفيروسات عبر البريد."]]},
       {t:["File Transfers","نقل الملفات"], l:[["File transfer protocol (FTP): transmission of a file between an Internet server and a user's computer.","بروتوكول نقل الملفات (FTP): نقل ملف بين خادم إنترنت وحاسوب المستخدم."],["Peer-to-peer (P2P) file sharing: share data from one computer to another; every user can be a server (Napster, Kazaa, Gnutella).","مشاركة الملفات من ند إلى ند (P2P): مشاركة البيانات بين الحواسيب؛ كل مستخدم يمكن أن يكون خادمًا (Napster وKazaa وGnutella)."],["With P2P, every user can make data available to every other user on the network.","في P2P يستطيع كل مستخدم إتاحة البيانات لكل مستخدم آخر في الشبكة."]]},
       {t:["Instant Messaging (IM)","المراسلة الفورية (IM)"], l:[["Allows a user to create a private chat session with another user.","تتيح إنشاء جلسة دردشة خاصة مع مستخدم آخر."],["IM started with AOL; IM is sneaking into corporate networks.","بدأت IM مع AOL؛ وتتسلل إلى شبكات الشركات."],["Many Web-based companies use IM for customer service (State of Virginia, eBay).","تستخدمها شركات ويب كثيرة لخدمة العملاء (ولاية Virginia وeBay)."]]},
       {t:["Usenet Newsgroups","مجموعات أخبار Usenet"], l:[["Online bulletin board discussion forums; users post and read messages.","منتديات نقاش لوحة إعلانات على الإنترنت؛ ينشر المستخدمون الرسائل ويقرؤونها."],["More than 100,000 newsgroups; millions of readers.","أكثر من 100,000 مجموعة أخبار؛ وملايين القراء."],["Important information resource, especially for technical issues and products.","مصدر معلومات مهم خاصة للقضايا والمنتجات التقنية."],["Messages distributed using an open standard; many are uncensored.","تُوزع الرسائل بمعيار مفتوح؛ والكثير منها غير خاضع للرقابة."]]},
       {t:["Streaming Audio & Video","بث الصوت والفيديو"], l:[["Creating and sending audio and video files.","إنشاء وإرسال ملفات الصوت والفيديو."],["Sports (intercollegiate basketball at sports.yahoo.com, major league baseball), News (Fox News, CNN radio), Business (ZDNet), Education (Warriors of the Net).","الرياضة (كرة السلة الجامعية على sports.yahoo.com والدوري الأمريكي للبيسبول)، الأخبار (Fox News وCNN radio)، الأعمال (ZDNet)، التعليم (Warriors of the Net)."]]},
       {t:["Internet Telephony (VoIP)","الهاتف عبر الإنترنت (VoIP)"], l:[["Voice-over Internet Protocol (VoIP): use your computer like a telephone.","الصوت عبر بروتوكول الإنترنت (VoIP): استخدام الحاسوب كهاتف."],["Software connects computers via the Internet and transmits voice data.","برنامج يربط الحواسيب عبر الإنترنت وينقل بيانات الصوت."],["Savings come from eliminating toll charges between locations.","التوفير يأتي من إلغاء رسوم المكالمات بين المواقع."]]}
     ]}
   ]},
   {t:["The World Wide Web","الشبكة العنكبوتية العالمية (WWW)"], b:[
     {k:'def', x:["The World Wide Web is a collection of hyperlinked computer files on the Internet. It is a client-server application: Web servers, with Web browsers as clients.","الشبكة العنكبوتية مجموعة ملفات حاسوب مترابطة بروابط تشعبية على الإنترنت. وهي تطبيق عميل-خادم: خوادم الويب، ومتصفحات الويب كعملاء."]},
     {k:'cards', c:[
       {t:["Hypertext markup language (HTML)","لغة ترميز النص التشعبي (HTML)"], l:[["Current standard for writing Web pages.","المعيار الحالي لكتابة صفحات الويب."],["Implementation of SGML specifically for Web pages.","تطبيق للغة SGML خاص بصفحات الويب."],["Tags in HTML instruct the client browser how to format and display the Web page content.","توجه وسوم HTML متصفح العميل لكيفية تنسيق محتوى الصفحة وعرضه."]]},
       {t:["Hypertext transfer protocol (HTTP)","بروتوكول نقل النص التشعبي (HTTP)"], l:[["Protocol that establishes a connection between Web server and client.","بروتوكول يقيم الاتصال بين خادم الويب والعميل."]]},
       {t:["Extensible markup language (XML)","لغة الترميز القابلة للتوسع (XML)"], l:[["A meta-markup language.","لغة ترميز فوقية (Meta-markup)."],["Gives meaning to the data enclosed within XML tags.","تعطي معنى للبيانات المحصورة داخل وسوم XML."]]}
     ]},
     {k:'cards', c:[
       {t:["Static Web pages","الصفحات الثابتة (Static)"], l:[["HTML and XML only display and exchange data.","HTML وXML تعرضان البيانات وتتبادلانها فقط."],["No interactivity; no processing of data.","لا تفاعل ولا معالجة للبيانات."]]},
       {t:["Dynamic Web pages","الصفحات الديناميكية (Dynamic)"], l:[["Scripting languages provide basic interactivity: rollovers, crawling text, JavaScript, VBScript.","لغات البرمجة النصية توفر تفاعلًا أساسيًا: Rollovers والنص المتحرك وJavaScript وVBScript."],["Full-featured Web programming: Java, client side (browser side) scripting, applets, J2EE.","برمجة ويب متكاملة: Java، البرمجة من جهة العميل (المتصفح)، Applets، J2EE."],["Common Gateway Interface (CGI): allows passing of data between a static HTML page and a computer program.","واجهة البوابة المشتركة (CGI): تتيح تمرير البيانات بين صفحة HTML ثابتة وبرنامج حاسوب."]]}
     ]}
   ]},
   {t:["Searching the WWW","البحث في الويب"], b:[
     {k:'p', x:["Most data on the Internet is part of the WWW.","معظم بيانات الإنترنت جزء من الويب."]},
     {k:'def', x:["Search engines are large databases that index WWW content.","محركات البحث (Search engines) قواعد بيانات كبيرة تفهرس محتوى الويب."]},
     {k:'ul', h:["Building the search engine database:","بناء قاعدة بيانات محرك البحث:"], x:[["Submit a site to the search engine administrator for listing","تقديم الموقع لمسؤول محرك البحث لإدراجه"],["Spiders","العناكب (Spiders)"],["Metatags","الوسوم الوصفية (Metatags)"],["Examples: Google, Yahoo","أمثلة: Google وYahoo"]]}
   ]},
   {t:["Internet Governance","حوكمة الإنترنت"], b:[
     {k:'cards', c:[
       {t:["Internet Engineering Task Force (IETF)","فريق مهندسي الإنترنت (IETF)"], l:[["Works in groups to develop standards.","يعمل في مجموعات لتطوير المعايير."]]},
       {t:["Internet Engineering Steering Group (IESG)","مجموعة توجيه هندسة الإنترنت (IESG)"], l:[["Approves or disapproves standards developed by the IETF.","يوافق أو يرفض المعايير التي طورها IETF."]]},
       {t:["Internet Architecture Board (IAB)","مجلس معمارية الإنترنت (IAB)"], l:[["The oversight authority for the standards development process.","سلطة الإشراف على عملية تطوير المعايير."]]},
       {t:["World Wide Web Consortium (W3C)","اتحاد الشبكة العالمية (W3C)"], l:[["Promotes the WWW and develops new web technologies and standards.","يروّج للويب ويطور تقنيات ومعايير ويب جديدة."]]}
     ]}
   ]},
   {t:["Intranets and Extranets","الإنترانت والإكسترانت"], b:[
     {k:'cards', c:[
       {t:["Intranet","الإنترانت (Intranet)"], l:[["Internal company network that uses Internet and WWW technologies.","شبكة داخلية للشركة تستخدم تقنيات الإنترنت والويب."],["Flexible and cost efficient.","مرنة وفعالة من حيث التكلفة."],["Uses: find and share documents, collaborate, communicate.","الاستخدامات: إيجاد المستندات ومشاركتها، التعاون، التواصل."],["Only authorized users; secured by a firewall.","للمستخدمين المصرح لهم فقط؛ محمية بجدار ناري (Firewall)."]]},
       {t:["Extranet","الإكسترانت (Extranet)"], l:[["Web site that allows customers and business partners limited access to the organizational intranet.","موقع ويب يتيح للعملاء وشركاء الأعمال وصولًا محدودًا لإنترانت المنظمة."],["Uses Internet and WWW technologies.","يستخدم تقنيات الإنترنت والويب."],["Adds additional security through the use of a Virtual Private Network (VPN).","يضيف أمانًا إضافيًا باستخدام الشبكة الخاصة الافتراضية (VPN)."]]}
     ]}
   ]},
   {t:["Impact of Internet and WWW on the Bead Bar","أثر الإنترنت والويب على Bead Bar"], b:[
     {k:'ul', x:[
       ["Meredith - The Internet makes the Bead Bar a global company and expands the market.","Meredith - يجعل الإنترنت Bead Bar شركة عالمية ويوسع السوق."],
       ["Leda and Miriam - Use the Web site to improve brand image and to create franchisee web sites.","Leda وMiriam - استخدام الموقع لتحسين صورة العلامة وإنشاء مواقع للامتيازات."],
       ["Mitch - Search for information on the cruise industry and opportunities to leverage the Bead Bar.","Mitch - البحث عن معلومات صناعة الرحلات البحرية وفرص الاستفادة لـ Bead Bar."],
       ["Julia - Pleased with the low cost of the Web site and reduced costs to connect headquarters with franchise locations.","Julia - مسرورة بتكلفة الموقع المنخفضة وتقليل تكاليف ربط المقر بمواقع الامتيازات."],
       ["Rachel - Intranet will offer an opportunity to reengineer purchasing procedures.","Rachel - ستتيح الإنترانت فرصة لإعادة هندسة إجراءات الشراء."],
       ["Jim - Develop policies for employee training and for appropriate use for business purposes.","Jim - وضع سياسات لتدريب الموظفين والاستخدام المناسب لأغراض العمل."]]}
   ]}
  ],
  take:[
   ["Internet = thousands of networks using TCP/IP; ISPs give access; NAPs and the backbone carry traffic.","الإنترنت = آلاف الشبكات بـ TCP/IP؛ ISPs تعطي الوصول؛ NAPs والعمود الفقري ينقلان الحركة."],
   ["TCP splits, numbers and reorders packets; IP routes them. DNS converts names to IP addresses.","TCP يقسم الحزم ويرقمها ويعيد ترتيبها؛ IP يوجهها. DNS يحول الأسماء إلى عناوين IP."],
   ["Applications: e-mail, FTP/P2P, IM, newsgroups, streaming, VoIP, WWW.","التطبيقات: بريد، FTP/P2P، مراسلة فورية، مجموعات أخبار، بث، VoIP، ويب."],
   ["Web standards: HTML, HTTP, XML; static vs dynamic pages (scripting, Java, CGI).","معايير الويب: HTML وHTTP وXML؛ صفحات ثابتة مقابل ديناميكية."],
   ["Governance: IETF, IESG, IAB, W3C. Intranet = internal (firewall); extranet = partners/customers (VPN).","الحوكمة: IETF وIESG وIAB وW3C. الإنترانت = داخلية (جدار ناري)؛ الإكسترانت = شركاء/عملاء (VPN)."]
  ],
  fc:[
   [["Describe today's Internet.","صف إنترنت اليوم."],["Thousands of networks connected by legal agreements and commercial contracts, using the TCP/IP protocol.","آلاف الشبكات المرتبطة باتفاقيات قانونية وعقود تجارية وتستخدم TCP/IP."]],
   [["What is an ISP and how do users connect?","ما ISP وكيف يتصل المستخدمون؟"],["Internet service providers give individual users access: dialup (modems, phone lines) or broadband (xDSL, cable modems).","مزودو الخدمة يمنحون الأفراد الوصول: اتصال هاتفي (مودم وخطوط) أو عريض النطاق (xDSL ومودم كابل)."]],
   [["What are NAPs and the backbone?","ما NAPs والعمود الفقري؟"],["NAPs: high-speed routers routing traffic between ISPs and the backbone. Backbone: fiber optic connections owned and operated by large telecommunications companies.","NAPs: موجهات عالية السرعة توجه الحركة بين ISPs والعمود الفقري. العمود الفقري: ألياف ضوئية تملكها شركات اتصالات كبرى."]],
   [["Explain packet switching.","اشرح تبديل الحزم."],["No end-to-end connection required; messages broken into packets that may take different paths to the destination.","لا اتصال شامل مطلوب؛ تُقسم الرسائل إلى حزم قد تسلك مسارات مختلفة للوجهة."]],
   [["TCP vs IP?","TCP مقابل IP؟"],["TCP breaks messages into packets, numbers them and reorders them at the destination. IP routes packets to the proper destination.","TCP يقسم الرسائل إلى حزم ويرقمها ويعيد ترتيبها عند الوجهة. IP يوجه الحزم للوجهة الصحيحة."]],
   [["What is an IP address and what is DNS?","ما عنوان IP وما DNS؟"],["Every Internet computer has a unique IP address (xxx.xxx.xxx.xxx, each 0 - 255). DNS is a database of Internet names; DNS servers convert names to IP addresses.","لكل حاسوب عنوان IP فريد (xxx.xxx.xxx.xxx من 0 إلى 255). DNS قاعدة بيانات أسماء؛ وخوادمه تحول الأسماء إلى عناوين IP."]],
   [["List the major Internet applications.","اذكر تطبيقات الإنترنت الرئيسية."],["E-mail, file transfers, instant messaging, newsgroups, streaming audio and video, Internet telephony, WWW.","بريد، نقل ملفات، مراسلة فورية، مجموعات أخبار، بث صوت وفيديو، هاتف إنترنت، ويب."]],
   [["Facts about e-mail?","حقائق عن البريد الإلكتروني؟"],["Most popular application; 30 billion e-mails daily; spam costs corporate America $9 billion per year; header shows source and destination; attachments can carry viruses.","الأشهر؛ 30 مليار رسالة يوميًا؛ البريد المزعج يكلف 9 مليارات دولار سنويًا؛ الترويسة تبين المصدر والوجهة؛ المرفقات قد تحمل فيروسات."]],
   [["FTP vs P2P?","FTP مقابل P2P؟"],["FTP transmits a file between an Internet server and a user's computer. P2P: every user can be a server and share data (Napster, Kazaa, Gnutella).","FTP ينقل ملفًا بين خادم وحاسوب المستخدم. P2P: كل مستخدم يمكن أن يكون خادمًا ويشارك البيانات."]],
   [["What are IM, newsgroups and streaming?","ما IM ومجموعات الأخبار والبث؟"],["IM: private chat session (started with AOL; used for customer service). Newsgroups: Usenet bulletin boards with 100,000+ groups. Streaming: creating and sending audio and video files.","IM: دردشة خاصة (بدأت مع AOL وتستخدم لخدمة العملاء). مجموعات الأخبار: لوحات Usenet بأكثر من 100,000 مجموعة. البث: إنشاء وإرسال ملفات الصوت والفيديو."]],
   [["What is VoIP and how does it save money?","ما VoIP وكيف يوفر المال؟"],["Voice-over Internet Protocol: use your computer like a telephone; software transmits voice data over the Internet; savings by eliminating toll charges between locations.","الصوت عبر IP: استخدام الحاسوب كهاتف؛ ينقل البيانات الصوتية عبر الإنترنت؛ التوفير بإلغاء رسوم المكالمات بين المواقع."]],
   [["Define the WWW.","عرّف الويب WWW."],["A collection of hyperlinked computer files on the Internet; a client-server application with Web servers and browsers as clients.","مجموعة ملفات مترابطة بروابط تشعبية؛ تطبيق عميل-خادم: خوادم ويب ومتصفحات كعملاء."]],
   [["HTML vs HTTP vs XML?","HTML مقابل HTTP مقابل XML؟"],["HTML: standard for writing Web pages (SGML implementation; tags format display). HTTP: connects Web server and client. XML: meta-markup language giving meaning to data in its tags.","HTML: معيار كتابة الصفحات (تنفيذ SGML؛ الوسوم تنسق العرض). HTTP: يصل الخادم بالعميل. XML: لغة ترميز فوقية تعطي معنى للبيانات."]],
   [["Static vs dynamic Web pages?","الصفحات الثابتة مقابل الديناميكية؟"],["Static: no interactivity or processing. Dynamic: scripting (rollovers, crawling text, JavaScript, VBScript), Java, applets, J2EE, and CGI to pass data between HTML pages and programs.","الثابتة: بلا تفاعل أو معالجة. الديناميكية: برمجة نصية، Java وApplets وJ2EE وCGI لتمرير البيانات بين الصفحة والبرنامج."]],
   [["How do search engines work?","كيف تعمل محركات البحث؟"],["They are large databases indexing WWW content, built by submitting sites to administrators, spiders and metatags (e.g., Google, Yahoo).","قواعد بيانات تفهرس الويب، وتُبنى بتقديم المواقع للمسؤولين والعناكب والوسوم الوصفية (مثل Google وYahoo)."]],
   [["Who governs the Internet?","من يحكم الإنترنت؟"],["IETF (develops standards), IESG (approves/disapproves them), IAB (oversight authority), W3C (promotes WWW, develops web technologies and standards).","IETF (يطور المعايير)، IESG (يوافق/يرفض)، IAB (الإشراف)، W3C (يروج للويب ويطور تقنياته ومعاييره)."]],

/* ============================================================
   STATE + STORAGE
   ============================================================ */
const KEY = 'studyHubV2';
const store = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } })();
const state = { lang: store.lang||'en', subject:SUBJECT.id, page:'home', sidebar: window.innerWidth>=1024, data: store.data||{}, decks:{}, qz:{}, exam:null };
function save(){
  try{
    const cur=JSON.parse(localStorage.getItem(KEY)||'{}'); cur.data=cur.data||{};
    cur.lang=state.lang;
    const d=sd(SUBJECT.id); d.mastery=mastery(SUBJECT); d.n=SUBJECT.lectures.length;
    cur.data[SUBJECT.id]=d;
    localStorage.setItem(KEY, JSON.stringify(cur));
  }catch(e){}
}
const subj = () => SUBJECTS.find(s=>s.id===state.subject);
const LECT = () => subj().lectures;
function sd(id){ id=id||state.subject; return state.data[id]||(state.data[id]={seen:{},best:{},exam:0}); }
function mastery(s){
  if(!s.ready) return 0;
  const d=sd(s.id); let sum=0;
  s.lectures.forEach(l=>{ sum += (d.best[l.id]||0)/100; });
  sum += (d.exam||0)/100;
  return Math.round(sum/(s.lectures.length+1)*100);
}

/* ============================================================
   HELPERS  (invisible citation handling + XSS protection)
   ============================================================ */
const clean = s => String(s)
  .replace(/<\/?(antml:)?cite[^>]*>/gi,'')
  .replace(/\[cite[^\]]*\]/gi,'')
  .replace(/\[(source|ref)[^\]]*\]/gi,'')
  .replace(/[ \t]{2,}/g,' ').trim();
const esc = s => clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/(\$?\d[\d,.]*\d|\$?\d)/g,'<span class="mono">$1</span>');
const li = () => state.lang==='ar'?1:0;
const tx = a => fmt(a[li()]);
const u = k => UI[k][li()];
const $ = id => document.getElementById(id);
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function mixQ(q){ const idx=shuf(q.o.map((_,i)=>i)); return {q:q.q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)}; }
function applyTheme(){
  const t = THEMES[(state.subject&&subj().color)||'teal'];
  document.documentElement.style.setProperty('--b5',t[0]);
  document.documentElement.style.setProperty('--b6',t[1]);
}

function deckHTML(id){
  const d=state.decks[id], c=d.list[d.i], l=li();

}

    </details>

    ${L.sec.map((s,i)=>`<section class="bg-dark-elevated border border-dark-border rounded-2xl p-5 mb-5">
        <h2 class="text-xl font-bold mb-2 flex items-center gap-2"><span class="mono text-sm bg-brand-600 text-white rounded-md px-2 py-0.5">${i+1}</span>${tx(s.t)}</h2>${s.b.map(renderBlock).join('')}</section>`).join('')}
    <div class="bg-brand-500/10 border border-brand-500 rounded-2xl p-5 mb-5">
      <h2 class="font-bold text-lg mb-2 text-brand-500">⭐ ${u('take')}</h2>
      <ul class="space-y-1">${L.take.map(t=>`<li class="flex gap-2"><span class="text-brand-500">★</span><span>${tx(t)}</span></li>`).join('')}</ul>
    </div>
    <div class="bg-dark-elevated border border-dark-border rounded-2xl p-5 mb-5">
      <h2 class="font-bold text-lg mb-3">🃏 ${u('flash')}</h2>
      ${deckBox('fc-'+L.id,'l',L.fc)}
    </div>

    <details class="group bg-dark-elevated border border-dark-border open:border-brand-500 rounded-2xl mb-5 overflow-hidden transition-all">
      <summary class="cursor-pointer list-none px-5 py-3.5 flex items-center justify-between hover:bg-white/5 select-none">
        <span class="font-bold text-lg">📝 ${u('quiz')} <span class="mono text-sm text-dark-muted">(${L.quiz.length})</span></span>
        <div class="flex items-center gap-3">
          ${d.best[L.id]!=null?`<span class="mono text-xs text-dark-muted">${u('best')}:${d.best[L.id]}%</span>`:''}
          <span class="mono text-xs text-brand-500 transition-transform duration-300 group-open:rotate-180">▼</span>
        </div>
      </summary>
      <div class="px-5 pb-5 pt-3 border-t border-dark-border [&>div:first-child]:hidden" data-quiz="${L.id}" id="quiz-${L.id}">${quizInner(L)}</div>
    </details>

    <div class="flex justify-between gap-3">
      ${prev?`<button data-go="${prev.id}" class="px-4 py-2 rounded-lg bg-dark-elevated border border-dark-border hover:border-brand-500">${ar?'→':'←'}${u('prev')}</button>`:'<span></span>'}
      ${next?`<button data-go="${next.id}" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white">${u('next')}${ar?'←':'→'}</button>`:`<button data-go="exam" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white">${u('exam')}${ar?'←':'→'}</button>`}
    </div></div>`;
}

function gItems(list){
  return list.map(g=>`<div class="bg-dark-elevated border border-dark-border rounded-xl p-3 flex flex-wrap justify-between gap-2"><span class="mono text-brand-500 font-semibold" dir="ltr">${esc(g[0])}</span><span class="font-semibold" dir="rtl" style="font-family:Cairo">${esc(g[1])}</span></div>`).join('') || '<div class="text-dark-muted">—</div>';
}
function renderGlossary(){
  const G=subj().glossary;
  return `<div class="fade">
    <h1 class="text-3xl font-extrabold mb-1">Glossary / قاموس المصطلحات</h1>
    <p class="text-dark-muted mb-5 mono text-sm">${G.length} terms</p>
    <div class="bg-dark-elevated border border-dark-border rounded-2xl p-5 mb-6">
      <h2 class="font-bold text-lg mb-3">🃏 ${u('glossFlash')}</h2>
      ${deckBox('gl','g',shuf(G))}
    </div>
    <h2 class="font-bold text-lg mb-2">📖 ${u('glossList')}</h2>
    <input id="gSearch" placeholder="${u('search')}" class="w-full p-3 rounded-xl bg-dark-elevated border border-dark-border focus:border-brand-500 outline-none mb-4">
    <div id="gList" class="grid gap-2">${gItems(G)}</div></div>`;
}
/* ---------- DOWNLOADS ---------- */
const DL_FILE = {icon:'📕', title:["Lecture slides (PDF)"," المحاضرات كاملة(PDF)"], desc:["in one file","في ملف واحد"], url:'lec/IS_S2_Full.pdf', file:'IS_S2_Full.pdf'};
function renderDownloads(){
  const it=DL_FILE;
  return `<div class="fade">
    <div class="rounded-2xl bg-gradient-to-br from-brand-600 to-dark-elevated p-6 mb-6 border border-dark-border text-center">
      <div class="dl-hero-ico text-5xl mb-2">⬇️</div>
      <h1 class="text-3xl font-extrabold mb-1">${u('dl')}</h1>
      <p class="text-white/80 max-w-xl mx-auto">${u('dlIntro')}</p>
    </div>
    <div class="grid gap-4 max-w-md mx-auto">
      <div class="dl-card bg-dark-elevated border border-dark-border rounded-2xl p-5 flex flex-col" style="--d:120ms">
        <div class="dl-card-ico text-4xl mb-3">${it.icon}</div>
        <div class="font-bold text-lg mb-1">${tx(it.title)}</div>
        <p class="text-sm text-dark-muted flex-1 mb-3">${tx(it.desc)}</p>
        <button data-act="dl-url" data-url="${esc(it.url)}" data-file="${esc(it.file)}" class="dl-btn w-full px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold flex items-center justify-center gap-2"><span class="dl-bar"></span><span class="dl-label flex items-center gap-2"><span>⬇️</span><span>${u('download')}</span></span></button>
      </div></div></div>`;
}
function runDownload(a){
  if(a.classList.contains('dl-busy')) return;
  const label=a.querySelector('.dl-label'), orig=label.innerHTML;
  a.classList.add('dl-busy'); label.innerHTML=`<span>⏳</span><span>${u('dlPrep')}</span>`;
  setTimeout(()=>{
    const l=document.createElement('a'); l.href=a.dataset.url; l.download=a.dataset.file; document.body.appendChild(l); l.click(); l.remove();
    a.classList.remove('dl-busy'); a.classList.add('dl-done'); label.innerHTML=`<span>${u('dlDone')}</span>`;
    setTimeout(()=>{ a.classList.remove('dl-done'); label.innerHTML=orig; },2200);
  },950);
}
/* ---------- FINAL EXAM ---------- */
function pool(){ const p=[]; LECT().forEach(l=>l.quiz.forEach(q=>p.push(q))); return p; }
function newExam(size){
  const qs=shuf(pool()).slice(0,size).map(mixQ);
  state.exam={qs,i:0,score:0,wrong:[],finished:false,size};
}
function renderExam(){
  const e=state.exam, total=pool().length, d=sd();
  if(!e){
    const sizes=[20,40,total];
    return `<div class="fade text-center py-8"><h1 class="text-3xl font-extrabold mb-2">🏆 ${u('exam')}</h1>
      <p class="text-dark-muted mb-1">${state.lang==='ar'?`بنك الأسئلة: ${total} سؤالًا من كل المحاضرات. تتغير الأسئلة وترتيب الخيارات في كل مرة.`:`Question bank: ${total} questions from all lectures. Questions and answer order change every time.`}</p>
      <p class="mono text-sm text-dark-muted mb-6">${u('best')}: ${d.exam?d.exam+'%':'—'}</p>
      <p class="font-semibold mb-3">${u('chooseSize')}</p>
      <div class="flex flex-wrap justify-center gap-3">${sizes.map((n,i)=>`<button data-size="${n}" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold"><span class="mono">${n}</span> ${i===2?`(${u('all')})`:u('questions')}</button>`).join('')}</div></div>`;
  }
  if(e.finished){
    const p=Math.round(e.score/e.qs.length*100);
    return `<div class="fade py-6"><div class="text-center">
      <h1 class="text-3xl font-extrabold mb-3">🏆 ${u('exam')}</h1>
      <div class="mono text-5xl font-extrabold ${p>=90?'text-green-400':p>=60?'text-amber-400':'text-red-400'} mb-2">${e.score}/${e.qs.length}</div>
      <div class="mono text-xl mb-4">${p}%</div>
      <p class="mb-6">${p>=90?(state.lang==='ar'?'ممتاز! أنت جاهز للامتحان 🎉':'Excellent! You are ready 🎉'):(state.lang==='ar'?'راجع المحاضرات وأعد المحاولة للوصول إلى 90%+':'Review the lectures and try again to reach 90%+')}</p>
      <button data-act="examAgain" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold">${u('retry')}</button></div>
      ${e.wrong.length?`<h2 class="font-bold text-lg mt-8 mb-3">❌ ${u('mistakes')} (${e.wrong.length})</h2>
      ${e.wrong.map(w=>`<div class="bg-dark-elevated border border-dark-border border-s-4 border-s-red-500 rounded-xl p-4 mb-3"><div class="font-semibold mb-1">${tx(w.q)}</div><div class="text-sm text-green-400">${u('yourAns')}: ${tx(w.c)}</div></div>`).join('')}`:''}
    </div>`;
  }
  const q=e.qs[e.i];
  return `<div class="fade"><h1 class="text-2xl font-extrabold mb-3">🏆 ${u('exam')}</h1>
    <div class="h-2 bg-dark-surface rounded-full mb-4 overflow-hidden"><div class="h-full bg-brand-500" style="width:${e.i/e.qs.length*100}%"></div></div>
    <div data-exam="1">${qHTML(q,e.i+1,e.qs.length)}</div>
    <div class="flex justify-between items-center"><span class="mono text-sm text-dark-muted">${u('score')}: ${e.score}</span>
    <button id="examNext" class="hidden px-5 py-2 rounded-lg bg-brand-600 text-white">${e.i===e.qs.length-1?u('finish'):u('next')}</button></div></div>`;
}

/* ============================================================
   SHELL: nav, layout, render
   ============================================================ */
function renderNav(){
  const item=(id,icon,label,extra='')=>`<button data-go="${id}" class="w-full flex items-center gap-3 text-start px-3 py-2.5 rounded-lg transition ${state.page===id?'bg-brand-600 text-white':'hover:bg-dark-elevated text-dark-text'}"><span>${icon}</span><span class="flex-1 text-sm">${label}</span>${extra}</button>`;
  const head=t=>`<div class="px-3 pt-3 pb-1 text-xs uppercase tracking-wider text-dark-muted">${t}</div>`;
  const s=subj(), d=sd();
  let h=`<a href="index.html" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-dark-elevated text-dark-text"><span>🗂️</span><span class="flex-1 text-sm">${u('hub')}</span></a>`;
  h += `<div class="px-3 pt-3 pb-1 text-sm font-bold text-brand-500">${s.icon} ${tx(s.name)}</div>`;
  h += item('home','🏠',u('home'));
  h += head(u('lectures')) + s.lectures.map(l=>item(l.id,`<span class="mono text-xs">${l.n}</span>`,tx(l.title),d.best[l.id]!=null?`<span class="mono text-[10px] opacity-80">${d.best[l.id]}%</span>`:'')).join('');
  h += head(u('tools')) + item('exam','🏆',u('exam'),d.exam?`<span class="mono text-[10px] opacity-80">${d.exam}%</span>`:'') + item('downloads','<span class="dl-ico">⬇️</span>',u('dl')) + item('glossary','📖','Glossary / قاموس المصطلحات');
  $('nav').innerHTML=h;
}
function applyLayout(){
  const sb=$('sidebar'), main=$('main'), bd=$('backdrop');
  sb.classList.toggle('ltr:-translate-x-full',!state.sidebar);
  sb.classList.toggle('rtl:translate-x-full',!state.sidebar);
  main.classList.toggle('lg:ps-72',state.sidebar);
  bd.classList.toggle('hidden',!(state.sidebar && window.innerWidth<1024));
}
function updateTop(){
  const show=!!state.subject, m=show?mastery(subj()):0;
  $('topProgWrap').classList.toggle('hidden',!show); $('topProgWrap').classList.toggle('sm:flex',show);
  $('topBar').style.width=m+'%'; $('topPct').textContent=m+'%';
}
function render(){
  document.documentElement.lang=state.lang;
  document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
  $('langBtn').textContent = state.lang==='ar'?'English':'العربية';
  applyTheme();
  const lects = state.subject?LECT():[];
  const idx=lects.findIndex(l=>l.id===state.page);
  let html='', title='';
  if(state.page==='home'){ html=renderHome(); title=tx(subj().name).replace(/<[^>]+>/g,''); }
  else if(idx>=0){ html=renderLecture(lects[idx],idx); title=`${u('lecture')} ${lects[idx].n}`; }
  else if(state.page==='exam'){ html=renderExam(); title=u('exam'); }
    else if(state.page==='Downloads Lectures'){ html=renderDownloads(); title=u('dl'); }

  else if(state.page==='glossary'){ html=renderGlossary(); title='Glossary / قاموس المصطلحات'; }
  $('app').innerHTML=html; $('topTitle').textContent=title;
  updateTop(); renderNav(); applyLayout();
}
function go(p){
  state.page=p; state.qz={}; state.decks={}; if(p!=='exam') state.exam=null;
  if(window.innerWidth<1024) state.sidebar=false;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }

  const sz=e.target.closest('[data-size]'); if(sz){ newExam(+sz.dataset.size); render(); window.scrollTo({top:0}); return; }

  const opt=e.target.closest('.opt');
  if(opt){
    const box=opt.closest('.qbox'); if(box.dataset.done) return;
    box.dataset.done='1';
    const a=+box.dataset.a, i=+opt.dataset.i, ok=(i===a);
    if(ok) box.dataset.ok='1';
    box.querySelectorAll('.opt').forEach(b=>{
      b.disabled=true; b.classList.remove('hover:border-brand-500'); b.classList.add('cursor-not-allowed');
      if(+b.dataset.i===a) b.classList.add('!bg-green-600/30','!border-green-500');
    });
    if(!ok) opt.classList.add('!bg-red-600/30','!border-red-500');
    const fb=box.querySelector('.fb'); fb.classList.remove('hidden');
    fb.className='fb mt-3 text-sm font-semibold '+(ok?'text-green-400':'text-red-400');
    fb.textContent=ok?u('correct'):u('wrong');

    const exam=box.closest('[data-exam]');
    if(exam){
      const ex=state.exam, q=ex.qs[ex.i];
      if(ok) ex.score++; else ex.wrong.push({q:q.q,c:q.o[q.a]});
      $('examNext').classList.remove('hidden'); return;
    }
    const qz=box.closest('[data-quiz]');
    if(qz){
      const boxes=[...qz.querySelectorAll('.qbox')];
      if(boxes.every(b=>b.dataset.done)){
        const sc=boxes.filter(b=>b.dataset.ok).length, pct=Math.round(sc/boxes.length*100);
        const sEl=qz.querySelector('.qscore'); sEl.classList.remove('hidden');
        qz.querySelector('.qs-text').textContent=`${u('score')}: ${sc}/${boxes.length} (${pct}%)`;
        const d=sd(), id=qz.dataset.quiz;
        if(d.best[id]==null||pct>d.best[id]){ d.best[id]=pct; save(); }
        updateTop(); renderNav();
      }
    }
    return;
  }

  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act==='dl-url'){ runDownload(a); return; }
  if(act.startsWith('dk-')){
    const id=a.dataset.deck, d=state.decks[id]; if(!d) return;
    if(act==='dk-flip'){ d.flip=!d.flip; const f=document.querySelector(`#deck-${id} .flip`); if(f) f.classList.toggle('on',d.flip); return; }
    if(act==='dk-next') d.i=(d.i+1)%d.list.length;
    if(act==='dk-prev') d.i=(d.i-1+d.list.length)%d.list.length;
    if(act==='dk-shuf'){ d.list=shuf(d.list); d.i=0; }
    d.flip=false; redrawDeck(id); return;
  }
  if(act==='retryQuiz'){
    const L=LECT().find(l=>l.id===a.dataset.id); delete state.qz[L.id];
    $('quiz-'+L.id).innerHTML=quizInner(L); $('quiz-'+L.id).scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if(act==='examAgain'){ state.exam=null; render(); return; }
  if(act==='reset'){ state.data[state.subject]={seen:{},best:{},exam:0}; save(); render(); return; }
});
document.addEventListener('click',e=>{
  if(e.target.id==='examNext'){
    const ex=state.exam;
    if(ex.i<ex.qs.length-1) ex.i++;
    else { ex.finished=true; const p=Math.round(ex.score/ex.qs.length*100), d=sd(); if(p>(d.exam||0)){ d.exam=p; save(); } }
    render(); window.scrollTo({top:0});
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='gSearch'){
    const q=e.target.value.toLowerCase();
    $('gList').innerHTML=gItems(subj().glossary.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(q)));
  }
});
$('menuBtn').onclick=()=>{ state.sidebar=!state.sidebar; applyLayout(); };
$('backdrop').onclick=()=>{ state.sidebar=false; applyLayout(); };
$('langBtn').onclick=()=>{ state.lang=state.lang==='ar'?'en':'ar'; save(); render(); };
window.addEventListener('resize',applyLayout);

render();
</script>
</body>
</html>
