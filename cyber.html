<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: {
          400: 'rgb(var(--b4) / <alpha-value>)',
          500: 'rgb(var(--b5) / <alpha-value>)',
          600: 'rgb(var(--b6) / <alpha-value>)'
        },
        dark: {
          base: '#04070e',
          surface: '#0a0f1d',
          elevated: '#11182b',
          border: '#1e293b',
          text: '#f8fafc',
          muted: '#94a3b8'
        }
      },
      fontFamily: {
        sans: ['Inter', 'sans-serif'],
        arabic: ['Cairo', 'sans-serif'],
        mono: ['JetBrains Mono', 'monospace']
      }
    }
  }
}
</script>
<style>
  :root {
    --b4: 251 146 60;
    --b5: 249 115 22; /* Cyber Orange Default */
    --b6: 234 88 12;
  }

  [data-theme="cyan"] {
    --b4: 56 189 248;
    --b5: 6 182 212;
    --b6: 8 145 178;
  }
  [data-theme="emerald"] {
    --b4: 52 211 153;
    --b5: 16 185 129;
    --b6: 5 150 105;
  }
  [data-theme="violet"] {
    --b4: 192 132 252;
    --b5: 168 85 247;
    --b6: 147 51 234;
  }

  html[lang="en"] body { font-family: 'Inter', sans-serif; }
  html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  body {
    background-color: #04070e;
    background-image:
      radial-gradient(circle at 50% 0%, rgb(var(--b5) / 0.12), transparent 55%),
      linear-gradient(to right, rgba(30, 41, 59, 0.35) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(30, 41, 59, 0.35) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    overflow-x: hidden;
  }

  /* Ambient Orbs */
  .bg-glow { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-glow span {
    position: absolute; border-radius: 50%; filter: blur(110px); will-change: transform;
  }
  .bg-glow .orb1 { width: 460px; height: 460px; top: -12%; left: -8%; background: rgb(var(--b5) / .24); animation: drift1 24s ease-in-out infinite; }
  .bg-glow .orb2 { width: 400px; height: 400px; bottom: -14%; right: -8%; background: rgba(56, 189, 248, .18); animation: drift2 30s ease-in-out infinite; }
  .bg-glow .orb3 { width: 320px; height: 320px; top: 42%; left: 55%; background: rgba(168, 85, 247, .14); animation: drift3 36s ease-in-out infinite; }

  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(110px,70px) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-90px,-60px) scale(1.1); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px,50px) scale(1.2); } }

  #netCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  main, header, footer { position: relative; z-index: 1; }

  /* Custom Cyber Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #04070e; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
  ::-webkit-scrollbar-thumb:hover { background: rgb(var(--b5)); }

  /* Animations */
  .fade { animation: fade .3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .terminal-cursor { animation: blink 0.8s infinite; }

  /* Cyber Card Spotlight & Corner Brackets */
  .cyber-card {
    position: relative;
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.82) 0%, rgba(10, 15, 29, 0.94) 100%);
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.28s ease, box-shadow 0.28s ease;
    overflow: hidden;
  }
  .cyber-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      500px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
      rgb(var(--card-rgb, var(--b5)) / 0.14),
      transparent 45%
    );
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .cyber-card:hover::before {
    opacity: 1;
  }
  .cyber-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 38px -15px rgba(0, 0, 0, 0.7), 0 0 25px -5px rgb(var(--card-rgb, var(--b5)) / 0.28);
  }

  /* Subtle CRT Scanline overlay for Terminal Box */
  .scanlines {
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 50%,
      rgba(0, 0, 0, 0.2) 50%,
      rgba(0, 0, 0, 0.2)
    );
    background-size: 100% 4px;
  }

  /* Shimmer Progress Bar */
  .progress-shimmer {
    position: relative;
    overflow: hidden;
  }
  .progress-shimmer::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: translateX(-100%);
    animation: shimmer 2.8s infinite;
  }
  @keyframes shimmer {
    100% { transform: translateX(100%); }
  }
</style>
</head>

<!-- Interactive Network Topology Canvas -->

<!-- Top Cyber-HUD Telemetry Bar (Waybar Inspired) -->
<header class="fixed top-0 inset-x-0 z-40 h-16 bg-dark-surface/85 backdrop-blur-xl border-b border-dark-border/80 px-3 sm:px-6 flex items-center justify-between gap-2">
  <!-- Brand Identity -->
  <div class="flex items-center gap-3">
    <a href="index.html" class="group flex items-center gap-2.5 focus:outline-none">
      <div class="relative w-9 h-9 rounded-xl bg-dark-elevated border border-brand-500/40 flex items-center justify-center p-1.5 shadow-inner group-hover:border-brand-500 transition">
        <img src="it-logo.svg" alt="IT Logo" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <svg class="hidden w-5 h-5 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

      </div>

        <div class="font-extrabold text-sm sm:text-base tracking-tight mono flex items-center gap-1.5">

  <!-- Right Controls: Theme Dots + Language Toggle -->
  <div class="flex items-center gap-2 sm:gap-3">
    <!-- Accent Theme Switcher -->
    <div class="flex items-center gap-1.5 bg-dark-base/90 border border-dark-border rounded-xl px-2.5 py-1.5" title="Switch HUD Accent Color">
      <button onclick="setAccent('orange')" class="w-3.5 h-3.5 rounded-full bg-orange-500 hover:scale-125 transition ring-2 ring-offset-1 ring-offset-dark-base ring-transparent" id="theme-orange" aria-label="Orange Theme"></button>
      <button onclick="setAccent('cyan')" class="w-3.5 h-3.5 rounded-full bg-cyan-400 hover:scale-125 transition ring-2 ring-offset-1 ring-offset-dark-base ring-transparent" id="theme-cyan" aria-label="Cyan Theme"></button>
      <button onclick="setAccent('emerald')" class="w-3.5 h-3.5 rounded-full bg-emerald-400 hover:scale-125 transition ring-2 ring-offset-1 ring-offset-dark-base ring-transparent" id="theme-emerald" aria-label="Emerald Theme"></button>
      <button onclick="setAccent('violet')" class="w-3.5 h-3.5 rounded-full bg-purple-500 hover:scale-125 transition ring-2 ring-offset-1 ring-offset-dark-base ring-transparent" id="theme-violet" aria-label="Violet Theme"></button>
    </div>

    <!-- Language Toggle Button -->
    <button id="langBtn" class="px-3.5 py-1.5 rounded-xl bg-dark-elevated hover:bg-brand-500/20 border border-dark-border hover:border-brand-500 text-white text-xs sm:text-sm font-bold mono transition flex items-center gap-1.5 shadow-sm"></button>
  </div>
</header>

<!-- Main Application Container -->

<!-- Cyber Footer -->

      <span>[ tip: press <kbd class="px-1.5 py-0.5 bg-dark-elevated border border-dark-border rounded text-brand-400">/</kbd> to search modules ]</span>
    </div>

<script>
// Core Subjects Data (100% Preserved File Links & IDs)
const SUBJECTS = [
  {id:'prg', code:'0x01', category:'core', file:'Programming.html', color:'yellow', ready:true, icon:'⚡', header:'Programming.h', lecCount:'10',
   name:["Programming","البرمجة المتقدمة"],
   desc:["Object-Oriented C++, Pointers, Memory & Data Structures","البرمجة الشيئية بلغة C++، المؤشرات، وهياكل البيانات"]},
  {id:'it',  code:'0x02', category:'core', file:'IT.html', color:'blue', ready:true, icon:'🌐', header:'Networking.h', lecCount:'10 ',
   name:["Introduction to IT","مقدمة في تقنية المعلومات"],
   desc:["Network Architecture, Protocols, OS & System Infrastructure","معمارية الشبكات، البروتوكولات، أنظمة التشغيل والبنية التحتية"]},
  {id:'mth', code:'0x03', category:'math', file:'DiscreteMath.html', color:'pink', ready:true, icon:'🧮', header:'Math.h', lecCount:'8',
   name:["Discrete Math","الرياضيات المنفصلة"],
   desc:["Logic Gates, Set Theory, Relations, Graph Theory & Proofs","المنطق الرياضي، الفئات، العلاقات، نظرية المخططات والإثبات"]},
  {id:'is',  code:'0x04', category:'core', file:'InformationSystems.html', color:'orange', ready:true, icon:'🗄️', header:'Systems.h', lecCount:'7',
   name:["Information Systems","نظم المعلومات (IS)"],
   desc:["TPS, MIS, DSS, Database Management & Enterprise Architecture","نظم معالجة المعاملات، دعم القرار، وإدارة قواعد البيانات"]},
  {id:'Etc', code:'0x05', category:'biz', file:'ComputerEthics.html', color:'green', ready:true, icon:'⚖️', header:'Ethics.h', lecCount:'8',
   name:["Computer Ethics","أخلاقيات الكمبيوتر"],
   desc:["Cybersecurity Ethics, Data Privacy, IP Rights & AI Governance","أخلاقيات الأمن السيبراني، خصوصية البيانات، وحوكمة الذكاء الاصطناعي"]},
  {id:'eng', code:'0x06', category:'math', file:'TechnicalEnglish.html', color:'red', ready:true, icon:'📜', header:'English.h غير مكتمله', lecCount:'8',
   name:["Technical English II","اللغة الإنجليزية التقنية 2"],
   desc:["SRS Formulation, Incident Reports, Security Policies & IT Emails","كتابة مواصفات الأنظمة SRS، تقارير الحوادث، والمراسلات التقنية"]},
  {id:'biz', code:'0x07', category:'biz', file:'Business.html', color:'teal', ready:true, icon:'💼', header:'Business.h', lecCount:'7 ',
   name:["Business Fundamentals","أساسيات الأعمال"],
   desc:["Tech Startups, Ownership Models, Marketing Mix & Operations","الشركات التقنية الناشئة، نماذج الملكية، التسويق وإدارة العمليات"]},
  {id:'acc', code:'0x08', category:'biz', file:'Accounting.html', color:'purple', ready:true, icon:'📊', header:'Financial.h', lecCount:'6',
   name:["Principles of Accounting","مبادئ المحاسبة"],
   desc:["Financial Statements, Balance Sheets, Budgeting & FinTech","القوائم المالية، الميزانية العمومية، التخطيط المالي والتقنية المالية"]},
];

const THEMES = {
  teal:   ['20 184 166','13 148 136'],
  pink:   ['236 72 153','219 39 119'],
  purple: ['168 85 247','147 51 234'],
  blue:   ['59 130 246','37 99 235'],
  orange: ['249 115 22','234 88 12'],
  green:  ['34 197 94','22 163 74'],
  yellow: ['234 179 8','202 138 4'],
  red:    ['239 68 68','220 38 38']
};

const KEY = 'studyHubV2';
function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || '{}'); }
  catch(e) { return {}; }
}
function saveState(updater) {
  try {
    const current = load();
    updater(current);
    localStorage.setItem(KEY, JSON.stringify(current));
  } catch(e) {}
}

let lang = load().lang || 'ar';
let currentAccent = load().accent || 'orange';
let activeFilter = 'all';
let searchQuery = '';
let terminalHistory = [];

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Apply HUD Accent Theme
function setAccent(accent) {
  currentAccent = accent;
  if (accent === 'orange') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', accent);
  }
  ['orange','cyan','emerald','violet'].forEach(a => {
    const btn = document.getElementById('theme-' + a);
    if (btn) {
      btn.classList.toggle('ring-white', a === accent);
      btn.classList.toggle('scale-110', a === accent);
    }
  });
  saveState(c => { c.accent = accent; });
}

// Live Clock in Header
function updateClock() {
  const el = document.getElementById('liveClock');
  if (!el) return;
  const now = new Date();
  el.textContent = now.toTimeString().split(' ')[0];
}
setInterval(updateClock, 1000);

// Compute Aggregate Statistics
function getStats() {
  const data = load().data || {};
  let totalMastery = 0;
  let totalLectures = 0;
  let startedCount = 0;
  SUBJECTS.forEach(s => {
    const m = s.ready ? Number((data[s.id] || {}).mastery || 0) : 0;
    totalMastery += m;
    if (m > 0) startedCount++;
    totalLectures += parseInt(s.lecCount, 10) || 0;
  });
  const avgMastery = Math.round(totalMastery / SUBJECTS.length);
  return { avgMastery, totalLectures, startedCount, totalModules: SUBJECTS.length };
}

function render() {
  const ar = lang === 'ar';
  const data = load().data || {};
  const stats = getStats();

  document.documentElement.lang = lang;
  document.documentElement.dir = ar ? 'rtl' : 'ltr';
  document.getElementById('langBtn').innerHTML = ar
    ? `<span>EN</span><span class="text-brand-400 text-[11px]">/ العربية</span>`
    : `<span>AR</span><span class="text-brand-400 text-[11px]">/ English</span>`;

  const hudBadge = document.getElementById('hudMasteryBadge');
  if (hudBadge) hudBadge.textContent = `SYNC: ${stats.avgMastery}%`;

  // Filter Subjects by Category + Search Query
  const filteredSubjects = SUBJECTS.filter(s => {
    const matchesCategory = activeFilter === 'all' || s.category === activeFilter;
    const q = searchQuery.trim().toLowerCase();
    const matchesSearch = !q ||
      s.name[0].toLowerCase().includes(q) ||
      s.name[1].toLowerCase().includes(q) ||
      s.header.toLowerCase().includes(q) ||
      s.id.toLowerCase().includes(q) ||
      s.desc[0].toLowerCase().includes(q) ||
      s.desc[1].toLowerCase().includes(q);
    return matchesCategory && matchesSearch;
  });

  const cards = filteredSubjects.map(s => {
    const t = THEMES[s.color];
    const d = data[s.id] || {};
    const m = s.ready ? (d.mastery || 0) : 0;
    const tag = s.ready ? `a href="${esc(s.file)}"` : 'div';
    const close = s.ready ? 'a' : 'div';
    const statusLabel = m >= 80 ? (ar ? 'مكتمل ممتاز' : 'OPTIMAL') : m > 0 ? (ar ? 'قيد الدراسة' : 'IN_PROGRESS') : (ar ? 'جاهز للتشغيل' : 'READY');

    return `<${tag} class="cyber-card group block text-start rounded-2xl p-5 sm:p-6 border border-dark-border/90 hover:border-brand-500/60 transition ${s.ready ? 'cursor-pointer' : 'opacity-70 cursor-not-allowed'}" style="--card-rgb: ${t[0]}; border-top: 3px solid rgb(${t[0]})">
      <!-- Top Meta Row -->
      <div class="flex items-center justify-between gap-2 mb-3.5 relative z-10">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl border transition group-hover:scale-110" style="background: rgb(${t[0]} / 0.12); border-color: rgb(${t[0]} / 0.35); box-shadow: 0 0 20px rgb(${t[0]} / 0.15);">
            ${s.icon}
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] mono px-1.5 py-0.5 rounded bg-dark-base/90 border border-dark-border text-dark-muted font-bold">${s.code}</span>
              <span class="text-[10px] mono px-2 py-0.5 rounded font-semibold" style="background:rgb(${t[0]} / .14); color:rgb(${t[0]})">${statusLabel}</span>
            </div>
            <h3 class="font-extrabold text-lg sm:text-xl text-white group-hover:text-brand-400 transition mt-0.5">${esc(s.name[ar ? 1 : 0])}</h3>
          </div>
        </div>

        <!-- Mastery Pill -->
        <div class="text-end">
          <span class="text-sm mono px-2.5 py-1 rounded-lg font-extrabold inline-block border" style="background:rgb(${t[0]} / .15); color:rgb(${t[0]}); border-color:rgb(${t[0]} / .3)">
            ${s.ready ? m + '%' : (ar ? 'قريبًا' : 'Soon')}
          </span>
        </div>
      </div>

      <!-- C++ Header Include Badge -->
      <div class="mb-2.5 relative z-10 flex items-center justify-between gap-2 bg-dark-base/80 border border-dark-border/80 rounded-lg px-3 py-1.5 mono text-xs">
        <div class="truncate">
          <span class="text-purple-400 font-semibold">#include</span>
          <span class="text-amber-300 font-semibold"> &lt;${esc(s.header)}&gt;</span>
        </div>
        <span class="text-[11px] text-dark-muted shrink-0">${s.lecCount.trim()} ${ar ? 'محاضرات' : 'Lecs'}</span>
      </div>

      <!-- Module Technical Description -->
      <p class="text-xs text-dark-muted mb-4 line-clamp-2 relative z-10 leading-relaxed">
        ${esc(s.desc[ar ? 1 : 0])}
      </p>

      <!-- Progress Bar & Action Footer -->
      ${s.ready ? `
      <div class="relative z-10">
        <div class="flex items-center justify-between text-[11px] mono text-dark-muted mb-1.5">
          <span>${ar ? 'مؤشر الإتقان' : 'MASTERY_INDEX'}</span>
          <span class="group-hover:text-white transition flex items-center gap-1 font-semibold" style="color:rgb(${t[0]})">
            <span>${ar ? 'فتح المقرر' : 'EXECUTE'}</span>
            <span class="inline-block transition-transform ${ar ? 'group-hover:-translate-x-1' : 'group-hover:translate-x-1'}">${ar ? '←' : '→'}</span>
          </span>
        </div>
        <div class="h-2 bg-dark-base rounded-full overflow-hidden border border-dark-border/60 p-0.5">
          <div class="h-full rounded-full transition-all duration-500 progress-shimmer" style="width:${Math.max(m, 4)}%; background:rgb(${t[0]}); box-shadow: 0 0 10px rgb(${t[0]})"></div>
        </div>
      </div>` : ''}
    </${close}>`;
  }).join('');

  document.getElementById('app').innerHTML = `<div class="fade space-y-6">

    <!-- HERO SECTION: Interactive Cyber Terminal & Telemetry Matrix -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">

      <!-- Main Terminal Box (8 Columns on Desktop) -->
      <div class="lg:col-span-8 rounded-2xl bg-dark-surface/90 backdrop-blur-xl border border-brand-500/40 shadow-2xl relative overflow-hidden flex flex-col justify-between">
        <!-- Terminal Window Top Bar -->

// Mouse Spotlight Effect on Cyber Cards
function bindSpotlightCards() {
  const cards = document.querySelectorAll('.cyber-card');
  cards.forEach(card => {
    card.addEventListener('mousemove', e => {
      const rect = card.getBoundingClientRect();
      card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
      card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
    });
  });
}

// Filter & Search Handlers
function setFilter(cat) {

function handleSearch(val) {
  searchQuery = val;
  const cursorPos = document.getElementById('moduleSearch')?.selectionStart || val.length;
  render();
  const input = document.getElementById('moduleSearch');
  if (input) {
    input.focus();

// Interactive Terminal Commands
function handleCliSubmit(e) {
  e.preventDefault();
  const input = document.getElementById('cliInput');
  if (!input || !input.value.trim()) return;
  const cmd = input.value.trim();
  input.value = '';
  runCommand(cmd);
}

function runCommand(rawCmd) {
  const cmd = rawCmd.trim().toLowerCase();
  const stats = getStats();

  if (cmd === 'clear' || cmd === 'cls') {
    terminalHistory = [];
    renderCliHistory();
    return;
  }

  let response = '';
  if (cmd === 'help') {
    response = `Available commands: <span class="text-brand-400">ls</span> (list modules), <span class="text-brand-400">open [id]</span> (e.g. open prg, open it, open mth), <span class="text-brand-400">stats</span>, <span class="text-brand-400">theme [orange|cyan|emerald|violet]</span>, <span class="text-brand-400">lang</span>, <span class="text-brand-400">clear</span>`;
  } else if (cmd === 'ls' || cmd === 'ls -la' || cmd === 'dir') {
    response = SUBJECTS.map(s => `<a href="${esc(s.file)}" class="text-sky-400 hover:underline mr-3">[${s.id}] ${esc(s.header)}</a>`).join(' ');
  } else if (cmd === 'stats' || cmd === 'status') {
    response = `KERNEL: ARCH_IT_v2.6 | MODULES: ${stats.totalModules} | LECTURES: ${stats.totalLectures} | OVERALL_MASTERY: ${stats.avgMastery}%`;
  } else if (cmd === 'lang') {
    toggleLanguage();
    return;
  } else if (cmd.startsWith('theme ')) {
    const t = cmd.replace('theme ', '').trim();
    if (['orange','cyan','emerald','violet'].includes(t)) {
      setAccent(t);
      response = `HUD theme switched to [${t.toUpperCase()}].`;
    } else {
      response = `Unknown theme. Choose: orange, cyan, emerald, violet`;
    }
  } else if (cmd.startsWith('open ') || cmd.startsWith('cd ')) {
    const target = cmd.split(' ')[1];
    const found = SUBJECTS.find(s => s.id.toLowerCase() === target || s.header.toLowerCase().startsWith(target));
    if (found) {
      response = `Executing ${esc(found.file)}...`;
      terminalHistory.push({ cmd: rawCmd, res: response });
      renderCliHistory();
      setTimeout(() => { window.location.href = found.file; }, 300);
      return;
    } else {
      response = `Module '${esc(target)}' not found. Type <span class="text-brand-400">ls</span> for module IDs.`;
    }
  } else if (cmd === 'whoami') {
    response = `root // Future Senior IT Engineer & Cybersecurity Specialist`;
  } else {
    response = `zsh: command not found: ${esc(rawCmd)}. Type <span class="text-brand-400">help</span> for commands.`;
  }

  terminalHistory.push({ cmd: rawCmd, res: response });
  if (terminalHistory.length > 6) terminalHistory.shift();
  renderCliHistory();
}

function renderCliHistory() {
  const box = document.getElementById('cliOutput');
  if (!box) return;
  if (terminalHistory.length === 0) {
    box.classList.add('hidden');
    box.innerHTML = '';
    return;
  }
  box.classList.remove('hidden');
  box.innerHTML = terminalHistory.map(item => `
    <div>
      <span class="text-brand-500 font-bold">$ ${esc(item.cmd)}</span>
      <div class="text-slate-300 ps-3">${item.res}</div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

// Typewriter Effect (Preserves original spirit + smooth non-buggy dual index)
let typingInterval;
function startTypewriter(isAr) {
  const el = document.getElementById('typed-text');
  const els = document.getElementById('typed-semester');
  if (!el || !els) return;

  const texts = isAr ? [
    '// تقنية معلومات فوووق ⚡',
    '// ونبيس عمك 🏴‍☠️',
    '// احضر بلاك كلوفر اول و امشي أقراااا%'
  ] : [
    '// IT Top on University !! ⚡',
    '// One Piece your uncle 🏴‍☠️',
    '// Prepare for final exams and قوم أقري'
  ];

  const texts_s = isAr ? [
    '// السمستر الافتراضي: 2 الثاني',
    '// الخطة الدراسية نشطة [8 مقررات]',
    '// اختر السمستر للمتابعة'
  ] : [
    '// Default Semester: 2 [Active]',
    '// Study plan active [8 Modules]',
    '// Select semester to proceed'
  ];

  let textIdx = 0, charIdx = 0, isDeleting = false, pauseTicks = 0;

  clearInterval(typingInterval);
  typingInterval = setInterval(() => {
    const currentText = texts[textIdx];
    const currentText_s = texts_s[textIdx];
    const maxLen = Math.max(currentText.length, currentText_s.length);

    if (pauseTicks > 0) {
      pauseTicks--;
      return;
    }

    if (!isDeleting) {
      charIdx++;
      el.textContent = currentText.substring(0, charIdx);
      els.textContent = currentText_s.substring(0, charIdx);
      if (charIdx >= maxLen) {
        isDeleting = true;
        pauseTicks = 28; // Pause before deleting
      }
    } else {
      charIdx--;
      el.textContent = currentText.substring(0, charIdx);
      els.textContent = currentText_s.substring(0, charIdx);
      if (charIdx <= 0) {
        isDeleting = false;
        textIdx = (textIdx + 1) % texts.length;
        pauseTicks = 6;
      }
    }
  }, 55);
}

function toggleLanguage() {
  lang = lang === 'ar' ? 'en' : 'ar';
  saveState(c => { c.lang = lang; });

document.getElementById('langBtn').onclick = toggleLanguage;

// Interactive Network Topology Canvas with Mouse Node Connection
(function networkBackground(){
  const canvas = document.getElementById('netCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['249,115,22','56,189,248'];
  let w, h, particles = [], rafId = null;
  let mouse = { x: -9999, y: -9999 };

  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mouseleave', () => {
    mouse.x = -9999;
    mouse.y = -9999;
  });

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function initParticles(){
    const density = reduceMotion ? 0 : Math.min(70, Math.round((w * h) / 21000));
    particles = Array.from({length: density}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
    }));
  }

  function step(){
    ctx.clearRect(0, 0, w, h);
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > w) p.vx *= -1;
      if(p.y < 0 || p.y > h) p.vy *= -1;
    }
    for(let i = 0; i < particles.length; i++){
      const a = particles[i];
      ctx.beginPath();
      ctx.arc(a.x, a.y, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(148,163,184,.55)';
      ctx.fill();

      // Connect to mouse cursor if nearby
      const mdx = a.x - mouse.x, mdy = a.y - mouse.y;
      const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mDist < 160) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.strokeStyle = `rgba(249,115,22,${0.32 * (1 - mDist / 160)})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      for(let j = i + 1; j < particles.length; j++){
        const b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < 130){
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(${colors[(i + j) % 2]},${0.16 * (1 - dist / 130)})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
  }

  function loop(){ step(); rafId = requestAnimationFrame(loop); }
  function start(){ if(!rafId && !reduceMotion) rafId = requestAnimationFrame(loop); }
  function stop(){ if(rafId){ cancelAnimationFrame(rafId); rafId = null; } }

  window.addEventListener('resize', () => { resize(); initParticles(); });
  document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });

  resize();
  initParticles();
  if(reduceMotion){ step(); } else { start(); }
})();
</script>
