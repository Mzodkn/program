<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>امتحان Introduction to Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF0F6;--sheet:#FFFFFF;--ink:#16233F;--ink2:#51607C;--line:#D2D9E6;--pencil:#2F4FA2;--pencil-soft:#E4EAF9;--ok:#1B7A4B;--ok-soft:#E0F4E8;--bad:#B42318;--bad-soft:#FCE6E3;--mark:#FFE766;--margin:#E3A8A1;
--ui:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.65}
.wrap{max-width:800px;margin:0 auto;padding:22px 16px 80px}
h1,h2,h3,h4,p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--pencil);outline-offset:2px}
.en{font-family:var(--serif);unicode-bidi:isolate}
.muted{color:var(--ink2);font-size:15px}

/* hero */
.hero{padding:18px 2px 14px}
.hero h1{font-size:clamp(26px,5.4vw,38px);line-height:1.3;font-weight:700;letter-spacing:0}
.hero h1 .en{font-weight:600;white-space:nowrap}
.hero p{margin-top:8px;color:var(--ink2);max-width:560px}

/* panels */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px}
.panel h2{font-size:19px;font-weight:700;line-height:1.4}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel>h2{margin-bottom:6px}
.demo .muted{margin-bottom:14px}
.demo .q{margin-bottom:0}
.link{background:none;border:0;padding:6px 8px;color:var(--pencil);cursor:pointer;font-weight:600;border-radius:8px}
.link:hover{background:var(--pencil-soft)}
.presets{display:flex;gap:2px}

/* mode */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mode{position:relative;cursor:pointer}
.mode input{position:absolute;opacity:0;inset:0}
.mc{display:block;border:1.8px solid var(--line);border-radius:12px;padding:14px;height:100%}
.mc b{display:block;font-size:17px}
.mc span{display:block;color:var(--ink2);font-size:14.5px;line-height:1.55;margin-top:2px}
.mode input:checked+.mc{border-color:var(--pencil);background:var(--pencil-soft)}
.mode input:focus-visible+.mc{outline:2.5px solid var(--pencil);outline-offset:2px}
.timer{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.timer[hidden]{display:none}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--pencil)}
.mins{display:flex;gap:8px;align-items:center}
.mins input{width:78px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;text-align:center}

/* chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;text-align:start;gap:0;padding:9px 12px;border:1.8px solid var(--line);background:#fff;border-radius:11px;cursor:pointer;line-height:1.4}
.chip .cl{font-weight:700;font-size:14.5px}
.chip .ce{font-size:13.5px;color:var(--ink2);font-family:var(--serif);text-align:left}
.chip.on{border-color:var(--pencil);background:var(--pencil-soft)}
.chip:hover{border-color:var(--pencil)}

/* counters */
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rl .ar{font-weight:700}
.rl .en{font-size:14.5px;color:var(--ink2);line-height:1.35}
.rl .hint{font-size:13.5px;color:var(--ink2);margin-top:2px}
.step{display:flex;align-items:center;flex:none}
.step button{width:40px;height:40px;border:1.8px solid var(--line);background:#fff;font-size:20px;cursor:pointer;line-height:1}
.step button:first-child{border-radius:10px 0 0 10px;border-right:0}
.step button:last-child{border-radius:0 10px 10px 0;border-left:0}
.step button:hover:not(:disabled){background:var(--pencil-soft)}
.step button:disabled{opacity:.35;cursor:default}
.step input{width:58px;height:40px;text-align:center;border:1.8px solid var(--line);background:#fff;border-radius:0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.total{margin-top:6px;padding-top:12px;border-top:1px solid var(--line);font-size:17px}
.total b{font-size:20px}
.startbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* buttons */
.btn{border:0;border-radius:11px;padding:11px 20px;font-weight:700;cursor:pointer;font-size:16px;line-height:1.3}
.btn.primary{background:var(--pencil);color:#fff}
.btn.primary:hover:not(:disabled){background:#243F87}
.btn.ghost{background:#fff;color:var(--ink);border:1.8px solid var(--line)}
.btn.ghost:hover{border-color:var(--pencil)}
.btn.big{padding:13px 34px;font-size:18px}
.btn.sm{padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}

/* question card (the exam paper) */
.q{display:grid;grid-template-columns:58px minmax(0,1fr);direction:ltr;background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden;text-align:left}
.q .no{border-right:1.5px solid var(--margin);padding:16px 2px;text-align:center;font-family:var(--serif);font-weight:600;color:var(--ink2);background:#F8FAFD;font-size:15px;line-height:1.3}
.q .body{padding:16px 18px 16px}
.stem{font-family:var(--serif);font-size:19.5px;line-height:1.5;margin-bottom:14px}
.stem b{font-weight:700}
.opts{display:grid;gap:6px}
.opts.tf{display:flex;gap:26px;flex-wrap:wrap}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 8px;cursor:pointer;font-family:var(--ui);font-size:16px;line-height:1.5}
.opts.tf .opt{width:auto;font-size:18px;align-items:center}
.opt:hover:not(:disabled){background:var(--pencil-soft)}
.opt:disabled{cursor:default}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.8px solid var(--ink2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:1px;font-family:var(--ui)}
.otxt{position:relative;display:inline-block;padding:2px 12px;margin:0 4px}
.opt.sel .bub{background:var(--pencil);border-color:var(--pencil);color:#fff}
.opt.sel{color:var(--pencil)}
.opt.ok{background:var(--ok-soft)}
.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad-soft)}
.opt.bad .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{color:inherit}
.ring{position:absolute;left:-8px;top:-5px;width:calc(100% + 16px);height:calc(100% + 10px);overflow:visible;pointer-events:none;animation:draw .38s ease-out both}
.ring path{fill:none;stroke:var(--pencil);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.opt.ok .ring path{stroke:var(--ok)}
.opt.bad .ring path{stroke:var(--bad)}
@keyframes draw{from{clip-path:inset(-10px 100% -10px -10px)}to{clip-path:inset(-10px -10px -10px -10px)}}

/* feedback */
.fb{margin-top:12px;border-radius:10px;font-size:15.5px;direction:rtl;text-align:right;line-height:1.7}
.fb:empty{display:none}
.fb.ok,.fb.bad{padding:10px 14px}
.fb.ok{background:var(--ok-soft);color:#0E4D2E}
.fb.bad{background:var(--bad-soft);color:#7A1A12}
.fb .en{font-size:16.5px;text-align:left}
.fb .corr{margin-top:2px}
.fb .exp{margin-top:6px;direction:ltr;text-align:left}
.fb mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:3px;display:inline}

/* word bank + fills */
.bank{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1.8px dashed var(--ink2);border-radius:10px;margin-bottom:14px;background:#FBFCFE}
.bank .bt{font-weight:700;font-size:14px;color:var(--ink2);margin-right:4px;font-family:var(--ui)}
.bank .w{padding:3px 11px;border-radius:999px;background:var(--pencil-soft);font-family:var(--serif);font-size:16.5px}
.fills{margin:0;padding-left:26px;display:grid;gap:12px;font-family:var(--serif);font-size:18px;line-height:2}
.blank{font-family:var(--ui);font-size:15.5px;min-width:130px;max-width:100%;padding:5px 8px;margin:0 4px;border:1.8px solid var(--ink2);border-radius:8px;background:#fff;color:var(--ink)}
.blank.ok{border-color:var(--ok);background:var(--ok-soft)}
.blank.bad{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-family:var(--ui);font-size:14.5px;color:var(--bad);margin-left:4px;direction:rtl;display:inline-block}
.fix b{font-family:var(--serif);font-size:16px}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.match h4{font-family:var(--ui);font-size:14px;color:var(--ink2);margin-bottom:8px;border-bottom:1.5px solid var(--line);padding-bottom:4px}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;font-family:var(--serif);font-size:17px;line-height:1.4}
.mn{flex:none;width:24px;font-weight:600;color:var(--ink2)}
.mt{flex:1 1 120px}
.mrow .blank{min-width:64px;margin:0}
.brow{display:flex;gap:10px;margin-bottom:10px;font-family:var(--serif);font-size:17px;line-height:1.4}
.bl{flex:none;width:24px;font-weight:700;color:var(--pencil);font-family:var(--ui)}

/* section headings */
.sechead{margin:22px 0 12px}
.sechead h2{font-family:var(--serif);font-size:22px;font-weight:700}
.sechead .en{margin-top:2px;color:var(--ink2);font-size:16.5px}
.sechead .ar{font-size:14.5px;color:var(--ink2);margin-top:2px}
.sechead .rng{white-space:nowrap}
.paperhead{border-bottom:2px solid var(--ink);padding-bottom:8px;margin-top:6px}
.paperhead h1{font-family:var(--serif);font-size:28px}
.paperhead p{font-family:var(--serif);color:var(--ink2)}

/* practice + exam chrome */
.ptop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:15px}
.ptxt{color:var(--ink2)}
.prog{height:8px;background:#DCE2EE;border-radius:99px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--pencil);border-radius:99px;transition:width .3s}
.prog.low span{background:var(--bad)}
.exambar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(237,240,246,.96);backdrop-filter:blur(6px);padding:10px 2px;margin:0 0 6px;border-bottom:1px solid var(--line)}
.ec{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;font-weight:600}
.etime{font-variant-numeric:tabular-nums}
.etime.low{color:var(--bad)}
.exambar .btn{flex:none}

/* results */
.rhero{text-align:center;padding:14px 0 8px}
.rhero h1{font-size:24px}
.grade{position:relative;display:inline-block;margin:20px 22px 10px;padding:4px 26px}
.gnum{font-family:var(--serif);font-size:62px;font-weight:600;line-height:1.2;color:var(--bad)}
.gnum small{font-size:30px;color:var(--ink2);font-weight:400}
.grade .ring{left:0;top:-4px;width:100%;height:calc(100% + 8px);animation-duration:.7s;animation-delay:.2s}
.grade .ring path{stroke:var(--bad);stroke-width:3.2}
.pct{font-size:20px;font-weight:700;margin-bottom:4px}
.brw{margin:12px 0}
.bt2{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin-bottom:5px}
.review{margin-top:22px}
.seg{display:flex;border:1.8px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--pencil);color:#fff}

@media (max-width:640px){
 .modes{grid-template-columns:1fr}
 .match{grid-template-columns:1fr}
 .q{grid-template-columns:44px minmax(0,1fr)}
 .q .body{padding:14px 12px}
 .stem{font-size:18px}
 .row{align-items:flex-start;flex-direction:column;gap:8px}
 .exambar .btn{font-size:14px;padding:8px 12px}
 .fills{padding-left:20px;font-size:17px}
 .blank{min-width:110px}
}
@media (prefers-reduced-motion:reduce){
 .ring{animation:none}
 .prog span{transition:none}
}

.stem[hidden]{display:none}

</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const LEC=[null,
 {ar:"المحاضرة 1",en:"Introduction to Business"},
 {ar:"المحاضرة 2",en:"Forms of Business Ownership"},
 {ar:"المحاضرة 3",en:"Business Ethics and Social Responsibility"},
 {ar:"المحاضرة 4",en:"Business in a Global Environment"},
 {ar:"المحاضرة 5",en:"Entrepreneurship and Starting a Business"},
 {ar:"المحاضرة 6",en:"Management and Human Resource Management"},
 {ar:"المحاضرة 7",en:"Marketing and Operations Management"},
 {ar:"المحاضرة 8",en:"Accounting, Finance, and IT in Business"}];

/* [lecture, statement, isTrue, correction] */
const TF=[
[1,"A business produces goods or services to satisfy customer needs and generate profit.",true],
[1,"Goods are intangible activities provided to customers.",false,"Goods are tangible products; services are the intangible activities."],
[1,"Cloud hosting is an example of a service.",true],
[1,"Profit = Revenue − Expenses.",true],
[1,"Information resources include data and software.",true],
[1,"Employees and company culture belong to the external environment.",false,"Employees, company culture, technology systems and management are the internal environment."],
[1,"Government regulations and competitors are part of the external environment.",true],
[1,"During economic recessions, customers may reduce spending on technology products.",true],
[1,"Suppliers provide the materials, equipment, or services a business needs.",true],
[1,"Retail businesses produce physical goods.",false,"Manufacturing businesses produce physical goods; retail businesses sell products directly to customers."],
[1,"Inflation, unemployment, and interest rates are examples of the economic environment.",true],
[1,"Profit is the main financial goal of most businesses.",true],
[1,"Cloud computing and blockchain are examples of technologies businesses invest in to promote innovation.",true],

[2,"A sole proprietorship is owned and managed by one individual.",true],
[2,"In a sole proprietorship, the owner has limited liability.",false,"The sole proprietor has unlimited liability and is personally responsible for all debts."],
[2,"A corporation is a legal entity separate from its owners.",true],
[2,"Ownership of a corporation is represented by shares of stock.",true],
[2,"In the comparison table, a partnership has limited liability.",false,"Partnership: unlimited liability. Corporation and LLC: limited liability."],
[2,"An LLC combines features of both partnerships and corporations.",true],
[2,"The owners of an LLC are called shareholders.",false,"LLC owners are called members; corporation owners are shareholders."],
[2,"Possible double taxation is a disadvantage of a corporation.",true],
[2,"In a limited partnership, some partners invest money but do not participate in management.",true],
[2,"A corporation is the easiest form of business ownership to set up.",false,"A corporation is complex and expensive to establish; a sole proprietorship is the easiest."],
[2,"A sole proprietorship usually requires less capital to start.",true],
[2,"Corporations are often preferred when startups plan to raise large investments.",true],
[2,"A corporation is managed by a board of directors.",true],
[2,"In a general partnership, all partners share management responsibilities and liabilities.",true],

[3,"Business ethics refers to the moral principles and standards that guide behavior in business.",true],
[3,"False advertising is an example of ethical behavior.",false,"False advertising is unethical; honest advertising is ethical."],
[3,"The first step in ethical decision making is to make a decision.",false,"The first step is to identify the problem."],
[3,"Review the Outcome is the last step in ethical decision making.",true],
[3,"Philanthropic responsibility means contributing to society through donations or community support.",true],
[3,"Legal responsibility means doing what is right beyond legal requirements.",false,"That is ethical responsibility. Legal responsibility means following laws and regulations."],
[3,"Data centers and electronic waste are ways IT companies affect the environment.",true],
[3,"Bias in algorithms is an ethical concern related to artificial intelligence.",true],
[3,"Illegal copying of software is unethical and illegal.",true],
[3,"Corporate social responsibility means businesses should focus only on profit.",false,"CSR means businesses should also consider social impact, environmental impact, and ethical responsibilities."],
[3,"Collecting user data without consent is a data privacy issue.",true],
[3,"Unethical behavior can lead to loss of trust, legal penalties, and business failure.",true],
[3,"Economic responsibility means being profitable and sustainable.",true],

[4,"Globalization is the process by which businesses and economies become connected and integrated across the world.",true],
[4,"Exports are goods and services purchased from other countries.",false,"Exports are sold to other countries; imports are purchased from other countries."],
[4,"Tariffs and taxes are trade restrictions that create challenges for international trade.",true],
[4,"A multinational company operates in more than one country.",true],
[4,"Technology is not considered a driver of globalization.",false,"Technology (internet, cloud computing) is a key driver of globalization."],
[4,"Cultural differences can affect attitudes toward time, deadlines, and teamwork.",true],
[4,"Outsourcing can lead to job displacement in some regions.",true],
[4,"Global markets usually have low competition.",false,"Global markets are characterized by high competition."],
[4,"Economies of scale is an advantage of multinational companies.",true],
[4,"Digital products such as mobile apps can be sold globally without physical distribution.",true],
[4,"Access to talent from different countries is a positive impact of globalization.",true],
[4,"Currency differences and political risks are benefits of international trade.",false,"They are challenges of international trade."],

[5,"An entrepreneur is a person who starts and manages a business.",true],
[5,"Entrepreneurship involves taking risks in order to make a profit.",true],
[5,"Startups usually have unlimited initial resources.",false,"Startups have limited initial resources and high risk."],
[5,"Persistence means continuing efforts despite challenges and failures.",true],
[5,"A business plan is a written document that outlines a business idea and how it will be implemented.",true],
[5,"A business plan can help a business secure funding.",true],
[5,"Customer feedback is a source of business ideas.",true],
[5,"Startups are considered low-risk businesses.",false,"Startups have high risk and high growth potential."],
[5,"The financial plan estimates costs, revenue, and profit.",true],
[5,"The market analysis section explains how the product or service will be delivered.",false,"Market analysis is about customers and competitors; the operations plan explains delivery."],
[5,"Legal and regulatory issues are among the challenges of starting a business.",true],

[8,"A budget is a financial plan that estimates future income and expenses.",true],
[8,"Higher investments may produce higher profits but also involve higher risk.",true],
[8,"An information system combines hardware, software, data, people, and processes.",true],
[8,"Management Information Systems (MIS) handle daily transactions such as payroll.",false,"Daily transactions are handled by TPS; MIS provide reports for managers."],

/* [lecture, question, correct, wrong1, wrong2, wrong3, note] */
const MCQ=[
[1,"Which of the following is an example of a physical resource?","Equipment","Employees","Capital","Software"],
[1,"Which of the following is an example of a good?","Smartphones","Cloud hosting","Technical support","Software development"],
[1,"A software company has revenue of $50,000 and operating costs of $30,000. What is its profit?","$20,000","$80,000","$30,000","$50,000","Profit = Revenue − Expenses = 50,000 − 30,000."],

[1,"Which of the following is part of the internal business environment?","Company culture","Competitors","Government regulations","Economic conditions"],
[1,"Which of the following is part of the external business environment?","Technology trends","Employees","Management","Technology systems"],

[1,"Which stakeholder regulates business activities through laws and regulations?","Government","Suppliers","Customers","Employees"],

function buildDeck(c){

 /* true/false: keep a balanced mix */
 const tfAll=TF.filter(f), fal=shuffle(tfAll.filter(x=>!x[2])), tru=shuffle(tfAll.filter(x=>x[2]));

  const wrong=same.slice(0,2).concat(rest).slice(0,3);
  const opts=shuffle([{t:x[2],c:1}].concat(wrong.map(w=>({t:w[2]}))));
  cards.push({type:"def",lec:x[0],term:x[1],opts,correct:opts.findIndex(o=>o.c),user:null,done:false});
 });
 /* fill in the blank */
 const seen=new Set(), picked=[];
 shuffle(FILL.filter(f)).forEach(x=>{const k=norm(x[2]);if(!seen.has(k)){seen.add(k);picked.push(x)}});
 for(let s=0;s<c.n.fill;s++){
  const grp=picked.slice(s*5,s*5+5); if(grp.length<3)break;
  const gl=new Set(grp.map(g=>g[0]));
  const used=new Set(grp.map(g=>norm(g[2])));
  let extras=shuffle(FILL.filter(x=>!used.has(norm(x[2]))));
  const diff=extras.filter(x=>!gl.has(x[0]));
  const extra=(diff[0]||extras[0]||[0,0,"—"])[2];
  const bank=shuffle(grp.map(g=>g[2]).concat(extra));
  cards.push({type:"fill",lec:grp[0][0],items:grp.map(g=>({s:g[1],a:g[2],lec:g[0]})),bank,user:grp.map(()=>""),done:false});
 }
 /* matching */
 const rem={};
 MATCH.filter(f).forEach(x=>{(rem[x[0]]=rem[x[0]]||[]).push(x)});
 Object.keys(rem).forEach(k=>rem[k]=shuffle(rem[k]));
 for(let s=0;s<c.n.match;s++){
  const keys=Object.keys(rem).filter(k=>rem[k].length>0); if(!keys.length)break;
  const k=keys[s%keys.length];
  let grp=rem[k].splice(0,5);
  if(grp.length<5){for(const k2 of Object.keys(rem)){while(grp.length<5&&rem[k2].length)grp.push(rem[k2].pop())}}
  if(grp.length<3)break;
  const pool=shuffle(MATCH.filter(x=>!grp.includes(x)&&!grp.some(g=>g[2]===x[2])));
  const gl=new Set(grp.map(g=>g[0]));
  const extra=(pool.find(x=>!gl.has(x[0]))||pool[0]||[0,0,"None of these"])[2];
  const right=shuffle(grp.map(g=>g[2]).concat(extra));
  const left=shuffle(grp).map(g=>({t:g[1],lec:g[0],ri:right.indexOf(g[2])}));
  cards.push({type:"match",lec:grp[0][0],left,right,user:left.map(()=>-1),done:false});
 }
 return numberDeck(cards);
}
function ptsOf(c){return c.type==="fill"?c.items.length:c.type==="match"?c.left.length:1}
function numberDeck(cards){let n=1;cards.forEach(c=>{c.pts=ptsOf(c);c.no=n;n+=c.pts});return cards}
function itemsOf(c){
 switch(c.type){
  case "tf":return[{ok:c.user===c.ans,lec:c.lec}];
  case "mcq":case "def":return[{ok:c.user===c.correct,lec:c.lec}];
  case "fill":return c.items.map((it,i)=>({ok:norm(c.user[i])===norm(it.a),lec:it.lec}));
  case "match":return c.left.map((l,i)=>({ok:c.user[i]===l.ri,lec:l.lec}));
 }
}
const scoreOf=c=>itemsOf(c).filter(i=>i.ok).length;
function answeredOf(c){
 switch(c.type){
  case "tf":case "mcq":case "def":return c.user===null?0:1;
  case "fill":return c.user.filter(v=>v!=="").length;
  case "match":return c.user.filter(v=>v>=0).length;
 }
}

 function drawMatch(){

 }
 const weak=rows.filter(r=>r.n>=2&&r.p<1).sort((a,b)=>a.p-b.p)[0];
 if(weak)byLec.append(el("p","muted","أضعف محاضرة في هذه المحاولة: "+LEC[weak.l].ar+"."));
 root.append(byLec);

 const wrongCards=cards.filter(c=>scoreOf(c)<c.pts);
 const acts=el("div","acts");
 if(wrongCards.length){
  const r=el("button","btn primary","أعد حل الأسئلة التي أخطأت فيها ("+wrongCards.length+")");r.type="button";
  r.onclick=()=>{
   const copy=JSON.parse(JSON.stringify(wrongCards)).map(c=>{c.done=false;c.user=c.type==="fill"?c.items.map(()=>""):c.type==="match"?c.left.map(()=>-1):null;return c});
   runPractice(numberDeck(copy));
  };
  acts.append(r);
 }
 const again=el("button","btn ghost","امتحان جديد");again.type="button";again.onclick=renderSetup;
 acts.append(again);
 root.append(acts);

 const rev=el("section","review");
 const rh=el("div","ph");rh.innerHTML="<h2>مراجعة الإجابات</h2>";
 const tog=el("div","seg");
 const bAll=el("button","on","كل الأسئلة"),bWr=el("button","","الأخطاء فقط");bAll.type="button";bWr.type="button";
 tog.append(bAll,bWr);rh.append(tog);
 const list=el("div","rlist");list.dir="ltr";
 function drawList(onlyWrong){
  list.innerHTML="";
  const src=onlyWrong?wrongCards:cards;
  if(!src.length){list.append(el("p","muted","لا توجد أخطاء. أحسنت.")); list.firstChild.dir="rtl";return}
  src.forEach(c=>list.append(renderCard(c)));
 }
 bAll.onclick=()=>{bAll.className="on";bWr.className="";drawList(false)};
 bWr.onclick=()=>{bWr.className="on";bAll.className="";drawList(true)};
 drawList(false);
 rev.append(rh,list);root.append(rev);
 mount(root);
}
function barRow(label,g,n,isHtml){
 const p=Math.round(g/n*100);
 const r=el("div","brw");
 r.innerHTML='<div class="bt2"><span>'+(isHtml?label:esc(label))+'</span><b dir="ltr">'+g+"/"+n+'</b></div><div class="prog '+(p<60?"low":"")+'"><span style="width:'+p+'%"></span></div>';
 return r;
}
renderSetup();

</script>
</body>
</html>
