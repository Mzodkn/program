function buildDeck(c){
 const cards=[],L=c.lecs,f=x=>L.has(x[0]);
 const tfAll=TF.filter(f),fal=shuffle(tfAll.filter(x=>!x[2])),tru=shuffle(tfAll.filter(x=>x[2]));
 const wantF=Math.min(fal.length,Math.round(c.n.tf*0.45)),wantT=Math.min(tru.length,c.n.tf-wantF);
 let tfPick=fal.slice(0,wantF).concat(tru.slice(0,wantT));
 if(tfPick.length<c.n.tf)tfPick=tfPick.concat(fal.slice(wantF,wantF+(c.n.tf-tfPick.length)));
 shuffle(tfPick).forEach(x=>cards.push({type:"tf",lec:x[0],q:x[1],ans:x[2],exp:x[3]||"",user:null,done:false}));
 shuffle(MCQ.filter(f)).slice(0,c.n.mcq).forEach(x=>{
  const opts=shuffle([{t:x[2],c:1},{t:x[3]},{t:x[4]},{t:x[5]}]);
  cards.push({type:"mcq",lec:x[0],q:x[1],opts,correct:opts.findIndex(o=>o.c),exp:x[6]||"",user:null,done:false});
 });
 shuffle(DEF.filter(f)).slice(0,c.n.def).forEach(x=>{
  const others=shuffle(DEF.filter(d=>d!==x));
  const same=others.filter(d=>d[0]===x[0]),rest=others.filter(d=>d[0]!==x[0]);
  const wrong=same.slice(0,2).concat(rest).slice(0,3);
  const opts=shuffle([{t:x[2],c:1}].concat(wrong.map(w=>({t:w[2]}))));
  cards.push({type:"def",lec:x[0],term:x[1],opts,correct:opts.findIndex(o=>o.c),user:null,done:false});
 });
 const seen=new Set(),picked=[];
 shuffle(FILL.filter(f)).forEach(x=>{const k=norm(x[2]);if(!seen.has(k)){seen.add(k);picked.push(x)}});
 for(let s=0;s<c.n.fill;s++){
  const grp=picked.slice(s*5,s*5+5);if(grp.length<3)break;
  const gl=new Set(grp.map(g=>g[0])),used=new Set(grp.map(g=>norm(g[2])));
  const extras=shuffle(FILL.filter(x=>!used.has(norm(x[2])))),diff=extras.filter(x=>!gl.has(x[0]));
  const extra=(diff[0]||extras[0]||[0,0,"—"])[2];
  cards.push({type:"fill",lec:grp[0][0],items:grp.map(g=>({s:g[1],a:g[2],lec:g[0]})),bank:shuffle(grp.map(g=>g[2]).concat(extra)),user:grp.map(()=>""),done:false});
 }
 const rem={};
 MATCH.filter(f).forEach(x=>{(rem[x[0]]=rem[x[0]]||[]).push(x)});
 Object.keys(rem).forEach(k=>rem[k]=shuffle(rem[k]));
 for(let s=0;s<c.n.match;s++){
  const keys=Object.keys(rem).filter(k=>rem[k].length>0);if(!keys.length)break;
  let grp=rem[keys[s%keys.length]].splice(0,5);
  if(grp.length<5){for(const k2 of Object.keys(rem)){while(grp.length<5&&rem[k2].length)grp.push(rem[k2].pop())}}
  if(grp.length<3)break;
  const pool=shuffle(MATCH.filter(x=>!grp.includes(x)&&!grp.some(g=>g[2]===x[2])));
  const gl=new Set(grp.map(g=>g[0]));
  const extra=(pool.find(x=>!gl.has(x[0]))||pool[0]||[0,0,"None of these"])[2];
  const right=shuffle(grp.map(g=>g[2]).concat(extra));
  const left=shuffle(grp).map(g=>({t:g[1],lec:g[0],ri:right.indexOf(g[2])}));
  cards.push({type:"match",lec:grp[0][0],left,right,user:left.map(()=>-1),done:false});
 }
 return numberDeck(cards);
}
const ptsOf=c=>c.type==="fill"?c.items.length:c.type==="match"?c.left.length:1;

function itemsOf(c){

  let h="";
  if(c.pts===1){
   h+="<b>"+(full?T("إجابة صحيحة","Correct"):(answeredOf(c)?T("إجابة غير صحيحة","Incorrect"):T("لم تُجب عن هذا السؤال","Not answered")))+"</b>";
   if(!full){

   sh.innerHTML='<h2 class="mono text-sm font-bold text-brand-500">// Section '+String.fromCharCode(65+letter++)+": "+esc(t.sec)+'</h2><p class="text-sm text-dark-muted mt-0.5">'+esc(t.ins)+' <span class="mono text-xs whitespace-nowrap">(Q'+list[0].no+"–"+(last.no+last.pts-1)+')</span></p><p class="text-xs text-dark-muted mt-0.5" dir="rtl" style="text-align:left">'+t.secAr+"</p>";

function barRow(label,g,n,isHtml){
 const p=Math.round(g/n*100);
 const r=el("div","mb-3");
 r.innerHTML='<div class="flex justify-between gap-3 text-sm mb-1.5"><span>'+(isHtml?label:esc(label))+'</span><b class="mono text-xs" dir="ltr">'+g+"/"+n+'</b></div><div class="h-2 bg-dark-base rounded-full overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r '+(p<60?"from-red-500 to-orange-400":"from-sky-400 to-blue-500")+'" style="width:'+p+'%"></div></div>';
 return r;
}
function showResults(cards,mode){
 clearTimer();cards.forEach(c=>c.done=true);
 const all=cards.flatMap(c=>itemsOf(c).map(i=>Object.assign({type:c.type},i)));
 const total=all.length,got=all.filter(i=>i.ok).length,pct=total?Math.round(got/total*100):0;
 const msg=pct>=85?T("ممتاز. مستواك ممتاز في هذا الجزء.","Excellent. You're well prepared for this part."):pct>=70?T("جيد جدًا. راجع الأخطاء القليلة.","Very good. Review the few mistakes."):pct>=50?T("جيد. راجع الأجزاء الضعيفة قبل الامتحان.","Good. Review the weak parts before the exam."):T("تحتاج إلى مراجعة أكثر. ابدأ بالمحاضرات الأضعف أدناه.","More revision needed. Start with the weakest lectures below.");
 const root=el("div","fade");
 const hero=el("div","rounded-2xl bg-dark-surface/95 backdrop-blur border-2 border-brand-500/40 shadow-2xl p-6 mb-5 text-center");
 hero.innerHTML='<div class="mono text-xs font-bold text-brand-500 mb-2" dir="ltr">&gt; exit code: '+(pct>=50?0:1)+'</div><div class="relative inline-block my-5 px-8 py-1"><span class="mono text-6xl font-extrabold text-red-400" dir="ltr">'+got+'<small class="text-3xl text-dark-muted font-normal">/'+total+"</small></span>"+RING.replace('class="ring"','class="ring grade-ring"')+'</div><div class="text-xl font-extrabold mono">'+pct+'%</div><p class="text-sm text-dark-muted mt-1">'+msg+"</p>";
 root.append(hero);

 const byType=el("div",PANEL);byType.innerHTML='<div class="'+LABEL+'">'+T("// حسب نوع السؤال","// by question type")+"</div>";
 TYPES.forEach(t=>{const it=all.filter(i=>i.type===t.k);if(!it.length)return;byType.append(barRow(tname(t),it.filter(i=>i.ok).length,it.length))});
 root.append(byType);

 const byLec=el("div",PANEL);byLec.innerHTML='<div class="'+LABEL+'">'+T("// حسب المحاضرة","// by lecture")+"</div>";
 const rows=[];
 for(let l=1;l<=8;l++){
  const it=all.filter(i=>i.lec===l);if(!it.length)continue;
  const g=it.filter(i=>i.ok).length;rows.push({l,p:g/it.length,n:it.length});
  byLec.append(barRow(lecName(l)+': <span dir="ltr" class="text-dark-muted">'+esc(LEC[l].en)+"</span>",g,it.length,true));
 }
 const weak=rows.filter(r=>r.n>=2&&r.p<1).sort((a,b)=>a.p-b.p)[0];
 if(weak)byLec.append(el("p","mono text-xs text-amber-400 mt-2",T("// أضعف محاضرة في هذه المحاولة: ","// weakest lecture this run: ")+lecName(weak.l)));
 root.append(byLec);

 const wrong=cards.filter(c=>scoreOf(c)<c.pts);
 const acts=el("div","flex flex-wrap gap-3 mb-6");
 if(wrong.length){
  const r=el("button",BTN_P,T("أعد حل الأسئلة التي أخطأت فيها ("+wrong.length+")","Retry my mistakes ("+wrong.length+")"));r.type="button";
  r.onclick=()=>{
   const copy=JSON.parse(JSON.stringify(wrong)).map(c=>{c.done=false;c.user=c.type==="fill"?c.items.map(()=>""):c.type==="match"?c.left.map(()=>-1):null;return c});
   runPractice(numberDeck(copy));
  };
  acts.append(r);
 }
 const again=el("button",BTN_G,T("امتحان جديد","New exam"));again.type="button";again.onclick=renderSetup;acts.append(again);
 root.append(acts);

 const rh=el("div","flex flex-wrap items-center justify-between gap-2 mb-3");
 rh.innerHTML='<div class="mono text-xs font-bold text-brand-500">'+T("// مراجعة الإجابات","// answer review")+"</div>";
 const seg=el("div","flex rounded-lg overflow-hidden border border-dark-border text-xs mono font-semibold");
 const bAll=el("button","px-3 py-1.5",T("كل الأسئلة","all")),bWr=el("button","px-3 py-1.5",T("الأخطاء فقط","mistakes"));bAll.type=bWr.type="button";
 seg.append(bAll,bWr);rh.append(seg);
 const list=el("div");list.dir="ltr";
 function drawList(onlyWrong){
  bAll.className="px-3 py-1.5 "+(!onlyWrong?"bg-brand-500 text-dark-base":"bg-dark-elevated");
  bWr.className="px-3 py-1.5 "+(onlyWrong?"bg-brand-500 text-dark-base":"bg-dark-elevated");
  list.innerHTML="";
  const src=onlyWrong?wrong:cards;
  if(!src.length){list.append(el("p","text-sm text-emerald-300 mono",T("// لا توجد أخطاء. أحسنت.","// no mistakes. well done.")));return}
  src.forEach(c=>list.append(renderCard(c)));
 }
 bAll.onclick=()=>drawList(false);bWr.onclick=()=>drawList(true);drawList(false);
 root.append(rh,list);
 mount(root);view.rerender=()=>showResults(cards,mode);
}

/* ---------- language + shell ---------- */
function applyLang(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.getElementById("langBtn").textContent=lang==="ar"?"English":"العربية";
 document.getElementById("backLbl").textContent=lang==="ar"?"المركز":"Hub";
}
document.getElementById("langBtn").onclick=()=>{
 lang=lang==="ar"?"en":"ar";
 try{const c=load();c.lang=lang;localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}
 applyLang();view.rerender&&view.rerender();
};
applyLang();renderSetup();

(function networkBackground(){
 const canvas=document.getElementById("netCanvas");if(!canvas)return;
 const ctx=canvas.getContext("2d"),reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 const colors=["56,189,248","59,130,246"];let w,h,ps=[],raf=null;
 function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
 function init(){const d=reduce?0:Math.min(60,Math.round(w*h/24000));ps=Array.from({length:d},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}))}
 function step(){
  ctx.clearRect(0,0,w,h);
  for(const p of ps){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1}
  for(let i=0;i<ps.length;i++){
   const a=ps[i];ctx.beginPath();ctx.arc(a.x,a.y,1.5,0,Math.PI*2);ctx.fillStyle="rgba(148,163,184,.55)";ctx.fill();
   for(let j=i+1;j<ps.length;j++){const b=ps[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<130){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle="rgba("+colors[(i+j)%2]+","+(0.16*(1-d/130))+")";ctx.lineWidth=1;ctx.stroke()}}
  }
 }
 const loop=()=>{step();raf=requestAnimationFrame(loop)};
 const start=()=>{if(!raf&&!reduce)raf=requestAnimationFrame(loop)},stop=()=>{if(raf){cancelAnimationFrame(raf);raf=null}};
 addEventListener("resize",()=>{resize();init()});
 document.addEventListener("visibilitychange",()=>{document.hidden?stop():start()});
 resize();init();reduce?step():start();
})();
</script></body></html>
